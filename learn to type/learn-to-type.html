    this.tape = new Tape();
    return h('div', null,
      h('header', { class: 'bar' },
        h('div', { class: 'bar-l' }, h('div', { class: 'bar-title' }, plan.title), this.subEl = h('div', { class: 'bar-sub' })),
        this.dotsEl = h('div', { class: 'dots' }),
        h('div', { class: 'live' }, this.spdEl = h('span'), this.accEl = h('span'), this.clockEl = h('span', { class: 'clock' }))),
      this.stageEl = h('main', { class: 'stage' },
        this.noticeEl = h('div', { class: 'notice' }),
        plan.focus && plan.focus.length ? h('div', { class: 'focus-keys' }, t('focusOn', { keys: plan.focus.map(keyLabel).join(' ') })) : null,
        this.tape.el,
        this.hintEl = h('div', { class: 'fhint' }),
        this.progEl = h('div', { class: 'prog' }, h('i')),
        this.cardEl = h('div', { class: 'card hidden' })),
      this.kbWrap = h('div', { class: 'kbwrap' }),
      hintBar([['Esc', t('kPause')], !this.stop ? ['⌫', t('kBack')] : null]));
  },

  learned() { return this.plan.lesson ? this.plan.lesson.learned : this.course.learnedNow(); },

  mounted() {
    KB.mount(this.kbWrap);
    KB.scope(this.learned(), this.plan.newKeys);
    this.startStep();
  },

  leave() { clearInterval(this.timer); clearTimeout(this.hintTimer); KB.show(null); },

  onResize() { if (this.run) this.tape.moveTo(this.run.pos); },

  startStep() {
    clearInterval(this.timer);
    const st = this.step = this.plan.steps[this.stepIdx];
    this.run = new TypingRun(st.make(), this.stop);
    this.missedHere = false;
    this.state = 'typing';
    this.cardEl.classList.add('hidden');
    this.stageEl.classList.remove('carded');
    this.tape.el.classList.remove('hidden');
    this.tape.set(this.run.text);
    const n = this.plan.steps.length;
    this.subEl.textContent = t('s_' + st.label) + (n > 1 ? ' · ' + t('exerciseOf', { a: this.stepIdx + 1, b: n }) : '');
    this.dotsEl.replaceChildren(...(n > 1 ? this.plan.steps.map((_, i) => h('i', { class: i < this.stepIdx ? 'done' : i === this.stepIdx ? 'cur' : '' })) : []));
    this.clockEl.textContent = st.time ? fmtClock(st.time) : '';
    if (st.time) this.timer = setInterval(() => this.tick(), 200);
    this.updateLive();
    this.updateProgress();
    this.hintAt(0);
  },

  onChar(ch, e) {
    if (this.state !== 'typing' || (e && e.repeat)) return;
    if (e) this.checkEnv(e);
    const res = this.run.type(ch, performance.now());
    if (!res) return;
    const L = this.course.layout;
    if (res.first) Stats.key(this.course.prog, res.exp, res.ok, res.ms, res.got);
    const code = e && e.code && L.box[e.code] ? e.code : (L.chars[res.ok ? res.exp : ch] || {}).code;
    if (code) KB.flash(code, res.ok);
    if (res.ok) {
      Sound.click();
      this.tape.state(res.i, 'done');
      if (!res.first) this.tape.state(res.i, 'err');
      this.missedHere = false;
    } else {
      Sound.error();
      if (res.first) {
        this.misses[res.exp] = (this.misses[res.exp] || 0) + 1;
        const id = res.exp + '\u0001' + ch;
        this.conf[id] = (this.conf[id] || 0) + 1;
      }
      if (this.stop) { this.tape.miss(res.i, ch); this.missedHere = true; }
      else { this.tape.state(res.i, 'wrong'); this.tape.state(res.i, 'done'); }
    }
    if (this.step.time && this.run.text.length - this.run.pos < 90) {
      this.run.extend(this.step.more());
      this.tape.sync(this.run.text);
    }
    this.tape.moveTo(this.run.pos);
    this.updateLive();
    this.updateProgress();
    if (this.run.done) return this.finishStep();
    this.hintAt(this.run.pos);
  },

  backspace() {
    if (!this.run.back()) return;
    const i = this.run.pos;
    this.tape.state(i, 'wrong', false);
    this.tape.state(i, 'done', false);
    this.tape.moveTo(i);
    this.hintAt(i);
  },

  onKey(e) {
    const k = e.key, now = performance.now();
    if (this.guard && now < this.guard) return true;
    if (this.state === 'typing') {
      if (k === 'Escape') { this.pause(); return true; }
      if (k === 'Backspace') { this.backspace(); return true; }
      return false;
    }
    const go = k === ' ' || k === 'Enter', again = k === 'r' || k === 'R';
    if (this.state === 'paused') {
      if (go) this.resume();
      else if (again) { this.commit(this.run.result(), this.step.label, false); this.startStep(); }
      else if (k === 'Escape') this.quit();
      return true;
    }
    if (this.state === 'between') {
      if (go) { this.stepIdx++; this.startStep(); }
      else if (again) { this.results.pop(); this.startStep(); }
      else if (k === 'Escape') App.go('home');
      return true;
    }
    return true;
  },

  /* ----- hints: key highlight, finger overlay and the finger line under the tape ----- */

  hintMode(ch) {
    const m = Settings.get('hints');
    if (this.missedHere || m === 'always') return 'now';
    if (m === 'off') return 'never';
    if (this.plan.newKeys.includes(ch)) return 'now';
    const k = this.course.prog.keys[ch];
    return !k || k.n < 25 || k.er > 0.08 ? 'now' : 'delay';
  },

  hintAt(pos) {
    clearTimeout(this.hintTimer);
    const ch = this.run.text[pos];
    const mode = this.hintMode(ch);
    if (mode === 'now') return this.showHint(ch);
    this.showHint(null);
    if (mode === 'delay') this.hintTimer = setTimeout(() => {
      if (this.state === 'typing' && this.run.pos === pos) this.showHint(ch);
    }, 900);
  },

  showHint(ch) {
    KB.show(ch);
    if (ch == null) { this.hintEl.textContent = ''; return; }
    const L = this.course.layout, f = L.fingerOf(ch);
    const detail = this.missedHere || this.plan.newKeys.includes(ch);
    this.hintEl.textContent = detail ? `${charName(ch)}  ·  ${explainKey(L, ch)}` : f ? t('f_' + f) : '';
    this.hintEl.dataset.f = f ? f[1] : '';
  },

  /* ----- status ----- */

  checkEnv(e) {
    const caps = e.getModifierState && e.getModifierState('CapsLock');
    this.setNotice('caps', caps ? t('capsLock') : null);
    const lab = this.course.layout.keys[e.code];
    if (lab && /^(Key[A-Z]|Semicolon|Quote|BracketLeft)$/.test(e.code) && !e.altKey) {
      if (e.key === lab[0] || e.key === lab[1]) this.mism = 0;
      else if (++this.mism >= 3) this.setNotice('layout', t('layoutWarn'));
    }
  },

  setNotice(id, text) {
    if (text) this.notices[id] = text; else delete this.notices[id];
    this.noticeEl.textContent = Object.values(this.notices).join('   ·   ');
  },

  updateLive() {
    const r = this.run.result();
    const show = this.run.pos >= 5;
    this.spdEl.textContent = show ? fmtSpeed(r.wpm) : '';
    this.accEl.textContent = show ? fmtAcc(r.acc) : '';
  },

  updateProgress() {
    const f = this.step.time ? this.run.elapsed() / this.step.time : this.run.pos / this.run.text.length;
    this.progEl.firstChild.style.width = (clamp(f, 0, 1) * 100).toFixed(1) + '%';
  },

  tick() {
    if (this.state !== 'typing') return;
    const left = this.step.time - this.run.elapsed();
    this.clockEl.textContent = fmtClock(left);
    this.updateProgress();
    if (left <= 0 && this.run.first) this.finishStep();
  },

  pause() {
    this.state = 'paused';
    this.pausedAt = performance.now();
    clearTimeout(this.hintTimer);
    this.card(t('paused'), null, null, [['Space', t('kResume')], ['R', t('kRestart')], ['Esc', t('kQuit')]]);
  },

  resume() {
    if (this.run.first) this.run.last += performance.now() - this.pausedAt;
    this.state = 'typing';
    this.cardEl.classList.add('hidden');
    this.stageEl.classList.remove('carded');
    this.tape.el.classList.remove('hidden');
    this.hintAt(this.run.pos);
  },

  quit() {
    clearInterval(this.timer);
    const r = this.run.result();
    if (r.chars) this.commit(r, this.step.label, false);
    App.go('home');
  },

  card(title, nums, msg, keys) {
    KB.show(null);
    this.hintEl.textContent = '';
    put(this.cardEl,
      h('div', { class: 'card-title' }, title),
      nums ? h('div', { class: 'metrics' }, nums) : null,
      msg ? h('p', { class: 'card-msg' }, msg) : null,
      hintBar(keys));
    this.cardEl.classList.remove('hidden');
    this.stageEl.classList.add('carded');
    this.tape.el.classList.add('hidden');
  },

  commit(r, label, complete) {
    const prog = this.course.prog;
    Stats.addTime(prog, r.ms, r.chars);
    if (complete && r.chars >= 10) Stats.addHist(prog, label, r);
    Coach.addActive(r.ms);
    Stats.pruneConf(prog);
    Store.save();
  },

  finishStep() {
    if (this.state !== 'typing') return;
    clearInterval(this.timer);
    clearTimeout(this.hintTimer);
    this.state = 'between';
    this.guard = performance.now() + 450;
    const r = this.run.result();
    this.commit(r, this.step.label, true);
    this.results.push(r);
    if (this.stepIdx >= this.plan.steps.length - 1) return this.finishPlan();
    const msg = r.acc < 90 ? 'm_stepBad' : r.acc >= 97 ? 'm_stepGreat' : 'm_stepOk';
    this.card(t('exerciseDone', { a: this.stepIdx + 1, b: this.plan.steps.length }),
      [metric(fmtSpeed(r.wpm, false), speedUnit()), metric(fmtAcc(r.acc), t('accuracy'))],
      t(msg), [['Space', t('kContinue')], ['R', t('kRepeat')], ['Esc', t('kQuit')]]);
  },

  finishPlan() {
    const rs = this.results, sum = k => rs.reduce((s, r) => s + r[k], 0);
    const chars = sum('chars'), ms = sum('ms'), errors = sum('errors'), unc = sum('uncorrected');
    const agg = {
      chars, ms, errors,
      wpm: Math.max(0, chars - unc) / 5 / (Math.max(ms, 1000) / 60000),
      acc: chars ? ((chars - errors) / chars) * 100 : 100
    };
    Sound.done();
    const plan = this.plan, prog = this.course.prog;
    let rec = {};
    if (plan.kind === 'lesson') rec = recordLesson(this.course, plan.idx, agg);
    else if (plan.kind === 'test') {
      const prev = prog.tests[plan.minutes] || 0;
      rec = { prev, newBest: agg.acc >= 90 && agg.wpm > prev };
      if (rec.newBest) prog.tests[plan.minutes] = +agg.wpm.toFixed(1);
      Store.save();
    }
    Coach.finished(plan, this.course, rec);
    App.go('result', { plan, agg, rec, misses: this.misses, conf: this.conf });
  }
};

/* ---- js/screens/result.js ---- */
/* Results after a lesson, practice round or test, with the coach's verdict and the next step on Space. */

Screens.result = {
  render({ plan, agg, rec, misses, conf }) {
    const c = this.course = App.course;
    this.plan = plan;
    this.guard = performance.now() + 900;
    this.next = Coach.next(c);
    const nd = Coach.describe(this.next, c);
    const extra = [];
    let head, stars = null, coach;

    if (plan.kind === 'lesson') {
      const L = plan.lesson, s = rec.stars, w2 = fmtSpeed(L.tgt[0]), w3 = fmtSpeed(L.tgt[1]);
      head = s >= 1 ? t('resultLesson', { n: plan.idx + 1 }) : t('failed');
      stars = starRow(s, 'stars big');
      coach = s === 0 ? t('c_fail') : s === 3 ? t('c_three') : s === 2 ? t('c_two', { w3 }) : agg.acc < 94 ? t('c_pass', { w2 }) : t('c_slow', { w2 });
      extra.push(h('div', { class: 'req' }, t('starsNeed', { w2, w3 })));
      if (rec.newBest) extra.push(h('div', { class: 'best' }, t('newBest')));
    } else if (plan.kind === 'test') {
      head = `${t('titleTest')} · ${plan.minutes} ${LANG === 'de' ? 'Min.' : 'min'}`;
      coach = t('c_test');
      if (rec.newBest) extra.push(h('div', { class: 'best' }, t('newBest')));
      else if (rec.prev) extra.push(h('div', { class: 'req' }, t('testBest', { d: plan.minutes, v: fmtSpeed(rec.prev) })));
    } else {
      head = plan.title;
      coach = t('c_practice');
    }

    const worst = Object.entries(misses).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const typedFor = ch => {
      let best = null, n = 0;
      for (const id in conf) {
        const [e, g] = id.split('\u0001');
        if (e === ch && conf[id] > n) { best = g; n = conf[id]; }
      }
      return n >= 2 ? best : null;
    };
    const watch = worst.length
      ? h('div', { class: 'watch' }, h('div', { class: 'eyebrow' }, t('watchKeys')), worst.map(([ch, n]) => {
          const g = typedFor(ch);
          return h('div', { class: 'wk' },
            h('span', { class: 'cap', 'data-f': (c.layout.fingerOf(ch) || ' ')[1] }, keyLabel(ch)),
            h('span', null, [t('errCount', n), fingerName(c.layout, ch), g ? t('oftenTyped', { c: keyLabel(g) }) : ''].filter(Boolean).join('  ·  ')));
        }))
      : h('div', { class: 'watch clean' }, t('noErrors'));

    return h('div', null,
      h('main', { class: 'res' },
        h('div', { class: 'eyebrow' }, plan.title),
        h('h1', null, head),
        stars,
        h('div', { class: 'metrics' },
          metric(fmtSpeed(agg.wpm, false), speedUnit()), metric(fmtAcc(agg.acc), t('accuracy')), metric(fmtClock(agg.ms), t('time'))),
        extra,
        h('p', { class: 'coach' }, coach),
        watch),
      hintBar([['Space', nd.title], ['R', t('kRepeat')], ['Esc', t('kMenu')]]));
  },

  repeat() {
    const p = this.plan, c = this.course;
    if (p.kind === 'lesson') App.go('run', lessonPlan(c, p.idx));
    else if (p.kind === 'test') App.go('run', testPlan(c, p.minutes, p.source));
    else App.go('run', practicePlan(c, 'weak'));
  },

  onKey(e) {
    if (performance.now() < this.guard) return true;
    const k = e.key;
    if (k === ' ' || k === 'Enter') Coach.start(this.next, this.course);
    else if (k === 'r' || k === 'R') this.repeat();
    else if (k === 'Escape') App.go('home');
    return true;
  }
};

/* ---- js/screens/stats.js ---- */
/* Statistics: headline numbers, speed and accuracy trends, practice per day, and a per-key heatmap. */

Screens.stats = {
  render() {
    const c = this.course = App.course, prog = c.prog;
    this.mode = 'errors';
    const best = Math.max(0, ...Object.values(prog.tests));
    const recent = Stats.recentSpeed(prog);
    const hist = prog.hist.slice(-60);
    this.hist = hist;
    this.speedEl = h('div', { class: 'chart' });
    this.accEl = h('div', { class: 'chart short' });
    this.daysEl = h('div', { class: 'chart short' });
    this.kbWrap = h('div', { class: 'kbwrap small' });
    this.heatTitle = h('div', { class: 'eyebrow' });
    this.lists = h('div', { class: 'lists' });
    return h('div', null,
      h('header', { class: 'bar' }, h('div', { class: 'bar-l' }, h('div', { class: 'bar-title' }, t('statsTitle')),
        h('div', { class: 'bar-sub' }, `${t('course')} · ${t('layoutName')}`))),
      h('main', { class: 'stats' },
        h('div', { class: 'metrics wide' },
          metric(fmtDuration(Stats.totalMs(prog)), t('st_total')),
          metric(fmtDuration(Stats.today(prog)), t('st_today')),
          metric(String(Stats.streak(prog)), t('st_streak')),
          metric(`${c.passedCount()} / ${c.lessons.length}`, t('st_passed')),
          metric(recent ? fmtSpeed(recent, false) : '–', `${t('st_recent')} (${speedUnit()})`),
          metric(best ? fmtSpeed(best, false) : '–', `${t('st_bestTest')} (${speedUnit()})`)),
        hist.length < 2 ? h('p', { class: 'muted empty' }, t('noData')) : h('div', { class: 'charts' },
          h('figure', null, h('figcaption', null, t('chartSpeed', { n: hist.length })), this.speedEl),
          h('div', { class: 'charts-row' },
            h('figure', null, h('figcaption', null, t('chartAcc')), this.accEl),
            h('figure', null, h('figcaption', null, t('chartDays')), this.daysEl))),
        h('div', { class: 'heat-row' }, h('div', { class: 'heat-kb' }, this.heatTitle, this.kbWrap), this.lists)),
      hintBar([['← →', t('kToggle')], ['Esc', t('kBack')]]));
  },

  mounted() {
    KB.mount(this.kbWrap, true);
    KB.scope(this.course.learnedNow(), []);
    this.drawHeat();
    if (this.hist.length >= 2) this.drawCharts();
  },

  leave() { KB.heat(null); },

  onResize() { if (this.hist.length >= 2) this.drawCharts(); },

  drawCharts() {
    const H = this.hist, S = v => +fmtSpeed(v, false);
    const sp = H.map(x => S(x[2]));
    const top = Math.max(10, ...sp);
    lineChart(this.speedEl, sp, { min: 0, max: Math.ceil(top / 10) * 10 + (top % 10 > 7 ? 10 : 0), fmt: v => `${v} ${speedUnit()}`, tip: i => t('s_' + H[i][1]) });
    const ac = H.map(x => x[3]);
    lineChart(this.accEl, ac, { min: Math.min(80, Math.floor(Math.min(...ac) / 5) * 5), max: 100, fmt: v => fmtAcc(v), ref: 94, tip: i => t('s_' + H[i][1]) });
    const days = [];
    for (let i = 20; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const rec = this.course.prog.days[dayKey(d)];
      days.push({ label: d.toLocaleDateString(LANG === 'de' ? 'de-DE' : 'en-GB', { day: 'numeric', month: 'short' }), v: rec ? Math.round(rec.ms / 60000) : 0 });
    }
    barChart(this.daysEl, days, Settings.get('goal'));
  },

  drawHeat() {
    const c = this.course, per = Stats.perCode(c);
    const vals = {};
    const known = Object.values(per).filter(o => o.n >= 8 && o.ms).map(o => o.ms).sort((a, b) => a - b);
    const med = known.length ? known[known.length >> 1] : 0;
    for (const code in per) {
      const o = per[code];
      if (o.n < 8) continue;
      vals[code] = this.mode === 'errors' ? o.er / 0.15 : med && o.ms ? (o.ms / med - 0.8) / 1.2 : 0;
    }
    KB.heat(vals, code => {
      const o = per[code];
      if (!o) return '';
      return this.mode === 'errors' ? `${Math.round(o.er * 100)}%` : `${Math.round(o.ms)} ms`;
    });
    this.heatTitle.textContent = t(this.mode === 'errors' ? 'heatErrors' : 'heatSpeed');

    const w = Stats.weak(c, c.learnedNow());
    const letters = Object.keys(w.weights).sort((a, b) => w.weights[b] - w.weights[a]).slice(0, 6);
    const conf = Stats.topConfusions(c.prog);
    const prog = c.prog;
    put(this.lists,
      h('div', null, h('div', { class: 'eyebrow' }, t('weakest')),
        letters.length ? letters.map(ch => {
          const k = prog.keys[ch];
          return h('div', { class: 'li' }, h('span', { class: 'cap' }, keyLabel(ch)),
            h('span', null, k ? `${Math.round(k.er * 100)}% ${t('errorsLbl')} · ${Math.round(k.ms || 0)} ms` : '–'));
        }) : h('p', { class: 'muted' }, t('noData'))),
      h('div', null, h('div', { class: 'eyebrow' }, t('mixups')),
        conf.length ? conf.map(x => h('div', { class: 'li' }, h('span', { class: 'cap' }, keyLabel(x.exp)), h('span', { class: 'arrow' }, '→'),
          h('span', { class: 'cap wrong' }, keyLabel(x.got)), h('span', null, `${x.c}×`))) : h('p', { class: 'muted' }, t('noData'))));
  },

  onKey(e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === ' ') { this.mode = this.mode === 'errors' ? 'speed' : 'errors'; this.drawHeat(); }
    else if (k === 'Escape' || k === 'Enter' || k === 'Backspace') App.go('home');
    return true;
  }
};

/* ---- minimal SVG charts: one axis each, recessive grid, ink-colored marks, hover readout ---- */

function chartFrame(el) {
  const W = Math.max(200, el.clientWidth), H = Math.max(80, el.clientHeight);
  const s = svg('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  const tip = h('div', { class: 'ctip hidden' });
  el.replaceChildren(s, tip);
  return { W, H, s, tip };
}

function lineChart(el, vals, o) {
  const { W, H, s, tip } = chartFrame(el);
  const P = { l: 40, r: 44, t: 10, b: 10 };
  const x = i => P.l + (vals.length < 2 ? 0 : (i * (W - P.l - P.r)) / (vals.length - 1));
  const y = v => P.t + (1 - (v - o.min) / (o.max - o.min || 1)) * (H - P.t - P.b);
  const ticks = [o.min, (o.min + o.max) / 2, o.max];
  for (const v of ticks) {
    s.append(svg('line', { x1: P.l, x2: W - P.r, y1: y(v), y2: y(v), class: 'grid' }));
    s.append(svg('text', { x: P.l - 8, y: y(v) + 4, 'text-anchor': 'end', class: 'axis' }, String(Math.round(v))));
  }
  if (o.ref != null) s.append(svg('line', { x1: P.l, x2: W - P.r, y1: y(o.ref), y2: y(o.ref), class: 'ref' }));
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  s.append(svg('path', { d, class: 'series' }));
  const li = vals.length - 1;
  s.append(svg('circle', { cx: x(li), cy: y(vals[li]), r: 4, class: 'dot' }));
  s.append(svg('text', { x: x(li) + 8, y: y(vals[li]) + 4, class: 'val' }, String(Math.round(vals[li]))));
  const cross = svg('line', { y1: P.t, y2: H - P.b, class: 'cross hidden' });
  const hov = svg('circle', { r: 4, class: 'dot hidden' });
  s.append(cross, hov);
  s.addEventListener('mousemove', ev => {
    const r = s.getBoundingClientRect();
    const i = clamp(Math.round(((ev.clientX - r.left - P.l) / (W - P.l - P.r)) * li), 0, li);
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i));
    hov.setAttribute('cx', x(i)); hov.setAttribute('cy', y(vals[i]));
    cross.classList.remove('hidden'); hov.classList.remove('hidden');
    tip.textContent = `${o.fmt(vals[i])}  ·  ${o.tip(i)}`;
    tip.style.left = clamp(x(i) - 60, 0, W - 140) + 'px';
    tip.classList.remove('hidden');
  });
  s.addEventListener('mouseleave', () => { cross.classList.add('hidden'); hov.classList.add('hidden'); tip.classList.add('hidden'); });
}

function barChart(el, items, goal) {
  const { W, H, s, tip } = chartFrame(el);
  const P = { l: 40, r: 10, t: 10, b: 18 };
  const max = Math.max(goal, ...items.map(d => d.v), 10);
  const bw = (W - P.l - P.r) / items.length;
  const y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  for (const v of [0, max]) {
    s.append(svg('line', { x1: P.l, x2: W - P.r, y1: y(v), y2: y(v), class: 'grid' }));
    s.append(svg('text', { x: P.l - 8, y: y(v) + 4, 'text-anchor': 'end', class: 'axis' }, String(Math.round(v))));
  }
  s.append(svg('line', { x1: P.l, x2: W - P.r, y1: y(goal), y2: y(goal), class: 'ref' }));
  items.forEach((d, i) => {
    const x0 = P.l + i * bw + 1, w = Math.max(2, bw - 2), top = y(d.v), base = y(0);
    const r = Math.min(4, w / 2, base - top);
    if (d.v > 0) s.append(svg('path', {
      class: 'bar' + (i === items.length - 1 ? ' today' : ''),
      d: `M${x0},${base}V${top + r}Q${x0},${top} ${x0 + r},${top}H${x0 + w - r}Q${x0 + w},${top} ${x0 + w},${top + r}V${base}Z`
    }));
    const hit = svg('rect', { x: x0 - 1, y: P.t, width: bw, height: H - P.t - P.b, class: 'hit' });
    hit.addEventListener('mouseenter', () => {
      tip.textContent = `${d.label}  ·  ${d.v} min`;
      tip.style.left = clamp(x0 - 50, 0, W - 120) + 'px';
      tip.classList.remove('hidden');
    });
    hit.addEventListener('mouseleave', () => tip.classList.add('hidden'));
    s.append(hit);
  });
  s.append(svg('text', { x: P.l, y: H - 3, class: 'axis' }, items[0].label));
  s.append(svg('text', { x: W - P.r, y: H - 3, 'text-anchor': 'end', class: 'axis' }, items[items.length - 1].label));
}

/* ---- js/screens/settings.js ---- */
/* Settings: arrows to move and change, Enter for actions. Reset asks for a second Enter. */

const onOff = v => t(v ? 'v_on' : 'v_off');
const SETTING_ROWS = [
  { k: 'theme', opts: ['auto', 'light', 'dark'], label: v => t('v_' + v) },
  { k: 'hints', opts: ['adaptive', 'always', 'off'], label: v => t('v_' + v), help: 'h_hints' },
  { k: 'errors', opts: ['stop', 'go'], label: v => t('v_' + v), help: 'h_errors' },
  { k: 'keyboard', opts: [true, false], label: onOff },
  { k: 'hands', opts: [true, false], label: onOff },
  { k: 'colors', opts: [true, false], label: onOff },
  { k: 'sound', opts: ['off', 'errors', 'all'], label: v => t('v_' + v) },
  { k: 'size', opts: [1, 2, 3, 4], label: v => ['S', 'M', 'L', 'XL'][v - 1] },
  { k: 'length', opts: ['short', 'normal', 'long'], label: v => t('v_' + v) },
  { k: 'goal', opts: [15, 30, 45, 60, 90, 120, 180], label: v => t('v_min', { n: v }) },
  { k: 'breaks', opts: [0, 20, 30, 45, 60], label: v => (v ? t('v_every', { n: v }) : t('v_off')) },
  { k: 'unit', opts: ['wpm', 'cpm'], label: v => t('v_' + v), help: 'h_unit' },
  { k: 'unlock', opts: [false, true], label: onOff },
  { act: 'export' }, { act: 'import' }, { act: 'reset', danger: true }
];

Screens.settings = {
  render() {
    this.focus = 0;
    this.armed = false;
    this.list = h('div', { class: 'settings' });
    this.help = h('p', { class: 'shelp' });
    return h('div', null,
      h('header', { class: 'bar' }, h('div', { class: 'bar-l' }, h('div', { class: 'bar-title' }, t('settingsTitle')))),
      this.list, this.help,
      hintBar([['↑ ↓', t('kSelect')], ['← →', t('kAdjust')], ['Enter', t('kRun')], ['Esc', t('kBack')]]));
  },

  mounted() { this.draw(); },

  value(row) {
    const v = Settings.get(row.k);
    if (row.k === 'unit' && v === 'auto') return LANG === 'de' ? 'cpm' : 'wpm';
    return v;
  },

  draw() {
    this.rows = SETTING_ROWS.map((r, i) => h('div', {
      class: ['srow', r.act ? 'act' : '', r.danger ? 'danger' : '', i === this.focus ? 'focus' : ''].join(' '),
      onclick: () => { this.focus = i; r.act ? this.run(r) : this.change(1); }
    },
    h('span', { class: 'sl' }, t('set_' + (r.k || r.act))),
    h('span', { class: 'sv' }, r.act ? '↵' : r.label(this.value(r)))));
    this.list.replaceChildren(...this.rows);
    const r = SETTING_ROWS[this.focus];
    if (!this.msg) this.help.textContent = r.help ? t(r.help) : '';
    this.rows[this.focus].scrollIntoView({ block: 'nearest' });
  },

  say(msg) { this.msg = msg; this.help.textContent = msg; },

  change(dir) {
    const r = SETTING_ROWS[this.focus];
    if (r.act) return;
    const i = r.opts.indexOf(this.value(r));
    Settings.set(r.k, r.opts[(i + dir + r.opts.length) % r.opts.length]);
    this.msg = null;
    this.draw();
  },

  run(r) {
    const lang = App.course.lang;
    if (r.act === 'export') {
      const blob = new Blob([JSON.stringify(Store.data)], { type: 'application/json' });
      const a = h('a', { href: URL.createObjectURL(blob), download: `learn-to-type-${dayKey()}.json` });
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      this.say(t('exportDone'));
    } else if (r.act === 'import') {
      const inp = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0];
        inp.remove();
        if (!f) return;
        f.text().then(txt => {
          const d = JSON.parse(txt);
          if (!d || typeof d !== 'object' || !d.courses) throw new Error('bad file');
          Store.data = Store.normalize(d);
          Store.save();
          applySettings();
          this.say(t('importDone'));
          this.draw();
        }).catch(() => this.say(t('importFail')));
      });
      document.body.append(inp);
      inp.click();
    } else if (r.act === 'reset') {
      if (!this.armed) { this.armed = true; this.say(t('confirmReset')); return; }
      this.armed = false;
      Store.reset(lang);
      Coach.sess = { warm: {}, sinceBreak: 0, last: null, tries: {}, rot: 0 };
      this.say(t('resetDone'));
    }
  },

  onKey(e) {
    const k = e.key;
    const m = listMove(e, this.focus, SETTING_ROWS.length);
    if (m >= 0) { this.focus = m; this.armed = false; this.msg = null; this.draw(); }
    else if (k === 'ArrowRight') this.change(1);
    else if (k === 'ArrowLeft') this.change(-1);
    else if (k === 'Enter' || k === ' ') { const r = SETTING_ROWS[this.focus]; r.act ? this.run(r) : this.change(1); }
    else if (k === 'Escape') App.go('home');
    return true;
  }
};

/* ---- js/screens/test.js ---- */
/* Speed test setup: duration and text source. The test itself runs on the run screen without error stops. */

const TEST_DUR = [1, 2, 3, 5];
const TEST_SRC = ['sentences', 'words'];

Screens.test = {
  render() {
    this.row = 0;
    this.d = TEST_DUR.indexOf(this.lastD || 1);
    this.s = TEST_SRC.indexOf(this.lastS || 'sentences');
    this.body = h('div', { class: 'settings narrow' });
    return h('div', null,
      h('header', { class: 'bar' }, h('div', { class: 'bar-l' }, h('div', { class: 'bar-title' }, t('testTitle')))),
      this.body,
      h('p', { class: 'shelp' }, t('testInfo')),
      hintBar([['↑ ↓', t('kSelect')], ['← →', t('kAdjust')], ['Space', t('kStart')], ['Esc', t('kBack')]]));
  },

  mounted() { this.draw(); },

  draw() {
    const prog = App.course.prog, min = TEST_DUR[this.d];
    const unit = LANG === 'de' ? 'Min.' : 'min';
    const rows = [
      [t('testDuration'), `${min} ${unit}`],
      [t('testSource'), t('v_' + TEST_SRC[this.s])]
    ];
    put(this.body,
      ...rows.map(([l, v], i) => h('div', { class: 'srow' + (i === this.row ? ' focus' : '') }, h('span', { class: 'sl' }, l), h('span', { class: 'sv' }, v))),
      h('p', { class: 'muted center' }, prog.tests[min] ? t('testBest', { d: min, v: fmtSpeed(prog.tests[min]) }) : ''));
  },

  onKey(e) {
    const k = e.key;
    const m = listMove(e, this.row, 2);
    if (m >= 0) this.row = m;
    else if (k === 'ArrowRight' || k === 'ArrowLeft') {
      const dir = k === 'ArrowRight' ? 1 : -1;
      if (this.row === 0) this.d = (this.d + dir + TEST_DUR.length) % TEST_DUR.length;
      else this.s = (this.s + dir + TEST_SRC.length) % TEST_SRC.length;
    } else if (k === ' ' || k === 'Enter') {
      this.lastD = TEST_DUR[this.d];
      this.lastS = TEST_SRC[this.s];
      return App.go('run', testPlan(App.course, this.lastD, this.lastS)), true;
    } else if (k === 'Escape') return App.go('home'), true;
    this.draw();
    return true;
  }
};

/* ---- js/screens/pause.js ---- */
/* Break reminder with a five minute countdown. Space skips it at any time. */

Screens.pause = {
  render() {
    this.end = Date.now() + 5 * 60000;
    this.clock = h('div', { class: 'clock' }, '5:00');
    this.note = h('p', { class: 'muted' });
    return h('div', null,
      h('main', { class: 'brk' },
        h('div', { class: 'eyebrow' }, t('titleBreak')),
        h('h1', null, t('breakTitle')),
        this.clock,
        h('ul', null, t('breakTips').map(s => h('li', null, s))),
        this.note),
      hintBar([['Space', t('kContinue')], ['Esc', t('kMenu')]]));
  },

  mounted() {
    this.timer = setInterval(() => {
      const left = this.end - Date.now();
      this.clock.textContent = fmtClock(left);
      if (left <= 0) {
        clearInterval(this.timer);
        this.note.textContent = t('breakDone');
        Sound.done();
      }
    }, 250);
  },

  leave() { clearInterval(this.timer); Coach.sess.sinceBreak = 0; },

  onKey(e) {
    if (e.key === ' ' || e.key === 'Enter') { Coach.sess.sinceBreak = 0; Coach.go(App.course); }
    else if (e.key === 'Escape') App.go('home');
    return true;
  }
};

/* ---- js/app.js ---- */
/* Screen switching, global settings and start-up. */

const App = {
  screen: null,
  course: null,
  go(name, params) {
    if (this.screen && this.screen.leave) this.screen.leave();
    const s = Screens[name];
    const el = s.render(params);
    el.classList.add('screen', 'scr-' + name);
    $('#app').replaceChildren(el);
    this.screen = s;
    if (s.mounted) s.mounted(params);
  }
};

function applySettings() {
  const r = document.documentElement, S = Store.data.settings;
  if (S.theme === 'auto') delete r.dataset.theme;
  else r.dataset.theme = S.theme;
  r.style.setProperty('--tape-scale', [0.8, 1, 1.18, 1.36][S.size - 1] || 1);
  r.classList.toggle('no-kb', !S.keyboard);
  r.classList.toggle('no-hands', !S.hands);
  r.classList.toggle('no-colors', !S.colors);
}

/* One key unit, sized so the keyboard and the space below it fit the viewport. */
function sizeUnits() {
  const u = clamp(Math.min((innerWidth - 48) / 15.6, (innerHeight * 0.4) / 5.4), 20, 62);
  document.documentElement.style.setProperty('--ug', u.toFixed(2) + 'px');
}

Store.load();
applySettings();
sizeUnits();
Input.init();
addEventListener('resize', () => {
  sizeUnits();
  if (App.screen && App.screen.onResize) App.screen.onResize();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) Store.save(); });
App.go('select');

})();
</script>
