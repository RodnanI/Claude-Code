      return null;
    }
    r = r.replace(/\s+/g, ' ').replace(/ ([,.])/g, '$1').replace(/([,.]){2,}/g, '$1').trim();
    return r.length > 10 ? r : null;
  }

  sentences(filter) {
    if (!this._sent) this._sent = this.L.D.sentences.map(s => this.adapt(s)).filter(Boolean);
    return filter ? this._sent.filter(filter) : this._sent;
  }

  sentenceText(n, filter) {
    let pool = this.sentences(filter);
    if (pool.length < 6) pool = this.sentences();
    if (pool.length < 6) return this.mix(n);
    const used = new Set();
    return this.join(this.fill(n, () => {
      let s, tries = 0;
      do s = pick(pool); while (used.has(s) && tries++ < 20);
      used.add(s);
      return s;
    }));
  }

  /* ---------- numbers and symbols ---------- */

  digits() { return [...this.learned].filter(isDigit); }

  num(maxLen = 3) {
    const ds = this.digits();
    if (!ds.length) return '\u0000';
    const L = 1 + rand(maxLen);
    let s = '';
    for (let i = 0; i < L; i++) s += pickWeighted(ds, d => (this.fset.has(d) ? 3 : 1));
    return s.length > 1 && s[0] === '0' ? s.slice(1) : s;
  }

  numbers(n) { return this.join(this.fill(n, () => this.num(4))); }

  numctx(n) {
    const tokens = this.fill(n, () => (Math.random() < 0.45 ? this.num(3) : this.pickWord({ focus: [] }) || this.num(2)));
    return this.punctuate(tokens);
  }

  helpers() {
    const two = v => String(v).padStart(2, '0');
    const digitsOnly = s => (this.ok(s) ? s : '\u0000');
    return {
      w: () => this.pickWord({ focus: [] }) || '\u0000',
      W: () => cap(this.pickWord({ focus: [] }) || '\u0000'),
      n: () => this.num(3),
      d: () => this.num(1),
      y: () => digitsOnly(String(1900 + rand(126))),
      h: () => digitsOnly(String(1 + rand(23))),
      m: () => digitsOnly(two(rand(12) * 5)),
      c: () => pick(this.L.D.contractions),
      q: () => pick(this.L.D.qwords)
    };
  }

  context(keys, n) {
    const focus = keys.filter(k => this.learned.has(k));
    const T = this.helpers();
    const tpl = this.L.D.tpl;
    const sents = this.sentences(s => focus.some(c => s.includes(c)));
    const out = [], used = new Set();
    let len = 0, fails = 0;
    while (len < n && fails < 300) {
      let s = null;
      const fresh = sents.filter(x => !used.has(x));
      if (fresh.length && Math.random() < 0.3) { s = pick(fresh); used.add(s); }
      else {
        const c = pick(focus), list = tpl[c];
        s = list ? pick(list)(T) : this.anchor(c) + c + this.anchor(c);
      }
      if (!this.ok(s)) { fails++; continue; }
      out.push(s);
      len += s.length + 1;
      if (Math.random() < 0.3) { const w = this.pickWord({ focus: [] }); if (w) { out.push(w); len += w.length + 1; } }
    }
    return out.length ? this.join(out) : this.drill(focus, n);
  }

  /* ---------- adaptive ---------- */

  /* Weighted towards weak letters; weak digits or symbols (extra) appear in short contexts. */
  adaptive(n, extra = []) {
    const T = extra.length ? this.helpers() : null;
    const tokens = this.fill(n, () => {
      if (T && Math.random() < 0.15) {
        const c = pick(extra), list = this.L.D.tpl[c];
        const s = isDigit(c) ? this.num(3) : list ? pick(list)(T) : null;
        if (this.ok(s)) return s;
      }
      return Math.random() < 0.22 || this.pool.length < 30 ? this.pseudo(this.focus) : this.pickWord({ focus: this.focus });
    });
    return this.punctuate(tokens);
  }

  speedText(n) {
    return Math.random() < 0.5 ? this.top(n, 200) : this.sentenceText(n);
  }
}

/* ---- js/curriculum.js ---- */
/* Course structure: stages, lessons, step plans and star targets. */

const COURSE_DEFS = {
  en: [
    ['home', 'new', 'fj'], ['home', 'new', 'dk'], ['home', 'new', 'sl'], ['home', 'new', 'a;'], ['home', 'new', 'gh'], ['home', 'review'],
    ['top', 'new', 'ei'], ['top', 'new', 'ru'], ['top', 'new', 'ty'], ['top', 'new', 'wo'], ['top', 'new', 'qp'], ['top', 'review'],
    ['bottom', 'new', 'nv'], ['bottom', 'new', 'mc'], ['bottom', 'new', 'b,'], ['bottom', 'new', 'x.'], ['bottom', 'new', 'z/'], ['bottom', 'review'],
    ['caps', 'shiftL'], ['caps', 'shiftR'], ['caps', 'caps'],
    ['punct', 'new', '\'"'], ['punct', 'new', '?:'],
    ['num', 'new', '4567'], ['num', 'new', '38'], ['num', 'new', '29'], ['num', 'new', '10-'], ['num', 'review'],
    ['sym', 'new', '!@#$'], ['sym', 'new', '%^&*'], ['sym', 'new', '()_+='], ['sym', 'new', '[]{}\\|'], ['sym', 'new', '`~<>'], ['sym', 'review'],
    ['flow', 'words', 100], ['flow', 'words', 400], ['flow', 'words', 0], ['flow', 'groups'], ['flow', 'sent1'], ['flow', 'sent2'],
    ['flow', 'text'], ['flow', 'speed', 30], ['flow', 'speed', 38], ['flow', 'speed', 46], ['flow', 'speed', 55]
  ],
  de: [
    ['home', 'new', 'fj'], ['home', 'new', 'dk'], ['home', 'new', 'sl'], ['home', 'new', 'aö'], ['home', 'new', 'gh'], ['home', 'review'],
    ['top', 'new', 'ei'], ['top', 'new', 'ru'], ['top', 'new', 'tz'], ['top', 'new', 'wo'], ['top', 'new', 'qp'], ['top', 'new', 'üä'], ['top', 'review'],
    ['bottom', 'new', 'nv'], ['bottom', 'new', 'mc'], ['bottom', 'new', 'b,'], ['bottom', 'new', 'x.'], ['bottom', 'new', 'y-'], ['bottom', 'new', 'ß'], ['bottom', 'review'],
    ['caps', 'shiftL'], ['caps', 'shiftR'], ['caps', 'caps'],
    ['num', 'new', '4567'], ['num', 'new', '38'], ['num', 'new', '29'], ['num', 'new', '10'], ['num', 'review'],
    ['punct', 'new', ':;?'], ['punct', 'new', '!"\''],
    ['sym', 'new', '#+*'], ['sym', 'new', '§$%&'], ['sym', 'new', '/()='], ['sym', 'new', '@€'], ['sym', 'new', '<>|'], ['sym', 'new', '{}[]\\~'], ['sym', 'review'],
    ['flow', 'words', 100], ['flow', 'words', 400], ['flow', 'words', 0], ['flow', 'groups'], ['flow', 'sent1'], ['flow', 'sent2'],
    ['flow', 'text'], ['flow', 'speed', 30], ['flow', 'speed', 38], ['flow', 'speed', 46], ['flow', 'speed', 55]
  ]
};

const STAGES = ['home', 'top', 'bottom', 'caps', 'punct', 'num', 'sym', 'flow'];
const STAGE_TGT = { home: [8, 14], top: [10, 16], bottom: [12, 18], caps: [12, 18], punct: [12, 18], num: [9, 14], sym: [7, 12] };
const FLOW_TGT = { 'words:100': [24, 32], 'words:400': [22, 30], 'words:0': [20, 28], groups: [20, 28], sent1: [20, 28], sent2: [18, 26], text: [20, 28] };

/* Keycap style label: letters upper case, except ß whose upper case would be "SS". */
const keyLabel = c => (c === ' ' ? '␣' : isLetter(c) && c.toUpperCase().length === 1 ? c.toUpperCase() : c);

const lessonId = ([stage, type, arg]) =>
  type === 'new' ? 'new:' + arg : type === 'review' ? 'review:' + stage : arg != null ? `${type}:${arg}` : type;

function buildCourse(lang, layout) {
  const learned = new Set([' ']);
  const lessons = [];
  COURSE_DEFS[lang].forEach(([stage, type, arg], idx) => {
    let keys = [];
    if (type === 'new') keys = [...arg];
    else if (type === 'shiftL' || type === 'shiftR') {
      const want = type === 'shiftL' ? 'r' : 'l';
      keys = [...learned]
        .filter(c => isLetter(c) && !isUpper(c) && layout.chars[c.toUpperCase()] && layout.side(layout.chars[c].code) === want)
        .map(c => c.toUpperCase());
    }
    for (const k of keys) learned.add(k);
    const id = lessonId([stage, type, arg]);
    const tgt = type === 'speed' ? [arg - 8, arg] : stage === 'flow' ? FLOW_TGT[id] : STAGE_TGT[stage];
    const stageKeys = type === 'review' ? lessons.filter(l => l.stage === stage).flatMap(l => l.keys) : null;
    lessons.push({ id, idx, stage, type, arg, keys, stageKeys, learned: new Set(learned), tgt });
  });
  return lessons;
}

/* Punctuation is spoken ("B and comma"), since a bare "," inside a sentence is hard to read. */
const keyWord = c => t('keyNames')[c] || keyLabel(c);

function lessonTitle(L) {
  switch (L.type) {
    case 'new': return L.keys.length === 2 ? cap(`${keyWord(L.keys[0])} ${t('and')} ${keyWord(L.keys[1])}`) : L.keys.map(keyLabel).join(' ');
    case 'review': return t('t_review', { stage: t('stage_' + L.stage) });
    case 'shiftL': return t('t_shiftL');
    case 'shiftR': return t('t_shiftR');
    case 'caps': return t('t_caps');
    case 'words': return L.arg ? t('t_words', { n: L.arg }) : t('t_wordsAll');
    case 'groups': return t('t_groups');
    case 'sent1': return t('t_sent1');
    case 'sent2': return t('t_sent2');
    case 'text': return t('t_text');
    case 'speed': return t('t_speed', { w: fmtSpeed(L.arg) });
  }
  return '';
}

/* Short label for lesson tiles. */
function lessonGlyph(L) {
  switch (L.type) {
    case 'new': return L.keys.map(keyLabel).join(' ');
    case 'review': return '↺';
    case 'shiftL': return '⇧ ' + L.keys[0];
    case 'shiftR': return L.keys[0] + ' ⇧';
    case 'caps': return 'Aa.';
    case 'words': return L.arg ? String(L.arg) : 'abc';
    case 'groups': return LANG === 'de' ? 'sch' : 'th';
    case 'sent1': return 'Ab.';
    case 'sent2': return 'Ab, 1!';
    case 'text': return '¶';
    case 'speed': return '» ' + fmtSpeed(L.arg, false);
  }
  return '';
}

function lessonDesc(L, layout) {
  switch (L.type) {
    case 'new': return t('d_new', { list: L.keys.map(k => `${t('keyNames')[k] ? `${t('keyNames')[k]} ${k}` : keyLabel(k)} (${fingerName(layout, k)})`).join('  ·  ') });
    case 'review': return t('d_review');
    case 'shiftL': return t('d_shiftL');
    case 'shiftR': return t('d_shiftR');
    case 'caps': return t('d_caps');
    case 'words': return t('d_words');
    case 'groups': return t('d_groups');
    case 'sent1': return t('d_sent1');
    case 'sent2': return t('d_sent2');
    case 'text': return t('d_text');
    case 'speed': return t('d_speed', { w: fmtSpeed(L.arg) });
  }
  return '';
}

function fingerName(layout, ch) {
  const f = layout.fingerOf(ch);
  return f ? t('f_' + f) : '';
}

/* How to type a character: finger, movement from the home key, modifier keys. */
function explainKey(layout, ch) {
  const st = layout.strokes(ch);
  if (!st) return '';
  const main = st[0], f = main.finger;
  if (f === 'thumbs') return `${t('f_thumbs')}, ${t('dir_thumb')}`;
  const home = HOME_KEY[f];
  let dir = 'home';
  if (main.code !== home && f[1] !== 't') {
    const [hx, hy] = layout.center[home], [x, y] = layout.center[main.code];
    const dx = x - hx, dy = y - hy;
    const v = dy <= -1.5 ? 'up2' : dy <= -0.5 ? 'up' : dy >= 0.5 ? 'down' : '';
    const hz = dx >= 0.7 ? 'R' : dx <= -0.7 ? 'L' : '';
    dir = v ? v + hz : hz === 'R' ? 'right' : 'left';
  }
  let out = `${t('f_' + f)}, ${t('dir_' + dir, { home: keyLabel(layout.keys[home][0]) })}`;
  for (const m of st.slice(1)) out += ', ' + t(m.code === 'AltRight' ? 'modAltGr' : m.code === 'ShiftLeft' ? 'modShiftL' : 'modShiftR');
  return out;
}

function lengthFactor() {
  return { short: 0.7, normal: 1, long: 1.5 }[Settings.get('length')] || 1;
}

/* A plan is a titled list of steps; each step produces fresh text every time it is (re)started. */
function lessonPlan(course, idx) {
  const L = course.lessons[idx];
  const D = prepLang(course.lang).D;
  const gen = new TextGen(course.lang, course.layout, L.learned, { focus: L.keys });
  const f = lengthFactor();
  const S = (label, n, make) => ({ label, make: () => make(Math.round(n * f)) });
  const K = L.keys;
  const steps = [];

  switch (L.type) {
    case 'new': {
      const letters = K.filter(isLetter), digits = K.filter(isDigit), other = K.filter(c => !isLetter(c) && !isDigit(c));
      steps.push(S('drill', 60, n => gen.drill(K, n)));
      if (letters.length) {
        if (gen.letters.length < 7) {
          steps.push(S('pairs', 70, n => gen.pairs(letters, n)), S('drill', 70, n => gen.drill(K, n)), S('pairs', 90, n => gen.pairs(letters, n)));
        } else {
          steps.push(S('pairs', 70, n => gen.pairs(letters, n)), S('pseudo', 90, n => gen.pseudoText(letters, n)));
          if (gen.focusPoolSize(letters) >= 6) steps.push(S('words', 110, n => gen.words(n, letters)));
        }
      }
      if (digits.length) steps.push(S('numbers', 70, n => gen.numbers(n)), S('numctx', 110, n => gen.numctx(n)));
      if (other.length) {
        const label = other.every(c => PUNCT.has(c)) ? 'punct' : 'symctx';
        steps.push(S(label, 110, n => gen.context(other, n)));
        if (!letters.length && !digits.length) steps.push(S(label, 130, n => gen.context(other, n)));
      }
      if (letters.length) steps.push(S('mix', 140, n => gen.mix(n)));
      else if (!other.length) steps.push(S('numctx', 140, n => gen.numctx(n)));
      else steps.push(S('mix', 150, n => gen.join([gen.context(other, n * 0.5), digits.length ? gen.numctx(n * 0.5) : gen.mix(n * 0.5)])));
      break;
    }
    case 'review': {
      const SK = L.stageKeys;
      const weak = n => {
        const w = Stats.weak(course, L.learned, SK);
        return new TextGen(course.lang, course.layout, L.learned, { focus: w.focus, weights: w.weights }).adaptive(n);
      };
      steps.push(S('rowdrill', 80, n => gen.rowdrill(SK, n)));
      if (L.stage === 'num') steps.push(S('numbers', 90, n => gen.numbers(n)), S('numctx', 120, n => gen.numctx(n)), S('numctx', 150, n => gen.numctx(n)));
      else if (L.stage === 'sym') steps.push(S('symctx', 120, n => gen.context(SK, n)), S('symctx', 140, n => gen.context(SK, n)), S('weak', 150, weak));
      else {
        const letters = SK.filter(isLetter);
        steps.push(S('words', 120, n => gen.words(n, letters)), S('pseudo', 100, n => gen.pseudoText(letters, n)), S('weak', 120, weak), S('mix', 180, n => gen.mix(n, letters)));
      }
      break;
    }
    case 'shiftL':
    case 'shiftR':
      steps.push(S('shiftdrill', 60, n => gen.shiftdrill(K, n)), S('capwords', 100, n => gen.capwords(K, n)),
        S('capwords', 120, n => gen.capwords(K, n)), S('mix', 150, n => gen.mix(n)));
      break;
    case 'caps': {
      const U = [...L.learned].filter(isUpper);
      steps.push(S('capwords', 100, n => gen.capwords(U, n)), S('sentences', 150, n => gen.sentenceText(n)),
        S('sentences', 180, n => gen.sentenceText(n)), S('mix', 180, n => gen.mix(n)));
      break;
    }
    case 'words':
      for (let i = 0; i < 5; i++) steps.push(S('top', 150, n => gen.top(n, L.arg)));
      break;
    case 'groups':
      steps.push(S('bigrams', 100, n => gen.groupsDrill(D.bigrams, n)), S('trigrams', 100, n => gen.groupsDrill(D.trigrams, n)),
        S('groupwords', 140, n => gen.groupWords(D.bigrams.concat(D.trigrams), n)), S('groupwords', 160, n => gen.groupWords(D.trigrams, n)));
      break;
    case 'sent1':
      for (let i = 0; i < 4; i++) steps.push(S('sentences', 170, n => gen.sentenceText(n, s => s.length <= 64 && !/[0-9]/.test(s))));
      break;
    case 'sent2':
      for (let i = 0; i < 4; i++) steps.push(S('sentences', 200, n => gen.sentenceText(n)));
      break;
    case 'text':
      for (let i = 0; i < 3; i++) steps.push(S('text', 330, n => gen.sentenceText(n)));
      break;
    case 'speed':
      for (let i = 0; i < 4; i++) steps.push(S('mix', 200, n => gen.speedText(n)));
      break;
  }
  return {
    kind: 'lesson', idx, lesson: L, title: `${t('lessonN', { n: idx + 1 })} · ${lessonTitle(L)}`,
    newKeys: L.type === 'review' ? [] : K, steps
  };
}

function practicePlan(course, mode) {
  const learned = course.learnedNow();
  let restrict = null;
  if (mode === 'review') {
    const last = course.lastPassed();
    restrict = course.lessons.slice(Math.max(0, last - 2), last + 1).flatMap(l => l.keys);
    if (!restrict.length) restrict = null;
  }
  const w = Stats.weak(course, learned, restrict);
  const gen = new TextGen(course.lang, course.layout, learned, { focus: w.focus, weights: w.weights });
  const secs = mode === 'warmup' ? 90 : mode === 'review' ? 150 : Math.round(120 * lengthFactor());
  const title = t(mode === 'warmup' ? 'titleWarmup' : mode === 'review' ? 'titleReview' : 'titlePractice');
  return {
    kind: 'practice', mode, title, focus: w.focus, newKeys: [],
    steps: [{
      label: mode === 'warmup' ? 'warmup' : mode === 'review' ? 'review' : 'practice', time: secs * 1000,
      make: () => gen.adaptive(700, w.extra), more: () => gen.adaptive(300, w.extra)
    }]
  };
}

function testPlan(course, minutes, source) {
  const gen = new TextGen(course.lang, course.layout, course.learnedNow(), {});
  const make = n => (source === 'words' ? gen.top(n, 300) : gen.sentenceText(n));
  return {
    kind: 'test', minutes, source, title: t('titleTest'), newKeys: [], test: true,
    steps: [{ label: 'test', time: minutes * 60000, make: () => make(minutes * 500), more: () => make(500) }]
  };
}

/* ---- js/store.js ---- */
/* Persistence (localStorage), settings, per-course progress and per-key statistics. */

const STORE_KEY = 'learn-to-type.v1';
const DEFAULT_SETTINGS = {
  theme: 'auto', hints: 'adaptive', errors: 'stop', keyboard: true, hands: true, colors: true,
  sound: 'errors', size: 2, length: 'normal', goal: 60, breaks: 30, unit: 'auto', unlock: false
};

const Store = {
  data: null,
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { d = null; }
    this.data = this.normalize(d);
  },
  normalize(d) {
    if (!d || typeof d !== 'object') d = {};
    d.v = 1;
    d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
    d.courses = d.courses && typeof d.courses === 'object' ? d.courses : {};
    return d;
  },
  save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { /* storage unavailable */ }
  },
  progress(lang) {
    const c = this.data.courses[lang] || (this.data.courses[lang] = {});
    c.lessons = c.lessons || {};
    c.keys = c.keys || {};
    c.conf = c.conf || {};
    c.hist = c.hist || [];
    c.days = c.days || {};
    c.tests = c.tests || {};
    c.review = c.review || 0;
    return c;
  },
  reset(lang) { delete this.data.courses[lang]; this.save(); }
};

const Settings = {
  get(k) { return Store.data.settings[k]; },
  set(k, v) { Store.data.settings[k] = v; Store.save(); applySettings(); }
};

function starsFor(acc, wpm, tgt) {
  if (acc < 90) return 0;
  if (acc >= 97 && wpm >= tgt[1]) return 3;
  if (acc >= 94 && wpm >= tgt[0]) return 2;
  return 1;
}

function openCourse(lang) {
  LANG = lang;
  document.documentElement.lang = lang;
  Store.data.lastLang = lang;
  Store.save();
  const layout = makeLayout(lang);
  const lessons = buildCourse(lang, layout);
  return {
    lang, layout, lessons,
    get prog() { return Store.progress(lang); },
    rec(i) { return this.prog.lessons[lessons[i].id]; },
    stars(i) { const r = this.rec(i); return r ? r.stars : -1; },
    passed(i) { return this.stars(i) >= 1; },
    firstUnpassed() { return lessons.findIndex((_, i) => !this.passed(i)); },
    lastPassed() { for (let i = lessons.length - 1; i >= 0; i--) if (this.passed(i)) return i; return -1; },
    passedCount() { return lessons.filter((_, i) => this.passed(i)).length; },
    unlocked(i) { return i === 0 || Settings.get('unlock') || this.passed(i - 1); },
    learnedNow() { return lessons[Math.max(0, this.lastPassed())].learned; }
  };
}

const Stats = {
  /* One keystroke at a text position. ms is the flow time since the previous correct key. */
  key(prog, ch, ok, ms, got) {
    const k = prog.keys[ch] || (prog.keys[ch] = { n: 0, e: 0, er: 0, ms: 0 });
    k.n++;
    if (!ok) k.e++;
    k.er = k.er * 0.9 + (ok ? 0 : 0.1);
    if (ok && ms) k.ms = k.ms ? k.ms * 0.85 + ms * 0.15 : ms;
    if (!ok && got != null && got !== ch) {
      const id = ch + '\u0001' + got;
      prog.conf[id] = (prog.conf[id] || 0) + 1;
    }
  },

  pruneConf(prog) {
    const e = Object.entries(prog.conf);
    if (e.length < 300) return;
    prog.conf = Object.fromEntries(e.sort((a, b) => b[1] - a[1]).slice(0, 150));
  },

  addTime(prog, ms, chars) {
    const k = dayKey();
    const d = prog.days[k] || (prog.days[k] = { ms: 0, ch: 0, nl: 0 });
    d.ms += ms;
    d.ch += chars;
  },

  addHist(prog, label, r) {
    prog.hist.push([Date.now(), label, +r.wpm.toFixed(1), +r.acc.toFixed(1), Math.round(r.ms), r.chars]);
    if (prog.hist.length > 500) prog.hist.splice(0, prog.hist.length - 500);
  },

  today(prog) { return (prog.days[dayKey()] || { ms: 0 }).ms; },

  totalMs(prog) { return Object.values(prog.days).reduce((s, d) => s + d.ms, 0); },

  streak(prog) {
    const d = new Date();
    const has = x => (prog.days[dayKey(x)] || { ms: 0 }).ms >= 60000;
    if (!has(d)) d.setDate(d.getDate() - 1);
    let n = 0;
    while (has(d)) { n++; d.setDate(d.getDate() - 1); }
    return n;
  },

  /* Average speed over recent exercises with real words (drills excluded). */
  recentSpeed(prog) {
    const real = new Set(['words', 'mix', 'sentences', 'text', 'top', 'practice', 'test', 'warmup', 'review', 'weak', 'capwords', 'groupwords']);
    const r = prog.hist.filter(h => real.has(h[1]) && h[4] > 15000).slice(-10);
    return r.length ? r.reduce((s, h) => s + h[2], 0) / r.length : 0;
  },

  /* Weakness per learned letter from error rate and hesitation; top three become the focus. */
  weak(course, learned, restrict) {
    const prog = course.prog;
    const src = (restrict && restrict.length ? restrict : [...learned]).filter(c => learned.has(c) && c !== ' ');
    const letters = src.filter(c => isLetter(c) && !isUpper(c));
    const others = src.filter(c => !isLetter(c));
    const known = src.map(c => prog.keys[c]).filter(k => k && k.n >= 8 && k.ms).map(k => k.ms).sort((a, b) => a - b);
    const median = known.length ? known[known.length >> 1] : 0;
    const score = c => {
      const k = prog.keys[c];
      if (!k || k.n < 8) return 0.5;
      return clamp(k.er * 4 + (median && k.ms ? Math.max(0, k.ms / median - 1) : 0), 0, 1.5);
    };
    const weights = {};
    for (const c of letters) weights[c] = score(c);
    const focus = letters.slice().sort((a, b) => weights[b] - weights[a]).slice(0, 3);
    const extra = others.filter(c => score(c) > 0.45).sort((a, b) => score(b) - score(a)).slice(0, 2);
    return { focus, weights, extra };
  },

  /* Per physical key: merged error rate and reaction time for the heatmap. */
  perCode(course) {
    const out = {};
    const keys = course.prog.keys;
    for (const ch in keys) {
      const m = course.layout.chars[ch];
      if (!m) continue;
      const k = keys[ch], o = out[m.code] || (out[m.code] = { n: 0, e: 0, er: 0, ms: 0, w: 0 });
      o.n += k.n;
      o.e += k.e;
      o.er += k.er * k.n;
      if (k.ms) { o.ms += k.ms * k.n; o.w += k.n; }
    }
    for (const c in out) { const o = out[c]; o.er /= o.n || 1; o.ms = o.w ? o.ms / o.w : 0; }
    return out;
  },

  topConfusions(prog, n = 6) {
    return Object.entries(prog.conf).sort((a, b) => b[1] - a[1]).slice(0, n).map(([id, c]) => {
      const [exp, got] = id.split('\u0001');
      return { exp, got, c };
    });
  }
};

function recordLesson(course, idx, res) {
  const L = course.lessons[idx], prog = course.prog;
  const r = prog.lessons[L.id] || (prog.lessons[L.id] = { stars: 0, wpm: 0, acc: 0, runs: 0 });
  const stars = starsFor(res.acc, res.wpm, L.tgt);
  const prevStars = r.runs ? r.stars : -1;
  const firstPass = !(r.stars >= 1 && r.runs) && stars >= 1;
  const newBest = r.runs > 0 && res.wpm > r.wpm && stars >= 1;
  r.runs++;
  r.last = Date.now();
  if (stars > r.stars) r.stars = stars;
  if (res.wpm > r.wpm && stars >= 1) r.wpm = +res.wpm.toFixed(1);
  if (res.acc > r.acc) r.acc = +res.acc.toFixed(1);
  if (firstPass) {
    prog.review++;
    const d = prog.days[dayKey()];
    if (d) d.nl++;
  }
  Store.save();
  return { stars, prevStars, firstPass, newBest };
}

/* ---- js/coach.js ---- */
/* The coach decides what comes next, so the learner can simply keep pressing Space.
   Order of priorities: breaks, a daily warm-up, a second attempt for weak passes,
   reviews every three new lessons, the next lesson, then free practice once the course is done. */

const Coach = {
  sess: { warm: {}, sinceBreak: 0, last: null, tries: {}, rot: 0 },

  addActive(ms) { this.sess.sinceBreak += ms; },

  next(course) {
    const S = this.sess, prog = course.prog;
    const brk = Settings.get('breaks');
    if (brk && S.sinceBreak >= brk * 60000) return { type: 'break' };
    if (!S.warm[course.lang] && course.lastPassed() >= 4 && Stats.today(prog) < 60000) return { type: 'practice', mode: 'warmup' };
    if (S.last && S.last.lang === course.lang) {
      const i = S.last.idx;
      if (course.stars(i) === 1 && (S.tries[course.lang + i] || 0) < 3) return { type: 'lesson', idx: i, repeat: true };
    }
    if (prog.review >= 3) return { type: 'practice', mode: 'review' };
    const fu = course.firstUnpassed();
    if (fu >= 0) return { type: 'lesson', idx: fu };
    const r = S.rot % 3;
    if (r === 0) return { type: 'practice', mode: 'weak' };
    if (r === 1) return { type: 'test', minutes: 1 };
    let best = -1;
    course.lessons.forEach((_, i) => { if (course.stars(i) < 3 && (best < 0 || course.stars(i) < course.stars(best))) best = i; });
    return best >= 0 ? { type: 'lesson', idx: best, polish: true } : { type: 'practice', mode: 'weak' };
  },

  describe(a, course) {
    switch (a.type) {
      case 'break':
        return { title: t('titleBreak'), sub: t('n_break', { min: Math.round(this.sess.sinceBreak / 60000) }) };
      case 'practice': {
        const w = Stats.weak(course, course.learnedNow());
        const keys = w.focus.map(keyLabel).join(' ');
        if (a.mode === 'warmup') return { title: t('titleWarmup'), sub: t('n_warmup', { keys }) };
        if (a.mode === 'review') return { title: t('titleReview'), sub: t('n_review', { keys }) };
        return { title: t('titlePractice'), sub: t('n_practice') };
      }
      case 'test':
        return { title: t('titleTest'), sub: t('n_test') };
      case 'lesson': {
        const L = course.lessons[a.idx];
        const title = `${t('lessonN', { n: a.idx + 1 })} · ${lessonTitle(L)}`;
        if (a.repeat) return { title, sub: t('n_repeat', { req: `${pct(94)} · ${fmtSpeed(L.tgt[0])}` }) };
        if (a.polish) return { title, sub: t('n_polish', { n: a.idx + 1 }) };
        return { title, sub: lessonDesc(L, course.layout) };
      }
    }
    return { title: '', sub: '' };
  },

  start(a, course) {
    switch (a.type) {
      case 'break': return App.go('pause');
      case 'practice': return App.go('run', practicePlan(course, a.mode));
      case 'test': return App.go('run', testPlan(course, a.minutes || 1, 'sentences'));
      case 'lesson': return startLesson(course, a.idx);
    }
  },

  go(course) { this.start(this.next(course), course); },

  /* Called after every finished plan. */
  finished(plan, course, res) {
    const S = this.sess;
    if (plan.kind === 'lesson') {
      S.last = { lang: course.lang, idx: plan.idx };
      const k = course.lang + plan.idx;
      S.tries[k] = (S.tries[k] || 0) + 1;
      if (res.stars >= 2) S.tries[k] = 99;
    } else {
      S.last = null;
      if (plan.mode === 'warmup') S.warm[course.lang] = true;
      if (plan.mode === 'review') course.prog.review = 0;
    }
    if (course.firstUnpassed() < 0 && plan.kind !== 'lesson') S.rot++;
    else if (course.firstUnpassed() < 0 && plan.kind === 'lesson') S.rot = 0;
  }
};

/* Lessons with new keys (or the very first lesson) open with an introduction screen. */
function startLesson(course, idx) {
  const plan = lessonPlan(course, idx);
  const L = course.lessons[idx];
  if (!course.passed(idx) && (L.type === 'new' || L.type === 'shiftL' || L.type === 'shiftR')) {
    return App.go('intro', { plan, onboarding: idx === 0 && !course.rec(0) });
  }
  App.go('run', plan);
}

/* ---- js/audio.js ---- */
/* Soft synthesized sounds: a muted tick per key and a low thud for mistakes. Nothing is loaded from files. */

const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, type, gain, when = 0) {
    const c = this.ensure();
    if (!c) return;
    const t0 = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(freq * 0.8, t0 + dur);
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  },
  click() {
    if (Settings.get('sound') !== 'all') return;
    const c = this.ensure();
    if (!c) return;
    if (!this.noise) {
      const len = Math.floor(c.sampleRate * 0.03);
      this.noise = c.createBuffer(1, len, c.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
    }
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise;
    f.type = 'bandpass';
    f.frequency.value = 1800 + Math.random() * 500;
    f.Q.value = 1.2;
    g.gain.value = 0.5;
    s.connect(f).connect(g).connect(c.destination);
    s.start();
  },
  error() { if (Settings.get('sound') !== 'off') this.tone(140, 0.14, 'triangle', 0.22); },
  done() {
    if (Settings.get('sound') === 'off') return;
    this.tone(523, 0.2, 'sine', 0.07);
    this.tone(784, 0.35, 'sine', 0.06, 0.11);
  }
};

/* ---- js/keyboard.js ---- */
/* On-screen keyboard: finger zones, the next key, key presses and the statistics heatmap.
   One instance is moved between screens. */

const KB = {
  el: null, layout: null, keyEls: {}, lit: [],

  build(layout) {
    if (this.layout === layout && this.el) return this.el;
    this.layout = layout;
    this.keyEls = {};
    const keys = h('div', { class: 'kb-keys' });
    let enterSeen = false;
    for (const k of layout.geo) {
      const f = FINGER_OF[k.code] || 'rt';
      const lab = layout.keys[k.code];
      const alt = layout.altgr[k.code];
      const kids = [];
      if (lab) {
        const [b, s] = [...lab];
        if (isLetter(b) && s === b.toUpperCase()) kids.push(h('span', { class: 'm' }, s));
        else kids.push(h('span', { class: 's' }, s), h('span', { class: 'b' }, b));
        if (alt) kids.push(h('span', { class: 'a' }, alt));
      } else if (!(k.code === 'Enter' && enterSeen)) {
        kids.push(h('span', { class: 'n' }, layout.names[k.code] || ''));
      }
      const cls = ['k', 'f' + f[1]];
      if (k.code === 'KeyF' || k.code === 'KeyJ') cls.push('bump');
      if (!lab) cls.push('mod');
      if (layout.dead.includes(k.code)) cls.push('dead');
      if (k.code === 'Enter') { cls.push(enterSeen ? 'enter-bot' : 'enter-top'); enterSeen = true; }
      const el = h('div', { class: cls.join(' '), style: `--x:${k.x};--y:${k.y};--w:${k.w}` }, kids);
      (this.keyEls[k.code] = this.keyEls[k.code] || []).push(el);
      keys.append(el);
    }
    this.el = h('div', { class: 'kb' }, keys, Hands.build(layout));
    if (layout.geom === 'iso') this.el.classList.add('iso');
    return this.el;
  },

  mount(parent, small) {
    this.el.classList.toggle('small', !!small);
    this.heat(null);
    this.show(null);
    parent.append(this.el);
  },

  each(code, fn) { (this.keyEls[code] || []).forEach(fn); },

  /* Dim keys that are not part of the course yet and mark the keys this lesson introduces. */
  scope(learned, newKeys = []) {
    const L = this.layout;
    const on = new Set(['Space']);
    for (const ch of learned) {
      const m = L.chars[ch];
      if (!m) continue;
      on.add(m.code);
      if (m.shift) { on.add('ShiftLeft'); on.add('ShiftRight'); }
      if (m.altgr) on.add('AltRight');
    }
    const fresh = new Set(newKeys.map(c => L.chars[c] && L.chars[c].code).filter(Boolean));
    for (const code in this.keyEls) this.each(code, el => {
      el.classList.toggle('off', !on.has(code));
      el.classList.toggle('new', fresh.has(code));
    });
  },

  /* Highlight the keys for the next character (null clears). */
  show(ch) {
    for (const [code, cls] of this.lit) this.each(code, el => el.classList.remove(cls));
    this.lit = [];
    const st = ch != null && this.layout ? this.layout.strokes(ch) : null;
    if (st) st.forEach((s, i) => {
      const cls = i === 0 ? 'tgt' : 'hold';
      this.each(s.code, el => el.classList.add(cls));
      this.lit.push([s.code, cls]);
    });
    Hands.point(st);
  },

  flash(code, ok) {
    this.each(code, el => {
      el.classList.remove('hit', 'miss');
      void el.offsetWidth;
      el.classList.add(ok ? 'hit' : 'miss');
    });
  },

  /* values: code -> 0..1 intensity, or null to clear. */
  heat(values, label) {
    for (const code in this.keyEls) this.each(code, el => {
      const v = values ? values[code] : undefined;
      el.style.removeProperty('--heat');
      el.classList.toggle('heat', v !== undefined);
      if (v !== undefined) el.style.setProperty('--heat', Math.round(clamp(v, 0, 1) * 100) + '%');
      if (label && v !== undefined) el.title = label(code) || '';
      else el.removeAttribute('title');
    });
    this.el.classList.toggle('heatmap', !!values);
  }
};

/* Stylised hands drawn as outlines over the keyboard, fingertips on the home row.
   Units are key widths, matching the keyboard geometry. */

const HAND_L = {
  lp: { tip: [2.25, 2.82], base: [2.78, 5.05], w: 0.56 },
  lr: { tip: [3.25, 2.74], base: [3.47, 4.9], w: 0.62 },
  lm: { tip: [4.25, 2.7], base: [4.2, 4.84], w: 0.66 },
  li: { tip: [5.25, 2.78], base: [4.93, 4.9], w: 0.66 },
  lt: { tip: [6.35, 4.6], base: [5.1, 5.5], w: 0.72 }
};
const PALM_L = [[2.5, 5.1], [3.3, 4.92], [4.2, 4.86], [5.05, 4.92], [5.5, 5.35], [5.4, 6.2], [4.9, 6.9], [3.1, 6.95], [2.5, 6.1]];
const HAND_EDGE = 0.03;
const HAND_FADE = [4.85, 6.1];

const Hands = {
  svg: null, fingers: {}, hands: {}, raf: 0, layout: null,

  build(layout) {
    this.layout = layout;
    const box = { x: -1, y: -0.5, width: 17, height: 10 };
    const s = svg('svg', { class: 'hands', viewBox: '-1 -0.5 17 10', 'aria-hidden': 'true' });
    const grad = svg('linearGradient', { id: 'hfade', gradientUnits: 'userSpaceOnUse', x1: 0, y1: HAND_FADE[0], x2: 0, y2: HAND_FADE[1] },
      svg('stop', { offset: 0, 'stop-color': '#fff' }), svg('stop', { offset: 1, 'stop-color': '#000' }));
    const outer = svg('g', { fill: 'url(#hfade)', stroke: 'url(#hfade)', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const inner = svg('g', { fill: '#000', stroke: '#000', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const mask = svg('mask', { id: 'hmask', maskUnits: 'userSpaceOnUse', ...box }, outer, inner);
    const fade = svg('mask', { id: 'hfade2', maskUnits: 'userSpaceOnUse', ...box }, svg('rect', { ...box, fill: 'url(#hfade)' }));
    const skin = svg('g', { class: 'skin', mask: 'url(#hfade2)', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const hl = svg('g', { class: 'hl', mask: 'url(#hfade2)', 'stroke-linecap': 'round' });
    s.append(svg('defs', null, grad, mask, fade), skin, hl, svg('rect', { class: 'outline', ...box, mask: 'url(#hmask)' }));

    this.fingers = {};
    this.hands = {};
    for (const side of ['l', 'r']) {
      const mir = side === 'r' ? p => [13.5 - p[0], p[1]] : p => p.slice();
      const gO = svg('g'), gI = svg('g'), gH = svg('g'), gS = svg('g');
      outer.append(gO); inner.append(gI); hl.append(gH); skin.append(gS);
      const palm = PALM_L.map(mir).map(p => p.join(',')).join(' ');
      gO.append(svg('polygon', { points: palm, 'stroke-width': 0.5 + 2 * HAND_EDGE }));
      gI.append(svg('polygon', { points: palm, 'stroke-width': 0.5 }));
      gS.append(svg('polygon', { points: palm, 'stroke-width': 0.5 }));
      this.hands[side] = { groups: [gO, gI, gH, gS], cur: [0, 0], tgt: [0, 0] };
      for (const f of ['p', 'r', 'm', 'i', 't']) {
        const d = HAND_L['l' + f];
        const tip = mir(d.tip), base = mir(d.base);
        const o = svg('line', { 'stroke-width': d.w + 2 * HAND_EDGE });
        const i = svg('line', { 'stroke-width': d.w });
        const hlLine = svg('line', { 'stroke-width': d.w, class: 'f' + f });
        const sk = svg('line', { 'stroke-width': d.w });
        gO.append(o); gI.append(i); gH.append(hlLine); gS.append(sk);
        const F = { els: [o, i, hlLine, sk], hl: hlLine, home: tip, base, cur: tip.slice(), tgt: tip.slice(), side };
        this.fingers[side + f] = F;
        this.setLine(F);
      }
    }
    this.svg = s;
    return s;
  },

  setLine(F) {
    for (const el of F.els) {
      el.setAttribute('x1', F.base[0]);
      el.setAttribute('y1', F.base[1]);
      el.setAttribute('x2', F.cur[0].toFixed(3));
      el.setAttribute('y2', F.cur[1].toFixed(3));
    }
  },

  reachPoint(code) {
    const [x, y, w] = this.layout.box[code];
    if (code === 'ShiftLeft') return [x + w - 0.55, y + 0.72];
    if (code === 'ShiftRight') return [x + 0.6, y + 0.72];
    const c = this.layout.center[code];
    return [c[0], c[1] + (code === 'AltRight' ? 0.1 : 0.28)];
  },

  /* strokes: result of layout.strokes(ch), or null to return to the home row. */
  point(strokes) {
    if (!this.svg) return;
    for (const id in this.fingers) { const F = this.fingers[id]; F.tgt = F.home.slice(); F.hl.classList.remove('on'); }
    for (const s in this.hands) this.hands[s].tgt = [0, 0];
    if (strokes) strokes.forEach((k, idx) => {
      if (k.finger === 'thumbs') {
        this.fingers.lt.hl.classList.add('on');
        this.fingers.rt.hl.classList.add('on');
        return;
      }
      const F = this.fingers[k.finger];
      if (!F) return;
      const H = this.hands[F.side];
      const p = this.reachPoint(k.code);
      // Each hand drifts a little towards the first key its fingers must reach (main key or modifier).
      const first = !strokes.slice(0, idx).some(s => this.fingers[s.finger] && this.fingers[s.finger].side === F.side);
      if (first && k.finger[1] !== 't') H.tgt = [(p[0] - F.home[0]) * 0.28, (p[1] - F.home[1]) * 0.28];
      F.tgt = [p[0] - H.tgt[0], p[1] - H.tgt[1]];
      F.hl.classList.add('on');
    });
    this.animate();
  },

  lerp(a, b, k) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    if (Math.abs(dx) < 0.002 && Math.abs(dy) < 0.002) { a[0] = b[0]; a[1] = b[1]; return false; }
    a[0] += dx * k;
    a[1] += dy * k;
    return true;
  },

  animate() {
    if (this.raf) return;
    let last = performance.now();
    const step = now => {
      const k = 1 - Math.exp(-Math.min(50, now - last) / 55);
      last = now;
      let moving = false;
      for (const s in this.hands) {
        const H = this.hands[s];
        if (this.lerp(H.cur, H.tgt, k)) moving = true;
        const tr = `translate(${H.cur[0].toFixed(3)} ${H.cur[1].toFixed(3)})`;
        for (const g of H.groups) g.setAttribute('transform', tr);
      }
      for (const id in this.fingers) {
        const F = this.fingers[id];
        if (this.lerp(F.cur, F.tgt, k)) moving = true;
        this.setLine(F);
      }
      this.raf = moving ? requestAnimationFrame(step) : 0;
    };
    this.raf = requestAnimationFrame(step);
  }
};

/* ---- js/input.js ---- */
/* Keyboard input. Printable characters come from keydown (this covers Shift and AltGr).
   Dead keys and IME compositions are left to a hidden textarea and read from its input events,
   so layouts like US-International still work. Screens implement onKey(e) -> handled? and onChar(ch, e). */

const Input = {
  sink: null, dead: false, composing: false,

  init() {
    const s = this.sink = $('#sink');
    document.addEventListener('keydown', e => this.down(e), true);
    s.addEventListener('compositionstart', () => { this.composing = true; });
    s.addEventListener('compositionend', () => { this.composing = false; this.flush(); });
    s.addEventListener('input', e => { if (!this.composing && !e.isComposing) this.flush(); });
    const refocus = () => { if (document.activeElement !== s) s.focus({ preventScroll: true }); };
    document.addEventListener('mouseup', () => setTimeout(refocus, 0));
    window.addEventListener('focus', refocus);
    refocus();
  },

  down(e) {
    const s = this.sink, scr = App.screen;
    if (document.activeElement !== s) s.focus({ preventScroll: true });
    if (!scr) return;
    if (e.isComposing || e.keyCode === 229 || this.composing) return;
    if (e.key === 'Dead') { this.dead = true; return; }
    // Ctrl or Cmd shortcuts stay with the browser; AltGr (Ctrl+Alt on Windows) and Mac Option produce characters.
    const shortcut = (e.ctrlKey && !e.altKey) || e.metaKey;
    const printable = [...e.key].length === 1;
    if (!printable || shortcut) {
      if (e.key === 'Tab' || e.key === 'Backspace' || e.key === ' ') e.preventDefault();
      if (!shortcut && scr.onKey && scr.onKey(e)) e.preventDefault();
      return;
    }
    if (this.dead) { this.dead = false; return; }
    if (scr.onKey && scr.onKey(e)) { e.preventDefault(); return; }
    e.preventDefault();
    if (scr.onChar) scr.onChar(e.key, e);
  },

  flush() {
    const v = this.sink.value;
    this.sink.value = '';
    this.dead = false;
    if (!v || !App.screen || !App.screen.onChar) return;
    for (const ch of v) App.screen.onChar(ch, null);
  }
};

/* ---- js/typing.js ---- */
/* Typing engine: keystroke accounting for one exercise, plus the scrolling tape that displays it. */

const IDLE_CAP = 5000;

class TypingRun {
  constructor(text, stop) {
    this.text = text;
    this.stop = stop;
    this.pos = 0;
    this.errs = new Set();
    this.wrong = {};
    this.first = 0;
    this.last = 0;
    this.active = 0;
    this.lastOk = true;
    this.strokes = 0;
  }

  get done() { return this.pos >= this.text.length; }

  /* Active time: pauses longer than IDLE_CAP only count as IDLE_CAP. */
  elapsed(now = performance.now()) {
    return this.first ? this.active + Math.min(now - this.last, IDLE_CAP) : 0;
  }

  type(ch, now) {
    if (this.done) return null;
    if (!this.first) this.first = this.last = now;
    const gap = now - this.last;
    this.active += Math.min(gap, IDLE_CAP);
    this.last = now;
    this.strokes++;
    const i = this.pos, exp = this.text[i], first = !this.errs.has(i);
    if (ch === exp) {
      const ms = first && this.lastOk && this.strokes > 1 && gap < 3000 ? gap : 0;
      this.pos++;
      this.lastOk = first;
      return { ok: true, i, exp, first, ms };
    }
    this.errs.add(i);
    this.lastOk = false;
    if (!this.stop) { this.wrong[i] = ch; this.pos++; }
    return { ok: false, i, exp, got: ch, first };
  }

  back() {
    if (this.stop || this.pos === 0) return false;
    this.pos--;
    delete this.wrong[this.pos];
    return true;
  }

  extend(more) { this.text += ' ' + more; }

  result() {
    const n = this.pos;
    let errors = 0, uncorrected = 0;
    for (const i of this.errs) if (i < n) errors++;
    for (const i in this.wrong) if (+i < n) uncorrected++;
    const ms = Math.max(this.active, 1000);
    return {
      wpm: Math.max(0, n - uncorrected) / 5 / (ms / 60000),
      acc: n ? ((n - errors) / n) * 100 : 100,
      ms: this.active, chars: n, errors, uncorrected
    };
  }
}

class Tape {
  constructor() {
    this.strip = h('div', { class: 'strip' });
    this.ghosts = h('div', { class: 'ghosts' });
    this.el = h('div', { class: 'tape' }, this.strip, this.ghosts);
    this.spans = [];
    this.pos = -1;
  }

  add(text, from) {
    const frag = document.createDocumentFragment();
    for (let i = from; i < text.length; i++) {
      const ch = text[i];
      const sp = document.createElement('span');
      sp.className = ch === ' ' ? 'c sp' : 'c';
      sp.textContent = ch === ' ' ? '·' : ch;
      frag.append(sp);
      this.spans.push(sp);
    }
    this.strip.append(frag);
  }

  set(text) {
    this.strip.textContent = '';
    this.spans = [];
    this.pos = -1;
    this.add(text, 0);
    this.strip.style.transition = 'none';
    this.moveTo(0);
    void this.strip.offsetWidth;
    this.strip.style.transition = '';
  }

  sync(text) { if (text.length > this.spans.length) this.add(text, this.spans.length); }

  moveTo(pos) {
    const old = this.spans[this.pos];
    if (old) old.classList.remove('cur', 'bad');
    this.pos = pos;
    const sp = this.spans[pos];
    if (sp) sp.classList.add('cur');
    const lastSp = this.spans[this.spans.length - 1];
    const x = sp ? sp.offsetLeft : lastSp ? lastSp.offsetLeft + lastSp.offsetWidth : 0;
    this.strip.style.transform = `translateX(${-x}px)`;
  }

  state(i, cls, on = true) { const sp = this.spans[i]; if (sp) sp.classList.toggle(cls, on); }

  miss(i, got) {
    const sp = this.spans[i];
    if (!sp) return;
    sp.classList.remove('bad');
    void sp.offsetWidth;
    sp.classList.add('bad');
    const g = h('span', { class: 'ghost' }, got === ' ' ? '␣' : got);
    this.ghosts.append(g);
    setTimeout(() => g.remove(), 700);
  }
}

/* ---- js/screens/common.js ---- */
/* Screen registry and small pieces shared by several screens. */

const Screens = {};

const metric = (value, label) => h('div', { class: 'metric' }, h('b', null, value), h('span', null, label));

function starRow(n, cls = 'stars') {
  return h('div', { class: cls }, [0, 1, 2].map(i => h('span', { class: i < n ? 'on' : '' }, '★')));
}

/* The three star thresholds of a lesson as a small table. */
function reqRows(tgt) {
  const rows = [[1, pct(90)], [2, `${pct(94)} · ${fmtSpeed(tgt[0])}`], [3, `${pct(97)} · ${fmtSpeed(tgt[1])}`]];
  return h('div', { class: 'reqs' }, rows.map(([n, txt]) => h('div', null, starRow(n, 'tst'), h('span', null, txt))));
}

/* Translate in a specific language regardless of the active course. */
function tIn(lang, key, vars) {
  const prev = LANG;
  LANG = lang;
  try { return t(key, vars); } finally { LANG = prev; }
}

/* Vertical list navigation used by menus: returns the new index or -1 if the key is not a move. */
function listMove(e, i, n) {
  if (e.key === 'ArrowDown' || (e.key === 'Tab' && !e.shiftKey)) return (i + 1) % n;
  if (e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey)) return (i - 1 + n) % n;
  return -1;
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    // Keyboard Lock (Chromium) lets Esc reach the app for pausing; holding Esc still leaves fullscreen.
    if (r && r.then) r.then(() => navigator.keyboard && navigator.keyboard.lock && navigator.keyboard.lock(['Escape'])).catch(() => {});
  } else if (document.exitFullscreen) document.exitFullscreen();
}

/* Lesson overview grouped by stage. Arrows move, Space starts, the side panel explains the selection. */

Screens.lessons = {
  render() {
    const c = this.course = App.course;
    const fu = c.firstUnpassed();

    this.tiles = [];
    const stages = STAGES.map(s => ({ s, ls: c.lessons.filter(l => l.stage === s) })).filter(x => x.ls.length);
    this.rows = stages.map(x => x.ls.map(l => l.idx));
    const body = h('div', { class: 'stages' }, stages.map(x => h('section', { class: 'stage-row' },
      h('h3', null, t('stage_' + x.s)),
      h('div', { class: 'tiles' }, x.ls.map(l => (this.tiles[l.idx] = this.tile(l, fu)))))));
    this.detail = h('aside', { class: 'detail' });
    return h('div', null,
      h('header', { class: 'bar' },
        h('div', { class: 'bar-l' }, h('div', { class: 'bar-title' }, t('menuLessons')),
          h('div', { class: 'bar-sub' }, `${c.passedCount()} / ${c.lessons.length}`))),
      h('main', { class: 'lessons-main' }, body, this.detail),
      hintBar([['← → ↑ ↓', t('kChoose')], ['Space', t('kStart')], ['Esc', t('kBack')]]));
  },

  tile(l, fu) {
    const c = this.course, s = c.stars(l.idx);
    const cls = ['tile', c.unlocked(l.idx) ? '' : 'locked', s >= 1 ? 'passed' : '', l.idx === fu ? 'current' : ''];
    return h('div', { class: cls.join(' '), onclick: () => { this.select(l.idx); this.start(); } },
      h('span', { class: 'tn' }, l.idx + 1),
      h('span', { class: 'tg' }, lessonGlyph(l)),
      starRow(Math.max(0, s), 'tst'));
  },

  mounted() { this.select(this.sel); },

  select(i) {
    this.tiles[this.sel].classList.remove('focus');
    this.sel = i;
    const el = this.tiles[i];
    el.classList.add('focus');
    el.scrollIntoView({ block: 'nearest' });
    const c = this.course, L = c.lessons[i], r = c.rec(i);
    put(this.detail,
      h('div', { class: 'eyebrow' }, `${t('lessonN', { n: i + 1 })} · ${t('stage_' + L.stage)}`),
      h('h2', null, lessonTitle(L)),
      h('p', null, lessonDesc(L, c.layout)),
      reqRows(L.tgt),
      r ? h('p', { class: 'muted' }, `${t('bestLine', { wpm: fmtSpeed(r.wpm), acc: fmtAcc(r.acc) })} · ${t('playedN', r.runs)}`)
        : h('p', { class: 'muted' }, t('never')),
      c.unlocked(i) ? h('div', { class: 'next-go' }, kbd('Space'), t('kStart')) : h('p', { class: 'locked-note' }, t('locked')));
  },

  start() { if (this.course.unlocked(this.sel)) startLesson(this.course, this.sel); },

  onKey(e) {
    const k = e.key, n = this.course.lessons.length;
    const row = this.rows.findIndex(r => r.includes(this.sel)), col = this.rows[row].indexOf(this.sel);
    if (k === 'ArrowRight') this.select(Math.min(n - 1, this.sel + 1));
    else if (k === 'ArrowLeft') this.select(Math.max(0, this.sel - 1));
    else if (k === 'ArrowDown' && row < this.rows.length - 1) { const r = this.rows[row + 1]; this.select(r[Math.min(col, r.length - 1)]); }
    else if (k === 'ArrowUp' && row > 0) { const r = this.rows[row - 1]; this.select(r[Math.min(col, r.length - 1)]); }
    else if (k === ' ' || k === 'Enter') this.start();
    else if (k === 'Escape') App.go('home');
    return true;
  }
};
