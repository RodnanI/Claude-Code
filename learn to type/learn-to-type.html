<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn to Type</title>
<meta name="description" content="Ten-finger touch typing course for QWERTY (English) and QWERTZ (German) keyboards.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='5' fill='%231d1b18'/%3E%3Crect x='11' y='19' width='10' height='3' rx='1.5' fill='%23c23f2b'/%3E%3C/svg%3E">
<style>
/* Tokens, themes and shared elements. Light theme is paper and ink, dark theme is carbon.
   The accent is typewriter-ribbon red, used for errors and the current lesson only. */

:root {
  --bg: #f3efe6;
  --line: #dbd3c2;
  --ink: #1d1b18;
  --ink2: #5f594f;
  --ink3: #978f82;
  --red: #c23f2b;
  --red-soft: #f2d8ce;
  --ok: #3b7a4f;
  --key: #fbf9f4;
  --key-edge: #d6cdb9;
  --key-ink: #3b3833;
  /* Finger zones, validated for adjacent-pair separation incl. colour vision deficiency. */
  --c-p: #3f8f5a;
  --c-r: #e0a526;
  --c-m: #d4577b;
  --c-i: #138ca9;
  --c-t: #a89e8e;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
  --sans: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --ug: 50px;
  --tape-scale: 1;
  --tape-fs: calc(clamp(26px, 3.3vw, 46px) * var(--tape-scale));
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151412;
    --line: #302e29;
    --ink: #ece6d9;
    --ink2: #a59e90;
    --ink3: #69635a;
    --red: #e2644e;
    --red-soft: #4a241d;
    --ok: #74b98b;
    --key: #22211d;
    --key-edge: #0f0e0c;
    --key-ink: #cfc8b9;
    --c-p: #378050;
    --c-r: #bb841c;
    --c-m: #d45f80;
    --c-i: #2493b5;
    --c-t: #8b8273;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #151412;
  --line: #302e29;
  --ink: #ece6d9;
  --ink2: #a59e90;
  --ink3: #69635a;
  --red: #e2644e;
  --red-soft: #4a241d;
  --ok: #74b98b;
  --key: #22211d;
  --key-edge: #0f0e0c;
  --key-ink: #cfc8b9;
  --c-p: #378050;
  --c-r: #bb841c;
  --c-m: #d45f80;
  --c-i: #2493b5;
  --c-t: #8b8273;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}

#sink {
  position: fixed; left: -200px; top: 0;
  width: 1px; height: 1px; opacity: 0;
  border: 0; padding: 0; resize: none; overflow: hidden;
}

#app { position: fixed; inset: 0; }

.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: clamp(16px, 3vh, 34px) clamp(16px, 4vw, 56px) 0;
  animation: enter .2s ease-out;
}
@keyframes enter { from { opacity: 0; transform: translateY(5px); } }

.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  .screen, .c.cur, .c.bad, .ghost, .k.hit, .k.miss { animation: none !important; }
  .strip { transition: none !important; }
}
.muted { color: var(--ink3); }
.center { text-align: center; }

h1, h2 { font-family: var(--serif); font-weight: 400; letter-spacing: -.01em; margin: 0; line-height: 1.12; }

.eyebrow {
  font: 600 11px/1.4 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink3);
}

kbd {
  display: inline-block;
  min-width: 24px;
  padding: 4px 7px 3px;
  font: 500 11px/1 var(--mono);
  text-align: center;
  color: var(--ink2);
  background: var(--key);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
}

.hints {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 6px 22px;
  margin-top: auto;
  padding: 14px 0 18px;
  font-size: 12.5px;
  color: var(--ink3);
  position: relative;
  z-index: 2;
}
.hints span { display: inline-flex; align-items: center; gap: 8px; }

.metrics { display: flex; justify-content: center; gap: clamp(22px, 5vw, 60px); }
.metric { display: grid; justify-items: center; gap: 2px; }
.metric b { font: 400 clamp(30px, 4.2vw, 46px)/1.05 var(--serif); color: var(--ink); font-variant-numeric: tabular-nums; }
.metric span { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }

.stars { display: flex; gap: 4px; }
.stars span, .tst span { color: var(--line); }
.stars span.on, .tst span.on { color: var(--c-r); }
.stars.big { font-size: 38px; gap: 10px; }

.cap {
  display: inline-grid; place-items: center;
  min-width: 30px; height: 30px; padding: 0 6px;
  font: 600 15px var(--mono);
  color: var(--ink);
  background: var(--key);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 6px;
}

[data-f="p"] { --fc: var(--c-p); }
[data-f="r"] { --fc: var(--c-r); }
[data-f="m"] { --fc: var(--c-m); }
[data-f="i"] { --fc: var(--c-i); }
[data-f="t"] { --fc: var(--c-t); }
.cap[data-f] { box-shadow: inset 0 -3px 0 var(--fc); }

.req { font: 500 12px var(--mono); color: var(--ink3); letter-spacing: .02em; white-space: pre-wrap; }
.best { font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ok); }
.next-go { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink2); }
</style>
<style>
/* On-screen keyboard and the hands overlay. Everything scales with --u (one key width). */

.kbwrap { display: flex; justify-content: center; flex: none; padding-top: 2.5vh; }
.no-kb .scr-run .kbwrap { display: none; }

.kb {
  --u: var(--ug);
  --gap: calc(var(--u) * .1);
  position: relative;
  width: calc(var(--u) * 15 - var(--gap));
  height: calc(var(--u) * 5 - var(--gap));
  margin-bottom: calc(var(--u) * 1.5);
}
.kb.small { --u: calc(var(--ug) * .6); margin-bottom: 0; }
.kb-keys { position: absolute; inset: 0; }

.k {
  --fc: var(--c-t);
  position: absolute;
  left: calc(var(--x) * var(--u));
  top: calc(var(--y) * var(--u));
  width: calc(var(--w) * var(--u) - var(--gap));
  height: calc(var(--u) - var(--gap));
  border-radius: calc(var(--u) * .14);
  background: var(--key);
  box-shadow: 0 calc(var(--u) * .045) 0 var(--key-edge);
  color: var(--key-ink);
  font: 500 calc(var(--u) * .3)/1 var(--mono);
  transition: background-color .12s, transform .08s, opacity .25s, box-shadow .12s, color .12s;
}
.k.fp { --fc: var(--c-p); }
.k.fr { --fc: var(--c-r); }
.k.fm { --fc: var(--c-m); }
.k.fi { --fc: var(--c-i); }
:root:not(.no-colors) .k:not(.mod) { background: color-mix(in srgb, var(--fc) 22%, var(--key)); }

.k span { position: absolute; pointer-events: none; }
.k .m { left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: calc(var(--u) * .34); }
.k .s, .k .b { left: calc(var(--u) * .17); font-size: calc(var(--u) * .25); }
.k .s { top: calc(var(--u) * .1); }
.k .b { bottom: calc(var(--u) * .12); }
.k .a { right: calc(var(--u) * .14); bottom: calc(var(--u) * .12); font-size: calc(var(--u) * .2); opacity: .6; }
.k .n { left: calc(var(--u) * .17); bottom: calc(var(--u) * .14); font-size: calc(var(--u) * .22); opacity: .6; }
.k.bump .m::after {
  content: ''; position: absolute; left: 50%; bottom: calc(var(--u) * -.19);
  width: calc(var(--u) * .24); height: 2px; margin-left: calc(var(--u) * -.12);
  background: currentColor; opacity: .55; border-radius: 1px;
}

.k.off { opacity: .3; }
.k.dead { opacity: .2; }
.k.new::before {
  content: ''; position: absolute;
  top: calc(var(--u) * .1); right: calc(var(--u) * .1);
  width: calc(var(--u) * .11); height: calc(var(--u) * .11);
  border-radius: 50%; background: var(--red);
}

.k.tgt {
  background: var(--fc) !important;
  color: #fff;
  opacity: 1;
  transform: translateY(calc(var(--u) * -.04));
  box-shadow: 0 calc(var(--u) * .08) 0 color-mix(in srgb, var(--fc) 55%, #000);
}
.k.fr.tgt { color: #1d1b18; }
.k.hold {
  opacity: 1;
  box-shadow: inset 0 0 0 calc(var(--u) * .05) var(--fc), 0 calc(var(--u) * .045) 0 var(--key-edge);
}
.k.hit { animation: k-hit .16s ease-out; }
.k.miss { animation: k-miss .45s ease-out; }
@keyframes k-hit { from { transform: translateY(calc(var(--u) * .05)); box-shadow: none; } }
@keyframes k-miss {
  0%, 35% { opacity: 1; color: var(--red); box-shadow: inset 0 0 0 calc(var(--u) * .06) var(--red), 0 0 0 calc(var(--u) * .05) var(--red-soft); }
}

.k.enter-bot {
  top: calc(var(--y) * var(--u) - var(--gap) - 1px);
  height: calc(var(--u) + 1px);
  border-top-left-radius: 0;
  border-top-right-radius: 0;
}

.kb.heatmap .k { background: var(--key) !important; opacity: 1; }
.kb.heatmap .k.heat { background: color-mix(in srgb, var(--red) var(--heat), var(--key)) !important; }
.kb.heatmap .k.new::before { display: none; }

.hands {
  position: absolute;
  left: calc(var(--u) * -1);
  top: calc(var(--u) * -.5);
  width: calc(var(--u) * 17);
  height: calc(var(--u) * 10);
  pointer-events: none;
  overflow: visible;
}
.hands .outline { fill: var(--ink2); opacity: .5; }
.hands .hl line { stroke: var(--c-t); opacity: 0; transition: opacity .15s; }
.hands .hl line.fp { stroke: var(--c-p); }
.hands .hl line.fr { stroke: var(--c-r); }
.hands .hl line.fm { stroke: var(--c-m); }
.hands .hl line.fi { stroke: var(--c-i); }
.hands .hl line.on { opacity: .55; }
.no-hands .hands, .kb.small .hands, .kb.heatmap .hands { display: none; }
.hands .skin { fill: var(--ink); stroke: var(--ink); opacity: .07; }
</style>
<style>
/* Per-screen layout. */

/* ---------- start ---------- */
.sel { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6vh; }
.sel-title { font-size: clamp(36px, 5.4vw, 68px); text-align: center; }
.sel-title em { display: block; margin-top: 10px; font-size: .46em; font-style: italic; color: var(--ink3); }
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(16px, 3vw, 40px); }
.lang-card {
  width: min(380px, 86vw);
  padding: 28px 30px 26px;
  border: 1px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
  opacity: .5;
  transition: opacity .15s, transform .15s, border-color .15s, box-shadow .15s;
}
.lang-card.on { opacity: 1; border-color: var(--ink); transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
.lang-word { font: 600 clamp(34px, 4.4vw, 54px)/1 var(--mono); letter-spacing: .08em; }
.lang-word em { font-style: normal; color: var(--red); }
.lang-name { margin-top: 18px; font: 400 26px var(--serif); }
.lang-sub { font-size: 14px; color: var(--ink2); }
.lang-prog { display: grid; gap: 6px; margin-top: 22px; font-size: 13px; color: var(--ink3); }
.lang-bar, .goal-bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.lang-bar i, .goal-bar i { display: block; height: 100%; background: var(--ink); }

/* ---------- home ---------- */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
.brand .app { font: 400 26px/1.1 var(--serif); }
.brand .course { margin-top: 6px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
.today { display: grid; justify-items: end; gap: 6px; font-size: 13px; color: var(--ink2); }
.goal { display: flex; align-items: center; gap: 10px; }
.goal-bar { width: 140px; height: 4px; }
.goal.done .goal-bar i { background: var(--ok); }

.home-main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(250px, 1fr);
  grid-template-rows: auto auto;
  align-content: center;
  gap: 4vh 5vw;
  width: 100%; max-width: 1180px; margin: 0 auto;
}
.item { cursor: pointer; border: 1px solid transparent; transition: border-color .12s, box-shadow .12s, transform .12s, background-color .12s; }
.next { grid-column: 1; grid-row: 1; padding: 30px 32px 28px; border-radius: 16px; border-color: var(--line); }
.next.focus { border-color: var(--ink); box-shadow: 5px 5px 0 var(--ink); transform: translate(-2px, -2px); }
.next-title { margin: 10px 0 8px; font: 400 clamp(26px, 3.3vw, 42px)/1.15 var(--serif); }
.next-sub { max-width: 54ch; color: var(--ink2); }
.next .next-go { margin-top: 22px; }

.course-line { grid-column: 1; grid-row: 2; }
.ticks { display: flex; align-items: flex-end; gap: 3px; height: 32px; }
.ticks i { flex: 1; max-width: 14px; height: 7px; border-radius: 2px; background: var(--line); }
.ticks i.gap { margin-left: 10px; }
.ticks i.s1 { height: 14px; background: var(--ink3); }
.ticks i.s2 { height: 22px; background: var(--ink2); }
.ticks i.s3 { height: 30px; background: var(--ink); }
.ticks i.cur { height: 18px; background: var(--red); }
.ticks i.locked { opacity: .55; }
.course-meta { display: flex; gap: 20px; margin-top: 10px; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); }

.menu { grid-column: 2; grid-row: 1 / span 2; align-self: center; display: grid; gap: 4px; }
.mi { display: grid; grid-template-columns: 34px 1fr; padding: 12px 16px; border-radius: 12px; }
.mi .mk { grid-row: 1 / span 2; padding-top: 6px; font: 500 12px var(--mono); color: var(--ink3); }
.mi .ml { font: 400 21px/1.25 var(--serif); }
.mi .ms { font-size: 13px; color: var(--ink3); }
.mi.focus { border-color: var(--ink); background: var(--key); box-shadow: 3px 3px 0 var(--ink); }

/* ---------- header bar ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 46px; }
.bar-title { font: 400 21px/1.2 var(--serif); }
.bar-sub { margin-top: 3px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
.dots { display: flex; gap: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink3); transition: all .2s; }
.dots i.done { background: var(--ink3); }
.dots i.cur { background: var(--ink); border-color: var(--ink); transform: scale(1.25); }
.live { display: flex; justify-content: flex-end; gap: 18px; min-width: 230px; font: 500 13px var(--mono); color: var(--ink2); font-variant-numeric: tabular-nums; }
.live .clock { color: var(--ink); }

/* ---------- typing ---------- */
.stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.notice { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: min(90%, 80ch); text-align: center; font-size: 13px; color: var(--red); }
.focus-keys { margin-bottom: 18px; font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }

.tape {
  position: relative;
  width: 100%; max-width: 1500px;
  height: calc(var(--tape-fs) * 1.8);
  overflow: hidden;
  font: 400 var(--tape-fs)/1.8 var(--mono);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
}
.strip { position: absolute; left: 36%; top: 0; white-space: pre; transition: transform .1s cubic-bezier(.2, .7, .3, 1); will-change: transform; }
.c { display: inline-block; color: var(--ink); }
.c.sp { color: var(--ink3); opacity: .4; }
.c.done { color: var(--ink3); }
.c.sp.done { opacity: .2; }
.c.err { color: var(--red); }
.c.wrong { color: var(--red); background: var(--red-soft); border-radius: 3px; }
.c.cur { box-shadow: inset 0 -3px 0 var(--ink); animation: caret 1.1s ease-in-out infinite; }
.c.cur.sp { opacity: 1; }
.c.bad { color: var(--red); background: var(--red-soft); box-shadow: inset 0 -3px 0 var(--red); border-radius: 3px; animation: shake .22s; }
@keyframes caret { 50% { box-shadow: inset 0 -3px 0 transparent; } }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.ghosts { position: absolute; left: 36%; top: 0; pointer-events: none; }
.ghost { position: absolute; left: .1em; top: .1em; font-size: .42em; line-height: 1; color: var(--red); animation: ghost .7s ease-out forwards; }
@keyframes ghost { to { opacity: 0; transform: translateY(-.8em); } }

.fhint { display: flex; align-items: center; gap: 10px; min-height: 22px; margin-top: 14px; font-size: 14px; color: var(--ink2); }
.fhint:not(:empty)::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--fc, var(--ink3)); flex: none; }
.prog { width: min(560px, 60%); height: 2px; margin-top: 16px; border-radius: 1px; background: var(--line); overflow: hidden; }
.prog i { display: block; width: 0; height: 100%; background: var(--ink2); transition: width .15s; }

.stage.carded .prog, .stage.carded .fhint { visibility: hidden; }
.card { display: grid; justify-items: center; gap: 18px; padding: 10px; text-align: center; }
.card-title { font: 400 30px var(--serif); }
.card-msg { margin: 0; color: var(--ink2); }
.card .hints { margin: 0; padding: 0; }

/* ---------- lessons ---------- */
.lessons-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 4vw; padding-top: 2vh; }
.stages { display: grid; align-content: start; gap: 14px; overflow-y: auto; padding: 4px 8px 12px 2px; }
.stage-row { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 16px; }
.stage-row h3 { margin: 0; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile {
  position: relative;
  display: grid; grid-template-rows: auto 1fr auto;
  width: 78px; height: 66px; padding: 5px 7px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--key);
  cursor: pointer;
  transition: transform .1s, box-shadow .1s, border-color .1s;
}
.tile .tn { font: 500 10px var(--mono); color: var(--ink3); }
.tile .tg { align-self: center; overflow: hidden; font: 600 14px var(--mono); text-align: center; white-space: nowrap; text-overflow: ellipsis; }
.tile .tst { display: flex; justify-content: center; gap: 2px; font-size: 10px; }
.tile.locked { opacity: .38; }
.tile.current { border-color: var(--red); }
.tile.focus { border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px, -1px); }
.detail { display: grid; align-content: start; gap: 12px; padding-left: 28px; border-left: 1px solid var(--line); }
.detail h2 { font-size: 30px; }
.detail p { margin: 0; color: var(--ink2); }
.detail p.muted { color: var(--ink3); }
.locked-note { color: var(--red) !important; }
.reqs { display: grid; gap: 4px; font: 500 12px var(--mono); color: var(--ink3); }
.reqs > div { display: flex; align-items: center; gap: 10px; }
.reqs .tst { display: flex; gap: 2px; min-width: 42px; font-size: 11px; }

/* ---------- intro ---------- */
.intro-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; width: 100%; max-width: 920px; margin: 0 auto; }
.intro-body h1 { font-size: clamp(30px, 4vw, 48px); }
.ob { display: grid; gap: 10px; max-width: 72ch; margin: 0; padding: 0; list-style: none; counter-reset: ob; font-size: clamp(15px, 1.35vw, 18px); color: var(--ink2); }
.ob li { position: relative; padding-left: 34px; }
.ob li::before { counter-increment: ob; content: counter(ob); position: absolute; left: 0; top: 3px; font: 500 12px var(--mono); color: var(--ink3); }
.bigkeys { display: flex; flex-wrap: wrap; gap: 14px; }

.explain b::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--fc, var(--ink3)); }
.tip, .lead { margin: 0; color: var(--ink3); max-width: 72ch; }
.lead { color: var(--ink2); }
.scr-intro .foot { flex: none; }

.res { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; text-align: center; }

.res .metrics { margin: 8px 0; }
.res .coach { max-width: 62ch; margin: 4px 0 0; font-size: 17px; color: var(--ink2); }
.watch { display: grid; justify-items: start; gap: 8px; margin-top: 10px; }
.watch .eyebrow { justify-self: center; margin-bottom: 2px; }
.watch.clean { color: var(--ok); }
.wk { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink2); }

/* ---------- statistics ---------- */
.stats { flex: 1; min-height: 0; display: grid; align-content: start; gap: 3.2vh; overflow-y: auto; padding: 2vh 2px; }
.metrics.wide { justify-content: space-between; flex-wrap: wrap; }
.metrics.wide .metric { justify-items: start; }
.metrics.wide .metric b { font-size: clamp(22px, 2.6vw, 34px); }
.empty { margin: 0; }
.charts { display: grid; gap: 22px; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
figure { margin: 0; }
figcaption { margin-bottom: 8px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
.chart { position: relative; height: 150px; }
.chart.short { height: 110px; }
.chart svg { display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ref { stroke: var(--ink3); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .axis { fill: var(--ink3); font: 11px var(--mono); }
.chart .series { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
.chart .val { fill: var(--ink); font: 600 12px var(--mono); }
.chart .cross { stroke: var(--ink3); stroke-width: 1; }
.chart .bar { fill: var(--ink3); }
.chart .bar.today { fill: var(--ink); }
.chart .hit { fill: transparent; }
.ctip { position: absolute; top: -8px; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: var(--bg); font: 12px var(--mono); white-space: nowrap; pointer-events: none; }
.heat-row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 4vw; }
.heat-kb { display: grid; gap: 12px; }
.heat-kb .kbwrap { padding: 0; justify-content: flex-start; }
.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.li { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--ink2); }
.li .arrow { color: var(--ink3); }
.cap.wrong { color: var(--red); }

/* ---------- settings and test setup ---------- */
.settings { flex: 1; min-height: 0; overflow-y: auto; width: 100%; max-width: 760px; margin: 0 auto; padding: 2vh 2px; }
.settings.narrow { flex: none; margin-top: 12vh; }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 11px 16px; border: 1px solid transparent; border-radius: 10px; cursor: pointer; }

.srow:not(.act) .sv::after { content: '\2002›'; color: var(--ink3); }

/* ---------- break ---------- */
.brk { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; text-align: center; }

.brk ul { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; color: var(--ink2); }

/* ---------- narrow screens ---------- */
@media (max-width: 860px) {
  .home-main { grid-template-columns: 1fr; align-content: start; padding-top: 3vh; }
  .menu { grid-column: 1; grid-row: auto; }
  .lessons-main { grid-template-columns: 1fr; }
  .detail { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 16px; }
  .stage-row { grid-template-columns: 1fr; gap: 8px; }
  .charts-row, .lists, .heat-row { grid-template-columns: 1fr; }
  .live { min-width: 0; }
  .dots { display: none; }
}

function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
  return n;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs, ...kids) {
  const n = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  for (const c of kids.flat(Infinity)) if (c != null) n.append(c.nodeType ? c : String(c));
  return n;
}

const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function pickWeighted(items, weight) {
  let total = 0;
  const ws = items.map(it => { const w = Math.max(0, weight(it)); total += w; return w; });
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

const isLetter = c => c.toLowerCase() !== c.toUpperCase();
const isUpper = c => isLetter(c) && c === c.toUpperCase() && c !== c.toLowerCase();

function fmtClock(ms) {
  const s = Math.max(0, Math.round(ms / 1000));

function fmtDuration(ms) {
  if (ms < 60000) return Math.round(ms / 1000) + ' s';

function t(key, vars) {
  let s = STR[LANG][key];
  if (s === undefined) s = STR.en[key];
  if (s === undefined) return key;
  if (typeof s === 'function') return s(vars);
  if (vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ''));
  return s;
}

/* Speed in the unit the learner picked (words or characters per minute). */
function fmtSpeed(wpm, withUnit = true) {
  const unit = Settings.get('unit') === 'auto' ? (LANG === 'de' ? 'cpm' : 'wpm') : Settings.get('unit');
  const v = Math.round(unit === 'cpm' ? wpm * 5 : wpm);
  return withUnit ? `${v} ${t(unit)}` : String(v);
}
function speedUnit() {
  const unit = Settings.get('unit') === 'auto' ? (LANG === 'de' ? 'cpm' : 'wpm') : Settings.get('unit');
  return t(unit);
}
function pct(n) { return LANG === 'de' ? n + ' %' : n + '%'; }

function fmtAcc(a) {
  const s = a >= 100 ? '100' : (Math.floor(a * 10) / 10).toFixed(1);
  return LANG === 'de' ? s.replace('.', ',') + ' %' : s + '%';
}

/* Finger ids: l/r = hand, p r m i t = pinky, ring, middle, index, thumb. */
const FINGERS = ['lp', 'lr', 'lm', 'li', 'lt', 'rt', 'ri', 'rm', 'rr', 'rp'];
const FINGER_KEYS = {
  lp: 'Backquote Digit1 Tab KeyQ CapsLock KeyA ShiftLeft IntlBackslash KeyZ ControlLeft MetaLeft',
  lr: 'Digit2 KeyW KeyS KeyX',
  lm: 'Digit3 KeyE KeyD KeyC',
  li: 'Digit4 Digit5 KeyR KeyT KeyF KeyG KeyV KeyB',
  lt: 'AltLeft',
  rt: 'Space AltRight',
  ri: 'Digit6 Digit7 KeyY KeyU KeyH KeyJ KeyN KeyM',
  rm: 'Digit8 KeyI KeyK Comma',
  rr: 'Digit9 KeyO KeyL Period',
  rp: 'Digit0 Minus Equal Backspace KeyP BracketLeft BracketRight Backslash Semicolon Quote Enter Slash ShiftRight MetaRight ContextMenu ControlRight'
};
const FINGER_OF = {};
for (const f in FINGER_KEYS) for (const c of FINGER_KEYS[f].split(' ')) FINGER_OF[c] = f;
const HOME_KEY = { lp: 'KeyA', lr: 'KeyS', lm: 'KeyD', li: 'KeyF', lt: 'Space', rt: 'Space', ri: 'KeyJ', rm: 'KeyK', rr: 'KeyL', rp: 'Semicolon' };

function makeLayout(id) {
  const L = LAYOUTS[id];
  const rows = ROWS[L.geom].map(r => r.split(' ').map(s => {
    const [code, w] = s.split(':');
    return { code, w: +(w || 1) };
  }));
  const geo = [], center = {}, box = {};
  rows.forEach((row, y) => {
    let x = 0;
    for (const k of row) {
      geo.push({ ...k, x, y });
      if (!center[k.code]) { center[k.code] = [x + k.w / 2, y + 0.5]; box[k.code] = [x, y, k.w]; }
      x += k.w;
    }
  });

  const chars = {};
  for (const code in L.keys) {
    if (L.dead.includes(code)) continue;
    const [b, s] = [...L.keys[code]];
    if (!(b in chars)) chars[b] = { code, shift: false, altgr: false };
    if (s && !(s in chars)) chars[s] = { code, shift: true, altgr: false };
  }
  for (const code in L.altgr) chars[L.altgr[code]] = { code, shift: false, altgr: true };
  chars[' '] = { code: 'Space', shift: false, altgr: false };

  const side = code => (FINGER_OF[code] || 'r')[0];

  return {
    id, ...L, rows, geo, center, box, chars,
    side,
    fingerOf(ch) {
      const m = chars[ch];
      if (!m) return null;
      return ch === ' ' ? 'thumbs' : FINGER_OF[m.code];
    },
    /* Keys that must be pressed for a character; the first entry is the main key. */
    strokes(ch) {
      const m = chars[ch];
      if (!m) return null;
      const out = [{ code: m.code, finger: ch === ' ' ? 'thumbs' : FINGER_OF[m.code] }];
      if (m.shift) {
        const left = side(m.code) === 'l';
        out.push({ code: left ? 'ShiftRight' : 'ShiftLeft', finger: left ? 'rp' : 'lp' });
      }
      if (m.altgr) out.push({ code: 'AltRight', finger: 'rt' });
      return out;
    },
    homeChar(f) { return L.keys[HOME_KEY[f]][0]; },
    label(code) { return L.keys[code] || ''; }
  };
}

/* Text generation. Everything produced here only uses characters the learner already knows. */

const LANGDATA = {};

function prepLang(lang) {
  if (LANGDATA[lang]) return LANGDATA[lang];
  const D = lang === 'de' ? DATA_DE : DATA_EN;
  const seen = new Set(), words = [];
  for (const w of D.words) {
    if (!w || seen.has(w)) continue;
    seen.add(w);
    words.push({ w, r: words.length });
  }
  // Letter models of order 2 and 1 for pronounceable pseudo-words.
  const m2 = new Map(), m1 = new Map();
  const add = (m, ctx, ch) => {
    let t = m.get(ctx);
    if (!t) m.set(ctx, t = new Map());
    t.set(ch, (t.get(ch) || 0) + 1);
  };
  for (const { w } of words) {
    const s = '^^' + w.toLowerCase() + '$';
    for (let i = 2; i < s.length; i++) { add(m2, s.slice(i - 2, i), s[i]); add(m1, s[i - 1], s[i]); }
  }
  return (LANGDATA[lang] = { D, words, m2, m1, lower: new Set(words.map(x => x.w.toLowerCase())) });
}

const isDigit = c => c >= '0' && c <= '9';
const PUNCT = new Set([...',.;:!?"\'-/']);

class TextGen {
  constructor(lang, layout, learned, opts = {}) {
    this.L = prepLang(lang);
    this.lang = lang;
    this.layout = layout;
    this.learned = learned;
    this.letters = [...learned].filter(c => isLetter(c) && !isUpper(c));
    this.focus = opts.focus || [];
    this.fset = new Set(this.focus);
    this.weights = opts.weights || null;
    this.recent = [];
    this.pool = [];
    for (const { w, r } of this.L.words) {
      const f = this.form(w);
      if (f) this.pool.push({ w: f, r });
    }
  }

  ok(s) {
    if (s == null) return false;
    for (const c of s) if (!this.learned.has(c)) return false;
    return true;
  }

  form(w) {
    if (this.ok(w)) return w;
    const lw = w.toLowerCase();
    return lw !== w && this.ok(lw) ? lw : null;
  }

  focusCount(w, fset = this.fset) {
    let n = 0;
    for (const c of w) if (fset.has(c) || fset.has(c.toLowerCase())) n++;
    return n;
  }

  /* ---------- words ---------- */

  pickWord({ focus = this.focus, pool = this.pool } = {}) {
    if (!pool.length) return null;
    const fset = new Set(focus);
    const W = this.weights;
    const w = pickWeighted(pool, it => {
      let v = 1 / Math.sqrt(1 + it.r / 60);
      if (fset.size) { const n = this.focusCount(it.w, fset); v *= n ? 1 + 2.5 * Math.min(n, 2) : 0.3; }
      if (W) { let s = 0; for (const c of it.w) s += W[c.toLowerCase()] || 0; v *= 1 + 4 * Math.min(s, 1.5); }
      if (this.recent.includes(it.w)) v *= 0.04;
      return v;
    }).w;
    this.recent.push(w);
    if (this.recent.length > 10) this.recent.shift();
    return w;
  }

  focusPoolSize(focus) {
    const fset = new Set(focus);
    return this.pool.filter(it => this.focusCount(it.w, fset) > 0).length;
  }

  /* ---------- pseudo-words ---------- */

  nextLetter(w, allowed, fset, canEnd, wantEnd) {
    const c2 = ('^^' + w).slice(-2), c1 = ('^' + w).slice(-1);
    for (const [m, ctx] of [[this.L.m2, c2], [this.L.m1, c1]]) {
      const tbl = m.get(ctx);
      if (!tbl) continue;
      const opts = [];
      for (const [ch, n] of tbl) {
        if (ch === '$') { if (canEnd) opts.push([ch, n * (wantEnd ? 5 : 0.6)]); }
        else if (allowed.has(ch)) opts.push([ch, n * (fset.has(ch) ? 2.5 : 1)]);
      }
      if (opts.length) return pickWeighted(opts, o => o[1])[0];
    }
    return canEnd ? '$' : pick([...allowed]);
  }

  pseudo(focus = this.focus, start = '') {
    const letters = this.letters;
    if (!letters.length) return start;
    const allowed = new Set(letters);
    const fset = new Set(focus.filter(c => allowed.has(c)));
    for (let a = 0; a < 30; a++) {
      let w = start;
      const target = 3 + rand(4);
      while (w.length < 9) {
        const ch = this.nextLetter(w, allowed, fset, w.length >= 2, w.length >= target);
        if (ch === '$') break;
        w += ch;
      }
      if (w.length < 2 || /(.)\1\1/.test(w)) continue;
      if (fset.size && ![...w].some(c => fset.has(c))) continue;
      if (this.recent.includes(w)) continue;
      this.recent.push(w);
      if (this.recent.length > 10) this.recent.shift();
      return w;
    }
    const f = [...fset];
    let w = '';
    const L = 2 + rand(3);
    for (let i = 0; i < L; i++) w += f.length && Math.random() < 0.5 ? pick(f) : pick(letters);
    return w;
  }

  /* ---------- assembly ---------- */

  join(tokens) { return tokens.filter(Boolean).join(' '); }

  fill(n, make) {
    const out = [];
    let len = 0, guard = 0;
    while (len < n && guard++ < 500) {
      const s = make();
      if (!s) continue;
      out.push(s);
      len += s.length + 1;
    }
    return out;
  }

  /* Turn a word list into sentences using whatever punctuation and capitals are known. */
  punctuate(tokens) {
    const L = this.learned;
    if (!L.has('.') && !L.has(',')) return this.join(tokens);
    const out = [];
    let i = 0;
    while (i < tokens.length) {
      const len = 4 + rand(6);
      const sent = tokens.slice(i, i + len);
      i += len;
      if (L.has('.')) {
        const c = cap(sent[0]);
        if (this.ok(c)) sent[0] = c;
      }
      for (let k = 1; k < sent.length - 1; k++) if (L.has(',') && Math.random() < 0.12) sent[k] += ',';
      if (L.has('.')) {
        const r = Math.random();
        sent[sent.length - 1] += r < 0.07 && L.has('?') ? '?' : r < 0.13 && L.has('!') ? '!' : '.';
      }
      out.push(sent.join(' '));
    }
    return out.join(' ');
  }

  /* ---------- drills ---------- */

  anchor(k) {
    const m = this.layout.chars[k];
    if (!m) return k;
    const base = this.layout.keys[m.code] ? this.layout.keys[m.code][0] : null;
    if ((m.shift || m.altgr) && base && base !== k && this.learned.has(base)) return base;
    const f = FINGER_OF[m.code];
    if (!f || f[1] === 't') return k;
    const home = this.layout.homeChar(f);
    return home && this.learned.has(home) && home !== k ? home : k;
  }

  drill(keys, n) {
    const list = keys.filter(k => this.learned.has(k));
    if (!list.length) return this.mix(n);
    const start = [];
    for (const k of list) {
      const a = this.anchor(k);
      if (a !== k) start.push(a + k + a, k + k + k, a + k + k);
      else start.push(k + k + k, k + k);
    }
    const pats = ['kk', 'kkk', 'aka', 'kak', 'akk', 'kka', 'akak'];
    const rest = this.fill(Math.max(0, n - start.join(' ').length), () => {
      if (list.length > 1 && Math.random() < 0.45) {
        let g = '';
        const L = 2 + rand(3);
        for (let i = 0; i < L; i++) g += pick(list);
        return g;
      }
      const k = pick(list), a = this.anchor(k);
      return [...pick(pats)].map(p => (p === 'k' ? k : a)).join('');
    });
    return this.join([...start, ...rest]);
  }

  pairs(keys, n) {
    const news = keys.filter(k => this.learned.has(k) && isLetter(k));
    if (!news.length) return this.drill(keys, n);
    const olds = this.letters.filter(c => !news.includes(c));
    const m1 = this.L.m1;
    const affinity = (k, o) => ((m1.get(k) && m1.get(k).get(o)) || 0) + ((m1.get(o) && m1.get(o).get(k)) || 0) + 2;
    const pats = ['ko', 'ok', 'kok', 'oko', 'kko', 'okk', 'koko', 'okko'];
    return this.join(this.fill(n, () => {
      const k = pick(news);
      const o = olds.length ? pickWeighted(olds, x => affinity(k, x)) : pick(news);
      return [...pick(pats)].map(p => (p === 'k' ? k : o)).join('');
    }));
  }

  rowdrill(keys, n) {
    const list = keys.filter(k => this.learned.has(k));
    if (!list.length) return this.mix(n);
    const groups = [];
    for (const k of list) { const a = this.anchor(k); groups.push(a !== k ? a + k + a : k + k); }
    const x = k => { const m = this.layout.chars[k]; return m ? this.layout.center[m.code][0] : 0; };
    const side = k => { const m = this.layout.chars[k]; return m ? this.layout.side(m.code) : 'r'; };
    const byX = list.slice().sort((p, q) => x(p) - x(q));
    for (const s of ['l', 'r']) {
      const run = byX.filter(k => side(k) === s);
      if (run.length > 1) groups.push(run.join(''), run.slice().reverse().join(''));
    }
    return this.join(this.fill(n, () => pick(groups)));
  }

  shiftdrill(uppers, n) {
    const ups = uppers.filter(u => this.learned.has(u));
    if (!ups.length) return this.mix(n);
    return this.join(this.fill(n, () => {
      const U = pick(ups), l = U.toLowerCase(), o = pick(this.letters);
      if (Math.random() < 0.35) return U + this.pseudo([], l).slice(1);
      return pick([U + l, U + l + l, l + U, U + o, U + o + l, U + l + o]);
    }));
  }

  /* ---------- word based ---------- */

  pseudoText(focus, n) {
    return this.join(this.fill(n, () => this.pseudo(focus)));
  }

  /* Only words that contain at least one focus key. */
  words(n, focus = this.focus) {
    const fset = new Set(focus);
    const pool = this.pool.filter(it => this.focusCount(it.w, fset) > 0);
    if (pool.length < 6) return this.pseudoText(focus, n);
    return this.join(this.fill(n, () => this.pickWord({ focus, pool })));
  }

  mix(n, focus = this.focus) {
    const small = this.pool.length < 40;
    const tokens = this.fill(n, () =>
      small && Math.random() < 0.45 || !this.pool.length ? this.pseudo(focus) : this.pickWord({ focus }));
    return this.punctuate(tokens);
  }

  capwords(uppers, n) {
    const set = new Set(uppers);
    let cands = [];
    for (const it of this.pool) {
      if (set.has(it.w[0])) cands.push({ w: it.w, r: it.r, nat: true });
      else {
        const c = cap(it.w);
        if (set.has(c[0]) && this.ok(c)) cands.push({ w: c, r: it.r + 150 });
      }
    }
    for (const nm of this.L.D.names) if (set.has(nm[0]) && this.ok(nm)) cands.push({ w: nm, r: 40, nat: true });
    // German capitalises nouns, so real nouns and names teach better than capitalised verbs.
    const natural = cands.filter(x => x.nat);
    if (this.lang === 'de' && natural.length >= 15) cands = natural;
    if (cands.length < 4) return this.shiftdrill(uppers, n);
    const tokens = this.fill(n, () => (Math.random() < 0.55 ? this.pickWord({ pool: cands, focus: [] }) : this.pickWord({ focus: [] })));
    return this.join(tokens);
  }

  top(n, N) {
    const pool = N ? this.pool.filter(it => it.r < N) : this.pool;
    return this.join(this.fill(n, () => this.pickWord({ pool, focus: [] })));
  }

  groupsDrill(list, n) {
    const groups = list.filter(g => this.ok(g));
    if (!groups.length) return this.mix(n);
    return this.join(this.fill(n, () => {
      const g = pick(groups);
      const w = this.pickWord({ focus: [], pool: this.pool.filter(it => it.w.toLowerCase().includes(g)).slice(0, 60) });
      return `${g} ${g} ${w || g}`;
    }));
  }

  groupWords(list, n) {
    const groups = list.filter(g => this.ok(g));
    const pool = this.pool.filter(it => groups.some(g => it.w.toLowerCase().includes(g)));
    if (pool.length < 10) return this.mix(n);
    return this.punctuate(this.fill(n, () => this.pickWord({ pool, focus: [] })));

  adapt(s) {
    const L = this.learned;
    let r = '';
    for (const c of s) {
      if (L.has(c)) { r += c; continue; }
      if (isLetter(c)) {
        const l = c.toLowerCase();
        if (l !== c && L.has(l)) { r += l; continue; }
        return null;
