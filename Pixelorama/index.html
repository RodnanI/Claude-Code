<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixelorama Web</title>
<meta name="description" content="A standalone, desktop-first pixel art and animation editor inspired by Pixelorama.">
<style>
:root,[data-theme=graphite]{
  --bg:#171613; --bg2:#1e1c19; --panel:#24221e; --panel2:#2b2924; --raise:#33302a; --line:#3b3831; --line2:#4a463d;
  --tx:#ebe5d8; --tx2:#b9b1a2; --mute:#8a8274; --acc:#f2a541; --acc-d:#b9781f; --acc-tx:#1b1408;
  --sec:#4fb3a1; --sec-d:#2f7d70; --warn:#e5574a; --ok:#8ccf6b; --sel:#f2a54133; --hover:#ffffff0d;
  --shadow:0 10px 30px #0008; --r:5px; --font:"Segoe UI",system-ui,-apple-system,Roboto,Ubuntu,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace; --canvas-bg:#121110;
  --checker-a:#5b5850; --checker-b:#46433d;
}
[data-theme=paper]{
  --bg:#d9d2c3; --bg2:#e4ddcf; --panel:#ece6da; --panel2:#f3eee4; --raise:#fffaf0; --line:#c8bfae; --line2:#b3a994;
  --tx:#2a251d; --tx2:#4f4739; --mute:#7c7362; --acc:#c4561b; --acc-d:#933c0e; --acc-tx:#fff6ea;
  --sec:#1f7a6a; --sec-d:#135448; --sel:#c4561b2a; --hover:#0000000b; --shadow:0 10px 30px #4a3f2a44; --canvas-bg:#cbc3b2;
  --checker-a:#e9e4da; --checker-b:#cfc8ba;
}
[data-theme=mono]{
  --bg:#101010; --bg2:#161616; --panel:#1c1c1c; --panel2:#232323; --raise:#2c2c2c; --line:#333; --line2:#444;
  --tx:#e6e6e6; --tx2:#b0b0b0; --mute:#808080; --acc:#e8e8e8; --acc-d:#9a9a9a; --acc-tx:#111;
  --sec:#ff6b57; --sec-d:#b44434; --sel:#ffffff22; --hover:#ffffff0d; --canvas-bg:#0b0b0b;
  --checker-a:#575757; --checker-b:#424242;
}
[data-theme=sumi]{
  --bg:#141414; --bg2:#1a1919; --panel:#201f1e; --panel2:#272524; --raise:#302e2c; --line:#363432; --line2:#46433f;
  --tx:#ece8e1; --tx2:#b5afa6; --mute:#837d75; --acc:#e5452f; --acc-d:#a32a19; --acc-tx:#fff4ef;
  --sec:#d9b45a; --sec-d:#9a7c32; --warn:#ff7a5c; --ok:#9cc46a; --sel:#e5452f30; --hover:#ffffff0c; --canvas-bg:#0e0e0e;
  --checker-a:#555352; --checker-b:#424040;
}
[data-theme=oxblood]{
  --bg:#170f10; --bg2:#1d1315; --panel:#24181a; --panel2:#2b1d20; --raise:#352428; --line:#3d2a2e; --line2:#4f373c;
  --tx:#f0e2df; --tx2:#c2a9a6; --mute:#8f7572; --acc:#ec6f7f; --acc-d:#a8404f; --acc-tx:#1e0a0d;
  --sec:#9cc2a0; --sec-d:#5e8a63; --warn:#ff8a5c; --sel:#ec6f7f30; --hover:#ffffff0c; --canvas-bg:#110b0c;
  --checker-a:#5c5052; --checker-b:#473d3f;
}
[data-theme=tide]{
  --bg:#0d1517; --bg2:#111b1e; --panel:#152225; --panel2:#1a292d; --raise:#213337; --line:#28393e; --line2:#35494f;
  --tx:#dcebea; --tx2:#9fb9b8; --mute:#6f8a8a; --acc:#4fd6b0; --acc-d:#2a9378; --acc-tx:#04140f;
  --sec:#ff8f6b; --sec-d:#b85a3d; --sel:#4fd6b02e; --hover:#ffffff0c; --canvas-bg:#091012;
  --checker-a:#4e5859; --checker-b:#3c4546;
}
[data-theme=fjord]{
  --bg:#1b1f26; --bg2:#20252d; --panel:#262c35; --panel2:#2c333d; --raise:#353d49; --line:#3b4350; --line2:#4b5563;
  --tx:#e4e9f0; --tx2:#aeb8c6; --mute:#7c8796; --acc:#8fc6d9; --acc-d:#5a90a3; --acc-tx:#0d1a20;
  --sec:#e3a77a; --sec-d:#a6714a; --sel:#8fc6d930; --hover:#ffffff0c; --canvas-bg:#15181e;
  --checker-a:#565b63; --checker-b:#43474e;
}
[data-theme=market]{
  --bg:#0e111c; --bg2:#121626; --panel:#171c2e; --panel2:#1c2236; --raise:#252c44; --line:#2a3249; --line2:#38415c;
  --tx:#e8eaf3; --tx2:#a9afc6; --mute:#767d98; --acc:#ffd23f; --acc-d:#b8931c; --acc-tx:#1a1400;
  --sec:#ff4f8b; --sec-d:#b3305d; --sel:#ffd23f2b; --hover:#ffffff0c; --canvas-bg:#0a0c15;
  --checker-a:#50535f; --checker-b:#3d404b;
}
[data-theme=dmg]{
  --bg:#162310; --bg2:#1c2c14; --panel:#22361a; --panel2:#29411f; --raise:#324d26; --line:#3a552c; --line2:#4b6a39;
  --tx:#dcebb0; --tx2:#adc47f; --mute:#80995a; --acc:#9bbc0f; --acc-d:#6b8a0a; --acc-tx:#0f380f;
  --sec:#e6c84f; --sec-d:#a68b25; --ok:#9bbc0f; --sel:#9bbc0f33; --hover:#ffffff0c; --canvas-bg:#0f1a0a;
  --checker-a:#5a6b4a; --checker-b:#47563a;
}
[data-theme=phosphor]{
  --bg:#050705; --bg2:#080b08; --panel:#0b100b; --panel2:#0f160f; --raise:#152015; --line:#1a2a1a; --line2:#264026;
  --tx:#a6fca6; --tx2:#6bc96b; --mute:#478f47; --acc:#3dff6e; --acc-d:#1fa844; --acc-tx:#021004;
  --sec:#ffb000; --sec-d:#a87400; --warn:#ff5544; --ok:#3dff6e; --sel:#3dff6e26; --hover:#3dff6e0d; --canvas-bg:#030403;
  --checker-a:#3a423a; --checker-b:#2b312b; --shadow:0 10px 30px #000c;
}
[data-theme=chalk]{
  --bg:#e6e8ea; --bg2:#eef0f2; --panel:#f4f5f6; --panel2:#fafbfb; --raise:#ffffff; --line:#d3d7db; --line2:#bcc2c8;
  --tx:#1c2024; --tx2:#454c54; --mute:#78808a; --acc:#e0412f; --acc-d:#a82a1c; --acc-tx:#ffffff;
  --sec:#16867a; --sec-d:#0e5c53; --warn:#c8321f; --ok:#3f8f2f; --sel:#e0412f24; --hover:#0000000a; --shadow:0 10px 30px #1c202430;
  --canvas-bg:#d6d9dd; --checker-a:#f2f3f4; --checker-b:#d7dade;
}
[data-theme=matcha]{
  --bg:#d8dcc8; --bg2:#e1e5d2; --panel:#e9ecdd; --panel2:#f1f3e8; --raise:#fafbf4; --line:#c3c9ae; --line2:#adb594;
  --tx:#1f2716; --tx2:#435036; --mute:#6f7a60; --acc:#4d7a1f; --acc-d:#335413; --acc-tx:#f4f9ea;
  --sec:#b5562e; --sec-d:#7f3a1d; --warn:#b8382a; --ok:#4d7a1f; --sel:#4d7a1f26; --hover:#0000000a; --shadow:0 10px 30px #2d361f40;
  --canvas-bg:#c9cfb6; --checker-a:#eceee3; --checker-b:#d0d4c2;
}
[data-theme=blossom]{
  --bg:#ecdde0; --bg2:#f2e5e8; --panel:#f7ecee; --panel2:#fbf3f4; --raise:#fffafb; --line:#e0c8cd; --line2:#cfafb6;
  --tx:#2c1a1f; --tx2:#5a4047; --mute:#8c6f76; --acc:#c2305a; --acc-d:#8c1d3e; --acc-tx:#fff3f6;
  --sec:#2f7f72; --sec-d:#1d564c; --warn:#b8282a; --ok:#3f8a4a; --sel:#c2305a22; --hover:#0000000a; --shadow:0 10px 30px #5a2a3540;
  --canvas-bg:#e0cdd1; --checker-a:#f6eef0; --checker-b:#dfd2d5;
}
[data-theme=solar]{
  --bg:#eee8d5; --bg2:#f3eddb; --panel:#f7f1df; --panel2:#fdf6e3; --raise:#fffbef; --line:#ddd5bd; --line2:#c9c0a5;
  --tx:#073642; --tx2:#3e5961; --mute:#7f8f8f; --acc:#268bd2; --acc-d:#1a6399; --acc-tx:#fdf6e3;
  --sec:#cb4b16; --sec-d:#93350f; --warn:#dc322f; --ok:#859900; --sel:#268bd224; --hover:#0000000a; --shadow:0 10px 30px #07364230;
  --canvas-bg:#e2dbc6; --checker-a:#f5f0e1; --checker-b:#ddd6c3;
}
:root{color-scheme:dark}
:root[data-theme=paper],:root[data-theme=chalk],:root[data-theme=matcha],:root[data-theme=blossom],:root[data-theme=solar]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.35 var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
input,select,textarea,button{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--panel);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-rows:30px 1fr var(--tl-h,214px) 22px;grid-template-columns:1fr}
#app.zen{grid-template-rows:0 1fr 0 0}#app.zen #main{grid-template-columns:1fr}#app.zen #menubar,#app.zen #timeline,#app.zen #statusbar,#app.zen #leftcol,#app.zen #rightcol,#app.zen .split{display:none}

/* menubar */
#menubar{display:flex;align-items:stretch;background:var(--bg2);border-bottom:1px solid var(--line);position:relative;z-index:50}
.logo{display:flex;align-items:center;gap:7px;padding:0 12px 0 10px;font-weight:700;letter-spacing:.3px;color:var(--tx);font-family:var(--mono);font-size:12px}
.logo canvas{image-rendering:pixelated;width:18px;height:18px}
.menu{position:relative}
.menu>.mt{height:100%;padding:0 10px;display:flex;align-items:center;cursor:default;color:var(--tx2)}
.menu.open>.mt,.menu>.mt:hover{background:var(--raise);color:var(--tx)}
.dd{position:absolute;top:100%;left:0;min-width:230px;background:var(--panel2);border:1px solid var(--line2);border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow);padding:4px;display:none;z-index:60}
.menu.open>.dd{display:block}
.mi{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:4px;white-space:nowrap;cursor:default;position:relative}
.mi:hover{background:var(--acc);color:var(--acc-tx)}.mi:hover .kb{color:var(--acc-tx)}
.mi.dis{opacity:.4;pointer-events:none}
.mi .ck{width:12px;text-align:center;font-family:var(--mono)}
.mi .kb{margin-left:auto;padding-left:18px;color:var(--mute);font-family:var(--mono);font-size:11px}
.mi.sub::after{content:"\203A";margin-left:auto;padding-left:14px}
.mi .dd{left:100%;top:-5px;border-radius:var(--r)}
.mi.sub:hover>.dd{display:block}
.msep{height:1px;background:var(--line);margin:4px 2px}
.mlabel{padding:5px 9px 2px;color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.8px}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:2px;padding-right:6px}
.gt{height:24px;min-width:26px;padding:0 6px;border:1px solid transparent;background:none;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--tx2);cursor:pointer}
.gt:hover{background:var(--raise);color:var(--tx)}
.gt.on{background:var(--sel);border-color:var(--acc-d);color:var(--tx)}
.gt img,.ibtn img,.tbtn img{image-rendering:pixelated;pointer-events:none}
.gsep{width:1px;height:16px;background:var(--line2);margin:0 4px}

/* main */
#main{display:grid;grid-template-columns:var(--lc-w,292px) 4px 1fr 4px var(--rc-w,288px);min-height:0}
.split{background:var(--bg);cursor:col-resize;position:relative;z-index:5}.split:hover,.split.drag{background:var(--acc-d)}
.hsplit{height:4px;cursor:row-resize;background:var(--bg)}.hsplit:hover,.hsplit.drag{background:var(--acc-d)}
#leftcol{display:grid;grid-template-columns:76px 1fr;min-height:0;background:var(--panel)}
#tools{background:var(--bg2);border-right:1px solid var(--line);padding:6px 5px;display:grid;grid-template-columns:32px 32px;grid-auto-rows:32px;gap:3px;align-content:start;overflow-y:auto}
.tbtn{position:relative;border:1px solid var(--line);background:var(--panel2);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tbtn:hover{border-color:var(--line2);background:var(--raise)}
.tbtn.l{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.tbtn.r{border-color:var(--sec);box-shadow:inset 0 0 0 1px var(--sec)}
.tbtn.l.r{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--sec)}
.tbtn .m{position:absolute;bottom:1px;width:7px;height:3px;border-radius:1px}
.tbtn .ml{left:2px;background:var(--acc)}.tbtn .mr{right:2px;background:var(--sec)}
.tsep{grid-column:1/3;height:1px;background:var(--line);margin:2px 0}
#optcol{overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.panel{border-bottom:1px solid var(--line);background:var(--panel)}
.ph{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:600;color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.7px;cursor:default}
.ph .dot{width:8px;height:8px;border-radius:2px}
.ph .sp{margin-left:auto}
.pb{padding:8px}
.panel.collapsed .pb{display:none}
.opt-l .ph{box-shadow:inset 3px 0 0 var(--acc)}.opt-r .ph{box-shadow:inset 3px 0 0 var(--sec)}
.orow{display:flex;align-items:center;gap:6px;margin:0 0 7px;min-height:22px}
.orow>label:first-child{flex:0 0 62px;color:var(--tx2)}
.orow .grow{flex:1;min-width:0}
.ohint{color:var(--mute);font-size:11px;margin:2px 0 6px;line-height:1.4}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:3px 6px;cursor:pointer;color:var(--tx2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--acc);color:var(--acc-tx)}
.opt-r .seg button.on{background:var(--sec);color:#fff}
input[type=number],input[type=text],select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:3px 6px;height:24px;min-width:0;outline:none}
textarea{height:auto;resize:vertical}
input[type=number]{width:62px;font-family:var(--mono)}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);margin:0}
input[type=range]{-webkit-appearance:none;appearance:none;height:18px;background:transparent;min-width:40px}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:3px;background:var(--acc);margin-top:-4px;border:1px solid var(--acc-d)}
input[type=range]::-moz-range-track{height:4px;background:var(--line2);border-radius:2px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:3px;background:var(--acc);border:1px solid var(--acc-d)}
.opt-r input[type=range]::-webkit-slider-thumb{background:var(--sec);border-color:var(--sec-d)}
.opt-r input[type=range]::-moz-range-thumb{background:var(--sec)}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--tx2)}
.btn{height:26px;padding:0 11px;border:1px solid var(--line2);background:var(--raise);border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc-d);color:var(--acc-tx);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:22px;padding:0 7px;font-size:11px}
.btn.danger{color:var(--warn)}
.ibtn{width:24px;height:24px;border:1px solid transparent;background:none;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2);padding:0;flex:0 0 auto}
.ibtn:hover{background:var(--raise);border-color:var(--line2);color:var(--tx)}
.ibtn.on{background:var(--sel);border-color:var(--acc-d);color:var(--tx)}
.ibtn:disabled{opacity:.35;pointer-events:none}

/* center */
#center{display:grid;grid-template-rows:28px 1fr;min-width:0;min-height:0;background:var(--canvas-bg)}
#tabs{display:flex;align-items:flex-end;gap:2px;padding:0 6px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.tab{height:24px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:5px 5px 0 0;color:var(--tx2);cursor:pointer;white-space:nowrap;max-width:220px}
.tab.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 2px 0 var(--acc)}
.tab .tx{overflow:hidden;text-overflow:ellipsis}.tab .x{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.tab .x:hover{background:var(--warn);color:#fff}
.tab .dirty{color:var(--acc)}
.tab-add{height:22px;width:24px;margin-bottom:1px}
#viewwrap{position:relative;display:grid;grid-template-columns:20px 1fr;grid-template-rows:20px 1fr;min-height:0;min-width:0}
#viewwrap.norulers{grid-template-columns:0 1fr;grid-template-rows:0 1fr}
.ruler{background:var(--bg2);position:relative;overflow:hidden}
#rul-c{background:var(--bg2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#rul-h{border-bottom:1px solid var(--line);cursor:s-resize}#rul-v{border-right:1px solid var(--line);cursor:e-resize}
.ruler canvas{position:absolute;inset:0;width:100%;height:100%}
#viewport{position:relative;overflow:hidden;min-width:0;min-height:0;outline:none;touch-action:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#viewport.c-none{cursor:none}#viewport.c-cross{cursor:crosshair}#viewport.c-move{cursor:move}#viewport.c-grab{cursor:grab}#viewport.c-grabbing{cursor:grabbing}#viewport.c-zoom{cursor:zoom-in}#viewport.c-text{cursor:text}#viewport.c-pick{cursor:copy}#viewport.c-ns{cursor:ns-resize}#viewport.c-ew{cursor:ew-resize}#viewport.c-nwse{cursor:nwse-resize}#viewport.c-nesw{cursor:nesw-resize}#viewport.c-ptr{cursor:pointer}
.vp-hud{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;align-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:3px;z-index:3}
.vp-hud .z{font-family:var(--mono);min-width:52px;text-align:center;color:var(--tx2);cursor:pointer}

/* shape chip & floating hints */
.chip{position:absolute;z-index:8;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:6px;min-width:210px;pointer-events:auto}
.chip .ct{display:flex;align-items:center;gap:6px;font-weight:600}
.chip .ct .b{color:var(--acc);font-family:var(--mono)}
.chip .alts{display:flex;flex-wrap:wrap;gap:4px}
.chip .alt{border:1px solid var(--line2);background:var(--raise);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px}
.chip .alt.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc-d)}
.chip .alt .n{opacity:.6;margin-right:4px;font-family:var(--mono)}
.chip .crow{display:flex;gap:4px;align-items:center}
.chip .hint{color:var(--mute);font-size:10.5px}
.vhint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:4px 12px;color:var(--tx2);z-index:7;pointer-events:none;white-space:nowrap;transition:opacity .2s}

/* right column */
#rightcol{background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden}
.cbig{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.cslot{width:44px;height:30px;border-radius:5px;border:2px solid var(--line2);cursor:pointer;position:relative;background-image:linear-gradient(45deg,#888 25%,transparent 25%,transparent 75%,#888 75%),linear-gradient(45deg,#888 25%,#bbb 25%,#bbb 75%,#888 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.cslot i{position:absolute;inset:0;border-radius:3px}
.cslot.act{outline:2px solid var(--tx);outline-offset:1px}
.cslot.l{border-color:var(--acc)}.cslot.r{border-color:var(--sec)}
.cslot b{position:absolute;top:calc(100% + 6px);left:-4px;right:-4px;text-align:center;font-size:9px;line-height:1;font-weight:600;color:var(--mute);letter-spacing:.5px}
#sv,#hue,#alpha{display:block;width:100%;border-radius:4px;cursor:crosshair;border:1px solid var(--line2)}
#sv{height:140px}#hue,#alpha{height:14px;margin-top:6px}
.cinputs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.cinputs label{display:flex;flex-direction:column;gap:2px;color:var(--mute);font-size:10px}
.cinputs input{width:100%;padding:2px 4px;height:22px}
.ramp{display:flex;margin-top:8px;border-radius:4px;overflow:hidden;border:1px solid var(--line2);height:18px}
.ramp div{flex:1;cursor:pointer}.ramp div:hover{outline:2px solid var(--tx);outline-offset:-2px}
.recent{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap;min-height:14px}
.recent div{width:14px;height:14px;border-radius:3px;border:1px solid var(--line2);cursor:pointer}
#palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--sw,18px),1fr));gap:2px;margin-top:6px;max-height:190px;overflow-y:auto;padding:1px}
.swatch{aspect-ratio:1;border-radius:3px;cursor:pointer;position:relative;border:1px solid #0005}
.swatch:hover{transform:scale(1.15);z-index:1;box-shadow:0 2px 6px #0008}
.swatch.l::before,.swatch.r::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;border:1px solid #000a}
.swatch.l::before{left:1px;top:1px;background:var(--acc)}.swatch.r::after{right:1px;bottom:1px;background:var(--sec)}
.swatch.dragover{outline:2px dashed var(--tx)}
.swatch.empty{background:repeating-linear-gradient(45deg,var(--bg2) 0 3px,var(--panel2) 3px 6px)}
.prow{display:flex;gap:4px;align-items:center}
.prow select{flex:1}
#prevbox{position:relative;background:var(--canvas-bg);border:1px solid var(--line);border-radius:4px;height:170px;overflow:hidden}
#prevcv{position:absolute;inset:0;width:100%;height:100%}
.rtabs{display:flex;gap:1px;flex-wrap:wrap;min-width:0}
.ph:has(.rtabs){height:auto;min-height:26px;padding-block:2px}
.rtabs button{border:0;background:none;color:var(--mute);padding:3px 4px;border-radius:3px;cursor:pointer;font-size:10px;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.rtabs button:hover{color:var(--tx2)}
.rtabs button.on{color:var(--tx);background:var(--raise)}
#histlist{max-height:180px;overflow-y:auto;font-size:11.5px}
.hrow{padding:3px 6px;border-radius:3px;cursor:pointer;display:flex;gap:6px}
.hrow:hover{background:var(--hover)}.hrow.on{background:var(--sel)}.hrow.fut{opacity:.45}
.hrow .n{color:var(--mute);font-family:var(--mono);width:22px}

/* timeline */
#timeline{display:grid;grid-template-rows:4px 30px 1fr;background:var(--panel);border-top:1px solid var(--line);min-height:0}
#tlbar{display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
#tlbar .grp{display:flex;align-items:center;gap:1px;padding:0 4px;border-right:1px solid var(--line);height:22px}
#tlbar .grp:last-child{border-right:0}
#tlbar label{color:var(--mute);margin:0 3px 0 4px}
#tlbody{display:grid;grid-template-columns:var(--ly-w,250px) 1fr;min-height:0;overflow:hidden}
#tlhead-l{height:38px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 4px;background:var(--panel2)}
#layercol{display:grid;grid-template-rows:38px 1fr;border-right:1px solid var(--line);min-height:0}
#layerlist{overflow:hidden;position:relative}
#celsarea{display:grid;grid-template-rows:38px 1fr;min-width:0;min-height:0}
#framehead{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--panel2)}
#celgrid{overflow:auto;position:relative}
.lrow{height:var(--cel,36px);display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.lrow:hover{background:var(--hover)}
.lrow.on{background:var(--sel)}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:3px}
.lrow .nm input{width:100%;height:20px}
.lrow .tw{width:14px;color:var(--mute);text-align:center;font-size:10px}
.lrow .tag{font-size:9px;font-family:var(--mono);padding:0 3px;border-radius:2px;background:var(--raise);color:var(--mute)}
.lrow.drop-above{box-shadow:inset 0 2px 0 var(--acc)}.lrow.drop-below{box-shadow:inset 0 -2px 0 var(--acc)}.lrow.drop-in{outline:2px dashed var(--acc);outline-offset:-2px}
.lrow .ibtn{width:20px;height:20px}
.lrow.hiddenL .nm{opacity:.45}
.lrow.clip .nm::before{content:"\21B3 ";color:var(--sec)}
.fcol{position:absolute;top:0;height:100%;border-right:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;font-family:var(--mono);font-size:11px;color:var(--mute);cursor:pointer}
.fcol.on{color:var(--acc-tx);background:var(--acc)}
.fcol .du{position:absolute;top:17px;right:2px;font-size:9px;color:inherit;opacity:.85}
.tagbar{position:absolute;top:2px;height:14px;border-radius:3px;font-size:10px;padding:0 5px;color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:inset 0 -2px 0 #0003;text-shadow:0 1px 0 #0006}
.cel{position:absolute;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cel.cf{background:#ffffff08}
.cel.on{background:var(--sel);box-shadow:inset 0 0 0 2px var(--acc)}
.cel.ms{box-shadow:inset 0 0 0 2px var(--sec)}
.cel canvas{image-rendering:pixelated;max-width:calc(100% - 8px);max-height:calc(100% - 8px);background:repeating-conic-gradient(var(--checker-a) 0 25%,var(--checker-b) 0 50%) 0 0/8px 8px;border-radius:2px}
.cel.empty canvas{opacity:.35}
.cel .lk{position:absolute;left:2px;top:1px;width:6px;height:6px;border-radius:50%}
.cel.grp{background:repeating-linear-gradient(-45deg,transparent 0 5px,#ffffff06 5px 10px)}
.dropline{position:absolute;top:0;bottom:0;width:3px;background:var(--acc);pointer-events:none;z-index:4}

/* status */
#statusbar{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--bg2);border-top:1px solid var(--line);color:var(--mute);font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden}
#statusbar b{color:var(--tx2);font-weight:500}
#statusbar .r{margin-left:auto}
.sdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* dialogs */
.dlg-bg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:200;animation:fade .12s}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);min-width:340px;max-width:min(92vw,980px);max-height:90vh;display:flex;flex-direction:column}
.dlg-h{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:14px;overflow:auto}
.dlg-f{display:flex;justify-content:flex-end;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel2);border-radius:0 0 8px 8px}
.dlg-f .l{margin-right:auto}
.frm{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.frm>label{color:var(--tx2)}
.frm .full{grid-column:1/3}
.fx-wrap{display:grid;grid-template-columns:1fr 260px;gap:14px}
.fx-prev{background:var(--canvas-bg);border:1px solid var(--line);border-radius:6px;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fx-prev canvas{image-rendering:pixelated;max-width:100%;max-height:340px;background:repeating-conic-gradient(var(--checker-a) 0 25%,var(--checker-b) 0 50%) 0 0/12px 12px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets button{border:1px solid var(--line2);background:var(--raise);border-radius:5px;padding:7px 4px;cursor:pointer;text-align:center}
.presets button:hover,.presets button.on{border-color:var(--acc)}
.presets b{display:block;font-family:var(--mono)}.presets span{color:var(--mute);font-size:10.5px}
.kbtable{columns:2;column-gap:26px;font-size:12px}
.kbtable div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line);break-inside:avoid}
.kbtable .kbctl{display:flex;gap:4px;align-items:center}.kbtable .custom>span:first-child{color:var(--acc)}
.kbbtn{font:11px var(--mono);background:var(--raise);color:var(--tx);border:1px solid var(--line2);border-radius:3px;padding:1px 6px;cursor:pointer;min-width:44px}.kbbtn:hover{border-color:var(--acc)}.kbbtn.unset{opacity:.45}.kbbtn.rec{border-color:var(--acc);color:var(--acc)}
.kidx{position:fixed;z-index:110;display:flex;flex-direction:column;min-width:240px;min-height:180px;max-width:90vw;max-height:92vh;resize:both;overflow:hidden;background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);font-size:11.5px}
.kidx-h{display:flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:600;color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.7px;cursor:move;user-select:none}.kidx-h .sp{flex:1}
.kidx-h .kbx{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;border-radius:3px}.kidx-h .kbx.on{color:var(--acc);background:var(--raise)}
.kidx-q{padding:6px 8px;border-bottom:1px solid var(--line)}.kidx-q input{width:100%}
.kidx-b{flex:1;overflow-y:auto;padding:2px 8px 8px}
.kidx-b h5{margin:10px 0 3px;color:var(--acc);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px}
.kidx-r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 4px;border-bottom:1px dashed var(--line);cursor:pointer;border-radius:3px}.kidx-r:hover{background:var(--raise)}.kidx-r.static{cursor:default}.kidx-r.static:hover{background:none}
.kidx-r kbd{white-space:nowrap}.kidx-r kbd.unset{opacity:.4}
.kidx-f{padding:4px 8px;border-top:1px solid var(--line);color:var(--mute);font-size:10.5px}.kidx-none{padding:14px 4px;color:var(--mute)}
.kbx{background:none;border:0;color:var(--mute);cursor:pointer;padding:0 3px;font-size:13px}.kbx:hover{color:var(--acc)}
.kbtable h4{margin:10px 0 4px;color:var(--acc);font-size:11px;text-transform:uppercase;letter-spacing:.8px;break-after:avoid}
kbd,.kbd{font-family:var(--mono);font-size:10.5px;background:var(--raise);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--tx)}
.ctx{position:fixed;z-index:300;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);padding:4px;min-width:190px}
.toasts{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:400;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:7px 12px;border-radius:5px;box-shadow:var(--shadow);animation:pop .18s}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pop{position:fixed;z-index:120;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;box-shadow:var(--shadow);padding:10px;min-width:220px}
.pop h5{margin:0 0 8px;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
.pop .orow>label:first-child{flex-basis:90px}

/* splash */
.splash{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;width:min(860px,88vw)}
.splash .hero{border-radius:8px;background:var(--bg2);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.splash .hero canvas{image-rendering:pixelated;width:100%;border-radius:4px;background:var(--canvas-bg)}
.splash h2{margin:0;font-family:var(--mono);font-size:20px}
.splash p{margin:0;color:var(--tx2);line-height:1.5}
.bigbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line2);background:var(--raise);border-radius:7px;cursor:pointer;text-align:left;margin-bottom:6px}
.bigbtn:hover{border-color:var(--acc)}
.bigbtn b{display:block}.bigbtn span{color:var(--mute);font-size:11px}
.bigbtn .ic{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--bg2);font-family:var(--mono);font-weight:700;color:var(--acc);flex:0 0 auto}

/* tutorials */
.tour-mask{position:fixed;inset:0;z-index:500;pointer-events:none}
.tour-mask svg{width:100%;height:100%}
.tour-ring{position:fixed;z-index:501;border:2px solid var(--acc);border-radius:7px;box-shadow:0 0 0 4px var(--sel);pointer-events:none;transition:all .35s cubic-bezier(.3,.8,.3,1)}
.tour-card{position:fixed;z-index:502;width:330px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow);padding:14px;transition:left .35s,top .35s}
.tour-card h3{margin:0 0 6px;font-size:14px}
.tour-card p{margin:0 0 10px;color:var(--tx2);line-height:1.5}
.tour-card .task{background:var(--bg2);border:1px dashed var(--acc-d);border-radius:6px;padding:7px 9px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.tour-card .task.done{border-style:solid;border-color:var(--ok);color:var(--ok)}
.tour-card .row{display:flex;gap:6px;align-items:center}
.tour-card .row .c{color:var(--mute);font-family:var(--mono);margin-right:auto}
.tour-prog{height:3px;background:var(--line);border-radius:2px;margin-bottom:10px;overflow:hidden}.tour-prog i{display:block;height:100%;background:var(--acc)}
.demo-cursor{position:fixed;z-index:620;width:22px;height:22px;pointer-events:none;left:0;top:0;transform:translate(-3px,-2px);filter:drop-shadow(0 2px 2px #0009)}
.demo-cursor .ring{position:absolute;left:-12px;top:-12px;width:30px;height:30px;border-radius:50%;border:2px solid var(--acc);opacity:0;transform:scale(.3)}
.demo-cursor.click .ring{animation:ring .45s ease-out}
.demo-cursor.rclick .ring{border-color:var(--sec);animation:ring .45s ease-out}
.demo-cursor .btnlbl{position:absolute;left:20px;top:16px;font:600 10px var(--mono);background:var(--acc);color:var(--acc-tx);padding:0 4px;border-radius:3px;white-space:nowrap;opacity:0;transition:opacity .15s}
.demo-cursor.held .btnlbl{opacity:1}
@keyframes ring{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.4)}}
.demo-shield{position:fixed;inset:0;z-index:600;cursor:not-allowed}
.demo-bar{position:fixed;right:12px;bottom:30px;z-index:630;width:min(600px,calc(100vw - 24px));background:var(--panel2);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.demo-cap{padding:12px 14px 10px;font-size:13.5px;line-height:1.5;min-height:58px}
.demo-cap .ch{display:block;font:600 10.5px var(--mono);color:var(--acc);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.demo-ctl{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--line);background:var(--bg2)}
.demo-ctl .prog{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}.demo-ctl .prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.demo-keys{position:fixed;z-index:625;left:50%;top:70px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
.demo-keys kbd{font-size:16px;padding:4px 10px;box-shadow:var(--shadow);animation:pop .15s}
.demo-dots{display:flex;gap:3px;padding:0 14px 10px}
.demo-dots i{flex:1;height:6px;border-radius:2px;background:var(--line2);cursor:pointer;position:relative}
.demo-dots i.done{background:var(--acc-d)}.demo-dots i.on{background:var(--acc)}
.demo-dots i:hover{outline:1px solid var(--tx)}
#intro{position:fixed;inset:0;z-index:5000;background:#0f0d0b;cursor:pointer;touch-action:none;user-select:none}#intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.drop-zone{position:fixed;inset:12px;border:3px dashed var(--acc);border-radius:16px;z-index:700;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--acc);background:#0008;pointer-events:none}
/* theme picker */
.thm-dot{display:inline-flex;width:14px;height:14px;border-radius:3px;overflow:hidden;border:1px solid var(--line2);flex:none}
.thm-dot i{flex:1}
.thm-pop{width:476px;max-width:calc(100vw - 12px);padding:12px 12px 10px}
.thm-pop .thm-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.thm-pop .thm-head h5{margin:0}
.thm-pop .thm-head span{color:var(--mute);font-size:11px}
.thm-grp{color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin:10px 0 6px}
.thm-grp:first-of-type{margin-top:0}
.thm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thm-item{padding:0;border:0;background:none;border-radius:6px;cursor:pointer;outline:2px solid transparent;outline-offset:1px;transition:outline-color .12s,transform .12s}
.thm-item:hover{outline-color:var(--line2);transform:translateY(-1px)}
.thm-item:focus-visible{outline-color:var(--tx2)}
.thm-item.cur{outline-color:var(--acc)}
.thm-card{display:block;border:1px solid var(--line2);border-radius:5px;overflow:hidden;background:var(--bg);color:var(--tx);text-align:left}
.thm-mock{display:grid;grid-template-columns:12px 1fr 14px;grid-template-rows:7px 1fr;height:50px;background:var(--bg)}
.thm-mock .mb{grid-column:1/-1;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 3px}
.thm-mock .mb b{width:9px;height:3px;border-radius:1px;background:var(--mute)}.thm-mock .mb b:first-child{background:var(--acc)}
.thm-mock .rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:4px}
.thm-mock .rail i{width:6px;height:6px;border-radius:1px;background:var(--tx2)}.thm-mock .rail i:first-child{background:var(--acc)}
.thm-mock .cv{background:var(--canvas-bg);display:flex;align-items:center;justify-content:center}
.thm-mock .art{width:26px;height:22px;background:conic-gradient(var(--checker-a) 25%,var(--checker-b) 0 50%,var(--checker-a) 0 75%,var(--checker-b) 0) 0 0/6px 6px;position:relative;box-shadow:0 0 0 1px var(--line)}
.thm-mock .art::before{content:"";position:absolute;left:5px;top:5px;width:9px;height:9px;background:var(--acc)}
.thm-mock .art::after{content:"";position:absolute;right:4px;bottom:4px;width:7px;height:7px;background:var(--sec)}
.thm-mock .side{background:var(--panel2);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;padding:4px 3px}
.thm-mock .side i{height:3px;border-radius:1px;background:var(--line2)}.thm-mock .side i:nth-child(2){background:var(--sec)}
.thm-name{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:4px 6px;font-size:11px;background:var(--panel2);border-top:1px solid var(--line);white-space:nowrap}
.thm-name em{font-style:normal;color:var(--acc);font-family:var(--mono)}
.thm-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);color:var(--mute);font-size:11px}
.thm-foot kbd{font-family:var(--mono);font-size:10px;padding:0 4px;border:1px solid var(--line2);border-radius:3px;color:var(--tx2)}
.thm-foot button{background:var(--raise);border:1px solid var(--line2);border-radius:4px;padding:3px 8px;cursor:pointer;color:var(--tx2)}
.thm-foot button:hover{color:var(--tx);border-color:var(--acc-d)}
/* command palette */
.cmdk{display:flex;align-items:center;gap:7px;height:22px;margin:auto 0 auto 14px;padding:0 5px 0 7px;min-width:0;flex:0 1 250px;border:1px solid var(--line2);border-radius:5px;background:var(--panel);color:var(--mute);cursor:pointer;font-size:11.5px}
.cmdk:hover{border-color:var(--acc-d);color:var(--tx2)}
.cmdk>span{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk img{opacity:.7;image-rendering:pixelated}
@media (max-width:1380px){.cmdk{flex-basis:30px}.cmdk>span,.cmdk kbd{display:none}}
.cmd-bg{position:fixed;inset:0;z-index:250;background:#0007;animation:fade .1s}
.cmd{position:fixed;left:50%;top:10vh;transform:translateX(-50%);z-index:251;width:min(660px,94vw);max-height:74vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 24px 70px #000b;overflow:hidden;animation:cmdIn .14s cubic-bezier(.2,.9,.3,1)}
@keyframes cmdIn{from{opacity:0;transform:translate(-50%,-10px)}}
.cmd-q{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.cmd-q img{image-rendering:pixelated;opacity:.8}
.cmd-q input{flex:1;height:48px;border:0!important;background:none;font-size:15px;padding:0;outline:none}
.cmd-q .cnt{color:var(--mute);font:11px var(--mono);white-space:nowrap}
.cmd-l{overflow-y:auto;padding:5px;min-height:60px}
.cmd-h{padding:9px 10px 4px;color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.9px}
.cmd-r{display:flex;align-items:center;gap:10px;padding:0 10px;height:32px;border-radius:6px;cursor:pointer;position:relative}
.cmd-r.on{background:var(--sel)}
.cmd-r.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--acc)}
.cmd-r .cat{flex:0 0 76px;color:var(--mute);font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-r .ic{width:16px;height:16px;flex:0 0 16px;display:flex;align-items:center;justify-content:center;border-radius:3px}
.cmd-r .ic img{image-rendering:pixelated}
.cmd-r .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx);font-size:12.5px}
.cmd-r .lb mark{background:none;color:var(--acc);font-weight:700}
.cmd-r .lb .sub{color:var(--mute);margin-left:8px;font-size:11px}
.cmd-r .tick{color:var(--ok);font-weight:700;width:12px;text-align:center}
.cmd-r .pal{display:flex;height:12px;width:64px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line2)}.cmd-r .pal i{flex:1}
.cmd-r.dis{opacity:.42}
.cmd-f{display:flex;flex-wrap:wrap;gap:4px 16px;padding:7px 14px;border-top:1px solid var(--line);color:var(--mute);font-size:11px;background:var(--bg2)}
.cmd-f kbd{margin-right:4px}
.cmd-none{padding:26px 16px;color:var(--mute);text-align:center;line-height:1.6}

<script>
/* ================= GUIDED DEMO SCRIPT: "Slime bounce" ================= */
async function DemoScript(D) {
  const saved = { slots: JSON.stringify(App.slots), snapOn: Prefs.snapOn, symX: Prefs.symX, symY: Prefs.symY, symRadial: Prefs.symRadial, tile: Prefs.tile, onion: Prefs.onion, smart: Prefs.smartShapes, mirror: Prefs.mirrorView, loop: Prefs.loop };
  Object.assign(Prefs, { snapOn: false, symX: false, symY: false, symRadial: 0, tile: 'off', onion: false, smartShapes: true, mirrorView: false, loop: 'cycle' }); Bus.emit('prefs');
  App.slots = { left: { tool: 'pencil', opts: {} }, right: { tool: 'eraser', opts: {} } }; Bus.emit('tool');
  const restore = () => { try { App.slots = JSON.parse(saved.slots); Object.assign(Prefs, { snapOn: saved.snapOn, symX: saved.symX, symY: saved.symY, symRadial: saved.symRadial, tile: saved.tile, smartShapes: saved.smart, mirrorView: saved.mirror, loop: saved.loop }); savePrefs(); Bus.emit('tool'); Bus.emit('prefs'); updateTimelineBar(); } catch (e) {} };
  const layerId = name => { const e = App.p.flat().find(x => x.node.name === name); return e ? e.node.id : App.p.layerId; };
  const cel = (f, name) => `#celinner .cel[data-f="${f}"][data-l="${layerId(name)}"]`;
  const rename = async name => { await D.click('.lrow.on .nm', { dbl: true, after: 300 }); await D.type('.lrow.on .nm input', name, true); };
  const handleDrag = async (i, dx, dy) => { const hs = Float.handles(); const [x, y] = hs[i]; await D.drag([x - .5, y - .5], [x - .5 + dx, y - .5 + dy], { density: 2, after: 250 }); };
  try {
    /* 1 */ D.chapter(0);
    await D.say('Welcome! Let’s build a bouncing slime animation from nothing. The cursor you see is driving the real editor, so every click and stroke here works the same for you. Space pauses, Esc exits.', 5200);
    await D.menu('File', 'new');
    await D.say('New project. The presets cover common sprite sizes; 32 x 32 is plenty for a small character.', 3200);
    await D.click(D.dqa('.presets button').find(b => b.textContent.startsWith('32x32')));
    await D.type(D.dq('input[type=text]'), 'Slime bounce');
    await D.dlgBtn('Create');
    await D.say('Here is the canvas. The mouse wheel zooms around the cursor, Space+drag pans, and 0 fits everything back on screen.', 3600);
    await D.wheel(2); await D.wheel(-2); await D.key('0');

    /* 2 */ D.chapter(1);
    await D.focus('#p-palette', 900);
    await D.say('Pixel art lives and dies by its palette. Let’s switch to Endesga 32, a popular 32 color set.', 3200);
    await D.pickSelect('#pal-select', 'Endesga 32');
    await D.say('Left-click a swatch to set the LEFT color, right-click to set the RIGHT color. Each mouse button paints with its own color.', 3800);
    await D.swatch('#f6757a', 0); await D.swatch('#feae34', 2);
    await D.focus('#p-color', 1300);

    /* 3 */ D.chapter(2);
    await D.say('A sunset sky first. The Gradient tool blends the left color into the right one using ordered dithering, the classic pixel-art way to fake smooth transitions.', 4600);
    await D.tool('gradient'); await D.opt('left', 'style', 'dither');
    await D.drag([16, 0], [16, 25], { shift: true, density: 1, step: 30 });
    await D.say('Now the ground: Rectangle tool with fill set to the same color.', 2800);
    await D.swatch('#733e39'); await D.tool('rect'); await D.opt('left', 'fill', 'same');
    await D.drag([0, 26], [31, 31], { step: 22 });
    await D.say('A lighter edge with the Line tool. Holding Shift locks lines to clean pixel angles.', 3200);
    await D.swatch('#b86f50'); await D.tool('line');
    await D.drag([0, 26], [31, 26], { shift: true, step: 18 });
    await D.say('Double-click the layer name to rename it, then lock it so nothing paints over the background by accident.', 3600);
    await rename('Background');
    await D.click(() => $$('.lrow.on .ibtn')[1]);

    /* 4 */ D.chapter(3);
    await D.say('The slime gets its own layer. Layers keep parts of a drawing separate so you can change one without touching the other.', 3800);
    await D.click('#ly-add'); await rename('Slime');
    await D.swatch('#3e8948'); await D.tool('pencil');
    await D.say('Here is the trick. I’ll scribble a rough oval with the pencil and press Shift before letting go…', 3400);
    const pts = D.wobble(16, 20, 7.2, 4.3, 46, 11, 0.7);
    await D.stroke(pts, { shiftAt: pts.length - 2, hold: 300, step: 40, after: 600 });
    if (Smart.pending) {
      await D.say('Smart shapes read it as an ellipse and cleaned it up. The chip lists other guesses. If it ever calls your circle an oval, one click fixes it:', 4400);
      const alt = name => $$('#shape-chip .alt').find(b => b.textContent.replace(/^\d/, '').trim() === name);
      if (alt('Circle')) { await D.click(alt('Circle'), { after: 900 }); await D.say('…and back to the ellipse. Tab cycles through the guesses too.', 2400); }
      if (alt('Ellipse')) await D.click(alt('Ellipse'), { after: 600 });
      await D.say('The orange handles still adjust it. Let’s sit it right on the ground.', 2800);
      if (Smart.pending && Smart.pending.shape.type === 'ellipse' && !Smart.pending.shape.th) {
        const s = Smart.pending.shape; const tl = [s.cx - s.a, s.cy - s.b]; await D.drag(tl, [9, 16], { density: 1, after: 250 });
        const s2 = Smart.pending.shape; await D.drag([s2.cx + s2.a, s2.cy + s2.b], [23, 24], { density: 1, after: 300 });
      }
      await D.say('F toggles the fill, Enter applies it.', 2200);
      await D.key('F', { after: 500 }); await D.key('Enter', { after: 500 });
    } else { // fallback if detection was disabled somehow
      await D.tool('ellipse'); await D.opt('left', 'fill', 'same'); await D.drag([9, 16], [23, 25]);
    }

    /* 5 */ D.chapter(4);
    await D.say('Effects work on whole cels with a live preview. Outline wraps the slime in a dark border using the left color.', 3600);
    await D.swatch('#193c3e');
    await D.menu('Effects', 'fx_outline');
    await D.say('Preview on the left, settings on the right. Leaving diagonals off keeps the outline chunky.', 3200);
    await D.dlgBtn('Apply');
    await D.say('Shading tool: it only touches pixels that are already there. With hue shift on, highlights drift warm and shadows drift cool, which reads far richer than plain lighter and darker.', 4800);
    await D.tool('shading'); await D.opt('left', 'shape', 'circle'); await D.optRange('left', 'size', 2); await D.optRange('left', 'amount', 18); await D.optRange('left', 'hueShift', 30);
    await D.stroke([[11, 19.5], [11.6, 18.5], [12.6, 17.6], [14, 17], [16, 17], [17.5, 17.2]], { step: 70 });
    await D.opt('left', 'darken', true);
    await D.stroke([[11, 22], [13, 22.6], [16, 22.8], [19, 22.6], [20.5, 21.8]], { step: 70 });

    /* 6 */ D.chapter(5);
    await D.say('Now a face. Back to the pencil at 1 pixel.', 2200);
    await D.tool('pencil'); await D.swatch('#181425');
    await D.drag([13, 20], [13, 21], { step: 60 }); await D.drag([19, 20], [19, 21], { step: 60 });
    await D.swatch('#ffffff'); await D.drag([12, 18], [13, 18], { step: 60 });
    await D.say('Alt+click picks a color straight from the canvas. Handy when you need the exact body color again.', 3200);
    await D.clickCanvas(16, 21, { alt: true, after: 400 });
    await D.swatch('#193c3e'); await D.stroke([[15, 22], [16, 23], [17, 22]], { step: 90 });
    await D.focus('#p-preview', 900);

    /* 7 */ D.chapter(6);
    await D.say('Time to animate. Duplicate the frame a few times; every copy starts identical and we adjust from there.', 3400);
    for (let i = 0; i < 5; i++) await D.click('#fr-dup', { after: 220 });
    await D.say('The background never changes, so link its cels: linked cels share pixels, edit one and all of them update.', 3800);
    await D.click(cel(0, 'Background')); await D.click(cel(5, 'Background'), { shift: true }); await D.click('#fr-link', { after: 700 });
    await D.say('Onion skin shows neighbouring frames as tinted ghosts, red for the past and teal for the future.', 3200);
    await D.click('#onionbtn', { after: 500 });

    /* 8 */ D.chapter(7);
    await D.say('Squash and stretch sells the bounce. On frame 2 the slime squashes down to gather energy. Select the layer content with Ctrl+Shift+A, then scale it with the Move tool handles.', 5200);
    await D.tool('move');
    const frameEdit = async (f, sx, top, up, text) => {
      await D.click(cel(f, 'Slime'), { after: 300 }); if (text) await D.say(text, 2600);
      await D.key('A', { ctrl: true, shift: true, after: 300 });
      if (!Float.active() && !Float.lift()) return;
      if (top) await handleDrag(4, 0, top);
      if (sx) { await handleDrag(7, -sx, 0); await handleDrag(5, sx, 0); }
      if (up) { const f0 = Float.f; await D.drag([f0.x + f0.sw / 2 - .5, f0.y + f0.sh / 2 - .5], [f0.x + f0.sw / 2 - .5, f0.y + f0.sh / 2 - .5 - up], { density: 1, after: 250 }); }
      await D.key('Enter', { after: 400 });
    };
    await frameEdit(1, 1, 2, 0);
    await frameEdit(2, -1, -2, 5, 'Frame 3: launch. Stretch it tall and thin, then drag it upward.');
    await frameEdit(3, 0, 0, 9, 'Frame 4: the top of the jump, back to its normal shape.');
    await frameEdit(4, -1, -2, 4, 'Frame 5: falling, stretched again.');
    await frameEdit(5, 1, 2, 0, 'Frame 6: the landing squash.');
    await D.key('D', { ctrl: true, after: 300 });

    /* 9 */ D.chapter(8);
    await D.say('Timing matters as much as drawing. Double-click a frame number to hold it longer: the resting pose gets twice the time.', 3800);
    await D.click('#frameinner .fcol', { dbl: true, after: 500 });
    await D.type(D.dq('input[type=number]'), '2'); await D.dlgBtn('Apply');
    await D.say('10 frames per second suits this bounce.', 2000);
