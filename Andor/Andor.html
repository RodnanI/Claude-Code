class Gate extends Entity {
  constructor(x, y, tiles) {
    super(x, y, 16, tiles * 16);
    this.tiles = tiles;
    this.openT = 0;
    this.opening = false;
    this.layer = 2;
  }
  open() {
    if (this.opening) return;
    this.opening = true;
    Sfx.play('gate');
  }
  update(dt, level) {
    if (this.opening && this.openT < 1) {
      this.openT = Math.min(1, this.openT + dt * 0.9);
      Cam.shake(0.8, 0.05);
      if (this.openT > 0.5) for (let i = 0; i < this.tiles; i++) level.setTile(this.x / 16, this.y / 16 + i, T.EMPTY);
      if (Math.random() < 0.4) Parts.dust(this.cx, this.y + this.h * (1 - this.openT), 1, '#9c8b6a');
    }
  }
  draw(g, cam) {
    const lift = Math.round(this.openT * this.h);
    const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y) - lift;
    const h = this.h;
    g.save();
    g.beginPath();
    g.rect(x - 1, Math.round(this.y - cam.y), 18, h);
    g.clip();
    for (let i = 0; i < 4; i++) {
      fillR(g, x + 1 + i * 4, y, 2, h, '#3a3530');
      fillR(g, x + 1 + i * 4, y, 1, h, '#6e665c');
    }
    for (let yy = 4; yy < h; yy += 10) {
      fillR(g, x, y + yy, 16, 2, '#4a443c');
      fillR(g, x, y + yy, 16, 1, '#7a7268');
    }
    for (let i = 0; i < 4; i++) fillR(g, x + 1 + i * 4, y + h - 3, 2, 3, '#8a8278');
    g.restore();
  }
}

class Crumble extends Entity {
  constructor(x, y) {
    super(x, y, 16, 16);
    this.state = 'idle';
    this.timer = 0;
    this.layer = 0;
    this.tx = x / 16;
    this.ty = y / 16;
  }
  update(dt, level) {
    const p = this.player;
    if (this.state === 'idle') {
      if (p && p.onGround && p.y + p.h <= this.y + 1 && p.y + p.h >= this.y - 1 && p.x + p.w > this.x && p.x < this.x + 16) {
        this.state = 'shake';
        this.timer = 0.42;
        Sfx.play('crumble');
      }
    } else if (this.state === 'shake') {
      this.timer -= dt;
      if (Math.random() < 0.3) Parts.add({ x: this.x + rnd(16), y: this.y + 16, vy: 30, life: 0.4, col: '#8a7a60', g: 300 });
      if (this.timer <= 0) {
        this.state = 'gone';
        this.timer = 3.2;
        level.setTile(this.tx, this.ty, T.EMPTY);
        Parts.burst(this.cx, this.cy, 12, { col: this.debrisCols(level), speed: 70, g: 500, life: 0.8, s: 2 });
        Sfx.play('rockfall');
      }
    } else if (this.state === 'gone') {
      this.timer -= dt;
      if (this.timer <= 0 && !(p && overlap(p, this))) {
        this.state = 'idle';
        level.setTile(this.tx, this.ty, T.CRUMBLE);
        Parts.dust(this.cx, this.y + 8, 5, '#d8c8a6');
      }
    }
  }
  debrisCols(level) {
    const th = level.theme.name;
    return th === 'tomb' ? ['#c9b896', '#9c8b6a'] : th === 'andor' ? ['#4a4038', '#dea12a'] : th === 'desert' ? ['#d29659', '#a8693a'] : ['#d1a066', '#9c6a37'];
  }
  draw(g, cam) {
    if (this.state === 'gone') return;
    if (!this.c) {
      const pb = new OffBuf(16, 16, this.x, this.y);
      const n = { u: false, d: false, l: false, r: false };
      Game.level.theme.solid(pb, this.x, this.y, this.tx, this.ty, n);
      // fracture lines
      const crack = C('#1a120c');
      for (const [x0, y0, x1, y1] of [[3, 2, 7, 8], [7, 8, 5, 14], [7, 8, 12, 11], [12, 11, 14, 6]]) pb.line(this.x + x0, this.y + y0, this.x + x1, this.y + y1, crack);
      this.c = pb.toCanvas();
    }
    const sh = this.state === 'shake' ? Math.round(rnd(-1, 1)) : 0;
    g.drawImage(this.c, Math.round(this.x - cam.x + sh), Math.round(this.y - cam.y));
  }
}

// A beam of daylight falling from a crack in the ceiling to the floor.
class LightShaft extends Entity {
  constructor(x, y) {
    super(x, y, 16, 16);
    this.layer = 2;
    const L = Game.level;
    let ty = Math.floor(y / TILE);
    while (ty < L.h && !isSolidT(L.tileAt(Math.floor(x / TILE), ty)) && !isOneWayT(L.tileAt(Math.floor(x / TILE), ty))) ty++;
    this.bottom2 = ty * TILE;
  }
  update(dt) {
    this.t += dt;
    if (Math.random() < dt * 4) Parts.add({ x: this.x + rnd(-6, 22), y: lerp(this.y, this.bottom2, Math.random()), vx: rnd(-3, 3), vy: rnd(-4, 4), life: 2, col: '#fff1b3', g: 0, front: false });
  }
  draw(g, cam) {
    const x = Math.round(this.x - cam.x), y0 = Math.round(this.y - cam.y), y1 = Math.round(this.bottom2 - cam.y);
    g.globalCompositeOperation = 'lighter';
    for (let y = y0; y < y1; y++) {
      const u = (y - y0) / Math.max(1, y1 - y0);
      const w = Math.round(10 + u * 14);
      g.globalAlpha = 0.07 + 0.04 * Math.sin(this.t * 2 + y * 0.05);
      fillR(g, x + 8 - w / 2 + u * 6, y, w, 1, '#fff1b3');
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }
  light() {
    for (let y = this.y; y < this.bottom2; y += 40) Lighting.add(this.cx + (y - this.y) * 0.2, y, 34, '#fff1b3', 0.9);
    Lighting.add(this.cx + 6, this.bottom2 - 6, 50, '#fff1b3', 1);
  }
}

class MovingPlatform extends Entity {
  constructor(x, y, vertical, wTiles = 3) {
    super(x, y, wTiles * 16, 6);
    this.vertical = vertical;
    this.speed = vertical ? 34 : 42;
    this.dir = 1;
    this.dx = 0;
    this.dy = 0;
    this.layer = 0;
    this.wait = 0;
  }
  update(dt, level) {
    const ox = this.x, oy = this.y;
    if (this.wait > 0) this.wait -= dt;
    else if (this.vertical) {
      this.y += this.dir * this.speed * dt;
      const probe = this.dir > 0 ? this.y + 6 : this.y - 1;
      if (level.rectSolid(this.x + 2, probe, this.w - 4, 1) || this.hitStop(probe, true)) {
        this.dir *= -1;
        this.wait = 0.5;
        this.y = oy;
      }
    } else {
      this.x += this.dir * this.speed * dt;
      const probe = this.dir > 0 ? this.x + this.w : this.x - 1;
      if (level.rectSolid(probe, this.y, 1, 6) || this.hitStop(probe, false)) {
        this.dir *= -1;
        this.wait = 0.4;
        this.x = ox;
      }
    }
    this.dx = this.x - ox;
    this.dy = this.y - oy;
    // carry the rider vertically
    const p = this.player;
    if (p && p.platform === this && this.dy) p.y += this.dy;
  }
  hitStop(probe, vert) {
    for (const s of Game.stoppers) {
      if (vert) {
        if (Math.abs(s.x - this.cx) < this.w / 2 + 8 && probe >= s.y && probe <= s.y + 16) return true;
      } else if (probe >= s.x && probe <= s.x + 16 && Math.abs(s.y - this.y) < 16) return true;
    }
    return false;
  }
  draw(g, cam) {
    const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y);
    const th = Game.level.theme.name;
    const top = th === 'andor' ? '#f4cf62' : th === 'tomb' ? '#d8c8a6' : '#b07a45';
    const mid = th === 'andor' ? '#a86d16' : th === 'tomb' ? '#9c8b6a' : '#8b5a34';
    const bot = th === 'andor' ? '#6e3f10' : th === 'tomb' ? '#6b5d48' : '#5e3a20';
    fillR(g, x, y, this.w, 6, '#1a120c');
    fillR(g, x + 1, y + 1, this.w - 2, 1, top);
    fillR(g, x + 1, y + 2, this.w - 2, 2, mid);
    fillR(g, x + 1, y + 4, this.w - 2, 1, bot);
    for (let i = 4; i < this.w - 2; i += 8) fillR(g, x + i, y + 2, 1, 2, bot);
    if (th === 'andor') {
      g.globalAlpha = 0.5 + 0.3 * Math.sin(Game.time * 4);
      fillR(g, x + this.w / 2 - 3, y + 6, 6, 1, '#79f0a5');
      g.globalAlpha = 1;
    } else {
      // ropes up out of view
      fillR(g, x + 3, y - 40, 1, 40, '#3a2a1a');
      fillR(g, x + this.w - 4, y - 40, 1, 40, '#3a2a1a');
    }
  }
}

class SwingBlade extends Entity {
  constructor(x, y, phase) {
    super(x + 8, y + 2, 1, 1);
    this.px = x + 8;
    this.py = y + 2;
    // reach down to chest height above whatever floor or ledge lies beneath
    const L = Game.level;
    let ty = Math.floor(y / TILE) + 1;
    while (ty < L.h && !isSolidT(L.tileAt(Math.floor(x / TILE), ty)) && !isOneWayT(L.tileAt(Math.floor(x / TILE), ty)) && !isSpikeT(L.tileAt(Math.floor(x / TILE), ty))) ty++;
    this.len = clamp(ty * TILE - this.py - 14, 30, 150);
    this.phase = phase;
    this.layer = 2;
    this.ang = 0;
  }
  update(dt) {
    this.t += dt;
    this.ang = Math.sin(this.t * 2.6 + this.phase) * 1.15;
    const bx = this.px + Math.sin(this.ang) * this.len, by = this.py + Math.cos(this.ang) * this.len;
    const p = this.player;
    if (p && dist(bx, by, p.cx, p.cy) < 14) p.hurt(1, bx);
    if (Math.abs(Math.cos(this.t * 2.6 + this.phase)) > 0.985 && this.onScreen() && !this.sw) {
      this.sw = true;
      Sfx.play('swish', 0.5);
    }
    if (Math.abs(Math.cos(this.t * 2.6 + this.phase)) < 0.9) this.sw = false;
  }
  draw(g, cam) {
    const a = this.ang;
    const sx = this.px - cam.x, sy = this.py - cam.y;
    const ex = sx + Math.sin(a) * this.len, ey = sy + Math.cos(a) * this.len;
    // chain
    const n = Math.floor(this.len / 4);
    for (let i = 0; i < n; i++) {
      const t = i / n;
      fillR(g, sx + Math.sin(a) * this.len * t, sy + Math.cos(a) * this.len * t, 2, 2, i % 2 ? '#6e665c' : '#3a3530');
    }
    // crescent blade, rasterised in local space
    const ca = Math.cos(a), sa = Math.sin(a);
    g.fillStyle = '#d8d8de';
    for (let ly = -2; ly <= 9; ly++)
      for (let lx = -12; lx <= 12; lx++) {
        const d1 = Math.hypot(lx, ly - 13), d2 = Math.hypot(lx, ly - 19);
        if (d1 > 15 || d2 < 14) continue;
        const wx = ex + lx * ca + ly * sa, wy = ey - lx * sa + ly * ca;
        g.fillStyle = d1 > 13.5 ? '#fff8ea' : ly < 3 ? '#8e8e98' : '#c4c4cc';
        g.fillRect(Math.round(wx), Math.round(wy), 1, 1);
      }
    fillR(g, ex - 2, ey - 2, 4, 4, '#4a443c');
  }
}

class FireJet extends Entity {
  constructor(x, y, phase) {
    super(x + 2, y + 12, 12, 4);
    this.phase = phase;
    this.state = 'off';
    this.timer = phase;
    this.layer = 2;
  }
  update(dt) {
    this.t += dt;
    this.timer -= dt;
    if (this.timer <= 0) {
      if (this.state === 'off') {
        this.state = 'warn';
        this.timer = 0.55;
      } else if (this.state === 'warn') {
        this.state = 'on';
        this.timer = 1.1;
        if (this.onScreen()) Sfx.play('flame');
      } else {
        this.state = 'off';
        this.timer = 1.5;
      }
    }
    if (this.state === 'warn' && Math.random() < 0.5) Parts.add({ x: this.cx + rnd(-4, 4), y: this.y, vy: rnd(-60, -20), life: 0.3, col: '#ffc444', g: 100 });
    if (this.state === 'on') {
      for (let i = 0; i < 3; i++) Parts.add({ x: this.cx + rnd(-4, 4), y: this.y, vx: rnd(-10, 10), vy: rnd(-220, -150), life: rnd(0.2, 0.35), col: pick(['#fff3b8', '#ffc444', '#f07a22', '#c8401a']), g: 0, type: 'puff', s: rnd(1.5, 3) });
      const p = this.player;
      if (p && overlap({ x: this.x, y: this.y - 44, w: this.w, h: 46 }, p)) p.hurt(1, this.cx);
    }
  }
  draw(g, cam) {
    const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y);
    fillR(g, x - 1, y, 14, 4, '#2a221c');
    fillR(g, x, y, 12, 1, '#6e665c');
    for (let i = 1; i < 12; i += 3) fillR(g, x + i, y + 1, 2, 2, this.state === 'off' ? '#140c08' : '#ff8a2a');
  }
  light() {
    if (this.state === 'on') Lighting.add(this.cx, this.y - 20, 60, '#ff8a3a', 1);
    else if (this.state === 'warn') Lighting.add(this.cx, this.y, 20, '#ff8a3a', 0.6);
  }
}

class FallingRock extends Entity {
  constructor(x, y) {
    super(x + 4, y, 8, 12);
    this.state = 'hang';
    this.timer = 0;
    this.home = { x: this.x, y: this.y };
    this.layer = 1;
  }
  update(dt, level) {
    const p = this.player;
    if (this.state === 'hang') {
      if (p && Math.abs(p.cx - this.cx) < 18 && p.y > this.y && p.y - this.y < 150) {
        this.state = 'shake';
        this.timer = 0.38;
        Sfx.play('crumble', 0.6);
      }
    } else if (this.state === 'shake') {
      this.timer -= dt;
      if (this.timer <= 0) this.state = 'fall';
    } else if (this.state === 'fall') {
      this.vy = Math.min(400, this.vy + 900 * dt);
      this.y += this.vy * dt;
      if (p && overlap(this, p)) {
        p.hurt(1, this.cx);
        this.shatter();
      } else if (level.rectSolid(this.x, this.y, this.w, this.h) || this.y > level.ph) this.shatter();
    } else if (this.state === 'gone') {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.state = 'hang';
        this.x = this.home.x;
        this.y = this.home.y;
        this.vy = 0;
      }
    }
  }
  shatter() {
    this.state = 'gone';
    this.timer = 4;
    Cam.shake(1.5, 0.15);
    Sfx.play('rockfall');
    Parts.burst(this.cx, this.y + this.h, 10, { col: ['#9c8b6a', '#6b5d48', '#c9b896'], speed: 80, g: 500, s: 2 });
  }
  draw(g, cam) {
    if (this.state === 'gone') return;
    const sh = this.state === 'shake' ? Math.round(rnd(-1, 1)) : 0;
    const x = Math.round(this.x - cam.x + sh), y = Math.round(this.y - cam.y);
    const rows = [8, 8, 7, 7, 6, 6, 5, 4, 4, 3, 2, 1];
    for (let i = 0; i < rows.length; i++) {
      const w = rows[i], ox = (8 - w) >> 1;
      fillR(g, x + ox, y + i, w, 1, '#6b5d48');
      fillR(g, x + ox, y + i, 1, 1, '#a89878');
    }
  }
}

class Boulder extends Entity {
  constructor(x, y) {
    super(x, y, 44, 44);
    this.active = false;
    this.rot = 0;
    this.layer = 2;
    this.home = { x, y };
  }
  start() {
    this.active = true;
    this.vx = 40;
    Sfx.play('rumble');
    Game.banner('RUN!', 1.2);
    Cam.shake(4, 0.6);
  }
  reset() {
    this.active = false;
    this.x = this.home.x;
    this.y = this.home.y;
    this.vx = this.vy = 0;
  }
  update(dt, level) {
    if (!this.active) return;
    const p = this.player;
    // it gains on you, but a clean run stays ahead
    const target = p ? clamp(PHYS.run * 1.02 + (p.cx - this.cx - 140) * -0.15, 70, 150) : 100;
    this.vx = approach(this.vx, target, 60 * dt);
    this.vy = Math.min(400, this.vy + 900 * dt);
    this.moveX(level, this.vx * dt);
    this.moveY(level, this.vy * dt);
    if (this.hitWall) {
      this.active = false;
      Cam.shake(6, 0.6);
      Sfx.play('boom');
      Parts.burst(this.cx, this.cy, 30, { col: ['#9c8b6a', '#6b5d48', '#c9b896'], speed: 150, g: 500, s: 2 });
      this.dead = true;
      return;
    }
    this.rot += (this.vx * dt) / 22;
    Cam.shake(1.2, 0.1);
    if (Math.random() < 0.6) Parts.dust(this.x + rnd(this.w), this.y + this.h, 1, '#9c8b6a');
    if (p && p.state !== 'dead' && dist(p.cx, p.cy, this.cx, this.cy) < 26) {
      p.hurt(99, this.cx, { force: true });
    }
    if (this.y > level.ph + 60) this.dead = true;
  }
  draw(g, cam) {
    const cx = Math.round(this.cx - cam.x), cy = Math.round(this.cy - cam.y);
    const r = 21;
    if (cx < -30 || cx > Screen.vw + 30) return;
    for (let y = -r; y <= r; y++)
      for (let x = -r; x <= r; x++) {
        const d = x * x + y * y;
        if (d > r * r) continue;
        // rotate the texture lookup, keep the shading fixed to the light
        const ux = x * Math.cos(this.rot) - y * Math.sin(this.rot), uy = x * Math.sin(this.rot) + y * Math.cos(this.rot);
        const n = fbm(ux / 7 + 50, uy / 7, 3);
        const lit = (-x - y) / (r * 1.4);
        let v = n * 0.6 + lit * 0.5 + 0.35;
        if (d > (r - 1.5) * (r - 1.5)) v -= 0.4;
        const col = v > 0.85 ? '#c9b896' : v > 0.62 ? '#9c8b6a' : v > 0.4 ? '#7d6e56' : v > 0.2 ? '#5a4e3c' : '#2a221c';
        g.fillStyle = col;
        g.fillRect(cx + x, cy + y, 1, 1);
      }
  }
}

// --- Projectiles -------------------------------------------------------------
class Projectile extends Entity {
  constructor(kind, x, y, vx, vy, opts = {}) {
    const sz = kind === 'orb' ? 8 : kind === 'venom' ? 5 : kind === 'bolt' ? 6 : 4;
    super(x - sz / 2, y - sz / 2, sz, sz);
    this.kind = kind;
    this.vx = vx;
    this.vy = vy;
    this.grav = opts.grav || 0;
    this.life = opts.life || 4;
    this.dmg = opts.dmg || 1;
    this.homing = opts.homing || 0;
    this.whipable = kind !== 'beam';
    this.layer = 2;
    this.face = sgn(vx) || 1;
  }
  onWhip(p) {
    this.dead = true;
    Sfx.play('deflect');
    Parts.burst(this.cx, this.cy, 8, { col: ['#fff1b3', '#fff'], speed: 80, g: 0 });
    Game.score(5);
    return true;
  }
  update(dt, level) {
    this.t += dt;
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
    const p = this.player;
    if (this.homing && p) {
      const a = Math.atan2(p.cy - this.cy, p.cx - this.cx);
      const sp = Math.hypot(this.vx, this.vy);
      const cur = Math.atan2(this.vy, this.vx);
      let da = a - cur;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      const na = cur + clamp(da, -this.homing * dt, this.homing * dt);
      this.vx = Math.cos(na) * sp;
      this.vy = Math.sin(na) * sp;
    }
    this.vy += this.grav * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (level.rectSolid(this.x + 1, this.y + 1, this.w - 2, this.h - 2)) {
      this.dead = true;
      Parts.burst(this.cx, this.cy, 5, { col: this.kind === 'venom' ? ['#9ad040', '#5a8a20'] : this.kind === 'bolt' || this.kind === 'orb' ? ['#79f0a5', '#25b56a'] : ['#c9b896', '#6e665c'], speed: 50 });
      if (this.kind === 'dart' || this.kind === 'arrow') Sfx.play('thunk', 0.4);
    }
    if (p && p.state !== 'dead' && overlap(this, p)) {
      if (p.hurt(this.dmg, this.cx)) this.dead = true;
    }
    if (this.kind === 'orb' || this.kind === 'bolt') if (Math.random() < 0.5) Parts.add({ x: this.cx, y: this.cy, life: 0.25, col: pick(['#79f0a5', '#25b56a', '#fff']), g: 0, type: 'px' });
  }
  draw(g, cam) {
    const x = Math.round(this.cx - cam.x), y = Math.round(this.cy - cam.y);
    if (this.kind === 'dart' || this.kind === 'arrow') {
      const L = this.kind === 'arrow' ? 9 : 6;
      const a = Math.atan2(this.vy, this.vx);
      const dx = Math.cos(a), dy = Math.sin(a);
      for (let i = 0; i < L; i++) {
        g.fillStyle = i === L - 1 ? '#d8d8de' : i < 2 ? (this.kind === 'arrow' ? '#f2e6c8' : '#b02a2c') : '#6b4024';
        g.fillRect(Math.round(x - dx * (L / 2 - i)), Math.round(y - dy * (L / 2 - i)), 1, 1);
      }
    } else if (this.kind === 'venom') {
      pxCircle(g, x, y, 2, '#7ab030');
      fillR(g, x - 1, y - 1, 1, 1, '#d8f090');
    } else if (this.kind === 'bolt' || this.kind === 'orb') {
      const r = this.kind === 'orb' ? 4 : 3;
      g.globalAlpha = 0.5;
      g.drawImage(lightStamp(r * 3, '#79f0a5', 3), x - r * 3, y - r * 3);
      g.globalAlpha = 1;
      pxCircle(g, x, y, r, '#25b56a');
      pxCircle(g, x, y, r - 1.5, '#a8ffc8');
    } else if (this.kind === 'rock') {
      pxCircle(g, x, y, 3, '#7d6e56');
      fillR(g, x - 1, y - 2, 2, 1, '#c9b896');
    } else if (this.kind === 'fire') {
      pxCircle(g, x, y, 3, '#f07a22');
      pxCircle(g, x, y, 1.5, '#fff3b8');
    }
  }
  light() {
    if (this.kind === 'bolt' || this.kind === 'orb') Lighting.add(this.cx, this.cy, 26, '#79f0a5', 0.8);
    if (this.kind === 'fire') Lighting.add(this.cx, this.cy, 26, '#ff8a3a', 0.8);
  }
}

// ==== 11_enemies.js ====
// ANDOR :: enemies.

class Enemy extends Entity {
  constructor(x, y, w, h, hp) {
    super(x, y, w, h);
    this.hp = hp;
    this.maxHp = hp;
    this.whipable = true;
    this.contact = 1;
    this.coins = 2;
    this.knock = 1;
    this.hurtT = 0;
    this.state = 'patrol';
    this.stT = 0;
    this.face = -1;
    this.alert = 0;
    this.home = { x, y };
    this.gravity = true;
    this.stunT = 0;
  }
  setState(s) {
    this.state = s;
    this.stT = 0;
  }
  // Default reaction to a whip hit.
  onWhip(p, dir) {
    if (this.hp <= 0) return false;
    if (this.blocks && this.blocks(p, dir)) {
      Sfx.play('clank');
      Parts.burst(this.cx + this.face * 6, this.cy - 2, 6, { col: ['#fff1b3', '#fff'], speed: 90, g: 0 });
      p.vx = -p.face * 90;
      return true;
    }
    this.damage(Game.whipDamage(), p.cx, dir);
    return true;
  }
  damage(n, srcX, dir) {
    this.hp -= n;
    this.hurtT = 0.16;
    this.alert = 1;
    Game.hitstop(0.05);
    Sfx.play('hit');
    Parts.burst(this.cx, this.cy, 6, { col: ['#fff8ea', '#f4cf62'], speed: 80, g: 100, life: 0.3 });
    if (this.hp <= 0) return this.die();
    const away = sgn(this.cx - srcX) || 1;
    if (this.knock && dir !== 'down') {
      this.vx = away * 110 * this.knock;
      if (this.gravity) this.vy = -90 * this.knock;
    }
    this.stunT = 0.25 * this.knock;
    this.face = -away;
    this.onHurt && this.onHurt();
  }
  die() {
    this.dead = true;
    Game.stats.kills++;
    Game.score(10 * this.maxHp);
    Sfx.play('enemyDie');
    Cam.shake(1.5, 0.12);
    Parts.burst(this.cx, this.cy, 16, { col: this.dustCols || ['#e6cf9e', '#c9a46a', '#fff8ea'], speed: 90, g: 60, type: 'puff', s: 2.2, life: 0.6 });
    Parts.add({ x: this.cx, y: this.cy, type: 'ring', s: 14, life: 0.3, col: '#fff8ea' });
    for (let i = 0; i < this.coins; i++) Game.spawn(new Coin(this.cx, this.cy, 1, true));
    if (Math.random() < 0.08) Game.spawn(new Pomegranate(this.cx, this.cy, true));
  }
  physics(dt, level) {
    if (this.gravity) this.vy = Math.min(320, this.vy + 900 * dt);
    this.moveX(level, this.vx * dt);
    this.moveY(level, this.vy * dt);
  }
  edgeAhead(level, dir = this.face) {
    const fx = dir > 0 ? this.x + this.w + 2 : this.x - 2;
    const t = level.tileAt(Math.floor(fx / TILE), Math.floor((this.y + this.h + 2) / TILE));
    return !(isSolidT(t) || isOneWayT(t)) || isSpikeT(t);
  }
  wallAhead(level, dir = this.face) {
    const fx = dir > 0 ? this.x + this.w + 1 : this.x - 1;
    return level.rectSolid(fx, this.y + 2, 1, this.h - 4) || isSpikeT(level.tileAt(Math.floor(fx / TILE), Math.floor((this.y + this.h - 4) / TILE)));
  }
  seesPlayer(range, vRange = 28, front = true) {
    const p = this.player;
    if (!p || p.state === 'dead') return false;
    const dx = p.cx - this.cx, dy = p.cy - this.cy;
    if (Math.abs(dx) > range || Math.abs(dy) > vRange) return false;
    if (front && sgn(dx) !== this.face && Math.abs(dx) > 12 && !this.alert) return false;
    return Game.player.lineClear(this.cx, this.y + 4, p.cx, p.y + 6);
  }
  patrol(dt, level, speed) {
    if (this.wallAhead(level) || this.edgeAhead(level)) {
      this.face *= -1;
      this.vx = 0;
    }
    this.vx = approach(this.vx, this.face * speed, 600 * dt);
  }
  contactDamage() {
    if (this.contact && this.hp > 0 && this.touchesPlayer(-2)) this.player.hurt(this.contact, this.cx);
  }
  update(dt, level) {
    this.t += dt;
    this.stT += dt;
    this.hurtT = Math.max(0, this.hurtT - dt);
    if (this.stunT > 0) {
      this.stunT -= dt;
      this.vx = approach(this.vx, 0, 500 * dt);
      this.physics(dt, level);
      return;
    }
    this.think(dt, level);
    if (this.gravity) this.physics(dt, level);
    this.contactDamage();
    if (this.y > level.ph + 40) this.dead = true;
  }
  think() {}
  drawRig(g, cam, skin, pose, over) {
    const f = rigFrame(skin, pose, over);
    drawSprite(g, f, this.cx - cam.x, this.y + this.h - cam.y, this.face < 0, this.hurtT > 0.08);
    return f;
  }
  drawAlert(g, cam) {
    if (this.alertFlash > 0) {
      drawText(g, '!', this.cx - cam.x, this.y - 12 - cam.y, '#ff8a4a', { align: 'center', outline: PAL.ink });
    }
  }
}

// --- Isfahan watch: patrols, spots, winds up, slashes ----------------------
class Guard extends Enemy {
  constructor(x, y, skin = 'guard') {
    super(x + 3, y - 4, 10, 20, 3);
    this.skin = skin;
    this.coins = 3;
    this.alertFlash = 0;
    this.speed = skin === 'bandit' ? 58 : 38;
  }
  think(dt, level) {
    this.alertFlash = Math.max(0, this.alertFlash - dt);
    const p = this.player;
    const dx = p ? p.cx - this.cx : 0;
    switch (this.state) {
      case 'patrol':
        this.patrol(dt, level, this.speed * 0.6);
        if (this.seesPlayer(110)) {
          this.setState('chase');
          this.alertFlash = 0.6;
          this.alert = 1;
          Sfx.play('alert');
        }
        break;
      case 'chase': {
        this.face = sgn(dx) || this.face;
        const stop = this.wallAhead(level) || this.edgeAhead(level);
        this.vx = stop ? 0 : approach(this.vx, this.face * this.speed * 1.6, 500 * dt);
        if (Math.abs(dx) < (this.skin === 'bandit' ? 46 : 26) && Math.abs(p.cy - this.cy) < 24) this.setState('windup');
        if (!this.seesPlayer(170, 60, false) && this.stT > 1.5) this.setState('patrol');
        break;
      }
      case 'windup':
        this.vx = approach(this.vx, 0, 900 * dt);
        if (this.stT > (this.skin === 'bandit' ? 0.38 : 0.45)) {
          this.setState('slash');
          Sfx.play('swish');
          if (this.skin === 'bandit') this.vx = this.face * 190;
        }
        break;
      case 'slash': {
        if (this.skin === 'bandit') this.vx = approach(this.vx, 0, 500 * dt);
        else this.vx = this.face * 30;
        const box = { x: this.face > 0 ? this.cx : this.cx - 26, y: this.y + 2, w: 26, h: 16 };
        if (this.stT < 0.18 && p && overlap(box, p)) p.hurt(1, this.cx);
        if (this.stT > 0.45) this.setState('chase');
        break;
      }
    }
  }
  draw(g, cam) {
    let pose = 'idle0';
    if (this.state === 'windup') pose = 'windup';
    else if (this.state === 'slash') pose = this.stT < 0.12 ? 'slash' : 'slash2';
    else if (this.hurtT > 0) pose = 'hurt';
    else if (Math.abs(this.vx) > 8) pose = (this.state === 'chase' ? 'run' : 'walk') + (Math.floor(this.t * (this.state === 'chase' ? 12 : 8)) % 8);
    if (this.state === 'windup' && Math.floor(this.stT * 20) % 2 === 0) {
      const f = rigFrame(this.skin, pose);
      drawSprite(g, f, this.cx - cam.x, this.y + this.h - cam.y, this.face < 0, true);
    } else this.drawRig(g, cam, this.skin, pose);
    this.drawAlert(g, cam);
  }
}

// --- Rooftop archer -------------------------------------------------------
class Archer extends Enemy {
  constructor(x, y) {
    super(x + 3, y - 4, 10, 20, 2);
    this.coins = 3;
    this.cool = 1;
    this.alertFlash = 0;
  }
  think(dt, level) {
    this.alertFlash = Math.max(0, this.alertFlash - dt);
    const p = this.player;
    this.vx = 0;
    this.cool -= dt;
    if (this.state === 'patrol') {
      if (p && Math.abs(p.cx - this.cx) < 190 && Math.abs(p.cy - this.cy) < 110 && this.player.lineClear(this.cx, this.y + 4, p.cx, p.cy)) {
        this.face = sgn(p.cx - this.cx) || this.face;
        if (this.cool <= 0) {
          this.setState('draw');
          this.alertFlash = 0.4;
        }
      }
    } else if (this.state === 'draw') {
      if (p) this.face = sgn(p.cx - this.cx) || this.face;
      if (this.stT > 0.7) {
        // lob toward the player's position with a little lead
        const tx = p.cx + p.vx * 0.25, ty = p.cy;
        const dx = tx - this.cx, dy = ty - (this.y + 7);
        const sp = 190;
        const tt = Math.max(0.2, Math.abs(dx) / sp);
        const vy = dy / tt - 0.5 * 160 * tt;
        Game.spawn(new Projectile('arrow', this.cx + this.face * 8, this.y + 7, sgn(dx) * sp, clamp(vy, -220, 220), { grav: 160 }));
        Sfx.play('bow');
        this.setState('patrol');
        this.cool = 1.9;
      }
    }
  }
  draw(g, cam) {
    const pose = this.state === 'draw' ? (this.stT > 0.25 ? 'draw' : 'aim') : this.hurtT > 0 ? 'hurt' : 'aim';
    this.drawRig(g, cam, 'archer', pose, pose === 'draw' ? { draw: Math.min(4, Math.floor(this.stT * 8)) } : null);
    this.drawAlert(g, cam);
  }
}

// --- Scorpion --------------------------------------------------------------
class Scorpion extends Enemy {
  constructor(x, y) {
    super(x + 1, y + 6, 14, 10, 2);
    this.coins = 2;
    this.dustCols = ['#b8622c', '#7a3a18', '#f0c040'];
  }
  think(dt, level) {
    const p = this.player;
    if (this.state === 'patrol') {
      this.patrol(dt, level, 26);
      if (p && Math.abs(p.cy - this.cy) < 20 && Math.abs(p.cx - this.cx) < 40 && sgn(p.cx - this.cx) === this.face) this.setState('wind');
    } else if (this.state === 'wind') {
      this.vx = 0;
      if (this.stT > 0.32) {
        this.setState('strike');
        Sfx.play('hiss', 0.6);
      }
    } else if (this.state === 'strike') {
      const box = { x: this.face > 0 ? this.cx : this.cx - 22, y: this.y - 8, w: 22, h: 14 };
      if (this.stT < 0.2 && p && overlap(box, p)) p.hurt(1, this.cx);
      if (this.stT > 0.5) this.setState('patrol');
    }
  }
  draw(g, cam) {
    const fr = this.state === 'strike' ? 2 : this.state === 'wind' ? 0 : Math.floor(this.t * 8) % 2;
    let ox = this.state === 'wind' ? Math.round(Math.sin(this.stT * 60)) : 0;
    drawSprite(g, ART.scorpion[fr], this.cx - cam.x + ox, this.y + this.h - cam.y + 1, this.face < 0, this.hurtT > 0.08);
  }
}

// --- Cobra: rises, sways, spits --------------------------------------------
class Cobra extends Enemy {
  constructor(x, y) {
    super(x + 3, y + 2, 10, 14, 2);
    this.coins = 2;
    this.cool = rnd(0.5, 1.5);
    this.knock = 0;
    this.dustCols = ['#5a6224', '#d8c070'];
  }
  think(dt, level) {
    const p = this.player;
    this.vx = 0;
    this.cool -= dt;
    if (p && Math.abs(p.cx - this.cx) < 130 && Math.abs(p.cy - this.cy) < 70) {
      this.face = sgn(p.cx - this.cx) || this.face;
      if (this.cool <= 0 && this.state !== 'spit') {
        this.setState('spit');
      }
    }
    if (this.state === 'spit' && this.stT > 0.35 && !this.spat) {
      this.spat = true;
      const dx = p.cx - this.cx;
      const t = clamp(Math.abs(dx) / 120, 0.35, 1.0);
      Game.spawn(new Projectile('venom', this.cx + this.face * 6, this.y + 2, dx / t, (p.cy - this.y - 2) / t - 0.5 * 300 * t, { grav: 300 }));
      Sfx.play('spit');
    }
    if (this.state === 'spit' && this.stT > 0.7) {
      this.setState('patrol');
      this.spat = false;
      this.cool = 2.2;
    }
  }
  draw(g, cam) {
    const fr = this.state === 'spit' ? (this.stT > 0.3 ? 2 : 1) : Math.floor(this.t * 2) % 2;
    drawSprite(g, ART.cobra[fr], this.cx - cam.x, this.y + this.h - cam.y + 1, this.face < 0, this.hurtT > 0.08);
  }
}

// --- Vulture: circles, then dives ------------------------------------------
class Vulture extends Enemy {
  constructor(x, y) {
    super(x, y, 16, 10, 2);
    this.gravity = false;
    this.coins = 2;
    this.baseY = y;
    this.dustCols = ['#4a2e22', '#e8dcc0'];
  }
  think(dt, level) {
    const p = this.player;
    if (this.state === 'patrol') {
      this.vx = approach(this.vx, this.face * 40, 200 * dt);
      this.vy = (this.baseY + Math.sin(this.t * 2) * 8 - this.y) * 3;
      if (Math.abs(this.x - this.home.x) > 70) this.face = sgn(this.home.x - this.x);
      if (p && Math.abs(p.cx - this.cx) < 70 && p.cy > this.cy && p.cy - this.cy < 140 && this.stT > 1) {
        this.setState('dive');
        this.tx = p.cx;
        this.ty = p.cy;
        Sfx.play('screech');
      }
    } else if (this.state === 'dive') {
      const dx = this.tx - this.cx, dy = this.ty - this.cy;
      const d = Math.hypot(dx, dy) || 1;
      this.vx = (dx / d) * 190;
      this.vy = (dy / d) * 190;
      this.face = sgn(dx) || this.face;
      if (d < 8 || this.stT > 1.2 || level.rectSolid(this.x, this.y + 4, this.w, this.h)) this.setState('climb');
    } else if (this.state === 'climb') {
      this.vy = approach(this.vy, -90, 400 * dt);
      this.vx = approach(this.vx, this.face * 50, 200 * dt);
      if (this.y <= this.baseY) this.setState('patrol');
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
  draw(g, cam) {
    const fr = this.state === 'dive' ? 1 : Math.floor(this.t * 6) % 2;
    drawSprite(g, ART.vulture[fr], this.cx - cam.x, this.y + this.h - cam.y, this.face < 0, this.hurtT > 0.08);
  }
}

// --- Bat: hangs asleep, swoops in a wobbling line --------------------------
class Bat extends Enemy {
  constructor(x, y) {
    super(x + 2, y + 1, 12, 7, 1);
    this.gravity = false;
    this.state = 'sleep';
    this.coins = 1;
    this.knock = 0;
    this.dustCols = ['#3a2a2e', '#5a4448'];
  }
  think(dt, level) {
    const p = this.player;
    if (this.state === 'sleep') {
      if (p && dist(p.cx, p.cy, this.cx, this.cy) < 80) {
        this.setState('fly');
        Sfx.play('flap', 0.5);
      }
      return;
    }
    if (this.state === 'fly') {
      const dx = p.cx - this.cx, dy = p.cy - 4 - this.cy;
      const d = Math.hypot(dx, dy) || 1;
      this.vx = approach(this.vx, (dx / d) * 95, 300 * dt);
      this.vy = approach(this.vy, (dy / d) * 95 + Math.sin(this.t * 9) * 60, 400 * dt);
      this.face = sgn(this.vx) || this.face;
      if (this.stT > 3.5) this.setState('rest');
    } else if (this.state === 'rest') {
      this.vy = approach(this.vy, -60, 200 * dt);
      this.vx = approach(this.vx, 0, 100 * dt);
      if (this.stT > 1.2) this.setState('fly');
    }
    const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
    if (!level.rectSolid(nx, this.y, this.w, this.h)) this.x = nx;
    else this.vx *= -0.5;
    if (!level.rectSolid(this.x, ny, this.w, this.h)) this.y = ny;
    else this.vy *= -0.5;
  }
  draw(g, cam) {
    if (this.state === 'sleep') {
      const s = ART.bat[0];
      g.save();
      g.translate(Math.round(this.cx - cam.x), Math.round(this.y - cam.y + 6));
      g.scale(1, -1);
      g.drawImage(s.c, -s.ax, 0, s.w, s.h);
      g.restore();
      return;
    }
    drawSprite(g, ART.bat[Math.floor(this.t * 12) % 2], this.cx - cam.x, this.y + this.h - cam.y, this.face < 0, this.hurtT > 0.08);
  }
}

// --- Mummy -----------------------------------------------------------------
class Mummy extends Enemy {
  constructor(x, y) {
    super(x + 3, y - 4, 10, 20, 5);
    this.coins = 4;
    this.knock = 0.4;
    this.dustCols = ['#d8cdb0', '#a89c80', '#6e6450'];
    this.groan = rnd(2, 5);
  }
  think(dt, level) {
    const p = this.player;
    this.groan -= dt;
    if (this.groan < 0 && this.onScreen()) {
      this.groan = rnd(4, 7);
      Sfx.play('groan', 0.5);
    }
    const dx = p ? p.cx - this.cx : 0;
    if (this.state === 'patrol') {
      if (p && Math.abs(dx) < 140 && Math.abs(p.cy - this.cy) < 40) {
        this.face = sgn(dx) || this.face;
        const stop = this.wallAhead(level) || this.edgeAhead(level);
        this.vx = stop ? 0 : approach(this.vx, this.face * 24, 200 * dt);
        if (Math.abs(dx) < 30) this.setState('wind');
      } else this.patrol(dt, level, 14);
    } else if (this.state === 'wind') {
      this.vx = 0;
      if (this.stT > 0.55) {
        this.setState('lunge');
        this.vx = this.face * 120;
        Sfx.play('groan', 0.8);
      }
    } else if (this.state === 'lunge') {
      this.vx = approach(this.vx, 0, 300 * dt);
      const box = { x: this.face > 0 ? this.cx : this.cx - 20, y: this.y + 2, w: 20, h: 12 };
      if (p && overlap(box, p)) p.hurt(1, this.cx);
      if (this.stT > 0.5) this.setState('patrol');
    }
  }
  draw(g, cam) {
    let pose = 'shamble' + (Math.floor(this.t * 5) % 8);
    if (Math.abs(this.vx) < 4 && this.state === 'patrol') pose = 'shamble0';
    if (this.state === 'wind') pose = 'windup';
    if (this.state === 'lunge') pose = 'slash';
    const fl = this.hurtT > 0.08 || (this.state === 'wind' && Math.floor(this.stT * 16) % 2 === 0);
    const f = rigFrame('mummy', pose);
    drawSprite(g, f, this.cx - cam.x, this.y + this.h - cam.y, this.face < 0, fl);
  }
  light() {
    Lighting.add(this.cx + this.face * 3, this.y + 3, 10, '#ff8a2a', 0.5);
  }
}

// --- Scarab: skitters along floors toward you ------------------------------
class Scarab extends Enemy {
  constructor(x, y) {
    super(x + 5, y + 10, 6, 6, 1);
    this.coins = 0;
    this.knock = 0;
    this.speed = rnd(55, 75);
    this.dustCols = ['#1f5c4a', '#dea12a'];
  }
  think(dt, level) {
    const p = this.player;
    if (p && Math.abs(p.cx - this.cx) < 150 && Math.abs(p.cy - this.cy) < 40) this.face = sgn(p.cx - this.cx) || this.face;
    if (this.wallAhead(level) || this.edgeAhead(level)) {
      this.face *= -1;
      this.vx = 0;
    }
    this.vx = approach(this.vx, this.face * this.speed, 400 * dt);
  }
  draw(g, cam) {
    drawSprite(g, ART.scarab[Math.floor(this.t * 14) % 2], this.cx - cam.x, this.y + this.h - cam.y, this.face < 0, this.hurtT > 0.08);
  }
}

// --- Jackal warrior: agile spearman that leaps -----------------------------
class Jackal extends Enemy {
  constructor(x, y) {
    super(x + 3, y - 6, 10, 22, 6);
    this.coins = 6;
    this.knock = 0.6;
    this.cool = 0.5;
    this.alertFlash = 0;
    this.dustCols = ['#2a2428', '#dea12a'];
  }
  think(dt, level) {
    const p = this.player;
    this.alertFlash = Math.max(0, this.alertFlash - dt);
    this.cool -= dt;
    const dx = p ? p.cx - this.cx : 0;
    switch (this.state) {
      case 'patrol':
        this.patrol(dt, level, 30);
        if (this.seesPlayer(150, 50)) {
          this.setState('stalk');
          this.alertFlash = 0.6;
          Sfx.play('growl');
        }
        break;
      case 'stalk':
        this.face = sgn(dx) || this.face;
        this.vx = this.edgeAhead(level) || this.wallAhead(level) ? 0 : approach(this.vx, this.face * 85, 500 * dt);
        if (this.cool <= 0 && Math.abs(dx) < 90 && Math.abs(dx) > 40 && this.onGround) {
          this.setState('leap');
          this.vy = -300;
          this.vx = this.face * Math.min(170, Math.abs(dx) * 1.9);
          Sfx.play('growl', 0.7);
        } else if (Math.abs(dx) < 34 && this.cool <= 0) this.setState('wind');
        break;
      case 'leap':
        if (this.onGround && this.stT > 0.1) {
          this.setState('wind');
          this.vx = 0;
        }
        break;
      case 'wind':
        this.vx = approach(this.vx, 0, 900 * dt);
        if (this.stT > 0.3) {
          this.setState('thrust');
          this.vx = this.face * 150;
          Sfx.play('swish');
        }
        break;
      case 'thrust': {
        this.vx = approach(this.vx, 0, 600 * dt);
        const box = { x: this.face > 0 ? this.cx : this.cx - 30, y: this.y + 6, w: 30, h: 10 };
        if (this.stT < 0.22 && p && overlap(box, p)) p.hurt(1, this.cx);
        if (this.stT > 0.55) {
          this.setState('stalk');
          this.cool = rnd(0.6, 1.2);
        }
        break;
      }
    }
  }
  draw(g, cam) {
    let pose = 'idle0';
    if (this.state === 'leap') pose = 'leap';
    else if (this.state === 'wind') pose = 'thrust0';
    else if (this.state === 'thrust') pose = 'thrust1';
    else if (Math.abs(this.vx) > 8) pose = 'run' + (Math.floor(this.t * 12) % 8);
    const fl = this.hurtT > 0.08 || (this.state === 'wind' && Math.floor(this.stT * 20) % 2 === 0);
    drawSprite(g, rigFrame('jackal', pose), this.cx - cam.x, this.y + this.h - cam.y, this.face < 0, fl);
    this.drawAlert(g, cam);
  }
  light() {
    Lighting.add(this.cx + this.face * 4, this.y + 4, 9, '#ff9a2a', 0.5);
  }
}

// --- Brass sentinel: shielded from the front, fires emerald bolts ----------
class Sentinel extends Enemy {
  constructor(x, y) {
    super(x + 3, y - 6, 11, 22, 4);
    this.coins = 5;
    this.knock = 0.3;
    this.cool = rnd(1, 2);
    this.dustCols = ['#dea12a', '#a86d16', '#79f0a5'];
  }
  blocks(p, dir) {
    // the brass faceplate turns aside blows from the front
    return dir === 'fwd' && sgn(p.cx - this.cx) === this.face && this.state !== 'fire';
  }
  think(dt, level) {
    const p = this.player;
    this.cool -= dt;
    if (this.state === 'patrol') {
      this.patrol(dt, level, 18);
      if (p && Math.abs(p.cy - this.cy) < 30 && Math.abs(p.cx - this.cx) < 160) {
        this.face = sgn(p.cx - this.cx) || this.face;
        this.vx = 0;
        if (this.cool <= 0) this.setState('charge');
      }
    } else if (this.state === 'charge') {
      this.vx = 0;
      if (this.stT > 0.6) {
        Game.spawn(new Projectile('bolt', this.cx + this.face * 10, this.y + 10, this.face * 150, 0));
        Sfx.play('bolt');
        this.setState('fire');
      }
    } else if (this.state === 'fire') {
      if (this.stT > 0.5) {
        this.setState('patrol');
        this.cool = 2.4;
      }
    }
  }
  draw(g, cam) {
    let pose = Math.abs(this.vx) > 4 ? 'walk' + (Math.floor(this.t * 6) % 8) : 'idle0';
    if (this.state === 'charge' || this.state === 'fire') pose = 'aim';
    drawSprite(g, rigFrame('sentinel', pose), this.cx - cam.x, this.y + this.h - cam.y, this.face < 0, this.hurtT > 0.08);
    if (this.state === 'charge') {
      g.globalAlpha = Math.min(1, this.stT * 2);
      const x = this.cx - cam.x + this.face * 11, y = this.y + 10 - cam.y;
      pxCircle(g, x, y, 1 + this.stT * 3, '#79f0a5');
      g.globalAlpha = 1;
    }
  }
  light() {
    Lighting.add(this.cx + this.face * 2, this.y + 5, 16, '#79f0a5', 0.7);
  }
}

// --- Djinn wisp: drifts after you through walls ----------------------------
class Wisp extends Enemy {
  constructor(x, y) {
    super(x + 4, y + 4, 8, 8, 1);
    this.gravity = false;
    this.coins = 1;
    this.knock = 0;
    this.dustCols = ['#79f0a5', '#25b56a', '#fff'];
  }
  think(dt, level) {
    const p = this.player;
    if (!p) return;
    const dx = p.cx - this.cx, dy = p.cy - this.cy;
    const d = Math.hypot(dx, dy) || 1;
    if (d < 130) {
      this.vx = approach(this.vx, (dx / d) * 42, 80 * dt);
      this.vy = approach(this.vy, (dy / d) * 42, 80 * dt);
    } else {
      this.vx = approach(this.vx, 0, 40 * dt);
      this.vy = Math.sin(this.t * 2) * 10;
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (Math.random() < 0.6) Parts.add({ x: this.cx + rnd(-2, 2), y: this.cy + rnd(-2, 2), vy: -20, life: 0.4, col: pick(['#79f0a5', '#25b56a', '#a8ffc8']), g: -10, type: 'px' });
  }
  draw(g, cam) {
    const x = Math.round(this.cx - cam.x), y = Math.round(this.cy - cam.y);
    g.globalAlpha = 0.5;
    g.drawImage(lightStamp(10, '#79f0a5', 3), x - 10, y - 10);
    g.globalAlpha = 1;
    pxCircle(g, x, y, 3.5 + Math.sin(this.t * 10) * 0.6, this.hurtT > 0 ? '#fff' : '#25b56a');
    pxCircle(g, x, y - 1, 2, '#a8ffc8');
    fillR(g, x - 2, y - 1, 1, 1, '#0d3a26');
    fillR(g, x + 1, y - 1, 1, 1, '#0d3a26');
  }
  light() {
    Lighting.add(this.cx, this.cy, 30, '#79f0a5', 0.9);
  }
}

// ==== 12_audio.js ====
// ANDOR :: audio. Everything is synthesised: Karplus-Strong oud and qanun,
// a breathy ney, darbuka/riq/daf/zills, drones; music follows real maqamat
// (with quarter tones), scheduled ahead on the audio clock.

const Settings = Object.assign(
  { music: 0.7, sfx: 0.8, shake: true, vibrate: true, reduceMotion: false, touchSize: 1, showTimer: false },
  Store.get('andor_settings', {})
);
function saveSettings() {
  Store.set('andor_settings', Settings);
}

const AudioSys = {
  ctx: null,
  ok: false,
  bufs: {},
  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC({ latencyHint: 'interactive' });
    } catch (e) {
      return;
    }
    const c = this.ctx;
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -14;
    this.comp.ratio.value = 4;
    this.comp.attack.value = 0.004;
    this.comp.release.value = 0.2;
    this.master = c.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.comp);
    this.comp.connect(c.destination);
    this.music = c.createGain();
    this.sfx = c.createGain();
    this.music.connect(this.master);
    this.sfx.connect(this.master);
    this.reverb = c.createConvolver();
    this.reverb.buffer = this.makeIR(2.6, 2.4);
    this.revSend = c.createGain();
    this.revSend.gain.value = 0.28;
    this.revSend.connect(this.reverb);
    this.reverb.connect(this.master);
    this.applyVolumes();
    this.makeBuffers();
    this.ok = true;
    if (c.state === 'suspended') c.resume();
    document.addEventListener('visibilitychange', () => {
      if (!this.ctx) return;
      if (document.hidden) this.ctx.suspend();
      else this.ctx.resume();
    });
  },
  applyVolumes() {
    if (!this.ctx) return;
    this.music.gain.value = Settings.music * 0.55;
    this.sfx.gain.value = Settings.sfx * 0.8;
  },
  makeIR(dur, decay) {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur);
    const b = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < n; i++) {
        const t = i / n;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (i < 300 ? i / 300 : 1);
      }
    }
    return b;
  },
  buffer(len, fn) {
    const c = this.ctx, sr = c.sampleRate, n = Math.max(1, Math.floor(len * sr));
    const b = c.createBuffer(1, n, sr);
    const d = b.getChannelData(0);
    fn(d, sr, n);
    return b;
  },
  // Karplus-Strong plucked string at freq f; bright (0..1) shapes the excitation.
  pluckBuf(f, dur, bright, damp) {
    return this.buffer(dur, (d, sr, n) => {
      const N = Math.max(2, Math.round(sr / f));
      const ring = new Float32Array(N);
      let lp = 0;
      for (let i = 0; i < N; i++) {
        const w = Math.random() * 2 - 1;
        lp = lp + (w - lp) * (0.25 + bright * 0.7);
        ring[i] = lp;
      }
      let idx = 0, prev = 0;
      for (let i = 0; i < n; i++) {
        const cur = ring[idx];
        const v = (cur + prev) * 0.5 * damp;
        prev = cur;
        ring[idx] = v;
        d[i] = cur;
        idx = (idx + 1) % N;
      }
      // gentle fade at the tail
      const fade = Math.floor(sr * 0.05);
      for (let i = 0; i < fade; i++) d[n - 1 - i] *= i / fade;
    });
  },
  makeBuffers() {
    const B = this.bufs;
    // oud and qanun references; playbackRate covers the rest of the range
    B.oud = [110, 220, 440].map((f) => ({ f, b: this.pluckBuf(f, 2.2, 0.55, 0.996) }));
    B.qanun = [220, 440, 880].map((f) => ({ f, b: this.pluckBuf(f, 1.6, 0.9, 0.9975) }));
    B.bass = [55, 110].map((f) => ({ f, b: this.pluckBuf(f, 2.0, 0.35, 0.997) }));
    B.noise = this.buffer(2, (d) => {
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    });
    B.doum = this.buffer(0.5, (d, sr) => {
      let ph = 0;
      for (let i = 0; i < d.length; i++) {
        const t = i / sr;
        const f = 62 + 90 * Math.exp(-t * 28);
        ph += (TAU * f) / sr;
        d[i] = Math.sin(ph) * Math.exp(-t * 7) * 0.95 + (Math.random() * 2 - 1) * Math.exp(-t * 90) * 0.25;
      }
    });
    B.tek = this.buffer(0.12, (d, sr) => {
      let lp = 0, ph = 0;
      for (let i = 0; i < d.length; i++) {
        const t = i / sr;
        const w = Math.random() * 2 - 1;
        lp += (w - lp) * 0.6;
        ph += (TAU * 760) / sr;
        d[i] = (w - lp) * Math.exp(-t * 70) * 0.9 + Math.sin(ph) * Math.exp(-t * 55) * 0.4;
      }
    });
    B.ka = this.buffer(0.08, (d, sr) => {
      let lp = 0;
      for (let i = 0; i < d.length; i++) {
        const t = i / sr;
        const w = Math.random() * 2 - 1;
        lp += (w - lp) * 0.35;
        d[i] = lp * Math.exp(-t * 80) * 0.8;
      }
    });
    B.riq = this.buffer(0.25, (d, sr) => {
      const fs = [5200, 6800, 7900, 9400, 11200];
      const ph = fs.map(() => Math.random() * TAU);
      for (let i = 0; i < d.length; i++) {
        const t = i / sr;
        let v = 0;
        for (let k = 0; k < fs.length; k++) v += Math.sin(ph[k] + (TAU * fs[k] * i) / sr);
        d[i] = (v / fs.length) * Math.exp(-t * 22) * (0.7 + 0.3 * Math.sin(t * 380)) + (Math.random() * 2 - 1) * Math.exp(-t * 60) * 0.3;
      }
    });
    B.daf = this.buffer(0.9, (d, sr) => {
      let ph = 0;
      for (let i = 0; i < d.length; i++) {
        const t = i / sr;
        ph += (TAU * (48 + 40 * Math.exp(-t * 20))) / sr;
        d[i] = Math.sin(ph) * Math.exp(-t * 4.5) + (Math.random() * 2 - 1) * Math.exp(-t * 40) * 0.35;
      }
    });
    B.zill = this.buffer(1.4, (d, sr) => {
      const fs = [2630, 3770, 5110, 6720];
      for (let i = 0; i < d.length; i++) {
        const t = i / sr;
        let v = 0;

  let pos = 0;

// Level ambience beds.
const Ambience = {
  nodes: null,
  play(kind) {
    this.stop();
    if (!AudioSys.ok || !kind) return;
    const c = AudioSys.ctx;
    const src = c.createBufferSource();
    src.buffer = AudioSys.bufs.noise;
    src.loop = true;
    const f = c.createBiquadFilter();
    const g = c.createGain();
    const lfo = c.createOscillator(), lg = c.createGain();
    f.type = kind === 'desert' ? 'bandpass' : 'lowpass';
    f.frequency.value = kind === 'desert' ? 500 : kind === 'bazaar' ? 700 : 180;
    f.Q.value = kind === 'desert' ? 0.7 : 0.5;
    g.gain.value = kind === 'desert' ? 0.1 : kind === 'bazaar' ? 0.035 : 0.06;
    lfo.frequency.value = 0.13;
    lg.gain.value = kind === 'desert' ? 300 : 60;
    lfo.connect(lg);
    lg.connect(f.frequency);
    src.connect(f);
    f.connect(g);
    g.connect(AudioSys.sfx);
    src.start();
    lfo.start();
    this.nodes = { src, lfo, g, f, kind };
    this.kind = kind;
    this.evT = 1;
  },
  setStorm(s) {
    if (!this.nodes || this.kind !== 'desert') return;
    const c = AudioSys.ctx;
    this.nodes.g.gain.setTargetAtTime(0.1 + s * 0.35, c.currentTime, 0.4);
  },
  update(dt) {
    if (!this.nodes) return;
    this.evT -= dt;
    if (this.evT > 0) return;
    this.evT = rnd(0.6, 2.5);
    if (this.kind === 'tomb') {
      const f = rnd(1800, 3200);
      tone('sine', f, f * 0.7, 0.08, { gain: 0.03, rev: 0.9 });
    } else if (this.kind === 'andor') {
      tone('sine', rnd(400, 800), 0, 1.2, { gain: 0.012, attack: 0.4, rev: 0.8 });
    } else if (this.kind === 'bazaar' && Math.random() < 0.5) {
      // distant voices: vowel-like formant blips
      tone('sawtooth', rnd(160, 240), rnd(140, 220), rnd(0.15, 0.35), { gain: 0.012, lp: 900, attack: 0.03 });
    }
  },
  stop() {
    if (!this.nodes) return;
    try {
      this.nodes.src.stop();
      this.nodes.lfo.stop();
    } catch (e) {}
    this.nodes = null;
  },
};

// --- Logo: A as an iwan arch, N as twin minarets, D as a dome, O as the
// eight-pointed khatam star, R with a calligraphic tail into the baseline.
const LOGO_LETTERS = {
  A: ['......#......', '.....###.....', '.....###.....', '....#####....', '....##.##....', '...###.###...', '...##...##...', '..###...###..', '..##.....##..', '..##.....##..', '.###.....###.', '.###########.', '.###########.', '.##.......##.', '###.......###', '###.......###', '###.......###', '###.......###'],
  N: ['#.........#..', '##........##.', '###.......###', '###.......###', '####......###', '#####.....###', '###.##....###', '###..##...###', '###...##..###', '###....##.###', '###.....#####', '###......####', '###.......###', '###.......###', '###.......###', '###.......###', '###.......###', '###.......###'],
  D: ['#...........', '##..........', '#######.....', '###...###...', '###.....##..', '###......##.', '###......###', '###.......##', '###.......##', '###.......##', '###.......##', '###......###', '###......##.', '###.....##..', '###....###..', '###..###....', '########....', '######......'],
  R: ['#...........', '##..........', '#######.....', '###...###...', '###....###..', '###.....##..', '###....###..', '###...###...', '#######.....', '######......', '###.###.....', '###..###....', '###...###...', '###....###..', '###.....###.', '###......###', '###.......##', '###........#'],
};
function buildLogo() {
  const W = 92, H = 24;
  const m = new Uint8Array(W * H);
  const set = (x, y) => {
    if (x >= 0 && y >= 0 && x < W && y < H) m[y * W + x] = 1;
  };
  const stamp = (rows, ox, oy) => rows.forEach((r, y) => [...r].forEach((ch, x) => ch === '#' && set(ox + x, oy + y)));
  let x = 2;
  stamp(LOGO_LETTERS.A, x, 2);
  x += 16;
  stamp(LOGO_LETTERS.N, x, 2);
  x += 16;
  stamp(LOGO_LETTERS.D, x, 2);
  x += 15;
  // O: eight-pointed star outline with a diamond heart
  const cx = x + 8, cy = 11;
  for (let yy = -9; yy <= 9; yy++)
    for (let xx = -9; xx <= 9; xx++) {
      const sq = Math.max(Math.abs(xx), Math.abs(yy));
      const di = (Math.abs(xx) + Math.abs(yy)) / 1.414;
      const inside = (sq <= 6.6 || di <= 6.9) && !(sq <= 4.4 && di <= 4.6);
      if (inside) set(cx + xx, cy + yy);
      if (Math.abs(xx) + Math.abs(yy) <= 1) set(cx + xx, cy + yy);
    }
  x += 19;
  stamp(LOGO_LETTERS.R, x, 2);
  // kashida baseline swash sweeping from under A to beyond R
  for (let i = 4; i < W - 4; i++) {
    const y = 21 + Math.round(Math.sin((i / (W - 8)) * Math.PI) * 1.2);
    set(i, y);
    if (i > 8 && i < W - 10) set(i, y + 1);
  }
  for (const [dx, dy] of [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]]) set(W - 4 + dx, 21 + dy);
  // diacritic diamonds above N and R
  for (const px of [24, 83]) for (const [dx, dy] of [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]]) set(px + dx, 1 + dy - 1 + 1);
  // colour: bevelled gold with an ink outline and drop shadow
  const pb = new PixBuf(W + 2, H + 2);
  const at = (xx, yy) => xx >= 0 && yy >= 0 && xx < W && yy < H && m[yy * W + xx];
  const grad = ['#fff1b3', '#f8dd86', '#f4cf62', '#e9b546', '#dea12a', '#c48420', '#a86d16', '#8a5412'];
  for (let yy = 0; yy < H; yy++)
    for (let xx = 0; xx < W; xx++) {
      if (at(xx, yy)) continue;
      if (at(xx - 1, yy - 1)) pb.set(xx + 1, yy + 1, C('#120a05'));
    }
  for (let yy = 0; yy < H; yy++)
    for (let xx = 0; xx < W; xx++) {
      if (!at(xx, yy)) {
        if (at(xx - 1, yy) || at(xx + 1, yy) || at(xx, yy - 1) || at(xx, yy + 1)) pb.set(xx, yy, C('#1c0f08'));
        continue;
      }
      let col = grad[Math.min(grad.length - 1, Math.floor((yy / H) * grad.length))];
      if (!at(xx, yy - 1) || !at(xx - 1, yy)) col = '#fff8e0';
      else if (!at(xx, yy + 1) || !at(xx + 1, yy)) col = '#7a4410';
      pb.set(xx, yy, C(col));
    }
  return pb.toCanvas();
}
let LOGO = null;
function drawLogo(g, cx, y, scale, t) {
  if (!LOGO) LOGO = buildLogo();
  const w = LOGO.width * scale, h = LOGO.height * scale;
  const x = Math.round(cx - w / 2);
  // sweeping sheen, masked to the gold so it never touches the sky
  const sweep = ((t * 0.35) % 1.6) - 0.3;
  if (sweep > 0 && sweep < 1) {
    if (!drawLogo.tmp) drawLogo.tmp = makeCanvas(LOGO.width, LOGO.height);
    const tc = drawLogo.tmp, tg = tc.getContext('2d');
    tg.globalCompositeOperation = 'source-over';
    tg.clearRect(0, 0, tc.width, tc.height);
    tg.drawImage(LOGO, 0, 0);
    tg.globalCompositeOperation = 'source-atop';
    const sx = sweep * LOGO.width;
    tg.fillStyle = 'rgba(255,248,224,0.55)';
    for (let i = 0; i < LOGO.height; i++) tg.fillRect(Math.round(sx + i * 0.5 - LOGO.height * 0.25), i, 3, 1);
    g.drawImage(tc, x, y, w, h);
  } else g.drawImage(LOGO, x, y, w, h);
}

const STAR8 = mkSprite(['...k...', '..kyk..', 'kkyYykk', 'kyYwYyk', 'kkyYykk', '..kyk..', '...k...'], { k: '#3a1e06', y: '#dea12a', Y: '#f4cf62', w: '#fff8ea' }, 3, 3);
const STAR8B = mkSprite(['....k....', '...kyk...', 'kkkyYykkk', 'kyyYwYyyk', 'kyYwwwYyk', 'kyyYwYyyk', 'kkkyYykkk', '...kyk...', '....k....'], { k: '#3a1e06', y: '#dea12a', Y: '#f4cf62', w: '#fff8ea' }, 4, 4);

// Illuminated panel: ink field with a faint girih lattice and gilded border.
const _panelCache = new Map();
function drawPanel(g, x, y, w, h, o = {}) {
  x = Math.round(x);
  y = Math.round(y);
  w = Math.round(w);
  h = Math.round(h);
  const key = w + 'x' + h + (o.parchment ? 'p' : '') + (o.alpha || '');
  let c = _panelCache.get(key);
  if (!c) {
    const pb = new PixBuf(w, h);
    const base = o.parchment ? ['#e9d5a6', '#dcc391', '#c9ad78'] : ['#1a110c', '#160e0a', '#22160f'];
    const lat = o.parchment ? C('#d2b98a') : C('#2a1c12');
    for (let yy = 0; yy < h; yy++)
      for (let xx = 0; xx < w; xx++) {
        const v = fbm(xx / 18, yy / 18, o.parchment ? 4 : 2);
        let col = C(v > 0.56 ? base[2] : v > 0.44 ? base[0] : base[1]);
        if (GIRIH[(yy >> 1) & 7][(xx >> 1) & 7] === 't' && !o.parchment) col = lat;
        if (o.parchment && fbm(xx / 6, yy / 6, 9) > 0.7 && bayer(xx, yy) > 0.5) col = lat;
        pb.set(xx, yy, col);
      }
    const gold = C('#dea12a'), goldL = C('#f4cf62'), goldD = C('#8a5412'), ink = C('#0e0805');
    for (let xx = 0; xx < w; xx++) {
      pb.set(xx, 0, ink);
      pb.set(xx, h - 1, ink);
      pb.set(xx, 1, goldD);
      pb.set(xx, h - 2, goldD);
      pb.set(xx, 2, goldL);
      pb.set(xx, h - 3, gold);
      if (xx > 4 && xx < w - 5 && (xx % 4 === 0)) {
        pb.set(xx, 4, gold);
        pb.set(xx, h - 5, gold);
      }
    }
    for (let yy = 0; yy < h; yy++) {
      pb.set(0, yy, ink);
      pb.set(w - 1, yy, ink);
      pb.set(1, yy, goldD);
      pb.set(w - 2, yy, goldD);
      pb.set(2, yy, goldL);
      pb.set(w - 3, yy, gold);
      if (yy > 4 && yy < h - 5 && yy % 4 === 0) {
        pb.set(4, yy, gold);
        pb.set(w - 5, yy, gold);
      }
    }
    c = pb.toCanvas();
    if (_panelCache.size > 40) _panelCache.clear();
    _panelCache.set(key, c);
  }
  if (o.alpha) g.globalAlpha = o.alpha;
  g.drawImage(c, x, y);
  g.globalAlpha = 1;
  for (const [cx, cy] of [[x + 3, y + 3], [x + w - 4, y + 3], [x + 3, y + h - 4], [x + w - 4, y + h - 4]]) drawSprite(g, STAR8, cx + 0.5, cy + 0.5);
}
// Horizontal flourish divider.
function drawDivider(g, cx, y, w, col = '#dea12a') {
  const x0 = Math.round(cx - w / 2);
  fillR(g, x0, y, w, 1, col);
  fillR(g, x0 + 4, y + 1, w - 8, 1, '#6e3f10');
  drawSprite(g, STAR8, cx, y);
  fillR(g, x0 - 2, y - 1, 2, 3, col);
  fillR(g, x0 + w, y - 1, 2, 3, col);
}

// --- Menu widget -------------------------------------------------------------
// items: [{label, action, disabled, value (string), adjust(dir)}]
class Menu {
  constructor(items, o = {}) {
    this.items = items;
    this.sel = 0;
    this.o = o;
    this.rects = [];
    this.t = 0;
    while (this.items[this.sel] && this.items[this.sel].disabled) this.sel++;
  }
  move(d) {
    const n = this.items.length;
    for (let k = 0; k < n; k++) {
      this.sel = (this.sel + d + n) % n;
      if (!this.items[this.sel].disabled) break;
    }
    Sfx.play('menu');
  }
  update(dt) {
    this.t += dt;
    const it = this.items[this.sel];
    if (Input.takePress('up')) this.move(-1);
    if (Input.takePress('down')) this.move(1);
    if (it && it.adjust) {
      if (Input.takePress('left')) it.adjust(-1);
      if (Input.takePress('right')) it.adjust(1);
    }
    // mouse hover
    if (Input.hover && !Input.touchMode) {
      const p = screenToView(Input.hover);
      this.rects.forEach((r, i) => {
        if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h && !this.items[i].disabled && this.sel !== i) {
          this.sel = i;
          Sfx.play('menu');
        }
      });
    }
    for (const tap of Input.taps) {
      const p = screenToView(tap);
      this.rects.forEach((r, i) => {
        if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y - 2 && p.y <= r.y + r.h + 2 && !this.items[i].disabled) {
          this.sel = i;
          const item = this.items[i];
          if (item.adjust) item.adjust(p.x < r.x + r.w / 2 ? -1 : 1);
          else this.activate();
        }
      });
    }
    if (Input.takePress('confirm')) {
      if (it && it.adjust && !it.action) it.adjust(1);
      else this.activate();
    }
    if (Input.takePress('back') && this.o.onBack) {
      Sfx.play('back');
      this.o.onBack();
    }
  }
  activate() {
    const it = this.items[this.sel];
    if (!it || it.disabled) return;
    Sfx.play('select');
    if (it.action) it.action();
  }
  draw(g, cx, y, o = {}) {
    const lh = o.lineH || 13;
    this.rects = [];
    const w = o.width || 150;
    this.items.forEach((it, i) => {
      const yy = y + i * lh;
      const sel = i === this.sel;
      const col = it.disabled ? '#6e5a44' : sel ? '#f4cf62' : '#e9dcc0';
      let label = it.label;
      if (it.value !== undefined) label = it.label + '   ' + (typeof it.value === 'function' ? it.value() : it.value);
      drawText(g, label, cx, yy, col, { align: 'center', shadow: '#0e0805' });
      if (sel && !it.disabled) {
        const tw = textWidth(label);
        const bob = Math.round(Math.sin(this.t * 6) * 1);
        drawSprite(g, STAR8, cx - tw / 2 - 8 - bob, yy + 4);
        drawSprite(g, STAR8, cx + tw / 2 + 8 + bob, yy + 4);
        if (it.adjust) {
          drawText(g, '{', cx - tw / 2 - 18, yy, '#dea12a');
          drawText(g, '}', cx + tw / 2 + 13, yy, '#dea12a');
        }
      }
      this.rects.push({ x: cx - w / 2, y: yy - 2, w, h: lh - 1 });
    });
  }
}
function screenToView(p) {
  return { x: p.x - Screen.vx, y: p.y - Screen.vy };

// --- HUD -----------------------------------------------------------------
function drawHeart(g, x, y, state, t) {
  // state 2 = full, 1 = bitten, 0 = empty
  const s = ART.pomegranate;
  if (state === 0) {
    g.globalAlpha = 0.35;
    drawSprite(g, s, x, y, false, false);
    g.globalAlpha = 1;
    fillR(g, x - 3, y - 6, 7, 5, 'rgba(14,8,5,0.6)');
    return;
  }
  drawSprite(g, s, x, y);
}
function drawHUD(g, vw, vh, t) {
  const p = Game.player;
  if (!p) return;
  const H = Game.hud;
  H.pulse = Math.max(0, H.pulse - STEP * 2);
  // health
  for (let i = 0; i < p.maxHp; i++) {
    const full = i < p.hp;
    const bob = full && p.hp === 1 ? Math.round(Math.sin(t * 10) * 1) : 0;
    drawHeart(g, 9 + i * 11, 13 + bob - (H.pulse > 0 && full ? 1 : 0), full ? 2 : 0, t);
  }
  if (p.feather) {
    const fx = 9 + p.maxHp * 11 + 2;
    fillR(g, fx, 5, 1, 8, '#3fb5a3');
    fillR(g, fx + 1, 4, 1, 7, '#8de0c8');
    fillR(g, fx - 1, 7, 1, 5, '#dea12a');
  }
  // dinars
  drawSprite(g, ART.coin[0], 7, 27);
  drawText(g, String(Game.run.coins), 13, 20, '#f4cf62', { outline: '#0e0805' });
  // relic slots
  const rs = Game.runRelics;
  for (let i = 0; i < 3; i++) {
    const x = vw - (Input.touchMode && TouchUI.visible ? 28 : 10) - (2 - i) * 11, y = 13;
    if (rs[i]) drawSprite(g, ART.relics[Game.level.theme.name], x, y + 5);
    else {
      fillR(g, x - 3, y - 3, 7, 7, 'rgba(14,8,5,0.5)');
      drawSprite(g, STAR8, x, y);
    }
  }
  if (Settings.showTimer) drawText(g, fmtTime(Game.run.time), vw / 2, 4, '#e9dcc0', { align: 'center', outline: '#0e0805' });
  // compass needle toward the nearest unfound relic
  if (Game.upgrades().compass && Game.level) {
    let best = null, bd = 1e9;
    for (const e of Game.entities) if (e instanceof Relic) {
      const d = dist(e.cx, e.cy, p.cx, p.cy);
      if (d < bd) { bd = d; best = e; }
    }
    if (best && bd > 60) {
      const a = Math.atan2(best.cy - p.cy, best.cx - p.cx);
      const cx = Math.round(p.cx - Cam.rx + Math.cos(a) * 20), cy = Math.round(p.cy - Cam.ry + Math.sin(a) * 20);
      g.globalAlpha = 0.5 + 0.3 * Math.sin(t * 5);
      fillR(g, cx - 1, cy - 1, 3, 3, '#f4cf62');
      fillR(g, cx, cy, 1, 1, '#fff8ea');
      g.globalAlpha = 1;
    }
  }
  // boss bar
  const b = Game.boss;
  if (b && !b.dead && b.introDone) {
    const w = Math.min(170, vw - 96), x = Math.round(vw / 2 - w / 2), y = 17;
    drawText(g, b.title, vw / 2, 4, '#f4cf62', { align: 'center', outline: '#0e0805' });
    fillR(g, x - 2, y - 2, w + 4, 8, '#0e0805');
    fillR(g, x - 1, y - 1, w + 2, 6, '#6e3f10');
    fillR(g, x, y, w, 4, '#2a1410');
    const fw = Math.round((w * Math.max(0, b.hp)) / b.maxHp);
    b.shownHp = b.shownHp === undefined ? fw : approach(b.shownHp, fw, 60 * STEP);
    fillR(g, x, y, b.shownHp, 4, '#f4cf62');
    fillR(g, x, y, fw, 4, '#c0392b');
    fillR(g, x, y, fw, 1, '#ef7d52');
    drawSprite(g, STAR8, x - 3, y + 2);
    drawSprite(g, STAR8, x + w + 3, y + 2);
  }
  // banner (wrapped onto two lines on narrow screens)
  if (Game.bannerT > 0) {
    const a = Math.min(1, Game.bannerT * 3, (Game.bannerMax - Game.bannerT) * 4);
    g.globalAlpha = a;
    const lines = wrapText(Game.bannerText, vw - 36);
    const bw = Math.min(vw - 16, Math.max(...lines.map((l) => textWidth(l))) + 24);
    const bh = lines.length * 10 + 4;
    const by = 32;
    fillR(g, vw / 2 - bw / 2, by, bw, bh, 'rgba(14,8,5,0.78)');
    fillR(g, vw / 2 - bw / 2, by, bw, 1, '#dea12a');
    fillR(g, vw / 2 - bw / 2, by + bh - 1, bw, 1, '#dea12a');
    drawSprite(g, STAR8, vw / 2 - bw / 2, by + bh / 2);
    drawSprite(g, STAR8, vw / 2 + bw / 2 - 1, by + bh / 2);
    lines.forEach((l, i) => drawText(g, l, vw / 2, by + 3 + i * 10, '#f4cf62', { align: 'center' }));
    g.globalAlpha = 1;
  }
}
function fmtTime(s) {
  const m = Math.floor(s / 60), ss = Math.floor(s % 60), cs = Math.floor((s * 100) % 100);
  return m + ':' + String(ss).padStart(2, '0') + '.' + String(cs).padStart(2, '0');
}

// --- Touch controls ----------------------------------------------------------
function drawTouchControls(g, t) {
  if (!Input.touchMode || !TouchUI.visible) return;
  const portrait = Screen.portrait;
  if (portrait) {
    // the handheld deck: carved wood with brass trim
    const y0 = Screen.vh;
    const dh = Screen.H - y0;
    if (!drawTouchControls.deck || drawTouchControls.deck.width !== Screen.W || drawTouchControls.deck.height !== dh) {
      const pb = new PixBuf(Screen.W, dh);
      for (let y = 0; y < dh; y++)
        for (let x = 0; x < Screen.W; x++) {
          const v = fbm(x / 30, y / 8, 31);
          let col = v > 0.55 ? '#3a2416' : v > 0.42 ? '#2f1d12' : '#26170e';
          if (GIRIH[(y >> 2) & 7][(x >> 2) & 7] === 't' && v > 0.5) col = '#432a19';
          pb.set(x, y, C(col));
        }
      for (let x = 0; x < Screen.W; x++) {
        pb.set(x, 0, C('#0e0805'));
        pb.set(x, 1, C('#f4cf62'));
        pb.set(x, 2, C('#a86d16'));
        pb.set(x, 3, C('#6e3f10'));
      }
      drawTouchControls.deck = pb.toCanvas();
    }
    g.drawImage(drawTouchControls.deck, 0, y0);
  }
  const alpha = portrait ? 1 : 0.55;
  const sc = Settings.touchSize || 1;
  for (const c of Input.controls) {
    if (c.id === 'pause') {
      g.globalAlpha = 0.7;
      fillR(g, c.x - 7, c.y - 7, 14, 14, '#1a110c');
      fillR(g, c.x - 7, c.y - 7, 14, 1, '#dea12a');
      fillR(g, c.x - 7, c.y + 6, 14, 1, '#8a5412');
      fillR(g, c.x - 3, c.y - 3, 2, 7, '#f4cf62');
      fillR(g, c.x + 2, c.y - 3, 2, 7, '#f4cf62');
      g.globalAlpha = 1;
      continue;
    }
    const pressed = Input.touch[c.id];
    const r = Math.round(c.r * sc);
    g.globalAlpha = pressed ? Math.min(1, alpha + 0.3) : alpha;
    pxCircle(g, c.x, c.y + 1, r, '#0e0805');
    pxCircle(g, c.x, c.y, r, pressed ? '#6e3f10' : '#2a1a10');
    pxRing(g, c.x, c.y, r, '#dea12a');
    pxRing(g, c.x, c.y, r - 2, pressed ? '#f4cf62' : '#8a5412');
    // eight-point star motif inside
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * TAU + (pressed ? 0.2 : 0);
      fillR(g, c.x + Math.cos(a) * (r - 4), c.y + Math.sin(a) * (r - 4), 1, 1, '#6e3f10');
    }
    const ic = pressed ? '#fff8ea' : '#f4cf62';
    if (c.id === 'jump') {
      for (let i = 0; i < 5; i++) fillR(g, c.x - i, c.y - 3 + i, i * 2 + 1, 1, ic);
      fillR(g, c.x - 1, c.y + 2, 3, 4, ic);
    } else if (c.id === 'whip') {
      // a coiled lash
      for (let i = 0; i < 10; i++) {
        const a = i * 0.75;
        fillR(g, c.x + Math.cos(a) * (1 + i * 0.45) - 1, c.y + Math.sin(a) * (1 + i * 0.45), 1, 1, ic);
      }
      fillR(g, c.x + 3, c.y + 3, 3, 1, ic);
      fillR(g, c.x + 5, c.y + 4, 2, 1, ic);
    } else if (c.id === 'roll') {
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * TAU * 0.85;
        fillR(g, c.x + Math.cos(a) * 4, c.y + Math.sin(a) * 4, 1, 1, ic);
      }
      fillR(g, c.x + 3, c.y - 2, 3, 1, ic);
      fillR(g, c.x + 4, c.y - 3, 1, 3, ic);
    }
    g.globalAlpha = 1;
  }
  // joystick
  const s = Input.stick;
  const R = TouchUI.stickR;
  const ox = s ? s.ox : TouchUI.stickHome.x, oy = s ? s.oy : TouchUI.stickHome.y;
  g.globalAlpha = s ? 0.85 : portrait ? 0.7 : 0.35;
  pxRing(g, ox, oy, R, '#dea12a');
  pxRing(g, ox, oy, R - 1, '#6e3f10');
  for (let k = 0; k < 4; k++) {
    const a = (k / 4) * TAU;
    fillR(g, ox + Math.cos(a) * (R - 4) - 1, oy + Math.sin(a) * (R - 4) - 1, 2, 2, '#8a5412');
  }
  let kx = ox, ky = oy;
  if (s) {
    const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy);
    const m = Math.min(d, R * 0.7);
    if (d > 0) {
      kx = ox + (dx / d) * m;
      ky = oy + (dy / d) * m;
    }
  }
  pxCircle(g, kx, ky + 1, R * 0.45, '#0e0805');
  pxCircle(g, kx, ky, R * 0.45, '#3a2416');
  pxRing(g, kx, ky, R * 0.45, '#f4cf62');
  drawSprite(g, STAR8, kx + 0.5, ky + 0.5);
  g.globalAlpha = 1;
}
