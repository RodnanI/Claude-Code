    this.bossDone = false;
    this.totalCoins = 0;
    for (const s of this.level.spawns) this.totalCoins += s.ch === 'o' ? 1 : s.ch === 'O' ? 10 : s.ch === '$' ? 25 : 0;
    Weather.init();
    Weather.storm = Weather.target = 0;
    this.spawnAll();
    Cam.reset(this.player.cx, this.player.cy, this.level);
    Parts.list.length = 0;
  },
  spawnAll() {
    const L = this.level;
    this.entities = [];
    this.pending = [];
    this.rings = [];
    this.platforms = [];
    this.stoppers = [];
    this.boulders = [];
    this.boss = null;
    this.bossTriggers = [];
    let start = { x: 32, y: 32 };
    let relicI = 0, scrollI = 0, cpI = 0;
    // restore tiles altered by gates and crumbles
    for (const s of L.spawns) if (s.ch === 'G' || s.ch === 'C') L.setTile(s.x, s.y, s.ch === 'G' ? T.GATE : T.CRUMBLE);
    const gateCols = new Set();
    for (const s of L.spawns) {
      const id = s.x + s.y * L.w;
      const px = s.x * TILE, py = s.y * TILE;
      const add = (e) => {
        this.entities.push(e);
        return e;
      };
      switch (s.ch) {
        case '@': start = { x: px + 3, y: py - 4 }; break;
        case 'o': if (!this.collected.has(id)) add(new Coin(px + 8, py + 8, 1, false, id)); break;
        case 'O': if (!this.collected.has(id)) add(new Coin(px + 8, py + 8, 10, false, id)); break;
        case '$': if (!this.collected.has(id)) add(new Coin(px + 8, py + 8, 25, false, id)); break;
        case 'h': if (!this.collected.has(id)) add(new Pomegranate(px + 8, py + 10, false, id)); break;
        case '*': {
          const r = new Relic(px + 8, py + 8, relicI++);
          if (!this.collected.has(id)) add(r).sid = id;
          break;
        }
        case 'I': {
          const r = new Relic(px + 8, py + 8, 2);
          r.idol = true;
          if (!this.collected.has(id)) add(r).sid = id;
          break;
        }
        case 'S': add(new Decor(px + 8 - ART.sarcophagus.ax, py + 16 - ART.sarcophagus.h, ART.sarcophagus)); break;
        case 'V': add(new Crystal(px, py)); break;
        case 'U': add(new LightShaft(px, py)); break;
        case '?': {
          const sc = new Scroll(px + 8, py + 10, scrollI++);
          if (!this.collected.has(id)) add(sc).sid = id;
          break;
        }
        case 'K': {
          const cp = add(new Checkpoint(px, py, cpI++));
          if (this.litCheckpoints.has(cp.idx)) cp.lit = true;
          break;
        }
        case 'E': add(new Exit(px, py)); break;
        case 'R': this.rings.push(add(new Ring(px + 8, py + 4))); break;
        case 'P': if (!this.collected.has(id)) add(new Pot(px, py, id)); break;
        case 'L': add(new Lever(px, py)); break;
        case 'G': {
          if (gateCols.has(id)) break;
          let n = 0;
          while (L.tileAt(s.x, s.y + n) === T.GATE) {
            gateCols.add(s.x + (s.y + n) * L.w);
            n++;
          }
          add(new Gate(px, py, Math.max(1, n)));
          break;
        }
        case 'C': add(new Crumble(px, py)); break;
        case 't': add(new Torch(px, py)); break;
        case 'l': add(new Lantern(px, py)); break;
        case 'M': this.platforms.push(add(new MovingPlatform(px, py + 10, false))); break;
        case 'N': this.platforms.push(add(new MovingPlatform(px, py + 10, true))); break;
        case 'x': this.stoppers.push({ x: px, y: py }); break;
        case 'D': {
          L.setTile(s.x, s.y, T.SOLID);
          const dir = isSolidT(L.tileAt(s.x + 1, s.y)) ? -1 : 1;
          add(new DartTrap(px, py, dir, ((s.x * 7 + s.y * 3) % 10) / 10 * 2.1));
          break;
        }
        case 'Y': add(new SwingBlade(px, py, s.x * 0.9)); break;
        case 'f': add(new FireJet(px, py, ((s.x * 5) % 7) / 7 * 2.6)); break;
        case 'r': add(new FallingRock(px, py)); break;
        case 'B': this.boulders.push(add(new Boulder(px, py - 28))); break;
        case '&': this.boulderTrigger = px; break;
        case 'g': add(new Guard(px, py, 'guard')); break;
        case 'd': add(new Guard(px, py, 'bandit')); break;
        case 'a': add(new Archer(px, py)); break;
        case 's': add(new Scorpion(px, py)); break;
        case 'c': add(new Cobra(px, py)); break;
        case 'u': add(new Vulture(px, py)); break;
        case 'b': add(new Bat(px, py)); break;
        case 'm': add(new Mummy(px, py)); break;
        case 'k': for (let i = 0; i < 3; i++) add(new Scarab(px + i * 7 - 7, py)); break;
        case 'j': add(new Jackal(px, py)); break;
        case 'n': add(new Sentinel(px, py)); break;
        case 'z': add(new Wisp(px, py)); break;
        case '1': case '2': case '3': case '4':
          if (!this.bossDone) this.boss = add(makeBoss(+s.ch, px, py));
          break;
        case 'Q': add(new Decor(px, py + 5, ART.camel)); break;
        case 'p': add(new Decor(px + 8 - ART.palm.ax, py + 16 - ART.palm.h, ART.palm)); break;
        case 'T': add(new Decor(px + 8 - ART.tent.ax, py + 16 - ART.tent.h, ART.tent)); break;
        case 'Z': add(new Decor(px + 5, py + 11, ART.skull)); break;
      }
    }
    // the player
    const cp = this.checkpoint;
    const p = new Player(cp ? cp.x : start.x, cp ? cp.y : start.y);
    this.player = p;
    p.lastSafe = { x: p.x, y: p.y };
    if (this.featherUsed) p.feather = 0;
  },
  setCheckpoint(cp) {
    if (this.checkpoint && this.checkpoint.idx === cp.idx) return;
    this.checkpoint = { x: cp.cx - 5, y: cp.y - 6, idx: cp.idx };
    this.litCheckpoints.add(cp.idx);
  },
  onRelic(r) {
    const already = this.save.relics[this.chapterIdx][r.idx];
    this.runRelics[r.idx] = true;
    this.save.relics[this.chapterIdx][r.idx] = true;
    if (r.sid !== undefined) this.collected.add(r.sid);
    this.persist();
    Sfx.play('relic');
    Cam.shake(2, 0.3);
    this.hitstop(0.12);
    Parts.burst(r.cx, r.cy, 30, { col: ['#fff1b3', '#f4cf62', '#fff8ea'], speed: 120, g: -30, life: 1 });
    Parts.add({ x: r.cx, y: r.cy, type: 'ring', s: 30, life: 0.6, col: '#f4cf62' });
    const n = this.runRelics.filter(Boolean).length;
    this.banner((already ? 'RELIC (ALREADY KNOWN) ' : 'RELIC FOUND ') + n + '/3: ' + RELIC_NAMES[this.chapterIdx][r.idx], 2.6);
    if (r.idol && this.boulders.length) {
      // the golden idol was resting on a pressure plate...
      setTimeout(() => {
        if (this.state === 'play') for (const b of this.boulders) if (!b.active && !b.dead) b.start();
      }, 700);
    }
  },
  onScroll(idx) {
    const L = LEVELS[this.chapterIdx];
    const text = (L.scrolls && L.scrolls[idx]) || '...';
    Sfx.play('magic');
    this.go('scroll', text);
  },
  onExit(ex) {
    const p = this.player;
    p.setState('exit');
    p.face = 1;
    Music.stop(1.2);
    Ambience.stop();
    setTimeout(() => Music.phrase('victory'), 300);
    this.fadeOut(1.4, () => this.completeChapter());
  },
  completeChapter() {
    const idx = this.chapterIdx;
    const L = LEVELS[idx];
    const t = this.run.time;
    const d = this.stats.deaths;
    const coinPct = this.totalCoins ? this.run.coins / this.totalCoins : 1;
    let rank = 'C';
    if (d === 0 && t <= L.par && coinPct >= 0.7) rank = 'S';
    else if (d <= 1 && t <= L.par * 1.35) rank = 'A';
    else if (d <= 4) rank = 'B';
    const res = { time: t, deaths: d, coins: this.run.coins, total: this.totalCoins, relics: this.runRelics.filter(Boolean).length, rank, kills: this.stats.kills };
    const best = this.save.best[idx];
    const order = 'SABC';
    if (!best || order.indexOf(rank) < order.indexOf(best.rank) || (rank === best.rank && t < best.time)) this.save.best[idx] = { rank, time: t };
    this.save.unlocked = Math.max(this.save.unlocked, Math.min(LEVELS.length - 1, idx + 1));
    this.save.chapter = Math.min(LEVELS.length - 1, idx + 1);
    if (idx === LEVELS.length - 1) this.save.completed = true;
    this.persist();
    this.go('results', res);
    this.fadeIn(0.5);
  },
  onPlayerDeath() {
    this.save.totalDeaths++;
    this.persist();
    this.go('dead');
  },
  respawn() {
    // the world resets around you; collected things stay collected
    if (this.boss) this.boss = null;
    Cam.lock = null;
    if (this.arenaSealed) this.unsealArena();
    this.spawnAll();
    const p = this.player;
    p.inv = 1.2;
    Cam.reset(p.cx, p.cy, this.level);
    Parts.list.length = 0;
    Music.play(LEVELS[this.chapterIdx].music);
    this.go('play');
    this.fadeIn(0.4);
  },
  sealArena(A) {
    this.arenaSealed = [];
    for (const [x, y, h] of A.seal || []) {
      for (let i = 0; i < h; i++) {
        this.arenaSealed.push([x, y + i, this.level.tileAt(x, y + i)]);
        this.level.setTile(x, y + i, T.GATE);
      }
      const g = new Gate(x * TILE, y * TILE, h);
      g.arena = true;
      this.entities.push(g);
    }
  },
  unsealArena() {
    for (const [x, y, t] of this.arenaSealed || []) this.level.setTile(x, y, t);
    this.arenaSealed = null;
    for (const e of this.entities) if (e instanceof Gate && e.arena) e.dead = true;
  },
  onBossDefeated(b) {
    this.bossDone = true;
    this.slowmo(0.25, 1.4);
    Cam.shake(6, 1);
    this.flash('#fff8ea', 0.8);
    Music.stop(2);
    setTimeout(() => {
      Music.phrase('victory');
      this.unsealArena();
      Cam.lock = null;
      setTimeout(() => {
        if (this.state === 'play') Music.play(LEVELS[this.chapterIdx].music, 2);
      }, 3000);
    }, 1500);
    this.banner(b.title + ' FALLS', 3);
  },

  // ---- world update --------------------------------------------------------
  stepWorld(dt) {
    const L = this.level, p = this.player;
    if (this.hitstopT > 0) {
      this.hitstopT -= dt;
      return;
    }
    this.run.time += dt;
    for (const pl of this.platforms) pl.update(dt, L);
    p.update(dt, L);
    for (const e of this.entities) if (!e.dead && !(e instanceof MovingPlatform)) e.update(dt, L);
    if (this.pending.length) {
      for (const e of this.pending) this.entities.push(e);
      this.pending.length = 0;
    }
    this.entities = this.entities.filter((e) => !e.dead);
    Parts.update(dt);
    // weather zones
    const def = LEVELS[this.chapterIdx];
    let storm = 0;
    if (def.storm) for (const [x0, x1, s] of def.storm) if (p.cx >= x0 * TILE && p.cx <= x1 * TILE) storm = s;
    Weather.target = storm;
    Weather.update(dt);
    Ambience.setStorm(Weather.storm);
    Ambience.update(dt);
    // boss arena
    const A = def.arena;
    if (A && this.boss && !this.boss.active && !this.bossDone) {
      const ax = A.x * TILE, ay = A.y * TILE;
      if (p.x > ax + A.trigger * TILE && p.x < ax + A.w * TILE && p.y > ay && p.y < ay + A.h * TILE) {
        Cam.lock = { x: ax, y: ay, w: A.w * TILE, h: A.h * TILE };
        this.sealArena(A);
        this.boss.activate();
        Music.play('boss', 0.3);
      }
    }
    // tutorial hints, each once per chapter run
    if (def.hints)
      for (let i = 0; i < def.hints.length; i++) {
        if (this.hintsShown.has(i)) continue;
        const [hx, hy, hw, hh, key] = def.hints[i];
        if (p.cx >= hx * TILE && p.cx <= (hx + hw) * TILE && p.cy >= hy * TILE && p.cy <= (hy + hh) * TILE) {
          this.hintsShown.add(i);
          this.banner(hintText(key), 4.2);
        }
      }
    // boulder trigger
    if (this.boulderTrigger !== undefined && p.x > this.boulderTrigger) for (const b of this.boulders) if (!b.active && !b.dead) b.start();
    Cam.update(dt, p, L);
    if (this.bannerT > 0) this.bannerT -= dt;
  },
  drawWorld(g) {
    const vw = Screen.vw, vh = Screen.vh;
    const cam = { x: Cam.rx, y: Cam.ry };
    const L = this.level;
    this.backdrop.draw(g, cam, vw, vh, L.horizon, this.time);
    L.drawChunks(g, cam, vw, vh);
    for (const e of this.entities) if (e.layer === 0 && e.onScreen(48)) e.draw(g, cam);
    Parts.draw(g, cam, false);
    for (const e of this.entities) if (e.layer === 1 && e.onScreen(48)) e.draw(g, cam);
    this.player.draw(g, cam);
    for (const e of this.entities) if (e.layer === 2 && e.onScreen(80)) e.draw(g, cam);
    L.drawFakes(g, cam, this.player, STEP);
    Parts.draw(g, cam, true);
    const def = LEVELS[this.chapterIdx];
    if (def.dark) {
      Lighting.begin(def.dark, def.darkTint);
      const p = this.player;
      Lighting.add(p.cx, p.cy - 2, def.playerLight || 74, '#ffb050', 1);
      for (const e of this.entities) if (e.light && e.onScreen(90)) e.light();
      for (const pt of Parts.list) if (pt.type === 'puff' && (pt.col === '#ffc444' || pt.col === '#fff3b8')) Lighting.add(pt.x, pt.y, 10, null, 0.5);
      Lighting.render(g, cam, vw, vh);
    }
    Weather.draw(g, cam, vw, vh, this.time);
    Vignette.draw(g, vw, vh, def.dark ? 1 : 0.7);
    const p = this.player;
    if (p.hp === 1 && p.state !== 'dead') {
      // a heartbeat at the edges when one blow from the end
      const beat = Math.max(0, Math.sin(this.time * 5.5)) ** 3;
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = 0.25 + beat * 0.35;
      g.drawImage(Vignette.red(vw, vh), 0, 0);
      g.globalAlpha = 1;
    }
  },
};

const SCENES = {};

SCENES.boot = {
  enter() {
    this.t = 0;
  },
  update(dt) {
    this.t += dt;
    if (Input.anyKey || Input.taps.length) {
      AudioSys.init();
      Input.anyKey = false;
      Game.go('title');
    }
  },
  draw(g, vw, vh) {
    fillR(g, 0, 0, vw, vh, '#0e0907');
    const a = Math.min(1, this.t * 0.8);
    g.globalAlpha = a;
    const sc = vw >= 300 ? 3 : 2;
    drawLogo(g, vw / 2, vh * 0.32, sc, this.t);
    g.globalAlpha = a * (0.55 + 0.45 * Math.sin(this.t * 3));
    drawText(g, Input.touchMode || 'ontouchstart' in window ? 'TOUCH TO BEGIN' : 'PRESS ANY KEY', vw / 2, vh * 0.72, '#e9dcc0', { align: 'center' });
    g.globalAlpha = 1;
  },
};

SCENES.title = {
  enter() {
    this.t = 0;
    this.bd = new Backdrop('title');
    this.cam = { x: 0, y: 0 };
    this.mode = 'main';
    Music.play('title', 1.5);
    Ambience.play('desert');
    Ambience.setStorm(0);
    this.buildMenu();
    this.hero = { scarf: [] };
    for (let i = 0; i < 7; i++) this.hero.scarf.push({ x: 0, y: 0, px: 0, py: 0 });
  },
  buildMenu() {
    const S = Game.save;
    const items = [];
    if (S.started) items.push({ label: 'CONTINUE: CHAPTER ' + ROMAN[S.chapter], action: () => startChapterFlow(S.chapter, false) });
    items.push({ label: 'NEW JOURNEY', action: () => Game.go('difficulty') });
    items.push({ label: 'CHAPTERS', action: () => Game.go('chapters'), disabled: !S.started });
    items.push({ label: 'OPTIONS', action: () => Game.go('options', 'title') });
    items.push({ label: 'CREDITS', action: () => Game.go('credits') });
    this.menu = new Menu(items);
  },
  update(dt) {
    this.t += dt;
    this.cam.x += dt * 14;
    this.menu.update(dt);
    Ambience.update(dt);
  },
  draw(g, vw, vh) {
    this.bd.draw(g, this.cam, vw, vh, vh * 0.98, this.t);
    // foreground dune with the wanderer
    const duneY = vh - Math.max(30, vh * 0.16);
    g.fillStyle = '#1d1410';
    for (let x = 0; x < vw; x++) {
      const y = Math.round(duneY - Math.sin((x / vw) * Math.PI * 1.1 + 0.2) * 14);
      g.fillRect(x, y, 1, vh - y);
      if (x % 2 === 0) fillR(g, x, y, 1, 1, '#3a2a1c');
    }
    const hx = Math.round(vw * 0.18), hy = Math.round(duneY - Math.sin((hx / vw) * Math.PI * 1.1 + 0.2) * 14) + 1;
    const f = heroFrame('idle0');
    // scarf in the night wind
    const S = this.hero.scarf;
    S[0].x = hx - 5;
    S[0].y = hy - 20;
    for (let i = 1; i < S.length; i++) {
      const p = S[i];
      if (!p.init) {
        p.x = p.px = S[0].x - i * 2;
        p.y = p.py = S[0].y;
        p.init = true;
      }
      const vx = (p.x - p.px) * 0.86, vy = (p.y - p.py) * 0.86;
      p.px = p.x;
      p.py = p.y;
      p.x += vx - 0.35 + Math.sin(this.t * 6 + i) * 0.12;
      p.y += vy + 0.04 + Math.cos(this.t * 4 + i * 0.7) * 0.08;
    }
    for (let k = 0; k < 3; k++)
      for (let i = 1; i < S.length; i++) {
        const a = S[i - 1], b = S[i];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        const m = (d - 2.6) / d;
        b.x -= dx * m;
        b.y -= dy * m;
      }
    for (let i = S.length - 1; i > 0; i--) pxLine(g, S[i - 1].x, S[i - 1].y, S[i].x, S[i].y, i % 2 ? '#c0392b' : '#a8302a', i < 3 ? 2 : 1);
    drawSprite(g, f, hx, hy);
    // blowing sand
    for (let i = 0; i < 40; i++) {
      const sx = ((i * 97 + this.t * (60 + (i % 5) * 20)) % (vw + 20)) - 10;
      const sy = vh - 40 + ((i * 53) % 40) + Math.sin(this.t * 2 + i) * 3;
      fillR(g, vw - sx, sy, 2, 1, i % 3 ? '#5a4030' : '#8a6a48');
    }
    Vignette.draw(g, vw, vh, 1);
    const sc = vw >= 330 && vh >= 240 ? 3 : 2;
    const ly = Math.round(vh * (vh > 300 ? 0.14 : 0.07));
    drawLogo(g, vw / 2, ly, sc, this.t);
    const sub = ly + 26 * sc + 3;
    drawText(g, 'THE SANDS REMEMBER', vw / 2, sub, '#e9dcc0', { align: 'center', shadow: '#0e0805' });
    const my = Math.max(sub + 18, Math.round(vh * 0.48));
    this.menu.draw(g, vw / 2, my, { width: 170 });
    const hint = Input.touchMode ? 'TAP TO CHOOSE' : Input.usingPad ? 'A: CHOOSE   D-PAD: MOVE' : 'ARROWS: MOVE   ENTER / Z: CHOOSE';
    drawText(g, hint, vw / 2, vh - 12, '#8a7a60', { align: 'center' });
  },
};

  draw(g, vw, vh) {

SCENES.story = {
  enter(arg) {
    this.pages = arg.pages;
    this.done = arg.done;
    this.art = arg.art;
    this.i = 0;
    this.t = 0;
    this.chars = 0;
    if (arg.music) Music.play(arg.music);
    this.bd = arg.art ? new Backdrop(arg.art) : null;
    this.cam = { x: 0, y: 0 };
  },
  update(dt) {
    this.t += dt;
    this.cam.x += dt * 10;
    const page = this.pages[this.i];
    const prev = Math.floor(this.chars);
    this.chars = Math.min(page.length, this.chars + dt * 42);
    if (Math.floor(this.chars) !== prev && Math.floor(this.chars) % 3 === 0 && page[Math.floor(this.chars)] !== ' ') Sfx.play('tink', 0.6);
    const adv = Input.takePress('confirm') || Input.takePress('jump') || Input.takePress('whip') || Input.taps.length > 0;
    if (Input.takePress('back') || Input.takePress('pause')) return this.finish();
    if (adv) {
      if (this.chars < page.length) this.chars = page.length;
      else if (this.i < this.pages.length - 1) {
        this.i++;
        this.chars = 0;
        Sfx.play('menu');
      } else this.finish();
    }
  },
  finish() {
    if (this.finished) return;
    this.finished = true;
    Sfx.play('select');
    const d = this.done;
    Game.fadeOut(0.35, () => {
      d();
      Game.fadeIn(0.35);
    });
  },
  draw(g, vw, vh) {
    fillR(g, 0, 0, vw, vh, '#0e0907');
    const w = Math.min(300, vw - 12);
    const artH = Math.min(86, Math.round(vh * 0.4));
    const x = Math.round(vw / 2 - w / 2);
    const page = this.pages[this.i];
    const lines = wrapText(page, w - 26);
    const textH = lines.length * 11 + 24;
    const h = artH + textH + 12;
    const y = Math.round(vh / 2 - h / 2);
    drawPanel(g, x, y, w, h, { parchment: true });
    // illustration window
    if (this.bd) {
      g.save();
      g.beginPath();
      g.rect(x + 8, y + 8, w - 16, artH);
      g.clip();
      g.translate(x + 8, y + 8);
      this.bd.draw(g, this.cam, w - 16, artH, artH * 1.05, this.t);
      const f = heroFrame('run' + (Math.floor(this.t * 10) % 8));
      if (this.art !== 'tomb') drawSprite(g, f, (w - 16) * 0.3, artH - 6);
      g.restore();
      fillR(g, x + 7, y + 7, w - 14, 1, '#6e3f10');
      fillR(g, x + 7, y + 8 + artH, w - 14, 1, '#6e3f10');
    }
    const shown = page.slice(0, Math.floor(this.chars));
    const sl = wrapText(shown, w - 26);
    sl.forEach((l, i) => drawText(g, l, x + 13, y + artH + 18 + i * 11, '#2d1c13'));
    if (this.chars >= page.length && Math.sin(this.t * 5) > 0) drawSprite(g, STAR8, x + w - 14, y + h - 12);
    drawText(g, this.i + 1 + '/' + this.pages.length, x + 12, y + h - 15, '#8a6a48');
  },
};

    // wallet

      this.menu.rects.push({ x: x + 6, y: yy - 2, w: w - 12, h: lh - 1 });

    });
    const cur = this.menu.items[this.menu.sel];
    if (cur && cur.it) drawText(g, cur.it.desc, vw / 2, y + h - 13, '#c9b896', { align: 'center' });
  },
};
function drawShopIcon(g, icon, x, y, t) {
  if (icon === 'pom') drawSprite(g, ART.pomegranate, x, y + 5);
  else if (icon === 'whip') {
    for (let i = 0; i < 9; i++) fillR(g, x - 4 + i, y + Math.round(Math.sin(i * 0.8) * 2), 1, 1, '#8b5a34');
    fillR(g, x - 5, y - 1, 2, 3, '#2d1c13');
  } else if (icon === 'grip') {
    fillR(g, x - 3, y - 3, 6, 7, '#c9a052');
    fillR(g, x - 3, y - 3, 6, 1, '#f4cf62');
    fillR(g, x - 1, y - 1, 2, 3, '#6b4024');
  } else if (icon === 'magnet') {
    pxRing(g, x, y, 4, '#c0392b');
    fillR(g, x - 4, y, 2, 3, '#d8d8de');
    fillR(g, x + 3, y, 2, 3, '#d8d8de');
  } else if (icon === 'compass') drawSprite(g, ART.relics.bazaar, x, y + 5);
  else if (icon === 'feather') {
    for (let i = 0; i < 8; i++) fillR(g, x - 3 + i, y + 3 - i, 2, 1, i % 2 ? '#3fb5a3' : '#8de0c8');
    fillR(g, x - 4, y + 4, 2, 1, '#dea12a');
  }
}

const ROMAN = ['I', 'II', 'III', 'IV', 'V'];

function startChapterFlow(idx, withStory) {
  Game.save.chapter = idx;
  Game.save.started = true;
  Game.persist();
  const st = STORY.before[idx];
  if (withStory && st) Game.go('story', { pages: st.pages, art: st.art, music: 'title', done: () => Game.go('card', idx) });
  else Game.go('card', idx);
}
function beginPlay(idx) {
  Game.featherUsed = false;
  Game.loadChapter(idx);
  const L = LEVELS[idx];
  Music.play(L.music, 1);
  Ambience.play(L.ambience || L.theme);
  Game.go('play');
  Game.fadeIn(0.5);
}

// Main loop
let _last = performance.now(), _acc = 0;
function frame(ts) {
  let dt = Math.min(0.1, Math.max(0, (ts - _last) / 1000));
  _last = ts;
  if (Game.slowT > 0) {
    Game.slowT -= dt;
    dt *= Game.slowScale;
  }
  _acc += dt;
  let steps = 0;
  while (_acc >= STEP && steps < 6) {
    if (window.__autopilot) window.__autopilot(Game, Input, Cam);
    Input.step();
    Game.time += STEP;
    if (Game.scene && Game.scene.update) Game.scene.update(STEP);
    // fade
    const F = Game.fade;
    if (F.a !== F.target) {
      F.a = approach(F.a, F.target, F.speed * STEP);
      if (F.a === F.target && F.cb) {
        const cb = F.cb;
        F.cb = null;
        cb();
      }
    }
    Game.flashA = Math.max(0, Game.flashA - STEP * 3);
    Input.taps.length = 0;
    _acc -= STEP;
    steps++;
  }
  if (steps >= 6) _acc = 0;
  render();
  requestAnimationFrame(frame);
}
function render() {
  const vw = Screen.vw, vh = Screen.vh;
  const g = vctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  if (Game.scene && Game.scene.draw) Game.scene.draw(g, vw, vh);
  if (Game.flashA > 0) {
    g.globalAlpha = Game.flashA;
    fillR(g, 0, 0, vw, vh, Game.flashCol);
    g.globalAlpha = 1;
  }
  if (Game.fade.a > 0) {
    g.globalAlpha = Game.fade.a;
    fillR(g, 0, 0, vw, vh, '#0e0907');
    g.globalAlpha = 1;
  }
  ctx.fillStyle = '#0e0907';
  ctx.fillRect(0, 0, Screen.W, Screen.H);
  ctx.drawImage(VC, Screen.vx, Screen.vy);
  drawTouchControls(ctx, Game.time);
}

function boot() {
  const doResize = () => {
    resizeScreen(Input.touchMode);
    TouchUI.layout();
  };
  doResize();
  window.addEventListener('resize', doResize);
  window.addEventListener('orientationchange', () => setTimeout(doResize, 200));
  Bus.on('resize', doResize);
  Bus.on('pointerdown', () => {
    if (!AudioSys.ctx) AudioSys.init();
    else if (AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
    if (Music.pending && AudioSys.ok) {
      const n = Music.pending;
      Music.pending = null;
      Music.play(n);
    }
  });
  Bus.on('key', () => {
    if (!AudioSys.ctx) AudioSys.init();
    if (Music.pending && AudioSys.ok) {
      const n = Music.pending;
      Music.pending = null;
      Music.play(n);
    }
  });
  Bus.on('blur', () => {
    if (Game.state === 'play') Game.go('pause');
  });
  if (DEBUG.level !== undefined) {
    AudioSys.init();
    Game.save.difficulty = Game.save.difficulty || 'adventurer';
    beginPlay(+DEBUG.level);
    if (DEBUG.x !== undefined) {
      Game.player.x = DEBUG.x * TILE;
      Game.player.y = (DEBUG.y || 1) * TILE;
      Game.player.lastSafe = { x: Game.player.x, y: Game.player.y };
      Cam.reset(Game.player.cx, Game.player.cy, Game.level);
    }
  } else if (DEBUG.scene) {
    AudioSys.init();
    Game.go(DEBUG.scene, DEBUG.arg);
  } else Game.go('boot');
  requestAnimationFrame(frame);
}

class BossBase extends Enemy {
  constructor(x, y, w, h, hp, title) {
    super(x, y, w, h, hp);
    this.title = title;
    this.active = false;
    this.introDone = false;
    this.coins = 0;
    this.knock = 0;
    this.phase = 1;
    this.layer = 1;
  }
  get arena() {
    const A = LEVELS[Game.chapterIdx].arena;
    return { x: A.x * TILE, y: A.y * TILE, w: A.w * TILE, h: A.h * TILE, floor: (A.floor !== undefined ? A.floor : A.y + A.h - 1) * TILE };
  }
  activate() {
    this.active = true;
    this.introT = 0;
    this.setState('intro');
    Game.banner(this.title, 2.4);
    Sfx.play('roar');
    Cam.shake(3, 0.6);
  }
  update(dt, level) {
    this.t += dt;
    if (!this.active) {
      this.idle && this.idle(dt, level);
      if (this.gravity) this.physics(dt, level);
      return;
    }
    this.stT += dt;
    this.hurtT = Math.max(0, this.hurtT - dt);
    if (!this.introDone) {
      this.introT += dt;
      if (this.introT > 1.8) {
        this.introDone = true;
        this.setState(this.firstState || 'idle');
      }
      if (this.gravity) this.physics(dt, level);
      return;
    }
    if (this.phase === 1 && this.hp <= this.maxHp * 0.5) {
      this.phase = 2;
      this.onPhase2 && this.onPhase2();
    }
    this.think(dt, level);
    if (this.gravity) this.physics(dt, level);
    if (this.hp > 0) this.contactDamage();
  }
  damage(n, srcX, dir) {
    if (!this.introDone || this.hp <= 0) return;
    this.hp -= n;
    this.hurtT = 0.15;
    Game.hitstop(0.06);
    Sfx.play('hit');
    Parts.burst(this.cx, this.cy, 8, { col: ['#fff8ea', '#f4cf62'], speed: 90, g: 100, life: 0.3 });
    if (this.hp <= 0) this.die();
  }
  die() {
    this.dead = true;
    Game.stats.kills++;
    Parts.burst(this.cx, this.cy, 50, { col: this.dustCols || ['#fff1b3', '#f4cf62', '#e6cf9e'], speed: 170, g: 80, type: 'puff', s: 3, life: 1.3 });
    for (let i = 0; i < 20; i++) Game.spawn(new Coin(this.cx, this.cy, 1, true));
    Game.spawn(new Coin(this.cx, this.cy, 25, true));
    Game.spawn(new Pomegranate(this.cx, this.cy, true));
    Game.onBossDefeated(this);
  }
  pickAttack(table) {
    let sum = 0;
    for (const [, w] of table) sum += w;
    let r = Math.random() * sum;
    for (const [n, w] of table) if ((r -= w) <= 0) return n;
    return table[0][0];
  }
}

function makeBoss(n, x, y) {
  if (n === 1) return new Captain(x, y);
  if (n === 2) return new ScorpionKing(x, y);
  if (n === 3) return new Pharaoh(x, y);
  return new Djinn(x, y);
}

// I. CAPTAIN BAHRAM OF THE WATCH: a duel at the city gate.
class Captain extends BossBase {
  constructor(x, y) {
    super(x + 3, y - 4, 11, 20, 16, 'CAPTAIN BAHRAM OF THE WATCH');
    this.face = -1;
    this.cool = 0.8;
    this.combo = 0;
    this.firstState = 'stalk';
    this.dustCols = ['#2f8a80', '#dea12a', '#d9482f'];
  }
  blocks(p, dir) {
    if ((this.state === 'shield' || this.state === 'stalk') && dir === 'fwd' && sgn(p.cx - this.cx) === this.face) {
      if (this.state === 'stalk' && Math.random() < 0.55) return false;
      this.setState('bash');
      this.vx = this.face * 200;
      return true;
    }
    return false;
  }
  onPhase2() {
    this.setState('rally');
    Sfx.play('roar');
  }
  think(dt, level) {
    const p = this.player;
    const dx = p.cx - this.cx, adx = Math.abs(dx);
    const sp = this.phase === 2 ? 1.3 : 1;
    switch (this.state) {
      case 'stalk': {
        this.face = sgn(dx) || this.face;
        let want = 0;
        if (adx > 56) want = this.face;
        else if (adx < 26) want = -this.face;
        const blocked = this.wallAhead(level, want) || this.edgeAhead(level, want);
        this.vx = approach(this.vx, blocked ? 0 : want * 62 * sp, 500 * dt);
        this.cool -= dt;
        if (this.cool <= 0) {
          const atk = this.pickAttack(this.phase === 1 ? [['windup', adx < 70 ? 5 : 1], ['leap', adx > 60 ? 4 : 1], ['shield', 2]] : [['windup', adx < 70 ? 5 : 1], ['leap', 3], ['shield', 1], ['daggers', adx > 50 ? 4 : 1]]);
          this.combo = 0;
          this.setState(atk);
          if (atk === 'leap') {
            this.vy = -360;
            this.vx = clamp(dx * 1.5, -190, 190);
            Sfx.play('whoosh');
          }
        }
        break;
      }
      case 'windup':
        this.vx = approach(this.vx, 0, 900 * dt);
        if (this.stT > (this.combo ? 0.2 : 0.42) / sp) {
          this.setState('slash');
          this.vx = this.face * 170;
          Sfx.play('swish');
        }
        break;
      case 'slash': {
        this.vx = approach(this.vx, 0, 700 * dt);
        const box = { x: this.face > 0 ? this.cx - 2 : this.cx - 30, y: this.y, w: 32, h: 18 };
        if (this.stT < 0.16 && overlap(box, p)) p.hurt(1, this.cx);
        if (this.stT > 0.28) {
          this.combo++;
          if (this.combo < (this.phase === 2 ? 3 : 2)) {
            this.face = sgn(p.cx - this.cx) || this.face;
            this.setState('windup');
          } else this.setState('recover');
        }
        break;
      }
      case 'recover':
        this.vx = approach(this.vx, 0, 900 * dt);
        if (this.stT > 0.75 / sp) this.toStalk();
        break;
      case 'shield':
        this.vx = 0;
        this.face = sgn(dx) || this.face;
        if (this.stT > 1.1) this.toStalk();
        break;
      case 'bash': {
        this.vx = approach(this.vx, 0, 600 * dt);
        if (this.stT < 0.2 && overlap({ x: this.face > 0 ? this.cx : this.cx - 20, y: this.y, w: 20, h: 20 }, p)) p.hurt(1, this.cx);
        if (this.stT > 0.45) this.setState('recover');
        break;
      }
      case 'leap':
        if (this.onGround && this.stT > 0.15) {
          Cam.shake(4, 0.3);
          Sfx.play('slam');
          Parts.dust(this.cx, this.bottom, 14, '#d8c49a');
          for (const d of [-1, 1]) Parts.burst(this.cx + d * 10, this.bottom - 2, 6, { col: '#e6cf9e', speed: 100, angle: d > 0 ? 0 : Math.PI, spread: 0.3, g: 200 });
          if (p.onGround && Math.abs(p.cx - this.cx) < 58 && Math.abs(p.bottom - this.bottom) < 12) p.hurt(1, this.cx);
          this.vx = 0;
          this.setState('stuck');
        }
        break;
      case 'stuck':
        if (this.stT > 0.8 / sp) this.toStalk();
        break;
      case 'daggers':
        this.vx = 0;
        this.face = sgn(dx) || this.face;
        if (this.stT > 0.35 && !this.thrown) {
          this.thrown = true;
          for (const a of [-0.25, 0, 0.25]) {
            const ang = Math.atan2(p.cy - this.cy, dx) + a;
            Game.spawn(new Projectile('dart', this.cx + this.face * 8, this.y + 6, Math.cos(ang) * 190, Math.sin(ang) * 190));
          }
          Sfx.play('swish');
        }
        if (this.stT > 0.8) {
          this.thrown = false;
          this.toStalk();
        }
        break;
      case 'rally':
        this.vx = 0;
        if (this.stT > 0.6 && !this.rallied) {
          this.rallied = true;
          const A = this.arena;
          Game.spawn(new Guard(A.x + 24, A.floor - 20));
          Game.spawn(new Guard(A.x + A.w - 40, A.floor - 20));
          Game.banner('TO ME, MEN OF THE WATCH!', 1.6);
        }
        if (this.stT > 1.3) this.toStalk();
        break;
    }
  }
  toStalk() {
    this.setState('stalk');
    this.cool = rnd(0.5, 1.1) / (this.phase === 2 ? 1.4 : 1);
  }
  draw(g, cam) {
    let pose = 'idle0';
    const s = this.state;
    if (!this.active || s === 'intro') pose = this.introT > 0.4 ? 'windup' : 'idle0';
    else if (s === 'windup' || s === 'rally') pose = 'windup';
    else if (s === 'slash') pose = this.stT < 0.1 ? 'slash' : 'slash2';
    else if (s === 'shield' || s === 'bash') pose = 'guard';
    else if (s === 'leap') pose = this.vy < 0 ? 'jump' : 'fall';
    else if (s === 'stuck') pose = 'land';
    else if (s === 'daggers') pose = this.stT < 0.35 ? 'windup' : 'slash';
    else if (Math.abs(this.vx) > 8) pose = 'walk' + (Math.floor(this.t * 9) % 8);
    const fl = this.hurtT > 0.08 || (s === 'windup' && Math.floor(this.stT * 20) % 2 === 0);
    drawSprite(g, rigFrame('captain', pose), this.cx - cam.x, this.y + this.h - cam.y, this.face < 0, fl);
  }
}

// II. AL-AQRAB, THE GREAT SCORPION
class ScorpionKing extends BossBase {
  constructor(x, y) {
    super(x - 20, y - 10, 56, 26, 22, 'AL-AQRAB, THE GREAT SCORPION');
    this.face = -1;
    this.cool = 1;
    this.firstState = 'walk';
    this.tail = { ang: 0, tx: 0, ty: 0, stuck: false };
    this.tip = { x: 0, y: 0 };
    this.dustCols = ['#7a3a18', '#b8622c', '#f0c040'];
    this.contact = 1;
    this.under = false;
  }
  hurtBox() {
    if (this.under) return { x: -999, y: -999, w: 0, h: 0 };
    if (this.tail.stuck) {
      const r = { x: Math.min(this.x, this.tip.x - 8), y: Math.min(this.y, this.tip.y - 8), w: 0, h: 0 };
      r.w = Math.max(this.x + this.w, this.tip.x + 8) - r.x;
      r.h = Math.max(this.y + this.h, this.tip.y + 8) - r.y;
      return r;
    }
    return { x: this.x, y: this.y - 8, w: this.w, h: this.h + 8 };
  }
  onWhip(p, dir) {
    if (this.hp <= 0 || !this.introDone) return false;
    const box = p.whipBox();
    const tipHit = this.tail.stuck && overlap(box, { x: this.tip.x - 8, y: this.tip.y - 8, w: 16, h: 16 });
    const fromFront = sgn(p.cx - this.cx) === this.face;
    const guarded = this.state === 'walk' && fromFront && dir === 'fwd';
    if (tipHit) this.damage(Game.whipDamage() * 2, p.cx, dir);
    else if (guarded) {
      Sfx.play('clank');
      Parts.burst(this.cx + this.face * 26, this.cy, 6, { col: ['#fff1b3', '#fff'], speed: 90, g: 0 });
      p.vx = -p.face * 110;
    } else this.damage(Game.whipDamage(), p.cx, dir);
    return true;
  }
  onPhase2() {
    Sfx.play('roar');
    Cam.shake(4, 0.6);
    this.setState('burrow');
  }
  idle(dt) {
    this.legPh = (this.legPh || 0) + dt * 2;
  }
  think(dt, level) {
    const p = this.player;
    const dx = p.cx - this.cx, adx = Math.abs(dx);
    const sp = this.phase === 2 ? 1.25 : 1;
    this.legPh = (this.legPh || 0) + dt * (Math.abs(this.vx) > 5 ? 14 : 2);
    switch (this.state) {
      case 'walk': {
        this.face = sgn(dx) || this.face;
        const want = adx > 70 ? this.face : adx < 46 ? -this.face : 0;
        const blocked = this.wallAhead(level, want);
        this.vx = approach(this.vx, blocked ? 0 : want * 50 * sp, 300 * dt);
        this.cool -= dt;
        if (this.cool <= 0) {
          const atk = this.pickAttack(this.phase === 1 ? [['sting', 4], ['pincer', adx < 80 ? 4 : 1]] : [['sting', 3], ['pincer', adx < 80 ? 3 : 1], ['spit', 2], ['burrow', 2]]);
          this.setState(atk);
          this.vx = 0;
          if (atk === 'sting') Sfx.play('hiss');
        }
        break;
      }
      case 'pincer':
        if (this.stT < 0.4) this.vx = approach(this.vx, -this.face * 30, 200 * dt);
        else if (this.stT < 0.75) {
          if (!this.lunged) {
            this.lunged = true;
            this.vx = this.face * 240 * sp;
            Sfx.play('swish');
          }
          this.vx = approach(this.vx, 0, 400 * dt);
          const box = { x: this.face > 0 ? this.x + this.w - 6 : this.x - 22, y: this.y, w: 28, h: this.h };
          if (overlap(box, p)) p.hurt(1, this.cx);
        } else if (this.stT > 1.3) {
          this.lunged = false;
          this.toWalk();
        }
        break;
      case 'sting': {
        // rear back, lock on, strike, stick in the sand
        const T = this.tail;
        if (this.stT < 0.75 / sp) {
          T.tx = p.cx;
          T.ty = Math.min(p.y + p.h - 2, this.arena.floor - 1);
        } else if (!T.struck) {
          T.struck = true;
          T.stuck = true;
          Sfx.play('slam', 0.7);
          Cam.shake(3, 0.25);
          Parts.burst(T.tx, T.ty, 12, { col: ['#e6cf9e', '#c9a46a'], speed: 110, g: 400, angle: -Math.PI / 2, spread: 1.2 });
          if (dist(p.cx, p.cy, T.tx, T.ty) < 18) p.hurt(1, T.tx);
        }
        if (T.stuck && this.stT > (0.75 + 1.4) / sp) {
          T.stuck = false;
          T.struck = false;
          this.toWalk();
        }
        break;
      }
      case 'spit':
        if (this.stT > 0.3 && !this.spat) {
          this.spat = true;
          for (const k of [-1, 0, 1]) {
            const t = 0.8 + k * 0.15;
            const tx = p.cx + k * 30;
            Game.spawn(new Projectile('venom', this.cx + this.face * 24, this.y + 4, (tx - this.cx - this.face * 24) / t, (p.cy - this.y - 4) / t - 0.5 * 300 * t, { grav: 300 }));
          }
          Sfx.play('spit');
        }
        if (this.stT > 1.0) {
          this.spat = false;
          this.toWalk();
        }
        break;
      case 'burrow':
        // dive, travel under the sand toward you, erupt beneath you
        if (this.stT < 0.5) {
          this.vx = 0;
          if (Math.random() < 0.6) Parts.dust(this.cx + rnd(-24, 24), this.bottom, 2, '#e6cf9e');
        } else if (!this.under) {
          this.under = true;
          Sfx.play('rumble', 0.6);
        }
        if (this.under) {
          this.vx = approach(this.vx, sgn(dx) * 120, 300 * dt);
          if (Math.random() < 0.7) Parts.dust(this.cx + rnd(-8, 8), this.bottom, 1, '#e6cf9e');
          if (adx < 10 || this.stT > 3) {
            this.setState('erupt');
            this.vx = 0;
          }
        }
        break;
      case 'erupt':
        if (this.stT < 0.55) {
          if (Math.random() < 0.8) Parts.add({ x: this.cx + rnd(-16, 16), y: this.bottom, vy: rnd(-90, -40), life: 0.4, col: '#e6cf9e', g: 300 });
        } else if (this.under) {
          this.under = false;
          Cam.shake(5, 0.4);
          Sfx.play('boom', 0.6);
          Parts.burst(this.cx, this.bottom, 30, { col: ['#e6cf9e', '#c9a46a', '#f2d7a2'], speed: 160, g: 400, angle: -Math.PI / 2, spread: 1.3, s: 2 });
          if (Math.abs(p.cx - this.cx) < 34 && p.bottom > this.y - 6) {
            p.hurt(1, this.cx);
            p.vy = -260;
          }
        }
        if (this.stT > 1.4) this.toWalk();
        break;
    }
    this.updTail(dt);
  }
  toWalk() {
    this.setState('walk');
    this.cool = rnd(0.7, 1.4) / (this.phase === 2 ? 1.3 : 1);
  }
  updTail(dt) {
    // tail joints: a curve from the body's rear over the back
    const T = this.tail;
    const baseX = this.cx - this.face * 24, baseY = this.y + 6;
    let tipX, tipY;
    if (this.state === 'sting') {
      const k = Math.min(1, this.stT / 0.75);
      if (T.stuck) {
        tipX = T.tx;
        tipY = T.ty;
      } else {
        // reared back, quivering, aimed
        tipX = baseX + this.face * (8 - k * 10) + Math.sin(this.t * 40) * k * 1.5;
        tipY = baseY - 30 - k * 8;
      }
    } else {
      tipX = baseX + this.face * (22 + Math.sin(this.t * 2) * 3);
      tipY = baseY - 26 + Math.cos(this.t * 2.3) * 2;
    }
    this.tip.x = lerp(this.tip.x || tipX, tipX, T.stuck ? 0.6 : 0.25);
    this.tip.y = lerp(this.tip.y || tipY, tipY, T.stuck ? 0.6 : 0.25);
    this.tailBase = [baseX, baseY];
    // stinger contact
    const p = this.player;
    if (!T.stuck && this.state === 'sting' && this.stT > 0.75 && dist(p.cx, p.cy, this.tip.x, this.tip.y) < 12) p.hurt(1, this.tip.x);
  }
  draw(g, cam) {
    if (this.under) {
      // a travelling hump of sand
      const x = Math.round(this.cx - cam.x), y = Math.round(this.bottom - cam.y);
      for (let i = -14; i <= 14; i++) fillR(g, x + i, y - Math.round(Math.cos((i / 14) * Math.PI / 2) * 5), 1, 5, i % 3 ? '#d8b072' : '#c99a5c');
      return;
    }
    const f = this.face;
    const ox = Math.round(this.cx - cam.x), oy = Math.round(this.y - cam.y);
    const fl = this.hurtT > 0.08;
    const body = fl ? '#fff8ea' : '#6e3418', bodyL = fl ? '#fff8ea' : '#9a4a22', bodyD = fl ? '#fff8ea' : '#3e1a0c', gold = '#f0c040';
    // legs
    for (let i = 0; i < 4; i++) {
      for (const side of [0, 1]) {
        const lx = ox + (i - 1.5) * 10 * f + (side ? 2 : -2);
        const ph = (this.legPh || 0) + i * 1.3 + side * Math.PI;
        const lift = Math.max(0, Math.sin(ph)) * 3;
        const kx = lx + f * 3 + Math.cos(ph) * 2, ky = oy + 14 - lift - 4;
        pxLine(g, lx, oy + 16, kx, ky, '#140904', 2);
        pxLine(g, kx, ky, kx + f * 2 + Math.cos(ph) * 2, oy + 26, '#140904', 2);
        pxLine(g, lx, oy + 16, kx, ky, side ? bodyD : body);
        pxLine(g, kx, ky, kx + f * 2 + Math.cos(ph) * 2, oy + 26, side ? bodyD : body);
      }
    }
    // body segments
    for (let i = 0; i < 5; i++) {
      const sx = ox - f * (i * 9 - 14), sy = oy + 12 - (i === 0 ? 1 : 0);
      const r = i === 0 ? 11 : 10 - i * 0.6;
      pxCircle(g, sx, sy + 1, r + 1, '#140904');
      pxCircle(g, sx, sy, r, body);
      pxCircle(g, sx - 2, sy - 3, r * 0.5, bodyL);
      fillR(g, sx - r + 2, sy + r - 3, r * 2 - 4, 1, bodyD);
    }
    // eyes
    fillR(g, ox + f * 20 - 1, oy + 6, 2, 2, '#ff5a2a');
    fillR(g, ox + f * 16 - 1, oy + 5, 2, 2, '#ff5a2a');
    // pincers
    const pinOpen = this.state === 'pincer' && this.stT < 0.4 ? 4 : this.state === 'pincer' ? 0 : 2 + Math.sin(this.t * 3);
    const px = ox + f * (this.state === 'pincer' && this.stT > 0.4 ? 40 : 32), py = oy + 12;
    pxLine(g, ox + f * 20, oy + 14, px - f * 6, py, '#140904', 4);
    pxLine(g, ox + f * 20, oy + 14, px - f * 6, py, body, 2);
    pxCircle(g, px - f * 4, py, 5, '#140904');
    pxCircle(g, px - f * 4, py, 4, bodyL);
    pxLine(g, px - f * 2, py - 2, px + f * 6, py - 3 - pinOpen, bodyL, 2);
    pxLine(g, px - f * 2, py + 2, px + f * 6, py + 2 + pinOpen, body, 2);
    // tail
    const [bx, by] = this.tailBase || [ox, oy];
    const tx = this.tip.x, ty = this.tip.y;
    const n = 8;
    let pxp = bx, pyp = by;
    const ctrlX = bx - f * 6, ctrlY = Math.min(by, ty) - 20;
    for (let i = 1; i <= n; i++) {
      const u = i / n;
      const qx = (1 - u) * (1 - u) * bx + 2 * (1 - u) * u * ctrlX + u * u * tx;
      const qy = (1 - u) * (1 - u) * by + 2 * (1 - u) * u * ctrlY + u * u * ty;
      const r = 5 - u * 2.5;
      pxCircle(g, qx - cam.x, qy - cam.y + 1, r + 1, '#140904');
      pxCircle(g, qx - cam.x, qy - cam.y, r, i % 2 ? body : bodyL);
      pxp = qx;
      pyp = qy;
    }
    // stinger
    const sx = Math.round(tx - cam.x), sy = Math.round(ty - cam.y);
    const glow = this.state === 'sting' && !this.tail.stuck;
    if (glow) {
      g.globalAlpha = 0.5;
      g.drawImage(lightStamp(10, '#f0c040', 3), sx - 10, sy - 10);
      g.globalAlpha = 1;
    }
    for (let i = 0; i < 6; i++) fillR(g, sx - 1 + f * (i > 3 ? 1 : 0), sy + i - 2, 3 - (i > 3 ? 1 : 0), 1, i < 2 ? '#fff1b3' : gold);
    void pxp;
    void pyp;
  }
  light() {
    Lighting.add(this.cx, this.cy, 40, '#f0c040', 0.4);
  }
}

// III. KHEMET-RA, THE UNDYING PHARAOH
class Pharaoh extends BossBase {
  constructor(x, y) {
    super(x - 6, y - 24, 28, 40, 24, 'KHEMET-RA, THE UNDYING');
    this.gravity = false;
    this.contact = 1;
    this.face = -1;
    this.firstState = 'float';
    this.cool = 1.2;
    this.home = { x: this.x, y: this.y };
    this.dustCols = ['#d8cdb0', '#dea12a', '#2b4a7c'];
    this.beam = null;
    this.minions = 0;
  }
  onPhase2() {
    Sfx.play('roar');
    this.setState('slam');
  }
  think(dt, level) {
    const p = this.player;
    const A = this.arena;
    const sp = this.phase === 2 ? 1.25 : 1;
    this.face = sgn(p.cx - this.cx) || this.face;
    const floatTo = (tx, ty, k) => {
      this.x = lerp(this.x, tx - this.w / 2, Math.min(1, k * dt));
      this.y = lerp(this.y, ty - this.h / 2, Math.min(1, k * dt));
    };
    switch (this.state) {
      case 'float': {
        // drift between high stations, bobbing
        if (!this.station || this.stT > 2.4) {
          // low enough to lash from the ledges, high enough to need them
          this.station = { x: A.x + 60 + Math.random() * (A.w - 120), y: A.floor - 178 + Math.random() * 56 };
          this.stT = 0;
        }
        floatTo(this.station.x, this.station.y + Math.sin(this.t * 2) * 6, 1.6);
        this.cool -= dt;
        if (this.cool <= 0) {
          const m = Game.entities.filter((e) => e instanceof Mummy || e instanceof Scarab).length;
          const atk = this.pickAttack(this.phase === 1 ? [['orbs', 4], ['summon', m < 2 ? 2 : 0], ['beam', 3]] : [['orbs', 3], ['summon', m < 3 ? 2 : 0], ['beam', 3], ['slam', 3]]);
          this.setState(atk);
        }
        break;
      }
      case 'orbs':
        floatTo(this.cx, this.cy - 2, 2);
        if (this.stT > 0.5 && !this.fired) {
          this.fired = true;
          const n = this.phase === 2 ? 4 : 3;
          for (let i = 0; i < n; i++) {
            const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.7;
            Game.spawn(new Projectile('orb', this.cx, this.cy - 6, Math.cos(a) * 80, Math.sin(a) * 80, { homing: 1.6, life: 5 }));
          }
          Sfx.play('magic');
        }
        if (this.stT > 1.2) this.toFloat();
        break;
      case 'summon':
        if (this.stT > 0.6 && !this.fired) {
          this.fired = true;
          Sfx.play('groan');
          const xs = [A.x + 40, A.x + A.w - 56];
          for (const sx of xs) {
            if (Math.random() < 0.5) Game.spawn(new Mummy(sx, A.floor - 20));
            else for (let i = 0; i < 3; i++) Game.spawn(new Scarab(sx + i * 8, A.floor - 16));
            Parts.burst(sx + 8, A.floor - 8, 16, { col: ['#d8cdb0', '#a89c80'], speed: 60, type: 'puff', s: 2, g: -20 });
          }
        }
        if (this.stT > 1.1) this.toFloat();
        break;
      case 'beam': {
        // the Eye of Ra: telegraph a line, then burn it
        if (!this.beam) {
          const low = p.onGround && Math.random() < 0.55;
          this.beam = { y: low ? A.floor - 10 : A.floor - 30, dir: this.cx < A.x + A.w / 2 ? 1 : -1 };
          Sfx.play('laser');
        }
        const B = this.beam;
        floatTo(B.dir > 0 ? A.x + 30 : A.x + A.w - 30, B.y - 4, 3);
        if (this.stT > 0.85 / sp && this.stT < 1.9) {
          const box = { x: A.x, y: B.y - 4, w: A.w, h: 8 };
          if (overlap(box, p) && !(p.state === 'roll' && B.y < A.floor - 20) && !(p.crouch && B.y < A.floor - 20)) p.hurt(1, this.cx);
          if (Math.random() < 0.6) Parts.add({ x: A.x + Math.random() * A.w, y: B.y + rnd(-3, 3), vy: rnd(-30, 30), life: 0.3, col: pick(['#79f0a5', '#fff']), g: 0 });
        }
        if (this.stT > 2.2) {
          this.beam = null;
          this.toFloat();
        }
        break;
      }
      case 'slam': {
        if (this.stT < 0.8) floatTo(p.cx, A.y + 34, 4);
        else if (this.stT < 1.2) {
          this.y = Math.min(A.floor - this.h, this.y + 520 * dt);
          if (this.y >= A.floor - this.h - 1 && !this.slammed) {
            this.slammed = true;
            Cam.shake(6, 0.5);
            Sfx.play('slam');
            for (const d of [-1, 1]) Game.spawn(new Shockwave(this.cx + d * 14, A.floor, d));
            Parts.dust(this.cx, A.floor, 18, '#d8c8a6');
          }
        } else if (this.stT > 2.6 / sp) {
          this.slammed = false;
          this.toFloat();
        }
        break;
      }
    }
  }
  toFloat() {
    this.setState('float');
    this.fired = false;
    this.cool = rnd(0.9, 1.6) / (this.phase === 2 ? 1.3 : 1);
  }
  draw(g, cam) {
    const fl = this.hurtT > 0.08;
    const cx = Math.round(this.cx - cam.x), top = Math.round(this.y - cam.y + Math.sin(this.t * 2.2) * (this.state === 'slam' ? 0 : 1.5));
    const gold = fl ? '#fff8ea' : '#dea12a', goldL = fl ? '#fff8ea' : '#fff1b3', goldD = fl ? '#fff8ea' : '#8a5410';
    const lap = fl ? '#fff8ea' : '#2b4a7c', lapL = fl ? '#fff8ea' : '#3b62a8', wrap = fl ? '#fff8ea' : '#d8cdb0', wrapD = fl ? '#fff8ea' : '#8f8470';
    // emerald aura
    g.globalAlpha = 0.35 + 0.1 * Math.sin(this.t * 4);
    g.drawImage(lightStamp(30, '#25b56a', 3), cx - 30, top + 6);
    g.globalAlpha = 1;
    // tattered lower wraps
    for (let i = 0; i < 6; i++) {
      const x = cx - 8 + i * 3;
      const len = 10 + ((i * 7) % 5) + Math.sin(this.t * 5 + i) * 2;
      for (let k = 0; k < len; k++) fillR(g, x + Math.round(Math.sin(this.t * 4 + i + k * 0.4) * 1), top + 32 + k, 2, 1, k % 4 === 0 ? wrapD : wrap);
    }
    // body (mummy case)
    for (let y = 0; y < 18; y++) {
      const w = 9 - Math.floor(y / 5);
      fillR(g, cx - w - 1, top + 18 + y, w * 2 + 2, 1, '#1c140e');
      fillR(g, cx - w, top + 18 + y, w * 2, 1, (y % 3 === 0 ? wrapD : wrap));
    }
    // broad collar
    for (let r = 0; r < 4; r++) {
      const w = 10 - r;
      fillR(g, cx - w, top + 15 + r, w * 2, 1, [lapL, gold, '#3fb5a3', '#c0392b'][r]);
    }
    // crossed arms with crook and flail
    pxLine(g, cx - 8, top + 20, cx + 3, top + 26, '#1c140e', 3);
    pxLine(g, cx + 8, top + 20, cx - 3, top + 26, '#1c140e', 3);
    pxLine(g, cx - 8, top + 20, cx + 3, top + 26, wrap, 2);
    pxLine(g, cx + 8, top + 20, cx - 3, top + 26, wrap, 2);
    // crook
    for (let i = 0; i < 14; i++) fillR(g, cx - 2 - Math.round(i * 0.5), top + 28 - i, 2, 1, i % 2 ? gold : lap);
    fillR(g, cx - 11, top + 13, 3, 1, gold);
    fillR(g, cx - 12, top + 14, 1, 2, gold);
    // flail
    for (let i = 0; i < 12; i++) fillR(g, cx + 2 + Math.round(i * 0.5), top + 28 - i, 1, 1, i % 2 ? gold : lap);
    for (let k = 0; k < 3; k++) for (let i = 0; i < 4; i++) fillR(g, cx + 8 + k * 2, top + 16 + i + Math.round(Math.sin(this.t * 5 + k)), 1, 1, i % 2 ? goldL : '#c0392b');
    // nemes headdress
    for (let y = 0; y < 18; y++) {
      const w = y < 4 ? 6 + y : y < 12 ? 10 : 9;
      const col = y % 2 ? lap : gold;
      fillR(g, cx - w - 1, top + y, w * 2 + 2, 1, '#1c140e');
      fillR(g, cx - w, top + y, w * 2, 1, col);
    }
    // death mask face
    fillR(g, cx - 5, top + 4, 10, 12, '#1c140e');
    fillR(g, cx - 4, top + 4, 8, 11, gold);
    fillR(g, cx - 4, top + 4, 2, 11, goldL);
    fillR(g, cx + 3, top + 5, 1, 9, goldD);
    // eyes with kohl and an emerald glare
    const glare = this.state === 'beam' && this.stT < 0.85 ? '#fff' : '#79f0a5';
    fillR(g, cx - 4, top + 7, 3, 1, '#1c140e');
    fillR(g, cx + 1, top + 7, 3, 1, '#1c140e');
    fillR(g, cx - 3, top + 8, 1, 1, glare);
    fillR(g, cx + 2, top + 8, 1, 1, glare);
    fillR(g, cx - 1, top + 10, 2, 1, goldD);
    fillR(g, cx - 2, top + 12, 4, 1, goldD);
    // false beard and uraeus
    fillR(g, cx - 1, top + 15, 3, 4, lap);
    fillR(g, cx - 1, top + 16, 3, 1, gold);
    fillR(g, cx, top - 2, 2, 3, gold);
    fillR(g, cx - 1, top - 3, 1, 1, '#c0392b');
    // the beam itself
    if (this.state === 'beam' && this.beam) {
      const A = this.arena;
      const by = Math.round(this.beam.y - cam.y);
      if (this.stT < 0.85) {
        if (Math.floor(this.stT * 16) % 2 === 0) fillR(g, A.x - cam.x, by, A.w, 1, '#c0392b');
      } else if (this.stT < 1.9) {
        fillR(g, A.x - cam.x, by - 3, A.w, 7, '#25b56a');
        fillR(g, A.x - cam.x, by - 1, A.w, 3, '#a8ffc8');
        fillR(g, A.x - cam.x, by, A.w, 1, '#fff');
      }
    }
  }
  light() {
    Lighting.add(this.cx, this.cy, 70, '#79f0a5', 1);
    if (this.state === 'beam' && this.beam && this.stT > 0.85 && this.stT < 1.9) {
      const A = this.arena;
      for (let x = A.x; x < A.x + A.w; x += 48) Lighting.add(x, this.beam.y, 40, '#79f0a5', 0.9);
    }
  }
}

// A ground shockwave that rolls outward; jump it.
class Shockwave extends Entity {
  constructor(x, floorY, dir) {
    super(x - 5, floorY - 10, 10, 10);
    this.dir = dir;
    this.life = 1.6;
    this.layer = 2;
  }
  update(dt, level) {
    this.t += dt;
    this.life -= dt;
    this.x += this.dir * 170 * dt;
    if (this.life <= 0 || level.rectSolid(this.x, this.y, this.w, this.h - 2)) this.dead = true;
    if (Math.random() < 0.8) Parts.add({ x: this.cx, y: this.y + this.h, vx: -this.dir * 20, vy: rnd(-60, -20), life: 0.3, col: pick(['#d8c8a6', '#9c8b6a']), g: 300 });
    const p = this.player;
    if (p && overlap(this, p)) p.hurt(1, this.cx);
  }
  draw(g, cam) {
    const x = Math.round(this.cx - cam.x), y = Math.round(this.y + this.h - cam.y);
    for (let i = 0; i < 6; i++) fillR(g, x - 4 + i * this.dir, y - 2 - (5 - i), 2, 5 - i + 2, i < 2 ? '#fff1b3' : '#d8c8a6');
  }
}

// ===========================================================================
// IV. THE BRASS DJINN OF ANDOR
class Djinn extends BossBase {
  constructor(x, y) {
    super(x - 16, y - 40, 40, 56, 26, 'THE BRASS DJINN OF ANDOR');
    this.gravity = false;
    this.contact = 0;
    this.face = -1;
    this.firstState = 'hover';
    this.cool = 1.5;
    this.fists = [
      { x: 0, y: 0, state: 'idle', t: 0, side: -1, tx: 0, ty: 0 },
      { x: 0, y: 0, state: 'idle', t: 0, side: 1, tx: 0, ty: 0 },
    ];
    this.headLow = 0;
    this.dustCols = ['#dea12a', '#f4cf62', '#79f0a5'];
    for (const f of this.fists) {
      const r = this.restPos(f);
      f.x = r.x;
      f.y = r.y;
    }
  }
  idle(dt) {
    // dormant above the lamp, breathing smoke, fists resting
    for (const f of this.fists) {
      const r = this.restPos(f);
      f.x = lerp(f.x, r.x, Math.min(1, dt * 5));
      f.y = lerp(f.y, r.y, Math.min(1, dt * 5));
    }
  }
  hurtBox() {
    // union of the head and both fists, wherever they have slammed down
    const boxes = [this.headBox(), ...this.fists.map((f) => ({ x: f.x - 9, y: f.y - 9, w: 18, h: 18 }))];
    const x0 = Math.min(...boxes.map((b) => b.x)), y0 = Math.min(...boxes.map((b) => b.y));
    const x1 = Math.max(...boxes.map((b) => b.x + b.w)), y1 = Math.max(...boxes.map((b) => b.y + b.h));
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  headBox() {
    return { x: this.cx - 9, y: this.y - 4 + this.headLow, w: 18, h: 18 };
  }
  onWhip(p, dir) {
    if (this.hp <= 0 || !this.introDone) return false;
    const box = p.whipBox();
    let hit = false;
    if (overlap(box, this.headBox())) {
      this.damage(Game.whipDamage() * (this.state === 'tired' ? 2 : 1), p.cx, dir);
      hit = true;
    }
    for (const f of this.fists)
      if (f.state === 'down' && overlap(box, { x: f.x - 9, y: f.y - 9, w: 18, h: 18 })) {
        this.damage(Game.whipDamage(), p.cx, dir);
        f.state = 'rise';
        f.t = 0;
        hit = true;
      }
    if (!hit) return false;
    return true;
  }
  onPhase2() {
    Sfx.play('roar');
    Cam.shake(5, 0.8);
    Game.banner('THE DJINN BURNS BRIGHTER', 1.8);
    for (let i = 0; i < 3; i++) Game.spawn(new Wisp(this.arena.x + 40 + i * 100, this.arena.y + 40));
  }
  restPos(f) {
    return { x: this.cx + f.side * 34, y: this.y + 34 + Math.sin(this.t * 2 + f.side) * 3 };
  }
  think(dt, level) {
    const p = this.player;
    const A = this.arena;
    const sp = this.phase === 2 ? 1.3 : 1;
    // hover above the lamp at the arena's centre, drifting a little toward you
    const hx = clamp(lerp(A.x + A.w / 2, p.cx, 0.25), A.x + 80, A.x + A.w - 80);
    this.x = lerp(this.x, hx - this.w / 2, Math.min(1, dt * 0.8));
    const hy = A.floor - 120 + Math.sin(this.t * 1.4) * 5;
    this.y = lerp(this.y, hy, Math.min(1, dt * 2));
    this.face = sgn(p.cx - this.cx) || this.face;
    this.headLow = approach(this.headLow, this.state === 'tired' ? 62 : 0, (this.state === 'tired' ? 160 : 90) * dt);
    for (const f of this.fists) this.updFist(f, dt, sp);
    switch (this.state) {
      case 'hover':
        this.cool -= dt;
        if (this.cool <= 0) {
          const atk = this.pickAttack(this.phase === 1 ? [['fist', 5], ['breath', 3], ['rain', 2]] : [['fist', 4], ['breath', 3], ['rain', 2], ['double', 3]]);
          this.setState(atk);
          if (atk === 'fist' || atk === 'double') {
            const free = this.fists.filter((f) => f.state === 'idle');
            const use = atk === 'double' ? free : free.slice(0, 1).concat([]);
            if (!use.length) this.setState('hover');
            use.forEach((f, i) => {
              f.state = 'aim';
              f.t = -i * 0.5;
            });
          }
        }
        break;
      case 'fist':
      case 'double':
        if (this.fists.every((f) => f.state === 'idle') && this.stT > 0.5) this.toHover();
        break;
      case 'breath': {
        if (!this.breath) {
          this.breath = { dir: p.cx < this.cx ? -1 : 1, prog: 0 };
          Sfx.play('roar');
        }
        const B = this.breath;
        if (this.stT > 0.7) {
          B.prog += dt * 0.55 * sp;
          // the flame sweeps from under the djinn outward across the floor zone
          const fx = this.cx + B.dir * B.prog * A.w;
          const fy = A.floor - 22;
          for (let i = 0; i < 3; i++) Parts.add({ x: lerp(this.cx, fx, Math.random()), y: lerp(this.y + 20, fy, Math.random()) + rnd(-5, 5), vx: B.dir * rnd(40, 90), vy: rnd(-20, 20), life: rnd(0.3, 0.5), col: pick(['#fff3b8', '#ffc444', '#f07a22']), type: 'puff', s: rnd(2, 3.5), g: -30 });
          if (Math.abs(p.cx - fx) < 22 && p.bottom > fy - 18 && p.y < fy + 14 && !(p.state === 'roll')) p.hurt(1, fx);
          if (B.prog > 1) {
            this.breath = null;
            this.setState('tired');
            Sfx.play('groan', 0.8);
          }
        }
        break;
      }
      case 'tired':
        if (Math.random() < 0.3) Parts.add({ x: this.cx + rnd(-8, 8), y: this.y + this.headLow, vy: -30, life: 0.6, col: '#5a4a3a', type: 'puff', s: 2, g: -20 });
        if (this.stT > 2.2 / sp) this.toHover();
        break;
      case 'rain':
        if (this.stT > 0.5 && this.stT < 2.5 && Math.random() < dt * (this.phase === 2 ? 7 : 5)) Game.spawn(new FallingCoinHazard(A.x + 16 + Math.random() * (A.w - 32), A.y + 8));
        if (this.stT > 2.9) this.toHover();
        break;
    }
  }
  toHover() {
    this.setState('hover');
    this.cool = rnd(0.8, 1.5) / (this.phase === 2 ? 1.3 : 1);
  }
  updFist(f, dt, sp) {
    const p = this.player;
    const A = this.arena;
    f.t += dt;
    const rest = this.restPos(f);
    if (f.state === 'idle' || f.state === 'rise') {
      f.x = lerp(f.x || rest.x, rest.x, Math.min(1, dt * 5));
      f.y = lerp(f.y || rest.y, rest.y, Math.min(1, dt * 5));
      if (f.state === 'rise' && f.t > 0.6) f.state = 'idle';
    } else if (f.state === 'aim') {
      if (f.t < 0) return;
      f.tx = p.cx;
      f.ty = A.floor - 9;
      f.x = lerp(f.x, f.tx, Math.min(1, dt * 4));
      f.y = lerp(f.y, A.floor - 92, Math.min(1, dt * 4));
      if (f.t > 0.85 / sp) {
        f.state = 'drop';
        f.t = 0;
      }
    } else if (f.state === 'drop') {
      f.y += 600 * dt;
      if (f.y >= f.ty) {
        f.y = f.ty;
        f.state = 'down';
        f.t = 0;
        Cam.shake(5, 0.35);
        Sfx.play('slam');
        Parts.dust(f.x, A.floor, 16, '#c9a46a');
        if (dist(p.cx, p.cy, f.x, f.y) < 22) p.hurt(1, f.x);
        if (this.phase === 2) for (const d of [-1, 1]) Game.spawn(new Shockwave(f.x + d * 12, A.floor, d));
      } else if (dist(p.cx, p.cy, f.x, f.y) < 16) p.hurt(1, f.x);
    } else if (f.state === 'down') {
      if (f.t > 1.5 / sp) {
        f.state = 'rise';
        f.t = 0;
      }
    }
  }
  draw(g, cam) {
    const A = this.arena;
    const fl = this.hurtT > 0.08;
    const cx = Math.round(this.cx - cam.x), top = Math.round(this.y - cam.y);
    const brass = fl ? '#fff8ea' : '#c8902a', brassL = fl ? '#fff8ea' : '#f4cf62', brassD = fl ? '#fff8ea' : '#6e3f10', ink = '#1a0f06';
    // the great lamp on the floor
    const ly = Math.round(A.floor - cam.y);
    const lx = Math.round(A.x + A.w / 2 - cam.x);
    for (let y = 0; y < 14; y++) {
      const w = y < 4 ? 10 + y * 3 : 22 - (y - 4);
      fillR(g, lx - w - 1, ly - 14 + y, w * 2 + 2, 1, ink);
      fillR(g, lx - w, ly - 14 + y, w * 2, 1, y < 2 ? '#fff1b3' : y < 6 ? '#dea12a' : '#a86d16');
    }
    fillR(g, lx + 20, ly - 12, 14, 3, '#a86d16');
    fillR(g, lx + 32, ly - 14, 3, 3, '#dea12a');
    // smoke tail from lamp spout to the waist
    for (let i = 0; i < 18; i++) {
      const u = i / 18;
      const x = lerp(lx + 30, cx, u) + Math.sin(this.t * 3 + i * 0.6) * 4 * (1 - u);
      const y = lerp(ly - 14, top + 46, u);
      pxCircle(g, x, y, 3 + u * 6, i % 2 ? '#2a5a46' : '#1e4636');
    }
    // torso
    for (let y = 0; y < 30; y++) {
      const w = y < 10 ? 13 + y * 0.6 : 19 - (y - 10) * 0.45;
      fillR(g, cx - w - 1, top + 18 + y, w * 2 + 2, 1, ink);
      fillR(g, cx - w, top + 18 + y, w * 2, 1, y % 7 === 0 ? brassL : brass);
      fillR(g, cx + w - 3, top + 18 + y, 3, 1, brassD);
    }
    // emerald runes on the chest
    for (let i = 0; i < 4; i++) fillR(g, cx - 6 + i * 4, top + 26 + (i % 2) * 2, 2, 3, fl ? '#fff' : '#79f0a5');
    // arms to the fists
    for (const f of this.fists) {
      const fx = Math.round(f.x - cam.x), fy = Math.round(f.y - cam.y);
      const sx = cx + f.side * 16, sy = top + 24;
      const ex = lerp(sx, fx, 0.5) + f.side * 8, ey = lerp(sy, fy, 0.5) - 4;
      pxLine(g, sx, sy, ex, ey, ink, 7);
      pxLine(g, ex, ey, fx, fy, ink, 6);
      pxLine(g, sx, sy, ex, ey, brass, 5);
      pxLine(g, ex, ey, fx, fy, brass, 4);
      pxCircle(g, fx, fy, 9, ink);
      pxCircle(g, fx, fy, 8, f.state === 'down' ? brassL : brass);
      fillR(g, fx - 6, fy - 2, 12, 1, brassD);
      fillR(g, fx - 6, fy + 1, 12, 1, brassD);
      if (f.state === 'aim' && f.t >= 0) {
        // shadow telegraph on the floor
        const sw = 10 + f.t * 12;
        g.globalAlpha = 0.5;
        fillR(g, f.tx - cam.x - sw, A.floor - cam.y - 2, sw * 2, 2, '#000');
        g.globalAlpha = 1;
      }
    }
    // head with a crown of flame
    const hy = top + this.headLow;
    drawFlame(g, cx, hy + 2, 16, this.t, 1);
    drawFlame(g, cx - 6, hy + 4, 10, this.t * 1.2, 2);
    drawFlame(g, cx + 6, hy + 4, 10, this.t * 1.1, 3);
    for (let y = 0; y < 18; y++) {
      const w = y < 3 ? 6 + y : y < 13 ? 9 : 9 - (y - 12);
      fillR(g, cx - w - 1, hy + y, w * 2 + 2, 1, ink);
      fillR(g, cx - w, hy + y, w * 2, 1, brass);
    }
    fillR(g, cx - 9, hy + 3, 18, 1, brassL);
    const eye = this.state === 'tired' ? '#3a5a46' : '#a8ffc8';
    fillR(g, cx - 6, hy + 7, 4, 2, ink);
    fillR(g, cx + 2, hy + 7, 4, 2, ink);
    fillR(g, cx - 5, hy + 7, 2, 1, eye);
    fillR(g, cx + 3, hy + 7, 2, 1, eye);
    fillR(g, cx - 1, hy + 2, 2, 3, fl ? '#fff' : '#25b56a');
    fillR(g, cx - 4, hy + 13, 8, 1, ink);
    if (this.state === 'breath' && this.stT > 0.7) fillR(g, cx - 3, hy + 12, 6, 3, '#ffc444');
    // beard of smoke
    for (let i = 0; i < 5; i++) fillR(g, cx - 3 + i * 1.5, hy + 18 + Math.round(Math.sin(this.t * 4 + i) * 1), 1, 3, '#2a5a46');
    if (this.state === 'tired') drawText(g, '!', cx, hy - 14, '#a8ffc8', { align: 'center', outline: ink });
  }
  light() {
    Lighting.add(this.cx, this.y + 10 + this.headLow, 90, '#ffc444', 1);
    for (const f of this.fists) Lighting.add(f.x, f.y, 30, '#f4cf62', 0.6);
  }
}

class FallingCoinHazard extends Entity {
  constructor(x, y) {
    super(x - 4, y, 8, 8);
    this.vy = 30;
    this.layer = 2;
    this.warn = 0.55;
    this.floorY = null;
  }
  update(dt, level) {
    this.t += dt;
    if (this.warn > 0) {
      this.warn -= dt;
      return;
    }
    this.vy = Math.min(380, this.vy + 700 * dt);
    this.y += this.vy * dt;
    const p = this.player;
    if (p && overlap(this, p)) {
      p.hurt(1, this.cx);
      this.dead = true;
    }
    if (level.rectSolid(this.x, this.y, this.w, this.h)) {
      this.dead = true;
      Sfx.play('tink');
      Parts.burst(this.cx, this.y, 6, { col: ['#f4cf62', '#dea12a'], speed: 60, g: 300 });
      if (Math.random() < 0.25) Game.spawn(new Coin(this.cx, this.y - 6, 1, true));
    }
  }
  draw(g, cam) {
    if (this.warn > 0) {
      // glint high above
      if (Math.floor(this.t * 12) % 2) fillR(g, this.cx - cam.x, this.y - cam.y, 1, 1, '#fff1b3');
      return;
    }
    drawSprite(g, ART.coin[Math.floor(this.t * 12) % 4], this.cx - cam.x, this.y + 8 - cam.y);
  }
}

// ANDOR :: boot.

function debugSheet() {
  resizeScreen(false);
  ctx.fillStyle = '#3a302a';
  ctx.fillRect(0, 0, Screen.W, Screen.H);
  const z = DEBUG.z || 1;
  ctx.save();
  ctx.scale(z, z);
  let x = 2, y = 2, rowH = 0;
  const put = (f) => {
    if (x + f.w > Screen.W / z) {
      x = 2;
      y += rowH + 2;
      rowH = 0;
    }
    ctx.fillStyle = '#4a3f37';
    ctx.fillRect(x, y, f.w, f.h);
    ctx.drawImage(f.c, x, y);
    x += f.w + 2;
    rowH = Math.max(rowH, f.h);
  };
  const which = DEBUG.sheet === true ? 'hero' : DEBUG.sheet;
  if (which === 'hero') {
    for (const n of ['idle0', 'idle1', 'run0', 'run1', 'run2', 'run3', 'run4', 'run5', 'run6', 'run7', 'jump', 'fall', 'land', 'wall', 'hang', 'climb0', 'climb1', 'swingF', 'swingM', 'swingB', 'hurt', 'crouch']) put(heroFrame(n));
    for (const d of ['fwd', 'up', 'down']) for (let ph = 0; ph < 3; ph++) put(heroFrame(d === 'down' ? 'jump' : 'idle0', d, ph));
    heroExtras();
    for (const s of HERO_ROLL_SPR) put(s);
    put(HERO_DEAD_SPR);
  } else if (which === 'skins') {
    for (const sk of ['guard', 'archer', 'bandit', 'captain', 'mummy', 'jackal', 'sentinel']) {
      const poses = sk === 'mummy' ? ['idle0', 'shamble0', 'shamble2', 'shamble4', 'windup', 'slash'] : sk === 'archer' ? ['idle0', 'walk0', 'walk2', 'aim', 'draw', 'hurt'] : sk === 'jackal' ? ['idle0', 'run0', 'run3', 'thrust0', 'thrust1', 'leap'] : ['idle0', 'walk0', 'walk2', 'walk4', 'windup', 'slash', 'slash2', 'guard', 'hurt'];
      for (const p of poses) put(rigFrame(sk, p));
    }
  } else if (which === 'props') {
    const all = [...ART.scorpion, ...ART.cobra, ...ART.vulture, ...ART.bat, ...ART.scarab, ...ART.coin, ART.gem, ART.ruby, ART.pomegranate, ART.scroll, ...Object.values(ART.relics), ART.ring, ...Object.values(ART.pot), ART.brazier, ...ART.lever, ART.torch, ART.lantern, ART.dartFace, ART.skull, ART.camel];
    for (const s of all) put(s);
  }
  ctx.restore();
  if (which === 'hero') {
    drawText(ctx, 'Andor: The Sands Remember 0123456789 !?', 4, Screen.H - 22, PAL.gold2, { shadow: PAL.ink });
    drawText(ctx, 'quick brown fox jumps over the lazy dog, yes.', 4, Screen.H - 11, PAL.cream);
  }
}

// Render a whole level to one canvas and expose it for tools/mapshot.js.
function debugMap(idx) {
  Game.save.difficulty = 'adventurer';
  Game.loadChapter(idx);
  const L = Game.level;
  const c = makeCanvas(L.pw, L.ph);
  const g = c.getContext('2d');
  const cam = { x: 0, y: 0 };
  // tile the backdrop across the whole map
  for (let x = 0; x < L.pw; x += 400)
    for (let y = 0; y < L.ph; y += 240) {
      g.save();
      g.translate(x, y);
      g.beginPath();
      g.rect(0, 0, 400, 240);
      g.clip();
      Game.backdrop.draw(g, { x: x, y: y }, 400, 240, L.horizon - y, 3);
      g.restore();
    }
  L.drawChunks(g, cam, L.pw, L.ph);
  for (const e of Game.entities) e.draw(g, cam);
  Game.player.draw(g, cam);
  L.drawFakes(g, cam, null, 0, L.pw, L.ph);
  window.__map = c.toDataURL('image/png');
}

// Inspection handle for tools and the curious.
window.__andor = { Game, Cam, Input, Screen, LEVELS, Parts, Music, Settings, AudioSys, Sfx, SFX, TRACKS };

if (DEBUG.sheet) debugSheet();
else if (DEBUG.map !== undefined) {
  resizeScreen(false);
  debugMap(+DEBUG.map);
} else boot();

})();
</script>
