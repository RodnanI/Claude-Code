// Gear sprite frames (rotational symmetry lets 6 frames loop seamlessly).
function makeGearFrames(R, teeth, col, hi, sh) {
  const frames = [];
  const sz = R * 2 + 6;
  for (let f = 0; f < 6; f++) {
    const pb = new PixBuf(sz, sz);
    const rot = (f / 6) * (TAU / teeth);
    const cx = sz / 2, cy = sz / 2;
    for (let y = 0; y < sz; y++)
      for (let x = 0; x < sz; x++) {
        const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
        const d = Math.hypot(dx, dy);
        const a = Math.atan2(dy, dx) - rot;
        const tooth = Math.cos(a * teeth) > 0.2 ? 3 : 0;
        if (d > R + tooth || d < R * 0.22) continue;
        let c = col;
        if (d < R * 0.75 && d > R * 0.6) c = sh;
        else if (Math.abs(((a % (TAU / 6)) + TAU) % (TAU / 6) - TAU / 12) < 0.12 && d < R * 0.6) c = sh;
        if (dx + dy < -R * 0.3 && d > R - 2) c = hi;
        pb.set(x, y, c);
      }
    frames.push(pb.toCanvas());
  }
  return frames;
}

// Runtime backdrop renderer --------------------------------------------------
class Backdrop {
  constructor(theme) {
    this.def = (BACKDROPS[theme] || BACKDROPS.bazaar)();
    this.theme = theme;
    this.skyCanvas = null;
    this.skyKey = '';
    const rng = makeRng(9);
    this.stars = [];
    for (let i = 0; i < (this.def.stars || 0); i++)
      this.stars.push({ x: rng(), y: Math.pow(rng(), 1.6) * 0.55, b: rng(), tw: rng() * TAU, big: rng() < 0.08 });
    if (this.def.gears) {
      this.gearA = makeGearFrames(34, 14, C('#2a1e0c'), C('#5a4016'), C('#18110a'));
      this.gearB = makeGearFrames(20, 10, C('#33240e'), C('#6e4a18'), C('#1a120a'));
    }
    this.caravan = [];
    if (this.def.layers.some((l) => l.caravan)) for (let i = 0; i < 7; i++) this.caravan.push(i * 13 + (i % 2) * 3);
  }
  buildSky(w, h) {
    const key = w + 'x' + h;
    if (key === this.skyKey) return;
    this.skyKey = key;
    const pb = new PixBuf(w, h);
    pb.vgrad(0, 0, w, Math.ceil(h * this.def.skyH), this.def.sky);
    if (this.def.skyH < 1) pb.rect(0, Math.ceil(h * this.def.skyH), w, h, C(this.def.sky[this.def.sky.length - 1]));
    this.skyCanvas = pb.toCanvas();
  }
  // horizon: world y of the main ground line (layers sit on it at the reference view)
  draw(g, cam, vw, vh, horizon, t) {
    this.buildSky(vw, vh);
    g.drawImage(this.skyCanvas, 0, 0);
    const d = this.def;
    const refCam = horizon - vh * 0.64;
    const lift = refCam - cam.y;
    // stars
    for (const s of this.stars) {
      const tw = 0.5 + 0.5 * Math.sin(t * (1 + s.b * 2) + s.tw);
      if (tw < 0.25) continue;
      const x = Math.round(((s.x * vw * 1.3 - cam.x * 0.02) % vw + vw) % vw), y = Math.round(s.y * vh + lift * 0.01);
      g.fillStyle = tw > 0.8 ? '#fff6dc' : '#bfae88';
      g.fillRect(x, y, 1, 1);
      if (s.big && tw > 0.7) {
        g.fillStyle = 'rgba(255,240,200,0.5)';
        g.fillRect(x - 1, y, 1, 1);
        g.fillRect(x + 1, y, 1, 1);
        g.fillRect(x, y - 1, 1, 1);
        g.fillRect(x, y + 1, 1, 1);
      }
    }
    if (d.moon) {
      const m = d.moon;
      const mx = Math.round(vw * m.x - cam.x * 0.01), my = Math.round(vh * m.y + lift * 0.015);
      g.globalAlpha = 0.35;
      g.drawImage(lightStamp(m.r * 3, '#e9d6a0', 4), mx - m.r * 3, my - m.r * 3);
      g.globalAlpha = 1;
      pxCircle(g, mx, my, m.r, m.col);
      g.fillStyle = m.shade;
      for (const [cx, cy, r] of [[-4, -3, 3], [3, 2, 2], [-1, 5, 2], [5, -5, 1.5]]) pxCircle(g, mx + cx, my + cy, r, m.shade);
    }
    if (d.sun) {
      const s = d.sun;
      const sx = Math.round(vw * s.x - cam.x * 0.01), sy = Math.round(vh * s.y + lift * 0.015);
      g.globalAlpha = 0.5;
      g.drawImage(lightStamp(s.r * 5, '#fff3d0', 5), sx - s.r * 5, sy - s.r * 5);
      g.globalAlpha = 1;
      pxCircle(g, sx, sy, s.r + 2, '#fff2cc');
      pxCircle(g, sx, sy, s.r, '#fffbea');
    }
    if (d.sandfalls) this.drawSandfalls(g, cam, vw, vh, t, 0.06);
    for (let li = 0; li < d.layers.length; li++) {
      const L = d.layers[li];
      const lw = L.c.width, lh = L.c.height;
      const y = Math.round(vh * 0.64 - lh + L.yOff + lift * L.fy);
      let x = -Math.round(cam.x * L.fx) % lw;
      if (x > 0) x -= lw;
      if (L.shimmer && !Settings.reduceMotion) {
        for (let sy = 0; sy < lh; sy += 3) {
          const off = Math.round(Math.sin(t * 2.2 + (y + sy) * 0.21) * 0.8);
          for (let xx = x; xx < vw; xx += lw) g.drawImage(L.c, 0, sy, lw, 3, xx + off, y + sy, lw, 3);
        }
      } else for (let xx = x; xx < vw; xx += lw) g.drawImage(L.c, xx, y);
      if (L.fill && y + lh < vh) fillR(g, 0, y + lh, vw, vh - y - lh, L.fill);
      if (L.caravan) this.drawCaravan(g, cam, L, x, y, t);
      if (d.gears && li === 0) this.drawGears(g, cam, vw, vh, t, lift);
    }
    if (d.lanterns) this.drawLanternString(g, cam, vw, vh, t, lift);
    if (d.sandfalls) this.drawSandfalls(g, cam, vw, vh, t, 0.22);
  }
  drawCaravan(g, cam, L, lx, ly, t) {
    // camels plod along the dune crest, far away
    const lw = L.c.width;
    const base = (t * 4) % lw;
    for (let i = 0; i < this.caravan.length; i++) {
      const wx = (base + this.caravan[i]) % lw;
      const sx = Math.round(lx + wx), stepPh = Math.floor(t * 4 + i) % 2;
      const ph = (wx / lw) * TAU;
      const h = 40 + Math.sin(ph * 2) * 14 + Math.sin(ph * 5 + 1) * 8 + Math.sin(ph * 9 + 2) * 3;
      const sy = Math.round(ly + 109 - h);
      for (let k = -1; k <= 1; k++) {
        const xx = sx + k * lw;
        if (xx < -10 || xx > Screen.vw + 10) continue;
        g.fillStyle = '#7a4a2a';
        g.fillRect(xx - 3, sy - 5, 6, 2);
        g.fillRect(xx - 2, sy - 6, 3, 1);
        g.fillRect(xx + 3, sy - 7, 1, 3);
        g.fillRect(xx + 3, sy - 8, 2, 1);
        g.fillRect(xx - 3 + stepPh, sy - 3, 1, 3);
        g.fillRect(xx + 2 - stepPh, sy - 3, 1, 3);
        if (i % 3 === 0) g.fillRect(xx - 1, sy - 8, 1, 2);
      }
    }
  }
  drawGears(g, cam, vw, vh, t, lift) {
    const spots = [[80, 0.55, 1], [190, 0.35, -1], [330, 0.62, 1], [470, 0.4, -1]];
    for (const [gx, gy, dir] of spots) {
      const frames = gx % 2 ? this.gearB : this.gearA;
      const f = frames[Math.floor(((t * 3 * dir) % 6 + 6) % 6)];
      let x = ((gx - cam.x * 0.12) % 560 + 560) % 560 - 60;
      const y = Math.round(vh * gy + lift * 0.1 - f.height / 2);
      g.drawImage(f, Math.round(x), y);
    }
  }
  drawSandfalls(g, cam, vw, vh, t, f) {
    const xs = f < 0.1 ? [60, 250, 410] : [150, 380];
    for (const fx of xs) {
      let x = Math.round(((fx - cam.x * f) % 520 + 520) % 520 - 40);
      const w = f < 0.1 ? 3 : 6;
      g.globalAlpha = f < 0.1 ? 0.12 : 0.1;
      fillR(g, x - w * 2, 0, w * 5, vh, '#e8d39a');
      g.globalAlpha = f < 0.1 ? 0.5 : 0.75;
      for (let y = 0; y < vh; y += 2) {
        const o = ((y + t * 90) % 7) | 0;
        fillR(g, x + (o % 3) - 1, y, w - 1, 2, o < 3 ? '#e8c47c' : '#c99a52');
      }
      g.globalAlpha = 1;
    }
  }
  drawLanternString(g, cam, vw, vh, t, lift) {
    const span = 150, f = 0.42;
    // Anchor every string to a world index so each lantern keeps its own colour
    // and flicker phase as the camera scrolls (they used to reshuffle per step).
    const px = cam.x * f, base = Math.floor(px / span);
    const ox = Math.round(base * span - px);
    const y0 = Math.round(vh * 0.2 + lift * 0.2);
    const cols = ['#f4cf62', '#d9482f', '#3fb5a3', '#f07a22'];
    for (let j = -1, sx = ox - span; sx < vw + span; j++, sx += span) {
      const n = base + j;
      for (let i = 0; i <= 30; i++) {
        const u = i / 30;
        const x = Math.round(sx + u * span), y = Math.round(y0 + Math.sin(u * Math.PI) * 22);
        g.fillStyle = '#20140e';
        g.fillRect(x, y, 1, 1);
        if (i % 5 === 3) {
          const k = (i - 3) / 5;
          const h = ((n * 5 + k * 3) % 4 + 4) % 4;
          const col = cols[h];
          // slow, gentle candle breathing with a per-lantern phase
          const ph = n * 2.39 + k * 1.7;
          const fl = Settings.reduceMotion ? 1 : 0.88 + 0.12 * Math.sin(t * 1.6 + ph) * Math.sin(t * 0.7 + ph * 0.5);
          g.globalAlpha = 0.25 * fl;
          g.drawImage(lightStamp(6, col, 3), x - 6, y - 3);
          g.globalAlpha = 1;
          g.fillStyle = '#20140e';
          g.fillRect(x, y + 1, 1, 1);
          g.fillStyle = col;
          g.fillRect(x - 1, y + 2, 3, 3);
          g.fillStyle = '#fff1b3';
          g.fillRect(x, y + 3, 1, 1);
        }
      }
    }
  }
}

// ==== 06_level.js ====
// ANDOR :: level: parsing, chunk prerendering, tile collision.

const TILE_CHARS = {
  '#': T.SOLID, '%': T.ALT, '=': T.ONEWAY, '-': T.ROPE, w: T.AWNING, '^': T.SPIKE_U, v: T.SPIKE_D, '{': T.SPIKE_L, '}': T.SPIKE_R,
  q: T.QUICK, F: T.FAKE, C: T.CRUMBLE, G: T.GATE,
};
const CHUNK = 32;

// Pixel buffer addressed in world pixels (offset by the chunk origin).
class OffBuf extends PixBuf {
  constructor(w, h, ox, oy) {
    super(w, h);
    this.ox = ox;
    this.oy = oy;
  }
  set(x, y, c) {
    x = (x | 0) - this.ox;
    y = (y | 0) - this.oy;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    this.d[y * this.w + x] = c;
  }
  get(x, y) {
    x = (x | 0) - this.ox;
    y = (y | 0) - this.oy;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return 0;
    return this.d[y * this.w + x];
  }
}

class Level {
  constructor(def) {
    this.def = def;
    this.theme = THEMES[def.theme];
    const rows = def.map;
    this.h = rows.length;
    this.w = Math.max(...rows.map((r) => r.length));
    this.pw = this.w * TILE;
    this.ph = this.h * TILE;
    this.tiles = new Uint8Array(this.w * this.h);
    this.back = new Uint8Array(this.w * this.h);
    this.spawns = [];
    for (let y = 0; y < this.h; y++) {
      const r = rows[y];
      for (let x = 0; x < this.w; x++) {
        const ch = r[x] || '.';
        const t = TILE_CHARS[ch];
        if (t !== undefined) this.tiles[y * this.w + x] = t;
        if ((t === undefined || t === T.CRUMBLE || t === T.GATE) && ch !== '.' && ch !== ' ') this.spawns.push({ ch, x, y });
      }
    }
    if (def.interior) this.back.fill(1);
    for (const z of def.back || []) {
      const [x, y, w, h, v = 1] = z;
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (xx >= 0 && yy >= 0 && xx < this.w && yy < this.h) this.back[yy * this.w + xx] = v;
    }
    this.fakeTiles = [];
    // horizon for parallax: the feet of the start position, else near the bottom
    const st = this.spawns.find((s) => s.ch === '@');
    this.horizon = def.horizon !== undefined ? def.horizon * TILE : st ? (st.y + 1) * TILE : this.ph - 3 * TILE;
  }
  tileAt(tx, ty) {
    if (tx < 0 || tx >= this.w) return T.SOLID;
    if (ty >= this.h) return T.EMPTY;
    if (ty < 0) ty = 0;
    return this.tiles[ty * this.w + tx];
  }
  setTile(tx, ty, t) {
    if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return;
    this.tiles[ty * this.w + tx] = t;
  }
  solidAt(tx, ty) {
    const t = this.tileAt(tx, ty);
    return t === T.SOLID || t === T.ALT || t === T.FAKE;
  }
  isSolidPx(x, y) {
    return isSolidT(this.tileAt(Math.floor(x / TILE), Math.floor(y / TILE)));
  }
  // Any solid tile overlapping the rect?
  rectSolid(x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.001) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.001) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolidT(this.tileAt(tx, ty))) return true;
    return false;
  }
  rectTileType(x, y, w, h, fn) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.001) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.001) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (fn(this.tileAt(tx, ty), tx, ty)) return true;
    return false;
  }

  // Paint the static world into chunk canvases.
  prerender() {
    const th = this.theme;
    PAINT.level = this;
    this.chunks = [];
    this.cw = Math.ceil(this.w / CHUNK);
    this.chh = Math.ceil(this.h / CHUNK);
    const shadow = C('#000000');
    const noDepth = th.name === 'bazaar';
    // how deep each solid tile sits inside the rock (0 = exposed edge)
    const depth = new Uint8Array(this.w * this.h);
    for (let ty = 0; ty < this.h; ty++)
      for (let tx = 0; tx < this.w; tx++) {
        const t = this.tiles[ty * this.w + tx];
        if (t !== T.SOLID && t !== T.ALT) continue;
        let d = 4;
        for (let r = 1; r <= 3 && d === 4; r++)
          for (let yy = -r; yy <= r && d === 4; yy++)
            for (let xx = -r; xx <= r; xx++) {
              const nt = this.tileAt(tx + xx, ty + yy);
              if (!(nt === T.SOLID || nt === T.ALT || nt === T.FAKE || nt === T.CRUMBLE || nt === T.GATE) && ty + yy < this.h) {
                d = r;
                break;
              }
            }
        depth[ty * this.w + tx] = d === 4 ? 4 : d;
      }
    for (let cy = 0; cy < this.chh; cy++)
      for (let cx = 0; cx < this.cw; cx++) {
        const tx0 = cx * CHUNK, ty0 = cy * CHUNK;
        const tw = Math.min(CHUNK, this.w - tx0), tht = Math.min(CHUNK, this.h - ty0);
        const ox = tx0 * TILE, oy = ty0 * TILE;
        const back = new OffBuf(tw * TILE, tht * TILE, ox, oy);
        const front = new OffBuf(tw * TILE, tht * TILE, ox, oy);
        // paint one extra tile of margin for front so shadows across chunk edges work
        for (let ty = ty0; ty < ty0 + tht; ty++)
          for (let tx = tx0; tx < tx0 + tw; tx++) {
            const i = ty * this.w + tx;
            if (th.deep && depth[i] >= 4 && this.tiles[i] === T.SOLID) {
              th.deep(front, tx * TILE, ty * TILE, tx, ty);
              continue;
            }
            if (this.back[i]) th.back(back, tx * TILE, ty * TILE, tx, ty);
            this.paintTile(front, tx, ty);
          }
        // composite with a soft drop shadow onto the back wall
        const W = back.w, H = back.h;
        const fd = front.d, bd = back.d;
        const shadowAt = (x, y) => {
          // sample the front layer at an offset; outside the chunk, ask the tile map
          if (x >= 0 && y >= 0 && x < W && y < H) return fd[y * W + x] >>> 24 > 0;
          const t = this.tileAt(Math.floor((x + ox) / TILE), Math.floor((y + oy) / TILE));
          return t === T.SOLID || t === T.ALT || t === T.FAKE;
        };
        for (let y = 0; y < H; y++)
          for (let x = 0; x < W; x++) {
            const i = y * W + x;
            const f = fd[i];
            if (f >>> 24) {
              const dep = noDepth ? 0 : depth[((y + oy) >> 4) * this.w + ((x + ox) >> 4)];
              if (dep > 1) {
                const k = dep === 2 ? 0.86 : dep === 3 ? 0.74 : 0.64;
                const dd = dep >= 3 && bayer(x, y) > 0.5 ? k + 0.05 : k;
                bd[i] = packRgb(((f & 255) * dd) | 0, (((f >> 8) & 255) * dd) | 0, (((f >> 16) & 255) * (dd + 0.03)) | 0, 255);
              } else bd[i] = f;
              continue;
            }
            const b = bd[i];
            if (!(b >>> 24)) continue;
            if (shadowAt(x - 3, y - 3) || shadowAt(x - 1, y - 2)) {
              const r = (b & 255) * 0.62, g = ((b >> 8) & 255) * 0.62, bl = ((b >> 16) & 255) * 0.66;
              bd[i] = packRgb(r | 0, g | 0, bl | 0, 255);
            }
          }
        this.chunks.push({ x: ox, y: oy, c: back.toCanvas() });
      }
    // Fake walls get their own canvases so they can fade when entered.
    for (const s of this.fakeTiles) {
      const pb = new OffBuf(TILE, TILE, s.x * TILE, s.y * TILE);
      th.solid(pb, s.x * TILE, s.y * TILE, s.x, s.y, nb(this, s.x, s.y));
      s.c = pb.toCanvas();
    }
    void shadow;
  }
  paintTile(pb, tx, ty) {
    const t = this.tileAt(tx, ty);
    const th = this.theme;
    const px = tx * TILE, py = ty * TILE;
    switch (t) {
      case T.SOLID:
        th.solid(pb, px, py, tx, ty, nb(this, tx, ty));
        break;
      case T.ALT:
        th.alt(pb, px, py, tx, ty, nb(this, tx, ty));
        break;
      case T.ONEWAY:
      case T.ROPE:
      case T.AWNING: {
        const n = nb(this, tx, ty);
        n.lw = this.tileAt(tx - 1, ty) === t || n.l;
        n.rw = this.tileAt(tx + 1, ty) === t || n.r;
        (t === T.AWNING ? th.awning : t === T.ROPE ? th.rope || th.oneway : th.oneway)(pb, px, py, tx, ty, n);
        break;
      }
      case T.SPIKE_U:
        paintSpikes(pb, px, py, 'u', th.spike);
        break;
      case T.SPIKE_D:
        paintSpikes(pb, px, py, 'd', th.spike);
        break;
      case T.SPIKE_L:
        paintSpikes(pb, px, py, 'l', th.spike);
        break;
      case T.SPIKE_R:
        paintSpikes(pb, px, py, 'r', th.spike);
        break;
      case T.QUICK:
        paintQuicksand(pb, px, py, tx, ty, null, this.tileAt(tx, ty - 1) !== T.QUICK);
        break;
      case T.FAKE:
        this.fakeTiles.push({ x: tx, y: ty, a: 1 });
        break;
    }
  }
  drawChunks(g, cam, vw, vh) {
    for (const ch of this.chunks) {
      const x = ch.x - cam.x, y = ch.y - cam.y;
      if (x > vw || y > vh || x + ch.c.width < 0 || y + ch.c.height < 0) continue;
      g.drawImage(ch.c, Math.round(x), Math.round(y));
    }
  }
  drawFakes(g, cam, player, dt, vw = Screen.vw, vh = Screen.vh) {
    for (const f of this.fakeTiles) {
      const near = player && Math.abs(player.cx - (f.x * TILE + 8)) < 40 && Math.abs(player.cy - (f.y * TILE + 8)) < 36 && this.def.fakeRegion !== false;
      const inside = player && player.x < f.x * TILE + 16 + 24 && player.x + player.w > f.x * TILE - 24 && player.y < f.y * TILE + 16 + 20 && player.y + player.h > f.y * TILE - 20;
      f.a = approach(f.a, inside && near ? 0.15 : 1, dt * 3);
      const x = f.x * TILE - cam.x, y = f.y * TILE - cam.y;
      if (x < -16 || y < -16 || x > vw || y > vh) continue;
      g.globalAlpha = f.a;
      g.drawImage(f.c, Math.round(x), Math.round(y));
      g.globalAlpha = 1;
    }
  }
}

// ---------------------------------------------------------------------------
// Physics body moved through the tile grid. Entities extend this.
class Body {
  constructor(x, y, w, h) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.vx = 0;
    this.vy = 0;
    this.onGround = false;
    this.hitWall = 0;
    this.hitCeil = false;
    this.dropThrough = 0;
    this.groundType = T.EMPTY;
  }
  get cx() {
    return this.x + this.w / 2;
  }
  get cy() {
    return this.y + this.h / 2;
  }
  get bottom() {
    return this.y + this.h;
  }
  moveX(level, dx) {
    this.hitWall = 0;
    if (!dx) return;
    this.x += dx;
    const y0 = Math.floor(this.y / TILE), y1 = Math.floor((this.y + this.h - 0.01) / TILE);
    if (dx > 0) {
      const tx = Math.floor((this.x + this.w - 0.001) / TILE);
      for (let ty = y0; ty <= y1; ty++)
        if (isSolidT(level.tileAt(tx, ty))) {
          this.x = tx * TILE - this.w;
          this.hitWall = 1;
          break;
        }
    } else {
      const tx = Math.floor(this.x / TILE);
      for (let ty = y0; ty <= y1; ty++)
        if (isSolidT(level.tileAt(tx, ty))) {
          this.x = (tx + 1) * TILE;
          this.hitWall = -1;
          break;
        }
    }
  }
  moveY(level, dy) {
    this.hitCeil = false;
    const wasGround = this.onGround;
    this.onGround = false;
    if (!dy) {
      this.onGround = wasGround && this.checkGround(level);
      return;
    }
    const prevBottom = this.y + this.h;
    this.y += dy;
    const x0 = Math.floor(this.x / TILE), x1 = Math.floor((this.x + this.w - 0.01) / TILE);
    if (dy > 0) {
      const ty = Math.floor((this.y + this.h - 0.001) / TILE);
      for (let tx = x0; tx <= x1; tx++) {
        const t = level.tileAt(tx, ty);
        if (isSolidT(t) || (isOneWayT(t) && !this.dropThrough && prevBottom <= ty * TILE + 0.5)) {
          this.y = ty * TILE - this.h;
          this.onGround = true;
          this.groundType = t;
          this.vy = 0;
          break;
        }
      }
    } else {
      const ty = Math.floor(this.y / TILE);
      for (let tx = x0; tx <= x1; tx++)
        if (isSolidT(level.tileAt(tx, ty))) {
          this.y = (ty + 1) * TILE;
          this.hitCeil = true;
          if (this.vy < 0) this.vy = 0;
          break;
        }
    }
  }
  checkGround(level) {
    const ty = Math.floor((this.y + this.h + 0.5) / TILE);
    if ((this.y + this.h) % TILE > 0.6 && (this.y + this.h) % TILE < 15.4) return false;
    const x0 = Math.floor(this.x / TILE), x1 = Math.floor((this.x + this.w - 0.01) / TILE);
    for (let tx = x0; tx <= x1; tx++) {
      const t = level.tileAt(tx, ty);
      if (isSolidT(t) || (isOneWayT(t) && !this.dropThrough)) {
        this.groundType = t;
        return true;
      }
    }
    return false;
  }
}

// ==== 07_fx.js ====
// ANDOR :: camera, particles, lighting, weather and screen effects.

const Cam = {
  x: 0, y: 0, shakeT: 0, shakeMag: 0, sx: 0, sy: 0, look: 0, lock: null, lookY: 0,
  reset(px, py, level) {
    this.x = px - Screen.vw / 2;
    this.y = py - Screen.vh * 0.6;
    this.lock = null;
    this.clamp(level);
  },
  shake(mag, t = 0.25) {
    if (Settings.shake === false) return;
    this.shakeMag = Math.max(this.shakeMag, mag);
    this.shakeT = Math.max(this.shakeT, t);
  },
  update(dt, p, level) {
    const vw = Screen.vw, vh = Screen.vh;
    this.look = approach(this.look, p.face * Math.min(28, vw * 0.09), dt * 70);
    let tx = p.cx + this.look - vw / 2;
    // vertical: follow feet with a dead zone; look further down while falling fast
    const feet = p.y + p.h;
    let ty = this.y;
    const top = this.y + vh * 0.32, bot = this.y + vh * 0.68;
    if (feet < top) ty = feet - vh * 0.32;
    if (feet > bot) ty = feet - vh * 0.68;
    if (p.onGround || p.state === 'hang' || p.state === 'swing') ty = lerp(ty, feet - vh * 0.62, 0.06);
    if (p.vy > 200) ty += (p.vy - 200) * 0.08;
    this.lookY = approach(this.lookY, p.lookDown ? 46 : 0, dt * 120);
    ty += this.lookY;
    if (this.lock) {
      const L = this.lock;
      tx = clamp(tx, L.x, L.x + L.w - vw);
      ty = clamp(ty, L.y, L.y + L.h - vh);
      if (L.w < vw) tx = L.x + (L.w - vw) / 2;
      if (L.h < vh) ty = L.y + L.h - vh;
    }
    const k = 1 - Math.pow(0.0005, dt);
    this.x = lerp(this.x, tx, Math.min(1, k * 1.6));
    this.y = lerp(this.y, ty, Math.min(1, k * 1.3));
    this.clamp(level);
    if (this.shakeT > 0) {
      this.shakeT -= dt;
      const m = this.shakeMag * Math.min(1, this.shakeT * 6);
      this.sx = Math.round(rnd(-m, m));
      this.sy = Math.round(rnd(-m, m));
      if (this.shakeT <= 0) this.shakeMag = 0;
    } else this.sx = this.sy = 0;
  },
  clamp(level) {
    const vw = Screen.vw, vh = Screen.vh;
    if (level.pw <= vw) this.x = (level.pw - vw) / 2;
    else this.x = clamp(this.x, 0, level.pw - vw);
    if (level.ph <= vh) this.y = level.ph - vh;
    else this.y = clamp(this.y, 0, level.ph - vh);
  },
  get rx() {
    return Math.round(this.x) + this.sx;
  },
  get ry() {
    return Math.round(this.y) + this.sy;
  },
};

// ---------------------------------------------------------------------------
const Parts = {
  list: [],
  max: 600,
  add(o) {
    if (this.list.length >= this.max) this.list.shift();
    const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 0.5, max: 0.5, col: '#fff', s: 1, g: 0, drag: 0, type: 'px', front: true }, o);
    p.max = p.life;
    this.list.push(p);
    return p;
  },
  burst(x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = o.angle !== undefined ? o.angle + rnd(-(o.spread || Math.PI), o.spread || Math.PI) : rnd(TAU);
      const sp = rnd(o.speedMin || 20, o.speed || 80);
      this.add({
        x: x + rnd(-(o.rx || 0), o.rx || 0), y: y + rnd(-(o.ry || 0), o.ry || 0),
        vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0),
        life: rnd(o.lifeMin || 0.25, o.life || 0.6), col: Array.isArray(o.col) ? pick(o.col) : o.col || '#fff',
        s: o.s || 1, g: o.g === undefined ? 200 : o.g, drag: o.drag || 1, type: o.type || 'px', front: o.front !== false,
      });
    }
  },
  dust(x, y, n = 6, col = '#e6cf9e', dir = 0) {
    for (let i = 0; i < n; i++)
      this.add({ x: x + rnd(-4, 4), y: y - rnd(0, 2), vx: rnd(-30, 30) + dir * 40, vy: rnd(-30, -5), life: rnd(0.25, 0.5), col, g: 60, drag: 3, type: 'puff', s: rnd(1, 2.5) });
  },
  text(x, y, str, col = PAL.gold2) {
    this.add({ x, y, vy: -28, life: 0.9, str, col, type: 'text', drag: 2 });
  },
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) {
        L.splice(i, 1);
        continue;
      }
      p.vy += p.g * dt;
      if (p.drag) {
        const f = Math.max(0, 1 - p.drag * dt);
        p.vx *= f;
        p.vy *= f;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.collide && Game.level && Game.level.isSolidPx(p.x, p.y)) {
        p.vy *= -0.3;
        p.vx *= 0.6;
        p.y -= 1;
      }
    }
  },
  draw(g, cam, front) {
    for (const p of this.list) {
      if (p.front !== front) continue;
      const x = Math.round(p.x - cam.x), y = Math.round(p.y - cam.y);
      const t = p.life / p.max;
      if (p.type === 'px') {
        g.fillStyle = p.col;
        g.fillRect(x, y, p.s, p.s);
      } else if (p.type === 'puff') {
        const r = p.s * (1.4 - t * 0.6);
        g.globalAlpha = Math.min(1, t * 1.6) * 0.8;
        pxCircle(g, x, y, r, p.col);
        g.globalAlpha = 1;
      } else if (p.type === 'spark') {
        g.fillStyle = p.col;
        g.fillRect(x, y, 1, 1);
        g.fillRect(Math.round(x - p.vx * 0.02), Math.round(y - p.vy * 0.02), 1, 1);
      } else if (p.type === 'ring') {
        g.globalAlpha = t;
        pxRing(g, x, y, (1 - t) * p.s + 2, p.col);
        g.globalAlpha = 1;
      } else if (p.type === 'text') {
        g.globalAlpha = Math.min(1, t * 3);
        drawText(g, p.str, x, y, p.col, { align: 'center', outline: PAL.ink });
        g.globalAlpha = 1;
      } else if (p.type === 'glow') {
        g.globalAlpha = t * 0.8;
        const s = lightStamp(p.s, p.col, 3);
        g.drawImage(s, x - p.s, y - p.s);
        g.globalAlpha = 1;
      } else if (p.type === 'leaf') {
        g.fillStyle = p.col;
        g.fillRect(x, y, Math.sin(p.life * 12) > 0 ? 2 : 1, 1);
      }
    }
  },
};

// ---------------------------------------------------------------------------
// Darkness with banded, dithered light pools. Lights are re-added every frame.
const Lighting = {
  c: null,
  g: null,
  lights: [],
  ambient: 0,
  tint: '#070403',
  begin(ambient, tint) {
    this.ambient = ambient;
    this.tint = tint || '#070403';
    this.lights.length = 0;
  },
  add(x, y, r, warm = '#ffb34a', power = 1) {
    this.lights.push({ x, y, r, warm, power });
  },
  render(g, cam, vw, vh) {
    if (this.ambient <= 0) return;
    if (!this.c || this.c.width !== vw || this.c.height !== vh) {
      this.c = makeCanvas(vw, vh);
      this.g = this.c.getContext('2d');
    }
    const lg = this.g;
    lg.globalCompositeOperation = 'source-over';
    lg.clearRect(0, 0, vw, vh);
    lg.globalAlpha = this.ambient;
    lg.fillStyle = this.tint;
    lg.fillRect(0, 0, vw, vh);
    lg.globalAlpha = 1;
    lg.globalCompositeOperation = 'destination-out';
    for (const L of this.lights) {
      const x = Math.round(L.x - cam.x), y = Math.round(L.y - cam.y), r = Math.round(L.r);
      if (x + r < 0 || y + r < 0 || x - r > vw || y - r > vh) continue;
      lg.globalAlpha = Math.min(1, L.power);
      lg.drawImage(lightStamp(r, '#ffffff', 5), x - r, y - r);
    }
    lg.globalAlpha = 1;
    lg.globalCompositeOperation = 'source-over';
    g.drawImage(this.c, 0, 0);
    // warm additive bloom
    g.globalCompositeOperation = 'lighter';
    for (const L of this.lights) {
      if (!L.warm) continue;
      const x = Math.round(L.x - cam.x), y = Math.round(L.y - cam.y), r = Math.round(L.r * 0.7);
      if (x + r < 0 || y + r < 0 || x - r > vw || y - r > vh) continue;
      g.globalAlpha = 0.16 * Math.min(1, L.power);
      g.drawImage(lightStamp(r, L.warm, 3), x - r, y - r);
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  },
};

// ---------------------------------------------------------------------------
const Weather = {
  storm: 0, // 0..1 sandstorm intensity
  target: 0,
  wind: 0,
  motes: [],
  init() {
    this.motes = [];
    for (let i = 0; i < 140; i++) this.motes.push({ x: rnd(1), y: rnd(1), s: rnd(0.4, 1), l: rnd(4, 14) });
  },
  update(dt) {
    this.storm = approach(this.storm, this.target, dt * 0.35);
    this.wind = this.storm;
  },
  draw(g, cam, vw, vh, t) {
    if (this.storm <= 0.01) return;
    const s = this.storm;
    g.globalAlpha = 0.28 * s;
    fillR(g, 0, 0, vw, vh, '#c99a5c');
    g.globalAlpha = 1;
    for (const m of this.motes) {
      const sp = 260 + m.s * 280;
      const x = ((m.x * (vw + 60) + t * sp - cam.x * 0.4) % (vw + 60) + vw + 60) % (vw + 60) - 30;
      const y = ((m.y * vh + Math.sin(t * 2 + m.x * 20) * 6 + t * 30 * m.s) % vh + vh) % vh;
      if (Math.random() > s * 1.2) continue;
      g.globalAlpha = 0.35 + m.s * 0.4;
      fillR(g, x, y, m.l * m.s, 1, m.s > 0.7 ? '#f6e0b0' : '#d9b27a');
    }
    g.globalAlpha = 1;
  },
};

// Cached vignette per view size.
const Vignette = {
  c: null,
  key: '',
  draw(g, vw, vh, strength = 1) {
    const key = vw + 'x' + vh;
    if (key !== this.key) {
      this.key = key;
      const pb = new PixBuf(vw, vh);
      const ink = hexToRgb('#0b0604');
      for (let y = 0; y < vh; y++)
        for (let x = 0; x < vw; x++) {
          const dx = (x - vw / 2) / (vw / 2), dy = (y - vh / 2) / (vh / 2);
          const d = Math.sqrt(dx * dx * 0.8 + dy * dy);
          const v = clamp((d - 0.72) * 1.4, 0, 1);
          const q = Math.floor(v * 4 + bayer(x, y)) / 4;
          if (q > 0) pb.set(x, y, packRgb(ink[0], ink[1], ink[2], Math.round(q * 150)));
        }
      this.c = pb.toCanvas();
    }
    g.globalAlpha = strength;
    g.drawImage(this.c, 0, 0);
    g.globalAlpha = 1;
  },
  red(vw, vh) {
    const key = vw + 'x' + vh;
    if (this.redKey !== key) {
      this.redKey = key;
      const pb = new PixBuf(vw, vh);
      for (let y = 0; y < vh; y++)
        for (let x = 0; x < vw; x++) {
          const dx = (x - vw / 2) / (vw / 2), dy = (y - vh / 2) / (vh / 2);
          const v = clamp((Math.sqrt(dx * dx * 0.7 + dy * dy) - 0.62) * 1.6, 0, 1);
          const q = Math.floor(v * 4 + bayer(x, y)) / 4;
          if (q > 0) pb.set(x, y, packRgb(150, 16, 20, Math.round(q * 200)));
        }
      this.redC = pb.toCanvas();
    }
    return this.redC;
  },
};

// ==== 08_player.js ====
// ANDOR :: player controller.

const PHYS = {
  run: 108, accG: 1350, decG: 1800, accA: 980, decA: 420,
  grav: 1000, fallMax: 330, jumpV: 338, jumpCut: 0.45, apexG: 0.55, apexV: 55,
  coyote: 0.1, buffer: 0.14,
  wallSlide: 72, wallJumpX: 168, wallJumpY: 312, wallLock: 0.16,
  rollV: 215, rollT: 0.3, rollCD: 0.22, airRollT: 0.2,
  whipT: 0.3, whipReach: 46, ringRange: 104,
  bounceV: 430,
};

class Player extends Body {
  constructor(x, y) {
    super(x, y, 10, 20);
    this.face = 1;
    this.state = 'normal';
    this.stT = 0;
    this.maxHp = Game.maxHp();
    this.hp = this.maxHp;
    this.inv = 0;
    this.coyote = 0;
    this.jumpBuf = 0;
    this.jumping = false;
    this.wallDir = 0;
    this.wallGrace = 0;
    this.wallLockT = 0;
    this.airRolls = 1;
    this.rollT = 0;
    this.rollCD = 0;
    this.whipT = -1;
    this.whipDir = 'fwd';
    this.whipHits = new Set();
    this.whipCD = 0;
    this.swing = null;
    this.ringCD = 0;
    this.hang = null;
    this.landT = 0;
    this.animT = 0;
    this.runPh = 0;
    this.lookDown = false;
    this.downT = 0;
    this.crouch = false;
    this.lastSafe = { x, y };
    this.safeT = 0;
    this.sink = 0;
    this.feather = Game.upgrades().feather ? 1 : 0;
    this.deadT = 0;
    this.hazardT = 0;
    this.ledgeIgnore = 0;
    this.platform = null;
    this.fallStartY = y;
    this.stepDust = 0;
    this.scarf = [];
    for (let i = 0; i < 7; i++) this.scarf.push({ x: x, y: y + 4, px: x, py: y + 4 });
  }
  get invulnerable() {
    return this.inv > 0 || this.state === 'dead' || this.state === 'exit' || (this.state === 'roll' && this.rollT < PHYS.rollT - 0.02) || DEBUG.god;
  }
  setState(s) {
    this.state = s;
    this.stT = 0;
  }
  // Standing hitbox restore after roll/crouch, if there is room.
  standUp(level) {
    if (this.h === 20) return true;
    const ny = this.y + this.h - 20;
    if (level.rectSolid(this.x, ny, this.w, 20)) return false;
    this.y = ny;
    this.h = 20;
    return true;
  }
  shrink(h) {
    if (this.h === h) return;
    this.y += this.h - h;
    this.h = h;
  }

  update(dt, level) {
    const I = Input;
    this.stT += dt;
    this.animT += dt;
    this.inv = Math.max(0, this.inv - dt);
    this.rollCD = Math.max(0, this.rollCD - dt);
    this.whipCD = Math.max(0, this.whipCD - dt);
    this.ringCD = Math.max(0, this.ringCD - dt);
    this.wallLockT = Math.max(0, this.wallLockT - dt);
    this.landT = Math.max(0, this.landT - dt);
    this.dropThrough = Math.max(0, this.dropThrough - dt);
    this.ledgeIgnore = Math.max(0, this.ledgeIgnore - dt);
    if (I.p.jump) this.jumpBuf = PHYS.buffer;
    else this.jumpBuf = Math.max(0, this.jumpBuf - dt);

    switch (this.state) {
      case 'normal': this.updNormal(dt, level); break;
      case 'roll': this.updRoll(dt, level); break;
      case 'hang': this.updHang(dt, level); break;
      case 'climb': this.updClimb(dt, level); break;
      case 'swing': this.updSwing(dt, level); break;
      case 'hurt': this.updHurt(dt, level); break;
      case 'dead': this.updDead(dt, level); break;
      case 'exit': this.updExit(dt, level); break;
      case 'frozen': this.vx = 0; this.applyGravity(dt); this.moveY(level, this.vy * dt); break;
    }
    if (this.whipT >= 0) this.updWhip(dt, level);
    this.checkHazards(level);
    this.updScarf(dt);
  }

  dirX() {
    const I = Input.held;
    return (I.right ? 1 : 0) - (I.left ? 1 : 0);
  }
  applyGravity(dt) {
    let g = PHYS.grav;
    if (this.jumping && Input.held.jump && Math.abs(this.vy) < PHYS.apexV) g *= PHYS.apexG;
    this.vy = Math.min(PHYS.fallMax, this.vy + g * dt);
  }

  updNormal(dt, level) {
    const I = Input;
    let dir = this.dirX();
    const quick = this.inQuicksand(level);
    // crouch / look down
    this.crouch = false;
    if (this.onGround && I.held.down && !dir && this.whipT < 0) {
      this.crouch = true;
      this.downT += dt;
      this.shrink(14);
    } else {
      this.downT = 0;
      if (this.h !== 20 && !this.standUp(level)) {
        this.crouch = true;
        dir = 0;
      }
    }
    this.lookDown = this.downT > 0.45;

    // horizontal
    let max = PHYS.run * (quick ? 0.45 : 1);
    if (this.wallLockT > 0) dir = sgn(this.vx) || dir;
    const acc = this.onGround ? (dir ? PHYS.accG : PHYS.decG) : dir ? PHYS.accA : PHYS.decA;
    if (this.crouch) this.vx = approach(this.vx, 0, PHYS.decG * dt);
    else if (dir) {
      // overspeed (from rolls, swings, bounces) bleeds off gently
      if (Math.abs(this.vx) > max && sgn(this.vx) === dir) this.vx = approach(this.vx, dir * max, (this.onGround ? 500 : 140) * dt);
      else this.vx = approach(this.vx, dir * max, acc * dt);
    } else this.vx = approach(this.vx, 0, acc * dt);
    if (dir && this.whipT < 0 && this.wallLockT <= 0) this.face = dir;
    if (Weather.wind > 0.05 && !this.onGround) this.vx -= Weather.wind * 80 * dt;
    if (Weather.wind > 0.05 && this.onGround && !dir) this.vx -= Weather.wind * 30 * dt;

    // coyote
    if (this.onGround) {
      this.coyote = PHYS.coyote;
      this.airRolls = 1;
    } else this.coyote = Math.max(0, this.coyote - dt);

    // wall contact
    this.wallDir = 0;
    if (!this.onGround && this.h === 20) {
      const probe = (d) => level.rectSolid(d > 0 ? this.x + this.w : this.x - 1, this.y + 4, 1, this.h - 8);
      if (dir && probe(dir) && this.vy > -40) this.wallDir = dir;
      if (this.wallDir) {
        this.wallGrace = 0.09;
        this.lastWall = this.wallDir;
        this.airRolls = 1;
      } else this.wallGrace = Math.max(0, this.wallGrace - dt);
    } else this.wallGrace = 0;

    // ledge grab / mantle
    if (!this.onGround && dir && this.h === 20 && this.vy > -60 && this.whipT < 0 && this.ledgeIgnore <= 0 && this.tryLedge(level, dir)) return;

    // jump
    if (this.jumpBuf > 0) {
      if (this.onGround && I.held.down && this.groundType !== T.SOLID && isOneWayT(this.groundType)) {
        this.dropThrough = 0.22;
        this.y += 1;
        this.onGround = false;
        this.jumpBuf = 0;
        this.coyote = 0;
      } else if (this.coyote > 0 || this.onGround || (quick && this.vy >= 0)) {
        // sand gives a weaker push, but you can always fight your way up
        this.doJump(quick ? 0.8 : 1);
      } else if (this.wallGrace > 0 && this.lastWall) {
        const wd = this.lastWall;
        this.vx = -wd * PHYS.wallJumpX;
        this.vy = -PHYS.wallJumpY;
        this.face = -wd;
        this.wallLockT = PHYS.wallLock;
        this.jumping = true;
        this.jumpBuf = 0;
        this.wallGrace = 0;
        Parts.dust(this.cx + wd * 6, this.y + 12, 5, '#e8d6ae', -wd);
        Sfx.play('walljump');
      }
    }
    if (this.jumping && !I.held.jump && this.vy < 0) {
      this.vy *= PHYS.jumpCut;
      this.jumping = false;
    }
    if (this.vy >= 0) this.jumping = false;

    // roll / dash
    if (I.p.roll && this.rollCD <= 0 && this.whipT < 0) {
      if (this.onGround) return this.startRoll(false);
      if (this.airRolls > 0) return this.startRoll(true);
    }
    // whip
    if (I.p.whip && this.whipCD <= 0 && this.whipT < 0) this.startWhip(level);
    if (this.state !== 'normal') return;

    // gravity + wall slide
    const wasGround = this.onGround;
    const vyBefore = this.vy;
    this.applyGravity(dt);
    if (this.wallDir && this.vy > PHYS.wallSlide) {
      this.vy = approach(this.vy, PHYS.wallSlide, 2400 * dt);
      if (Math.random() < 0.3) Parts.add({ x: this.wallDir > 0 ? this.x + this.w : this.x, y: this.y + 6, vx: -this.wallDir * 10, vy: -10, life: 0.3, col: '#e8d6ae', g: 30 });
      if (this.stT % 0.18 < dt) Sfx.play('slide');
    }
    if (quick) {
      this.vy = Math.min(this.vy, 22);
      this.sink += dt;
    } else this.sink = 0;

    this.moveX(level, this.vx * dt);
    this.moveY(level, this.vy * dt);
    this.ridePlatforms(dt, level);
    if (this.hitCeil) {
      this.vy = Math.max(this.vy, 20);
      this.jumping = false;
    }
    if (this.hitWall) {
      // a knee-high step: hop it instead of stopping dead
      if (this.onGround && dir === this.hitWall && !this.crouch) {
        const fx = dir > 0 ? this.x + this.w + 1 : this.x - 1;
        const ty = Math.floor((this.y + this.h - 1) / TILE);
        const tx = Math.floor(fx / TILE);
        if (isSolidT(level.tileAt(tx, ty)) && !level.rectSolid(dir > 0 ? this.x + 2 : this.x - 2, (ty - 1) * TILE - this.h + 16 - 2, this.w, this.h) && !isSolidT(level.tileAt(tx, ty - 1)) && !isSolidT(level.tileAt(tx, ty - 2))) {
          this.vy = -235;
          this.onGround = false;
          this.coyote = 0;
        }
      }
      this.vx = 0;
    }

    if (!wasGround && this.onGround) this.onLand(vyBefore, level);
    if (wasGround && !this.onGround && this.vy >= 0) this.fallStartY = this.y;
    if (this.onGround && this.groundType === T.AWNING && vyBefore > 60) this.bounce(level, vyBefore);

    // footstep dust
    if (this.onGround && Math.abs(this.vx) > 60) {
      this.stepDust -= dt;
      if (this.stepDust <= 0) {
        this.stepDust = 0.22;
        Parts.dust(this.cx - this.face * 3, this.bottom, 2, level.theme.name === 'tomb' ? '#9c8b6a' : '#e6cf9e', -this.face * 0.5);
        Sfx.play('step');
      }
    }
    this.updSafe(dt, level);
  }

  doJump(mult = 1) {
    this.vy = -PHYS.jumpV * mult;
    this.jumping = true;
    this.jumpBuf = 0;
    this.coyote = 0;
    this.onGround = false;
    Parts.dust(this.cx, this.bottom, 4);
    Sfx.play('jump');
  }
  bounce(level, vyIn) {
    this.vy = -Math.max(PHYS.bounceV, vyIn * 1.02) * (Input.held.jump ? 1.12 : 1);
    this.onGround = false;
    this.jumping = false;
    this.airRolls = 1;
    Parts.burst(this.cx, this.bottom, 6, { col: ['#f2e6c8', '#b02a2c'], speed: 70, g: 300 });
    Sfx.play('bounce');
    Game.squish(this.cx, this.bottom);
  }
  onLand(vy, level) {
    this.landT = vy > 250 ? 0.12 : 0.06;
    if (vy > 160) {
      Parts.dust(this.cx, this.bottom, vy > 280 ? 8 : 4);
      Sfx.play('land', Math.min(1, vy / 330));
    }
    if (vy > 320) Cam.shake(1.5, 0.12);
  }
  inQuicksand(level) {
    return level.rectTileType(this.x + 2, this.y + this.h - 4, this.w - 4, 4, (t) => t === T.QUICK);
  }
  updSafe(dt, level) {
    if (!this.onGround || this.platform) return;
    const gt = this.groundType;
    if (gt !== T.SOLID && gt !== T.ALT && gt !== T.ONEWAY) return;
    // ground under both edges and no spikes adjacent
    const by = Math.floor((this.bottom + 1) / TILE);
    const tl = level.tileAt(Math.floor(this.x / TILE), by), tr = level.tileAt(Math.floor((this.x + this.w - 1) / TILE), by);
    const ok = (t) => t === T.SOLID || t === T.ALT || t === T.ONEWAY;
    if (!ok(tl) || !ok(tr)) return;
    const tx = Math.floor(this.cx / TILE), ty = Math.floor((this.bottom - 1) / TILE);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) if (isSpikeT(level.tileAt(tx + dx, ty + dy))) return;
    this.lastSafe.x = this.x;
    this.lastSafe.y = this.y + this.h - 20;
  }

  tryLedge(level, dir) {
    const fx = dir > 0 ? this.x + this.w + 1 : this.x - 1;
    const tx = Math.floor(fx / TILE);
    // find a ledge top near hand height or near the feet (mantle)
    const handY = this.y + 1;
    const ty = Math.floor((handY + 4) / TILE);
    for (const cand of [ty, ty + 1]) {
      if (!isSolidT(level.tileAt(tx, cand))) continue;
      if (level.tileAt(tx, cand) === T.CRUMBLE) continue;
      if (isSolidT(level.tileAt(tx, cand - 1)) || isSolidT(level.tileAt(tx, cand - 2))) continue;
      const top = cand * TILE;
      // the player's own column must be clear above, to pull up
      if (level.rectSolid(this.x, top - 20, this.w, 20)) continue;
      const feet = this.y + this.h;
      if (feet - top >= 0 && feet - top <= 11 && this.vy > -40) {
        // low ledge: quick mantle straight onto it
        this.startClimb(level, dir, top, true);
        return true;
      }
      if (Math.abs(handY - top) <= 6 && this.vy >= 0) {
        this.hang = { dir, top, tx };
        this.setState('hang');
        this.x = dir > 0 ? tx * TILE - this.w : (tx + 1) * TILE;
        this.y = top - 1;
        this.vx = this.vy = 0;
        this.face = dir;
        this.airRolls = 1;
        Sfx.play('grab');
        return true;
      }
    }
    return false;
  }
  updHang(dt, level) {
    const I = Input;
    const h = this.hang;
    this.vx = this.vy = 0;
    this.coyote = 0;
    if (!isSolidT(level.tileAt(h.tx, Math.floor(h.top / TILE)))) {
      this.setState('normal');
      return;
    }
    const dir = this.dirX();
    if (this.stT > 0.08 && (I.p.jump || I.held.up || (dir === h.dir && this.stT > 0.25)) && !(dir === -h.dir)) {
      this.jumpBuf = 0;
      this.startClimb(level, h.dir, h.top, false);
    } else if (I.p.jump && dir === -h.dir) {
      this.setState('normal');
      this.vx = -h.dir * PHYS.wallJumpX;
      this.vy = -PHYS.wallJumpY * 0.95;
      this.face = -h.dir;
      this.wallLockT = PHYS.wallLock;
      this.jumping = true;
      this.jumpBuf = 0;
      Sfx.play('walljump');
    } else if (I.p.down || (I.p.roll && false)) {
      this.setState('normal');
      this.y += 3;
      this.vy = 40;
      this.wallGrace = 0;
      this.ledgeIgnore = 0.25;
    }
  }
  startClimb(level, dir, top, quick) {
    this.setState('climb');
    this.climb = { x0: this.x, y0: this.y, x1: dir > 0 ? this.x + this.w * 0.9 : this.x - this.w * 0.9, y1: top - 20, dur: quick ? 0.12 : 0.24, dir };
    this.face = dir;
    this.vx = this.vy = 0;
    Sfx.play('climb');
  }
  updClimb(dt, level) {
    const c = this.climb;
    const t = Math.min(1, this.stT / c.dur);
    const ty = lerp(c.y0, c.y1, easeOut(Math.min(1, t * 1.4)));
    const tx = lerp(c.x0, c.x1, easeIn(t));
    this.y = ty;
    this.x = tx;
    if (t >= 1) {
      // settle onto the ledge; nudge if the target spot is blocked
      if (level.rectSolid(this.x, this.y, this.w, this.h)) {
        for (let k = 1; k < 12; k++) {
          if (!level.rectSolid(this.x - c.dir * k, this.y, this.w, this.h)) { this.x -= c.dir * k; break; }
        }
      }
      this.setState('normal');
      this.vx = c.dir * 30;
      this.vy = 0;
      this.onGround = true;
      this.landT = 0.05;
    }
  }

  startRoll(air) {
    this.setState('roll');
    this.rollAir = air;
    this.rollT = air ? PHYS.airRollT : PHYS.rollT;
    const dir = this.dirX() || this.face;
    this.face = dir;
    this.vx = dir * PHYS.rollV * (air ? 1.08 : 1);
    if (air) {
      this.airRolls--;
      this.vy = Math.min(this.vy, -40);
    }
    this.shrink(12);
    this.jumping = false;
    Sfx.play('roll');
    Parts.dust(this.cx, this.bottom, 4, '#e8d6ae', -dir);
  }
  updRoll(dt, level) {
    this.rollT -= dt;
    const air = this.rollAir;
    if (air) this.vy = Math.min(this.vy + PHYS.grav * 0.18 * dt, 60);
    else this.applyGravity(dt);
    if (Math.random() < 0.5) Parts.add({ x: this.cx - this.face * 4, y: this.y + 6, vx: -this.face * 20, life: 0.18, col: air ? '#f2e6c8' : '#cdb894', type: 'puff', s: 1.5, g: 0 });
    this.moveX(level, this.vx * dt);
    const vyB = this.vy;
    this.moveY(level, this.vy * dt);
    this.ridePlatforms(dt, level);
    if (this.hitWall) this.vx = 0;
    if (this.onGround && air && vyB > 60) this.onLand(vyB, level);
    if (this.onGround) this.coyote = PHYS.coyote;
    // jump out of a ground roll keeps a little extra momentum
    if (this.jumpBuf > 0 && (this.onGround || this.coyote > 0) && !level.rectSolid(this.x, this.y - 8, this.w, 8)) {
      if (this.standUp(level)) {
        this.setState('normal');
        this.vx = this.face * PHYS.run * 1.35;
        this.doJump(1);
        return;
      }
    }
    if (Input.p.whip && this.whipCD <= 0) {
      if (this.standUp(level)) {
        this.setState('normal');
        this.startWhip(level);
        return;
      }
    }
    if (this.rollT <= 0) {
      if (this.standUp(level)) {
        this.setState('normal');
        this.rollCD = PHYS.rollCD;
        this.vx = this.face * Math.min(Math.abs(this.vx), PHYS.run * 1.1);
        if (air) this.vy = 0;
      } else {
        // stuck under a low ceiling: keep crawling forward
        this.rollT = 0.05;
        this.vx = this.face * 60;
      }
    }
    if (this.onGround) this.updSafe(dt, level);
  }

  startWhip(level) {
    const I = Input.held;
    // Ring latch takes priority when a ring is in reach.
    if (this.ringCD <= 0 && !I.down) {
      const ring = this.findRing();
      if (ring) return this.startSwing(ring);
    }
    this.whipDir = I.up ? 'up' : I.down && !this.onGround ? 'down' : 'fwd';
    this.whipT = 0;
    this.whipHits.clear();
    this.whipCracked = false;
    Sfx.play('whoosh');
  }
  whipPhase() {
    const t = this.whipT;
    return t < 0.07 ? 0 : t < 0.17 ? 1 : 2;
  }
  whipBox() {
    const R = Game.whipReach();
    const cx = this.cx;
    if (this.whipDir === 'up') return { x: cx - 9, y: this.y - R + 6, w: 18, h: R };
    if (this.whipDir === 'down') return { x: cx - 9, y: this.y + this.h - 6, w: 18, h: R - 8 };
    return { x: this.face > 0 ? cx : cx - R, y: this.y + 1, w: R, h: 13 };
  }
  updWhip(dt, level) {
    this.whipT += dt;
    const ph = this.whipPhase();
    if (ph >= 1 && this.whipT < 0.22) {
      if (!this.whipCracked) {
        this.whipCracked = true;
        Sfx.play('crack');
        const tip = this.whipTip();
        Parts.add({ x: tip.x, y: tip.y, type: 'ring', s: 6, life: 0.18, col: '#fff1b3' });
      }
      const box = this.whipBox();
      let pogo = false;
      for (const e of Game.entities) {
        if (e.dead || !e.whipable || this.whipHits.has(e)) continue;
        const hb = e.hurtBox ? e.hurtBox() : e;
        if (overlap(box, hb)) {
          this.whipHits.add(e);
          const r = e.onWhip(this, this.whipDir);
          if (r !== false && this.whipDir === 'down') pogo = true;
        }
      }
      if (this.whipDir === 'down' && !pogo && level.rectTileType(box.x, box.y, box.w, box.h, (t) => isSpikeT(t))) pogo = true;
      if (pogo && !this.pogoed) {
        this.pogoed = true;
        this.vy = -315;
        this.airRolls = 1;
        this.jumping = false;
        Sfx.play('pogo');
      }
    }
    if (this.whipT >= PHYS.whipT) {
      this.whipT = -1;
      this.pogoed = false;
      this.whipCD = 0.06;
    }
  }
  // Whip tip position for the current frame (world coords).
  whipTip() {
    const R = Game.whipReach();
    const f = this.currentFrame();
    const hx = this.handX(f), hy = this.handY(f);
    const t = clamp((this.whipT - 0.07) / 0.1, 0, 1);
    const ext = easeOut(t) * (R - 4);
    if (this.whipDir === 'up') return { x: hx, y: hy - ext };
    if (this.whipDir === 'down') return { x: hx, y: hy + ext };
    return { x: hx + this.face * ext, y: hy + (1 - t) * -6 };
  }
  handX(f) {
    return this.cx + (f.hand[0] - 12) * this.face + (this.face < 0 ? -1 : 0);
  }
  handY(f) {
    return this.y + this.h - 26 + f.hand[1];
  }

  findRing() {
    let best = null, bd = 1e9;
    const hx = this.cx, hy = this.y + 2;
    for (const r of Game.rings) {
      const dx = r.ax - hx, dy = r.ay - hy;
      if (dy > -8) continue;
      const d = Math.hypot(dx, dy);
      if (d > PHYS.ringRange) continue;
      if (dx * this.face < -40) continue;
      const score = d - (dx * this.face > 0 ? 18 : 0);
      if (score < bd && this.lineClear(hx, hy, r.ax, r.ay)) {
        bd = score;
        best = r;
      }
    }
    return best;
  }
  lineClear(x0, y0, x1, y1) {
    const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 6);
    for (let i = 1; i < n; i++) {
      const t = i / n;
      if (Game.level.isSolidPx(lerp(x0, x1, t), lerp(y0, y1, t))) return false;
    }
    return true;
  }
  startSwing(ring) {
    if (this.h !== 20 && !this.standUp(Game.level)) return;
    this.setState('swing');
    const hx = this.cx, hy = this.y + 2;
    const len = clamp(Math.hypot(ring.ax - hx, ring.ay - hy), 26, 96);
    this.swing = { r: ring, len, px: hx, py: hy, t: 0 };
    // keep momentum, project onto the tangent
    const dx = hx - ring.ax, dy = hy - ring.ay, d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    const radial = this.vx * nx + this.vy * ny;
    this.vx -= radial * nx;
    this.vy -= radial * ny;
    this.whipT = -1;
    this.airRolls = 1;
    this.jumping = false;
    ring.pulse = 1;
    Sfx.play('latch');
    Parts.add({ x: ring.ax, y: ring.ay, type: 'ring', s: 8, life: 0.25, col: '#fff1b3' });
  }
  updSwing(dt, level) {
    const I = Input;
    const s = this.swing;
    s.t += dt;
    const dir = this.dirX();
    const a = s.r;
    // tangential push
    const dx = s.px - a.ax, dy = s.py - a.ay;
    const d = Math.hypot(dx, dy) || 1;
    const tx = -dy / d, ty = dx / d; // tangent
    if (dir) {
      // push along whichever tangent points the way the stick does
      const st = tx >= 0 ? 1 : -1;
      this.vx += tx * st * dir * 620 * dt;
      this.vy += ty * st * dir * 620 * dt;
      this.face = dir;
    }
    if (I.held.up) s.len = Math.max(24, s.len - 55 * dt);
    if (I.held.down) s.len = Math.min(100, s.len + 70 * dt);
    this.vy += PHYS.grav * 0.92 * dt;
    // integrate and constrain
    const ox = s.px, oy = s.py;
    s.px += this.vx * dt;
    s.py += this.vy * dt;
    let ex = s.px - a.ax, ey = s.py - a.ay;
    const el = Math.hypot(ex, ey) || 1;
    if (el > s.len) {
      s.px = a.ax + (ex / el) * s.len;
      s.py = a.ay + (ey / el) * s.len;
      const nx = ex / el, ny = ey / el;
      const rv = this.vx * nx + this.vy * ny;
      if (rv > 0) {
        this.vx -= rv * nx;
        this.vy -= rv * ny;
      }
    }
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > 380) {
      this.vx *= 380 / sp;
      this.vy *= 380 / sp;
    }
    this.vx *= 1 - 0.12 * dt;
    // collide the body against the world
    const nxp = s.px - this.w / 2, nyp = s.py - 2;
    if (level.rectSolid(nxp, nyp, this.w, this.h)) {
      s.px = ox;
      s.py = oy;
      this.vx *= -0.2;
      this.vy *= 0.2;
    } else {
      this.x = nxp;
      this.y = nyp;
    }
    if (Math.abs(this.vx) > 20 && !dir) this.face = sgn(this.vx);
    if (I.p.jump || I.p.whip) {
      this.setState('normal');
      this.vy = Math.min(this.vy - 150, -230);
      this.vx *= 1.12;
      this.jumping = false;
      this.ringCD = 0.22;
      this.swing = null;
      this.jumpBuf = 0;
      Sfx.play('release');
      Parts.burst(this.cx, this.y + 4, 4, { col: '#fff1b3', speed: 40, g: 0 });
    } else if (I.p.down || I.p.roll) {
      this.setState('normal');
      this.ringCD = 0.3;
      this.swing = null;
    }
  }

  hurt(dmg = 1, srcX = null, opts = {}) {
    if (this.invulnerable && !opts.force) return false;
    if (this.state === 'dead') return false;
    this.hp -= dmg;
    Game.stats.hits++;
    Cam.shake(3, 0.25);
    Game.hitstop(0.08);
    Game.flash('#d9482f', 0.18);
    Sfx.play('hurt');
    Parts.burst(this.cx, this.cy, 10, { col: ['#f2e6c8', '#c0392b', '#e8d6ae'], speed: 90 });
    if (navigator.vibrate && Settings.vibrate) navigator.vibrate(60);
    if (this.hp <= 0 && this.feather > 0) {
      this.feather = 0;
      Game.featherUsed = true;
      this.hp = 1;
      Parts.burst(this.cx, this.cy, 24, { col: ['#f4cf62', '#fff1b3', '#3fb5a3'], speed: 120, g: -40, life: 1 });
      Parts.text(this.cx, this.y - 8, 'SIMURGH FEATHER!', PAL.turq2);
      Sfx.play('relic');
    }
    if (this.hp <= 0) {
      this.die();
      return true;
    }
    this.inv = 1.2;
    this.swing = null;
    this.whipT = -1;
    if (this.h !== 20) this.standUp(Game.level);
    this.setState('hurt');
    const away = srcX === null ? -this.face : sgn(this.cx - srcX) || -this.face;
    this.vx = away * 130;
    this.vy = -200;
    return true;
  }
  // Spikes, pits, drowning in sand: hurt and return to the last safe footing.
  hazard(kind) {
    if (this.state === 'dead' || this.state === 'exit' || this.hazardT > 0) return;
    if (DEBUG.god) {
      this.respawnSafe();
      return;
    }
    this.hp -= 1;
    Game.stats.hits++;
    Cam.shake(3, 0.2);
    Game.flash('#d9482f', 0.2);
    Sfx.play(kind === 'pit' ? 'fall' : 'spike');
    Parts.burst(this.cx, this.cy, 10, { col: ['#f2e6c8', '#c0392b'], speed: 90 });
    if (this.hp <= 0 && this.feather > 0) {
      this.feather = 0;
      Game.featherUsed = true;
      this.hp = 1;
      Parts.text(this.cx, this.y - 8, 'SIMURGH FEATHER!', PAL.turq2);
    }
    if (this.hp <= 0) return this.die();
    this.hazardT = 0.5;
    this.setState('frozen');
    this.vx = 0;
    this.vy = kind === 'pit' ? 0 : -120;
    Game.fadeOut(0.25, () => {
      this.respawnSafe();
      Game.fadeIn(0.25);
    });
  }
  respawnSafe() {
    this.x = this.lastSafe.x;
    this.y = this.lastSafe.y;
    this.h = 20;
    this.vx = this.vy = 0;
    this.setState('normal');
    this.inv = 1.0;
    this.hazardT = 0;
    this.swing = null;
    this.whipT = -1;
    for (const s of this.scarf) { s.x = s.px = this.cx; s.y = s.py = this.y + 4; }
    Cam.reset(this.cx, this.cy, Game.level);
  }
  checkHazards(level) {
    if (this.hazardT > 0) this.hazardT -= STEP;
    if (this.state === 'dead' || this.state === 'exit' || this.state === 'frozen' || this.state === 'climb') return;
    if (this.y > level.ph + 24) return this.hazard('pit');
    // spikes: inner boxes so grazing a tile edge is forgiven
    const hit = level.rectTileType(this.x + 2, this.y + 3, this.w - 4, this.h - 3, (t, tx, ty) => {
      if (!isSpikeT(t)) return false;
      const px = tx * TILE, py = ty * TILE;
      let b;
      if (t === T.SPIKE_U) b = { x: px + 1, y: py + 8, w: 14, h: 8 };
      else if (t === T.SPIKE_D) b = { x: px + 1, y: py, w: 14, h: 8 };
      else if (t === T.SPIKE_L) b = { x: px + 8, y: py + 1, w: 8, h: 14 };
      else b = { x: px, y: py + 1, w: 8, h: 14 };
      if (t === T.SPIKE_U && this.vy < -10) return false;
      return overlap({ x: this.x + 2, y: this.y + 3, w: this.w - 4, h: this.h - 3 }, b);
    });
    if (hit) return this.hazard('spike');
    if (this.sink > 2.2) return this.hazard('sand');
  }
  die() {
    this.hp = 0;
    this.setState('dead');
    this.vx = -this.face * 60;
    this.vy = -220;
    this.swing = null;
    this.whipT = -1;
    Game.stats.deaths++;
    Sfx.play('death');
    Game.slowmo(0.4, 0.6);
  }
  updDead(dt, level) {
    this.applyGravity(dt);
    this.vx = approach(this.vx, 0, 200 * dt);
    this.moveX(level, this.vx * dt);
    this.moveY(level, this.vy * dt);
    if (this.stT > 1.6 && !this.deadNotified) {
      this.deadNotified = true;
      Game.onPlayerDeath();
    }
  }
  updHurt(dt, level) {
    this.applyGravity(dt);
    this.vx = approach(this.vx, 0, 300 * dt);
    this.moveX(level, this.vx * dt);
    this.moveY(level, this.vy * dt);
    if (this.stT > 0.28 || (this.onGround && this.stT > 0.12)) this.setState('normal');
  }
  updExit(dt, level) {
    this.applyGravity(dt);
    this.vx = this.face * 40;
    this.moveX(level, this.vx * dt);
    this.moveY(level, this.vy * dt);
  }
  ridePlatforms(dt, level) {
    this.platform = null;
    if (this.vy < 0) return;
    for (const p of Game.platforms) {
      if (this.x + this.w <= p.x + 1 || this.x >= p.x + p.w - 1) continue;
      const feet = this.y + this.h;
      if (feet >= p.y - 1 && feet <= p.y + 6 && (feet - this.vy * dt <= p.y + 2 || this.onGround)) {
        this.y = p.y - this.h;
        this.vy = 0;
        if (!this.onGround && this.state === 'normal') this.onLand(60, level);
        this.onGround = true;
        this.groundType = T.SOLID;
        this.platform = p;
        this.moveX(level, p.dx);
        break;
      }
    }
  }

  updScarf(dt) {
    const f = this.currentFrame();
    const flip = this.face < 0;
    let ax = this.cx + (f.head[0] + 1 - 12) * (flip ? -1 : 1) + (flip ? -1 : 0);
    let ay = this.y + this.h - 26 + f.head[1];
    if (this.state === 'roll') {
      ax = this.cx - this.face * 2;
      ay = this.y + 4;
    }
    const S = this.scarf;
    S[0].x = ax;
    S[0].y = ay;
    const t = Game.time;
    for (let i = 1; i < S.length; i++) {
      const p = S[i];
      const vx = (p.x - p.px) * 0.86, vy = (p.y - p.py) * 0.86;
      p.px = p.x;
      p.py = p.y;
      p.x += vx - this.face * 0.06 - Weather.wind * 0.5 + Math.sin(t * 9 + i * 1.3) * 0.08;
      p.y += vy + 0.09;
    }
    for (let k = 0; k < 3; k++)
      for (let i = 1; i < S.length; i++) {
        const a = S[i - 1], b = S[i];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        const rest = 2.4;
        const m = (d - rest) / d;
        b.x -= dx * m;
        b.y -= dy * m;
      }
  }

  currentFrame() {
    const st = this.state;
    let pose = 'idle0';
    if (st === 'hang') pose = 'hang';
    else if (st === 'climb') pose = this.stT < this.climb.dur * 0.5 ? 'climb0' : 'climb1';
    else if (st === 'swing') {
      const rel = this.vx * this.face;
      pose = rel > 40 ? 'swingF' : rel < -40 ? 'swingB' : 'swingM';
    } else if (st === 'hurt' || (st === 'frozen' && this.hazardT > 0)) pose = 'hurt';
    else if (st === 'dead') pose = 'hurt';
    else if (this.crouch) pose = 'crouch';
    else if (!this.onGround) {
      if (this.wallDir && this.vy > 0) pose = 'wall';
      else pose = this.vy < -30 ? 'jump' : 'fall';
    } else if (this.landT > 0) pose = 'land';
    else if (Math.abs(this.vx) > 12 || st === 'exit') {
      this.runPh += (Math.abs(this.vx) / PHYS.run) * STEP * 13;
      pose = 'run' + (Math.floor(this.runPh) % 8);
    } else pose = Math.floor(this.animT * 1.6) % 2 ? 'idle1' : 'idle0';
    if (this.whipT >= 0) {
      const ph = this.whipPhase();
      const legs = pose.startsWith('run') ? pose : this.onGround ? 'idle0' : this.whipDir === 'down' ? 'jump' : pose === 'wall' ? 'fall' : pose;
      return heroFrame(legs, this.whipDir, ph);
    }
    return heroFrame(pose);
  }

  draw(g, cam) {
    if (this.state === 'dead' && this.stT > 0.5 && this.onGround) {
      heroExtras();
      drawSprite(g, HERO_DEAD_SPR, this.cx - cam.x, this.y + this.h - cam.y, this.face < 0);
      return;
    }
    if (this.inv > 0 && this.state !== 'hurt' && Math.floor(this.inv * 16) % 2 === 0) return;
    const flash = this.state === 'hurt' && this.stT < 0.08;
    // scarf behind the body
    this.drawScarf(g, cam);
    if (this.state === 'roll') {
      heroExtras();
      const q = Math.floor((PHYS.rollT - this.rollT) * 26) % 4;
      const fr = HERO_ROLL_SPR[this.face > 0 ? q : (4 - q) % 4];
      drawSprite(g, fr, this.cx - cam.x, this.y + this.h - cam.y + 1, this.face < 0, flash);
      return;
    }
    if (this.state === 'swing' && this.swing) {
      const s = this.swing;
      const f = this.currentFrame();
      const hx = this.handX(f), hy = this.handY(f);
      this.drawRope(g, cam, hx, hy, s.r.ax, s.r.ay + 4, 0);
    }
    const f = this.currentFrame();
    let oy = 0;
    if (this.state === 'normal' && this.inQuicksand(Game.level)) oy = Math.min(10, this.sink * 5);
    drawSprite(g, f, this.cx - cam.x + (this.face < 0 ? -1 : 0), this.y + this.h - cam.y + oy, this.face < 0, flash);
    if (this.whipT >= 0) this.drawWhip(g, cam, f);
  }
  drawScarf(g, cam) {
    const S = this.scarf;
    for (let i = S.length - 1; i > 0; i--) {
      const a = S[i - 1], b = S[i];
      const w = i < 3 ? 2 : 1;
      pxLine(g, a.x - cam.x, a.y - cam.y + 1, b.x - cam.x, b.y - cam.y + 1, '#6e1820', w);
      pxLine(g, a.x - cam.x, a.y - cam.y, b.x - cam.x, b.y - cam.y, i % 2 ? '#c0392b' : '#a8302a', w);
    }
  }
  drawRope(g, cam, x0, y0, x1, y1, slack) {
    const n = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3));
    let lx = x0, ly = y0;
    for (let i = 1; i <= n; i++) {
      const t = i / n;
      const x = lerp(x0, x1, t), y = lerp(y0, y1, t) + Math.sin(t * Math.PI) * slack;
      pxLine(g, lx - cam.x, ly - cam.y, x - cam.x, y - cam.y, '#3d2416');
      lx = x;
      ly = y;
    }
  }
  drawWhip(g, cam, f) {
    const ph = this.whipPhase();
    const hx = this.handX(f), hy = this.handY(f);
    const R = Game.whipReach();
    const pts = [];
    const n = 12;
    const fc = this.face;
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      let x, y;
      if (ph === 0) {
        // trailing behind, curling
        const k = this.whipT / 0.07;
        if (this.whipDir === 'fwd') {
          x = hx - fc * u * 14 * (0.6 + k * 0.4);
          y = hy - u * 6 + Math.sin(u * 3) * 5 * k;
        } else if (this.whipDir === 'up') {
          x = hx + fc * u * 12;
          y = hy + u * 8;
        } else {
          x = hx - fc * u * 6;
          y = hy - u * 14;
        }
      } else {
        const t = clamp((this.whipT - 0.07) / 0.1, 0, 1);
        const ext = easeOut(t) * (R - 4);
        const droop = ph === 2 ? (this.whipT - 0.17) * 120 : 0;
        const wave = Math.sin(u * Math.PI * 2 - t * 8) * (1 - t) * 4;
        if (this.whipDir === 'fwd') {
          x = hx + fc * u * ext;
          y = hy + wave + u * u * droop - (1 - t) * u * 8;
        } else if (this.whipDir === 'up') {
          x = hx + wave + fc * u * u * droop * 0.5;
          y = hy - u * ext + u * u * droop;
        } else {
          x = hx + wave;
          y = hy + u * ext * 0.85;
        }
      }
      pts.push([x, y]);
    }
    for (let i = 1; i < pts.length; i++) {
      const col = i < 3 ? '#4a2a14' : i % 2 ? '#7a4a24' : '#5e3a1c';
      pxLine(g, pts[i - 1][0] - cam.x, pts[i - 1][1] - cam.y, pts[i][0] - cam.x, pts[i][1] - cam.y, col);
    }
    // handle
    fillR(g, hx - cam.x - 1, hy - cam.y - 1, 2, 2, '#2d1c13');
    if (ph === 1) {
      const [tx, ty] = pts[pts.length - 1];
      g.fillStyle = '#fff1b3';
      g.fillRect(Math.round(tx - cam.x), Math.round(ty - cam.y), 1, 1);
      if (this.whipT < 0.13) {
        g.fillStyle = '#fff8ea';
        g.fillRect(Math.round(tx - cam.x) - 1, Math.round(ty - cam.y), 3, 1);
        g.fillRect(Math.round(tx - cam.x), Math.round(ty - cam.y) - 1, 1, 3);
      }
    }
  }
}

    const W = 30, H = 44, pb = new PixBuf(W, H);
    const tr = C('#7a5232'), trD = C('#4e3220'), trL = C('#a8763e'), out = C('#2a1a0e');
    const fr = C('#4f7a33'), frD = C('#2f4a22'), frL = C('#89ad48'), date = C('#b8622c');
    let x = 15;
    for (let y = H - 1; y > 14; y--) {
      const lean = Math.round(Math.sin((H - y) / 30) * 3);
      const cx = x + lean;
      pb.set(cx - 2, y, out);
      pb.set(cx + 2, y, out);
      pb.set(cx - 1, y, (y % 3 === 0) ? trD : trL);
      pb.set(cx, y, (y % 3 === 0) ? trD : tr);
      pb.set(cx + 1, y, trD);
    }
    const topX = 15 + Math.round(Math.sin((H - 15) / 30) * 3), topY = 14;
    for (let k = 0; k < 8; k++) {
      const a = Math.PI + (k / 7) * Math.PI;
      const len = 12 + (k % 2) * 2;
      for (let i = 0; i < len; i++) {
        const u = i / len;
        const fx = topX + Math.cos(a) * i * 1.05, fy = topY + Math.sin(a) * i * 0.55 + u * u * 9;
        pb.set(fx, fy + 1, out);
        pb.set(fx, fy, u < 0.5 ? frL : fr);
        if (i % 2 === 0 && u > 0.2) pb.set(fx, fy + 2, frD);
      }
    }
    for (const [dx, dy] of [[-2, 2], [-1, 3], [1, 3], [2, 2], [0, 4]]) pb.set(topX + dx, topY + dy, date);
    ART.palm = new Sprite(pb.toCanvas(), 15, H);
  })();
  // Bedouin tent: striped goat-hair cloth on poles, guy ropes, a rug at the door.
  (function tent() {
    const W = 40, H = 22, pb = new PixBuf(W, H);
    const k = C('#1c120d'), dark = C('#3a2a22'), mid = C('#5a4030'), cream = C('#d8c49a'), rope = C('#c9b080'), rugR = C('#b02a2c'), rugY = C('#dea12a');
    for (let x = 2; x < W - 2; x++) {
      const t = Math.abs(x - W / 2) / (W / 2 - 2);
      const top = Math.round(3 + t * t * 9);
      for (let y = top; y < H - 1; y++) {
        let col = Math.floor(x / 3) % 4 === 0 ? cream : (y + x) % 7 === 0 ? mid : dark;
        if (y === top) col = k;
        if (x > W / 2 - 5 && x < W / 2 + 4 && y > H - 10) col = C('#120a06');
        pb.set(x, y, col);
      }
    }
    for (const px of [W / 2 - 1, 4, W - 5]) for (let y = 1; y < H; y++) if (px === W / 2 - 1 || y > 10) pb.set(px, y, C('#6b4024'));
    for (let i = 0; i < 6; i++) {
      pb.set(1 - i * 0.2, 12 + i * 1.6, rope);
      pb.set(W - 2 + i * 0.2, 12 + i * 1.6, rope);
    }
    for (let x = W / 2 - 7; x < W / 2 + 7; x++) pb.set(x, H - 1, (x % 2) ? rugR : rugY);
    ART.tent = new Sprite(pb.toCanvas(), W >> 1, H);
  })();
})();

// Procedural flame drawn upward from (x, y); size ~ height in pixels.
function drawFlame(g, x, y, size, t, seed = 0) {
  x = Math.round(x);
  y = Math.round(y);
  const h = size;
  for (let i = 0; i < h; i++) {
    const u = i / h;
    const w = Math.max(0, Math.round((1 - u) * (size * 0.38) * (0.8 + 0.2 * Math.sin(t * 13 + i + seed))));
    const off = Math.round(Math.sin(t * 9 + i * 0.7 + seed) * u * 1.6);
    const col = u < 0.25 ? '#fff3b8' : u < 0.5 ? '#ffc444' : u < 0.78 ? '#f07a22' : '#c8401a';
    if (w <= 0 && u > 0.6) continue;
    g.fillStyle = col;
    g.fillRect(x - w + off, y - i, w * 2 + 1, 1);
  }
  g.fillStyle = '#fff8ea';
  g.fillRect(x, y - 1, 1, 1);
}

// ==== 10_entities.js ====
// ANDOR :: entities: pickups, interactables, traps, projectiles.

class Entity extends Body {
  constructor(x, y, w, h) {
    super(x, y, w, h);
    this.dead = false;
    this.whipable = false;
    this.t = rnd(10);
    this.face = 1;
    this.flashT = 0;
    this.layer = 1; // 0 behind other entities, 2 in front
  }
  get player() {
    return Game.player;
  }
  touchesPlayer(pad = 0) {
    const p = Game.player;
    return p && p.state !== 'dead' && p.x < this.x + this.w + pad && p.x + p.w > this.x - pad && p.y < this.y + this.h + pad && p.y + p.h > this.y - pad;
  }
  onScreen(m = 32) {
    return this.x + this.w > Cam.x - m && this.x < Cam.x + Screen.vw + m && this.y + this.h > Cam.y - m && this.y < Cam.y + Screen.vh + m;
  }
  update(dt, level) {}
  draw(g, cam) {}
  onWhip(p, dir) {
    return false;
  }
}

// --- Pickups ----------------------------------------------------------------
class Coin extends Entity {
  constructor(x, y, value = 1, loose = false, id = null) {
    super(x - 3, y - 3, 7, 7);
    this.value = value;
    this.loose = loose;
    this.id = id;
    this.life = loose ? 9 : Infinity;
    if (loose) {
      this.vx = rnd(-60, 60);
      this.vy = rnd(-180, -100);
    }
    this.magnet = false;
  }
  update(dt, level) {
    this.t += dt;
    const p = this.player;
    if (this.loose) {
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
      if (!this.magnet) {
        this.vy = Math.min(300, this.vy + 700 * dt);
        this.moveX(level, this.vx * dt);
        if (this.hitWall) this.vx *= -0.5;
        const vy = this.vy;
        this.moveY(level, this.vy * dt);
        if (this.onGround) {
          this.vy = vy > 80 ? -vy * 0.45 : 0;
          this.vx *= 0.7;
          if (vy > 80) Sfx.play('tink', 0.4);
        }
      }
    }
    if (p && p.state !== 'dead') {
      const d = dist(p.cx, p.cy, this.cx, this.cy);
      const range = 30 + (Game.upgrades().magnet ? 34 : 0);
      if (d < range && (!this.loose || this.t > 0.35)) this.magnet = true;
      if (this.magnet) {
        const sp = 220 + (range - Math.min(range, d)) * 6;
        this.x += ((p.cx - this.cx) / (d || 1)) * sp * dt;
        this.y += ((p.cy - this.cy) / (d || 1)) * sp * dt;
      }
      if (overlap(this, p)) this.collect();
    }
  }
  collect() {
    this.dead = true;
    Game.addCoins(this.value);
    if (this.id !== null) Game.collected.add(this.id);
    Sfx.play(this.value > 1 ? 'gem' : 'coin');
    Parts.burst(this.cx, this.cy, this.value > 1 ? 10 : 5, { col: this.value > 1 ? ['#a8ffc8', '#25b56a', '#fff'] : ['#fff1b3', '#f4cf62'], speed: 50, g: 0, life: 0.35 });
    if (this.value > 1) Parts.text(this.cx, this.y - 4, '+' + this.value, PAL.emer2);
  }
  draw(g, cam) {
    if (this.loose && this.life < 2 && Math.floor(this.life * 10) % 2) return;
    const bob = this.loose ? 0 : Math.round(Math.sin(this.t * 3) * 1.5);
    if (this.value > 1) {
      drawSprite(g, this.value >= 25 ? ART.ruby : ART.gem, this.cx - cam.x, this.y + 7 - cam.y + bob);
      if (Math.sin(this.t * 4) > 0.9) fillR(g, this.x + 1 - cam.x, this.y - cam.y + bob, 1, 1, '#fff');
      return;
    }
    const fr = [0, 1, 2, 3, 2, 1][Math.floor(this.t * 9) % 6];
    drawSprite(g, ART.coin[fr], this.cx - cam.x, this.y + 7 - cam.y + bob, this.t * 9 % 12 > 6);
  }
}

class Pomegranate extends Entity {
  constructor(x, y, loose = false, id = null) {
    super(x - 4, y - 5, 9, 9);
    this.id = id;
    this.loose = loose;
    if (loose) this.vy = -150;
  }
  update(dt, level) {
    this.t += dt;
    if (this.loose) {
      this.vy = Math.min(300, this.vy + 700 * dt);
      this.moveY(level, this.vy * dt);
    }
    const p = this.player;
    if (p && p.state !== 'dead' && overlap(this, p) && p.hp < p.maxHp) {
      p.hp = Math.min(p.maxHp, p.hp + 1);
      this.dead = true;
      if (this.id !== null) Game.collected.add(this.id);
      Sfx.play('heal');
      Parts.burst(this.cx, this.cy, 12, { col: ['#d9443a', '#ffd0c0', '#5a8a3a'], speed: 60, g: -20 });
      Parts.text(this.cx, this.y - 4, '+1', '#ff9a8a');
      Game.hud.pulse = 1;
    }
  }
  draw(g, cam) {
    const bob = this.loose ? 0 : Math.round(Math.sin(this.t * 2.5) * 1.5);
    drawSprite(g, ART.pomegranate, this.cx - cam.x, this.y + 9 - cam.y + bob);
  }
}

class Relic extends Entity {
  constructor(x, y, idx) {
    super(x - 5, y - 6, 11, 11);
    this.idx = idx;
  }
  update(dt, level) {
    this.t += dt;
    if (Math.random() < dt * 6) Parts.add({ x: this.cx + rnd(-7, 7), y: this.cy + rnd(-7, 7), vy: -12, life: 0.6, col: pick(['#fff1b3', '#f4cf62', '#fff']), g: 0 });
    if (this.touchesPlayer()) {
      this.dead = true;
      Game.onRelic(this);
    }
  }
  draw(g, cam) {
    if (this.idol) {
      const px = Math.round(this.cx - cam.x), py = Math.round(this.y + 11 - cam.y);
      fillR(g, px - 7, py + 1, 14, 4, '#1c140e');
      fillR(g, px - 6, py + 1, 12, 3, '#9c8b6a');
      fillR(g, px - 6, py + 1, 12, 1, '#d8c8a6');
    }
    const bob = this.idol ? 0 : Math.round(Math.sin(this.t * 2) * 2);
    g.globalAlpha = 0.35 + 0.15 * Math.sin(this.t * 3);
    g.drawImage(lightStamp(14, '#f4cf62', 3), Math.round(this.cx - cam.x - 14), Math.round(this.cy - cam.y - 14 + bob));
    g.globalAlpha = 1;
    drawSprite(g, ART.relics[Game.level.theme.name], this.cx - cam.x, this.y + 11 - cam.y + bob);
  }
  light() {
    Lighting.add(this.cx, this.cy, 34, '#f4cf62', 0.8);
  }
}

class Scroll extends Entity {
  constructor(x, y, idx) {
    super(x - 4, y - 3, 9, 6);
    this.idx = idx;
  }
  update(dt) {
    this.t += dt;
    if (this.touchesPlayer(2)) {
      this.dead = true;
      Game.onScroll(this.idx);
    }
  }
  draw(g, cam) {
    const bob = Math.round(Math.sin(this.t * 2.2) * 1.5);
    drawSprite(g, ART.scroll, this.cx - cam.x, this.y + 6 - cam.y + bob);
    if (Math.sin(this.t * 5) > 0.7) fillR(g, this.x + 7 - cam.x, this.y - 2 - cam.y + bob, 1, 1, '#fff8ea');
  }
}

class Checkpoint extends Entity {
  constructor(x, y, idx) {
    super(x + 2, y + 2, 12, 14);
    this.idx = idx;
    this.lit = false;
    this.layer = 0;
  }
  update(dt) {
    this.t += dt;
    if (!this.lit && this.touchesPlayer(4)) this.ignite(true);
    if (this.lit && Math.random() < dt * 10) Parts.add({ x: this.cx + rnd(-3, 3), y: this.y - 6, vx: rnd(-8, 8), vy: rnd(-40, -20), life: rnd(0.4, 0.9), col: pick(['#ffc444', '#f07a22', '#fff3b8']), g: -10, s: 1 });
  }
  ignite(fx) {
    this.lit = true;
    Game.setCheckpoint(this);
    if (fx) {
      const p = this.player;
      p.hp = Math.max(p.hp, p.maxHp);
      Game.hud.pulse = 1;
      Sfx.play('checkpoint');
      Parts.burst(this.cx, this.y - 4, 22, { col: ['#ffc444', '#f07a22', '#fff3b8'], speed: 90, g: -60, life: 0.8 });
      Parts.add({ x: this.cx, y: this.y - 4, type: 'ring', s: 22, life: 0.5, col: '#ffc444' });
      Game.banner('THE FLAME REMEMBERS YOU', 1.6);
    }
  }
  draw(g, cam) {
    const x = this.cx - cam.x, y = this.y + 14 - cam.y;
    drawSprite(g, ART.brazier, x, y + 2);
    if (this.lit) {
      drawFlame(g, x, y - 7, 11, this.t, this.idx);
      drawFlame(g, x - 3, y - 7, 6, this.t * 1.3, 2);
      drawFlame(g, x + 3, y - 7, 7, this.t * 1.1, 5);
    } else {
      fillR(g, x - 3, y - 8, 7, 1, '#3a2a1a');
      if (Math.sin(this.t * 2) > 0.6) fillR(g, x, y - 9, 1, 1, '#c8401a');
    }
  }
  light() {
    if (this.lit) Lighting.add(this.cx, this.y - 6, 70 + Math.sin(this.t * 11) * 3, '#ffb34a', 1);
    else Lighting.add(this.cx, this.y, 16, null, 0.5);
  }
}

class Exit extends Entity {
  constructor(x, y) {
    super(x - 8, y - 16, 32, 32);
    this.layer = 0;
    this.used = false;
  }
  update(dt) {
    this.t += dt;
    const p = this.player;
    if (!this.used && p && p.state === 'normal' && overlap({ x: this.x + 10, y: this.y, w: 12, h: 32 }, p)) {
      this.used = true;
      Game.onExit(this);
    }
    if (Math.random() < dt * 8) Parts.add({ x: this.x + 8 + rnd(16), y: this.y + 30, vy: rnd(-30, -12), vx: rnd(-4, 4), life: rnd(0.6, 1.2), col: pick(['#fff1b3', '#f4cf62']), g: 0 });
  }
  draw(g, cam) {
    const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y);
    const th = Game.level.theme.name;
    const frame = th === 'andor' ? '#a86d16' : th === 'tomb' ? '#9c8b6a' : th === 'desert' ? '#a8693a' : '#c99659';
    const frameD = th === 'andor' ? '#6e3f10' : th === 'tomb' ? '#6b5d48' : th === 'desert' ? '#6e4024' : '#8d5c30';
    const glow = th === 'andor' ? '#79f0a5' : '#fff1b3';
    // pointed arch frame
    for (let yy = 0; yy < 32; yy++) {
      const t = yy / 32;
      const half = t > 0.4 ? 13 : 13 * Math.sqrt(Math.max(0, 1 - Math.pow((0.4 - t) / 0.42, 2)));
      const hw = Math.round(half);
      fillR(g, x + 16 - hw - 3, y + yy, 3, 1, frame);
      fillR(g, x + 16 + hw, y + yy, 3, 1, frameD);
      g.globalAlpha = 0.55 + 0.25 * Math.sin(this.t * 3 + yy * 0.2);
      fillR(g, x + 16 - hw, y + yy, hw * 2, 1, yy % 3 === 0 ? glow : th === 'andor' ? '#25b56a' : '#f4cf62');
      g.globalAlpha = 1;
    }
    fillR(g, x + 13, y - 3, 6, 3, frame);
    fillR(g, x + 15, y - 5, 2, 2, PAL.gold2);
  }
  light() {
    Lighting.add(this.cx, this.cy, 64, Game.level.theme.name === 'andor' ? '#79f0a5' : '#fff1b3', 1);
  }
}

class Ring extends Entity {
  constructor(x, y) {
    super(x - 4, y - 4, 9, 9);
    this.ax = x;
    this.ay = y;
    this.layer = 0;
    this.pulse = 0;
    this.inRange = false;
  }
  update(dt) {
    this.t += dt;
    this.pulse = Math.max(0, this.pulse - dt * 2);
    const p = this.player;
    this.inRange = false;
    if (p && p.state !== 'swing') {
      const dx = this.ax - p.cx, dy = this.ay - (p.y + 2);
      this.inRange = dy < -8 && Math.hypot(dx, dy) < PHYS.ringRange && dx * p.face > -40;
    }
  }
  draw(g, cam) {
    const x = this.cx - cam.x, y = this.y - cam.y;
    // bracket into the ceiling or a beam
    drawSprite(g, ART.ring, x, y + 4);
    if (this.inRange) {
      const a = 0.5 + 0.5 * Math.sin(this.t * 8);
      g.globalAlpha = 0.6 * a;
      pxRing(g, x, y + 6, 7 + a * 2, '#fff1b3');
      g.globalAlpha = 1;
    }
    if (this.pulse > 0) {
      g.globalAlpha = this.pulse;

class Pot extends Entity {
  constructor(x, y, id) {
    super(x + 3, y + 5, 10, 11);
    this.whipable = true;
    this.id = id;
    this.layer = 0;
  }
  onWhip(p) {
    this.smash();
    return true;
  }
  smash() {
    this.dead = true;
    if (this.id !== null) Game.collected.add(this.id);
    Sfx.play('pot');
    const th = Game.level.theme.name;
    const cols = th === 'bazaar' ? ['#3fb5a3', '#1f6a60', '#dea12a'] : th === 'tomb' ? ['#e8dcc0', '#b8aa88', '#dea12a'] : th === 'andor' ? ['#dea12a', '#a86d16', '#79f0a5'] : ['#c47a42', '#8a4a26'];
    Parts.burst(this.cx, this.cy, 14, { col: cols, speed: 110, g: 500, life: 0.7, s: 2 });
    const r = hash2(this.id || 0, 7, 3);
    if (r < 0.18) Game.spawn(new Pomegranate(this.cx, this.cy, true));
    else {
      const n = r > 0.85 ? 1 : 3 + Math.floor(r * 3);
      if (r > 0.85) Game.spawn(new Coin(this.cx, this.cy, 10, true));

}

class Lever extends Entity {
