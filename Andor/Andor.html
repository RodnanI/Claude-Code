"use strict";
// ==== 00_core.js ====
// ANDOR :: core utilities, palette, random, pixel buffers.

const TAU = Math.PI * 2;
const TILE = 16;
const STEP = 1 / 60;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const sgn = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const easeOut = (t) => 1 - (1 - t) * (1 - t) * (1 - t);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const smooth = (t) => t * t * (3 - 2 * t);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const now = () => performance.now() / 1000;

// Deterministic generator for anything that must look the same every run.
function makeRng(seed) {
  let s = seed >>> 0 || 1;
  const f = () => {
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.range = (a, b) => a + f() * (b - a);
  f.int = (a, b) => Math.floor(a + f() * (b - a + 1));
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.chance = (p) => f() < p;
  return f;
}

// Integer hash -> [0,1). Used for stable per-tile variation.
function hash2(x, y, seed = 0) {
  let h = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// Smooth value noise (stable, seeded) for textures and terrain.
function vnoise(x, y, seed = 0) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash2(xi, yi, seed), b = hash2(xi + 1, yi, seed);
  const c = hash2(xi, yi + 1, seed), d = hash2(xi + 1, yi + 1, seed);
  const u = smooth(xf), v = smooth(yf);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, seed = 0, oct = 3) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    s += vnoise(x * f, y * f, seed + i * 17) * amp;
    norm += amp;
    amp *= 0.5;
    f *= 2;
  }
  return s / norm;
}

// 4x4 ordered dither thresholds in [0,1).
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];

// ---------------------------------------------------------------------------
// Palette. Warm, dusty, cinematic: ochre and umber against Persian turquoise,
// gold leaf and lamp-black. Night skies are ink-teal, never purple.
const PAL = {
  ink: '#0e0907', ink2: '#1c120d', umber: '#2d1c13', bark: '#45291a', leather: '#64391f', tan: '#8b5a34',
  clay: '#b07743', ochre: '#d09a55', sand: '#e6bd7c', sand2: '#f2d7a2', cream: '#f9edd2', white: '#fff8ea',
  blood: '#4f1015', wine: '#7e1b23', crimson: '#b02a2c', vermil: '#d9482f', coral: '#ef7d52', peach: '#f6ad7b',
  bronze: '#6e3f10', brass: '#a86d16', gold: '#dea12a', gold2: '#f4cf62', gold3: '#fff1b3',
  teal0: '#0a1a1d', teal1: '#11313a', teal2: '#1b5157', teal3: '#2a807c', turq: '#3fb5a3', turq2: '#8de0c8',
  lapis0: '#101a33', lapis: '#22396e', lapis2: '#3b62a8',
  moss0: '#18220f', moss: '#2f4a22', leaf: '#4f7a33', leaf2: '#89ad48', emer0: '#0d3a26', emerald: '#25b56a', emer2: '#79f0a5',
  stone0: '#231e1a', stone1: '#3f3730', stone2: '#62574b', stone3: '#8f8170', stone4: '#bcab92', stone5: '#e1d2b5',
  skin0: '#4d2817', skin1: '#80462a', skin2: '#bd7a4c', skin3: '#dfa271',
  night0: '#060c0e', night1: '#0b181c', night2: '#122a2f', night3: '#1d3f43',
  fire0: '#7a1d0c', fire1: '#c8401a', fire2: '#f07a22', fire3: '#ffc444', fire4: '#fff3b8',

// ---------------------------------------------------------------------------
// Colour helpers. Colours travel as '#rrggbb' strings or packed ABGR ints.
const _hexCache = new Map();
function hexToRgb(hex) {
  let v = _hexCache.get(hex);
  if (v) return v;
  const h = hex.charAt(0) === '#' ? hex.slice(1) : hex;
  v = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  _hexCache.set(hex, v);
  return v;
}
const packRgb = (r, g, b, a = 255) => ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;
const C = (hex, a = 255) => {
  const [r, g, b] = hexToRgb(hex);
  return packRgb(r, g, b, a);
};
function mixHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  const r = Math.round(lerp(A[0], B[0], t)), g = Math.round(lerp(A[1], B[1], t)), bl = Math.round(lerp(A[2], B[2], t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
const rgba = (hex, a) => {
  const [r, g, b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
};

// ---------------------------------------------------------------------------
// PixBuf: a CPU pixel buffer for procedural art (tiles, skies, props).
class PixBuf {
  constructor(w, h) {
    this.w = w;
    this.h = h;
    this.img = new ImageData(w, h);
    this.d = new Uint32Array(this.img.data.buffer);
  }
  inb(x, y) {
    return x >= 0 && y >= 0 && x < this.w && y < this.h;
  }
  set(x, y, c) {
    x |= 0;
    y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    this.d[y * this.w + x] = c;
  }
  get(x, y) {
    x |= 0;
    y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return 0;
    return this.d[y * this.w + x];
  }
  // Alpha-blend packed colour c onto the pixel with weight a (0..1).
  blend(x, y, c, a) {
    x |= 0;
    y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h || a <= 0) return;
    const i = y * this.w + x, o = this.d[i];
    if (a >= 1 || (o >>> 24) === 0) {
      this.d[i] = a >= 1 ? c : ((Math.round(a * 255) << 24) | (c & 0xffffff)) >>> 0;
      return;
    }
    const r = (o & 255) + ((c & 255) - (o & 255)) * a;
    const g = ((o >> 8) & 255) + (((c >> 8) & 255) - ((o >> 8) & 255)) * a;
    const b = ((o >> 16) & 255) + (((c >> 16) & 255) - ((o >> 16) & 255)) * a;
    this.d[i] = packRgb(r | 0, g | 0, b | 0, 255);
  }
  rect(x, y, w, h, c) {
    const x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0);
    const x1 = Math.min(this.w, (x + w) | 0), y1 = Math.min(this.h, (y + h) | 0);
    for (let yy = y0; yy < y1; yy++) this.d.fill(c, yy * this.w + x0, yy * this.w + x1);
  }
  hline(x0, x1, y, c) {
    if (x1 < x0) [x0, x1] = [x1, x0];
    this.rect(x0, y, x1 - x0 + 1, 1, c);
  }
  vline(x, y0, y1, c) {
    if (y1 < y0) [y0, y1] = [y1, y0];
    for (let y = y0; y <= y1; y++) this.set(x, y, c);
  }
  line(x0, y0, x1, y1, c) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      this.set(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  disc(cx, cy, r, c) {
    const r2 = r * r;
    for (let y = -Math.ceil(r); y <= Math.ceil(r); y++)
      for (let x = -Math.ceil(r); x <= Math.ceil(r); x++) if (x * x + y * y <= r2 + r * 0.6) this.set(cx + x, cy + y, c);
  }
  ellipse(cx, cy, rx, ry, c) {
    for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++)
      for (let x = -Math.ceil(rx); x <= Math.ceil(rx); x++)
        if ((x * x) / (rx * rx + 0.3) + (y * y) / (ry * ry + 0.3) <= 1) this.set(cx + x, cy + y, c);
  }
  // Fill rows with a dithered blend through a list of hex colour stops.
  vgrad(x, y, w, h, stops) {
    const cols = stops.map((s) => C(s));
    const n = cols.length - 1;
    for (let yy = 0; yy < h; yy++) {
      const t = (yy / Math.max(1, h - 1)) * n;
      const i = Math.min(n - 1, Math.floor(t));
      const f = t - i;
      for (let xx = 0; xx < w; xx++) {
        const px = x + xx, py = y + yy;
        this.set(px, py, f > bayer(px, py) ? cols[i + 1] : cols[i]);
      }
    }
  }
  // Copy a canvas/sprite into this buffer (alpha-tested).
  stamp(src, dx, dy, flip = false) {
    const s = src._pix || (src._pix = canvasPixels(src));
    for (let y = 0; y < s.h; y++)
      for (let x = 0; x < s.w; x++) {
        const c = s.d[y * s.w + (flip ? s.w - 1 - x : x)];
        if (c >>> 24 > 127) this.set(dx + x, dy + y, c);
      }
  }
  toCanvas(cv) {
    cv = cv || makeCanvas(this.w, this.h);
    cv.getContext('2d').putImageData(this.img, 0, 0);
    return cv;
  }
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0);
  c.height = Math.max(1, h | 0);
  return c;
}
function canvasPixels(cv) {
  const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height);
  return { w: cv.width, h: cv.height, d: new Uint32Array(d.data.buffer) };
}

// ---------------------------------------------------------------------------
// Tiny event bus for decoupled systems (audio cues, achievements, UI).
const Bus = {
  m: new Map(),
  on(ev, fn) {
    if (!this.m.has(ev)) this.m.set(ev, []);
    this.m.get(ev).push(fn);
  },
  emit(ev, a, b, c) {
    const l = this.m.get(ev);
    if (l) for (const fn of l) fn(a, b, c);
  },
};

// Persistent storage wrapper that never throws.
const Store = {
  get(k, def) {
    try {
      const v = localStorage.getItem(k);
      return v == null ? def : JSON.parse(v);
    } catch (e) {
      return def;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(k, JSON.stringify(v));
    } catch (e) {}
  },
};

// Debug flags from the URL hash, e.g. #level=2&god
const DEBUG = (() => {
  const o = {};
  (location.hash || '').replace(/^#/, '').split('&').forEach((kv) => {
    if (!kv) return;
    const [k, v] = kv.split('=');

// ==== 01_gfx.js ====
// ANDOR :: display, sprites, bitmap font, drawing primitives.

const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });

// Screen: the main canvas (W x H game pixels) holds the game view rect and,
// in portrait touch mode, a control deck underneath it like a handheld.
const Screen = { W: 320, H: 200, S: 1, dpr: 1, vx: 0, vy: 0, vw: 320, vh: 200, portrait: false, split: false, cssW: 0, cssH: 0, left: 0, top: 0 };
const VC = makeCanvas(320, 200);
const vctx = VC.getContext('2d');

function resizeScreen(touchMode) {
  const dpr = window.devicePixelRatio || 1;
  const cw = window.innerWidth, ch = window.innerHeight;
  const devW = Math.round(cw * dpr), devH = Math.round(ch * dpr);
  const portrait = !!touchMode && ch > cw * 1.08;
  let S, W, H;
  if (portrait) {
    S = Math.max(1, Math.round(devW / 204));
    W = Math.ceil(devW / S);
    H = Math.ceil(devH / S);
  } else {
    S = Math.max(1, Math.round(devH / 204));
    if (devW / S < 250) S = Math.max(1, Math.floor(devW / 250));
    W = Math.min(480, Math.ceil(devW / S));
    H = Math.min(280, Math.ceil(devH / S));
  }
  Object.assign(Screen, { W, H, S, dpr, portrait });
  if (portrait && Screen.split) {
    // handheld layout during play: game view on top, control deck below
    Screen.vx = 0;
    Screen.vy = 0;
    Screen.vw = W;
    Screen.vh = clamp(Math.round(W * 0.92), 150, H - 150);
  } else {
    Screen.vx = 0;
    Screen.vy = 0;
    Screen.vw = W;
    Screen.vh = H;
  }
  cv.width = W;
  cv.height = H;
  if (VC.width !== Screen.vw || VC.height !== Screen.vh) {
    VC.width = Screen.vw;
    VC.height = Screen.vh;
  }
  Screen.cssW = (W * S) / dpr;
  Screen.cssH = (H * S) / dpr;
  Screen.left = Math.round((cw - Screen.cssW) / 2);
  Screen.top = portrait ? 0 : Math.round((ch - Screen.cssH) / 2);
  cv.style.width = Screen.cssW + 'px';
  cv.style.height = Screen.cssH + 'px';
  cv.style.left = Screen.left + 'px';
  cv.style.top = Screen.top + 'px';
  ctx.imageSmoothingEnabled = false;
  vctx.imageSmoothingEnabled = false;
}

// Convert a client (CSS) point to main-canvas pixels.
function clientToScreen(x, y) {
  return { x: ((x - Screen.left) / Screen.cssW) * Screen.W, y: ((y - Screen.top) / Screen.cssH) * Screen.H };
}

// ---------------------------------------------------------------------------
// Sprites from text rows. '.' or ' ' is transparent; other chars map through pal.
function spriteFromRows(rows, pal) {
  const h = rows.length;
  let w = 0;
  for (const r of rows) w = Math.max(w, r.length);
  const pb = new PixBuf(w, h);
  for (let y = 0; y < h; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      const ch = r[x];
      if (ch === '.' || ch === ' ') continue;
      const col = pal[ch];
      if (!col) continue;
      pb.set(x, y, C(col));
    }
  }
  return pb.toCanvas();
}

function flipCanvas(src) {
  const c = makeCanvas(src.width, src.height);
  const x = c.getContext('2d');
  x.translate(src.width, 0);
  x.scale(-1, 1);
  x.drawImage(src, 0, 0);
  return c;
}
function tintCanvas(src, col) {
  const c = makeCanvas(src.width, src.height);
  const x = c.getContext('2d');
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = col;
  x.fillRect(0, 0, c.width, c.height);
  return c;
}

// A sprite bundles the canvas with lazily-built flipped and flash variants.
class Sprite {
  constructor(canvas, ax = 0, ay = 0) {
    this.c = canvas;
    this.w = canvas.width;
    this.h = canvas.height;
    this.ax = ax; // anchor (pixels from left)
    this.ay = ay; // anchor (pixels from top)
    this._f = null;
    this._wh = null;
    this._whf = null;
  }
  get f() {
    return this._f || (this._f = flipCanvas(this.c));
  }
  get wh() {
    return this._wh || (this._wh = tintCanvas(this.c, '#fff8ea'));
  }
  get whf() {
    return this._whf || (this._whf = flipCanvas(this.wh));
  }
}
function mkSprite(rows, pal, ax, ay) {
  const c = spriteFromRows(rows, pal);
  return new Sprite(c, ax === undefined ? c.width >> 1 : ax, ay === undefined ? c.height : ay);
}

// Draw sprite with its anchor at (x, y). flip mirrors around the anchor.
function drawSprite(g, s, x, y, flip = false, flash = false) {
  if (!s) return;
  const img = flash ? (flip ? s.whf : s.wh) : flip ? s.f : s.c;
  const ax = flip ? s.w - s.ax : s.ax;
  g.drawImage(img, Math.round(x - ax), Math.round(y - s.ay));
}

  if (d > m) {
    dx *= m / d;
    dy *= m / d;
    d = m;

  d = Math.max(d, 0.6);
  const a = Math.atan2(dy, dx);
  const ang = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));

function rigCanvas(skin, p) {
  const W = skin.w, H = skin.h, pal = skin.pal, L = skin.L;
  const pb = new PixBuf(W, H);
  const bx = (W >> 1) - 4 + (p.dx || 0), by = H - 14 + (p.dy || 0);
  const shN = [bx + 5, by + 1], shF = [bx + 3, by + 1];
  const hipN = [bx + 5, by + 5], hipF = [bx + 3, by + 5];
  const col = (k) => pal[k];
  const arm = (sx, sy, ang, far) => {
    const lb = new Limb(W, H);
    const ex = sx + Math.sin(ang[0]) * 3, ey = sy + Math.cos(ang[0]) * 3;
    const hx = ex + Math.sin(ang[1]) * 3, hy = ey + Math.cos(ang[1]) * 3;
    lb.seg(sx, sy, ex, ey, 2, col(far ? L.slF : L.sl));
    lb.seg(ex, ey, hx, hy, 2, col(far ? L.slF : L.sl));
    lb.seg(hx, hy, hx + Math.sin(ang[1]), hy + Math.cos(ang[1]), 2, col(far ? L.hdF : L.hd));
    lb.compose(pb, col(L.out));
    return [Math.round(hx + Math.sin(ang[1])), Math.round(hy + Math.cos(ang[1])), ang[1]];
  };
  const leg = (hx, hy, foot, far) => {
    const lb = new Limb(W, H);
    const [kx, ky, ax, ay] = _ik(hx, hy, hx + foot[0], hy + foot[1], 4, 3.2);
    const tr = col(far ? L.trF : L.tr), bt = col(far ? L.btF : L.bt);
    lb.seg(hx, hy, kx, ky, 3, tr);
    const mx = lerp(kx, ax, 0.35), my = lerp(ky, ay, 0.35);
    lb.seg(kx, ky, mx, my, 2, tr);
    lb.seg(mx, my, ax, ay, 2, bt);
    let sx = ax - kx, sy = ay - ky;
    const sl = Math.hypot(sx, sy) || 1;
    sx /= sl;
    sy /= sl;
    let fx = sy, fy = -sx;
    if (fx < 0.2) {
      fx = 0.2;
      fy = 0.98;
    }
    lb.seg(ax, ay, ax + fx * 2.2, ay + fy * 2.2, 2, bt);
    lb.compose(pb, col(L.out));
  };
  const handF = arm(shF[0], shF[1], p.armF, true);
  if (skin.shield) drawShield(pb, handF[0], handF[1]);
  leg(hipF[0], hipF[1], p.legF, true);
  leg(hipN[0], hipN[1], p.legN, false);
  _stampRows(pb, skin.torso, bx, by, pal);
  if (skin.extra) _stampRows(pb, skin.extra.rows, bx + skin.extra.dx, by + skin.extra.dy, pal);
  const raised = Math.abs(p.armN[0]) > 2.1 && !p.armFront;
  let hand = raised ? arm(shN[0], shN[1], p.armN, false) : null;
  const head = p.hurt && skin.hurt ? skin.hurt : skin.head;
  _stampRows(pb, head, bx - 1 + (p.hx || 0), by - 10 + (p.hy || 0) + (skin.headDy || 0), pal);
  if (!raised) hand = arm(shN[0], shN[1], p.armN, false);
  if (skin.weapon && p.weapon !== false) drawWeapon(pb, skin.weapon, hand[0], hand[1], hand[2] + (p.wa || 0), p);
  return { c: pb.toCanvas(), hand: [hand[0], hand[1]], head: [bx - 1 + (p.hx || 0), by - 7 + (p.hy || 0)] };
}

function drawWeapon(pb, type, hx, hy, ang, p) {
  const dx = Math.sin(ang), dy = Math.cos(ang);
  const px = Math.cos(ang), py = -Math.sin(ang); // perpendicular, toward the back of the blade
  const steel = C('#e6e2d6'), steelD = C('#8e8e98'), gold = C('#dea12a'), wood = C('#6b4024'), out = C('#1a1210');
  if (type === 'scimitar' || type === 'bigsword' || type === 'dagger') {
    const L = type === 'bigsword' ? 12 : type === 'dagger' ? 5 : 9;
    // guard
    for (let k = -1; k <= 1; k++) pb.set(hx + px * k, hy + py * k, gold);
    for (let i = 1; i <= L; i++) {
      const t = i / L;
      const curve = t * t * (type === 'dagger' ? 0.5 : 2.6);
      const x = hx + dx * i + px * curve, y = hy + dy * i + py * curve;
      pb.set(x, y, steel);
      if (i < L - 1) pb.set(x - px, y - py, steelD);
    }
  } else if (type === 'spear') {
    for (let i = -5; i <= 13; i++) {
      const x = hx + dx * i, y = hy + dy * i;
      pb.set(x, y, i > 10 ? gold : wood);
    }
    pb.set(hx + dx * 11 + px, hy + dy * 11 + py, gold);
    pb.set(hx + dx * 11 - px, hy + dy * 11 - py, gold);
  } else if (type === 'bow') {
    // bow held perpendicular to the forearm
    const draw = p.draw || 0;
    for (let i = -7; i <= 7; i++) {
      const t = i / 7;
      const bend = (1 - t * t) * 2.5;
      pb.set(hx + px * i + dx * bend, hy + py * i + dy * bend, wood);
    }
    const sx = hx - dx * draw, sy = hy - dy * draw;
    const tips = [[hx + px * 7, hy + py * 7], [hx - px * 7, hy - py * 7]];
    for (const [tx, ty] of tips) {
      const n = 8;
      for (let i = 0; i <= n; i++) pb.set(lerp(tx, sx, i / n), lerp(ty, sy, i / n), C('#e9dcc0'));
    }
    if (draw > 0) for (let i = 0; i < 9; i++) pb.set(sx + dx * i, sy + dy * i, i > 6 ? steel : C('#a8703f'));
  } else if (type === 'cannon') {
    for (let i = 0; i < 6; i++) {
      pb.set(hx + dx * i, hy + dy * i, C('#a86d16'));
      pb.set(hx + dx * i + px, hy + dy * i + py, C('#6e3f10'));
      pb.set(hx + dx * i - px, hy + dy * i - py, C('#dea12a'));
    }
    pb.set(hx + dx * 6, hy + dy * 6, C('#79f0a5'));
  }
  void out;
}
function drawShield(pb, x, y) {
  const r = 5;
  for (let yy = -r; yy <= r; yy++)
    for (let xx = -r; xx <= r; xx++) {
      const d = Math.hypot(xx, yy);
      if (d > r + 0.3) continue;
      let c = d > r - 1 ? '#dea12a' : d > r - 2.2 ? '#1b5157' : '#2f8a80';
      if (d < 1.3) c = '#fff1b3';
      if (d > r - 0.4) c = '#140d0a';
      pb.set(x + xx - 2, y + yy - 1, C(c));
    }
}

const _rigCache = new Map();
function rigFrame(skinName, pose, over) {
  const key = skinName + ':' + pose + (over ? JSON.stringify(over) : '');
  let f = _rigCache.get(key);
  if (f) return f;
  const skin = SKINS[skinName];
  let p = POSES[pose] || POSES.idle0;
  if (over) p = Object.assign({}, p, over);
  const r = rigCanvas(skin, p);
  f = new Sprite(r.c, skin.w >> 1, skin.h);

  f.head = r.head;
  _rigCache.set(key, f);
  return f;
}
function heroFrame(pose, whipDir, whipPhase) {
  return whipDir ? rigFrame('hero', pose, { armN: WHIP_ARMS[whipDir][whipPhase] }) : rigFrame('hero', pose);
}

// ==== 04_tiles.js ====
// ANDOR :: procedural tile painting. Every tile is painted in world space with
// seeded noise, so seams vanish and no two walls repeat.

const T = {
  EMPTY: 0, SOLID: 1, ALT: 2, ONEWAY: 3, AWNING: 4, SPIKE_U: 5, SPIKE_D: 6, SPIKE_L: 7, SPIKE_R: 8,
  QUICK: 9, FAKE: 10, CRUMBLE: 11, GATE: 12, ROPE: 13,
};
const isSolidT = (t) => t === T.SOLID || t === T.ALT || t === T.CRUMBLE || t === T.GATE;
const isOneWayT = (t) => t === T.ONEWAY || t === T.AWNING || t === T.ROPE;
const isSpikeT = (t) => t >= T.SPIKE_U && t <= T.SPIKE_R;

// Small carved hieroglyphs (also used as UI ornaments).
const GLYPHS = [
  ['.###.', '#...#', '.#.#.', '#####', '..#..', '..#..', '..#..'],
  ['.#####.', '#..#..#', '.#####.', '...#.#.', '..#...#'],
  ['.##..', '#.##.', '..##.', '.####', '.####', '..#.#', '.#..#'],
  ['..##.', '.#..#', '..#..', '...#.', '..#..', '.#...', '.####'],
  ['.#.#.#.', '#.#.#.#'],
  ['..#..', '.##..', '.#.#.', '.#.#.', '..##.', '..#..', '..#..'],
  ['.###.', '#.#.#', '#####', '#.#.#', '.###.'],
  ['#.#.#', '.###.', '#####', '.###.', '#.#.#'],
  ['..#', '.##', '.##', '.##', '.#.', '.#.', '#..'],
  ['#####', '.###.', '#####', '.###.', '#####', '.#.#.', '.#.#.'],
  ['.##.', '#..#', '#..#', '.##.', '..#.', '.##.', '#..#'],
  ['...#', '..##', '.###', '####', '#...'],
];

function paintGlyph(pb, gi, x, y, dark, light) {
  const g = GLYPHS[gi % GLYPHS.length];
  for (let r = 0; r < g.length; r++)
    for (let c = 0; c < g[r].length; c++)
      if (g[r][c] === '#') {
        pb.set(x + c, y + r, dark);
        if (light !== undefined && !(g[r + 1] && g[r + 1][c] === '#')) pb.set(x + c, y + r + 1, light);
      }
}

// 8-point star tilework motif, 8x8, used for Persian glazed tiles.
const GIRIH = ['t..ww..t', '.t.ww.t.', '..tttt..', 'wwtyytww', 'wwtyytww', '..tttt..', '.t.ww.t.', 't..ww..t'];

// Each theme: palette + painters. Painters receive the pixel buffer, tile
// pixel origin (px, py), world tile coords (tx, ty), and neighbour solidity.
function nb(level, tx, ty) {
  const s = (x, y) => level.solidAt(x, y);
  return {
    u: s(tx, ty - 1), d: s(tx, ty + 1), l: s(tx - 1, ty), r: s(tx + 1, ty),
    ul: s(tx - 1, ty - 1), ur: s(tx + 1, ty - 1), dl: s(tx - 1, ty + 1), dr: s(tx + 1, ty + 1),
  };
}

// Common edge treatment for a solid tile: outline where exposed and round corners.
function edgeTile(pb, px, py, n, out, hi, sh) {
  if (!n.u) for (let x = 0; x < 16; x++) pb.set(px + x, py, out);
  if (!n.d) for (let x = 0; x < 16; x++) pb.set(px + x, py + 15, out);
  if (!n.l) for (let y = 0; y < 16; y++) pb.set(px, py + y, out);
  if (!n.r) for (let y = 0; y < 16; y++) pb.set(px + 15, py + y, out);
  if (!n.u) for (let x = !n.l ? 1 : 0; x < (!n.r ? 15 : 16); x++) pb.set(px + x, py + 1, hi);
  if (!n.l) for (let y = !n.u ? 2 : 0; y < (!n.d ? 15 : 16); y++) pb.set(px + 1, py + y, hi);
  if (!n.r && sh) for (let y = !n.u ? 2 : 0; y < (!n.d ? 15 : 16); y++) pb.set(px + 14, py + y, sh);
  if (!n.d && sh) for (let x = !n.l ? 1 : 0; x < (!n.r ? 15 : 16); x++) pb.set(px + x, py + 14, sh);
  const clr = 0;
  if (!n.u && !n.l) { pb.set(px, py, clr); pb.set(px + 1, py + 1, out); }
  if (!n.u && !n.r) { pb.set(px + 15, py, clr); pb.set(px + 14, py + 1, out); }
  if (!n.d && !n.l) { pb.set(px, py + 15, clr); pb.set(px + 1, py + 14, out); }
  if (!n.d && !n.r) { pb.set(px + 15, py + 15, clr); pb.set(px + 14, py + 14, out); }
}

const THEMES = {};
const PAINT = { level: null };

// ISFAHAN BAZAAR: plastered adobe, exposed brick, glazed tile bands, cedar beams.
THEMES.bazaar = (() => {
  const c = {
    out: C('#3a2214'), pl0: C('#e2b57a'), pl1: C('#d1a066'), pl2: C('#b98549'), pl3: C('#9c6a37'),
    br0: C('#a5603b'), br1: C('#874a2c'), mor: C('#c49a6c'), cap0: C('#f6dcaa'), cap1: C('#e8c48a'), capS: C('#8d5c30'),
    t: C('#3fb5a3'), tD: C('#22396e'), w: C('#f2e6c8'), y: C('#dea12a'), grout: C('#e9dcc0'),
    wd0: C('#b07a45'), wd1: C('#8b5a34'), wd2: C('#5e3a20'), rope: C('#d8c49a'),
    bk0: C('#6c4528'), bk1: C('#5d3a21'), bk2: C('#4b2e19'), bkB: C('#6e3c26'), beam: C('#2f1c10'), beamH: C('#4a2e1a'),
  };
  const theme = { c, spike: ['#3a3a40', '#8a8a92', '#d8d8de'], name: 'bazaar' };
  theme.solid = (pb, px, py, tx, ty, n) => {
    for (let y = 0; y < 16; y++)
      for (let x = 0; x < 16; x++) {
        const wx = px + x, wy = py + y;
        const v = fbm(wx / 14, wy / 14, 11);
        let col = v > 0.5 ? c.pl0 : v > 0.35 ? c.pl1 : c.pl2;
        if (Math.abs(v - 0.5) < 0.035) col = bayer(wx, wy) > 0.5 ? c.pl1 : c.pl0;
        // exposed brick where the plaster has fallen away
        const e = fbm(wx / 15 + 40, wy / 15, 5);
        if (e > 0.69) {
          const row = Math.floor(wy / 4), off = (row & 1) * 4;
          const mortar = wy % 4 === 3 || (wx + off) % 8 === 7;
          col = mortar ? c.mor : hash2(Math.floor((wx + off) / 8), row, 3) > 0.5 ? c.br0 : c.br1;
          if (e < 0.715) col = c.pl3;
        }
        pb.set(wx, wy, col);
      }
    // hairline cracks
    if (hash2(tx, ty, 9) < 0.25) {
      let x = px + 3 + Math.floor(hash2(tx, ty, 10) * 10), y = py + 2 + Math.floor(hash2(tx, ty, 12) * 6);
      for (let i = 0; i < 7; i++) {
        pb.set(x, y, c.pl3);
        y++;
        x += hash2(tx + i, ty, 13) > 0.5 ? 1 : -1;
      }
    }
    edgeTile(pb, px, py, n, c.out, c.pl0, c.pl3);
    // houses, not rock: arched lattice windows (some lamplit) and beam ends
    if (n.u && n.d && n.l && n.r && PAINT.level) {
      // windows sit in storeys counted down from the roof line above
      let d = 0;
      while (d < 14 && PAINT.level.solidAt(tx, ty - d - 1)) d++;
      if (d % 3 === 1 && tx % 3 === 1 && hash2(tx, ty, 101) < 0.72) paintWindow(pb, px + 4, py + 2, hash2(tx, ty, 102) < 0.4);
    }
    if (!n.u) {
      // flat roof parapet cap
      for (let x = 0; x < 16; x++) {
        if ((x === 0 && !n.l) || (x === 15 && !n.r)) continue;
        pb.set(px + x, py + 1, c.cap0);
        pb.set(px + x, py + 2, c.cap1);
        pb.set(px + x, py + 3, bayer(px + x, py) > 0.5 ? c.cap1 : c.capS);
        pb.set(px + x, py + 4, c.capS);
        // projecting cedar beam ends under the parapet
        if ((px + x) % 6 === 2 && x > 0 && x < 15) {
          pb.set(px + x, py + 6, c.wd2);
          pb.set(px + x + 1, py + 6, c.wd1);
          pb.set(px + x, py + 7, c.out);
          pb.set(px + x + 1, py + 7, c.wd2);
        }
      }
    }
  };
  theme.rope = (pb, px, py, tx, ty, n) => {
    const rope = C('#d8c49a'), ropeD = C('#8a7a5a');
    const cloths = ['#b02a2c', '#f2e6c8', '#3fb5a3', '#dea12a', '#c47a42', '#2a807c'].map((h) => C(h));
    for (let x = 0; x < 16; x++) {
      const sag = Math.round(Math.sin(((px + x) % 48) / 48 * Math.PI) * 1);
      pb.set(px + x, py + sag, rope);
      pb.set(px + x, py + 1 + sag, ropeD);
    }
    // a garment pegged to the line in most cells
    const r = hash2(tx, ty, 120);
    if (r < 0.8) {
      const col = cloths[Math.floor(r * 100) % cloths.length], w = 6 + Math.floor(r * 5), h = 6 + Math.floor(hash2(tx, ty, 121) * 6);
      const x0 = px + 2 + Math.floor(hash2(tx, ty, 122) * (14 - w));
      for (let y = 2; y < h; y++)
        for (let x = 0; x < w; x++) {
          const edge = y === h - 1 && x % 2 === 1;
          if (edge) continue;
          pb.set(x0 + x, py + y, y === 2 || x === w - 1 ? mixC(col) : col);
        }
      pb.set(x0 + 1, py + 1, C('#5e3a20'));
      pb.set(x0 + w - 2, py + 1, C('#5e3a20'));
    }
    if (!n.lw) for (let y = -6; y < 16; y++) { pb.set(px, py + y, C('#5e3a20')); pb.set(px + 1, py + y, C('#3a2214')); }
    if (!n.rw) for (let y = -6; y < 16; y++) { pb.set(px + 14, py + y, C('#5e3a20')); pb.set(px + 15, py + y, C('#3a2214')); }
  };
  theme.alt = (pb, px, py, tx, ty, n) => {
    for (let y = 0; y < 16; y++)
      for (let x = 0; x < 16; x++) {
        const wx = px + x, wy = py + y;
        const ch = GIRIH[wy & 7][wx & 7];
        let col = ch === 't' ? c.t : ch === 'w' ? c.w : ch === 'y' ? c.y : c.tD;
        if ((wx & 7) === 0 && (wy & 7) === 0) col = c.grout;
        // weathering: some glaze lost
        if (fbm(wx / 6, wy / 6, 77) > 0.7) col = bayer(wx, wy) > 0.4 ? c.pl1 : c.pl2;
        pb.set(wx, wy, col);
      }
    edgeTile(pb, px, py, n, c.out, c.grout, c.tD);
  };
  theme.oneway = (pb, px, py, tx, ty, n) => {
    for (let x = 0; x < 16; x++) {
      const wx = px + x;
      const grain = hash2(wx >> 2, ty, 4) > 0.7;
      pb.set(wx, py, c.out);
      pb.set(wx, py + 1, c.wd0);
      pb.set(wx, py + 2, grain ? c.wd2 : c.wd1);
      pb.set(wx, py + 3, c.wd1);
      pb.set(wx, py + 4, c.wd2);
      pb.set(wx, py + 5, c.out);
    }
    // rope lashings at beam ends and every few tiles
    if (!n.lw || tx % 4 === 0) for (let y = 1; y < 5; y++) { pb.set(px + 2, py + y, c.rope); pb.set(px + 3, py + y, y & 1 ? c.rope : c.wd2); }
    if (!n.rw) for (let y = 0; y < 6; y++) pb.set(px + 15, py + y, c.out);
    if (!n.lw) for (let y = 0; y < 6; y++) pb.set(px, py + y, c.out);
  };
  theme.awning = (pb, px, py, tx, ty, n) => {
    const red = C('#b02a2c'), redD = C('#7e1b23'), cr = C('#f2e6c8'), crD = C('#cdb894');
    for (let x = 0; x < 16; x++) {
      const wx = px + x;
      const stripe = Math.floor(wx / 4) & 1;
      for (let y = 0; y < 6; y++) {
        let col = stripe ? red : cr;
        if (y >= 4) col = stripe ? redD : crD;
        pb.set(wx, py + y, col);
      }
      // scalloped hem
      const sc = Math.abs((wx % 4) - 1.5) < 1 ? 1 : 0;
      if (sc) pb.set(wx, py + 6, stripe ? redD : crD);
      pb.set(wx, py, C('#3a2214'));
    }
    if (!n.lw) for (let y = 0; y < 6; y++) pb.set(px, py + y, c.out);
    if (!n.rw) for (let y = 0; y < 6; y++) pb.set(px + 15, py + y, c.out);
  };
  theme.back = (pb, px, py, tx, ty) => {
    for (let y = 0; y < 16; y++)
      for (let x = 0; x < 16; x++) {
        const wx = px + x, wy = py + y;
        const v = fbm(wx / 16, wy / 16, 21);
        let col = v > 0.52 ? c.bk0 : v > 0.4 ? c.bk1 : c.bk2;
        if (Math.abs(v - 0.52) < 0.025) col = bayer(wx, wy) > 0.5 ? c.bk0 : c.bk1;
        const e = fbm(wx / 20 + 9, wy / 20, 6);
        if (e > 0.66) {
          const row = Math.floor(wy / 4), off = (row & 1) * 4;
          col = wy % 4 === 3 || (wx + off) % 8 === 7 ? c.bk2 : c.bkB;
        }
        pb.set(wx, wy, col);
      }
    // cedar beam every 5 rows
    if (ty % 5 === 0)
      for (let x = 0; x < 16; x++) {
        pb.set(px + x, py + 12, c.beamH);
        pb.set(px + x, py + 13, c.beam);
        pb.set(px + x, py + 14, c.beam);
        pb.set(px + x, py + 15, c.bk2);
      }
  };
  return theme;
})();

    out: C('#4a2a16'), bands: ['#e3ab6a', '#d29659', '#bd7f47', '#a8693a', '#c98d50', '#94592f'].map((h) => C(h)),

    s0: C('#f8e2b4'), s1: C('#efd09a'), s2: C('#e0b87a'), s3: C('#c99a5c'),

    wd0: C('#9a6a3a'), wd1: C('#73492a'), wd2: C('#4e301b'),
    bk0: C('#9a6038'), bk1: C('#86512e'), bk2: C('#6f4226'),
  };

      }

      // drifted sand cap with a wavy lower edge

        const depth = 3 + Math.round(vnoise(wx / 5, ty, 14) * 3);
        for (let y = 0; y <= depth; y++) {
          if ((x === 0 && !n.l && y === 0) || (x === 15 && !n.r && y === 0)) continue;
          let col = y === 0 ? c.s0 : y < depth - 1 ? (bayer(wx, py + y) > 0.35 + y * 0.12 ? c.s1 : c.s2) : c.s3;
          if (y === depth) col = c.sh;
          pb.set(wx, py + y, col);
        }

  };
  theme.deep = (pb, px, py) => {
    for (let y = 0; y < 16; y++)

        const wx = px + x, wy = py + y;
        const warp = vnoise(wx / 24, wy / 40, 3) * 7;

  theme.alt = (pb, px, py, tx, ty, n) => {

    for (let y = 0; y < 16; y++)
      for (let x = 0; x < 16; x++) {
        const wx = px + x, wy = py + y;
        const by = Math.floor(wy / 8), off = (by & 1) * 8;
        const bx = Math.floor((wx + off) / 16);
        const ly = wy % 8, lx = (wx + off) % 16;
        let col = hash2(bx, by, 41) > 0.5 ? c.rb0 : c.rb1;
        if (ly === 0) col = c.s1;
        if (ly === 7 || lx === 15) col = c.rbL;
        if (lx === 0 && ly > 0 && ly < 7) col = c.rb0;
        if (fbm(wx / 5, wy / 5, 12) > 0.68) col = c.rb2;
        pb.set(wx, wy, col);
      }
    if (hash2(tx, ty, 44) < 0.35) paintGlyph(pb, Math.floor(hash2(tx, ty, 45) * GLYPHS.length), px + 5, py + 4, c.rbL, c.rb0);
    edgeTile(pb, px, py, n, c.out, c.s1, c.rb2);
  };
  theme.oneway = (pb, px, py, tx, ty, n) => {
    for (let x = 0; x < 16; x++) {
      const wx = px + x;
      pb.set(wx, py, c.out);
      pb.set(wx, py + 1, c.wd0);
      pb.set(wx, py + 2, hash2(wx >> 1, ty, 5) > 0.75 ? c.wd2 : c.wd1);
      pb.set(wx, py + 3, c.wd2);
      pb.set(wx, py + 4, c.out);
    }
    if (tx % 3 === 0) for (let y = 1; y < 4; y++) pb.set(px + 7, py + y, c.wd2);
    if (!n.lw) for (let y = 0; y < 5; y++) pb.set(px, py + y, c.out);
    if (!n.rw) for (let y = 0; y < 5; y++) pb.set(px + 15, py + y, c.out);
  };
  theme.awning = theme.oneway;
  theme.back = (pb, px, py, tx, ty) => {
    for (let y = 0; y < 16; y++)
      for (let x = 0; x < 16; x++) {
        const wx = px + x, wy = py + y;
        const by = Math.floor(wy / 8), off = (by & 1) * 8;
        const ly = wy % 8, lx = (wx + off) % 16;
        let col = fbm(wx / 10, wy / 10, 51) > 0.5 ? c.bk0 : c.bk1;
        if (ly === 7 || lx === 15) col = c.bk2;
        // crumbled holes reveal the sky behind
        if (fbm(wx / 18, wy / 14, 52) > 0.69) continue;
        pb.set(wx, wy, col);
      }
  };
  return theme;
})();

// Horizontally-wrapping pixel buffer helpers for tileable layers.
class WrapBuf extends PixBuf {
  setW(x, y, c) {
    x = Math.round(x);
    y = Math.round(y);
    if (y < 0 || y >= this.h) return;
    this.d[y * this.w + (((x % this.w) + this.w) % this.w)] = c;
  }
  getW(x, y) {
    x = Math.round(x);
    y = Math.round(y);
    if (y < 0 || y >= this.h) return 0;
    return this.d[y * this.w + (((x % this.w) + this.w) % this.w)];
  }
  colW(x, y0, y1, c) {
    for (let y = Math.round(y0); y <= Math.round(y1); y++) this.setW(x, y, c);
  }
  rectW(x, y, w, h, c) {
    for (let xx = 0; xx < w; xx++) this.colW(x + xx, y, y + h - 1, c);
  }
}

// Silhouette shapes -------------------------------------------------------
function bgDome(b, cx, baseY, r, h, body, rim, accent) {
  for (let y = 0; y <= h; y++) {
    const t = y / h;
    const w = r * Math.sqrt(Math.max(0, 1 - Math.pow(t, 1.7))) * (1 + 0.16 * Math.sin(t * Math.PI * 0.9));
    const yy = baseY - y;
    for (let x = -Math.round(w); x <= Math.round(w); x++) {
      let col = body;
      if (x >= Math.round(w) - 1 && w > 1.5) col = rim;
      if (accent && Math.round(x + y * 0.6) % 6 === 0 && y < h - 2 && Math.abs(x) < w - 1) col = accent;
      b.setW(cx + x, yy, col);
    }
  }
  // finial
  b.colW(cx, baseY - h - 6, baseY - h, body);
  b.setW(cx, baseY - h - 4, rim);
  b.setW(cx - 1, baseY - h - 3, body);
  b.setW(cx + 1, baseY - h - 3, body);
}
function bgMinaret(b, cx, baseY, h, w, body, rim, lit) {
  b.rectW(cx - (w >> 1), baseY - h, w, h + 1, body);
  b.colW(cx + (w >> 1) - 1, baseY - h, baseY, rim);
  const bal = baseY - Math.round(h * 0.78);
  b.rectW(cx - (w >> 1) - 2, bal, w + 4, 2, body);
  b.rectW(cx - (w >> 1) - 1, bal + 2, w + 2, 1, body);
  for (let y = 0; y < w + 4; y++) {
    const half = Math.max(0, Math.round(((w + 4 - y) / (w + 4)) * (w / 2 + 0.5)));
    for (let x = -half; x <= half; x++) b.setW(cx + x, baseY - h - y, body);
  }
  b.colW(cx, baseY - h - w - 9, baseY - h - w - 3, body);
  if (lit) b.setW(cx, bal - 4, lit);
}
function bgBlock(b, x, baseY, w, h, body, rim, win, rng) {
  b.rectW(x, baseY - h, w, h + 1, body);
  b.colW(x + w - 1, baseY - h, baseY, rim);
  // parapet notches
  for (let i = 1; i < w - 1; i += 3) b.setW(x + i, baseY - h - 1, body);
  if (win)
    for (let wy = baseY - h + 4; wy < baseY - 3; wy += 6)
      for (let wx = x + 2; wx < x + w - 2; wx += 4) if (rng() < 0.28) { b.setW(wx, wy, win); b.setW(wx, wy + 1, win); }
}
function bgArch(b, cx, baseY, w, h, col) {
  // pointed (Persian) arch opening
  for (let y = 0; y < h; y++) {
    const t = y / h;
    const half = t < 0.6 ? w / 2 : (w / 2) * Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.6) / 0.42, 2)));
    for (let x = -Math.round(half); x <= Math.round(half); x++) b.setW(cx + x, baseY - y, col);
  }
}
function bgPalm(b, x, baseY, h, trunk, frond, rng) {
  const lean = rng() * 6 - 3;
  let tx = x, ty = baseY;
  for (let i = 0; i <= h; i++) {
    const t = i / h;
    tx = x + lean * t * t;
    ty = baseY - i;
    b.setW(tx, ty, trunk);
    b.setW(tx + 1, ty, trunk);
  }
  const n = 7;
  for (let k = 0; k < n; k++) {
    const a = (k / (n - 1)) * Math.PI - Math.PI;
    const len = 9 + rng() * 5;
    for (let s = 0; s < len; s++) {
      const u = s / len;
      const fx = tx + Math.cos(a) * s * 1.1;
      const fy = ty + Math.sin(a) * s * 0.5 + u * u * 7;
      b.setW(fx, fy, frond);
      if (s % 2 === 0) b.setW(fx, fy + 1, frond);

  }

  b.colW(x + w - 1, baseY - h, baseY, rim);
  for (let i = 1; i < w - 1; i += 2) b.colW(x + i, baseY - h + 2, baseY - h + 7, slit);
  b.rectW(x - 1, baseY - h - 1, w + 2, 1, body);
}
