<!doctype html>
<html lang="en" data-theme="dark" data-map="scope">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQUAWK | Live Flight Radar</title>
<meta name="description" content="Live air traffic radar built on free ADS-B data: 3D airspace, radar scope mode, sky view, alerts and analytics.">
<meta name="theme-color" content="#0c0f0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SQUAWK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/b612-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="7.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/><path d="M16 16 L16 3 A13 13 0 0 1 27.3 9.5 Z" fill="currentColor" opacity=".35"/><path d="M16 16 L27.3 9.5" stroke="currentColor" stroke-width="1.6"/><circle cx="21.5" cy="8.4" r="1.8" fill="currentColor"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 2.5 8 12 13l9.5-5L12 3Z"/><path d="m2.5 12.5 9.5 5 9.5-5"/><path d="m2.5 16.5 9.5 5 9.5-5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="3"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></symbol>
    <symbol id="i-sky" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v18M3 12h18"/><path d="m15.5 7.5 2-2" stroke-width="2.4"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><path d="M12 2.5 15.5 12h-7L12 2.5Z" fill="currentColor" stroke="none"/><path d="M12 21.5 8.5 12h7L12 21.5Z" opacity=".45"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.8 5.8 3.8 9s-1.2 6.2-3.8 9c-2.6-2.8-3.8-5.8-3.8-9S9.4 5.8 12 3Z"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2.8 20.5 7.5v9L12 21.2l-8.5-4.7v-9L12 2.8Z"/><path d="M3.5 7.5 12 12.2l8.5-4.7M12 12.2v9"/></symbol>
    <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 12 18.4 5.6"/><path d="M12 7a5 5 0 0 1 5 5"/><circle cx="15.5" cy="14.5" r="1" fill="currentColor"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 17 12 4l9 13"/><path d="M7.5 17h9" /><path d="M12 13v8"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="6" r="2.2"/><path d="M7 17c6-1 4-9 10-10" stroke-dasharray="2.4 2.4"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M12 2.5c.8 0 1.3.9 1.3 2v5.2l7.7 4.6v1.9l-7.7-2.3v4.6l2.3 1.7v1.5L12 20.8l-3.6.9v-1.5l2.3-1.7v-4.6L3 16.2v-1.9l7.7-4.6V4.5c0-1.1.5-2 1.3-2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16Z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8.5 8.5h.01M15.5 15.5h.01M15.5 8.5h.01M8.5 15.5h.01M12 12h.01" stroke-width="3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V4H4v12h4"/></symbol>
  </defs>
</svg>

<div id="app">
  <div id="map" aria-label="Live flight map"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="tip" role="tooltip"></div>
  <div id="vignette" aria-hidden="true"></div>

  <header id="top">
    <a class="brand" href="#" id="brand" aria-label="SQUAWK home">
      <svg class="logo"><use href="#i-logo"/></svg>
      <span class="word">SQUAWK</span>
    </a>
    <div class="search" id="search">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Flight, reg, airport, type" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Search flights and airports">
      <kbd>/</kbd>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <div class="topright">
      <button class="live" id="live" title="Data source"><i></i><b id="liveTxt">CONNECTING</b></button>
      <div class="clock" title="UTC and local time"><b id="utc">--:--:--Z</b><span id="lcl">LCL --:--</span></div>
      <button class="ib" id="btnFull" title="Fullscreen (F11)" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
    </div>
  </header>

  <nav id="rail" aria-label="Panels">
    <button data-panel="layers" title="Layers and map style (M)"><svg><use href="#i-layers"/></svg><span>Layers</span></button>
    <button data-panel="filters" title="Filters (Shift+F)"><svg><use href="#i-filter"/></svg><span>Filter</span><em class="badge" id="fBadge"></em></button>
    <button data-panel="list" title="Aircraft in view (Shift+L)"><svg><use href="#i-list"/></svg><span>List</span></button>
    <button data-panel="stats" title="Airspace analytics (S)"><svg><use href="#i-stats"/></svg><span>Stats</span></button>
    <button data-panel="alerts" title="Emergencies and interesting traffic (A)"><svg><use href="#i-alert"/></svg><span>Alerts</span><em class="badge hot" id="aBadge"></em></button>
    <button data-panel="watch" title="Watchlist (W)"><svg><use href="#i-star"/></svg><span>Watch</span></button>
    <button data-panel="sky" title="Sky view: what is above you (V)"><svg><use href="#i-sky"/></svg><span>Sky</span></button>
    <div class="sp"></div>
    <button data-panel="settings" title="Settings"><svg><use href="#i-sliders"/></svg><span>Setup</span></button>
    <button id="btnHelp" title="Keyboard shortcuts (?)"><svg><use href="#i-help"/></svg><span>Help</span></button>
  </nav>

  <aside id="drawer" class="sheet" aria-hidden="true" aria-labelledby="dTitle">
    <div class="grab" aria-hidden="true"></div>
    <div class="dhead"><h2 id="dTitle">Layers</h2><button class="ib" id="dClose" aria-label="Close panel"><svg><use href="#i-x"/></svg></button></div>
    <div class="dbody" id="dBody"></div>
  </aside>

  <aside id="detail" class="sheet" aria-hidden="true" aria-live="polite">
    <div class="grab" aria-hidden="true"></div>
    <div id="dt"></div>
  </aside>

  <div id="ctrl" aria-label="Map controls">
    <button id="cIn" title="Zoom in" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button>
    <button id="cOut" title="Zoom out" aria-label="Zoom out"><svg><use href="#i-minus"/></svg></button>
    <button id="cNorth" title="Reset bearing and pitch" aria-label="Reset north"><svg id="needle"><use href="#i-compass"/></svg></button>
    <i class="sep"></i>
    <button id="cLocate" title="My location (N for nearest aircraft)" aria-label="Locate me"><svg><use href="#i-locate"/></svg></button>
    <button id="c3d" title="3D airspace (3)" aria-label="Toggle 3D"><svg><use href="#i-cube"/></svg></button>
    <button id="cGlobe" title="Globe projection (G)" aria-label="Toggle globe"><svg><use href="#i-globe"/></svg></button>
    <button id="cScope" title="Radar scope mode (R)" aria-label="Toggle radar scope"><svg><use href="#i-radar"/></svg></button>
  </div>

  <div id="legend" title="Color scale"></div>
  <button id="overhead" hidden></button>

  <footer id="status">
    <span><b id="sTracked">0</b> tracked</span>
    <span><b id="sView">0</b> in view</span>
    <span id="sAir"></span>
    <span class="grow"></span>
    <span id="sPos">--</span>
    <span id="sZoom">z--</span>
    <span id="sFps"></span>
  </footer>

  <div id="banner" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><button class="ib mclose" aria-label="Close"><svg><use href="#i-x"/></svg></button><div id="mBody"></div></div></div>
</div>

<div id="intro" aria-label="Loading SQUAWK">
  <canvas id="introCv"></canvas>
  <div class="crt" aria-hidden="true"></div>
  <div class="iboard" id="flap"></div>
  <div class="isub" id="isub"></div>
  <pre class="ilog" id="ilog"></pre>
  <div class="icount" id="icount"></div>
  <div class="iscan" aria-hidden="true"></div>
  <button id="iskip">Skip intro<kbd>Esc</kbd></button>
</div>

<script src="vendor/maplibre-gl.js" defer></script>
<script src="data/land.js" defer></script>
<script src="data/borders.js" defer></script>
<script src="data/ranges.js" defer></script>
<script src="js/core.js" defer></script>
<script src="js/intro.js" defer></script>
<script src="js/icons.js" defer></script>
<script src="js/feed.js" defer></script>
<script src="js/sim.js" defer></script>
<script src="js/tracker.js" defer></script>
<script src="js/enrich.js" defer></script>
<script src="js/map.js" defer></script>
<script src="js/render.js" defer></script>
<script src="js/charts.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/detail.js" defer></script>
<script src="js/panels.js" defer></script>
<script src="js/sky.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
