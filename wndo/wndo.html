<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>wndo</title>
<style>
:root {
  --ink: #ece4d6;
  --dim: rgba(236, 228, 214, 0.58);
  --faint: rgba(236, 228, 214, 0.3);
  --line: rgba(236, 228, 214, 0.13);
  --amber: #e9a254;
  --amber-dim: rgba(233, 162, 84, 0.35);
  --panel: rgba(17, 15, 13, 0.95);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --pad: max(16px, env(safe-area-inset-left));
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0a09; color: var(--ink); overflow: hidden; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 1px solid var(--amber); outline-offset: 3px; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
body.idle #view { cursor: none; }

/* ---------- intro ---------- */
#intro { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 55%, rgba(11, 10, 9, 0.35), rgba(11, 10, 9, 0.88) 70%); z-index: 20; transition: opacity 1.6s ease, visibility 1.6s; }
#intro.gone { opacity: 0; visibility: hidden; }
.intro-in { text-align: center; padding: 0 24px; }
.mark { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(64px, 13vw, 132px); letter-spacing: 0.02em; margin: 0; line-height: 1; color: var(--ink); text-shadow: 0 0 40px rgba(233, 162, 84, 0.18); }
.mark::after { content: ""; display: block; width: 38px; height: 1px; background: var(--amber); margin: 26px auto 0; }
.tag { font-family: var(--serif); font-style: italic; color: var(--dim); font-size: 18px; margin: 22px 0 40px; }
#open { font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; padding: 14px 4px 10px; color: var(--ink); border-bottom: 1px solid var(--faint); transition: border-color 0.4s, color 0.4s, letter-spacing 0.6s; }
#open:hover { border-color: var(--amber); color: var(--amber); letter-spacing: 0.38em; }
.fine { margin-top: 34px; font-size: 12px; color: var(--faint); letter-spacing: 0.02em; }
.loading .tag::after { content: " ..."; }

/* ---------- hud ---------- */
#hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 var(--pad) max(18px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 16px; z-index: 10; transition: opacity 0.9s ease, transform 0.9s ease; pointer-events: none; background: linear-gradient(to top, rgba(8, 7, 6, 0.55), rgba(8, 7, 6, 0)); padding-top: 60px; }
#hud > * { pointer-events: auto; }
#hud.hidden, body.idle #hud { opacity: 0; transform: translateY(8px); }
body.idle #hud > * { pointer-events: none; }
#place { min-width: 0; }
.place-name { font-family: var(--serif); font-size: 24px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place-sub { margin-top: 6px; font-size: 11px; line-height: 1.5; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; max-width: 34ch; }

#dial { position: relative; display: flex; gap: 0; padding-top: 16px; }
#dial::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 7px; background: repeating-linear-gradient(to right, var(--faint) 0 1px, transparent 1px 9px); opacity: 0.7; mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); }
.stn { position: relative; padding: 6px 12px 2px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); white-space: nowrap; transition: color 0.4s; }
.stn:hover { color: var(--dim); }
.stn .num { font-family: var(--mono); font-size: 10px; letter-spacing: 0; margin-right: 6px; opacity: 0.8; }
.stn.on { color: var(--ink); }
#needle { position: absolute; top: 0; width: 2px; height: 20px; background: var(--amber); box-shadow: 0 0 10px rgba(233, 162, 84, 0.6); transition: left 0.9s cubic-bezier(0.6, 0, 0.2, 1); }

#tools { justify-self: end; display: flex; gap: 4px; }
.tool { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 2px; color: var(--dim); transition: color 0.3s, background 0.3s; }
.tool:hover { color: var(--ink); background: rgba(236, 228, 214, 0.06); }
.tool.active { color: var(--amber); }
.tool svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- panel ---------- */
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 15; display: flex; flex-direction: column; transform: translateX(102%); transition: transform 0.55s cubic-bezier(0.6, 0, 0.2, 1); padding-top: env(safe-area-inset-top); }
#panel.open { transform: none; }
#panel header { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 22px 8px; }
.panel-title { font-family: var(--serif); font-style: italic; font-size: 22px; }
#p-close, #panel footer button { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
#p-close:hover, #panel footer button:hover { color: var(--amber); }
#tabs { display: flex; flex-wrap: wrap; gap: 2px 14px; padding: 6px 22px 14px; border-bottom: 1px solid var(--line); }
.tab { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); padding: 6px 0 4px; border-bottom: 1px solid transparent; }
.tab:hover { color: var(--dim); }
.tab.on { color: var(--ink); border-color: var(--amber); }
#pane { flex: 1; overflow-y: auto; padding: 8px 22px 30px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; touch-action: pan-y; }
#panel footer { display: flex; justify-content: space-between; padding: 14px 22px max(18px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.row { padding: 14px 0 12px; border-bottom: 1px solid rgba(236, 228, 214, 0.05); }
.row.off { display: none; }
.row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.row label { font-size: 13px; color: var(--ink); }
.val { font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.hint { font-size: 11px; color: var(--faint); margin-top: 3px; line-height: 1.4; }
.scope { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber-dim); margin-left: 6px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 6px 0 0; background: transparent; cursor: pointer; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: linear-gradient(to right, var(--amber) var(--p, 50%), var(--line) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 1px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 1px; background: var(--amber); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 15px; margin-top: -7px; background: var(--ink); border-radius: 1px; box-shadow: 0 0 0 3px rgba(17, 15, 13, 0.9); transition: background 0.2s; }
input[type=range]::-moz-range-thumb { width: 9px; height: 15px; background: var(--ink); border: 0; border-radius: 1px; }
input[type=range]:active::-webkit-slider-thumb { background: var(--amber); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 9px; }
.seg button { font-size: 11px; letter-spacing: 0.08em; padding: 5px 9px 4px; color: var(--dim); border: 1px solid var(--line); border-radius: 1px; transition: color 0.2s, border-color 0.2s; }
.seg button:hover { color: var(--ink); }
.seg button.on { color: var(--amber); border-color: var(--amber-dim); }
.tog { position: relative; width: 34px; height: 16px; border: 1px solid var(--faint); border-radius: 9px; flex: none; transition: border-color 0.3s; }
.tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--dim); transition: transform 0.3s, background 0.3s; }
.tog.on { border-color: var(--amber-dim); }
.tog.on::after { transform: translateX(18px); background: var(--amber); }

/* ---------- overlays ---------- */
#clock { position: fixed; top: max(18px, env(safe-area-inset-top)); right: var(--pad); font-family: var(--serif); font-size: clamp(28px, 5vw, 56px); font-weight: 400; letter-spacing: 0.02em; color: rgba(236, 228, 214, 0.82); text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6); z-index: 9; font-variant-numeric: tabular-nums; pointer-events: none; }
#clock small { font-size: 0.32em; letter-spacing: 0.2em; margin-left: 6px; color: var(--dim); }
#fps { position: fixed; top: 10px; left: 10px; font-family: var(--mono); font-size: 11px; color: var(--dim); z-index: 9; pointer-events: none; }
#toast { position: fixed; top: max(22px, env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -6px); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); opacity: 0; transition: opacity 0.5s, transform 0.5s; z-index: 12; pointer-events: none; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.7); white-space: nowrap; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#error { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0a09; z-index: 30; padding: 24px; text-align: center; }
#error[hidden] { display: none; }
#error strong { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 26px; display: block; margin-bottom: 14px; }
#error p { color: var(--dim); font-size: 13px; max-width: 520px; white-space: pre-wrap; font-family: var(--mono); }

@media (max-width: 860px) {
  #hud { grid-template-columns: 1fr auto; grid-template-areas: "dial dial" "place tools"; row-gap: 14px; }
  #dial { grid-area: dial; justify-self: center; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  #dial::-webkit-scrollbar { display: none; }
  #place { grid-area: place; }
  #tools { grid-area: tools; }
  .stn { padding: 6px 8px 2px; letter-spacing: 0.1em; }
  .stn .lbl { display: none; }
  .stn .num { margin: 0; font-size: 12px; }
  .stn.on .lbl { display: inline; margin-left: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  #intro, #hud, #panel, #needle, #toast { transition-duration: 0.01s; }
}

</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="intro">
  <div class="intro-in">
    <h1 class="mark">wndo</h1>
    <p class="tag">somewhere else, through glass</p>
    <button id="open" type="button">open the window</button>
    <p class="fine">sound on, if you like. click and drag on fogged glass to draw in it.</p>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="place">
    <div class="place-name"></div>
    <div class="place-sub"></div>
  </div>
  <div id="dial" role="tablist" aria-label="Places"></div>
  <div id="tools">
    <button class="tool" id="t-focus" type="button" title="Focus: glass or outside (space)" aria-label="Toggle focus"></button>
    <button class="tool" id="t-sound" type="button" title="Sound (m)" aria-label="Toggle sound"></button>
    <button class="tool" id="t-set" type="button" title="Settings (s)" aria-label="Settings"></button>
    <button class="tool" id="t-full" type="button" title="Fullscreen (f)" aria-label="Fullscreen"></button>
  </div>
</div>

<aside id="panel" aria-hidden="true">
  <header>
    <span class="panel-title">settings</span>
    <button id="p-close" type="button" aria-label="Close settings">close</button>
  </header>
  <nav id="tabs"></nav>
  <div id="pane"></div>
  <footer>
    <button id="reset-scene" type="button">reset this place</button>
    <button id="reset-all" type="button">reset everything</button>
  </footer>
</aside>

<div id="clock" hidden></div>
<div id="fps" hidden></div>
<div id="toast"></div>
<div id="error" hidden><div><strong>The window would not open.</strong><p></p></div></div>

<script>
// src/core/util.js
// wndo :: shared helpers (math, rng, color, smooth noise, storage, tiny events)
(() => {
  const W = (window.W = window.W || {});

  W.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  W.lerp = (a, b, t) => a + (b - a) * t;
  W.smoothstep = (a, b, x) => {
    const t = W.clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  W.fract = (x) => x - Math.floor(x);

  // mulberry32: small, fast, seedable
  W.rng = (seed) => {
    let s = seed >>> 0;
    const r = () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (a, b) => a + (b - a) * r();
    r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => {
      let u = 0, v = 0;
      while (u === 0) u = r();
      while (v === 0) v = r();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185 * v);
    };
    return r;
  };

  // integer hash -> [0,1)
  W.hash = (n) => {
    let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b);
    x ^= x >>> 13;
    x = Math.imul(x, 0xc2b2ae35);
    x ^= x >>> 16;
    return (x >>> 0) / 4294967296;
  };

  // smooth 1D value noise, deterministic per seed, range ~[0,1]
  W.noise1 = (seed) => {
    const N = 512, tab = new Float32Array(N), r = W.rng(seed);
    for (let i = 0; i < N; i++) tab[i] = r();
    return (x) => {
      const i = Math.floor(x), f = x - i;
      const a = tab[((i % N) + N) % N], b = tab[(((i + 1) % N) + N) % N];
      const u = f * f * (3 - 2 * f);
      return a + (b - a) * u;
    };
  };

  // sRGB 8-bit hex -> linear rgb array
  W.lin = (hex) => {
    const n = parseInt(hex.replace('#', ''), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
      v /= 255;
      return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return c;
  };

  // blackbody approximation, returns linear rgb normalised so max channel = 1
  W.kelvin = (k) => {
    const t = k / 100;
    let r, g, b;
    if (t <= 66) {
      r = 255;
      g = 99.4708025861 * Math.log(t) - 161.1195681661;
      b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
    } else {
      r = 329.698727446 * Math.pow(t - 60, -0.1332047592);
      g = 288.1221695283 * Math.pow(t - 60, -0.0755148492);
      b = 255;
    }
    const c = [r, g, b].map((v) => {
      v = W.clamp(v, 0, 255) / 255;
      return Math.pow(v, 2.2);
    });
    const m = Math.max(c[0], c[1], c[2]);
    return c.map((v) => v / m);
  };

  W.mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  W.scale3 = (a, s) => [a[0] * s, a[1] * s, a[2] * s];

  // vector helpers for the camera
  W.v3 = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    norm: (a) => {
      const l = Math.hypot(a[0], a[1], a[2]) || 1;
      return [a[0] / l, a[1] / l, a[2] / l];
    },
  };

  // localStorage that never throws
  W.store = {
    get(key, def) {
      try {
        const v = localStorage.getItem('wndo:' + key);
        return v == null ? def : JSON.parse(v);
      } catch (e) {
        return def;
      }
    },
    set(key, val) {
      try {
        localStorage.setItem('wndo:' + key, JSON.stringify(val));
      } catch (e) {
        /* private mode or blocked storage */
      }
    },
  };

  // minimal event hub, used to sync visuals and sound (thunder, passing cars, waves...)
  W.bus = {
    h: {},
    on(n, f) {
      (this.h[n] = this.h[n] || []).push(f);
    },
    emit(n, d) {
      (this.h[n] || []).forEach((f) => f(d));
    },
  };

  // critically damped spring toward a target, frame-rate independent
  W.spring = (cur, vel, target, omega, dt) => {
    const x = omega * dt, e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    const ch = cur - target, tmp = (vel + omega * ch) * dt;
    return [target + (ch + tmp) * e, (vel - omega * tmp) * e];
  };
})();

</script>
<script>
// src/core/gl.js
// wndo :: thin WebGL2 layer (programs, render targets, textures)
(() => {
  const W = window.W;

  class GL {
    constructor(canvas) {
      const gl = canvas.getContext('webgl2', {
        alpha: false, antialias: false, depth: false, stencil: false,
        premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance',
      });
      if (!gl) throw new Error('This browser has no WebGL2.');
      this.gl = gl;
      this.hdr = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
      this.floatLinear = !!gl.getExtension('OES_texture_float_linear');
      this.maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      this.emptyVAO = gl.createVertexArray();
      this.programs = [];
      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.CULL_FACE);
    }

    compile(type, src, name) {
      const gl = this.gl, s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(s) || '';
        const lines = src.split('\n');
        const m = /ERROR: \d+:(\d+)/.exec(log);
        const at = m ? +m[1] : 0;
        const ctx = at ? lines.slice(Math.max(0, at - 4), at + 2).map((l, i) => at - 3 + i + ': ' + l).join('\n') : '';
        throw new Error('Shader "' + name + '" failed:\n' + log + '\n' + ctx);
      }
      return s;
    }

    // defines: {NAME: value}
    program(vs, fs, name, defines) {
      const gl = this.gl;
      let pre = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\n';
      if (defines) for (const k in defines) pre += '#define ' + k + ' ' + defines[k] + '\n';
      const p = gl.createProgram();
      gl.attachShader(p, this.compile(gl.VERTEX_SHADER, pre + vs, name + '.vs'));
      gl.attachShader(p, this.compile(gl.FRAGMENT_SHADER, pre + fs, name + '.fs'));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link "' + name + '": ' + gl.getProgramInfoLog(p));
      const prog = new Program(this, p, name);
      this.programs.push(prog);
      return prog;
    }

    // render target with one color attachment
    target(w, h, opts = {}) {
      const gl = this.gl;
      const t = { w: 0, h: 0, tex: gl.createTexture(), fbo: gl.createFramebuffer(), opts };
      this.resizeTarget(t, w, h);
      return t;
    }

    resizeTarget(t, w, h) {
      const gl = this.gl;
      w = Math.max(1, Math.round(w));
      h = Math.max(1, Math.round(h));
      if (t.w === w && t.h === h) return false;
      t.w = w;
      t.h = h;
      const o = t.opts;
      let internal, format = gl.RGBA, type;
      if (o.format === 'r8') {
        internal = gl.R8; format = gl.RED; type = gl.UNSIGNED_BYTE;
      } else if (o.format === 'rgba8' || !this.hdr) {
        internal = gl.RGBA8; type = gl.UNSIGNED_BYTE;
      } else {
        internal = gl.RGBA16F; type = gl.HALF_FLOAT;
      }
      gl.bindTexture(gl.TEXTURE_2D, t.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
      const filt = o.nearest ? gl.NEAREST : gl.LINEAR;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
      const wrap = o.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
      gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.tex, 0);

        gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);

          case gl.FLOAT_VEC4: gl.uniform4fv(u.loc, v); break;

          }

      }

    }

vec3 tonemap(vec3 c){
  const mat3 A = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
