  // drops
  float clr = 0.0;
  vec4 D = vec4(0.0); float dR = 0.0;
  float crystal = 0.0;
  if (uWet > 0.001) {
    float ds = uDropSize;
    vec4 b1 = beads(g, 0.028 * ds, uWet, 1.0, aa);
    vec4 b2 = beads(g + 0.37, 0.07 * ds, uWet * 0.75, 2.0, aa);
#if DROPS > 1
    vec4 b3 = beads(g + 0.71, 0.016 * ds, uWet * 1.1, 5.0, aa);
#endif
    vec2 fp = rot(uFlowAng) * g;
    float c1, r1, c2, r2;
    vec4 R1 = runs(fp, 0.075 * ds, uWet, 3.0, aa, c1, r1);
#if DROPS > 1
    vec4 R2 = runs(fp + vec2(0.031, 0.0), 0.11 * ds, uWet * 0.8, 4.0, aa, c2, r2);
#else
    vec4 R2 = vec4(0.0); c2 = 0.0; r2 = 0.0;
#endif
    clr = max(c1, c2);
    b1.z *= 1.0 - clr; b2.z *= 1.0 - clr;
    D = b1; dR = b1.w;
    if (b2.z > D.z) { D = b2; dR = b2.w; }
#if DROPS > 1
    b3.z *= 1.0 - clr;
    if (b3.z > D.z) { D = b3; dR = b3.w; }
#endif
    mat2 back = rot(-uFlowAng);
    if (R1.z > D.z) { D = vec4(back * R1.xy, R1.z, 0.0); dR = r1; }
    if (R2.z > D.z) { D = vec4(back * R2.xy, R2.z, 0.0); dR = r2; }
  }
  if (uSnowGlass > 0.001) {
    float cr;
    vec4 F = flakes(g, 0.06 * uDropSize, uSnowGlass, aa, cr);
    if (F.z > D.z) { D = vec4(F.xy, F.z, 0.0); dR = F.w; crystal = cr; }
  }
  float glassFlash = uFlash;
  if (D.z > 0.002) {
    vec2 q = D.xy;
    float rho = min(length(q), 1.0);
    float lensW = 0.07 + dR * 3.0;
    float k = (1.0 - 0.65 * blurF);
    vec2 so = s - q * (dR + lensW) * (1.0 + 0.5 * rho * rho) * k;
    vec3 refr = texture(uDV, s2uv(so)).rgb;
    float edge = smoothstep(0.5, 1.0, rho);
    float small = smoothstep(0.002, 0.008, dR);
    refr *= 1.0 - 0.78 * edge * edge * (1.0 - 0.8 * blurF) * (0.35 + 0.65 * small);
    vec2 hl = q - vec2(-0.32, 0.42);
    float spec = exp(-dot(hl, hl) * 22.0) * 0.8 + exp(-dot(q - vec2(0.2, -0.55), q - vec2(0.2, -0.55)) * 9.0) * 0.12;
    vec3 sc = OUTAVG * 1.6 + uLamp * 0.05 + uFlashCol * glassFlash * 0.5 + 0.0015;
    refr += sc * spec * (1.0 - 0.7 * blurF);
    vec3 cryst = (texture(uOut, uv, 3.0).rgb * 1.3 + uLamp * 0.06 + OUTAVG * 0.6 + 0.003) * (0.9 + 0.3 * nz2.g);
    refr = mix(refr, cryst, crystal);
    col = mix(col, refr, D.z * (1.0 - 0.45 * blurF));
  }

  // smudges and dust catch bright light behind the glass
  vec3 veil = bsplineLod(uOut, uv, uOutLod).rgb;
  col += veil * (nz.a * nz.a * 0.16 + 0.01) * uSmudge;

  // condensation
  float fog = uCond * (0.45 + 0.55 * nz.r) + uCond * exp(-edgeD / 0.07) * 0.7 + uCond * (1.0 - smoothstep(-0.45, 0.1, g.y)) * 0.25;
  fog = sat(fog) * (1.0 - wipe) * (1.0 - clr * 0.92);
  float tf = smoothstep(nz.r * 0.55 + 0.2, nz.r * 0.55 + 0.45, uFogT * 1.25);
  fog = max(fog, tf);
  vec3 fogCol = veil * 0.88 + uLamp * 0.018 + OUTAVG * 0.05 + uFlashCol * uFlash * 0.08;
  fogCol += veil * (nz2.b - 0.3) * 0.2 * (1.0 - blurF * 0.5);
  col = mix(col, fogCol, fog * 0.94);

  // frost grows from the pane edges
  if (uFrost > 0.001) {
    float grow = uFrost * 0.2 + (nz.g - 0.4) * 0.09 + (nz.r - 0.5) * 0.05;
    float fr = smoothstep(0.0, 0.035, grow - edgeD);
    float ridge = texture(uNoise, g * 2.4).g;
    float dens = fr * (0.55 + 0.45 * ridge) * (1.0 - wipe * 0.4);
    vec3 frostCol = veil * 0.9 + texture(uOut, uv, 2.0).rgb * 0.25 + uLamp * 0.03 + OUTAVG * 0.15 + 0.002;
    frostCol *= 0.85 + 0.6 * ridge;
    float spark = step(0.985, hash12(floor(fc * 0.5) + floor(uHead * 400.0))) * ridge * 2.0;
    frostCol += (OUTAVG + uLamp * 0.2 + 0.01) * spark;
    col = mix(col, frostCol, sat(dens) * 0.92);
  }

  // reflections of the room in the glass: lamp, candle (two panes give two faint images)
  if (uRefl > 0.001) {
    vec3 refl = vec3(0.0);
    vec3 Lv = vec3(uLampPos.xy, 2.0 * zg - uLampPos.z);
    vec2 ls = (Lv.xy * uKp - uHead) / Lv.z;
    float lb = 0.34 * uKp / Lv.z + blurPx(Lv.z) * px * 0.6;
    refl += uLamp * 0.022 * exp(-dot(s - ls, s - ls) / (lb * lb));
    if (uCandle.w > 0.5) {
      for (int i = 0; i < 2; i++) {
        vec3 F = flamePos(); F.z = 2.0 * (zg + float(i) * 0.024) - F.z;
        vec2 fs = (F.xy * uKp - uHead) / F.z;
        float fb = 0.012 * uKp / F.z + blurPx(F.z) * px * 0.5 + 2.0 * px;
        refl += flameCol() * (i == 0 ? 0.05 : 0.03) * exp(-dot(s - fs, s - fs) / (fb * fb));
      }
    }
    refl += uLamp * 0.004 * smoothstep(-0.6, 0.5, s.y);
    col += refl * uRefl;
  }
  // a lit railway carriage seen in its own window: light strip, luggage rack, seat backs
  if (uTrain > 0.0) {
    vec2 q = s + uHead / 1.7;
    float strip = exp(-sq((q.y - 0.355) / 0.03)) * (0.85 + 0.15 * sin(q.x * 2.3));
    float rack = exp(-sq((q.y - 0.25) / 0.01)) * 0.35 + exp(-sq((q.y - 0.21) / 0.008)) * 0.2;
    vec2 sb = vec2(fract(q.x * 0.85 + 0.35) - 0.5, q.y + 0.18);
    float seat = 1.0 - smoothstep(-0.01, 0.02, length(max(abs(sb) - vec2(0.16, 0.13), 0.0)) - 0.07);
    float lamps = 0.55 + 0.45 * smoothstep(0.3, 0.7, abs(fract(q.x * 1.6) - 0.5) * 2.0);
    vec3 interior = vec3(1.0, 0.95, 0.86) * strip * lamps * 0.7 + vec3(0.7, 0.66, 0.6) * rack + vec3(0.05, 0.042, 0.038) * seat * (1.0 - smoothstep(0.0, 0.12, q.y));
    float soft = 1.0 / (1.0 + blurPx(3.4) * 0.05);
    col += interior * uTrain * 0.05 * soft;
  }

  // ---------- frame and room ----------
  if (framed) {
    float wF = 0.75 + blurPx(zf), wG = 0.75 + blurPx(zg), wW = 0.75 + blurPx(zw);
    vec4 Ig = projRect(uI3, zg), If = projRect(uI3, zf), Of = projRect(uO3, zf), Ow = projRect(uO3, zw);
    float rad = uCorner * uKp;
    float cG = inside(max(sdBox(s, Ig, rad / zg), sdBox(s, If, rad / zf)), wG);
    // glazing bars
    for (int i = 0; i < 6; i++) {
      if (float(i) >= uBarN) break;
      vec4 bf = projRect(uBars[i], zf), bg = projRect(uBars[i], zg);
      vec4 bb = vec4(min(bf.xy, bg.xy), max(bf.zw, bg.zw));
      float cb = inside(sdBox(s, bb, 0.0), wF);
      if (cb > 0.0) {
        bool front = sdBox(s, bf, 0.0) < 0.0;
        vec3 N = vec3(0.0, 0.0, -1.0); vec3 P = pt3(s, zf);
        bool vert = (uBars[i].z - uBars[i].x) < (uBars[i].w - uBars[i].y);
        if (!front) {
          if (vert) { float sx = s.x < (bf.x + bf.z) * 0.5 ? -1.0 : 1.0; N = vec3(sx, 0.0, 0.0); float x3 = sx < 0.0 ? uBars[i].x : uBars[i].z; float zz = (x3 * uKp - uHead.x) / s.x; P = pt3(s, zz); }
          else { float sy = s.y < (bf.y + bf.w) * 0.5 ? -1.0 : 1.0; N = vec3(0.0, sy, 0.0); float y3 = sy < 0.0 ? uBars[i].y : uBars[i].w; float zz = (y3 * uKp - uHead.y) / s.y; P = pt3(s, zz); }
        }
        vec2 muv = vert ? vec2(P.x * 8.0 + P.z * 5.0, P.y) : vec2(P.y * 8.0 + P.z * 5.0, P.x);
        vec3 bc = woodAlb(muv, 0.0) * roomLight(P, N, uMatKind > 1.5 ? 0.8 : 0.5) * (front ? 1.0 : 0.82);
        col = mix(col, bc, cb);
      }
    }
    // inner faces of the frame (between frame front and glass)
    vec3 innerCol;
    {
      float zx = 1e3, zy = 1e3; vec3 N = vec3(0.0, 0.0, -1.0);
      float cx = (Ig.x + Ig.z) * 0.5, cy = (Ig.y + Ig.w) * 0.5;
      float dxs = max(Ig.x - s.x, s.x - Ig.z), dys = max(Ig.y - s.y, s.y - Ig.w);
      vec3 P;
      if (dxs > dys) {
        float x3 = s.x < cx ? uI3.x : uI3.z; N = vec3(s.x < cx ? 1.0 : -1.0, 0.0, 0.0);
        P = pt3(s, clamp((x3 * uKp - uHead.x) / s.x, zf, zg));
        innerCol = woodAlb(vec2(P.y, P.z * 4.0), 0.0);
      } else {
        float y3 = s.y < cy ? uI3.y : uI3.w; N = vec3(0.0, s.y < cy ? 1.0 : -1.0, 0.0);
        P = pt3(s, clamp((y3 * uKp - uHead.y) / s.y, zf, zg));
        innerCol = woodAlb(vec2(P.x, P.z * 4.0), 0.0);
      }
      float ao = 0.55 + 0.45 * smoothstep(0.0, 0.05, zg - P.z);
      innerCol *= roomLight(P, N, 0.4) * ao;
      innerCol += OUTAVG * 0.25 * (1.0 - smoothstep(0.0, 0.02, zg - P.z)) * woodAlb(vec2(P.x + P.y, P.z), 0.0);
      if (uStyle > 5.5) innerCol = vec3(0.012, 0.012, 0.013) * (roomLight(P, N, 0.9) + 0.3);
    }
    col = mix(innerCol, col, cG);
    // frame front face
    {
      vec3 P = pt3(s, zf); vec3 N = vec3(0.0, 0.0, -1.0);
      float dI = sdBox(P.xy, uI3, uCorner);
      bool vert = abs(P.x - (uI3.x + uI3.z) * 0.5) - (uI3.z - uI3.x) * 0.5 > abs(P.y - (uI3.y + uI3.w) * 0.5) - (uI3.w - uI3.y) * 0.5;
      vec2 muv = vert ? vec2(P.x * 6.0, P.y) : vec2(P.y * 6.0, P.x);
      vec3 alb = woodAlb(muv, 0.0);
      // chamfer catching light near the glass
      float ch = 1.0 - smoothstep(0.0, 0.012, dI);
      vec3 Nc = normalize(vec3(-normalize(P.xy - vec2((uI3.x + uI3.z) * 0.5, (uI3.y + uI3.w) * 0.5)) * 0.6, -0.8));
      vec3 fcol = alb * roomLight(P, normalize(mix(N, Nc, ch)), uMatKind > 1.5 ? 0.9 : 0.55);
      float ao = 0.72 + 0.28 * smoothstep(0.0, 0.03, dI);
      if (uStyle > 5.5) {
        float gasket = 1.0 - smoothstep(0.018, 0.02, dI);
        fcol = mix(uMat * roomLight(P, N, 0.3), vec3(0.015) * (roomLight(P, Nc, 1.2) + 0.2), gasket);
      }
      col = mix(fcol * ao, col, inside(sdBox(s, If, rad / zf), wF));
    }
    // reveals (and the sill top between wall and frame)
    {
      float dxs = max(Of.x - s.x, s.x - Of.z), dys = max(Of.y - s.y, s.y - Of.w);
      float cx = (Of.x + Of.z) * 0.5, cy = (Of.y + Of.w) * 0.5;
      vec3 P, N; vec3 alb;
      if (dys > dxs && s.y < cy) {
        P = pt3(s, clamp((uO3.y * uKp - uHead.y) / s.y, zl, zf)); N = vec3(0.0, 1.0, 0.0);
        alb = uMat2 * (0.94 + 0.06 * vnoise(vec2(P.x * 3.0, P.z * 60.0)));
        if (uMatKind > 0.5 && uMatKind < 1.5) alb = uMat2 * (0.75 + 0.25 * sin(fbm(vec2(P.x * 2.0, P.z * 30.0)) * 20.0));
      } else if (dys > dxs) {
        P = pt3(s, clamp((uO3.w * uKp - uHead.y) / s.y, zw, zf)); N = vec3(0.0, -1.0, 0.0);
        alb = uWall;
      } else {
        float x3 = s.x < cx ? uO3.x : uO3.z;
        P = pt3(s, clamp((x3 * uKp - uHead.x) / s.x, zw, zf)); N = vec3(s.x < cx ? 1.0 : -1.0, 0.0, 0.0);
        alb = uWall;
      }
      alb *= 0.96 + 0.08 * vnoise(P.xy * 40.0 + P.z * 30.0);
      float ao = 0.6 + 0.4 * smoothstep(0.0, 0.06, zf - P.z);
      if (N.y > 0.5) ao *= sillAO(P);
      vec3 rc = alb * roomLight(P, N, 0.3) * ao;
      col = mix(rc, col, inside(sdBox(s, Of, rad / zf), wF));
    }
    // wall face (and sill ledge in front of it)
    {
      vec3 P = pt3(s, zw); vec3 N = vec3(0.0, 0.0, -1.0);
      vec3 alb = uWall * (0.95 + 0.07 * fbm(P.xy * 7.0));
      float ao = 0.78 + 0.22 * smoothstep(0.0, 0.05, sdBox(P.xy, uO3, uCorner));
      vec3 wc = alb * roomLight(P, N, 0.15) * ao;
      col = mix(wc, col, inside(sdBox(s, Ow, rad / zw), wW));
      // ledge: top face between zl and zw, front edge below
      float yTopF = (uO3.y * uKp - uHead.y) / zl, yTopW = (uO3.y * uKp - uHead.y) / zw;
      float lx0 = uO3.x - 0.07, lx1 = uO3.z + 0.07;
      float zz = clamp((uO3.y * uKp - uHead.y) / min(s.y, -1e-4), zl, zw);
      float x3 = (s.x * zz + uHead.x) / uKp;
      float wl = 0.75 + blurPx(zl);
      float inX = inside(max(lx0 - x3, x3 - lx1) * uKp / zz, wl);
      float cTop = inX * inside(max(yTopF - s.y, s.y - yTopW), wl);
      vec3 Pt = vec3(x3, uO3.y, zz);
      vec3 alt = uMat2 * (0.94 + 0.06 * vnoise(vec2(Pt.x * 3.0, Pt.z * 60.0)));
      if (uMatKind > 0.5 && uMatKind < 1.5) alt = uMat2 * (0.75 + 0.25 * sin(fbm(vec2(Pt.x * 2.0, Pt.z * 30.0)) * 20.0));
      vec3 tc = alt * roomLight(Pt, vec3(0.0, 1.0, 0.0), 0.3) * sillAO(Pt);
      col = mix(col, tc, cTop);
      float yBot = ((uO3.y - 0.035) * uKp - uHead.y) / zl;
      float xf = (s.x * zl + uHead.x) / uKp;
      float cFront = inside(max(lx0 - xf, xf - lx1) * uKp / zl, wl) * inside(max(yBot - s.y, s.y - yTopF), wl);
      vec3 Pf = pt3(s, zl);
      col = mix(col, uMat2 * 0.92 * roomLight(Pf, vec3(0.0, -0.3, -0.95), 0.2), cFront);
    }
    // objects on the sill
    vec3 glowAdd = vec3(0.0), steamAdd = vec3(0.0);
    if (uPlant.w > 0.5) { vec4 p = plant(s); col = mix(col, p.rgb, p.a); }
    if (uMug.w > 0.5) { vec4 m = mug(s, steamAdd); col = mix(col, m.rgb, m.a); }
    if (uCandle.w > 0.5) { vec4 c = candle(s, glowAdd); col = mix(col, c.rgb, c.a); }
    col += glowAdd + steamAdd;
  }

  // ---------- grading ----------
  col = max(col, 0.0) * exp2(uExposure);
  col = tonemap(col);
  col *= vec3(1.0 + uWarm * 0.07, 1.0 + uWarm * 0.01, 1.0 - uWarm * 0.09);
  col = pow(col, vec3(1.0 / 2.2));
  float l = luma(col);
  col = mix(vec3(l), col, uSat);
  col = (col - 0.5) * uContrast + 0.5;
  col = col * uGain + uLift * (1.0 - col);
  float vig = length(s * vec2(0.85, 1.0));
  col *= 1.0 - uVig * smoothstep(0.35, 1.05, vig);
  float gr = hash12(fc + fract(uTime * 7.13) * 917.0) - 0.5;
  col += gr * uGrain * 0.07 * (0.4 + 0.6 * (1.0 - l));
  col += (hash12(fc * 1.37 + 3.1) - 0.5) / 255.0;
  o = vec4(clamp(col * uDim, 0.0, 1.0), 1.0);
}
`;
})();

</script>
<script>
// src/core/renderer.js
// wndo :: frame pipeline
// scene (HDR, alpha = distance) -> blur pyramid -> drops view (sharp + small lights)
// -> outside at current focus (+ bokeh discs) -> glass / frame / room / grade -> screen
(() => {
  const W = window.W;
  const MAXL = 6000;

  class Lights {
    constructor() {
      this.data = new Float32Array(MAXL * 12);
      this.n = 0;
    }
    clear() {
      this.n = 0;
    }
    // kind 0 point, 1 mirror in y=0, 2 motion streak (v = world velocity), 3 bokeh-only (area light)
    add(x, y, z, size, r, g, b, halo = 0, kind = 0, vx = 0, vy = 0, vz = 0) {
      if (this.n >= MAXL) return;
      const o = this.n++ * 12, d = this.data;
      d[o] = x; d[o + 1] = y; d[o + 2] = z; d[o + 3] = size;
      d[o + 4] = r; d[o + 5] = g; d[o + 6] = b; d[o + 7] = halo;
      d[o + 8] = kind; d[o + 9] = vx; d[o + 10] = vy; d[o + 11] = vz;
    }
    // light plus its reflection in a wet road or water at y = 0
    addRefl(x, y, z, size, r, g, b, halo, gain) {
      this.add(x, y, z, size, r, g, b, halo, 0);
      if (gain > 0) this.add(x, -y, z, size, r * gain, g * gain, b * gain, 0, 1);
    }
  }

  class Camera {
    constructor() {
      this.base = [0, 1.6, 0];
      this.pos = [0, 1.6, 0];
      this.yaw = 0;
      this.pitch = 0;
      this.fovY = 55;
      this.mat = new Float32Array(9);
      this.tanHalf = [1, 1];
      this.head = [0, 0];
      this.shake = [0, 0];
    }
    update(aspect) {
      const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw), cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
      const f = [sy * cp, sp, cy * cp];
      const r = W.v3.norm(W.v3.cross([0, 1, 0], f));
      const u = W.v3.cross(f, r);
      this.r = r; this.u = u; this.f = f;
      this.mat.set([r[0], r[1], r[2], u[0], u[1], u[2], f[0], f[1], f[2]]);
      const t = Math.tan((this.fovY * Math.PI) / 360) * Math.pow(W.clamp(1.45 / aspect, 1, 2.4), 0.5);
      this.tanHalf = [t * aspect, t];
      this.kp = 0.5 / t;
      const hx = this.head[0] + this.shake[0], hy = this.head[1] + this.shake[1];
      this.pos = [
        this.base[0] + r[0] * hx + u[0] * hy,
        this.base[1] + r[1] * hx + u[1] * hy,
        this.base[2] + r[2] * hx + u[2] * hy,
      ];
    }
    // world -> ndc (x,y in [-1,1]) and camera depth
    project(p) {
      const d = W.v3.sub(p, this.pos);
      const z = W.v3.dot(d, this.f);
      return [W.v3.dot(d, this.r) / (z * this.tanHalf[0]), W.v3.dot(d, this.u) / (z * this.tanHalf[1]), z];
    }
  }

  // window styles: screen margins at the glass (screen-height units), frame widths in metres
  const STYLES = {
    none: null,
    picture: { mx: 0.07, mt: 0.075, mb: 0.165, fw: 0.07, ft: 0.07, fb: 0.062, corner: 0.004, bars: () => [] },
    casement: { mx: 0.07, mt: 0.075, mb: 0.165, fw: 0.07, ft: 0.07, fb: 0.062, corner: 0.004, bars: (I) => [[-0.034, I[1], 0.034, I[3]]] },
    cross: {
      mx: 0.07, mt: 0.075, mb: 0.165, fw: 0.07, ft: 0.07, fb: 0.062, corner: 0.004,
      bars: (I) => {
        const y = I[1] + (I[3] - I[1]) * 0.6;
        return [[-0.03, I[1], 0.03, I[3]], [I[0], y - 0.028, I[2], y + 0.028]];
      },
    },
    sash: {
      mx: 0.07, mt: 0.075, mb: 0.165, fw: 0.068, ft: 0.07, fb: 0.062, corner: 0.004,
      bars: (I) => {
        const y = I[1] + (I[3] - I[1]) * 0.5;
        return [[I[0], y - 0.04, I[2], y + 0.04]];
      },
    },
    loft: {
      mx: 0.06, mt: 0.065, mb: 0.165, fw: 0.05, ft: 0.05, fb: 0.05, corner: 0.002,
      bars: (I) => {
        const w = I[2] - I[0], h = I[3] - I[1], t = 0.014;
        const out = [];
        const nx = w > 1.6 ? 3 : 2;
        for (let i = 1; i < nx; i++) {
          const x = I[0] + (w * i) / nx;
          out.push([x - t, I[1], x + t, I[3]]);
        }
        out.push([I[0], I[1] + h * 0.34 - t, I[2], I[1] + h * 0.34 + t]);
        out.push([I[0], I[1] + h * 0.7 - t, I[2], I[1] + h * 0.7 + t]);
        return out;
      },
    },
    train: { mx: 0.1, mt: 0.11, mb: 0.19, fw: 0.06, ft: 0.06, fb: 0.05, corner: 0.11, bars: () => [] },
  };

  const MATERIALS = {
    white: { kind: 0, frame: '#e7e1d6', sill: '#e2dccf' },
    oak: { kind: 1, frame: '#9b6c40', sill: '#8e623a' },
    charcoal: { kind: 0, frame: '#2e2d2b', sill: '#3a3835' },
    green: { kind: 0, frame: '#34493a', sill: '#d9d2c4' },
    steel: { kind: 2, frame: '#262728', sill: '#6e6457' },
    train: { kind: 3, frame: '#b9b4a9', sill: '#8c877d' },
  };

  class Renderer {
    constructor(canvas) {
      this.canvas = canvas;
      this.G = new W.GL(canvas);
      this.gl = this.G.gl;
      this.lights = new Lights();
      this.cam = new Camera();
      this.T = {};
      this.drops = 2;
      this.win = null;
      this.winKey = '';
      this.wipe = { seg: [0, 0, 0, 0], active: 0, pending: [] };
      this.build();
    }

    build() {
      const G = this.G, SH = W.SH;
      this.pDown = G.program(SH.vert, SH.down, 'down');
      this.pCopy = G.program(SH.vert, SH.copy, 'copy');
      this.pComp = G.program(SH.vert, SH.composite, 'composite');
      this.pBokeh = G.program(SH.bokehVS, SH.bokehFS, 'bokeh');
      this.pWipe = G.program(SH.vert, SH.wipe, 'wipe');
      this.pBg = G.program(SH.vert, SH.bokehBg, 'bokehBg');
      this.buildFinal();
      this.initBokehVAO();
      this.makeGlassNoise();
    }

    buildFinal() {
      this.pFinal = this.G.program(W.SH.vert, W.SH.final, 'final', { DROPS: this.drops });
    }

    setDropQuality(n) {
      n = n > 1 ? 2 : 1;
      if (n === this.drops) return;
      this.drops = n;
      this.buildFinal();
    }

    initBokehVAO() {
      const gl = this.gl;
      this.vao = gl.createVertexArray();
      gl.bindVertexArray(this.vao);
      const quad = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      this.instBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, this.instBuf);
      gl.bufferData(gl.ARRAY_BUFFER, this.lights.data.byteLength, gl.DYNAMIC_DRAW);
      for (let i = 0; i < 3; i++) {
        gl.enableVertexAttribArray(1 + i);
        gl.vertexAttribPointer(1 + i, 4, gl.FLOAT, false, 48, i * 16);
        gl.vertexAttribDivisor(1 + i, 1);
      }
      gl.bindVertexArray(null);
    }

    makeGlassNoise() {
      const G = this.G, gl = this.gl;
      const t = G.target(512, 512, { format: 'rgba8', repeat: true });
      const p = G.program(W.SH.vert, W.SH.glassTex, 'glassTex');
      G.bind(t);
      p.use();
      G.drawFS();
      gl.bindTexture(gl.TEXTURE_2D, t.tex);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      this.glassNoise = t;
    }

    // sizes: canvas pixels, scene scale, out scale
    resize(cw, ch, sceneScale, outScale) {
      const G = this.G, gl = this.gl, T = this.T;
      this.canvas.width = cw;
      this.canvas.height = ch;
      this.sizes = [cw, ch, sceneScale, outScale];
      sceneScale *= this.sceneMul || 1;
      const sw = Math.max(64, Math.round(cw * sceneScale)), sh = Math.max(64, Math.round(ch * sceneScale));
      if (!T.scene) {
        T.scene = G.target(sw, sh, { nearest: false });
        T.L = [];
        for (let i = 0; i < 6; i++) T.L.push(G.target(8, 8));
        T.dv = G.target(8, 8);
        T.out = G.target(8, 8);
        T.wipeA = G.target(8, 8, { format: 'r8' });
        T.wipeB = G.target(8, 8, { format: 'r8' });
        T.depthCopy = null;
      }
      G.resizeTarget(T.scene, sw, sh);
      let w = sw, h = sh;
      for (let i = 0; i < 6; i++) {
        w = Math.max(2, Math.ceil(w / 2));
        h = Math.max(2, Math.ceil(h / 2));
        G.resizeTarget(T.L[i], w, h);
      }
      G.resizeTarget(T.dv, Math.round(cw * 0.5), Math.round(ch * 0.5));
      if (G.resizeTarget(T.out, Math.round(cw * outScale), Math.round(ch * outScale))) {
        gl.bindTexture(gl.TEXTURE_2D, T.out.tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      }
      const aspect = cw / ch;
      const wh = 216, ww = Math.round(216 * aspect);
      if (G.resizeTarget(T.wipeA, ww, wh)) {
        G.resizeTarget(T.wipeB, ww, wh);
        for (const t of [T.wipeA, T.wipeB]) {
          G.bind(t);
          gl.clearColor(0, 0, 0, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }
      }
      this.aspect = aspect;
      this.winKey = '';
    }

    // render the scene at a lower resolution while it is blurred anyway
    setSceneMul(m) {
      if (m === (this.sceneMul || 1) || !this.sizes) return;
      this.sceneMul = m;
      const [cw, ch, s, o] = this.sizes;
      this.resize(cw, ch, s, o);
    }

    // scene helpers ---------------------------------------------------------
    camUniforms() {
      const c = this.cam;
      return { uCamPos: c.pos, uCamMat: c.mat, uTanHalf: c.tanHalf, uRes: [this.T.scene.w, this.T.scene.h] };
    }
    // a copy of the scene's distance channel, for scenes that draw sprites with occlusion
    depthCopy() {
      const G = this.G, T = this.T;
      if (!T.depthCopy) T.depthCopy = G.target(T.scene.w, T.scene.h);
      G.resizeTarget(T.depthCopy, T.scene.w, T.scene.h);
      const gl = this.gl;
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, T.scene.fbo);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, T.depthCopy.fbo);
      gl.blitFramebuffer(0, 0, T.scene.w, T.scene.h, 0, 0, T.scene.w, T.scene.h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
      G.bind(T.scene);
      return T.depthCopy;
    }

    // window geometry ---------------------------------------------------------
    windowFor(styleName, matName, opts) {
      const key = [styleName, matName, this.aspect.toFixed(3), this.cam.kp.toFixed(4), opts.candle, opts.mug, opts.plant].join('|');
      if (key === this.winKey) return this.win;
      this.winKey = key;
      const st = STYLES[styleName];
      const zg = 1.16, zf = 1.1, zw = 0.98, zl = 0.86;
      const kp = this.cam.kp, hw = this.aspect / 2;
      const mat = MATERIALS[matName] || MATERIALS.white;
      const win = { style: st ? Object.keys(STYLES).indexOf(styleName) : 0, z: [zw, zf, zg, zl] };
      if (!st) {
        Object.assign(win, { I3: [-9, -9, 9, 9], O3: [-9, -9, 9, 9], bars: [], corner: 0 });
      } else {
        const mx = st.mx * Math.min(1, Math.pow(this.aspect, 0.8));
        const I3 = [((-hw + mx) * zg) / kp, ((-0.5 + st.mb) * zg) / kp, ((hw - mx) * zg) / kp, ((0.5 - st.mt) * zg) / kp];
        const O3 = [I3[0] - st.fw, I3[1] - st.fb, I3[2] + st.fw, I3[3] + st.ft];
        Object.assign(win, { I3, O3, bars: st.bars(I3), corner: st.corner });
        const wid = I3[2] - I3[0], y = O3[1];
        win.candle = [I3[0] + Math.min(0.3, wid * 0.17), y, 0.955, opts.candle ? 1 : 0];
        win.mug = [I3[2] - Math.min(0.42, wid * 0.33), y, 0.93, opts.mug ? 1 : 0];
        win.plant = [I3[2] - Math.min(0.13, wid * 0.08), y, 1.035, opts.plant && wid > 0.95 ? 1 : 0];
        if (styleName === 'train') {
          win.candle[3] = 0;
          win.plant[3] = 0;
        }
      }
      win.mat = W.lin(mat.frame);
      win.mat2 = W.lin(mat.sill);
      win.matKind = mat.kind;
      this.win = win;
      return win;
    }

    // wipe strokes in glass coordinates
    addWipe(ax, ay, bx, by) {
      this.wipe.pending.push([ax, ay, bx, by]);
    }

    // per-frame ---------------------------------------------------------------
    frame(t, dt, scene, P) {
      const G = this.G, gl = this.gl, T = this.T, c = this.cam;
      // 1. the outside
      G.bind(T.scene);
      if (P.bokehOnly || !scene) {
        const bg = (scene && scene.bokehBg) || ['#0b0d10', '#14100c', '#060606'];
        this.pBg.use().set({ uTop: W.lin(bg[0]), uMid: W.lin(bg[1]), uBot: W.lin(bg[2]), uTime: t });
        G.drawFS();
      } else {
        scene.render(this, t, dt, P);
        G.bind(T.scene);
      }
      // 2. blur pyramid
      let src = T.scene;
      this.pDown.use();
      for (let i = 0; i < T.L.length; i++) {
        G.bind(T.L[i]);
        this.pDown.set({ uSrc: src, uTexel: [1 / src.w, 1 / src.h], uKaris: i === 0 ? 1 : 0 });
        G.drawFS();
        src = T.L[i];
      }
      // upload lights once
      const L = this.lights;
      gl.bindBuffer(gl.ARRAY_BUFFER, this.instBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, L.data, 0, L.n * 12);

      // blur radius for the outside (px at out resolution)
      const kOut = P.K * (T.out.h / 1080);
      const rOut = kOut * Math.abs(P.focusInv - 1 / P.dTyp);
      this.blurAmt = W.clamp(rOut / (kOut * 0.86 + 1e-6), 0, 1);
      // 3. drops view: half-res sharp scene + small lights
      G.bind(T.dv);
      this.pCopy.use().set({ uSrc: T.L[0] });
      G.drawFS();
      this.drawLights(T.dv, true, P, 0);
      // 4. outside at the current focus
      const rScene = rOut * (T.scene.h / T.out.h);
      let A, B, mix, aSharp = 0;
      if (rScene < 1.7) {
        A = T.scene; B = T.L[0]; mix = rScene / 1.7; aSharp = 1;
      } else {
        const l = Math.min(1 + Math.log2(rScene / 1.7), 5.999);
        const i = Math.floor(l);
        A = i === 0 ? T.scene : T.L[i - 1];
        B = T.L[i];
        mix = l - i;
        aSharp = i === 0 ? 1 : 0;
      }
      G.bind(T.out);
      this.pComp.use().set({
        uLA: A, uLB: B, uSizeA: [A.w, A.h], uSizeB: [B.w, B.h], uMix: mix, uASharp: aSharp,
        uBl1: T.L[2], uBl2: T.L[4], uSizeBl1: [T.L[2].w, T.L[2].h], uSizeBl2: [T.L[4].w, T.L[4].h], uBloom: P.bloom,
      });
      G.drawFS();
      this.drawLights(T.out, false, P, kOut);
      gl.bindTexture(gl.TEXTURE_2D, T.out.tex);
      gl.generateMipmap(gl.TEXTURE_2D);
      // 5. condensation wipes
      this.updateWipe(dt, P);
      // 6. the window
      G.bind(null);
      const w = this.win;
      const bars = new Float32Array(24);
      w.bars.slice(0, 6).forEach((b, i) => bars.set(b, i * 4));
      const kFinal = P.K * (gl.drawingBufferHeight / 1080);
      this.pFinal.use().set({
        uOut: T.out, uDV: T.dv, uWipe: T.wipeA, uNoise: this.glassNoise,
        uRes: [gl.drawingBufferWidth, gl.drawingBufferHeight], uTime: t,
        uHead: [(c.head[0] + c.shake[0]) * c.kp, (c.head[1] + c.shake[1]) * c.kp], uKp: c.kp,
        uK: kFinal, uFocusInv: P.focusInv, uGlassBlurK: 0.55,
        uWet: P.wet, uRunRate: P.runRate, uDropSize: P.dropSize, uFlowAng: P.flowAng, uCond: P.cond, uFrost: P.frost,
        uFogT: P.fogT, uSmudge: P.smudge, uSnowGlass: P.snowGlass, uOutLod: Math.max(0, Math.log2(T.out.h / 40)), uWipeOn: P.wipeOn ? 1 : 0,
        uStyle: w.style, uI3: w.I3, uO3: w.O3, uZ: w.z, uCorner: w.corner, uBars: bars, uBarN: Math.min(6, w.bars.length),
        uMat: w.mat, uMat2: w.mat2, uWall: P.wall, uMatKind: w.matKind,
        uLamp: P.lamp, uLampPos: [-0.95, 0.55, -0.35],
        uCandle: w.candle || [0, 0, 1, 0], uMug: w.mug || [0, 0, 1, 0], uPlant: w.plant || [0, 0, 1, 0],
        uFlame: P.flame, uFlameSway: P.flameSway,
        uRefl: P.refl, uTrain: P.train || 0, uFlash: P.flash, uFlashCol: P.flashCol,
        uExposure: P.exposure, uSat: P.sat, uContrast: P.contrast, uVig: P.vignette, uGrain: P.grain, uWarm: P.warm, uDim: P.dim,
        uLift: P.lift, uGain: P.gain,
      });
      G.drawFS();
    }

    drawLights(target, sharp, P, k) {
      const gl = this.gl, c = this.cam;
      if (!this.lights.n) return;
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      this.pBokeh.use().set({
        uCamPos: c.pos, uCamMat: c.mat, uTanHalf: c.tanHalf, uTarget: [target.w, target.h],
        uK: k, uFocusInv: P.focusInv, uSharp: sharp ? 1 : 0, uBlurAmt: this.blurAmt,
        uGain: P.bokehGain * (sharp ? 1 : P.bokehBoost), uHalo: P.halo, uReflStretch: P.reflStretch, uShutter: P.shutter,
        uDepth: this.T.scene, uNoDepth: this.G.hdr ? 0 : 1,
        uBlades: P.blades, uBladeRot: 0.3, uRim: P.rim, uCat: P.cat, uCA: P.ca, uSoft: P.soft,
      });
      gl.bindVertexArray(this.vao);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.lights.n);
      gl.bindVertexArray(null);
      gl.disable(gl.BLEND);
    }

    updateWipe(dt, P) {
      const G = this.G, T = this.T;
      const segs = this.wipe.pending.length ? this.wipe.pending : [null];
      const decay = Math.exp(-dt / P.refog);
      segs.forEach((sg, i) => {
        G.bind(T.wipeB);
        this.pWipe.use().set({
          uPrev: T.wipeA,
          uSeg: sg || [0, 0, 0, 0],
          uRad: 0.042,
          uDecay: i === 0 ? decay : 1,
          uActive: sg ? 1 : 0,
          uAspect: this.aspect,
        });
        G.drawFS();
        const tmp = T.wipeA;
        T.wipeA = T.wipeB;
        T.wipeB = tmp;
      });
      this.wipe.pending.length = 0;
    }
  }

  W.Renderer = Renderer;
  W.Lights = Lights;
  W.STYLES = STYLES;
  W.MATERIALS = MATERIALS;
})();

</script>
<script>
// src/scenes/kit.js
// wndo :: kit for the nature scenes. Painted sprites (trees, grass, branches) and a billboard renderer.
(() => {
  const W = window.W;
  const K = (W.kit = {});

  const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;

  // ---------- painters. Each draws into (0,0)-(w,h), base of the plant at the bottom centre ----------
  K.paint = {
    pine(g, w, h, r, o = {}) {
      const cx = w / 2;
      const top = h * 0.03, bot = h * 0.86;
      const maxW = w * 0.47 * (o.slim ? 0.72 : 1);
      // trunk
      const tg = g.createLinearGradient(cx - 6, 0, cx + 6, 0);
      tg.addColorStop(0, '#1b130e');
      tg.addColorStop(0.6, '#3a2a1f');
      tg.addColorStop(1, '#22180f');
      g.fillStyle = tg;
      g.beginPath();
      g.moveTo(cx - w * 0.018, h);
      g.lineTo(cx - w * 0.004, top);
      g.lineTo(cx + w * 0.004, top);
      g.lineTo(cx + w * 0.02, h);
      g.fill();
      const hue = o.hue != null ? o.hue : r.range(125, 150);
      const tiers = Math.floor(r.range(30, 44) * (h / 900));
      const snow = o.snow || 0;
      g.lineCap = 'round';
      for (let i = 0; i < tiers; i++) {
        const t = (i + r.range(-0.3, 0.3)) / tiers;
        const y = top + t * (bot - top);
        const half = maxW * (0.05 + 0.95 * Math.pow(t, 0.92)) * r.range(0.72, 1.06);
        const nb = 2 + Math.floor(r.range(0, 3));
        for (let b = 0; b < nb; b++) {
          const side = b % 2 ? 1 : -1;
          const depth = r.range(0.35, 1);
          const len = half * depth;
          const droop = h * 0.035 * (0.4 + t) * r.range(0.6, 1.3);
          const lift = h * 0.012 * (1 - t);
          const shade = 0.55 + 0.45 * depth;
          const n = Math.max(3, Math.floor(len / 2.6));
          for (let k = 0; k < n; k++) {
            const u = k / n;
            const bx = cx + side * len * u;
            const by = y - lift * u + droop * u * u;
            const tuft = (1 - u * 0.35) * r.range(3, 7) * (h / 900) * 2.2;
            const nn = 3 + Math.floor(r.range(0, 3));
            for (let m = 0; m < nn; m++) {
              const a = Math.PI / 2 + side * r.range(0.25, 1.35) - r.range(0, 0.9) * side * (m % 2);
              const l = tuft * r.range(0.6, 1.3);
              const lit = (1 - t) * 10 + u * 9 + (m === 0 ? 6 : 0);
              g.strokeStyle = hsl(hue + r.range(-8, 8), r.range(18, 32), (6 + lit * 0.55 + r.range(0, 5)) * shade, 0.9);
              g.lineWidth = r.range(0.8, 1.9) * (h / 900) * 1.6;
              g.beginPath();
              g.moveTo(bx, by);
              g.lineTo(bx + Math.cos(a) * l, by + Math.sin(a) * l * 0.8);
              g.stroke();
            }
            if (snow && r() < 0.75 * snow && u > 0.08) {
              g.fillStyle = hsl(210, 20, r.range(80, 94), r.range(0.7, 0.95));
              g.beginPath();
              g.ellipse(bx, by - tuft * 0.3, tuft * r.range(0.8, 1.4), tuft * r.range(0.3, 0.55), side * 0.15, 0, Math.PI * 2);
              g.fill();
            }
          }
        }
      }
    },

    birch(g, w, h, r, o = {}) {
      const cx = w / 2 + r.range(-0.05, 0.05) * w;
      const lean = r.range(-0.06, 0.06) * w;
      const tw = w * 0.032;
      // trunk with lenticels
      const steps = 60;
      for (let i = 0; i < steps; i++) {
        const t = i / steps, y = h - t * h * 0.82, x = cx + lean * t * t;
        const wd = tw * (1 - t * 0.75);
        const lg = g.createLinearGradient(x - wd, 0, x + wd, 0);
        lg.addColorStop(0, '#8d877c');
        lg.addColorStop(0.35, '#e7e2d6');
        lg.addColorStop(0.7, '#d8d2c4');
        lg.addColorStop(1, '#6f695f');
        g.fillStyle = lg;
        g.fillRect(x - wd, y - h * 0.82 / steps - 1, wd * 2, h * 0.82 / steps + 2);
        if (r() < 0.55) {
          g.fillStyle = `rgba(20,18,16,${r.range(0.5, 0.9)})`;
          g.fillRect(x - wd * r.range(0.2, 1), y - r.range(1, 3), wd * r.range(0.4, 1.4), r.range(1, 3.2));
        }
        if (t < 0.12 && r() < 0.5) {
          g.fillStyle = 'rgba(25,22,18,0.7)';
          g.fillRect(x - wd, y - 4, wd * 2, r.range(2, 6));
        }
      }
      // branches and leaves
      const hue = o.hue != null ? o.hue : r.range(62, 90);
      const leaves = [];
      const branch = (x, y, a, len, wd, d) => {
        const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
        g.strokeStyle = d < 2 ? '#2a2420' : '#3a322b';
        g.lineWidth = wd;
        g.beginPath();
        g.moveTo(x, y);
        g.quadraticCurveTo((x + x2) / 2 + r.range(-6, 6), (y + y2) / 2 + r.range(-4, 8), x2, y2);
        g.stroke();
        if (d > 3 || len < 10) {
          // weeping twigs hanging from the tip, leaves strung along them
          const sc = h / 1000, nt = 3 + Math.floor(r.range(0, 3));
          for (let k = 0; k < nt; k++) {
            const dx = r.range(-34, 34) * sc, dy = r.range(28, 80) * sc;
            const cx1 = x2 + dx * 0.7, cy1 = y2 - r.range(2, 12) * sc;
            const ex = x2 + dx, ey = y2 + dy;
            g.strokeStyle = 'rgba(52,42,34,0.55)';
            g.lineWidth = 0.8 * sc * 1.6;
            g.beginPath();
            g.moveTo(x2, y2);
            g.quadraticCurveTo(cx1, cy1, ex, ey);
            g.stroke();
            for (let u = 0.14; u <= 1.0; u += r.range(0.08, 0.14)) {
              const iu = 1 - u;
              const px = iu * iu * x2 + 2 * iu * u * cx1 + u * u * ex, py = iu * iu * y2 + 2 * iu * u * cy1 + u * u * ey;
              const side = (Math.floor(u * 40) % 2 ? 1 : -1) * r.range(2, 5) * sc;
              leaves.push([px + side, py + r.range(-1, 2) * sc, Math.atan2(ey - cy1, ex - cx1) + side * 0.3]);
            }
          }
          return;
        }
        const n = 2 + Math.floor(r.range(0, 2));
        for (let k = 0; k < n; k++) {
          let na = a + r.range(-0.6, 0.6) + (k - n / 2) * 0.22;
          const nx = x2 + Math.cos(na) * len * 0.7;
          if (nx < w * 0.08 || nx > w * 0.92) na = -Math.PI / 2 + (na + Math.PI / 2) * 0.3;
          branch(x2, y2, na, len * r.range(0.55, 0.75), wd * 0.62, d + 1);
        }
        if (d > 1) for (let k = 0; k < 6; k++) leaves.push([x + (x2 - x) * r() + r.range(-12, 12), y + (y2 - y) * r() + r.range(-4, 16)]);
      };
      for (let i = 0; i < 9; i++) {
        const t = r.range(0.35, 0.95), y = h - t * h * 0.82, x = cx + lean * t * t;
        const side = i % 2 ? 1 : -1;
        branch(x, y, -Math.PI / 2 + side * r.range(0.25, 0.75), h * r.range(0.07, 0.13) * (1.15 - t * 0.5), tw * 0.45, 0);
      }
      branch(cx + lean, h * 0.18, -Math.PI / 2 + r.range(-0.2, 0.2), h * 0.12, tw * 0.4, 1);
      // leaves: lit from upper left, darker inside
      const lx = cx - w * 0.2, ly = h * 0.1;
      for (const [x, y, ang] of leaves) {
        const d = Math.hypot(x - lx, y - ly) / h;
        const l = 24 + 30 * (1 - Math.min(d, 1)) + r.range(-8, 10);
        g.fillStyle = hsl(hue + r.range(-10, 16), r.range(35, 62), l, r.range(0.8, 1));
        g.beginPath();
        const a2 = ang != null ? ang + Math.PI / 2 + r.range(-0.5, 0.5) : r.range(0, Math.PI);
        g.ellipse(x, y, r.range(2.0, 3.6) * (h / 1000) * 1.6, r.range(1.3, 2.2) * (h / 1000) * 1.6, a2, 0, Math.PI * 2);
        g.fill();
      }
    },

    // a broad deciduous crown (oak-ish), used as a dark silhouette at night or a soft tree by day
    oak(g, w, h, r, o = {}) {
      const cx = w / 2;
      g.fillStyle = o.trunk || '#241a12';
      g.beginPath();
      g.moveTo(cx - w * 0.05, h);
      g.quadraticCurveTo(cx - w * 0.02, h * 0.7, cx - w * 0.03, h * 0.45);
      g.lineTo(cx + w * 0.03, h * 0.45);
      g.quadraticCurveTo(cx + w * 0.03, h * 0.7, cx + w * 0.06, h);
      g.fill();
      const blobs = 70;
      for (let i = 0; i < blobs; i++) {
        const a = r() * Math.PI * 2, rr = Math.sqrt(r());
        const x = cx + Math.cos(a) * rr * w * 0.4, y = h * 0.36 + Math.sin(a) * rr * h * 0.27;
        const s = r.range(0.05, 0.11) * w;
        const lit = (1 - (y / h)) * 14 + (x < cx ? 6 : 0);
        for (let k = 0; k < 90; k++) {
          const b = r() * Math.PI * 2, q = Math.sqrt(r()) * s;
          g.fillStyle = hsl(o.hue || r.range(85, 110), o.sat || 30, (o.light || 10) + lit * (o.litK || 1) * r.range(0.4, 1), 0.9);
          g.beginPath();
          g.ellipse(x + Math.cos(b) * q, y + Math.sin(b) * q, r.range(2, 5) * w / 600, r.range(1.5, 3.5) * w / 600, r() * 3, 0, Math.PI * 2);
          g.fill();
        }
      }
    },

    grass(g, w, h, r, o = {}) {
      const n = o.n || 90;
      const hue = o.hue != null ? o.hue : 75;
      g.lineCap = 'round';
      for (let i = 0; i < n; i++) {
        const x = w / 2 + r.gauss() * w * 0.16;
        const bh = h * r.range(0.35, 0.98);
        const bend = r.range(-0.35, 0.35) * w * 0.4;
        const lg = g.createLinearGradient(0, h, 0, h - bh);
        lg.addColorStop(0, hsl(hue + 10, o.sat || 35, (o.light || 14) * 0.6));
        lg.addColorStop(1, hsl(hue - 18 + r.range(-10, 10), (o.sat || 35) + 10, (o.light || 14) + r.range(6, 22)));
        g.strokeStyle = lg;
        g.lineWidth = r.range(1, 2.6) * (w / 256);
        g.beginPath();
        g.moveTo(x, h);
        g.quadraticCurveTo(x + bend * 0.2, h - bh * 0.6, x + bend, h - bh);
        g.stroke();
        if (o.seeds && r() < 0.12) {
          g.fillStyle = hsl(40, 40, 45, 0.9);
          g.beginPath();
          g.ellipse(x + bend, h - bh, 2.5, 8, bend * 0.004, 0, Math.PI * 2);
          g.fill();
        }
        if (o.flowers && r() < 0.05) {
          g.fillStyle = r.pick(['#e8e2c8', '#d9c34a', '#c8a2d8', '#efefe6']);
          g.beginPath();
          g.arc(x + bend, h - bh, r.range(2, 4.5) * (w / 256), 0, Math.PI * 2);
          g.fill();
        }
      }
    },

    // a pine bough reaching in from the side, seen close up
    bough(g, w, h, r, o = {}) {
      g.lineCap = 'round';
      const pts = [];
      let x = 0, y = h * 0.25, a = r.range(0.05, 0.25);
      for (let i = 0; i < 40; i++) {
        pts.push([x, y]);
        x += Math.cos(a) * w / 40;
        y += Math.sin(a) * w / 40;
        a += r.range(-0.04, 0.06);
      }
      g.strokeStyle = '#2b2018';
      g.lineWidth = h * 0.03;
      g.beginPath();
      pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py)));
      g.stroke();
      for (let i = 2; i < pts.length; i++) {
        const [px, py] = pts[i];
        const u = i / pts.length;
        for (let k = 0; k < 2; k++) {
          const side = k ? 1 : -1;
          let tx = px, ty = py, ta = Math.PI / 2 * side * 0.7 + r.range(-0.2, 0.2) + 0.3;
          const tl = h * r.range(0.12, 0.3) * (1 - u * 0.4);
          for (let s = 0; s < 8; s++) {
            const nx = tx + Math.cos(ta) * tl / 8, ny = ty + Math.sin(ta) * tl / 8;
            for (let m = 0; m < 9; m++) {
              const na = ta + side * r.range(0.6, 1.4) * (m % 2 ? 1 : -1);
              const nl = h * r.range(0.03, 0.055);
              g.strokeStyle = hsl(o.hue || 135, 28, r.range(8, 20) + (ty < py ? 8 : 0), 0.95);
              g.lineWidth = h * 0.004;
              g.beginPath();
              g.moveTo(nx, ny);
              g.lineTo(nx + Math.cos(na) * nl, ny + Math.sin(na) * nl);
              g.stroke();
            }
            if (o.snow && r() < 0.6) {
              g.fillStyle = hsl(210, 15, r.range(82, 95), 0.9);
              g.beginPath();
              g.ellipse(nx, ny - h * 0.012, h * r.range(0.02, 0.04), h * 0.012, 0, 0, Math.PI * 2);
              g.fill();
            }
            tx = nx; ty = ny;
            ta += r.range(-0.1, 0.15) * side;
          }
        }
      }
    },
  };

  // paint a set of sprites into one atlas canvas; returns {canvas, rects: {name: [u0,v0,u1,v1, aspect]}}
  K.atlas = function (specs, size = 2048) {
    // shelf packing, tallest first; the atlas grows downward as needed
    const order = specs.slice().sort((a, b) => b.h - a.h);
    let x = 0, y = 0, rowH = 0;
    const pos = new Map();
    for (const s of order) {
      if (x + s.w > size) {
        x = 0;
        y += rowH + 4;
        rowH = 0;
      }
      pos.set(s, [x, y]);
      x += s.w + 4;
      rowH = Math.max(rowH, s.h);
    }
    const H = Math.min(4096, y + rowH);
    const c = document.createElement('canvas');
    c.width = size;
    c.height = H;
    const g = c.getContext('2d');
    const rects = {};
    for (const s of specs) {
      const [px, py] = pos.get(s);
      if (py + s.h > H) continue;
      g.save();
      g.translate(px, py);
      g.beginPath();
      g.rect(0, 0, s.w, s.h);
      g.clip();
      K.paint[s.kind](g, s.w, s.h, W.rng(s.seed || 1), s.o || {});
      g.restore();
      rects[s.name] = [px / size, py / H, (px + s.w) / size, (py + s.h) / H, s.w / s.h];
    }
    return { canvas: c, rects };
  };

  // ---------- billboards ----------
  const BB_VS = /* glsl */ `
layout(location = 0) in vec2 aCorner;
layout(location = 1) in vec4 aPos;   // base xyz, width
layout(location = 2) in vec4 aUV;    // atlas rect
layout(location = 3) in vec4 aP;     // height, sway, phase, brightness
uniform vec3 uCamPos; uniform mat3 uCamMat; uniform vec2 uTanHalf;
uniform float uTime, uGust, uWind;
out vec2 vUv; out float vDist; out float vH; out float vBright; out vec3 vW; out float vPh;
void main(){
  vec3 R = normalize(vec3(uCamMat[0].x, 0.0, uCamMat[0].z));
  vec2 c = vec2(aCorner.x * 0.5, aCorner.y * 0.5 + 0.5);
  float gw = uGust * (0.55 + 0.45 * sin(aPos.x * 0.07 - uTime * 0.9 + aPos.z * 0.03));
  float sway = (sin(uTime * (0.9 + aP.z * 0.25) + aP.z * 6.0) * (0.12 + uWind * 0.3) + gw * 1.1) * aP.y;
  float hh = c.y * c.y;
  vec3 p = aPos.xyz + R * (c.x * aPos.w + sway * hh * aP.x * 0.12) + vec3(0.0, c.y * aP.x - abs(sway) * hh * aP.x * 0.02, 0.0);
  vec3 cc = transpose(uCamMat) * (p - uCamPos);
  vUv = vec2(mix(aUV.x, aUV.z, c.x + 0.5), mix(aUV.w, aUV.y, c.y));
  vDist = length(p - uCamPos);
  vH = c.y; vBright = aP.w; vW = p; vPh = aP.z;
  gl_Position = vec4(cc.x / uTanHalf.x, cc.y / uTanHalf.y, 0.0, cc.z);
}
`;
  const BB_FS = /* glsl */ `
${W.GLSL.common}
uniform sampler2D uAtlas;
uniform float uTime, uGust, uFlutter;
uniform vec3 uAmb, uSun, uFogCol; uniform float uFogD, uDepthPass;
uniform vec3 uLift;
in vec2 vUv; in float vDist; in float vH; in float vBright; in vec3 vW; in float vPh;
out vec4 o;
void main(){
  vec2 uv = vUv;
  float fl = (vnoise(vW.xy * 3.0 + uTime * (2.0 + uGust * 6.0) + vPh) - 0.5) * uFlutter * (0.3 + uGust) * vH;
  uv.x += fl * 0.004;
  vec4 c = texture(uAtlas, uv);
  if (uDepthPass > 0.5) { if (c.a < 0.55) discard; o = vec4(0.0, 0.0, 0.0, vDist); return; }
  if (c.a < 0.004) discard;
  vec3 alb = c.rgb / max(c.a, 1e-3);
  alb = alb * alb;
  float shimmer = 1.0 + fl * 0.9;
  vec3 col = alb * (uAmb + uSun * (0.55 + 0.45 * vH)) * vBright * shimmer + uLift * alb;
  float f = 1.0 - exp(-vDist * uFogD);
  col = mix(col, uFogCol, f);
  o = vec4(col * c.a, c.a);
}
`;

  K.Billboards = class {
    constructor(R, atlasCanvas) {
      const G = R.G, gl = R.gl;
      this.R = R;
      this.prog = G.program(BB_VS, BB_FS, 'billboard');
      this.tex = G.texture(atlasCanvas, { premultiply: true });
      this.vao = gl.createVertexArray();
      gl.bindVertexArray(this.vao);
      const quad = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      this.buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
      for (let i = 0; i < 3; i++) {
        gl.enableVertexAttribArray(1 + i);
        gl.vertexAttribPointer(1 + i, 4, gl.FLOAT, false, 48, i * 16);
        gl.vertexAttribDivisor(1 + i, 1);
      }
      gl.bindVertexArray(null);
      this.items = [];
    }
    dispose() {
      const gl = this.R.gl;
      gl.deleteTexture(this.tex);
      gl.deleteBuffer(this.buf);
      gl.deleteVertexArray(this.vao);
      gl.deleteProgram(this.prog.p);
    }
    // x,y,z base, rect from atlas, height in metres, sway, brightness
    add(x, y, z, rect, height, sway = 1, bright = 1) {
      this.items.push({ x, y, z, rect, h: height, w: height * rect[4], sway, bright, ph: Math.random() * 10 });
    }
    // sort far to near once (the camera barely moves)
    upload(camPos) {
      const gl = this.R.gl;
      this.items.sort((a, b) => Math.hypot(b.x - camPos[0], b.z - camPos[2]) - Math.hypot(a.x - camPos[0], a.z - camPos[2]));
      const d = new Float32Array(this.items.length * 12);
      this.items.forEach((it, i) => {
        d.set([it.x, it.y, it.z, it.w, it.rect[0], it.rect[1], it.rect[2], it.rect[3], it.h, it.sway, it.ph, it.bright], i * 12);
      });
      gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
      gl.bufferData(gl.ARRAY_BUFFER, d, gl.STATIC_DRAW);
      this.n = this.items.length;
    }
    draw(t, u, depth) {
      const R = this.R, gl = R.gl, c = R.cam;
      this.prog.use().set({
        uCamPos: c.pos, uCamMat: c.mat, uTanHalf: c.tanHalf, uTime: t, uAtlas: this.tex,
        uGust: u.gust, uWind: u.wind, uFlutter: u.flutter != null ? u.flutter : 1,
        uAmb: u.amb, uSun: u.sun, uFogCol: u.fogCol, uFogD: u.fogD, uLift: u.lift || [0, 0, 0], uDepthPass: 0,
      });
      gl.enable(gl.BLEND);
      gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
      gl.bindVertexArray(this.vao);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.n);
      if (depth) {
        // write the nearest opaque distance into alpha so lights behind trees get hidden
        this.prog.set({ uDepthPass: 1 });
        gl.colorMask(false, false, false, true);
        gl.blendEquationSeparate(gl.FUNC_ADD, gl.MIN);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.n);
        gl.colorMask(true, true, true, true);
        gl.blendEquation(gl.FUNC_ADD);
      }
      gl.bindVertexArray(null);
      gl.disable(gl.BLEND);
    }
  };

  // shared GLSL: physically-flavoured sky for daytime scenes
  W.GLSL.sky = /* glsl */ `
vec3 skyGrad(vec3 rd, vec3 sunDir, vec3 zenith, vec3 horizon, vec3 sunCol, float haze){
  float h = max(rd.y, 0.0);
  vec3 c = mix(horizon, zenith, pow(h, 0.45));
  float mu = max(dot(rd, sunDir), 0.0);
  c += sunCol * (pow(mu, 8.0) * 0.25 + pow(mu, 64.0) * 0.6) * (0.5 + haze);
  c = mix(c, horizon, exp(-h * 18.0) * haze * 0.6);
  return c;
}
`;
})();

</script>
<script>
// src/scenes/city.js
// wndo :: City Rain. A street seen from a sixth floor at 2 a.m., raytraced in one pass.
(() => {
  const W = window.W;
  const DW = 128; // data texture width
  const ROWS = 13;

  const GLSL = /* glsl */ `
${W.GLSL.common}
${W.GLSL.camera}
uniform sampler2D uData;
uniform vec4 uN, uN2;
uniform float uRain, uWind, uFlash, uFog, uWet, uLitBias;
uniform vec4 uSig;        // main red, yellow, green, walk
uniform vec3 uWinPal[6];
uniform vec3 uNeonPal[8];
out vec4 o;
#define FAR 9000.0
vec4 D(int x, int y){ return texelFetch(uData, ivec2(x, y), 0); }

vec2 boxT(vec3 ro, vec3 ird, vec3 bmin, vec3 bmax, out vec3 n){
  vec3 t0 = (bmin - ro) * ird, t1 = (bmax - ro) * ird;
  vec3 tmn = min(t0, t1), tmx = max(t0, t1);
  float tn = max(max(tmn.x, tmn.y), tmn.z), tf = min(min(tmx.x, tmx.y), tmx.z);
  n = -sign(ird) * step(tmn.yzx, tmn) * step(tmn.zxy, tmn);
  return vec2(tn, tf);
}

// walk one row of buildings along x, nearest first
void traceRow(vec3 ro, vec3 rd, vec3 ird, int i0, int n, float zMin, float zMax, inout float tB, inout vec3 nB, inout int idB){
  if (n <= 0) return;
  float tz0 = (zMin - ro.z) * ird.z, tz1 = (zMax - ro.z) * ird.z;
  float ta = max(min(tz0, tz1), 0.0), tb = min(max(tz0, tz1), tB);
  if (ta >= tb) return;
  float xa = ro.x + rd.x * ta, xb = ro.x + rd.x * tb;
  int lo = 0, hi = n - 1;
  for (int k = 0; k < 8; k++) { if (lo >= hi) break; int mid = (lo + hi + 1) / 2; if (D(i0 + mid, 0).x <= xa) lo = mid; else hi = mid - 1; }
  int dir = rd.x >= 0.0 ? 1 : -1;
  int idx = lo;
  for (int k = 0; k < 16; k++) {
    if (idx < 0 || idx >= n) break;
    vec4 b = D(i0 + idx, 0); float h = D(i0 + idx, 1).x;
    if ((dir > 0 && b.x > xb + 0.01) || (dir < 0 && b.z < xb - 0.01)) break;
    vec3 nn;
    vec2 t = boxT(ro, ird, vec3(b.x, 0.0, b.y), vec3(b.z, h, b.w), nn);
    bool hit = false;
    if (t.x < t.y && t.y > 0.0 && t.x < tB) { tB = max(t.x, 0.0); nB = nn; idB = i0 + idx; hit = true; }
    vec4 rb = D(i0 + idx, 11), rp = D(i0 + idx, 12);
    if (rp.y > 0.0) {
      vec2 t2 = boxT(ro, ird, vec3(rb.x, h, rb.y), vec3(rb.z, h + rp.y, rb.w), nn);
      if (t2.x < t2.y && t2.y > 0.0 && t2.x < tB) { tB = max(t2.x, 0.0); nB = nn; idB = 1000 + i0 + idx; hit = true; }
    }
    if (hit) return;
    idx += dir;
  }
}
void traceCity(vec3 ro, vec3 rd, vec3 ird, inout float tB, inout vec3 nB, inout int idB){
  int nA = int(uN.x), nBr = int(uN.y), nT = int(uN.z);
  traceRow(ro, rd, ird, 0, nA, 17.5, 40.0, tB, nB, idB);
  if (idB >= 0) return;
  traceRow(ro, rd, ird, nA, nBr, 41.0, 160.0, tB, nB, idB);
  if (idB >= 0) return;
  for (int i = 0; i < 24; i++) {
    if (i >= nT) break;
    int j = nA + nBr + i;
    vec4 b = D(j, 0); float h = D(j, 1).x; vec3 nn;
    vec2 t = boxT(ro, ird, vec3(b.x, 0.0, b.y), vec3(b.z, h, b.w), nn);
    if (t.x < t.y && t.y > 0.0 && t.x < tB) { tB = max(t.x, 0.0); nB = nn; idB = j; }
  }
}

vec3 skyCol(vec3 rd){
  float h = rd.y;
  vec3 c = mix(vec3(0.06, 0.045, 0.04), vec3(0.006, 0.007, 0.01), smoothstep(-0.03, 0.35, h));
  if (h > -0.02) {
    vec2 cp = rd.xz / (max(h, 0.0) + 0.06) * 1.1 + vec2(uTime * 0.01 * (0.3 + uWind), uTime * 0.004);
    float n = fbm(cp * 0.7);
    c *= 0.6 + 0.8 * n;
    float fl = fbm(cp * 1.2 + 7.0);
    c += vec3(0.5, 0.56, 0.72) * uFlash * (0.25 + 1.6 * smoothstep(0.35, 0.8, fl)) * smoothstep(-0.02, 0.25, h);
  }
  return c;
}

float lampEmit(vec3 l){ return 0.25 + 0.75 * smoothstep(-0.25, 0.7, -l.y); }
// street lamps + passing headlights, for surfaces
vec3 streetLight(vec3 p, vec3 n){
  vec3 acc = vec3(0.0);
  int nl = int(uN.w);
  for (int i = 0; i < 64; i++) {
    if (i >= nl) break;
    vec4 a = D(i, 2);
    vec3 lv = vec3(a.x, a.y - 0.2, a.z) - p;
    float d2 = dot(lv, lv);
    if (d2 > 900.0) continue;
    vec4 c = D(i, 3);
    vec3 l = lv * inversesqrt(d2);
    acc += c.rgb * c.w * max(dot(n, l), 0.0) * lampEmit(-l) / (d2 + 1.5);
  }
  int nc = int(uN2.z);
  for (int i = 0; i < 40; i++) {
    if (i >= nc) break;
    vec4 a = D(i, 8);
    vec2 f = vec2(cos(a.z), sin(a.z));
    vec2 rel = p.xz - (a.xy + f * 2.2);
    float along = dot(rel, f);
    if (along < 0.0 || along > 40.0) continue;
    float side = abs(dot(rel, vec2(-f.y, f.x)));
    float beam = (1.0 - smoothstep(0.6 + along * 0.18, 1.6 + along * 0.32, side)) * (1.0 / (1.0 + along * along * 0.02));
    acc += vec3(1.0, 0.9, 0.75) * beam * 2.2 * max(n.y, 0.2) * step(p.y, 1.5);
  }
  return acc;
}

// one lit (or dark) room behind a window, entry point e in room space
vec3 room(vec3 e, vec3 d, vec2 cell, float seed, vec3 lc, float on, float tv){
  float fh = cell.y;
  vec3 sz = vec3(cell.x, fh, 4.6);
  vec3 tt = vec3(((d.x > 0.0 ? sz.x : 0.0) - e.x) / d.x, ((d.y > 0.0 ? sz.y : 0.0) - e.y) / d.y, (sz.z - e.z) / d.z);
  float t = min(min(tt.x, tt.y), tt.z);
  vec3 h = e + d * t;
  vec4 r = hash42(vec2(seed, 1.7));
  vec3 alb = vec3(0.55, 0.5, 0.44) * (0.75 + 0.5 * r.x);
  if (t == tt.z) {
    float sofa = step(h.y, 0.85) * step(0.35, r.y) * step(abs(h.x - sz.x * 0.5), sz.x * 0.36);
    alb = mix(alb, vec3(0.2, 0.13, 0.1) * (0.5 + hash32(vec2(seed, 3.0)) * 0.9), sofa);
    vec2 pc = vec2(sz.x * (0.3 + 0.4 * r.z), 1.75);
    float pic = step(abs(h.x - pc.x), 0.35) * step(abs(h.y - pc.y), 0.26) * step(0.5, r.w);
    alb = mix(alb, hash32(vec2(seed, 9.0)) * 0.6 + 0.1, pic);
    float shelf = step(0.7, r.z) * step(fract(h.y * 2.6), 0.08) * step(h.y, 2.0) * step(sz.x * 0.62, h.x);
    alb *= 1.0 - shelf * 0.6;
  } else if (t == tt.y) {
    alb = d.y > 0.0 ? vec3(0.78) : vec3(0.32, 0.2, 0.12) * (0.7 + 0.3 * step(0.5, fract(h.x * 0.8 + h.z * 0.1)));
  } else {
    alb *= 0.85 + 0.3 * r.w;
  }
  vec3 lp = vec3(sz.x * (0.35 + 0.3 * r.y), fh - 0.3, 1.6 + 2.2 * r.x);
  float dl = length(h - lp);
  float L = 2.2 / (1.0 + dl * dl * 0.35);
  if (h.y > fh - 0.02) L = 0.5 + 3.4 / (1.0 + dl * dl * 1.6);
  if (r.z > 0.72) { vec3 lp2 = vec3(0.5, 1.2, 3.5); float d2 = length(h - lp2); L = L * 0.35 + 1.3 / (1.0 + d2 * d2 * 1.2); }
  vec3 c = alb * lc * L * on;
  float flick = 0.45 + 0.55 * vnoise(vec2(uTime * 7.0, seed * 3.0)) * (0.6 + 0.4 * vnoise(vec2(uTime * 0.7, seed)));
  c += tv * vec3(0.35, 0.5, 0.95) * alb * flick * 0.9 / (1.0 + sq(h.z - 0.6) * 0.6);
  return c;
}

float segD(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }
float glyph(vec2 p, float seed){
  float d = 1e3;
  for (int i = 0; i < 4; i++) {
    vec4 h = hash42(vec2(seed, float(i) * 1.37));
    vec2 a = floor(h.xy * 3.0) * 0.5, b = floor(h.zw * 3.0) * 0.5;
    if (dot(a - b, a - b) < 0.01) b = vec2(1.0) - a;
    d = min(d, segD(p, a * 0.8 + 0.1, b * 0.8 + 0.1));
  }
  return d;
}

// facade parameters by style: floor height, column spacing, window size, sill
void facade(float st, out float fh, out float cs, out vec2 ws, out float sill, out vec3 wall){
  if (st < 0.5)      { fh = 3.1;  cs = 3.0; ws = vec2(1.25, 1.65); sill = 0.85; wall = vec3(0.21, 0.085, 0.055); }
  else if (st < 1.5) { fh = 3.4;  cs = 2.6; ws = vec2(1.05, 2.05); sill = 0.75; wall = vec3(0.3, 0.25, 0.19); }
  else if (st < 2.5) { fh = 2.95; cs = 3.6; ws = vec2(2.3, 1.45);  sill = 0.9;  wall = vec3(0.2, 0.2, 0.19); }
  else if (st < 3.5) { fh = 3.7;  cs = 1.8; ws = vec2(1.68, 2.6); sill = 0.55; wall = vec3(0.05, 0.055, 0.06); }
  else               { fh = 3.8;  cs = 2.3; ws = vec2(1.9, 2.5);  sill = 0.6;  wall = vec3(0.07, 0.07, 0.075); }
}

vec3 shadeRoofBox(vec3 p, vec3 rd, vec3 n, int id, bool lite){
  vec4 rb = D(id, 11), rp = D(id, 12);
  vec3 E = vec3(0.016, 0.012, 0.009) + (lite ? vec3(0.02) : streetLight(p + n * 0.05, n) * 0.6);
  vec3 alb = rp.z > 0.5 ? vec3(0.16, 0.12, 0.09) : vec3(0.12, 0.12, 0.115);
  if (rp.z > 0.5 && n.y < 0.5) alb *= 0.8 + 0.2 * step(0.5, fract(p.y * 3.0 + p.x * 0.01));
  if (rp.z < 0.5 && n.y < 0.5) alb *= 0.85 + 0.15 * step(0.08, fract((abs(n.x) > 0.5 ? p.z : p.x) * 1.6));
  vec3 c = alb * E + skyCol(reflect(rd, n)) * 0.05 * uWet;
  if (n.y > 0.5) c *= 0.8;
  return c;
}
vec3 shadeBuilding(vec3 p, vec3 rd, vec3 n, int id, float t, bool lite){
  if (id >= 1000) return shadeRoofBox(p, rd, n, id - 1000, lite);
  vec4 b = D(id, 0), q = D(id, 1);
  float H = q.x, seed = q.y, st = q.z, shop = q.w;
  float fh, cs, sill; vec2 ws; vec3 wall;
  facade(st, fh, cs, ws, sill, wall);
  if (n.y > 0.5) {
    // tar-and-gravel roof inside a parapet, puddles catching the sky
    float ex = min(min(p.x - b.x, b.z - p.x), min(p.z - b.y, b.w - p.z));
    float par = 1.0 - smoothstep(0.32, 0.38, ex);
    float ao = 0.55 + 0.45 * smoothstep(0.35, 1.6, ex);
    vec3 E = vec3(0.034, 0.026, 0.02) + (lite ? vec3(0.02) : streetLight(p + vec3(0.0, 0.1, 0.0), n) * 0.7);
    vec3 c = vec3(0.05, 0.048, 0.045) * (0.7 + 0.6 * vnoise(p.xz * 0.8)) * ao * E * 3.0;
    c = mix(c, vec3(0.16, 0.15, 0.14) * E * 3.0, par);
    float pud = smoothstep(0.55, 0.62, vnoise(p.xz * 0.35 + seed)) * (1.0 - par) * uWet;
    return c + skyCol(reflect(rd, n)) * (0.1 + 0.6 * pud);
  }
  bool front = abs(n.z) > 0.5;
  float u = front ? p.x - b.x : (n.x < 0.0 ? b.w - p.z : p.z - b.y);
  float width = front ? b.z - b.x : b.w - b.y;
  vec3 tang = front ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 0.0, n.x < 0.0 ? -1.0 : 1.0);
  vec3 inw = -n;
  float gh = 4.4;
  float ncol = floor(max(width - 1.2, 0.0) / cs);
  float margin = (width - ncol * cs) * 0.5;
  float ci = floor((u - margin) / cs);
  float fx = u - margin - ci * cs;
  float fl = floor((p.y - gh) / fh);
  float fy = p.y - gh - fl * fh;
  bool inCol = ci >= 0.0 && ci < ncol;
  bool upper = p.y > gh && p.y < H - 1.2 && fl < floor((H - 1.2 - gh) / fh);
  float faceId = front ? 0.0 : (n.x < 0.0 ? 1.0 : 2.0);
  vec3 cid = vec3(seed * 13.1 + faceId * 3.7 + ci, fl, seed);
  float h1 = hash13(cid), h2 = hash13(cid + 11.3), h3 = hash13(cid + 23.9);
  float period = 90.0 + 400.0 * h2;
  float cyc = floor(uTime / period + h3);
  float hl = hash13(cid + cyc * 7.77);
  float litP = st > 2.5 ? (hash12(vec2(seed, fl)) < 0.28 ? 0.85 : 0.04) : 0.22;
  litP *= uLitBias;
  float on = step(hl, litP);
  float tv = (1.0 - on) * step(hl, litP + 0.05);
  vec3 lc = uWinPal[int(h1 * 5.99)] * (0.7 + 0.6 * h2);
  vec2 wc = vec2(cs * 0.5, sill + ws.y * 0.5);
  vec2 wd = abs(vec2(fx, fy) - wc) - ws * 0.5;
  float inWin = (inCol && upper) ? step(max(wd.x, wd.y), 0.0) : 0.0;
  float lamp = 0.0;
  vec3 col;
  float detail = 1.0 - smoothstep(30.0, 140.0, t);
  vec3 sl = lite ? vec3(0.03, 0.02, 0.012) : streetLight(p + n * 0.05, n);
  vec3 amb = vec3(0.013, 0.011, 0.01) + vec3(0.035, 0.028, 0.022) * (1.0 - smoothstep(0.0, 30.0, p.y));
  amb += vec3(0.5, 0.55, 0.7) * uFlash * 0.25;
  if (inWin > 0.5) {
    vec3 e = vec3(fx - (wc.x - ws.x * 0.5), fy - sill, 0.02);
    vec3 dl = vec3(dot(rd, tang), rd.y, dot(rd, inw));
    float ctype = floor(h3 * 12.0);
    vec3 ic;
    if (lite) {
      ic = lc * on * 0.9 + tv * vec3(0.15, 0.22, 0.4);
    } else {
      ic = room(e, dl, vec2(ws.x, fh), seed + ci * 7.0 + fl * 31.0 + faceId, lc, on, tv);
      float zc = 0.14 / max(dl.z, 0.05);
      float cx = e.x + dl.x * zc;
      if (ctype < 1.0) {
        float gap = 0.15 + 0.5 * h2;
        float cov = step(cx, ws.x * (0.5 - gap * 0.5)) + step(ws.x * (0.5 + gap * 0.5), cx);
        float folds = 0.75 + 0.25 * sin(cx * 38.0 + h1 * 6.0);
        vec3 fab = hash32(cid.xy + 4.0) * 0.5 + 0.35;
        ic = mix(ic, (lc * on * 0.55 + tv * vec3(0.1, 0.15, 0.3) + 0.004) * fab * folds, cov);
      } else if (ctype < 1.6) {
        float sy = e.y + dl.y * zc;
        float slat = step(fract(sy * 11.0), 0.62) * step(sy, ws.y * (0.55 + 0.45 * h2));
        ic = mix(ic, (lc * on * 0.32 + 0.003) * vec3(0.95, 0.92, 0.85), slat);
      } else if (ctype < 2.5) {
        ic = mix(ic, lc * on * 0.5 + tv * 0.1 + 0.003, 0.65);
      }
    }
    float mull = step(abs(fx - wc.x), 0.035) + step(abs(fy - sill - ws.y * 0.68), 0.03) * step(st, 1.5);
    vec3 refl = skyCol(reflect(rd, n)) * 0.18 + sl * 0.01;
    float fr = 0.04 + 0.5 * pow(1.0 - abs(dot(rd, n)), 5.0);
    col = mix(ic, refl, fr * (on > 0.5 ? 0.3 : 1.0));
    col = mix(col, wall * (amb + sl) * 0.5, min(mull, 1.0) * detail);
    col += vec3(0.02, 0.03, 0.05) * pow(1.0 - abs(dot(rd, n)), 3.0);
  } else {
    vec3 alb = wall * (0.8 + 0.4 * hash12(vec2(seed, 2.0)));
    if (st < 0.5) {
      vec2 bq = vec2(u * 4.3 + floor(p.y * 13.0) * 0.5, p.y * 13.0);
      float mortar = max(step(0.88, fract(bq.x)), step(0.84, fract(bq.y)));
      alb *= 1.0 - mortar * 0.35 * detail;
      alb *= 0.85 + 0.3 * hash12(floor(bq) + seed) * detail;
    } else if (st < 2.5) {
      alb *= 1.0 - 0.25 * step(fract(p.y / fh), 0.06) * detail;
    }
    float stain = vnoise(vec2(u * 0.7, p.y * 0.08 + seed));
    alb *= 0.85 + 0.25 * stain * detail + 0.1 * (1.0 - detail);
    alb *= 1.0 - 0.25 * uWet;
    if (inCol && upper) {
      float dw = max(max(wd.x, wd.y), 0.0);
      float ac = step(0.72, h2) * step(st, 2.5) * step(abs(fx - wc.x - 0.15), 0.36) * step(abs(fy - sill + 0.32), 0.24);
      col = alb * (amb + sl) + lc * on * 0.05 * exp(-dw * 5.0) * alb * 6.0;
      float sillL = step(abs(fy - sill + 0.05), 0.05) * step(abs(fx - wc.x), ws.x * 0.55);
      col *= 1.0 + sillL * 0.4;
      if (ac > 0.5) col = vec3(0.06, 0.06, 0.058) * (amb + sl) * (1.0 + 2.0 * step(sill - 0.12, fy)) * (0.8 + 0.2 * step(0.5, fract(fx * 14.0)));
    } else {
      col = alb * (amb + sl);
    }
    if (p.y > H - 1.0) col *= 0.7 + 0.3 * step(H - 0.25, p.y);
  }
  // iron fire escape on some brick fronts: landings at every floor, a ladder between
  if (front && st < 0.5 && hash12(vec2(seed, 7.0)) < 0.55 && p.y > gh - 0.5 && p.y < H - 1.5 && !lite) {
    float fe0 = margin + cs * (1.0 + floor(hash12(vec2(seed, 8.0)) * max(ncol - 2.0, 1.0)));
    float lx = u - fe0;
    if (lx > -0.2 && lx < cs * 2.0 + 0.2) {
      float fy2 = fract((p.y - gh) / fh) * fh;
      float landing = step(fy2, 0.1) + step(abs(fy2 - 0.95), 0.025);
      float rail = step(abs(fract(lx * 2.2) - 0.5), 0.05) * step(fy2, 0.95);
      float lad = abs(lx - cs - (fy2 / fh) * cs * 0.8 + cs * 0.4);
      float ladder = step(lad, 0.06) * step(0.1, fy2);
      float iron = clamp(landing + rail * 0.6 + ladder, 0.0, 1.0);
      col = mix(col, vec3(0.012, 0.011, 0.01) + sl * 0.01, iron * detail);
    }
  }
  // ground floor shops, row A front faces only
  if (front && p.y < gh && id < int(uN.x)) {
    float sx = fract(u / 6.0);
    float pillar = step(sx, 0.07);
    bool sign = p.y > 3.35 && p.y < 4.25;
    float open = shop;
    vec3 sc = shop < 1.5 ? vec3(1.0, 0.98, 0.95) : (shop < 2.5 ? vec3(1.0, 0.68, 0.36) : (shop < 3.5 ? vec3(0.9, 0.95, 1.0) : vec3(0.0)));
    if (sign) {
      col = vec3(0.012) + sc * 0.08 * step(0.5, open);
    } else if (p.y > 0.35 && p.y < 3.15 && pillar < 0.5) {
      if (shop > 3.5 || shop < 0.5) {
        float corr = 0.85 + 0.15 * step(0.5, fract(p.y * 9.0)) * detail;
        col = vec3(0.035, 0.035, 0.038) * corr * (amb + sl) + vec3(0.02, 0.013, 0.007) * step(shop, 0.5);
      } else {
        vec3 e = vec3(fract(u / 6.0) * 6.0, p.y, 0.02);
        vec3 dl = vec3(dot(rd, tang), rd.y, max(dot(rd, inw), 0.05));
        vec3 ic = lite ? sc * 1.2 : room(e, dl, vec2(6.0, 4.0), seed * 3.3 + floor(u / 6.0), sc * 1.6, 1.0, 0.0);
        float shelves = step(0.5, fract((e.y + dl.y * 3.0) * 2.2)) * 0.3;
        col = ic * (1.0 - shelves) + skyCol(reflect(rd, n)) * 0.05;
      }
    } else {
      col = vec3(0.04) * (amb + sl) * 3.0;
    }
  }
  // neon signs mounted on the facades
  if (front && !lite) {
    int ns = int(uN2.x);
    for (int i = 0; i < 24; i++) {
      if (i >= ns) break;
      vec4 r = D(i, 4); vec4 m = D(i, 5);
      if (abs(m.x - p.z) > 0.4 || p.x < r.x || p.x > r.z || p.y < r.y || p.y > r.w) continue;
      vec3 nc = uNeonPal[int(m.y)];
      if (m.w < 0.5) {
        float gw = (r.w - r.y);
        float k = (p.x - r.x) / gw;
        float gi = floor(k);
        vec2 gp = vec2(fract(k), (p.y - r.y) / gw);
        float dd = glyph(gp, m.z + gi);
        float faulty = step(fract(m.z * 3.1 + gi * 0.37), 0.07);
        float flick = mix(step(0.01, hash12(vec2(floor(uTime * 6.0), m.z + gi))), step(0.45, vnoise(vec2(uTime * 4.0, gi + m.z))), faulty);
        col = col * 0.4 + nc * ((1.0 - smoothstep(0.0, 0.08, dd)) * 6.0 + exp(-dd * 18.0) * 0.8) * flick;
      } else if (m.w < 1.5) {
        vec2 lp = (p.xy - r.xy) / (r.zw - r.xy);
        float txt = glyph(vec2(fract(lp.x * 5.0), lp.y * 1.2 - 0.1), m.z + floor(lp.x * 5.0));
        col = nc * (1.6 - 1.3 * (1.0 - smoothstep(0.04, 0.09, txt)) * step(0.15, lp.y) * step(lp.y, 0.85));
      } else {
        vec2 lp = (p.xy - (r.xy + r.zw) * 0.5) / (r.w - r.y);
        float cr = max(min(abs(lp.x), abs(lp.y)) - 0.1, max(abs(lp.x), abs(lp.y)) - 0.32);
        col = col * 0.3 + nc * ((1.0 - step(0.0, cr)) * 4.0 + exp(-max(cr, 0.0) * 12.0) * 0.4) * (0.85 + 0.15 * sin(uTime * 2.0));
      }
    }
  }
  return col;
}

// --- street furniture ---------------------------------------------------------
float cylT(vec2 ro, vec2 rd, vec2 c, float r){
  vec2 oc = ro - c; float a = dot(rd, rd), bq = dot(oc, rd), cq = dot(oc, oc) - r * r;
  float disc = bq * bq - a * cq;
  if (disc < 0.0) return -1.0;
  return (-bq - sqrt(disc)) / a;
}
void tracePoles(vec3 ro, vec3 rd, vec3 ird, inout float tB, inout vec3 nB, inout int kind, inout float aux){
  int nl = int(uN.w);
  vec2 rdxz = rd.xz; float l2 = dot(rdxz, rdxz);
  for (int i = 0; i < 64; i++) {
    if (i >= nl) break;
    vec4 a = D(i, 2);
    vec2 pc = vec2(a.x, a.w);
    vec2 mc = vec2(a.x, (a.z + a.w) * 0.5);
    float along = dot(mc - ro.xz, rdxz) / l2;
    vec2 cl = ro.xz + rdxz * along - mc;
    if (dot(cl, cl) > 9.0 || along < 0.0) continue;
    float t = cylT(ro.xz, rdxz, pc, 0.1);
    if (t > 0.0 && t < tB) { float y = ro.y + rd.y * t; if (y > 0.0 && y < a.y + 0.2) { tB = t; vec2 nn = normalize(ro.xz + rdxz * t - pc); nB = vec3(nn.x, 0.0, nn.y); kind = 3; aux = float(i); } }
    vec3 nn;
    vec2 tt = boxT(ro, ird, vec3(a.x - 0.06, a.y + 0.08, min(a.z, a.w)), vec3(a.x + 0.06, a.y + 0.2, max(a.z, a.w)), nn);
    if (tt.x < tt.y && tt.x > 0.0 && tt.x < tB) { tB = tt.x; nB = nn; kind = 3; aux = float(i); }
    tt = boxT(ro, ird, vec3(a.x - 0.32, a.y, a.z - 0.42), vec3(a.x + 0.32, a.y + 0.2, a.z + 0.42), nn);
    if (tt.x < tt.y && tt.x > 0.0 && tt.x < tB) { tB = tt.x; nB = nn; kind = 3; aux = float(i) + (nn.y < -0.5 ? 0.5 : 0.0); }
  }
  // traffic signal poles and mast arm
  vec3 nn;
  for (int i = 0; i < 2; i++) {
    vec2 pc = i == 0 ? vec2(73.6, 16.6) : vec2(56.2, 16.6);
    float t = cylT(ro.xz, rdxz, pc, 0.13);
    if (t > 0.0 && t < tB) { float y = ro.y + rd.y * t; if (y > 0.0 && y < 6.6) { tB = t; vec2 q = normalize(ro.xz + rdxz * t - pc); nB = vec3(q.x, 0.0, q.y); kind = 3; aux = -1.0; } }
  }
  vec2 tt = boxT(ro, ird, vec3(73.5, 6.3, 7.8), vec3(73.7, 6.45, 16.6), nn);
  if (tt.x < tt.y && tt.x > 0.0 && tt.x < tB) { tB = tt.x; nB = nn; kind = 3; aux = -1.0; }
  tt = boxT(ro, ird, vec3(73.35, 5.1, 9.2), vec3(73.6, 6.3, 9.55), nn);
  if (tt.x < tt.y && tt.x > 0.0 && tt.x < tB) { tB = tt.x; nB = nn; kind = 6; aux = (ro.y + rd.y * tt.x - 5.1) / 1.2; }
  tt = boxT(ro, ird, vec3(73.35, 3.3, 16.95), vec3(73.6, 4.5, 17.3), nn);
  if (tt.x < tt.y && tt.x > 0.0 && tt.x < tB) { tB = tt.x; nB = nn; kind = 6; aux = (ro.y + rd.y * tt.x - 3.3) / 1.2; }
}
void traceCars(vec3 ro, vec3 rd, inout float tB, inout vec3 nB, inout int kind, inout float aux, out vec3 lp){
  int nc = int(uN2.z);
  lp = vec3(0.0);
  for (int i = 0; i < 40; i++) {
    if (i >= nc) break;
    vec4 a = D(i, 8);
    float bus = step(1.5, a.w);
    float len = mix(4.5, 12.0, bus), wid = mix(1.82, 2.55, bus);
    vec2 rel = a.xy - ro.xz;
    vec2 rdxz = rd.xz;
    float al = dot(rel, rdxz) / dot(rdxz, rdxz);
    vec2 cl = ro.xz + rdxz * al - a.xy;
    if (al < 0.0 || dot(cl, cl) > sq(len * 0.6 + 1.0)) continue;
    float c = cos(a.z), s = sin(a.z);
    mat2 toL = mat2(c, -s, s, c);
    vec2 o2 = toL * (ro.xz - a.xy), d2 = toL * rd.xz;
    vec3 lo = vec3(o2.x, ro.y, o2.y), ld = vec3(d2.x, rd.y, d2.y);
    vec3 ild = 1.0 / mix(ld, vec3(1e-6), lessThan(abs(ld), vec3(1e-6)));
    vec3 nn;
    vec2 t = boxT(lo, ild, vec3(-len * 0.5, 0.28, -wid * 0.5), vec3(len * 0.5, mix(1.02, 3.1, bus), wid * 0.5), nn);

vec3 lampHalo(vec3 ro, vec3 rd, float tMax){
