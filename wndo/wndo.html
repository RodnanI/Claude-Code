    });
    return { A, B, T, lamps, farLamps, signs, blades };
  }

  const NEON = ['#ff3b30', '#ff5fa2', '#3ef0d0', '#ffb347', '#7dff6a', '#f2f2ff', '#ff2266', '#59c8ff'].map(W.lin);
  const NEON_PAL = new Float32Array(NEON.flat());
  const WIN = [2400, 2700, 2900, 3200, 3700, 4600].map((k) => W.kelvin(k));
  const WIN_PAL = new Float32Array(WIN.map((c) => c.map((v) => v * 1.1)).flat());

  // cars on paths --------------------------------------------------------------
  function polyPath(pts) {
    const seg = [];
    let L = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
      seg.push([a, b, L, l]);
      L += l;
    }
    return {
      L,
      at(s) {
        s = W.clamp(s, 0, L - 1e-3);
        let k = 0;
        while (k < seg.length - 1 && seg[k][2] + seg[k][3] < s) k++;
        const [a, b, s0, l] = seg[k], u = (s - s0) / l;
        return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, Math.atan2(b[1] - a[1], b[0] - a[0])];
      },
    };
  }
  function bez(p0, p1, p2, p3, n) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      out.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
    }
    return out;
  }
  const PATHS = {
    near: polyPath([[-160, 7.4], [620, 7.4]]),
    far: polyPath([[620, 11.6], [-160, 11.6]]),
    farTurn: polyPath([[620, 11.6], [73, 11.6], ...bez([73, 11.6], [69, 11.6], [67.5, 13.5], [67.5, 17], 8).slice(1), [67.5, 320]]),
    crossIn: polyPath([[62.5, 320], [62.5, 17.5], ...bez([62.5, 17.5], [62.5, 13.8], [61, 11.6], [57, 11.6], 8).slice(1), [-160, 11.6]]),
  };
  // where cars must stop when their light is red (arc length on the path)
  const STOPS = { near: 160 + 54.2, far: 620 - 75.8, farTurn: 620 - 75.8, crossIn: 320 - 19.5 };

  const scene = {
    id: 'city',
    name: 'City Rain',
    sub: 'sixth floor, a wet avenue, 2 a.m.',
    audio: 'city',
    bokehBg: ['#1a1410', '#120e0b', '#07080a'],
    defaults: { rain: 0.7, wind: 0.3, fog: 0.35, cond: 0.22, frost: 0, lightning: 1, traffic: 0.6 },
    controls: ['rain', 'wind', 'fog', 'cond', 'lightning', 'traffic'],
    look: {
      frame: 'cross', material: 'steel', wall: '#cfc6b8', lamp: 2.4, candle: true, mug: true, plant: true,
      exposure: 0.9, sat: 1.06, contrast: 1.1, lift: [0.012, 0.01, 0.012], gain: [1.0, 0.98, 0.95],
      bloom: 0.05, halo: 1.0, dTyp: 35, reflStretch: 3.5, refl: 1, flowAng: 0,
    },

    init(R) {
      const G = R.G, gl = R.gl;
      this.prog = G.program(W.SH.vert, GLSL, 'city');
      this.city = makeCity(7);
      const c = this.city;
      this.data = new Float32Array(DW * ROWS * 4);
      const put = (x, y, v) => this.data.set(v, (y * DW + x) * 4);
      const blds = [...c.A, ...c.B, ...c.T];
      blds.forEach((b, i) => {
        put(i, 0, [b[0], b[1], b[2], b[3]]);
        put(i, 1, [b[4], b[5], b[6], b[7]]);
        if (b.roof) {
          put(i, 11, b.roof.slice(0, 4));
          put(i, 12, [0, b.roof[4], b.roof[5], 0]);
        }
      });
      c.lamps.forEach((l, i) => {
        put(i, 2, [l.x, l.y, l.z, l.zp]);
        put(i, 3, [l.c[0], l.c[1], l.c[2], l.i * 20]);
      });
      c.signs.forEach((s, i) => {
        put(i, 4, [s[0], s[1], s[2], s[3]]);
        put(i, 5, [s[4], s[5], s[6], s[7]]);
      });
      c.blades.forEach((b, i) => {
        put(i, 6, [b[0], b[1], b[2], b[3]]);
        put(i, 7, [b[4], b[5], b[6], 0]);
      });
      this.tex = G.dataTexture(DW, ROWS, this.data);
      this.N = [c.A.length, c.B.length, c.T.length, c.lamps.length];
      this.cars = [];
      this.people = [];
      this.signal = { t: 0 };
      this.spawnT = { near: 0, far: 3, crossIn: 6 };
      const r = (this.r = W.rng(99));
      for (let i = 0; i < 8; i++) {
        this.people.push({ x: r.range(-20, 140), z: r.chance(0.5) ? 16.6 + r.range(-0.4, 0.6) : 1.6 + r.range(-0.3, 0.5), dir: r.chance(0.5) ? 1 : -1, v: r.range(1.1, 1.5), ph: r() * 10, umb: r.pick([0.1, 0.4, 0.6, 0.75, 0.9, 0.3, 0.5]) });
      }
      // pre-run the traffic so the street is busy on arrival
      for (let i = 0; i < 900; i++) this.sim(1 / 10, 0.6, i / 10);
      this.cam = { base: [0, 17.2, -0.6], yaw: 0.72, pitch: -0.24, fovY: 58 };
    },

    signalState(t) {
      // main green 24s, yellow 3.5s, red 16s (cross street goes)
      const cyc = 43.5, u = t % cyc;
      if (u < 24) return { main: 'g', cross: 'r', walk: 0 };
      if (u < 27.5) return { main: 'y', cross: 'r', walk: 0 };
      if (u < 40) return { main: 'r', cross: 'g', walk: 1 };
      return { main: 'r', cross: 'y', walk: 0 };
    },

    sim(dt, traffic, t) {
      const r = this.r;
      const sig = this.signalState(t);
      // spawn
      for (const k of ['near', 'far', 'crossIn']) {
        this.spawnT[k] -= dt;
        if (this.spawnT[k] <= 0) {
          const rate = k === 'crossIn' ? 0.06 : 0.16;
          this.spawnT[k] = (1 / (rate * (0.2 + traffic * 1.6))) * r.range(0.4, 1.8);
          let path = k;
          if (k === 'far' && r.chance(0.18)) path = 'farTurn';
          const last = this.cars.filter((c) => c.path === path || (k === 'far' && (c.path === 'far' || c.path === 'farTurn'))).reduce((m, c) => Math.min(m, c.s), 1e9);
          if (last > 14) {
            const type = r.chance(0.07) ? 2 : r.chance(0.15) ? 1 : 0;
            const pal = ['#0c0d0f', '#1b1c1f', '#d8d8d4', '#8c8f93', '#5a0c0c', '#13213a', '#2a2f26', '#6b6e70'];
            this.cars.push({ path, s: 0, v: r.range(9, 12.5), vmax: r.range(9.5, 13), type, col: W.lin(r.pick(pal)), brake: 0, ph: r() * 10 });
          }
        }
      }
      // drive: follow the car ahead on the same lane, stop for red
      const lane = (c) => (c.path === 'farTurn' && c.s < 548 ? 'far' : c.path);
      for (const c of this.cars) {
        const P = PATHS[c.path];
        let gap = 1e9;
        for (const o of this.cars) {
          if (o === c) continue;
          const same = lane(o) === lane(c) || (o.path === c.path);
          if (!same) continue;
          const d = o.s - c.s - (o.type === 2 ? 12 : 4.6);
          if (d > -2 && d < gap) gap = d;
        }
        const stop = STOPS[c.path];
        const light = c.path === 'crossIn' ? sig.cross : sig.main;
        const toStop = stop - c.s;
        if (light !== 'g' && toStop > -0.5 && toStop < 60 && !(light === 'y' && toStop < c.v * 1.2)) gap = Math.min(gap, toStop - 0.5);
        const want = gap < 1e8 ? Math.min(c.vmax, Math.sqrt(2 * 4.5 * Math.max(gap - 2.0, 0))) : c.vmax;
        const prev = c.v;
        c.v = want > c.v ? Math.min(want, c.v + 2.4 * dt) : Math.max(want, c.v - 7 * dt, 0);
        c.brake = c.v < prev - 0.002 || c.v < 0.3 ? 1 : 0;
        c.s += c.v * dt;
      }
      this.cars = this.cars.filter((c) => c.s < PATHS[c.path].L - 1);
      // pedestrians wander along the pavements
      for (const p of this.people) {
        p.x += p.dir * p.v * dt;
        p.ph += dt * p.v * 1.2;
        if (p.x > 160) p.x = -30;
        if (p.x < -30) p.x = 160;
      }
    },

    update(dt, t, env, R) {
      const L = R.lights;
      const c = this.city;
      this.sim(Math.min(dt, 0.1), env.traffic, t + 900 / 10);
      const sig = this.signalState(t + 90);
      this.sig = sig;
      const wetRefl = 0.35 + 0.65 * env.wet;
      // street lamps
      for (const l of c.lamps) {
        const k = l.i * 180;
        L.addRefl(l.x, l.y - 0.22, l.z, 0.22, l.c[0] * k, l.c[1] * k, l.c[2] * k, 1.0, l.cross ? 0 : 0.3 * wetRefl);
      }
      for (const f of c.farLamps) L.addRefl(f[0], f[1] - 0.22, f[2], 0.22, f[3][0] * 180, f[3][1] * 180, f[3][2] * 180, 0.8, 0.25 * wetRefl);
      // signals
      const red = [1, 0.04, 0.01], amber = [1, 0.42, 0.02], green = [0.12, 1, 0.55];
      const sc = sig.main === 'r' ? red : sig.main === 'y' ? amber : green;
      const sy = sig.main === 'r' ? 0.8 : sig.main === 'y' ? 0.5 : 0.2;
      for (const [y0, z] of [[5.1, 9.37], [3.3, 17.12]]) {
        L.addRefl(73.3, y0 + sy * 1.2, z, 0.13, sc[0] * 120, sc[1] * 120, sc[2] * 120, 0.6, 0.35 * wetRefl);
      }
      const walk = sig.walk ? [0.9, 0.95, 1.0] : [1.0, 0.45, 0.08];
      L.add(56.3, 2.7, 16.4, 0.12, walk[0] * 40, walk[1] * 40, walk[2] * 40, 0.3);
      L.add(73.7, 2.7, 16.4, 0.12, walk[0] * 40, walk[1] * 40, walk[2] * 40, 0.3);
      // cars
      const carData = new Float32Array(DW * 2 * 4);
      let n = 0;
      for (const car of this.cars) {
        const [x, z, h] = PATHS[car.path].at(car.s);
        if (n < 40) {
          carData.set([x, z, h, car.type], n * 4);
          carData.set([car.col[0], car.col[1], car.col[2], car.brake], (DW + n) * 4);
          n++;
        }
        const fx = Math.cos(h), fz = Math.sin(h), sx = -fz, sz = fx;
        const len = car.type === 2 ? 12 : 4.5, hw = car.type === 2 ? 1.0 : 0.62;
        const g = wetRefl * 0.55;
        for (const s of [-1, 1]) {
          const hx = x + fx * len * 0.5 + sx * hw * s, hz = z + fz * len * 0.5 + sz * hw * s;
          L.addRefl(hx, 0.72, hz, 0.12, 300, 270, 230, 1.0, g * 0.7);
          const tx = x - fx * len * 0.5 + sx * hw * s, tz = z - fz * len * 0.5 + sz * hw * s;
          const tb = car.brake ? 70 : 22;
          L.addRefl(tx, 0.8, tz, 0.1, tb, tb * 0.03, tb * 0.012, 0.8, g);
        }
        if (car.type === 1) L.add(x - fx * 0.3, 1.62, z - fz * 0.3, 0.14, 40, 30, 8, 0.4);
        if (car.type === 2) for (let k = -2; k <= 2; k++) L.add(x + fx * k * 2.2, 2.0, z + fz * k * 2.2, 0.6, 6, 5.5, 4.5, 0, 3);
      }
      this.carCount = n;
      const pd = new Float32Array(DW * 4);
      this.people.forEach((p, i) => pd.set([p.x, p.z, p.ph, p.umb], i * 4));
      const gl = R.gl;
      gl.bindTexture(gl.TEXTURE_2D, this.tex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 8, DW, 2, gl.RGBA, gl.FLOAT, carData);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 10, DW, 1, gl.RGBA, gl.FLOAT, pd);
      // neon and shop glow (bokeh only for the big soft shop windows)
      c.signs.forEach((s, i) => {
        const col = NEON[s[5]];
        const k = s[7] === 1 ? 9 : 16;
        const cx = (s[0] + s[2]) * 0.5, cy = (s[1] + s[3]) * 0.5;
        L.addRefl(cx, cy, s[4] - 0.15, Math.min(0.5, (s[2] - s[0]) * 0.2), col[0] * k, col[1] * k, col[2] * k, 0.5, 0.25 * wetRefl);
        if (s[2] - s[0] > 3) L.add(s[0] + 0.6, cy, s[4] - 0.15, 0.3, col[0] * k * 0.6, col[1] * k * 0.6, col[2] * k * 0.6, 0.3);
      });
      c.blades.forEach((b) => {
        const col = NEON[b[5]];
        for (let y = b[2] + 0.6; y < b[3]; y += 1.8) L.add(b[0] - 0.13, y, b[1] - 0.45, 0.25, col[0] * 10, col[1] * 10, col[2] * 10, 0.3);
      });
      c.A.forEach((b) => {
        if (b[0] > 300 || b[7] === 0 || b[7] === 4) return;
        const col = b[7] === 1 ? [1, 0.97, 0.92] : b[7] === 2 ? [1, 0.62, 0.3] : [0.9, 0.95, 1];
        for (let x = b[0] + 3; x < b[2] - 1; x += 6) L.add(x, 1.8, b[1] - 0.3, 1.1, col[0] * 1.6, col[1] * 1.6, col[2] * 1.6, 0, 3);
      });
      // the skyline: aircraft warning lights and a scatter of far windows
      c.T.forEach((b, i) => {
        const on = Math.sin(t * 2.4 + i) > 0.2 ? 1 : 0.04;
        L.add((b[0] + b[2]) / 2, b[4] + 1, b[1], 0.9, 160 * on, 6 * on, 3 * on, 0.5);
      });
      if (!this.far) {
        const r = W.rng(5);
        this.far = [];
        for (const b of c.T) for (let k = 0; k < 14; k++) this.far.push([r.range(b[0], b[2]), r.range(5, b[4] - 4), b[1] - 0.5, r.pick(WIN)]);
        for (const b of c.B) if (r.chance(0.6)) for (let k = 0; k < 4; k++) this.far.push([r.range(b[0], b[2]), r.range(6, b[4] - 3), b[1] - 0.3, r.pick(WIN)]);
        // row A windows on the facade grid, so discs sit where windows are
        const FH = [3.1, 3.4, 2.95, 3.7], CS = [3.0, 2.6, 3.6, 1.8], SILL = [0.85, 0.75, 0.9, 0.55], WH = [1.65, 2.05, 1.45, 2.6];
        for (const b of c.A) {
          if (b[0] > 260) continue;
          const st = b[6], w = b[2] - b[0], nc = Math.floor(Math.max(w - 1.2, 0) / CS[st]), m = (w - nc * CS[st]) / 2;
          const nf = Math.floor((b[4] - 1.2 - 4.4) / FH[st]);
          for (let fl = 0; fl < nf; fl++) for (let ci = 0; ci < nc; ci++) {
            if (!r.chance(st === 3 ? 0.3 : 0.22)) continue;
            this.far.push([b[0] + m + (ci + 0.5) * CS[st], 4.4 + fl * FH[st] + SILL[st] + WH[st] * 0.5, b[1] - 0.1, r.pick(WIN), 0.75]);
          }
        }
      }
      for (const f of this.far) { const s = f[4] || 0.9, k = f[4] ? 2.6 : 2.2; L.add(f[0], f[1], f[2], s, f[3][0] * k, f[3][1] * k, f[3][2] * k, 0, 3); }
      // pedestrians' umbrellas glint
      this.ped = this.people;
    },

    render(R, t, dt, P) {
      const sig = this.sig || { main: 'g', walk: 0 };
      const p = this.prog.use();
      p.set(R.camUniforms());
      p.set({
        uTime: t, uData: this.tex,
        uN: this.N, uN2: [this.city.signs.length, this.city.blades.length, this.carCount || 0, this.people.length],
        uRain: P.env.rain, uWind: P.env.wind, uFlash: P.env.flash, uFog: P.env.fog, uWet: P.env.wet, uLitBias: 1,
        uSig: [sig.main === 'r' ? 1 : 0, sig.main === 'y' ? 1 : 0, sig.main === 'g' ? 1 : 0, sig.walk],
        uWinPal: WIN_PAL, uNeonPal: NEON_PAL,
      });
      R.G.drawFS();
    },
  };

  W.scenes = W.scenes || [];
  W.scenes.push(scene);
})();

</script>
<script>
// src/scenes/forest.js
// wndo :: Pine Wind. A birch clearing and dark pines from a cabin window, on a gusty afternoon.
(() => {
  const W = window.W;

  const BG = /* glsl */ `
${W.GLSL.common}
${W.GLSL.camera}
uniform float uSun, uGust, uWind, uRain, uFog, uFlash;
uniform vec3 uSunDir;
out vec4 o;
vec3 sky(vec3 rd){
  float h = max(rd.y, 0.0);
  vec3 base = mix(vec3(0.66, 0.67, 0.68), vec3(0.4, 0.45, 0.52), pow(h, 0.55));
  vec2 cp = rd.xz / (h + 0.08) * 0.55 + vec2(uTime * 0.018 * (0.4 + uWind), uTime * 0.004);
  float n = fbm(cp);
  float n2 = fbm(cp * 2.3 + 4.0);
  base *= 0.72 + 0.5 * n + 0.12 * n2;
  float mu = max(dot(rd, uSunDir), 0.0);
  float gap = smoothstep(0.42, 0.7, n);
  base += vec3(1.0, 0.86, 0.62) * uSun * (pow(mu, 10.0) * 0.5 + pow(mu, 300.0) * 6.0 * gap);
  base *= 1.0 - uRain * 0.35;
  return base * 1.35 + uFlash * 0.4;
}
float treeline(float x, float seed, float hgt){
  float cell = 4.6;
  float i = floor(x / cell), f = fract(x / cell) - 0.5;
  float h = 0.0;
  for (int k = -1; k <= 1; k++) {
    float id = i + float(k);
    vec2 r = hash22(vec2(id, seed));
    float th = hgt * (0.55 + 0.7 * r.x);
    float dx = abs(f - float(k) - (r.y - 0.5) * 0.6) * cell;
    float jag = (vnoise(vec2(x * 2.1, seed + id)) - 0.5) * th * 0.12 * step(0.2, dx);
    h = max(h, th * (1.0 - dx / (th * 0.24)) + jag);
  }
  return h;
}
void main(){
  vec3 ro = uCamPos, rd = camRay(gl_FragCoord.xy);
  float rxz = length(rd.xz);
  float az = atan(rd.x, rd.z);
  vec3 amb = vec3(0.3, 0.32, 0.35) * (1.0 - uRain * 0.3) + uFlash * 0.3;
  vec3 sunC = vec3(1.0, 0.86, 0.66) * uSun * 1.4;
  vec3 fogC = vec3(0.5, 0.53, 0.56) * (1.0 - uRain * 0.3);
  float fogD = 0.003 + uFog * 0.008 + uRain * 0.006;
  vec3 col = sky(rd);
  float dist = 9000.0;
  float tg = rd.y < 0.0 ? -ro.y / rd.y : 1e9;
  float hd = tg * rxz;
  // three walls of misty conifers at 110, 210, 380 m
  float D[3]; D[0] = 110.0; D[1] = 210.0; D[2] = 380.0;
  for (int i = 0; i < 3; i++) {
    if (hd < D[i]) break;
    float y = ro.y + D[i] * rd.y / rxz;
    float th = treeline(az * D[i], float(i) * 7.3, 18.0 + float(i) * 8.0) + vnoise(vec2(az * 6.0, float(i))) * 14.0;
    if (y < th) {
      float dd = D[i] / rxz;
      vec3 tc = vec3(0.05, 0.075, 0.06) * (amb + sunC * 0.4) * (0.75 + 0.5 * vnoise(vec2(az * D[i] * 1.5, y * 0.8)));
      col = mix(tc, fogC, 1.0 - exp(-dd * fogD * (1.0 + float(i) * 0.3)));
      dist = dd;
      break;
    }
  }
  if (rd.y < 0.0 && hd < D[0]) {
    vec3 p = ro + rd * tg;
    float edge = smoothstep(32.0, 48.0, p.z + vnoise(p.xz * 0.05) * 14.0);
    vec3 g1 = vec3(0.13, 0.2, 0.05), g2 = vec3(0.28, 0.27, 0.08);
    vec3 alb = mix(g1, g2, vnoise(p.xz * 0.15)) * (0.75 + 0.5 * vnoise(p.xz * 1.3));
    alb = mix(alb, vec3(0.07, 0.07, 0.04), edge);
    // fine blades: streaks across the screen that tighten with distance
    float bl = vnoise(vec2(gl_FragCoord.x * 0.55 + p.z * 3.0, p.z * 7.0)) * 0.6 + vnoise(vec2(gl_FragCoord.x * 1.3, p.z * 16.0)) * 0.4;
    alb *= mix(1.0, 0.62 + 0.75 * bl, (1.0 - edge) * (1.0 - smoothstep(10.0, 60.0, tg)));
    // the wind running through the grass as moving bands of light
    float wave = sin(p.x * 0.22 + p.z * 0.35 - uTime * (1.6 + uWind * 2.6) + vnoise(p.xz * 0.08) * 4.0);
    float wv = smoothstep(0.3, 1.0, wave) * (0.15 + uGust * 0.6) * (1.0 - edge);
    alb *= 1.0 + wv * 0.55;
    float cloudSh = 0.55 + 0.45 * smoothstep(0.35, 0.7, fbm(p.xz * 0.01 + vec2(uTime * 0.03, 0.0)));
    col = alb * (amb + sunC * cloudSh * (1.0 - edge * 0.8)) * (1.0 - uRain * 0.25);
    col = mix(col, fogC, 1.0 - exp(-tg * fogD));
    dist = tg;
  }
  o = vec4(col, dist);
}
`;

  // leaves and rain blowing past, a few metres from the glass
  const FG = /* glsl */ `
${W.GLSL.common}
${W.GLSL.camera}
uniform float uGust, uWind, uRain, uSun, uLeaves;
uniform sampler2D uDepth;
uniform vec2 uSunUV;
uniform vec4 uBirds[10];
uniform float uBirdN;
out vec4 o;
void main(){
  vec3 rd = camRay(gl_FragCoord.xy);
  vec3 shafts = vec3(0.0);
  if (uSun > 0.02) {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec2 stp = (uSunUV - uv) / 20.0;
    float acc = 0.0, w = 1.0;
    vec2 q = uv + stp * hash12(gl_FragCoord.xy + fract(uTime) * 61.0);
    for (int i = 0; i < 20; i++) {
      vec4 s = texture(uDepth, q);
      acc += step(5000.0, s.a) * w;
      w *= 0.93;
      q += stp;
    }
    float fall = exp(-length((uv - uSunUV) * vec2(uRes.x / uRes.y, 1.0)) * 1.6);
    shafts = vec3(1.0, 0.86, 0.6) * acc * 0.045 * uSun * fall * (0.6 + 0.4 * uGust);
  }
  vec3 R = uCamMat[0], U = uCamMat[1];
  vec4 acc = vec4(0.0);
  float wsp = 1.5 + uWind * 5.0 + uGust * 6.0;
  for (int i = 0; i < 5; i++) {
    float d = 3.0 * pow(1.55, float(i));
    vec2 q = vec2(dot(rd, R), dot(rd, U)) * d;
    vec2 cell = vec2(1.1);
    q.x -= uTime * wsp * (0.8 + 0.1 * float(i));
    q.y += uTime * (0.7 + 0.2 * float(i)) - sin(q.x * 0.3 + uTime) * 0.3;
    vec2 g = q / cell; vec2 id = floor(g); vec2 f = fract(g) - 0.5;
    vec4 h = hash42(id + float(i) * 13.0);
    if (h.w > uLeaves * 0.45) continue;
    f -= (h.xy - 0.5) * 0.5;
    float spin = uTime * (1.5 + h.z * 4.0) + h.x * 6.0;
    vec2 lq = rot(spin) * f;
    float flip = cos(spin * 0.7 + h.y * 3.0);
    lq.x /= max(abs(flip), 0.15);
    float sz = 0.055 + h.z * 0.04;
    float leaf = length(lq / vec2(sz, sz * 0.55)) - 1.0 + abs(lq.y) * 2.0;
    float px = 1.5 / (uRes.y * 0.5 / uTanHalf.y) * d / cell.x;
    float cov = 1.0 - smoothstep(-px * 4.0, px * 4.0, leaf * sz);
    if (cov <= 0.0) continue;
    vec3 lc = mix(vec3(0.55, 0.38, 0.06), vec3(0.42, 0.2, 0.04), h.y);
    lc = mix(lc, vec3(0.3, 0.33, 0.08), step(0.75, h.x));
    lc *= (0.35 + 0.25 * flip + uSun * 0.5) * (0.6 + 0.4 * step(0.0, flip));
    acc.rgb = mix(acc.rgb, lc, cov);
    acc.a = max(acc.a, cov);
  }
  if (uRain > 0.01) {
    for (int i = 0; i < 4; i++) {
      float d = 2.0 * pow(1.7, float(i));
      vec2 q = vec2(dot(rd, R), dot(rd, U)) * d;
      q.x += q.y * (0.25 + uGust * 0.5);
      q.y += uTime * 8.0;
      vec2 cell = vec2(0.13, 1.4);
      vec2 g = q / cell; vec2 id = floor(g); vec2 f = fract(g);
      vec3 h = hash32(id + float(i) * 7.0);
      if (h.z > uRain * 0.6) continue;
      float px = 1.0 / (uRes.y * 0.5 / uTanHalf.y) * d / cell.x;
      float s = (1.0 - smoothstep(0.0, px + 0.03, abs(f.x - h.x))) * smoothstep(h.y * 0.5, h.y * 0.5 + 0.1, f.y) * (1.0 - smoothstep(h.y * 0.5 + 0.3, h.y * 0.5 + 0.5, f.y));
      acc.rgb += vec3(0.55, 0.58, 0.6) * s * 0.12 * (1.0 - acc.a);
      acc.a = max(acc.a, s * 0.12);
    }
  }
  // birds: small flapping silhouettes, hidden behind nearer trees
  float sceneD = texture(uDepth, gl_FragCoord.xy / uRes).a;
  for (int i = 0; i < 10; i++) {
    if (float(i) >= uBirdN) break;
    vec4 b = uBirds[i];
    vec3 v = b.xyz - uCamPos;
    float tc = dot(v, rd);
    if (tc <= 0.0 || tc > sceneD) continue;
    vec3 q = uCamPos + rd * tc - b.xyz;
    vec2 l = vec2(dot(q, R), dot(q, U)) / 0.32;
    float flap = sin(b.w) * 0.55;
    l.x = abs(l.x);
    float wing = abs(l.y - l.x * flap + l.x * l.x * 0.25) - 0.09 * (1.0 - l.x);
    float sd = max(wing, l.x - 1.0);
    sd = min(sd, length(l * vec2(1.0, 1.6)) - 0.16);
    float px = tc * 2.0 * uTanHalf.y / uRes.y / 0.32;
    float cov = 1.0 - smoothstep(-px, px * 1.5, sd);
    acc.rgb = mix(acc.rgb, vec3(0.02, 0.022, 0.025), cov * (1.0 - acc.a));
    acc.a = max(acc.a, cov);
  }
  o = vec4(acc.rgb + shafts * (1.0 - acc.a), acc.a);
}
`;

  const scene = {
    id: 'forest',
    name: 'Pine Wind',
    sub: 'a cabin, birches, a gusty afternoon',
    audio: 'forest',
    leaves: 1,
    bokehBg: ['#8a9096', '#4c5a46', '#2a3020'],
    defaults: { rain: 0.12, wind: 0.65, fog: 0.2, cond: 0.06, frost: 0, lightning: 0 },
    controls: ['rain', 'wind', 'fog', 'cond', 'lightning'],
    look: {
      frame: 'casement', material: 'oak', wall: '#b9ab96', lamp: 0.35, candle: false, mug: true, plant: true,
      exposure: -0.3, sat: 1.12, contrast: 1.08, lift: [0.01, 0.012, 0.01], gain: [1.0, 1.0, 0.97],
      bloom: 0.04, halo: 0.3, dTyp: 25, reflStretch: 2, refl: 0.4, flowAng: 0,
    },

    init(R) {
      const G = R.G;
      this.bg = G.program(W.SH.vert, BG, 'forestBg');
      this.fg = G.program(W.SH.vert, FG, 'forestFg');
      const specs = [];
      for (let i = 0; i < 5; i++) specs.push({ name: 'pine' + i, kind: 'pine', w: 300, h: 760, seed: 10 + i });
      for (let i = 0; i < 4; i++) specs.push({ name: 'birch' + i, kind: 'birch', w: 440, h: 1000, seed: 30 + i, o: { hue: 58 + i * 7 } });
      for (let i = 0; i < 4; i++) specs.push({ name: 'grass' + i, kind: 'grass', w: 256, h: 190, seed: 50 + i, o: { hue: 70 + i * 5, light: 18, seeds: true, flowers: i % 2 === 0 } });
      specs.push({ name: 'bough', kind: 'bough', w: 1100, h: 520, seed: 77 });
      const at = W.kit.atlas(specs, 2048);
      this.rects = at.rects;
      const bb = (this.bb = new W.kit.Billboards(R, at.canvas));
      const r = W.rng(4);
      for (let i = 0; i < 80; i++) {
        const z = r.range(38, 170), x = r.range(-1, 1) * (40 + z * 0.9);
        bb.add(x, 0, z, this.rects['pine' + r.int(0, 4)], r.range(14, 27), 0.7, r.range(0.8, 1.1));
      }
      this.crowns = [];
      for (let i = 0; i < 20; i++) {
        const z = r.range(11, 44), x = r.range(-1, 1) * (8 + z * 0.75);
        const h = r.range(11, 17);
        bb.add(x, 0, z, this.rects['birch' + r.int(0, 3)], h, 1.6, r.range(0.9, 1.1));
        this.crowns.push([x, h * 0.66, z, h]);
      }
      for (let i = 0; i < 520; i++) {
        const z = 2.6 + Math.pow(r(), 1.6) * 34, x = r.range(-1, 1) * (2 + z * 0.9);
        bb.add(x, -0.02, z, this.rects['grass' + r.int(0, 3)], r.range(0.35, 0.8) * (0.8 + z * 0.012), 2.2, r.range(0.85, 1.15));
      }
      bb.add(-2.3, 1.75, 3.4, this.rects.bough, 1.85, 0.9, 0.9);
      this.cam = { base: [0, 2.3, -0.5], yaw: 0.04, pitch: 0.035, fovY: 60 };
      bb.upload(this.cam.base);
      this.sunN = W.noise1(21);
      this.spark = [];
      for (let i = 0; i < 70; i++) {
        const c = r.pick(this.crowns);
        this.spark.push([c[0] + r.range(-0.3, 0.3) * c[3] * 0.5, c[1] + r.range(-0.25, 0.35) * c[3], c[2] - 0.5, r() * 10, r.range(0.6, 1.4)]);
      }
      this.gaps = [];
      for (let i = 0; i < 90; i++) {
        const c = r.pick(this.crowns);
        this.gaps.push([c[0] + r.range(-0.45, 0.45) * c[3] * 0.6, c[1] + r.range(-0.1, 0.5) * c[3], c[2] + 0.5, r.range(0.25, 0.9), Math.pow(r(), 2.2) * 1.1 + 0.08]);
      }
    },

    update(dt, t, env, R) {
      const L = R.lights;
      this.sun = W.smoothstep(0.3, 0.68, this.sunN(t * 0.025)) * (1 - env.rain * 0.8) * (1 - env.fog * 0.5);
      // a flock crossing the clearing now and then
      this.flockNext = (this.flockNext == null ? 10 : this.flockNext) - dt;
      if (!this.flock && this.flockNext < 0) {
        const dir = Math.random() < 0.5 ? 1 : -1, n = 4 + Math.floor(Math.random() * 7);
        const z = 30 + Math.random() * 35, y = 16 + Math.random() * 12;
        this.flock = { dir, birds: Array.from({ length: n }, (_, i) => ({ x: -90 * dir - dir * i * (1.5 + Math.random() * 2), y: y + (Math.random() - 0.5) * 3, z: z + (Math.random() - 0.5) * 6, ph: Math.random() * 6, f: 9 + Math.random() * 4 })) };
        this.flockNext = 35 + Math.random() * 60;
      }
      if (this.flock) {
        const f = this.flock;
        for (const b of f.birds) {
          b.x += f.dir * (9 + env.gust * 3) * dt;
          b.ph += dt * (Math.sin(t * 0.8 + b.f) > -0.3 ? b.f : 0.5);
          b.y += Math.sin(t * 1.3 + b.f) * dt * 0.6;
        }
        if (f.birds.every((b) => Math.abs(b.x) > 100)) this.flock = null;
      }
      // sun glints on fluttering leaves
      if (this.sun > 0.05) {
        for (const s of this.spark) {
          const tw = Math.pow(Math.max(0, Math.sin(t * s[4] * 3 + s[3])), 14) * this.sun;
          if (tw > 0.02) L.add(s[0] + Math.sin(t * 2 + s[3]) * env.gust * 0.3, s[1], s[2], 0.05, 60 * tw, 52 * tw, 36 * tw, 0.2);
        }
      }
      // bright sky through the crowns: soft discs only when blurred
      const sk = 1.1 + this.sun * 0.6;
      for (const g of this.gaps) { const k = sk * g[4] * (0.85 + 0.15 * Math.sin(t * 1.7 + g[3] * 9) * env.gust); L.add(g[0] + Math.sin(t * 0.9 + g[3] * 5) * env.gust * 0.4, g[1], g[2], g[3], k * 0.95, k, k * 0.9, 0, 3); }
    },

    dispose(R) {
      this.bb.dispose();
      R.gl.deleteProgram(this.bg.p);
      R.gl.deleteProgram(this.fg.p);
    },

    birdData() {
      const d = new Float32Array(40);
      if (this.flock) this.flock.birds.slice(0, 10).forEach((b, i) => d.set([b.x, b.y, b.z, b.ph], i * 4));
      return d;
    },

    render(R, t, dt, P) {
      const e = P.env;
      const sunDir = W.v3.norm([-0.45, 0.32, 1]);
      this.bg.use().set(R.camUniforms()).set({ uTime: t, uSun: this.sun, uGust: e.gust, uWind: e.wind, uRain: e.rain, uFog: e.fog, uFlash: e.flash, uSunDir: sunDir });
      R.G.drawFS();
      const amb = W.scale3([0.3, 0.32, 0.35], (1 - e.rain * 0.3) + e.flash * 0.6);
      this.bb.draw(t, {
        gust: e.gust, wind: e.wind, flutter: 1,
        amb, sun: W.scale3([1.0, 0.86, 0.66], this.sun * 1.3),
        fogCol: W.scale3([0.5, 0.53, 0.56], 1 - e.rain * 0.3), fogD: 0.003 + e.fog * 0.008 + e.rain * 0.006,
      }, true);
      const dc = R.depthCopy();
      const gl = R.gl;
      const sp = R.cam.project(W.v3.add(R.cam.pos, W.v3.mul(sunDir, 1000)));
      gl.enable(gl.BLEND);
      gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
      this.fg.use().set(R.camUniforms()).set({ uTime: t, uGust: e.gust, uWind: e.wind, uRain: e.rain, uSun: this.sun, uLeaves: 0.3 + e.wind * 0.7, uDepth: dc, uSunUV: [sp[0] * 0.5 + 0.5, sp[1] * 0.5 + 0.5], uBirds: this.birdData(), uBirdN: this.flock ? Math.min(10, this.flock.birds.length) : 0 });
      R.G.drawFS();
      gl.disable(gl.BLEND);
    },
  };

  (W.scenes = W.scenes || []).push(scene);
})();

</script>
<script>
// src/scenes/sea.js
// wndo :: Low Tide. A beach house above the dunes, the sun going down into the sea.
(() => {
  const W = window.W;

  const GLSL = /* glsl */ `
${W.GLSL.common}
${W.GLSL.camera}
uniform vec3 uSunDir;
uniform float uWaves, uWind, uRain, uFog, uFlash, uDusk;
uniform vec4 uBreak[4];   // z position, strength, foam age, 0
uniform float uSwash, uWetLine;
uniform vec4 uGull[6];
uniform float uBeam;      // lighthouse beam angle
out vec4 o;
#define FAR 9000.0

vec3 skyBase(vec3 rd){
  float h = max(rd.y, 0.0);
  float mu = max(dot(rd, uSunDir), 0.0);
  vec3 hor = mix(vec3(0.9, 0.42, 0.17), vec3(0.6, 0.3, 0.24), uDusk);
  vec3 mid = mix(vec3(0.5, 0.32, 0.36), vec3(0.26, 0.18, 0.26), uDusk);
  vec3 zen = mix(vec3(0.09, 0.15, 0.3), vec3(0.04, 0.07, 0.15), uDusk);
  vec3 c = mix(hor, mid, smoothstep(0.0, 0.1, h));
  c = mix(c, zen, smoothstep(0.06, 0.5, h));
  c += vec3(1.0, 0.5, 0.16) * (pow(mu, 4.0) * 0.35 + pow(mu, 30.0) * 1.1 + pow(mu, 500.0) * 5.0) * (1.0 - uDusk * 0.5);
  return c * 0.75 * (1.0 - uRain * 0.45);
}
vec3 sky(vec3 rd, bool full){
  vec3 c = skyBase(rd);
  float h = rd.y;
  float mu = max(dot(rd, uSunDir), 0.0);
  if (mu > 0.99996) c += vec3(1.0, 0.75, 0.45) * 60.0 * (1.0 - uDusk);
  if (h > 0.004) {
    vec2 cp = rd.xz / h * 0.9 + vec2(uTime * 0.008, 0.0);
    cp *= vec2(0.6, 1.4);
    float d = full ? fbm(cp * 0.55) : fbm3o(cp * 0.55);
    float cov = smoothstep(0.42 - uRain * 0.3, 0.75, d);
    float lit = pow(mu, 3.0);
    vec3 cc = mix(vec3(0.24, 0.14, 0.18), vec3(1.0, 0.52, 0.26) * 1.6, lit * (1.0 - smoothstep(0.5, 0.75, d))) * (1.0 - uDusk * 0.6);
    c = mix(c, cc, cov * smoothstep(0.0, 0.05, h) * 0.9);
    float ci = smoothstep(0.55, 0.8, fbm(cp * vec2(0.2, 2.2) + 9.0));
    c += vec3(1.0, 0.6, 0.4) * ci * 0.12 * smoothstep(0.02, 0.3, h) * (1.0 - uDusk);
  }
  return c;
}
float waveH(vec2 p){
  float h = 0.0;
  float amp = 0.28 + uWaves * 0.5;
  h += sin(dot(p, vec2(0.07, 0.25)) + uTime * 1.25) * amp;
  h += sin(dot(p, vec2(-0.12, 0.31)) + uTime * 1.45) * amp * 0.6;
  h += sin(dot(p, vec2(0.33, 0.6)) + uTime * 2.1) * amp * 0.25;
  h += sin(dot(p, vec2(-0.5, 0.9)) + uTime * 2.6) * amp * 0.15;
  return h;
}
vec3 seaNormal(vec2 p, float t){
  float amp = 0.28 + uWaves * 0.5;
  float fp = t * 2.0 * uTanHalf.y / uRes.y;
  vec2 g = vec2(0.0);
  vec4 k1 = vec4(0.07, 0.25, 1.25, 1.0), k2 = vec4(-0.12, 0.31, 1.45, 0.6), k3 = vec4(0.33, 0.6, 2.1, 0.25), k4 = vec4(-0.5, 0.9, 2.6, 0.15);
  g += k1.xy * cos(dot(p, k1.xy) + uTime * k1.z) * k1.w * (1.0 - smoothstep(0.4, 1.5, length(k1.xy) * fp * 3.0));
  g += k2.xy * cos(dot(p, k2.xy) + uTime * k2.z) * k2.w * (1.0 - smoothstep(0.4, 1.5, length(k2.xy) * fp * 3.0));
  g += k3.xy * cos(dot(p, k3.xy) + uTime * k3.z) * k3.w * (1.0 - smoothstep(0.4, 1.5, length(k3.xy) * fp * 3.0));
  g += k4.xy * cos(dot(p, k4.xy) + uTime * k4.z) * k4.w * (1.0 - smoothstep(0.4, 1.5, length(k4.xy) * fp * 3.0));
  g *= amp * 0.55;
  float fade = 1.0 - smoothstep(0.3, 1.4, fp * 4.0);
  vec2 q = p * 0.9 + vec2(uTime * 0.4, uTime * 0.7);
  float e = 0.15;
  float n0 = fbm3o(q), nx = fbm3o(q + vec2(e, 0.0)), nz = fbm3o(q + vec2(0.0, e));
  g += vec2(nx - n0, nz - n0) / e * (0.12 + uWind * 0.2) * fade;
  vec2 q2 = p * 3.1 + vec2(-uTime * 0.9, uTime * 1.3);
  float m0 = vnoise(q2), mx = vnoise(q2 + vec2(0.1, 0.0)), mz = vnoise(q2 + vec2(0.0, 0.1));
  g += vec2(mx - m0, mz - m0) * 10.0 * (0.07 + uWind * 0.08) * (1.0 - smoothstep(0.1, 0.5, fp * 4.0));
  return normalize(vec3(-g.x, 1.0, -g.y));
}
float foamTex(vec2 p){
  float n = fbm(p * 0.9 + vec2(0.0, uTime * 0.05));
  float m = vnoise(p * 3.7);
  return smoothstep(0.35, 0.75, n * 0.7 + m * 0.4);
}
float gull(vec2 q, float ph){
  float flap = sin(ph) * 0.35;
  q.x = abs(q.x);
  float wing = abs(q.y - (q.x * (0.55 - flap) - q.x * q.x * 0.9)) - 0.05 * (1.0 - q.x);
  return max(wing, q.x - 1.0);
}
void main(){
  vec3 ro = uCamPos, rd = camRay(gl_FragCoord.xy);
  vec3 col = sky(rd, true);
  float dist = FAR;
  vec3 sunCol = vec3(1.0, 0.62, 0.32) * (1.0 - uDusk * 0.7) * (1.0 - uRain * 0.6);
  // headland with a lighthouse on the left
  float rxz = length(rd.xz), az = atan(rd.x, rd.z);
  {
    float D = 2400.0;
    float y = ro.y + D * rd.y / rxz;
    float x = az * D;
    float hl = (90.0 + 60.0 * vnoise(vec2(x * 0.004, 2.0)) + 14.0 * vnoise(vec2(x * 0.03, 5.0))) * (1.0 - smoothstep(-1100.0, -300.0, x));
    if (y < hl && y > 0.0) {
      col = mix(vec3(0.03, 0.022, 0.026), skyBase(vec3(rd.x, 0.02, rd.z)) * 0.7, 0.3 + 0.12 * vnoise(vec2(x * 0.02, y * 0.1)));
      dist = D / rxz;
    }
    vec2 lh = vec2(-1020.0, 0.0);
    float lx = x - lh.x;
    float ty = hl;
    if (abs(lx) < 7.0 && y > 150.0 - 30.0 && y < 182.0 && y > 0.0) {
      float hh = (y - 120.0);
      if (abs(lx) < 5.0 - hh * 0.04) { col = mix(vec3(0.5, 0.45, 0.42), vec3(0.6, 0.12, 0.08), step(0.5, fract(hh / 12.0))) * skyBase(vec3(0.0, 0.05, 1.0)) * 0.9; dist = D / rxz; }
    }
  }
  // the sea and the sand
  if (rd.y < 0.0) {
    float t = -ro.y / rd.y;
    vec3 p = ro + rd * t;
    float shore = 30.0 + vnoise(vec2(p.x * 0.03, 0.0)) * 5.0;
    float edge = shore - uSwash * 9.0 + vnoise(vec2(p.x * 0.15, uTime * 0.1)) * 1.5;
    vec3 V = -rd;
    if (p.z > edge) {
      vec3 n = seaNormal(p.xz, t);
      float near = 1.0 - smoothstep(shore, shore + 50.0, p.z);
      n = normalize(mix(n, vec3(0.0, 1.0, 0.0), near * 0.3));
      vec3 r = reflect(rd, n);
      r.y = abs(r.y);
      float F = 0.02 + 0.98 * pow(1.0 - max(dot(n, V), 0.0), 5.0);
      vec3 refl = mix(skyBase(r), sky(r, false), 0.35);
      vec3 deep = mix(vec3(0.002, 0.01, 0.018), vec3(0.02, 0.06, 0.06), near);
      float crest = smoothstep(0.0, 0.6, waveH(p.xz) / (0.28 + uWaves * 0.5));
      vec3 sss = vec3(0.05, 0.16, 0.12) * crest * sunCol * 0.6;
      col = mix(deep + sss, refl, F);
      vec3 H = normalize(uSunDir + V);
      float nh = max(dot(n, H), 0.0);
      col += sunCol * min(pow(nh, 1400.0) * 120.0 + pow(nh, 260.0) * 2.0, 7.0) * smoothstep(-0.02, 0.02, uSunDir.y);
      // breakers and their foam
      float foam = 0.0;
      for (int i = 0; i < 4; i++) {
        vec4 b = uBreak[i];
        if (b.y <= 0.0) continue;
        float dz = p.z - b.x - vnoise(vec2(p.x * 0.04, b.w)) * 4.0;
        float face = exp(-sq(dz / 1.8)) * b.y;
        float trail = smoothstep(0.0, 2.0, dz) * exp(-dz / (6.0 + b.z * 4.0)) * b.y;
        col *= 1.0 - face * 0.35 * (1.0 - b.z);
        col += vec3(0.06, 0.13, 0.11) * face * (1.0 - b.z) * sunCol;
        foam = max(foam, (exp(-sq(dz / 1.4)) * b.z + trail * 0.8) * b.y);
      }
      float wc = smoothstep(0.82, 0.98, crest) * uWaves * smoothstep(80.0, 300.0, p.z) * 0.5;
      foam = max(foam, wc);
      float ft = foamTex(p.xz * vec2(0.6, 1.0));
      float fa = sat(foam * (0.4 + ft));
      vec3 fcol = (skyBase(vec3(0.0, 0.3, 1.0)) * 0.6 + sunCol * 0.7 * max(uSunDir.y + 0.15, 0.0) * 4.0) * 0.8;
      col = mix(col, fcol, fa * smoothstep(0.0, 0.3, 1.0 - exp(-t * 0.02)) + fa * 0.6);
      dist = t;
    } else {
      // sand: dry, then wet and mirror-like near the water
      float wetz = smoothstep(uWetLine - 3.0, uWetLine + 2.0, p.z);
      float film = smoothstep(edge - 2.5, edge, p.z);
      vec3 sand = vec3(0.42, 0.33, 0.22) * (0.85 + 0.25 * vnoise(p.xz * 0.6) + 0.1 * vnoise(p.xz * 6.0));
      float rip = sin(p.z * 3.5 + vnoise(p.xz * 0.5) * 6.0) * 0.5 + 0.5;
      sand *= 0.92 + 0.12 * rip * (1.0 - wetz);
      sand = mix(sand, sand * 0.45, wetz);
      vec3 E = sunCol * 0.55 + skyBase(vec3(0.0, 1.0, 0.0)) * 0.7;
      float ripS = 0.9 + 0.16 * sin(p.z * 3.2 + p.x * 0.9 + vnoise(p.xz * 0.35) * 7.0) * (0.5 + vnoise(p.xz * 0.2));
      col = sand * (E * mix(ripS, 1.0, wetz));
      vec3 n = normalize(vec3((vnoise(p.xz * 2.0) - 0.5) * 0.06 * (1.0 - film), 1.0, (vnoise(p.xz * 2.0 + 3.0) - 0.5) * 0.06));
      vec3 r = reflect(rd, n);
      float F = 0.02 + 0.98 * pow(1.0 - max(dot(n, V), 0.0), 5.0);
      col = mix(col, sky(r, false), F * (wetz * 0.7 + film * 0.3));
      float swashFoam = exp(-sq((p.z - edge) / 0.5)) * uSwash * (0.5 + foamTex(p.xz * 2.0));
      col = mix(col, vec3(0.8, 0.7, 0.62) * (E * 0.5 + 0.2), sat(swashFoam));
      dist = t;
    }
    // sand fence and its posts
    for (int i = 0; i < 18; i++) {
      float px = -14.0 + float(i) * 1.65;
      vec2 pc = vec2(px, 13.5 + px * 0.1 + sin(float(i) * 1.7) * 0.3);
      vec2 rel = ro.xz - pc;
      float bq = dot(rel, rd.xz), cq = dot(rel, rel) - 0.0064, a = dot(rd.xz, rd.xz);
      float disc = bq * bq - a * cq;
      if (disc < 0.0) continue;
      float tp = (-bq - sqrt(disc)) / a;
      if (tp < 0.0 || tp > dist) continue;
      float hy = ro.y + rd.y * tp;
      float ph = 1.05 + 0.3 * hash11(float(i));
      if (hy > 0.0 && hy < ph) {
        vec3 E = sunCol * 0.6 + skyBase(vec3(0.0, 1.0, 0.0)) * 0.3;
        col = vec3(0.12, 0.09, 0.07) * E * (0.7 + 0.3 * vnoise(vec2(hy * 20.0, float(i))));
        dist = tp;
      }
    }
  }
  // gulls
  for (int i = 0; i < 6; i++) {
    vec4 gq = uGull[i];
    if (gq.w <= 0.0) continue;
    vec3 c = gq.xyz;
    vec3 toC = normalize(c - ro);
    float tc = dot(c - ro, rd);
    if (tc <= 0.0 || tc > dist) continue;
    vec3 q = ro + rd * tc - c;
    vec3 Rr = normalize(cross(vec3(0.0, 1.0, 0.0), toC));
    vec2 l = vec2(dot(q, Rr), q.y) / 0.55;
    float sd = gull(l, gq.w);
    float px = tc * 2.0 * uTanHalf.y / uRes.y / 0.55;
    float cov = 1.0 - smoothstep(-px, px, sd);
    col = mix(col, vec3(0.05, 0.04, 0.045) * (1.0 + sunCol * 0.4), cov);
  }
  // haze over distance, and the lighthouse beam in the air
  float hz = (1.0 - exp(-min(dist, 4000.0) * (0.00012 + uFog * 0.0009 + uRain * 0.0008))) * (dist >= FAR ? 0.25 * uFog : 1.0);
  col = mix(col, skyBase(vec3(rd.x, 0.03, rd.z)) * 0.9, hz);
  vec3 lhp = vec3(-989.6, 172.0, 2186.6);
  vec3 bd = vec3(sin(uBeam), 0.0, cos(uBeam));
  vec3 v = lhp - ro;
  float tc = dot(v, rd);
  vec3 cp = ro + rd * tc - lhp;
  float along = dot(cp, bd);
  float perp = length(cp - bd * along);
  col += vec3(1.0, 0.9, 0.7) * uDusk * 0.12 * exp(-perp / (8.0 + max(along, 0.0) * 0.06)) * step(0.0, along) * exp(-along * 0.0008) * step(tc, dist);
  col += vec3(0.6, 0.65, 0.8) * uFlash * 0.25;
  o = vec4(col, min(dist, FAR));
}
`;

  const scene = {
    id: 'sea',
    name: 'Low Tide',
    sub: 'a beach house, the sun going under',
    audio: 'sea',
    leaves: 0.1,
    windSound: 0.8,
    bokehBg: ['#4a5878', '#c77a4c', '#3a2a24'],
    defaults: { rain: 0, wind: 0.35, fog: 0.15, cond: 0.05, frost: 0, lightning: 0, waves: 0.5 },
    controls: ['rain', 'wind', 'fog', 'cond', 'lightning', 'waves'],
    look: {
      frame: 'picture', material: 'white', wall: '#d8d1c4', lamp: 0.25, candle: false, mug: true, plant: true,
      exposure: 0.05, sat: 1.05, contrast: 1.03, lift: [0.012, 0.01, 0.012], gain: [1.0, 0.98, 0.96],
      bloom: 0.06, halo: 0.25, dTyp: 300, reflStretch: 6, refl: 0.5, flowAng: 0,
    },

    init(R) {
      this.prog = R.G.program(W.SH.vert, GLSL, 'sea');
      this.cam = { base: [0, 3.6, -0.5], yaw: -0.05, pitch: -0.025, fovY: 52 };
      const specs = [];
      for (let i = 0; i < 4; i++) specs.push({ name: 'g' + i, kind: 'grass', w: 256, h: 300, seed: 60 + i, o: { hue: 62 + i * 6, sat: 22, light: 26, n: 70, seeds: true } });
      const at = W.kit.atlas(specs, 1024);
      const bb = (this.bb = new W.kit.Billboards(R, at.canvas));
      const r0 = W.rng(8);
      for (let i = 0; i < 70; i++) {
        const z = 6.5 + Math.pow(r0(), 1.4) * 12, x = r0.range(-1, 1) * (3 + z * 0.75);
        bb.add(x, -0.03, z, at.rects['g' + r0.int(0, 3)], r0.range(0.6, 1.25), 2.4, r0.range(0.8, 1.1));
      }
      bb.upload(this.cam.base);
      this.breaks = [];
      this.nextWave = 2;
      this.swash = 0;
      this.wetLine = 25;
      this.gulls = [];
      const r = (this.r = W.rng(17));
      for (let i = 0; i < 5; i++) this.gulls.push({ x: r.range(-150, 150), y: r.range(14, 60), z: r.range(60, 300), vx: r.range(-5, 5), ph: r() * 6, f: r.range(4, 7), soar: r() });
      this.glint = [];
      for (let i = 0; i < 260; i++) this.glint.push({ t: r() * 2, life: r.range(0.08, 0.35) });
      this.dusk = 0;
    },

    update(dt, t, env, R) {
      const L = R.lights, r = this.r;
      this.dusk = W.clamp(0.15 + env.fog * 0.2 + env.rain * 0.5, 0, 1);
      const sunDir = (this.sunDir = W.v3.norm([-0.36, 0.055 - env.rain * 0.02, 1]));
      // waves roll in, break, and run up the sand
      this.nextWave -= dt;
      if (this.nextWave <= 0) {
        const size = 0.35 + env.waves * 0.65 * r.range(0.6, 1.1);
        this.breaks.push({ z: 100, v: r.range(5.5, 7), s: size, age: 0, broke: false, seed: r() * 50 });
        this.nextWave = r.range(7, 12) * (1.2 - env.waves * 0.4);
        W.bus.emit('wave', { eta: (100 - 52) / 6.2, size });
      }
      for (const b of this.breaks) {
        b.z -= b.v * dt;
        if (b.z < 52) b.broke = true;
        if (b.broke) {
          b.age += dt / 7;
          b.v = Math.max(1.5, b.v - dt * 0.6);
        }
        if (b.z < 34 && !b.ran) {
          b.ran = true;
          this.run = { t: 0, s: b.s };
        }
      }
      this.breaks = this.breaks.filter((b) => b.z > 28 && b.age < 1);
      if (this.run) {
        this.run.t += dt;
        const u = this.run.t / 6;
        this.swash = Math.sin(Math.min(u, 1) * Math.PI) * this.run.s * (u < 1 ? 1 : 0);
        this.wetLine = Math.min(this.wetLine, 30 - this.swash * 9 - 1);
        if (u > 1) this.run = null;
      } else this.swash = 0;
      this.wetLine += dt * 0.15;
      this.wetLine = Math.min(this.wetLine, 28);
      // gulls drift and flap now and then
      for (const g of this.gulls) {
        g.x += g.vx * dt;
        g.ph += dt * (Math.sin(t * 0.3 + g.soar * 10) > 0.3 ? g.f : 0.2);
        g.y += Math.sin(t * 0.4 + g.soar * 6) * dt * 0.8;
        if (g.x > 220) g.x = -220;
        if (g.x < -220) g.x = 220;
      }
      // sun glitter: short-lived sparkles along the sun path, golden bokeh when out of focus
      const sunK = (1 - this.dusk * 0.7) * (1 - env.rain * 0.8);
      if (sunK > 0.05) {
        const az = Math.atan2(sunDir[0], sunDir[2]);
        for (const g of this.glint) {
          g.t += dt;
          if (g.t > g.life) {
            g.life = r.range(0.06, 0.3);
            g.t = r() * g.life * 0.8;
            const d = 45 + Math.pow(r(), 1.5) * 1800;
            const spread = (0.012 + 9 / d) * (0.6 + env.waves);
            const a = az + r.gauss() * spread;
            g.p = [Math.sin(a) * d, 0.05, Math.cos(a) * d];
            g.k = r.range(0.4, 1) * (0.5 + 0.5 * Math.min(1, d / 400));
          }
          if (!g.p) continue;
          const tw = Math.sin((g.t / g.life) * Math.PI) * g.k * sunK;
          L.add(g.p[0], g.p[1], g.p[2], 0.08, 15000 * tw, 8600 * tw, 3000 * tw, 0);
        }
      }
      // lighthouse, ship, a village down the coast
      this.beam = t * 0.6;
      const facing = Math.pow(Math.max(0, Math.cos(this.beam - Math.PI + 0.4)), 40);
      const lk = this.dusk * (8 + 600 * facing);
      L.addRefl(-989.6, 172, 2186.6, 1.2, lk, lk * 0.92, lk * 0.75, 0.6, 0.25);
      const sx = 700 - ((t * 2.2) % 1400);
      L.addRefl(sx, 22, 3800, 0.8, 40, 38, 32, 0.3, 0.3);
      L.addRefl(sx + 40, 14, 3800, 0.6, 30, 3, 2, 0.2, 0.3);
      if (!this.village) {
        this.village = [];
        for (let i = 0; i < 26; i++) this.village.push([r.range(500, 1400), r.range(4, 30), r.range(700, 1600), r.pick([2400, 2700, 3000])]);
      }
      for (const v of this.village) {
        const c = W.kelvin(v[3]), k = 25 * (0.3 + this.dusk);
        L.addRefl(v[0], v[1], v[2], 0.9, c[0] * k, c[1] * k, c[2] * k, 0.2, 0.2);
      }
    },

    dispose(R) {
      this.bb.dispose();
      R.gl.deleteProgram(this.prog.p);
    },

    render(R, t, dt, P) {
      const e = P.env;
      const br = new Float32Array(16);
      this.breaks.slice(0, 4).forEach((b, i) => br.set([b.z, b.s, Math.min(b.age * 1.6, 1), b.seed], i * 4));
      const gl = new Float32Array(24);
      this.gulls.forEach((g, i) => gl.set([g.x, g.y, g.z, g.ph + 0.001], i * 4));
      this.prog.use().set(R.camUniforms()).set({
        uTime: t, uSunDir: this.sunDir, uWaves: e.waves, uWind: e.wind, uRain: e.rain, uFog: e.fog, uFlash: e.flash, uDusk: this.dusk,
        uBreak: br, uSwash: this.swash, uWetLine: this.wetLine, uGull: gl, uBeam: this.beam,
      });
      R.G.drawFS();
      const sunK = (1 - this.dusk * 0.7) * (1 - e.rain * 0.6);
      this.bb.draw(t, {
        gust: e.gust, wind: e.wind, flutter: 0.4,
        amb: [0.16, 0.14, 0.17], sun: [0.95 * sunK, 0.55 * sunK, 0.28 * sunK],
        fogCol: [0.5, 0.33, 0.25], fogD: 0.002,
      }, false);
    },
  };

  (W.scenes = W.scenes || []).push(scene);
})();

</script>
<script>
// src/scenes/meadow.js
// wndo :: Fireflies. A farmhouse window over a hay meadow, a June night, the moon up.
(() => {
  const W = window.W;

  const BG = /* glsl */ `
${W.GLSL.common}
${W.GLSL.camera}
uniform vec3 uMoonDir;
uniform float uFog, uWind, uFlash, uRain, uGust;
uniform vec2 uFlashAz;
uniform vec4 uMet;        // start azimuth, elevation, end azimuth, elevation
uniform float uMetT;      // progress 0..1, below 0 when none
out vec4 o;
#define FAR 9000.0
vec3 stars(vec3 rd){
  vec3 c = vec3(0.0);
  for (int i = 0; i < 2; i++) {
    float sc = i == 0 ? 220.0 : 520.0;
    vec3 p = rd * sc;
    vec3 id = floor(p), f = fract(p) - 0.5;
    vec3 h = hash33(id + float(i) * 13.0);
    float b = pow(h.x, i == 0 ? 18.0 : 40.0);
    float d = length(f - (h - 0.5) * 0.6);
    float tw = 0.75 + 0.25 * sin(uTime * (2.0 + h.y * 5.0) + h.z * 40.0);
    vec3 sc3 = mix(vec3(1.0, 0.82, 0.62), vec3(0.72, 0.82, 1.0), h.z);
    c += sc3 * b * tw * (1.0 - smoothstep(0.03, 0.12, d)) * (i == 0 ? 5.0 : 2.5);
  }
  return c;
}
vec3 milky(vec3 rd){
  vec3 axis = normalize(vec3(0.35, 0.55, 0.75));
  float band = 1.0 - abs(dot(rd, axis));
  float b = pow(band, 14.0);
  vec2 q = vec2(atan(rd.x, rd.z) * 3.0, rd.y * 6.0);
  float n = fbm(q * 1.5);
  float dust = smoothstep(0.45, 0.7, fbm(q * 3.0 + 4.0));
  return vec3(0.12, 0.12, 0.15) * b * (0.4 + n) * (1.0 - dust * 0.7) * 0.5;
}
vec3 sky(vec3 rd){
  float h = max(rd.y, 0.0);
  vec3 c = mix(vec3(0.016, 0.022, 0.036), vec3(0.003, 0.005, 0.012), pow(h, 0.5));
  float az = atan(rd.x, rd.z);
  c += vec3(0.05, 0.03, 0.018) * exp(-h * 14.0) * smoothstep(0.2, 1.2, az);
  float mu = max(dot(rd, uMoonDir), 0.0);
  c += vec3(0.25, 0.3, 0.45) * (pow(mu, 30.0) * 0.06 + pow(mu, 300.0) * 0.25);
  float clouds = 0.0;
  if (rd.y > 0.0) {
    float moonWash = 1.0 - 0.6 * pow(mu, 4.0);
    c += (stars(rd) * 0.04 + milky(rd) * 1.8) * smoothstep(0.0, 0.15, h) * (1.0 - uRain) * moonWash;
    vec2 cp = rd.xz / (h + 0.06) * 0.7 + vec2(uTime * 0.006 * (0.5 + uWind), 0.0);
    float d = fbm(cp * 0.6);
    clouds = smoothstep(0.6 - uRain * 0.4, 0.9, d) * (0.6 + 0.4 * smoothstep(0.3, 0.7, fbm(cp * 0.15 + 9.0)));
    vec3 cc = vec3(0.03, 0.035, 0.05) + vec3(0.2, 0.24, 0.34) * pow(mu, 6.0) * 0.4;
    c = mix(c, cc, clouds * 0.85);
  }
  // the moon
  if (mu > 0.99985) {
    vec3 t = normalize(cross(uMoonDir, vec3(0.0, 1.0, 0.0)));
    vec3 b = cross(t, uMoonDir);
    vec2 mq = vec2(dot(rd, t), dot(rd, b)) / 0.0173;
    float mare = smoothstep(0.45, 0.7, fbm(mq * 2.5 + 3.0));
    c = mix(c, vec3(0.95, 0.93, 0.88) * (0.55 - mare * 0.18) * 7.0, 1.0 - clouds * 0.9);
  }
  // a shooting star: a bright head with a fading tail
  if (uMetT >= 0.0 && rd.y > 0.0) {
    vec2 p = vec2(az, asin(rd.y));
    vec2 hd = mix(uMet.xy, uMet.zw, uMetT), tl = mix(uMet.xy, uMet.zw, max(uMetT - 0.3, 0.0));
    vec2 pa = p - tl, ba = hd - tl;
    float hseg = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
    float d = length(pa - ba * hseg);
    float life = sin(uMetT * PI);
    c += vec3(0.85, 0.9, 1.0) * exp(-sq(d / 0.0012)) * hseg * hseg * life * 3.0 * (1.0 - clouds);
  }
  // heat lightning low on the horizon
  float fl = exp(-pow((az - uFlashAz.x) / 0.35, 2.0)) * exp(-h * 9.0);
  c += vec3(0.7, 0.62, 0.8) * uFlash * fl * (0.4 + 1.5 * clouds);
  return c;
}
float hills(float az, float seed, float amp, float base){
  return base + amp * (fbm(vec2(az * 3.0, seed)) - 0.35);
}
void main(){
  vec3 ro = uCamPos, rd = camRay(gl_FragCoord.xy);
  vec3 col = sky(rd);
  float dist = FAR;
  float rxz = length(rd.xz), az = atan(rd.x, rd.z);
  vec3 moonL = vec3(0.42, 0.5, 0.75) * 0.14;
  vec3 amb = vec3(0.012, 0.016, 0.026);
  vec3 fogC = vec3(0.02, 0.026, 0.04) + moonL * 0.15;
  // far ridges, then a line of round trees
  float D[3]; D[0] = 260.0; D[1] = 900.0; D[2] = 2200.0;
  for (int i = 2; i >= 0; i--) {
    float y = ro.y + D[i] * rd.y / rxz;
    float top;
    if (i == 0) {
      float x = az * D[0];
      float cell = 7.0, ci = floor(x / cell);
      top = 1.2 + vnoise(vec2(x * 0.2, 1.0)) * 1.4;
      float gap = smoothstep(0.25, 0.4, vnoise(vec2(x * 0.006, 7.0)));
      for (int k = -3; k <= 3; k++) {
        float id = ci + float(k);
        vec4 r = hash42(vec2(id, 3.0));
        if (r.z < 0.25) continue;
        float cx = (id + 0.5 + (r.x - 0.5) * 0.9) * cell;
        float poplar = step(0.9, r.w);
        float rad = cell * mix(0.5 + r.y * 1.3, 0.35, poplar);
        float u = (x - cx) / rad;
        float hgt = mix(4.0 + 13.0 * r.y * r.y, 19.0 + 6.0 * r.x, poplar);
        float crown = hgt * pow(max(0.0, 1.0 - u * u), mix(0.5, 0.9, poplar)) + 1.5;
        crown *= 0.82 + 0.36 * fbm(vec2(x * 0.3, id));
        top = max(top, crown * gap);
      }
    } else top = hills(az, float(i) * 3.0, 70.0 + float(i) * 60.0, 10.0 * float(i));
    if (y < top) {
      float dd = D[i] / rxz;
      float lit = smoothstep(top - 6.0, top, y) * 0.5;
      vec3 c = vec3(0.012, 0.016, 0.02) * (amb * 18.0 + moonL * (0.6 + lit));
      col = mix(c, fogC, 1.0 - exp(-dd * (0.0006 + uFog * 0.002)));
      dist = dd;
    }
  }
  if (rd.y < 0.0) {
    float t = -ro.y / rd.y;
    if (t * rxz < D[0]) {
      vec3 p = ro + rd * t;
      vec3 alb = mix(vec3(0.06, 0.07, 0.04), vec3(0.09, 0.08, 0.05), vnoise(p.xz * 0.1)) * (0.7 + 0.6 * vnoise(p.xz * 0.9));
      float wave = smoothstep(0.4, 1.0, sin(p.x * 0.25 + p.z * 0.3 - uTime * (0.6 + uWind * 1.5) + vnoise(p.xz * 0.1) * 3.0)) * uGust;
      col = alb * (amb + moonL * (0.7 + wave * 0.6));
      float mist = smoothstep(40.0, 200.0, t) * (0.4 + uFog);
      col = mix(col, fogC * 1.4, mist * 0.6);
      dist = t;
    }
  }
  col += vec3(0.6, 0.55, 0.7) * uFlash * 0.01;
  o = vec4(col, dist);
}
`;

  const scene = {
    id: 'meadow',
    name: 'Fireflies',
    sub: 'a farmhouse, a hay meadow, june, late',
    audio: 'meadow',
    leaves: 0.35,
    windSound: 0.6,

      this.metNext = (this.metNext == null ? 6 : this.metNext) - dt;
      if (this.met) {
        this.met.t += dt / this.met.dur;
        if (this.met.t > 1) this.met = null;
      } else if (this.metNext < 0 && env.rain < 0.3) {
        const a0 = (Math.random() - 0.5) * 1.3, e0 = 0.35 + Math.random() * 0.4;
        const ang = -0.4 - Math.random() * 1.2, len = 0.15 + Math.random() * 0.2;
        this.met = { a: [a0, e0, a0 + Math.cos(ang) * len * (Math.random() < 0.5 ? 1 : -1), e0 + Math.sin(ang) * len], t: 0, dur: 0.5 + Math.random() * 0.5 };

      }
      if (this.met) {
        const m = this.met, h = [m.a[0] + (m.a[2] - m.a[0]) * m.t, m.a[1] + (m.a[3] - m.a[1]) * m.t];

    },

    dispose(R) {
      this.bb.dispose();
      R.gl.deleteProgram(this.bg.p);

    render(R, t, dt, P) {

      }, true);
    },
  };

  (W.scenes = W.scenes || []).push(scene);

<script>
// src/scenes/snow.js
// wndo :: First Snow. Blue hour in a small village, snow coming down, a fire behind you.
(() => {
  const W = window.W;

${W.GLSL.common}

  float az = atan(rd.x, rd.z);
  c += vec3(0.16, 0.08, 0.06) * exp(-h * 7.0) * (0.5 + 0.5 * sin(az - 0.9));
  vec2 cp = rd.xz / (h + 0.08) * 0.5 + vec2(uTime * 0.004, 0.0);
  c *= 0.82 + 0.3 * fbm(cp);
  return c * (1.0 - uSnow * 0.25) + uFlash * 0.2;
}
vec2 boxT(vec3 ro, vec3 ird, vec3 bmin, vec3 bmax, out vec3 n){
  vec3 t0 = (bmin - ro) * ird, t1 = (bmax - ro) * ird;
  vec3 tmn = min(t0, t1), tmx = max(t0, t1);
  float tn = max(max(tmn.x, tmn.y), tmn.z), tf = min(min(tmx.x, tmx.y), tmx.z);
  n = -sign(ird) * step(tmn.yzx, tmn) * step(tmn.zxy, tmn);

}
void clipP(vec3 ro, vec3 rd, vec3 n, float d, inout vec2 t, inout vec3 nn){
  float dn = dot(n, rd), on = dot(n, ro);
  if (abs(dn) < 1e-7) { if (on > d) t = vec2(1e9, -1e9); return; }
  float th = (d - on) / dn;

// light reaching a surface point: sky dome, the lantern, the glow of windows nearby
vec3 lightAt(vec3 p, vec3 n){
  vec3 amb = vec3(0.07, 0.085, 0.13) * (0.6 + 0.4 * max(n.y, 0.0)) * (1.0 - uSnow * 0.2);

vec3 house(vec3 p, vec3 rd, vec3 n, int i, bool roof){
  vec4 a = uHA[i], b = uHB[i];

    float sn = 0.85 + 0.15 * vnoise(p.xz * 3.0);
    vec3 c = vec3(0.82, 0.86, 0.92) * sn * lightAt(p, n) * 1.4;

  }

  float wd = front ? a.z - a.x : a.w - a.y;

    col = vec3(0.72, 0.7, 0.66) * lightAt(p, n);
    if (abs(wq.x) < ws.x && abs(wq.y) < ws.y) {

  // the lantern's halo in the falling snow
  vec3 lv = uLampP.xyz - ro; float tl = dot(lv, rd);
  if (tl > 0.0 && tl < t + 0.5) {
    float d2 = dot(lv, lv) - tl * tl;
    col += uLamp * (0.004 / (0.05 + d2) + 0.0035 / (0.6 + sqrt(max(d2, 0.0)))) * (0.4 + uSnow);
  }
  o = vec4(col, min(t, FAR));
}
`;

  const FG = /* glsl */ `
${W.GLSL.common}
${W.GLSL.camera}
uniform sampler2D uDepth;
uniform float uSnow, uWind, uGust;
uniform vec3 uLamp; uniform vec4 uLampP;
out vec4 o;
void main(){
  vec3 ro = uCamPos, rd = camRay(gl_FragCoord.xy);
  float depth = texelFetch(uDepth, ivec2(gl_FragCoord.xy), 0).a;
  vec3 R = uCamMat[0], U = uCamMat[1];
  vec4 acc = vec4(0.0);
  for (int i = 0; i < 9; i++) {
    float d = 1.4 * pow(1.42, float(i));
    if (d > depth) break;
    vec3 p = ro + rd * d;
    vec2 q = vec2(dot(rd, R), dot(rd, U)) * d;
    float fall = uTime * (0.9 + 0.08 * float(i));
    q.y += fall;
    q.x -= uTime * (uWind * 1.5 + uGust) * 0.8;
    vec2 cell = vec2(0.32);
    q.x += sin(q.y * 1.3 + float(i)) * 0.15;
    vec2 g = q / cell; vec2 id = floor(g); vec2 f = fract(g) - 0.5;
    vec3 h = hash32(id + float(i) * 17.0);
    if (h.z > uSnow * 0.85) continue;
    vec2 c = (h.xy - 0.5) * 0.6;
    c.x += sin(uTime * (1.0 + h.z * 2.0) + h.x * 6.0) * 0.12;
    float px = 1.0 / (uRes.y * 0.5 / uTanHalf.y) * d / cell.x;
    float r = (0.035 + h.y * 0.03) / cell.x * 0.32;
    float s = 1.0 - smoothstep(r * 0.2, r + px * 1.5, length(f - c));
    vec3 lv = uLampP.xyz - p;
    vec3 L = vec3(0.13, 0.15, 0.2) + uLamp * 0.25 / (dot(lv, lv) + 0.6);
    acc.rgb += L * s * (1.0 - acc.a);
    acc.a += s * (1.0 - acc.a) * 0.85;
  }
  o = acc;
}
`;

  const HOUSES = [
    // x0, z0, x1, z1 | wall height, roof height, colour, seed (seed > 50: no smoke)
    [[8.5, 15, 15.5, 21], [4.3, 2.6, 0, 3]],
    [[-17, 30, -9.5, 37], [4.0, 2.4, 1, 7]],
    [[3, 54, 10, 61], [4.6, 2.8, 2, 11]],
    [[-31, 68, -23, 76], [3.8, 2.2, 3, 60]],
    [[24, 92, 38, 106], [5.5, 3.5, 0, 70]],
    [[-8, 120, 0, 127], [4.0, 2.4, 1, 14]],
  ];

  const scene = {
    id: 'snow',
    name: 'First Snow',
    sub: 'a village at blue hour, the fire lit',
    audio: 'snow',
    windSound: 0.6,
    dry: true,
    rainSound: 0,
    bokehBg: ['#1a2234', '#28304a', '#3a3c48'],
    defaults: { rain: 0, wind: 0.2, fog: 0.25, cond: 0.2, frost: 0.38, lightning: 0, snow: 0.6 },
    controls: ['wind', 'fog', 'cond', 'frost', 'snow'],
    snowGlass(e) {
      return e.snow * 0.5;
    },
    look: {
      frame: 'cross', material: 'white', wall: '#cbbca8', lamp: 0.55, candle: true, mug: true, plant: false,
      exposure: 0.85, sat: 1.0, contrast: 1.04, lift: [0.008, 0.009, 0.014], gain: [1.0, 0.99, 1.0],
      bloom: 0.05, halo: 0.9, dTyp: 30, reflStretch: 2, refl: 1, flowAng: 0,
    },

    init(R) {
      this.bg = R.G.program(W.SH.vert, BG, 'snowBg');
      this.fg = R.G.program(W.SH.vert, FG, 'snowFg');
      this.cam = { base: [0, 2.3, -0.5], yaw: 0.12, pitch: 0.0, fovY: 56 };
      const specs = [];
      for (let i = 0; i < 5; i++) specs.push({ name: 'p' + i, kind: 'pine', w: 300, h: 760, seed: 40 + i, o: { snow: 1, hue: 150 } });
      const at = W.kit.atlas(specs, 2048);
      const bb = (this.bb = new W.kit.Billboards(R, at.canvas));
      const r = W.rng(9);
      const free = (x, z) => !HOUSES.some(([a]) => x > a[0] - 4 && x < a[2] + 4 && z > a[1] - 3 && z < a[3] + 6);
      let n = 0;
      while (n < 70) {
        const z = r.range(25, 200), x = r.range(-1, 1) * (20 + z * 0.8);
        if (!free(x, z) || Math.abs(x - 1.5 - z * 0.06) < 4) continue;
        bb.add(x, 0, z, at.rects['p' + r.int(0, 4)], r.range(8, 20), 0.35, r.range(0.85, 1.1));
        n++;
      }
      bb.add(-7.5, 0, 12, at.rects.p1, 9, 0.4, 1);
      bb.add(19, 0, 26, at.rects.p3, 12, 0.4, 1);
      bb.upload(this.cam.base);
      this.HA = new Float32Array(24);
      this.HB = new Float32Array(24);
      HOUSES.forEach(([a, b], i) => {
        this.HA.set(a, i * 4);
        this.HB.set(b, i * 4);
      });
      this.lampP = [3.2, 3.4, 18.5, 1];
      // string lights sagging along the eave of the nearest house
      this.bulbs = [];
      const h = HOUSES[0][0], hb = HOUSES[0][1];
      for (let x = h[0] - 0.2; x <= h[2] + 0.2; x += 0.42) {
        const u = (x - h[0]) / (h[2] - h[0]);
        this.bulbs.push([x, hb[0] - 0.15 - Math.sin(u * Math.PI * 3) ** 2 * 0.25, h[1] - 0.5, r() * 6]);
      }
      const h2 = HOUSES[1][0], hb2 = HOUSES[1][1];
      for (let x = h2[0]; x <= h2[2]; x += 0.5) this.bulbs.push([x, hb2[0] - 0.2 - Math.sin(((x - h2[0]) / (h2[2] - h2[0])) * Math.PI * 2) ** 2 * 0.3, h2[1] - 0.5, r() * 6, 1]);
      this.near = [];
      for (let i = 0; i < 40; i++) this.near.push([r.range(-1.6, 1.6), r.range(0, 3.5), r.range(0.9, 2.2), r() * 10, r.range(0.7, 1.3)]);
    },

    update(dt, t, env, R) {
      const L = R.lights;
      const lk = W.kelvin(2100);
      this.lamp = W.scale3(lk, 14);
      L.add(this.lampP[0], this.lampP[1], this.lampP[2], 0.14, lk[0] * 260, lk[1] * 260, lk[2] * 260, 1.2);
      const warm = W.kelvin(2600);
      const pal = [[1, 0.35, 0.12], [1, 0.75, 0.25], [0.3, 0.75, 0.35], [0.25, 0.45, 1]];
      for (const b of this.bulbs) {
        const tw = 0.85 + 0.15 * Math.sin(t * 1.3 + b[3] * 3);
        const c = b[4] ? pal[Math.floor(b[3]) % 4] : warm;
        L.add(b[0], b[1], b[2], 0.035, c[0] * 70 * tw, c[1] * 70 * tw, c[2] * 70 * tw, 0.5);
      }
      // window light for the blurred view
      HOUSES.forEach(([a, b], i) => {
        const wd = a[2] - a[0], nw = Math.max(1, Math.floor(wd / 3.2));
        for (let k = 0; k < nw; k++) {
          L.add(a[0] + (k + 0.5) * (wd / nw), b[0] * 0.45, a[1] - 0.1, 0.6, 2.6, 1.6, 0.8, 0, 3);
        }
      });
      // every so often a car crawls along the cross road
      this.carNext = (this.carNext == null ? 14 : this.carNext) - dt;
      if (!this.car && this.carNext < 0) {
        const dir = Math.random() < 0.5 ? 1 : -1;
        this.car = { x: -70 * dir, dir, v: 5 + Math.random() * 2, sent: false };
        this.carNext = 45 + Math.random() * 70;
      }
      if (this.car) {
        const c = this.car;
        c.x += c.dir * c.v * dt;
        if (!c.sent && c.dir * c.x > -35) {
          c.sent = true;
          W.bus.emit('carpass', { eta: Math.abs(c.x - 10) / c.v, dir: c.dir, wet: 0, near: 0.5, bus: false, snow: true });
        }
        for (const s of [-1, 1]) {
          L.add(c.x + c.dir * 2.17, 0.7, 25.5 + s * 0.6, 0.12, 220, 200, 170, 1.2);
          L.add(c.x - c.dir * 2.17, 0.85, 25.5 + s * 0.62, 0.09, 40, 2, 1, 0.6);
        }
        if (Math.abs(c.x) > 75) this.car = null;
      }
      // big flakes right outside the glass, lit by the room
      const room = 0.6;
      for (const f of this.near) {
        f[1] -= dt * 0.55 * f[4];
        f[0] += Math.sin(t * 0.7 + f[3]) * dt * 0.2 + env.gust * dt * 0.6;
        if (f[1] < -1.2) { f[1] = 3.6; f[0] = (Math.random() - 0.5) * 3.2; }
        if (f[0] > 1.8) f[0] = -1.8;
        const k = room * env.snow * 1.2;
        L.add(f[0] + R.cam.pos[0], f[1] + 0.6, f[2] + 1.2, 0.008, 16 * k, 14.5 * k, 12 * k, 0);
      }
    },

    dispose(R) {
      this.bb.dispose();
      R.gl.deleteProgram(this.bg.p);
      R.gl.deleteProgram(this.fg.p);
    },

    render(R, t, dt, P) {
      const e = P.env;
      this.bg.use().set(R.camUniforms()).set({
        uTime: t, uHA: this.HA, uHB: this.HB, uHN: HOUSES.length, uSnow: e.snow, uWind: e.wind, uFog: e.fog, uGust: e.gust, uFlash: e.flash,
        uLamp: this.lamp, uLampP: this.lampP, uCar: this.car ? [this.car.x, 25.5, this.car.dir, 1] : [0, 0, 1, 0],
      });
      R.G.drawFS();
      this.bb.draw(t, {
        gust: e.gust * 0.5, wind: e.wind * 0.5, flutter: 0.2,
        amb: [0.1, 0.12, 0.17], sun: [0.04, 0.05, 0.08], fogCol: [0.075, 0.09, 0.13], fogD: 0.006 + e.fog * 0.012 + e.snow * 0.008,
      }, true);
      const dc = R.depthCopy();
      const gl = R.gl;
      gl.enable(gl.BLEND);
      gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
      this.fg.use().set(R.camUniforms()).set({ uTime: t, uDepth: dc, uSnow: e.snow, uWind: e.wind, uGust: e.gust, uLamp: this.lamp, uLampP: this.lampP });
      R.G.drawFS();
      gl.disable(gl.BLEND);
    },
  };

  (W.scenes = W.scenes || []).push(scene);
})();

</script>
<script>
// src/scenes/train.js
// wndo :: Night Train. A seat by the window, the country going past in the rain.
(() => {
  const W = window.W;

  const GLSL = /* glsl */ `
${W.GLSL.common}
${W.GLSL.camera}
uniform float uV, uShutter, uRain, uFog, uFlash, uTunnel;
uniform vec4 uFeat[8];   // type (1 crossing, 2 station, 3 tunnel, 4 bridge, 5 town), x0, x1, param
uniform float uFeatN;
uniform float uCross;    // crossing lights phase
out vec4 o;
#define FAR 9000.0
// average of a periodic box pattern over a window, for analytic motion blur
float pbox(float x, float hw, float per, float w){
  float a = x - hw, b = x + hw;
  float fa = floor(a / per) * w + clamp(mod(a, per), 0.0, w);
  float fb = floor(b / per) * w + clamp(mod(b, per), 0.0, w);
  return (fb - fa) / max(b - a, 1e-4);
}
vec3 sky(vec3 rd, float glow){
  float h = max(rd.y, 0.0);
  vec3 c = mix(vec3(0.03, 0.024, 0.022), vec3(0.006, 0.007, 0.011), pow(h, 0.6));
  c += vec3(0.08, 0.045, 0.02) * glow * exp(-h * 8.0);
  vec2 cp = rd.xy / (h + 0.1) * 0.6 + vec2(uCamPos.x * 0.00004 + uTime * 0.004, 0.0);
  c *= 0.7 + 0.6 * fbm(cp);
  return c + uFlash * vec3(0.3, 0.32, 0.4) * smoothstep(-0.05, 0.3, h);
}
vec4 feat(int i){ return uFeat[i]; }
void main(){
  vec3 ro = uCamPos, rd = camRay(gl_FragCoord.xy);
  float hw = uV * uShutter * 0.5;
  float camX = ro.x;
  // town glow near towns
  float glow = 0.3;
  int fn = int(uFeatN);
  for (int i = 0; i < 8; i++) { if (i >= fn) break; vec4 f = feat(i); if (f.x > 4.5) glow += 1.0 - smoothstep(0.0, 1500.0, abs(camX + rd.x / max(rd.z, 0.05) * 600.0 - (f.y + f.z) * 0.5)); }
  vec3 col = sky(rd, glow);
  float dist = FAR;
  if (rd.z <= 0.0) { o = vec4(col, dist); return; }
  float slope = rd.x / rd.z, rise = rd.y / rd.z;
  // tunnel: concrete close to the glass, lamps going by
  if (uTunnel > 0.5) {
    float d = 1.6;
    float xw = camX + slope * d, yw = ro.y + rise * d;
    float tl = 0.012 + 0.006 * vnoise(vec2(xw * 0.05, yw * 2.0));
    vec3 c = vec3(tl * 0.6) * (1.0 + 5.0 * pbox(xw, hw + 0.5, 25.0, 0.6) * exp(-abs(yw - 5.6) * 0.8));
    o = vec4(c * (0.6 + 0.4 * smoothstep(-0.5, 2.5, yw)), d / rd.z);
    return;
  }
  // far hills
  {
    float D = 2400.0, x = camX * 0.0 + slope * D, y = ro.y + rise * D;
    float th = 20.0 + 70.0 * fbm(vec2((camX + x) * 0.0006, 1.0));
    if (y < th) { col = mix(vec3(0.006, 0.006, 0.008), sky(vec3(rd.x, 0.02, rd.z), glow), 0.45); dist = D / rd.z; }
  }
  // the ground plane: ballast, verge, fields; motion blur grows as things get closer
  if (rd.y < 0.0) {
    float t = -(ro.y - 3.4) / rd.y;
    vec3 p = ro + rd * t;
    if (p.z > 2.2) { t = -ro.y / rd.y; p = ro + rd * t; p.z = max(p.z, 2.2); }
    float z = p.z;
    if (z > 0.0) {
      float bl = hw;
      vec3 c;
      float n = 0.0;
      for (int k = 0; k < 4; k++) n += vnoise(vec2((p.x + (float(k) - 1.5) * bl * 0.5) * 2.0, z * 3.0));
      n *= 0.25;
      if (z < 2.2) c = vec3(0.07, 0.066, 0.062) * (0.6 + 0.8 * n);
      else if (z < 9.0) c = vec3(0.016, 0.018, 0.013) * (0.6 + 0.8 * n);
      else c = vec3(0.006, 0.0065, 0.006) * (0.6 + 0.8 * vnoise(p.xz * 0.05)) + vec3(0.02, 0.012, 0.006) * glow * exp(-z * 0.004);
      // a road at a level crossing
      for (int i = 0; i < 8; i++) {
        if (i >= fn) break;
        vec4 f = feat(i);
        if (f.x > 0.5 && f.x < 1.5) {
          float rw = 1.0 - smoothstep(3.4, 4.2 + bl, abs(p.x - f.y));
          c = mix(c, vec3(0.03, 0.03, 0.032) * (1.0 + uCross * 0.5 * step(z, 8.0)), rw);
          c += vec3(0.25, 0.13, 0.05) * 0.4 * rw * (0.5 + 0.5 * sin(z * 0.2)) * exp(-z * 0.01) * step(10.0, z) * pbox(z, 0.0001, 40.0, 4.0);
        }
        if (f.x > 3.5 && f.x < 4.5 && p.x > f.y && p.x < f.z && z > 6.0) {
          c = vec3(0.004, 0.006, 0.01) + sky(reflect(rd, vec3(0.0, 1.0, 0.0)), glow) * 0.45;
        }
      }
      // wet light from the train's own windows on the ballast
      c += vec3(0.12, 0.11, 0.09) * exp(-z * 0.8) * (0.4 + 0.6 * pbox(p.x + 1.2, bl, 2.6, 1.6)) * (1.0 - uTunnel);
      c *= 1.0 - uRain * 0.2;
      col = c;
      dist = t;
    }
  }
  // hedgerows and clumps of trees, low and broken, at a few distances
  for (int i = 3; i >= 0; i--) {
    float D = 38.0 * pow(1.9, float(i));
    float xw = camX + slope * D, yw = ro.y + rise * D;
    float seed = float(i) * 11.0;
    float h0 = 1.2 + 1.6 * vnoise(vec2(xw * 0.15, seed));
    float trees = smoothstep(0.62, 0.85, vnoise(vec2(xw * 0.025, seed + 3.0)));
    h0 += trees * (5.0 + 5.0 * vnoise(vec2(xw * 0.3, seed + 5.0)));
    h0 *= step(0.38, vnoise(vec2(xw * 0.01, seed + 9.0)));
    if (yw < h0 && D / rd.z < dist) { col = vec3(0.004, 0.0045, 0.005) + sky(vec3(rd.x, 0.02, rd.z), glow) * 0.08; dist = D / rd.z; }
  }
  // the catenary: poles every 55 m right by the track, a sagging wire on top
  {
    float D = 2.8;
    float xw = camX + slope * D, yw = ro.y + rise * D;
    float cov = pbox(xw, hw + 0.002, 55.0, 0.24);
    if (yw > 3.4 && yw < 10.6 && cov > 0.0) {
      vec3 pc = vec3(0.012, 0.012, 0.013) + vec3(0.1, 0.1, 0.095) * exp(-max(yw - 5.6, 0.0) * 0.5) * (1.0 - uTunnel);
      col = mix(col, pc, min(cov, 1.0));
      if (cov > 0.5) dist = D / rd.z;
    }
    float u = mod(xw, 55.0) / 55.0;
    float wy = 10.5 - 1.1 * 4.0 * u * (1.0 - u);
    float px = D / rd.z * 2.0 * uTanHalf.y / uRes.y;
    float wire = 1.0 - smoothstep(0.0, 0.012 + px * 1.5, abs(yw - wy));
    col = mix(col, vec3(0.006), wire * 0.9);
  }
  // station: a lit platform at rail height, a canopy overhead, pillars flicking by
  for (int i = 0; i < 8; i++) {
    if (i >= fn) break;
    vec4 f = feat(i);
    if (f.x < 1.5 || f.x > 2.5) continue;
    float RAIL = 3.4;
    if (rd.y < 0.0) {
      float tp = (RAIL + 1.1 - ro.y) / rd.y;
      vec3 pp = ro + rd * tp;
      if (pp.z > 0.45 && pp.z < 6.5 && pp.x > f.y && pp.x < f.z && tp < dist) {
        float lampLit = 0.0, tex = 0.0;
        for (int k = 0; k < 4; k++) {
          float xs = pp.x + (float(k) - 1.5) * hw * 0.5;
          lampLit += 0.55 + 0.45 * cos(6.2831 * (xs - 6.0) / 12.0);
          tex += vnoise(vec2(xs * 3.0, pp.z * 3.0));
        }
        lampLit *= 0.25; tex *= 0.25;
        vec3 pc = vec3(0.045, 0.044, 0.042) * (0.75 + 0.5 * tex) * (0.25 + 0.9 * lampLit * exp(-abs(pp.z - 3.0) * 0.25));
        float line = smoothstep(0.62, 0.66, pp.z) * (1.0 - smoothstep(0.78, 0.82, pp.z));
        pc = mix(pc, vec3(0.5, 0.42, 0.06) * (0.5 + lampLit), line);
        pc *= 1.0 - (1.0 - smoothstep(0.45, 0.55, pp.z)) * 0.7;
        col = pc * (1.0 - uRain * 0.15) + vec3(0.06) * uRain * lampLit * 0.5;
        dist = tp;
      }
      // the platform's face below the edge
      float tz = (0.45 - ro.z) / rd.z;
      vec3 pf = ro + rd * tz;
      if (pf.y < RAIL + 1.1 && pf.y > RAIL - 0.3 && pf.x > f.y && pf.x < f.z && tz < dist) { col = vec3(0.012); dist = tz; }
    }
    if (rd.y > 0.0) {
      float tc = (RAIL + 4.3 - ro.y) / rd.y;
      vec3 pc = ro + rd * tc;
      if (pc.z > 0.2 && pc.z < 6.0 && pc.x > f.y && pc.x < f.z && tc < dist) {
        float lamps = pbox(pc.x - 4.0, hw + 0.05, 12.0, 2.4) * (1.0 - smoothstep(0.8, 1.1, abs(pc.z - 3.0)));
        col = vec3(0.025, 0.024, 0.023) + vec3(1.2, 1.15, 1.0) * lamps;
        dist = tc;
      }
    }
    // the far platform across the tracks: surface, pillars, canopy, the lamps under it
    float Df = 13.0;
    float xf = camX + slope * Df, yf = ro.y + rise * Df;
    if (xf > f.y && xf < f.z && Df / rd.z < dist + 4.0) {
      if (yf > RAIL + 0.2 && yf < RAIL + 1.1) { col = vec3(0.02, 0.019, 0.018); dist = Df / rd.z; }
      else if (yf >= RAIL + 1.1 && yf < RAIL + 4.6) {
        float lit = 0.5 + 0.5 * cos(6.2831 * (xf - 6.0) / 12.0);
        vec3 wall = vec3(0.022, 0.021, 0.02) * (0.3 + 1.0 * lit * lit) * (0.8 + 0.4 * vnoise(vec2(xf * 0.4, yf)));
        float sign = step(abs(mod(xf, 36.0) - 18.0), 2.0) * step(abs(yf - RAIL - 3.0), 0.35);
        wall = mix(wall, vec3(0.05, 0.12, 0.3), sign);
        float pil = pbox(xf, hw + 0.01, 12.0, 0.35);
        col = mix(wall, vec3(0.012), min(pil, 1.0));
        dist = Df / rd.z;
      } else if (yf >= RAIL + 4.6 && yf < RAIL + 5.2) { col = vec3(0.025); dist = Df / rd.z; }
    }
  }
  // atmosphere, wet air
  col = mix(col, sky(vec3(rd.x, 0.05, rd.z), glow) * 0.8, (1.0 - exp(-min(dist, 3000.0) * (0.0008 + uFog * 0.003 + uRain * 0.001))) * step(dist, 8999.0));
  o = vec4(col, dist);
}
`;

  const scene = {
    id: 'train',
    name: 'Night Train',
    sub: 'a window seat, rain, the country going by',
    audio: 'train',
    windSound: 0.35,
    rainSound: 0.8,
    bokehBg: ['#0d0c0c', '#120f0d', '#070707'],
    defaults: { rain: 0.45, wind: 0.2, fog: 0.25, cond: 0.12, frost: 0, lightning: 0, speed: 0.6 },
    controls: ['rain', 'fog', 'cond', 'lightning', 'speed'],
    look: {
      frame: 'train', material: 'train', wall: '#a8a397', lamp: 0.55, lampK: 4600, candle: false, mug: true, plant: false,
      exposure: 1.7, sat: 1.0, contrast: 1.04, lift: [0.01, 0.01, 0.012], gain: [1.0, 0.99, 0.97],
      bloom: 0.05, halo: 0.8, dTyp: 60, reflStretch: 3, refl: 1.3, flowAng: 0,
    },

    init(R) {
      this.prog = R.G.program(W.SH.vert, GLSL, 'train');
      this.cam = { base: [0, 6.2, -1.25], yaw: 0, pitch: -0.1, fovY: 52 };
      this.x = 0;
      this.v = 30;
      this.feats = [];
      this.genTo = 0;
      this.r = W.rng(23);
      this.gen(4000);
      this.shakeN = W.noise1(41);
      this.cars = [];
      for (let i = 0; i < 46; i++) this.cars.push({ x: this.r.range(-1600, 1600), dir: this.r.chance(0.5) ? 1 : -1, v: this.r.range(22, 36) });
      this.lane = [];
      for (let i = 0; i < 6; i++) this.lane.push({ x: this.r.range(-900, 900), dir: this.r.chance(0.5) ? 1 : -1, v: this.r.range(14, 22) });
    },

    // lay out the line ahead: crossings, stations, tunnels, bridges, towns
    gen(to) {
      const r = this.r;
      while (this.genTo < to) {
        const x = this.genTo + r.range(500, 1300);
        const k = r();
        let f;
        if (k < 0.32) f = { type: 1, x0: x, x1: x + 9, lamps: Math.floor(r.range(4, 9)) };
        else if (k < 0.5) f = { type: 2, x0: x, x1: x + 220 };
        else if (k < 0.66) f = { type: 3, x0: x, x1: x + r.range(260, 700) };
        else if (k < 0.78) f = { type: 4, x0: x, x1: x + r.range(120, 260) };
        else f = { type: 5, x0: x - 400, x1: x + r.range(600, 1500), lights: [] };
        if (f.type === 5) {
          for (let i = 0; i < 90; i++) f.lights.push([r.range(f.x0, f.x1), r.range(1, 18), r.range(120, 900), r.pick([2000, 2200, 2700, 3200, 4500])]);
        }
        this.feats.push(f);
        this.genTo = f.x1 + 50;
      }
      this.feats = this.feats.filter((f) => f.x1 > this.x - 2000);
    },

    update(dt, t, env, R) {
      const L = R.lights, r = this.r;
      const vt = 8 + env.speed * 34;
      this.v += (vt - this.v) * (1 - Math.exp(-dt * 0.3));
      const v = this.v;
      this.x += v * dt;
      env.speedMs = v;
      this.gen(this.x + 5000);
      const x = this.x;
      this.cam.base = [x, 6.2, -1.25];
      // ride: rail joints knock the car, a slow sway underneath
      const joint = (x % 25) / v;
      const knock = Math.exp(-joint * 9) * 0.004 * Math.min(1, v / 20);
      this.shake = [(this.shakeN(t * 0.7) - 0.5) * 0.012, knock + (this.shakeN(t * 1.9 + 50) - 0.5) * 0.006];
      // rain streams sideways at speed
      this.flowAng = Math.atan2(v, 14) * 0.95;
      this.runK = 1 + v / 12;
      this.trainRefl = tunnel => (tunnel ? 3.2 : 1);
      // what is around us now
      let tunnel = 0;
      const vis = [];
      for (const f of this.feats) {
        if (f.type === 3 && x > f.x0 + 1 && x < f.x1 - 1) tunnel = 1;
        if (f.x1 > x - 1500 && f.x0 < x + 1500) vis.push(f);
        if (f.type === 1 && !f.rang && f.x0 - x < v * 6 && f.x0 > x) {
          f.rang = true;
          W.bus.emit('crossing', { duration: ((f.x0 - x) / v) * 2 + 2, mid: 0.5 });
        }
      }
      if (tunnel !== this.tunnel) {
        this.tunnel = tunnel;
        W.bus.emit('tunnel', { inside: !!tunnel });
      }
      this.vis = vis;
      const vel = [-v, 0, 0];
      const shutter = 1 / 50;
      if (tunnel) {
        for (let lx = Math.floor((x - 60) / 25) * 25; lx < x + 60; lx += 25) {
          const c = W.kelvin(2300);
          L.add(lx, 5.6, 0.2, 0.15, c[0] * 160, c[1] * 160, c[2] * 160, 0.5, 2, -v, 0, 0);
        }
      } else {
        for (const f of vis) {
          if (f.type === 1) {
            const on = Math.sin(t * Math.PI * 2 * 1.1) > 0;
            for (const [zz, yy, s] of [[1.6, 5.3, 1]]) {
              const k = (on ? 1 : 0.05) * 160;
              L.add(f.x0 - 1.5, yy, zz, 0.12, k, k * 0.04, k * 0.01, 1, 2, -v, 0, 0);
              const k2 = (on ? 0.05 : 1) * 160;
              L.add(f.x0 + 1.5, yy, zz, 0.12, k2, k2 * 0.04, k2 * 0.01, 1, 2, -v, 0, 0);
            }
            const sod = W.kelvin(2000);
            for (let i = 0; i < f.lamps; i++) L.add(f.x0 + 5, 6.5, 14 + i * 40, 0.2, sod[0] * 200, sod[1] * 200, sod[2] * 200, 0.8, 2, -v, 0, 0);
          } else if (f.type === 2) {
            for (let lx = f.x0 + 4; lx < f.x1; lx += 12) if (Math.abs(lx - x) < 160) L.add(lx, 7.7, 11.3, 0.35, 150, 146, 130, 0.7, 2, -v, 0, 0);
          } else if (f.type === 4) {
            for (const tl of [[f.x0 + 40, 300, 2200], [f.x0 + 90, 520, 2700], [f.x0 + 20, 700, 2000]]) {
              const c = W.kelvin(tl[2]);
              L.addRefl(tl[0], 8, tl[1], 0.8, c[0] * 60, c[1] * 60, c[2] * 60, 0.4, 0.3);
            }
          } else if (f.type === 5) {
            for (const l of f.lights) {
              const c = W.kelvin(l[3]);
              L.add(l[0], l[1], l[2], 0.6, c[0] * 70, c[1] * 70, c[2] * 70, 0.4);
            }
          }
        }
        // a motorway out on the plain
        for (const c of this.cars) {
          c.x += c.dir * c.v * dt;
          if (c.x - x > 1600) c.x -= 3200;
          if (c.x - x < -1600) c.x += 3200;
          const z = c.dir > 0 ? 380 : 386;
          const head = c.dir > 0 ? [1, 0.06, 0.03] : [1, 0.93, 0.8];
          const k = c.dir > 0 ? 50 : 140;
          L.add(c.x, 0.8, z, 0.15, head[0] * k, head[1] * k, head[2] * k, 0.3);
          L.add(c.x + 1.6, 0.8, z, 0.15, head[0] * k, head[1] * k, head[2] * k, 0.3);
        }
        // a country road with lit stretches, and its few cars
        const sod = W.kelvin(2050);
        for (let i = -10; i <= 10; i++) {
          const lx = Math.floor(x / 45) * 45 + i * 45;
          if (W.hash(Math.floor(lx / 900)) < 0.45) continue;
          L.add(lx, 6.5, 165, 0.2, sod[0] * 220, sod[1] * 220, sod[2] * 220, 0.7);
        }
        for (const c of this.lane) {
          c.x += c.dir * c.v * dt;
          if (c.x - x > 900) c.x -= 1800;
          if (c.x - x < -900) c.x += 1800;
          const k = c.dir > 0 ? 40 : 150, col = c.dir > 0 ? [1, 0.05, 0.02] : [1, 0.92, 0.78];
          L.add(c.x, 0.8, 158, 0.12, col[0] * k, col[1] * k, col[2] * k, 0.4);
          L.add(c.x + 1.5, 0.8, 158, 0.12, col[0] * k, col[1] * k, col[2] * k, 0.4);
        }
        // towns low on the horizon
        for (let i = -3; i <= 3; i++) {
          const tx = Math.floor(x / 1300) * 1300 + i * 1300;
          if (W.hash(tx + 11) < 0.35) continue;
          if (!this.towns) this.towns = new Map();
          if (!this.towns.has(tx)) {
            const tr = W.rng(tx | 0), pts = [];
            const n = tr.int(20, 60), cz = tr.range(2600, 4200);
            for (let k = 0; k < n; k++) pts.push([tx + tr.gauss() * 220, tr.range(2, 30), cz + tr.gauss() * 140, tr.pick([2000, 2100, 2700, 4000])]);
            this.towns.set(tx, pts);
            if (this.towns.size > 30) this.towns.delete(this.towns.keys().next().value);
          }
          for (const p of this.towns.get(tx)) {
            const c = W.kelvin(p[3]);
            L.add(p[0], p[1], p[2], 2.0, c[0] * 70, c[1] * 70, c[2] * 70, 0.3);
          }
        }
        // wind turbines blinking red on the ridge, farms with one window on
        const tb = Math.sin(t * 2.0) > 0.4 ? 1 : 0.02;
        for (let i = -6; i <= 6; i++) {
          const tx = Math.floor(x / 380) * 380 + i * 380;
          if (W.hash(tx) < 0.45) continue;
          L.add(tx, 110 + W.hash(tx + 1) * 40, 2100 + W.hash(tx + 2) * 300, 3, 160 * tb, 4 * tb, 2 * tb, 0.4);
        }
        for (let i = -8; i <= 8; i++) {
          const fx = Math.floor(x / 210) * 210 + i * 210;
          if (W.hash(fx + 7) < 0.6) continue;
          const c = W.kelvin(2300 + W.hash(fx) * 1000);
          L.add(fx, 3, 90 + W.hash(fx + 3) * 260, 0.6, c[0] * 22, c[1] * 22, c[2] * 22, 0.3);
        }
        // signals by the track
        const sx = Math.floor(x / 900) * 900 + 900;
        const sc = W.hash(sx) < 0.8 ? [0.1, 1, 0.5] : [1, 0.05, 0.02];
        if (sx - x < 200) L.add(sx, 6.6, 2.1, 0.1, sc[0] * 120, sc[1] * 120, sc[2] * 120, 0.8, 2, -v, 0, 0);
      }
      this.crossPhase = Math.sin(t * Math.PI * 2 * 1.1) > 0 ? 1 : 0;
    },

    render(R, t, dt, P) {
      const e = P.env;
      const fe = new Float32Array(32);
      let n = 0;
      for (const f of this.vis || []) {
        if (n >= 8) break;
        fe.set([f.type, f.x0, f.x1, 0], n * 4);
        n++;
      }
      this.prog.use().set(R.camUniforms()).set({
        uTime: t, uV: this.v, uShutter: 1 / 50, uRain: e.rain, uFog: e.fog, uFlash: e.flash, uTunnel: this.tunnel || 0,
        uFeat: fe, uFeatN: n, uCross: this.crossPhase || 0,
      });
      R.G.drawFS();
    },
  };

  (W.scenes = W.scenes || []).push(scene);
})();

</script>

      { key: 'cond', label: 'Condensation', type: 'range', min: 0, max: 1, step: 0.01, def: 0.2, scope: 'scene' },
      { key: 'frost', label: 'Frost', type: 'range', min: 0, max: 1, step: 0.01, def: 0, scope: 'scene' },
      { key: 'lightning', label: 'Lightning', type: 'choice', options: [['0', 'none'], ['1', 'rare'], ['2', 'often']], def: '0', scope: 'scene' },
      { key: 'traffic', label: 'Traffic', type: 'range', min: 0, max: 1, step: 0.01, def: 0.6, scope: 'scene', only: ['city'] },
      { key: 'snow', label: 'Snowfall', type: 'range', min: 0, max: 1, step: 0.01, def: 0.6, scope: 'scene', only: ['snow'] },
      { key: 'waves', label: 'Swell', type: 'range', min: 0, max: 1, step: 0.01, def: 0.5, scope: 'scene', only: ['sea'] },
      { key: 'fireflies', label: 'Fireflies', type: 'range', min: 0, max: 1, step: 0.01, def: 0.6, scope: 'scene', only: ['meadow'] },

      { key: 'drops', label: 'Drops on glass', type: 'range', min: 0, max: 1.5, step: 0.01, def: 1 },
      { key: 'dropSize', label: 'Drop size', type: 'range', min: 0.5, max: 1.8, step: 0.01, def: 1 },

    { tab: 'Window', items: [
      { key: 'frame', label: 'Frame', type: 'choice', options: [['auto', 'auto'], ['picture', 'picture'], ['casement', 'casement'], ['cross', 'cross'], ['sash', 'sash'], ['loft', 'loft'], ['train', 'train'], ['none', 'none']], def: 'auto' },
      { key: 'material', label: 'Finish', type: 'choice', options: [['auto', 'auto'], ['white', 'white'], ['oak', 'oak'], ['charcoal', 'charcoal'], ['green', 'green'], ['steel', 'steel']], def: 'auto' },
      { key: 'candle', label: 'Candle', type: 'choice', options: [['auto', 'auto'], ['on', 'on'], ['off', 'off']], def: 'auto' },

    { tab: 'Sound', items: [
