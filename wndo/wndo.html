    ] },
    { tab: 'Image', items: [
      { key: 'exposure', label: 'Brightness', type: 'range', min: -2, max: 2, step: 0.01, def: 0 },
      { key: 'warm', label: 'Warmth', type: 'range', min: -1, max: 1, step: 0.01, def: 0 },
      { key: 'sat', label: 'Colour', type: 'range', min: 0, max: 1.6, step: 0.01, def: 1 },
      { key: 'grain', label: 'Film grain', type: 'range', min: 0, max: 1, step: 0.01, def: 0.25 },
      { key: 'vignette', label: 'Vignette', type: 'range', min: 0, max: 1, step: 0.01, def: 0.35 },
    ] },
    { tab: 'Performance', items: [
      { key: 'quality', label: 'Quality', type: 'choice', options: [['battery', 'battery'], ['balanced', 'balanced'], ['high', 'high'], ['ultra', 'ultra']], def: 'high' },
      { key: 'bokehOnly', label: 'Bokeh only', hint: 'skip the scenery, keep the lights. Very light on battery', type: 'toggle', def: false },
      { key: 'fps', label: 'Frame cap', type: 'choice', options: [['24', '24'], ['30', '30'], ['60', '60'], ['0', 'none']], def: '60' },
      { key: 'autoRes', label: 'Adapt resolution', hint: 'lowers detail when the device struggles', type: 'toggle', def: true },
      { key: 'smartRes', label: 'Save work while blurred', hint: 'draws the outside at half detail when you cannot see it sharp anyway', type: 'toggle', def: true },
      { key: 'showFps', label: 'Show frame rate', type: 'toggle', def: false },
    ] },
    { tab: 'Extras', items: [
      { key: 'clock', label: 'Clock', type: 'choice', options: [['off', 'off'], ['24', '24 h'], ['12', '12 h']], def: 'off' },
      { key: 'sleep', label: 'Sleep timer', hint: 'fades sound and picture out', type: 'choice', options: [['0', 'off'], ['15', '15 min'], ['30', '30 min'], ['60', '1 h'], ['90', '1.5 h']], def: '0' },
      { key: 'cycle', label: 'Wander', hint: 'drift to another window every so often', type: 'choice', options: [['0', 'off'], ['10', '10 min'], ['30', '30 min'], ['60', '1 h']], def: '0' },
      { key: 'awake', label: 'Keep the screen awake', hint: 'for leaving it running on a tablet', type: 'toggle', def: true },
      { key: 'hideDelay', label: 'Hide controls after', type: 'choice', options: [['3', '3 s'], ['6', '6 s'], ['15', '15 s']], def: '3' },
    ] },
  ];

  const QUALITY = {
    battery: { scale: 0.5, scene: 0.6, out: 0.75, drops: 1, maxH: 1080 },
    balanced: { scale: 0.7, scene: 0.75, out: 1, drops: 1, maxH: 1440 },
    high: { scale: 0.85, scene: 1, out: 1, drops: 2, maxH: 1440 },
    ultra: { scale: 1, scene: 1, out: 1, drops: 2, maxH: 2160 },
  };

  class Settings {
    constructor() {
      this.g = {};
      this.s = W.store.get('scene-settings', {});
      this.listeners = [];
      this.idx = new Map();
      for (const tab of SCHEMA) for (const it of tab.items) this.idx.set(it.key, it);
      for (const tab of SCHEMA) for (const it of tab.items) if (it.scope !== 'scene') this.g[it.key] = it.def;
      if (navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) < 1100) this.g.quality = 'balanced';
      Object.assign(this.g, W.store.get('settings', {}));
      this.g.sleep = '0';
      this.focus = 0;
    }
    item(key) {
      return this.idx.get(key) || null;
    }
    // value for key, considering the current scene
    get(key, scene) {
      if (key === 'focus') return W.app ? W.app.focusTarget : 0;
      const it = this.item(key);
      if (it && it.scope === 'scene') {
        const s = this.s[scene.id] || {};
        if (key in s) return s[key];
        if (scene.defaults && key in scene.defaults) {
          const d = scene.defaults[key];
          return it.type === 'choice' ? String(d) : d;
        }
        return it.def;
      }
      return this.g[key];
    }
    set(key, val, scene) {
      if (key === 'focus') {
        if (W.app) W.app.focusTarget = val;
        return;
      }
      const it = this.item(key);
      if (it && it.scope === 'scene') {
        (this.s[scene.id] = this.s[scene.id] || {})[key] = val;
        W.store.set('scene-settings', this.s);
      } else {
        this.g[key] = val;
        W.store.set('settings', this.g);
      }
      this.listeners.forEach((f) => f(key, val));
    }
    resetScene(scene) {
      delete this.s[scene.id];
      W.store.set('scene-settings', this.s);
      this.listeners.forEach((f) => f('*', null));
    }
    resetAll() {
      this.s = {};
      this.g = {};
      for (const tab of SCHEMA) for (const it of tab.items) if (it.scope !== 'scene') this.g[it.key] = it.def;
      W.store.set('settings', this.g);
      W.store.set('scene-settings', this.s);
      this.listeners.forEach((f) => f('*', null));
    }
    on(f) {
      this.listeners.push(f);
    }
  }

  W.SCHEMA = SCHEMA;
  W.QUALITY = QUALITY;
  W.Settings = Settings;
})();

</script>

(() => {

  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  const ICONS = {
    focus: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.2"/><path d="M10 2.8v3M10 14.2v3M2.8 10h3M14.2 10h3"/><circle cx="10" cy="10" r="1.6"/></svg>',
    focusFar: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.2"/><path d="M5.5 12.5l3-3 2 2 4-4.5"/></svg>',
    sound: '<svg viewBox="0 0 20 20"><path d="M3.5 8v4h3l4 3.2V4.8l-4 3.2z"/><path d="M13.3 7.4a3.6 3.6 0 010 5.2M15.4 5.3a6.6 6.6 0 010 9.4"/></svg>',
    mute: '<svg viewBox="0 0 20 20"><path d="M3.5 8v4h3l4 3.2V4.8l-4 3.2z"/><path d="M13.5 8l4 4M17.5 8l-4 4"/></svg>',
    set: '<svg viewBox="0 0 20 20"><path d="M3 5.5h14M3 10h14M3 14.5h14"/><rect x="5.5" y="4" width="2.4" height="3" rx=".4"/><rect x="11.8" y="8.5" width="2.4" height="3" rx=".4"/><rect x="7.6" y="13" width="2.4" height="3" rx=".4"/></svg>',
    full: '<svg viewBox="0 0 20 20"><path d="M3.5 7.5v-4h4M12.5 3.5h4v4M16.5 12.5v4h-4M7.5 16.5h-4v-4"/></svg>',
  };

  const UI = (W.UI = {
    tab: 'View',
    idle: 0,
    fpsAcc: [],
    sleepAt: 0,
    cycleAt: 0,
  });

  UI.init = function (app) {
    this.app = app;
    const S = app.S;
    // dial
    const dial = $('#dial');
    this.needle = el('div', null);
    this.needle.id = 'needle';
    dial.appendChild(this.needle);
    app.scenes.forEach((sc, i) => {
      const b = el('button', 'stn', '<span class="num">0' + (i + 1) + '</span><span class="lbl">' + sc.name + '</span>');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.addEventListener('click', () => app.setScene(i));
      dial.appendChild(b);
    });
    // tools
    $('#t-set').innerHTML = ICONS.set;
    $('#t-full').innerHTML = ICONS.full;
    if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) $('#t-full').style.display = 'none';
    this.paintTools();
    $('#t-focus').addEventListener('click', () => {
      app.toggleFocus();
      this.paintTools();
    });
    $('#t-sound').addEventListener('click', () => this.toggleSound());
    $('#t-set').addEventListener('click', () => this.panel(!$('#panel').classList.contains('open')));
    $('#p-close').addEventListener('click', () => this.panel(false));
    $('#t-full').addEventListener('click', () => this.fullscreen());
    $('#reset-scene').addEventListener('click', () => {
      S.resetScene(app.scene);
      this.toast('this place is back to how it was');
    });
    $('#reset-all').addEventListener('click', () => {
      S.resetAll();
      app.applyQuality();
      this.toast('everything reset');
    });
    // tabs
    const tabs = $('#tabs');
    W.SCHEMA.forEach((t) => {
      const b = el('button', 'tab', t.tab);
      b.type = 'button';
      b.addEventListener('click', () => {
        this.tab = t.tab;
        this.renderPanel();
      });
      tabs.appendChild(b);
    });
    S.on((key) => this.onSetting(key));
    W.bus.on('scene', () => {
      this.paintPlace();
      if ($('#panel').classList.contains('open')) this.renderPanel();
    });
    W.bus.on('leaving', (sc) => this.paintPlace(sc));
    this.bindInput();
    this.paintPlace();
    // intro: needs a gesture before sound can start
    const intro = $('#intro');
    const open = () => {
      if (this.opened) return;
      this.opened = true;
      intro.classList.add('gone');
      $('#hud').classList.remove('hidden');
      if (W.audio) W.audio.start(app);
      this.wake();
      this.poke();
    };
    $('#open').addEventListener('click', open);
    intro.addEventListener('click', (e) => {
      if (e.target === intro) open();
    });
    this.onSetting('clock');
    this.onSetting('sleep');
    this.onSetting('cycle');
    this.onSetting('showFps');
  };

  UI.paintPlace = function (sc) {
    const app = this.app;
    sc = sc || app.scene;
    if (!sc) return;
    const i = app.scenes.indexOf(sc);
    $('.place-name').textContent = sc.name;
    $('.place-sub').textContent = sc.sub;
    const stns = document.querySelectorAll('.stn');
    stns.forEach((b, k) => b.classList.toggle('on', k === i));
    requestAnimationFrame(() => {
      const b = stns[i];
      if (b) this.needle.style.left = b.offsetLeft + b.offsetWidth / 2 - 1 + 'px';
    });
  };

  UI.paintTools = function () {
    const app = this.app;
    const far = app.focusTarget > 0.5;
    const f = $('#t-focus');
    f.innerHTML = far ? ICONS.focusFar : ICONS.focus;
    f.classList.toggle('active', far);
    f.title = far ? 'Looking outside. Back to the glass (space)' : 'Looking at the glass. Look outside (space)';
    const muted = W.audio && W.audio.muted;
    $('#t-sound').innerHTML = muted ? ICONS.mute : ICONS.sound;
  };

  UI.toggleSound = function () {
    if (!W.audio) return;
    if (!W.audio.ctx) W.audio.start(this.app);
    W.audio.setMuted(!W.audio.muted);
    this.paintTools();
    this.toast(W.audio.muted ? 'sound off' : 'sound on');
  };

  UI.fullscreen = function () {
    const d = document, e = d.documentElement;
    const fs = d.fullscreenElement || d.webkitFullscreenElement;
    if (fs) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (e.requestFullscreen) e.requestFullscreen().catch(() => {});
    else if (e.webkitRequestFullscreen) e.webkitRequestFullscreen();
  };

  UI.panel = function (open) {
    const p = $('#panel');
    p.classList.toggle('open', open);
    p.setAttribute('aria-hidden', open ? 'false' : 'true');
    $('#t-set').classList.toggle('active', open);
    if (open) this.renderPanel();
    this.poke();
  };

  UI.renderPanel = function () {
    const app = this.app, S = app.S, sc = app.scene;
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.textContent === this.tab));
    const pane = $('#pane');
    pane.innerHTML = '';
    const tab = W.SCHEMA.find((t) => t.tab === this.tab);
    for (const it of tab.items) {
      if (it.only && !it.only.includes(sc.id)) continue;
      if (it.scope === 'scene' && sc.controls && !sc.controls.includes(it.key) && !it.only) continue;
      const row = el('div', 'row');
      const top = el('div', 'row-top');
      const lab = el('label', null, it.label + (it.scope === 'scene' ? '<span class="scope">this place</span>' : ''));
      top.appendChild(lab);
      const v = S.get(it.key, sc);
      if (it.type === 'range') {
        const out = el('span', 'val', fmt(v, it));
        top.appendChild(out);
        row.appendChild(top);
        const inp = document.createElement('input');
        inp.type = 'range';
        inp.min = it.min;
        inp.max = it.max;
        inp.step = it.step;
        inp.value = v;
        inp.setAttribute('aria-label', it.label);
        const paint = () => inp.style.setProperty('--p', ((inp.value - it.min) / (it.max - it.min)) * 100 + '%');
        paint();
        inp.addEventListener('input', () => {
          S.set(it.key, +inp.value, sc);
          out.textContent = fmt(+inp.value, it);
          paint();
          if (it.key === 'focus') this.paintTools();
        });
        if (it.key === 'focus') this.focusInput = { inp, out, paint, it };
        if (it.hint) row.appendChild(el('div', 'hint', it.hint));
        row.appendChild(inp);
      } else if (it.type === 'toggle') {
        const t = el('button', 'tog' + (v ? ' on' : ''));
        t.type = 'button';
        t.setAttribute('aria-label', it.label);
        t.setAttribute('aria-pressed', v ? 'true' : 'false');
        t.addEventListener('click', () => {
          const nv = !S.get(it.key, sc);
          S.set(it.key, nv, sc);
          t.classList.toggle('on', nv);
          t.setAttribute('aria-pressed', nv ? 'true' : 'false');
        });
        top.appendChild(t);
        row.appendChild(top);
        if (it.hint) row.appendChild(el('div', 'hint', it.hint));
      } else {
        row.appendChild(top);
        if (it.hint) row.appendChild(el('div', 'hint', it.hint));
        const seg = el('div', 'seg');
        for (const [val, name] of it.options) {
          const b = el('button', String(v) === val ? 'on' : '', name);
          b.type = 'button';
          b.addEventListener('click', () => {
            S.set(it.key, val, sc);
            seg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
            if (it.key === 'parallax' && val === 'motion') this.askMotion();
          });
          seg.appendChild(b);
        }
        row.appendChild(seg);
      }
      pane.appendChild(row);
    }
  };

  function fmt(v, it) {
    if (it.key === 'focus') return v < 0.02 ? 'glass' : v > 0.98 ? 'far' : Math.round(v * 100) + '';
    if (it.key === 'exposure') return (v > 0 ? '+' : '') + v.toFixed(1) + ' ev';
    if (it.key === 'warm') return (v > 0 ? '+' : '') + Math.round(v * 100);
    return Math.round(((v - it.min) / (it.max - it.min)) * 100) + '';
  }

  UI.askMotion = function () {
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function') {
      D.requestPermission().then((r) => {
        if (r !== 'granted') this.toast('tilt needs motion access');
      }).catch(() => this.toast('tilt needs motion access'));
    }
    this.app.tilt0 = null;
  };

  UI.onSetting = function (key) {
    const app = this.app, S = app.S;
    if (key === 'quality' || key === '*') {
      app.dyn = 1;
      app.dynCeil = 1;
      app.applyQuality();
    }
    if (key === 'clock' || key === '*') $('#clock').hidden = S.g.clock === 'off';
    if (key === 'showFps' || key === '*') $('#fps').hidden = !S.g.showFps;
    if (key === 'awake') this.wake();
    if (key === 'sleep' || key === '*') {
      const m = +S.g.sleep;
      this.sleepAt = m ? performance.now() + m * 60000 : 0;
      app.dim = 1;
      if (m && key === 'sleep') this.toast('sleeping in ' + m + ' min');
    }
    if (key === 'cycle' || key === '*') {
      const m = +S.g.cycle;
      this.cycleAt = m ? performance.now() + m * 60000 : 0;
    }
    if (W.audio && W.audio.ctx) W.audio.settings(S);
  };

  // screen wake lock: re-requested whenever the page comes back into view
  UI.wake = function () {
    const S = this.app.S;
    if (!navigator.wakeLock || !S.g.awake || !this.opened) {
      if (this.lock) { this.lock.release().catch(() => {}); this.lock = null; }
      return;
    }
    if (this.lock || document.hidden) return;
    navigator.wakeLock.request('screen').then((l) => {
      this.lock = l;
      l.addEventListener('release', () => (this.lock = null));
    }).catch(() => {});
  };

  UI.toast = function (msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this.toastT);
    this.toastT = setTimeout(() => t.classList.remove('show'), 1800);
  };

  UI.poke = function () {
    this.idle = 0;
    document.body.classList.remove('idle');
  };

  UI.bindInput = function () {
    const app = this.app, canvas = $('#view');
    ['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((ev) => window.addEventListener(ev, () => this.poke(), { passive: true }));
    // draw in the condensation
    let last = null;
    const toGlass = (e) => {
      const R = app.R, c = R.cam;
      const a = innerWidth / innerHeight;
      const sx = (e.clientX / innerWidth - 0.5) * a, sy = 0.5 - e.clientY / innerHeight;
      const hx = (c.head[0] + c.shake[0]) * c.kp / 1.16, hy = (c.head[1] + c.shake[1]) * c.kp / 1.16;
      return [sx + hx + a / 2, sy + hy + 0.5];
    };
    canvas.addEventListener('pointerdown', (e) => {
      if ($('#panel').classList.contains('open')) {
        this.panel(false);
        return;
      }
      if (!app.S.g.wipe) return;
      canvas.setPointerCapture(e.pointerId);
      last = toGlass(e);
      app.R.addWipe(last[0], last[1], last[0] + 0.001, last[1]);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!last) return;
      const p = toGlass(e);
      app.R.addWipe(last[0], last[1], p[0], p[1]);
      last = p;
    });
    let tapT = 0, tapX = 0, tapY = 0, downX = 0, downY = 0;
    canvas.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
    const end = (e) => {
      last = null;
      if (!e || e.pointerType !== 'touch') return;
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > 12) return;
      const now = performance.now();
      if (now - tapT < 320 && Math.hypot(e.clientX - tapX, e.clientY - tapY) < 40) {
        app.toggleFocus();
        this.paintTools();
        tapT = 0;
      } else {
        tapT = now; tapX = e.clientX; tapY = e.clientY;
      }
    };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('dblclick', () => {
      app.toggleFocus();
      this.paintTools();
    });
    // the wheel racks focus by hand
    window.addEventListener('wheel', (e) => {
      if (e.target.closest && e.target.closest('#panel')) return;
      app.focusTarget = W.clamp(app.focusTarget - e.deltaY * 0.0012, 0, 1);
      this.paintTools();
    }, { passive: true });
    window.addEventListener('keydown', (e) => {
      if (e.target && e.target.tagName === 'INPUT' && e.key !== 'Escape') return;
      const k = e.key.toLowerCase();
      if (k === ' ') { e.preventDefault(); app.toggleFocus(); this.paintTools(); }
      else if (k === 'arrowright') app.next(1);
      else if (k === 'arrowleft') app.next(-1);
      else if (k === 'm') this.toggleSound();
      else if (k === 's') this.panel(!$('#panel').classList.contains('open'));
      else if (k === 'f') this.fullscreen();
      else if (k === 'h') { document.body.classList.add('idle'); this.idle = 1e9; }
      else if (k === 'escape') this.panel(false);
      else if (/^[1-9]$/.test(k) && +k <= app.scenes.length) app.setScene(+k - 1);
      else if (k === 'enter' && !this.opened) $('#open').click();
    });
    document.addEventListener('visibilitychange', () => this.wake());
  };

  UI.tick = function (dt, t, ms) {
    const app = this.app, S = app.S, now = performance.now();
    this.idle += dt;
    const fi = this.focusInput;
    if (fi && fi.inp.isConnected && document.activeElement !== fi.inp && Math.abs(+fi.inp.value - app.focusTarget) > 0.005) {
      fi.inp.value = app.focusTarget;
      fi.out.textContent = fmt(app.focusTarget, fi.it);
      fi.paint();
    }
    const open = $('#panel').classList.contains('open');
    if (this.opened && !open && this.idle > +S.g.hideDelay) document.body.classList.add('idle');
    if (S.g.clock !== 'off') {
      const d = new Date();
      let h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, '0');
      let suf = '';
      if (S.g.clock === '12') {
        suf = '<small>' + (h < 12 ? 'am' : 'pm') + '</small>';
        h = h % 12 || 12;
      }
      const txt = (S.g.clock === '24' ? String(h).padStart(2, '0') : h) + ':' + m + suf;
      if (txt !== this.clockTxt) $('#clock').innerHTML = this.clockTxt = txt;
    }
    if (S.g.showFps) {
      this.fpsAcc.push(ms);
      if (this.fpsAcc.length > 30) this.fpsAcc.shift();
      if ((this.fpsN = (this.fpsN || 0) + 1) % 15 === 0) {
        const a = this.fpsAcc.reduce((x, y) => x + y, 0) / this.fpsAcc.length;
        const c = app.R.canvas;
        $('#fps').textContent = Math.round(1000 / a) + ' fps  ' + c.width + 'x' + c.height + (app.dyn < 1 ? '  adaptive ' + Math.round(app.dyn * 100) + '%' : '');
      }
    }
    // sleep timer: the last minute fades sound and picture to nothing
    if (this.sleepAt) {
      const left = (this.sleepAt - now) / 1000;
      app.dim = W.clamp(left / 60, 0, 1);
      if (left <= 0) {
        this.sleepAt = 0;
        S.g.sleep = '0';
        app.dim = 0;
        app.paused = true;
        if (W.audio) W.audio.setMuted(true, true);
        const wake = () => {
          app.paused = false;
          app.dim = 1;
          if (W.audio) W.audio.setMuted(false, true);
          window.removeEventListener('pointerdown', wake);
          window.removeEventListener('keydown', wake);
        };
        window.addEventListener('pointerdown', wake);
        window.addEventListener('keydown', wake);
      }
    }
    if (this.cycleAt && now > this.cycleAt) {
      this.cycleAt = now + +S.g.cycle * 60000;
      app.next(1);
    }
  };
})();

</script>
<script>
// src/audio/audio.js
// wndo :: sound. Everything is synthesised: noise, filters, a little DSP for the textures.
// Outside sounds pass through "the window" (a lowpass that opens when the window is cracked open).
(() => {
  const W = window.W;
  const A = (W.audio = { ctx: null, muted: false, scape: null, layers: {}, timers: [] });
  const rnd = Math.random;
  const R = (a, b) => a + (b - a) * rnd();

  // ---------- offline DSP helpers ----------
  function biquad(type, f, q, sr) {
    const w = (2 * Math.PI * f) / sr, al = Math.sin(w) / (2 * q), c = Math.cos(w);
    let b0, b1, b2;
    if (type === 'bp') { b0 = al; b1 = 0; b2 = -al; }
    else if (type === 'lp') { b0 = (1 - c) / 2; b1 = 1 - c; b2 = (1 - c) / 2; }
    else { b0 = (1 + c) / 2; b1 = -(1 + c); b2 = (1 + c) / 2; }
    const a0 = 1 + al;
    return [b0 / a0, b1 / a0, b2 / a0, (-2 * c) / a0, (1 - al) / a0];
  }
  function filt(x, co) {
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let i = 0; i < x.length; i++) {
      const y = co[0] * x[i] + co[1] * x1 + co[2] * x2 - co[3] * y1 - co[4] * y2;
      x2 = x1; x1 = x[i]; y2 = y1; y1 = y; x[i] = y;
    }
    return x;
  }
  function norm(x, peak) {
    let m = 0;
    for (let i = 0; i < x.length; i++) m = Math.max(m, Math.abs(x[i]));
    if (m > 0) for (let i = 0; i < x.length; i++) x[i] *= peak / m;
    return x;
  }
  // mix a mono grain into a stereo buffer with constant-power pan, wrapping around the loop end
  function place(L, Rr, g, at, gain, pan) {
    const a = ((pan + 1) * Math.PI) / 4, gl = Math.cos(a) * gain, gr = Math.sin(a) * gain, n = L.length;
    for (let i = 0; i < g.length; i++) {
      const j = (at + i) % n;
      L[j] += g[i] * gl;
      Rr[j] += g[i] * gr;
    }
  }

  // ---------- grains ----------
  function tapGrain(sr) {
    const n = Math.floor(sr * R(0.012, 0.03)), g = new Float32Array(n);
    const dec = R(0.0012, 0.004) * sr;
    for (let i = 0; i < n; i++) g[i] = (rnd() * 2 - 1) * Math.exp(-i / dec);
    filt(g, biquad('bp', R(1800, 6500), R(3, 9), sr));
    const thud = R(0, 0.6), f = R(140, 420);
    for (let i = 0; i < n; i++) g[i] += thud * Math.sin((2 * Math.PI * f * i) / sr) * Math.exp(-i / (0.006 * sr)) * 0.3;
    return norm(g, 1);
  }
  // a single small drop on pavement: a fraction of a millisecond of filtered crackle
  function patterGrain(sr) {
    const n = Math.floor(sr * R(0.002, 0.006)), g = new Float32Array(n);
    const dec = R(0.0003, 0.0012) * sr;
    for (let i = 0; i < n; i++) g[i] = (rnd() * 2 - 1) * Math.exp(-i / dec);
    filt(g, biquad('bp', R(1200, 5200), R(1.2, 3), sr));
    return norm(g, 1);
  }
  // a fat drop on the metal ledge outside the window
  function tinkGrain(sr) {
    const n = Math.floor(sr * 0.08), g = new Float32Array(n);
    for (let i = 0; i < n; i++) g[i] = (rnd() * 2 - 1) * Math.exp(-i / (0.0008 * sr));
    filt(g, biquad('bp', R(2300, 4200), R(18, 40), sr));
    const f2 = R(700, 1100);
    for (let i = 0; i < n; i++) g[i] += Math.sin((2 * Math.PI * f2 * i) / sr) * Math.exp(-i / (0.012 * sr)) * 0.05;
    return norm(g, 1);
  }
  function plinkGrain(sr) {
    const n = Math.floor(sr * 0.25), g = new Float32Array(n);
    const f0 = R(520, 1300), tau = R(0.035, 0.09) * sr;
    let ph = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr, f = f0 * (1 + 0.7 * (1 - Math.exp(-t / 0.014)));
      ph += (2 * Math.PI * f) / sr;
      g[i] = Math.sin(ph) * Math.exp(-i / tau) * Math.min(1, i / (0.001 * sr));
    }
    for (let i = 0; i < 90; i++) g[i] += (rnd() * 2 - 1) * 0.3 * (1 - i / 90);
    return norm(g, 1);
  }
  function crackleGrain(sr, big) {
    const n = Math.floor(sr * (big ? 0.06 : 0.02)), g = new Float32Array(n);
    const dec = (big ? R(0.004, 0.012) : R(0.0008, 0.004)) * sr;
    for (let i = 0; i < n; i++) g[i] = (rnd() * 2 - 1) * Math.exp(-i / dec);
    filt(g, biquad('bp', R(1500, 7000), R(1.2, 5), sr));
    if (big) for (let i = 0; i < n; i++) g[i] += Math.sin((2 * Math.PI * 110 * i) / sr) * Math.exp(-i / (0.01 * sr)) * 0.6;
    return norm(g, 1);
  }
  function clackGrain(sr) {
    const n = Math.floor(sr * 0.16), g = new Float32Array(n);
    let ph = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      ph += (2 * Math.PI * (95 - 40 * t * 8)) / sr;
      g[i] = Math.sin(ph) * Math.exp(-t / 0.05) * 0.9;
    }
    const nz = new Float32Array(n);

    const t0 = ctx.currentTime + Math.max(0, e.eta - 1.6), crash = t0 + 1.6, end = crash + R(4, 6.5);
    const s = ctx.createBufferSource();
    s.buffer = this.buf.pink;
    const lp = this.filter('lowpass', 300, 0.6);
    lp.frequency.setValueAtTime(260, t0);
    lp.frequency.exponentialRampToValueAtTime(2600 + e.size * 1800, crash);
    lp.frequency.exponentialRampToValueAtTime(500, end);
    const g = this.gain(0);
    const pk = 0.22 + e.size * 0.35;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(pk * 0.5, crash - 0.2);
    g.gain.exponentialRampToValueAtTime(pk, crash + 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    const pan = ctx.createStereoPanner();
    pan.pan.value = R(-0.4, 0.4);
    this.chain(s, lp, g, pan, this.scape.out);
    const f = ctx.createBufferSource();
    f.buffer = this.buf.white;
    const hp = this.filter('highpass', 2600, 0.5);
    const fg = this.gain(0);
    fg.gain.setValueAtTime(0.0001, crash);
    fg.gain.exponentialRampToValueAtTime(0.07 + e.size * 0.08, crash + 0.6);
    fg.gain.exponentialRampToValueAtTime(0.0001, end + 1.5);
    this.chain(f, hp, fg, pan);
    s.start(t0, rnd() * 5);
    s.stop(end + 0.1);
    f.start(crash, rnd() * 4);
    f.stop(end + 1.6);
  };

  // level crossing: a bell that slides past with the doppler drop
  A.crossing = function (e) {
    const ctx = this.ctx;
    if (!ctx || !this.scape || this.scape.id !== 'train') return;
    const t0 = ctx.currentTime, len = e.duration;
    for (let k = 0; k * 0.48 < len; k++) {
      const tt = t0 + k * 0.48, x = (k * 0.48) / len;
      const near = Math.exp(-Math.pow((x - e.mid) / 0.22, 2));
      const rate = 1.06 - 0.12 / (1 + Math.exp(-(x - e.mid) * 14));
      this.grain(this.grains.bell[0], tt, 0.05 + near * 0.28, W.lerp(0.85, -0.85, x), this.scape.out, rate);
    }
  };
  A.tunnel = function (e) {
    if (!this.scape || !this.scape.tunnel) return;
    this.scape.tunnel(e.inside);
  };

  // ---------- places ----------
  const SCAPES = {
    city(a, out) {
      const hum = a.gain(0.0);
      a.chain(a.loopSrc(a.buf.brown, 0.7), a.filter('lowpass', 210), hum, out);
      const drip = { last: 0 };
      return {
        update(dt, t, app) {
          a.ramp(hum.gain, 0.08 + app.env.traffic * 0.22, 1);
        },
        events: [
          { // a gutter dripping into a puddle, almost regular
            first: () => R(0.5, 2),
            gap: () => (drip.period = drip.period && rnd() > 0.04 ? drip.period : R(0.45, 1.6)) * R(0.92, 1.08),
            fire: (t) => {
              const r = a.app.env.wet;
              if (r < 0.08) return;
              const g = a.grains.plink[Math.floor(rnd() * a.grains.plink.length)];
              a.grain(g, t, 0.05 + r * 0.1, -0.55, a.verbIn, R(0.95, 1.05));
              a.grain(g, t, 0.04 + r * 0.08, -0.55, a.bus.rain, R(0.95, 1.05));
            },
          },
        ],
        stop() { out.disconnect(); },
      };
    },

    forest(a, out) {
      const call = (t) => {
        const ctx = a.ctx, sp = Math.floor(rnd() * 4);
        const pan = R(-0.8, 0.8), dist = R(0.3, 1);
        const lp = a.filter('lowpass', 7000 - dist * 3500, 0.5);
        const pn = ctx.createStereoPanner();
        pn.pan.value = pan;
        const vol = a.gain(0.05 * (1.2 - dist) * (1 - a.app.env.gust * 0.7));
        a.chain(lp, vol, pn, out);
        pn.connect(a.gain(0.4)).connect(a.verbIn);
        const note = (t0, f0, f1, dur, amp, type = 'sine') => {
          const o = ctx.createOscillator();
          o.type = type;
          o.frequency.setValueAtTime(f0, t0);
          o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
          const g = a.gain(0);
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(amp, t0 + Math.min(0.02, dur * 0.25));
          g.gain.setValueAtTime(amp, t0 + dur * 0.7);
          g.gain.linearRampToValueAtTime(0, t0 + dur);
          a.chain(o, g, lp);
          o.start(t0);
          o.stop(t0 + dur + 0.02);
        };
        let tt = t;
        if (sp === 0) { // two clear whistles, the second lower
          const f = R(3000, 4200);
          note(tt, f, f * 0.98, 0.32, 1);
          note(tt + 0.42, f * 0.84, f * 0.82, 0.38, 0.9);
        } else if (sp === 1) { // a trill
          const n = Math.floor(R(8, 16)), f = R(3500, 5200);
          for (let i = 0; i < n; i++) note(tt + i * 0.055, f * (1 - i * 0.012), f * 0.9 * (1 - i * 0.012), 0.04, 0.7);
        } else if (sp === 2) { // a wandering phrase
          let f = R(2200, 3200);
          for (let i = 0; i < 5; i++) {
            const f1 = f * R(0.8, 1.3);
            note(tt, f, f1, R(0.08, 0.18), 0.8);
            tt += R(0.12, 0.24);
            f = f1;
          }
        } else { // a wood pigeon, far off
          const f = R(430, 520);
          [0, 0.5, 0.75, 1.4, 1.9].forEach((d, i) => note(t + d, f * (i === 2 ? 0.9 : 1), f * 0.95, i === 0 || i === 3 ? 0.42 : 0.22, 1.4));
        }
      };
      const creak = (t) => {
        const ctx = a.ctx;
        const o = ctx.createOscillator();
        o.type = 'sawtooth';
        const f = R(70, 140);
        o.frequency.setValueAtTime(f, t);
        o.frequency.linearRampToValueAtTime(f * R(1.1, 1.5), t + 0.9);
        const bp = a.filter('bandpass', R(500, 900), 6);
        const g = a.gain(0);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.012 * a.app.env.gust, t + 0.3);
        g.gain.linearRampToValueAtTime(0, t + 1.1);
        a.chain(o, bp, g, out);
        o.start(t);
        o.stop(t + 1.2);
      };
      return {
        events: [
          { first: () => R(2, 6), gap: () => R(4, 14) * (1 + a.app.env.gust * 2), fire: call },
          { first: () => R(5, 12), gap: () => R(6, 18), fire: (t) => a.app.env.gust > 0.3 && creak(t) },
        ],
        stop() { out.disconnect(); },
      };
    },

    snow(a, out) {
      // the fire behind you, and a clock
      const roar = a.gain(0);
      const mod = a.gain(0);
      a.loopSrc(a.buf.flick).connect(mod.gain);
      a.chain(a.loopSrc(a.buf.brown, 0.9), a.filter('lowpass', 320), mod, roar, a.bus.room);
      const hiss = a.gain(0.004);
      a.chain(a.loopSrc(a.buf.white), a.filter('highpass', 4500), hiss, a.bus.room);
      a.ramp(roar.gain, 0.6, 2);
      let burst = 0;
      return {
        events: [
          {
            first: () => 0.2,
            gap: () => (burst > 0 ? R(0.02, 0.09) : R(0.08, 0.7)),
            fire: (t) => {
              if (burst > 0) burst--;
              else if (rnd() < 0.08) burst = Math.floor(R(3, 9));
              const big = rnd() < 0.05;
              const g = big ? a.grains.pop : a.grains.crackle;
              a.grain(g[Math.floor(rnd() * g.length)], t, big ? 0.24 : R(0.025, 0.14), R(-0.35, 0.05), a.bus.room, R(0.8, 1.25));
            },
          },
          {
            first: () => 0.5,
            gap: () => 1,
            fire: (t) => {
              a.tickN = (a.tickN || 0) + 1;
              a.grain(a.grains.tick[a.tickN % 2], t, 0.022, 0.45, a.bus.room);
            },
          },
        ],
        stop() {
          a.ramp(roar.gain, 0, 0.6);
          a.ramp(hiss.gain, 0, 0.6);
          setTimeout(() => { roar.disconnect(); hiss.disconnect(); }, 3000);
          out.disconnect();
        },
      };
    },

    sea(a, out) {
      const surf = a.gain(0.0);
      a.chain(a.loopSrc(a.buf.pink, 0.7), a.filter('lowpass', 650), surf, out);
      const surf2 = a.gain(0.0);
      a.chain(a.loopSrc(a.buf.brown), a.filter('lowpass', 300), surf2, out);
      const gull = (t) => {
        const ctx = a.ctx;
        const pan = ctx.createStereoPanner();
        pan.pan.value = R(-0.9, 0.9);
        const lp = a.filter('lowpass', R(3500, 6000), 0.5);
        const vol = a.gain(R(0.012, 0.03));
        a.chain(lp, vol, pan, out);
        pan.connect(a.gain(0.5)).connect(a.verbIn);
        const n = Math.floor(R(1, 4));
        for (let i = 0; i < n; i++) {
          const t0 = t + i * R(0.4, 0.6);
          const o = ctx.createOscillator();
          o.type = 'sawtooth';
          const f = R(1100, 1500);
          o.frequency.setValueAtTime(f * 0.9, t0);
          o.frequency.linearRampToValueAtTime(f * 1.2, t0 + 0.08);
          o.frequency.exponentialRampToValueAtTime(f * 0.62, t0 + 0.42);
          const bp = a.filter('bandpass', 1900, 2.5);
          const g = a.gain(0);
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(1, t0 + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.45);
          a.chain(o, bp, g, lp);
          o.start(t0);
          o.stop(t0 + 0.5);
        }
      };
      return {
        update(dt, t, app) {
          a.ramp(surf.gain, 0.08 + app.env.waves * 0.1, 1);
          a.ramp(surf2.gain, 0.16 + app.env.waves * 0.22, 1);
        },
        events: [{ first: () => R(3, 9), gap: () => R(9, 30), fire: gull }],
        stop() { out.disconnect(); },
      };
    },

    meadow(a, out) {
      const nodes = [];
      for (let i = 0; i < 6; i++) {
        const b = cricketLoop(a.ctx, R(3900, 4900), R(0.32, 0.72), Math.floor(R(3, 6)), R(26, 40), R(-0.9, 0.9));
        const g = a.gain(R(0.08, 0.19));
        a.chain(a.loopSrc(b), a.filter('lowpass', 7000), g, out);
        nodes.push(g);
      }
      for (let i = 0; i < 2; i++) {
        const b = trillLoop(a.ctx, R(2700, 3400), R(38, 55), R(-0.7, 0.7));
        const g = a.gain(0.04);
        a.chain(a.loopSrc(b), g, out);
        nodes.push(g);
      }
      const owl = (t) => {
        const ctx = a.ctx, f = R(330, 400);
        const pan = ctx.createStereoPanner();
        pan.pan.value = R(-0.8, 0.8);
        const vol = a.gain(0.03);
        a.chain(vol, pan, out);
        pan.connect(a.gain(0.8)).connect(a.verbIn);
        const pat = rnd() < 0.5 ? [[0, 0.5], [0.85, 0.3], [1.25, 0.9]] : [[0, 0.7], [1.1, 0.7]];
        for (const [d, len] of pat) {
          const o = ctx.createOscillator();
          o.frequency.setValueAtTime(f, t + d);
          o.frequency.linearRampToValueAtTime(f * 0.92, t + d + len);
          const g = a.gain(0);
          g.gain.setValueAtTime(0, t + d);
          g.gain.linearRampToValueAtTime(1, t + d + 0.12);
          g.gain.linearRampToValueAtTime(0, t + d + len);
          a.chain(o, a.filter('lowpass', 900), g, vol);
          o.start(t + d);
          o.stop(t + d + len + 0.05);
        }
      };
      const peeper = (t) => {
        const ctx = a.ctx, f = R(2500, 2900);
        const pan = ctx.createStereoPanner();
        pan.pan.value = R(-0.9, 0.9);
        const o = ctx.createOscillator();
        o.frequency.setValueAtTime(f, t);
        o.frequency.linearRampToValueAtTime(f * 1.15, t + 0.09);
        const g = a.gain(0);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.02, t + 0.02);
        g.gain.linearRampToValueAtTime(0, t + 0.1);
        a.chain(o, g, pan, out);
        o.start(t);
        o.stop(t + 0.12);
      };
      return {
        events: [
          { first: () => R(8, 20), gap: () => R(25, 70), fire: owl },
          { first: () => R(0.2, 1), gap: () => R(0.25, 1.4), fire: peeper },
        ],
        stop() { out.disconnect(); },
      };
    },

    train(a, out) {
      const rumble = a.gain(0);
      a.chain(a.loopSrc(a.buf.brown), a.filter('lowpass', 190), rumble, a.bus.room);
      const body = a.gain(0);
      a.chain(a.loopSrc(a.buf.pink), a.filter('bandpass', 75, 3), body, a.bus.room);
      const air = a.gain(0);
      const airBP = a.filter('bandpass', 700, 0.6);
      a.chain(a.loopSrc(a.buf.pink, 1.1), airBP, air, out);
      const hum = a.ctx.createOscillator();
      hum.frequency.value = 100;
      const hg = a.gain(0.004);
      a.chain(hum, hg, a.bus.room);
      hum.start();
      let speed = 0, inTunnel = 0, nextClack = 0;
      const S = {
        update(dt, t, app) {
          speed = app.env.speedMs || 0;
          const k = speed / 33;
          a.ramp(rumble.gain, (0.08 + k * 0.26) * (1 + inTunnel * 1.2), 0.3);
          a.ramp(body.gain, (0.05 + k * 0.25) * (1 + inTunnel), 0.3);
          a.ramp(air.gain, k * 0.06 * (1 + inTunnel * 2.5), 0.3);
          a.ramp(airBP.frequency, 500 + k * 500 + inTunnel * 400, 0.5);
        },
        tunnel(inside) {
          inTunnel = inside ? 1 : 0;
          a.ramp(a.winGain.gain, inside ? 0.25 : (a.open ? 1.1 : 0.85), 0.25);
        },
        events: [
          {
            first: () => 0.3,
            gap: () => 0.1,
            fire: (t) => {
              // joints every 25 m of rail: two bogies, two axles each
              if (speed < 1) return;
              if (t < nextClack) return;
              const per = 25 / speed;
              const pat = [0, 2.6, 17.4, 20.0];
              for (const d of pat) {
                const tt = t + d / speed;
                const g = a.grains.clack[Math.floor(rnd() * a.grains.clack.length)];
                a.grain(g, tt, (0.1 + Math.min(speed / 33, 1) * 0.16) * R(0.75, 1), R(-0.15, 0.15), a.bus.room, R(0.9, 1.1));
              }
              nextClack = t + per;
            },
          },
        ],
        stop() {
          [rumble, body, air, hg].forEach((g) => a.ramp(g.gain, 0, 0.5));
          setTimeout(() => { try { hum.stop(); } catch (e) { /* stopped */ } rumble.disconnect(); body.disconnect(); hg.disconnect(); }, 3000);
          a.ramp(a.winGain.gain, a.open ? 1.1 : 0.85, 0.3);
          out.disconnect();
        },
      };
      return S;
    },
  };
  A.SCAPES = SCAPES;
})();

</script>
<script>
// src/main.js
// wndo :: boot, environment, camera, loop
(() => {
  const W = window.W;
  const $ = (s) => document.querySelector(s);

  const app = (W.app = {
    scene: null,
    sceneIdx: 0,
    t: 0,
    env: { rain: 0, wind: 0, fog: 0, wet: 0, gust: 0, flash: 0, traffic: 0.6 },
    focus: 0,
    focusTarget: 0,
    head: [0, 0, 0, 0],
    pointer: [0, 0],
    tilt: null,
    fogT: 0,
    dyn: 1,
    frameTimes: [],
    started: false,
  });

  const rainN = W.noise1(17);
  const gustN = W.noise1(11), gustN2 = W.noise1(12), flickN = W.noise1(13), flickN2 = W.noise1(14), driftN = W.noise1(15), driftN2 = W.noise1(16);
  let pulses = [];
  let nextStrike = 20;

  function boot() {
    const canvas = $('#view');
    try {
      app.R = new W.Renderer(canvas);
    } catch (e) {
      showError(e);
      return;
    }
    app.S = new W.Settings();
    app.scenes = W.scenes;
    const last = W.store.get('scene', 'city');
    app.sceneIdx = Math.max(0, app.scenes.findIndex((s) => s.id === last));
    applyQuality();
    if (W.UI) W.UI.init(app);
    setScene(app.sceneIdx, true);
    window.addEventListener('resize', () => applyQuality());
    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      showError(new Error('The graphics context was lost. Reload the page to bring the window back.'));
    });
    document.addEventListener('pointermove', (e) => {
      app.pointer = [(e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1];
    });
    window.addEventListener('deviceorientation', (e) => {
      if (e.gamma == null) return;
      if (!app.tilt0) app.tilt0 = [e.gamma, e.beta];
      app.tilt = [W.clamp((e.gamma - app.tilt0[0]) / 25, -1, 1), W.clamp((e.beta - app.tilt0[1]) / 25, -1, 1)];
    });
    app.last = performance.now();
    app.paused = !!window.__still;
    requestAnimationFrame(loop);
  }

  function showError(e) {
    console.error(e);
    const el = $('#error');
    if (el) {
      el.hidden = false;
      el.querySelector('p').textContent = e.message || String(e);
    }
  }

  // canvas resolution from quality preset, device pixels and adaptive scale
  function applyQuality() {
    const S = app.S, q = W.QUALITY[S.g.quality] || W.QUALITY.high;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    let scale = q.scale * app.dyn;
    let w = innerWidth * dpr * scale, h = innerHeight * dpr * scale;
    if (h > q.maxH) {
      w *= q.maxH / h;
      h = q.maxH;
    }
    app.R.setDropQuality(q.drops);
    app.R.resize(Math.round(w), Math.round(h), q.scene, q.out);
    app.q = q;
  }
  app.applyQuality = applyQuality;

  function setScene(i, instant) {
    const n = app.scenes.length;
    i = ((i % n) + n) % n;
    app.target = i;
    const go = () => {
      i = app.target;
      app.target = null;
      const sc = app.scenes[i];
      if (!sc.ready) {
        try {
          sc.init(app.R);
          sc.ready = true;
        } catch (e) {
          showError(e);
          return;
        }
      }
      const prev = app.scene;
      if (prev && prev !== sc && prev.dispose) {
        prev.dispose(app.R);
        prev.ready = false;
      }
      app.scene = sc;
      app.sceneIdx = i;
      W.store.set('scene', sc.id);
      const S = app.S;
      app.env.wet = S.get('rain', sc) * 0.9;
      app.R.lights.clear();
      W.bus.emit('scene', sc);
    };
    if (instant || !app.scene) {
      go();
      app.fogT = 0;
      return;
    }
    if (app.transition && !app.transition.done) {
      W.bus.emit('leaving', app.scenes[i]);
      return;
    }
    if (i === app.sceneIdx) {
      app.target = null;
      return;
    }
    app.transition = { t: app.transition ? app.fogT * 0.9 : 0, go, done: false };
    W.bus.emit('leaving', app.scenes[i]);
  }
  app.setScene = setScene;
  app.next = (d) => setScene((app.target != null ? app.target : app.sceneIdx) + d);

  // the next weather update brings a strike, if lightning is on for this place
  app.strikeSoon = () => (nextStrike = 0);

  app.toggleFocus = () => {
    app.focusTarget = app.focusTarget > 0.5 ? 0 : 1;
    W.bus.emit('focus', app.focusTarget);
  };

  // ---- environment: weather values, gusts, lightning, wetness of the glass ----
  function updateEnv(dt, t) {
    const S = app.S, sc = app.scene, e = app.env;
    const target = {
      rain: S.get('rain', sc), wind: S.get('wind', sc), fog: S.get('fog', sc), cond: S.get('cond', sc),
      frost: S.get('frost', sc), traffic: S.get('traffic', sc), snow: S.get('snow', sc), waves: S.get('waves', sc),
      fireflies: S.get('fireflies', sc), speed: S.get('speed', sc),
    };
    if (target.rain > 0) target.rain = W.clamp(target.rain * (0.72 + 0.56 * rainN(t / 75)), 0, 1);
    const k = 1 - Math.exp(-dt * 1.5);
    for (const key in target) {
      const v = target[key] == null ? 0 : +target[key];
      e[key] = e[key] == null ? v : e[key] + (v - e[key]) * k;
    }
    const wantWet = sc.dry ? 0 : e.rain;
    const tau = wantWet > e.wet ? 6 : 60;
    e.wet += (wantWet - e.wet) * (1 - Math.exp(-dt / tau));
    // gusts: slow swell plus sharper bursts, shared with the sound
    const g = gustN(t * 0.11) * 0.65 + gustN2(t * 0.37) * 0.35;
    e.gust = e.wind * (0.35 + 0.9 * W.smoothstep(0.35, 0.85, g));
    // lightning
    const level = +S.get('lightning', sc);
    if (level > 0 && t > nextStrike) {
      const strike = { t, power: 0.4 + Math.random() * 0.6, dist: 1.5 + Math.random() * 9 };
      const n = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) pulses.push([t + i * (0.07 + Math.random() * 0.16), strike.power * (i === 0 ? 1 : 0.5 + Math.random() * 0.6)]);
      W.bus.emit('thunder', { delay: strike.dist, power: strike.power });
      nextStrike = t + (level > 1 ? 9 + Math.random() * 25 : 35 + Math.random() * 70);
    }
    if (level === 0) nextStrike = Math.max(nextStrike, t + 8);
    let f = 0;
    pulses = pulses.filter((p) => t - p[0] < 2);
    for (const p of pulses) {
      const dtp = t - p[0];
      if (dtp >= 0) f += p[1] * (Math.exp(-dtp / 0.06) * 1.6 + Math.exp(-dtp / 0.5) * 0.25);
    }
    e.flash = f;
  }

  // ---- camera: scene base, head parallax, drift ----
  function updateCamera(dt, t) {
    const S = app.S, R = app.R, c = R.cam, sc = app.scene;
    c.base = sc.cam.base;
    c.yaw = sc.cam.yaw;
    c.pitch = sc.cam.pitch;
    c.fovY = sc.cam.fovY;
    const amt = S.g.parallaxAmt;
    let tx = 0, ty = 0;
    if (S.g.parallax === 'mouse') {
      tx = app.pointer[0] * 0.075 * amt;
      ty = -app.pointer[1] * 0.045 * amt;
    } else if (S.g.parallax === 'motion' && app.tilt) {
      tx = app.tilt[0] * 0.075 * amt;
      ty = -app.tilt[1] * 0.045 * amt;
    }
    if (S.g.drift) {
      tx += (driftN(t * 0.05) - 0.5) * 0.03;
      ty += (driftN2(t * 0.04) - 0.5) * 0.018;
    }
    const hx = W.spring(app.head[0], app.head[2], tx, 3.2, dt);
    const hy = W.spring(app.head[1], app.head[3], ty, 3.2, dt);
    app.head = [hx[0], hy[0], hx[1], hy[1]];
    c.head = [app.head[0], app.head[1]];
    if (sc.shake) c.shake = sc.shake;
    else c.shake = [0, 0];
    c.update(R.aspect);
  }

  function lookOf(sc) {
    const S = app.S, L = sc.look;
    const pick = (k, d) => (S.g[k] && S.g[k] !== 'auto' ? S.g[k] : d);
    const on = (k, d) => (S.g[k] === 'on' ? true : S.g[k] === 'off' ? false : d);
    return {
      frame: pick('frame', L.frame),
      material: pick('material', L.material),
      candle: on('candle', L.candle),
      mug: on('mug', L.mug),
      plant: on('plant', L.plant),
    };
  }
  app.lookOf = lookOf;

  function params(dt, t) {
    const S = app.S, g = S.g, sc = app.scene, L = sc.look, e = app.env;
    // rack focus between the glass (1.16 m) and far away
    const k = 1 - Math.exp(-dt * 2.6);
    app.focus += (app.focusTarget - app.focus) * k;
    const f = app.focus * app.focus * (3 - 2 * app.focus);
    const focusInv = W.lerp(1 / 1.16, 1 / 600, f);
    const fl = flickN(t * 7) * 0.7 + flickN2(t * 19) * 0.3;
    const lampK = W.kelvin(L.lampK || 2750);
    const lamp = W.scale3(lampK, L.lamp * g.roomLight);
    const look = lookOf(sc);
    app.R.windowFor(look.frame, look.material, look);
    const shapes = { 0: 0, 5: 5, 6: 6, 8: 8 };
    return {
      env: e,
      K: 58 * g.aperture,
      focusInv,
      dTyp: L.dTyp,
      bloom: L.bloom,
      bokehOnly: g.bokehOnly,
      bokehGain: 1,
      bokehBoost: g.bokehBright,
      halo: g.halo * L.halo * (0.6 + e.fog * 0.5 + e.rain * 0.4),
      reflStretch: L.reflStretch,
      shutter: 1 / 50,
      blades: shapes[g.blades] || 0,
      rim: g.rim, cat: g.cat, ca: g.ca, soft: 0.05,
      wet: e.wet * g.drops * (sc.dry ? 0 : 1),
      runRate: (0.5 + e.rain * 0.9) * (sc.runK || 1),
      dropSize: g.dropSize,
      flowAng: sc.flowAng != null ? sc.flowAng : L.flowAng,
      cond: e.cond,
      frost: e.frost,
      fogT: app.fogT,
      smudge: 0.7,
      snowGlass: sc.snowGlass ? sc.snowGlass(e) : 0,
      wipeOn: g.wipe,
      refog: +g.refog,
      wall: W.lin(L.wall),
      lamp,
      flame: 1 + (fl - 0.5) * 0.35,
      flameSway: [(flickN2(t * 1.3) - 0.5) * 2, fl],
      refl: g.refl * L.refl,
      train: sc.id === 'train' ? (sc.tunnel ? 2.0 : 1) * g.refl : 0,
      flash: e.flash,
      flashCol: [0.75, 0.82, 1.0],
      exposure: L.exposure + g.exposure,
      sat: L.sat * g.sat,
      contrast: L.contrast,
      vignette: g.vignette,
      grain: g.grain,
      warm: g.warm,
      dim: app.dim == null ? 1 : app.dim,
      lift: L.lift,
      gain: L.gain,
    };
  }

  function loop(now) {
    requestAnimationFrame(loop);
    if (app.paused) return;
    if (document.hidden) {
      app.last = now;
      return;
    }
    const cap = +app.S.g.fps;
    const elapsed = now - app.last;
    if (cap > 0 && elapsed < 1000 / cap - 2) return;
    let dt = Math.min(elapsed / 1000, 0.1);
    app.last = now;
    app.t += dt;
    const t = app.t;
    // scene transition: the glass fogs over, the place changes, the fog lifts
    if (app.transition) {
      const tr = app.transition;
      tr.t += dt;
      if (!tr.done) {
        app.fogT = Math.min(1, tr.t / 0.9);
        if (tr.t >= 0.95) {
          tr.go();
          tr.done = true;
          tr.t = 0;
        }
      } else {
        app.fogT = Math.max(0, 1 - tr.t / 2.2);
        if (app.fogT <= 0) app.transition = null;
      }
    }
    const sc = app.scene;
    if (!sc) return;
    try {
      updateEnv(dt, t);
      updateCamera(dt, t);
      app.R.lights.clear();
      sc.update(dt, t, app.env, app.R, app);
      const P = params(dt, t);
      if (app.S.g.smartRes) {
        if (app.focus < 0.08 && app.focusTarget < 0.5) app.R.setSceneMul(0.5);
        else if (app.focus > 0.1 || app.focusTarget > 0.5) app.R.setSceneMul(1);
      } else app.R.setSceneMul(1);
      app.R.frame(t, dt, sc, P);
    } catch (e) {
      showError(e);
      app.scene = null;
      return;
    }
    if (W.audio && W.audio.ctx) W.audio.update(dt, t, app);
    if (W.UI) W.UI.tick(dt, t, elapsed);
    adapt(elapsed);
  }

  // for automated stills: step the simulation without drawing, then draw one frame
  app.still = (seconds, steps = 30) => {
    app.paused = true;
    const dt = seconds / steps;
    for (let i = 0; i < steps; i++) {
      app.t += dt;
      updateEnv(dt, app.t);
      updateCamera(dt, app.t);
      app.R.lights.clear();
      app.scene.update(dt, app.t, app.env, app.R, app);
      if (i === steps - 1) app.R.frame(app.t, dt, app.scene, params(dt, app.t));
    }
    app.R.gl.finish();
  };

  // adaptive resolution: watch the frame time against the cap
  let adaptT = 0;
  function adapt(ms) {
    if (!app.S.g.autoRes) return;
    const ft = app.frameTimes;
    ft.push(ms);
    if (ft.length > 90) ft.shift();
    adaptT += ms;
    if (adaptT < 2500 || ft.length < 60) return;
    adaptT = 0;
    const avg = ft.reduce((a, b) => a + b, 0) / ft.length;
    const cap = +app.S.g.fps || 60;
    const target = 1000 / Math.min(cap, 60);
    const now = performance.now();
    if (app.ceilUntil && now > app.ceilUntil) app.dynCeil = 1;
    if (avg > target * 1.35 && app.dyn > 0.55) {
      // remember what was too much for a while, so it does not climb straight back and stutter again
      app.dynCeil = app.dyn - 0.01;
      app.ceilUntil = now + 90000;
      app.dyn = Math.max(0.55, app.dyn - 0.1);
      applyQuality();
      ft.length = 0;
    } else if (avg < target * 1.08 && app.dyn < 1 && app.dyn + 0.05 < (app.dynCeil || 1)) {
      app.dyn = Math.min(1, app.dyn + 0.05);
      applyQuality();
      ft.length = 0;
    }
  }

  window.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
