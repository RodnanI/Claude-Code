<title>The Procession</title>
<style>
  :root { --ink: #e9e2d0; --dim: #8d877a; --line: #3a3732; --panel: rgba(12, 11, 10, 0.92); --accent: #d9a25b; }
  html, body { margin: 0; height: 100%; background: #0a0a0b; overflow: hidden; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.idle, body.idle * { cursor: none !important; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: var(--ink); font: 14px/1.5 monospace; padding: 24px; text-align: center; }
  #hint { position: fixed; right: 14px; bottom: 12px; font: 500 12px/1 AWJetBrains, monospace; color: var(--dim); letter-spacing: 0.04em;
          background: transparent; border: 1px solid var(--line); padding: 7px 10px; cursor: pointer; opacity: 0; transition: opacity 0.6s; user-select: none; }
  #hint.show { opacity: 0.85; }
  #hint:hover { color: var(--ink); border-color: var(--dim); }
  #panel { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 318px; max-width: calc(100vw - 24px); overflow-y: auto; background: var(--panel);
           border: 1px solid var(--line); color: var(--ink); font: 400 12px/1.35 AWJetBrains, ui-monospace, monospace; padding: 14px 16px 16px; box-sizing: border-box;
           transform: translateX(calc(100% + 24px)); transition: transform 0.35s ease; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  #panel.open { transform: none; }
  #panel h1 { font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; margin: 0 0 2px; color: var(--accent); }
  #panel .sub { color: var(--dim); margin-bottom: 12px; }
  #panel .sec { margin: 14px 0 6px; color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; font-size: 10.5px; border-top: 1px solid var(--line); padding-top: 10px; }
  .row { display: grid; grid-template-columns: 104px 1fr 44px; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .row.sel { grid-template-columns: 104px 1fr; }
  select { width: 100%; background: #141311; color: var(--ink); border: 1px solid var(--line); font: inherit; padding: 4px 6px; border-radius: 0; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--dim); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 13px; margin-top: -6px; background: var(--ink); border: 0; border-radius: 0; }
  input[type=range]::-moz-range-track { height: 1px; background: var(--dim); }
  input[type=range]::-moz-range-thumb { width: 9px; height: 13px; background: var(--ink); border: 0; border-radius: 0; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  button { background: transparent; color: var(--ink); border: 1px solid var(--line); font: inherit; padding: 6px 4px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { border-color: var(--accent); color: var(--accent); }
  #stats { margin-top: 12px; color: var(--dim); white-space: pre; font-size: 11px; line-height: 1.45; }
  .keys { margin-top: 10px; color: var(--dim); font-size: 11px; }
</style>

/* ASCII wallpaper engine.
 *
 * Three GPU passes per frame:
 *   1. scene  : the active scene's GLSL is evaluated at sub-cell resolution
 *               (cols*RX*A x rows*RY*A samples), writing linear HDR colour plus
 *               a packed material id / depth value.
 *   2. cells  : one fragment per character cell. The RX x RY sub-cell luminance
 *               pattern is matched against the measured coverage pattern of
 *               every allowed glyph, so glyph strokes follow the shapes in the
 *               scene. Writes glyph colour and glyph index (MRT). The previous
 *               frame's glyph is kept unless a new glyph is clearly better,
 *               which suppresses shimmer.
 *   3. compose: per screen pixel, the glyph atlas is sampled 1:1 and the glyph
 *               colour is blended over one flat background colour. Cells never
 *               receive a fill, so gaps between strokes always stay visible.
 */
(function () {
  'use strict';
  const ASCII = (window.ASCII = window.ASCII || {});
  ASCII.scenes = ASCII.scenes || [];
  ASCII.fonts = ASCII.fonts || [];
  ASCII.registerScene = (def) => ASCII.scenes.push(def);

  const NGLYPH = 95; // printable ASCII 32..126, index = code - 32

  // Default glyph sets. EDGE is used where a cell contains structure, TONE in
  // flat cells. Glyphs that read as words in a fill (most digits, many
  // letters) are left out of the defaults; scenes can opt in per material.
  const EDGE = ' .,\'`-_:;~"^=+*!|/\\()[]{}<>ilrtcvxzoeaunmwLTJVYXA#%&@80O';
  const TONE = ' .`\':-~=+*xoe#%&@';
  ASCII.EDGE = EDGE;
  ASCII.TONE = TONE;

  const QUALITY = {
    live: { rx: 2, ry: 4, aa: 1, label: 'Live' },
    high: { rx: 3, ry: 4, aa: 1, label: 'High' },
    ultra: { rx: 3, ry: 4, aa: 2, label: 'Ultra' },
  };

layout(location=0) in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

#define PI 3.14159265359
#define TAU 6.28318530718
float sat(float x){ return clamp(x, 0.0, 1.0); }
vec3 sat(vec3 x){ return clamp(x, 0.0, 1.0); }
float remap(float x, float a, float b){ return sat((x - a) / (b - a)); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

// hashes (integer based, stable across GPUs)
uint _h(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float hash11(float p){ return float(_h(floatBitsToUint(p))) * (1.0 / 4294967296.0); }
float hashi(ivec2 i){ return float(_h(uint(i.x) * 1597334677u ^ _h(uint(i.y) + 0x9e3779b9u))) * (1.0 / 4294967296.0); }
float hashi(ivec3 i){ return float(_h(uint(i.x) * 1597334677u ^ _h(uint(i.y) * 3812015801u ^ _h(uint(i.z) + 0x9e3779b9u)))) * (1.0 / 4294967296.0); }
float hashi(ivec4 i){ return float(_h(uint(i.x) * 1597334677u ^ _h(uint(i.y) * 3812015801u ^ _h(uint(i.z) * 2654435761u ^ _h(uint(i.w) + 0x9e3779b9u))))) * (1.0 / 4294967296.0); }
float hash12(vec2 p){ return hashi(ivec2(floor(p))); }
vec2 hash22(vec2 p){ ivec2 i = ivec2(floor(p)); return vec2(hashi(i), hashi(i + ivec2(1913, 7321))); }
vec3 hash33(vec3 p){ ivec3 i = ivec3(floor(p)); return vec3(hashi(i), hashi(i + ivec3(1913, 7321, 113)), hashi(i + ivec3(5099, 211, 8291))); }

// value noise, optional integer period per axis (0 = not periodic)
float vnoise(vec2 p, ivec2 per){
  ivec2 i = ivec2(floor(p)); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  ivec2 i1 = i + 1;
  if (per.x > 0) { i.x = ((i.x % per.x) + per.x) % per.x; i1.x = ((i1.x % per.x) + per.x) % per.x; }
  if (per.y > 0) { i.y = ((i.y % per.y) + per.y) % per.y; i1.y = ((i1.y % per.y) + per.y) % per.y; }

  if (per.y > 0) { i.y = ((i.y % per.y) + per.y) % per.y; j.y = ((j.y % per.y) + per.y) % per.y; }
  if (per.z > 0) { i.z = ((i.z % per.z) + per.z) % per.z; j.z = ((j.z % per.z) + per.z) % per.z; }

  float c = hashi(ivec3(i.x, j.y, i.z)), d = hashi(ivec3(j.x, j.y, i.z));

// gradient noise (3D), optional integer period per axis; returns roughly [-1,1]

  for (int k = 0; k < 8; k++) {

        for (let g = 0; g < NGLYPH; g++) {
          const ch = String.fromCharCode(32 + g);
          const ok = str.indexOf(ch) >= 0 || g === 0;
          if (ok && !this._excluded(ch)) masks[m * 4 + (g >> 5)] |= 1 << (g & 31);
        }
      }
      this.masks = masks;
    }
    _excluded(ch) {
      const ex = (this._scene && this._scene.exclude) || '';
      return ex.indexOf(ch) >= 0;
    }

    // ---------------------------------------------------------- font atlas
    _buildAtlas() {
      const a1 = this._renderAtlas(1);
      this.cell = a1.cell;
      this.atlasCols = a1.cols;
      this.atlasCanvas = a1.canvas;
      const gl = this.gl;
      this._del(this.atlasTex);
      this.atlasTex = this._tex(a1.canvas.width, a1.canvas.height, gl.R8, gl.RED, gl.UNSIGNED_BYTE, a1.alpha);
      [this.featTex, this.meanTex] = this._buildFeatures(a1.alpha, a1.canvas.width, a1.cell, [this.featTex, this.meanTex]);
      const a2 = this._renderAtlas(2, a1.cell);
      this._del(this.atlas2Tex);
      this.atlas2Tex = this._tex(a2.canvas.width, a2.canvas.height, gl.R8, gl.RED, gl.UNSIGNED_BYTE, a2.alpha);
      [this.featTex2, this.meanTex2] = this._buildFeatures(a2.alpha, a2.canvas.width, a2.cell, [this.featTex2, this.meanTex2]);
    }
    // Renders the 95 glyphs into a 16-column atlas. scale 2 renders the
    // font at twice the size into cells exactly twice as large, used for
    // the large foreground glyphs.
    _renderAtlas(scale, baseCell) {
      const s = this.settings;
      const font = ASCII.fonts[s.font] || ASCII.fonts[0];
      const px = Math.max(5, Math.round(s.glyphPx || 11)) * scale;
      const cv = document.createElement('canvas');
      let ctx = cv.getContext('2d');
      const fstr = `${font.weight || 400} ${px}px ${font.family}`;
      ctx.font = fstr;
      const m = ctx.measureText('M');
      const adv = m.width;
      const cw = baseCell ? baseCell[0] * scale : Math.max(3, Math.round(adv * (font.advance || 1)));
      const ch = baseCell ? baseCell[1] * scale : Math.max(5, Math.round(px * s.lineHeight));
      const asc = m.fontBoundingBoxAscent || px * 0.8;
      const desc = m.fontBoundingBoxDescent || px * 0.2;
      const base = Math.round((ch - (asc + desc)) / 2 + asc);
      const cols = 16;
      const rows = Math.ceil(NGLYPH / cols);
      cv.width = cols * cw;
      cv.height = rows * ch;
      ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.font = fstr;
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#fff';
      const xoff = (cw - adv) / 2;
      for (let g = 1; g < NGLYPH; g++) {
        const tx = (g % cols) * cw;
        const ty = Math.floor(g / cols) * ch;
        ctx.save();
        ctx.beginPath();
        ctx.rect(tx, ty, cw, ch);
        ctx.clip();
        ctx.fillText(String.fromCharCode(32 + g), Math.round(tx + xoff), ty + base);
        ctx.restore();
      }
      const img = ctx.getImageData(0, 0, cv.width, cv.height).data;
      const a = new Uint8Array(cv.width * cv.height);
      for (let i = 0; i < a.length; i++) a[i] = img[i * 4 + 3];
      return { canvas: cv, alpha: a, cell: [cw, ch], cols };
    }
    _buildFeatures(alpha, aw, cellSize, old) {
      const q = QUALITY[this.settings.quality] || QUALITY.high;
      const [cw, ch] = cellSize;
      const nreg = q.rx * q.ry;
      const nvec = Math.ceil(nreg / 4);
      const feat = new Float32Array(nvec * 4 * NGLYPH);
      const mean = new Float32Array(4 * NGLYPH);
      const gg = this.settings.glyphGamma;
      for (let g = 0; g < NGLYPH; g++) {
        const tx = (g % 16) * cw;
        const ty = Math.floor(g / 16) * ch;
        const acc = new Float32Array(nreg);
        const cnt = new Float32Array(nreg);
        let tot = 0;
        for (let y = 0; y < ch; y++)
          for (let x = 0; x < cw; x++) {
            // fractional region assignment: each pixel is split across the
            // regions it overlaps so odd cell sizes stay balanced
            const v = g === 0 ? 0 : Math.pow(alpha[(ty + y) * aw + tx + x] / 255, gg);
            tot += v;
            const fx0 = (x * q.rx) / cw, fx1 = ((x + 1) * q.rx) / cw;
            const fy0 = (y * q.ry) / ch, fy1 = ((y + 1) * q.ry) / ch;
            for (let ry = Math.floor(fy0); ry < Math.min(q.ry, Math.ceil(fy1)); ry++)
              for (let rx = Math.floor(fx0); rx < Math.min(q.rx, Math.ceil(fx1)); rx++) {
                const ox = Math.min(fx1, rx + 1) - Math.max(fx0, rx);
                const oy = Math.min(fy1, ry + 1) - Math.max(fy0, ry);
                const w = ox * oy;
                if (w <= 0) continue;
                acc[ry * q.rx + rx] += v * w;
                cnt[ry * q.rx + rx] += w;
              }
          }
        for (let k = 0; k < nreg; k++) feat[g * nvec * 4 + k] = cnt[k] ? acc[k] / cnt[k] : 0;
        mean[g * 4] = tot / (cw * ch);
      }
      const gl = this.gl;
      old.forEach((t) => this._del(t));
      return [this._tex(nvec, NGLYPH, gl.RGBA32F, gl.RGBA, gl.FLOAT, feat), this._tex(1, NGLYPH, gl.RGBA32F, gl.RGBA, gl.FLOAT, mean)];
    }

    // ------------------------------------------------------------- sizing
    resize(force) {
      const s = this.settings;
      const dpr = window.devicePixelRatio || 1;
      let W, H;
      if (this.fixedSize) [W, H] = this.fixedSize;
      else {
        W = Math.max(64, Math.round(this.canvas.clientWidth * dpr * s.resScale));
        H = Math.max(64, Math.round(this.canvas.clientHeight * dpr * s.resScale));
      }
      const key = [W, H, s.glyphPx, s.lineHeight, s.font, s.quality, s.glyphGamma].join('|');
      if (!force && key === this._sizeKey) return;
      this._sizeKey = key;
      this.canvas.width = W;
      this.canvas.height = H;
      this._buildAtlas();
      const [cw, ch] = this.cell;
      const cols = Math.ceil(W / cw);
      const rows = Math.ceil(H / ch);
      const q = QUALITY[s.quality] || QUALITY.high;
      this.q = q;
      const gl = this.gl;
      const sw = cols * q.rx * q.aa;
      const sh = rows * q.ry * q.aa;
      this._del(this.sceneFbo);
      this.sceneFbo = this.floatRT
        ? this._fbo([this._tex(sw, sh, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT)])
        : this._fbo([this._tex(sw, sh, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE)]);
      for (let i = 0; i < 2; i++) {
        this._del(this.cellFbo && this.cellFbo[i]);
      }
      this.cellFbo = [0, 1].map(() =>
        this._fbo([this._tex(cols, rows, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE), this._tex(cols, rows, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE)])
      );
      const bcols = Math.ceil(cols / 2), brows = Math.ceil(rows / 2);
      if (this.blockFbo) this.blockFbo.forEach((f) => this._del(f));
      this.blockFbo = [0, 1].map(() =>
        this._fbo([this._tex(bcols, brows, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE), this._tex(bcols, brows, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE)])
      );
      this.bcols = bcols;
      this.brows = brows;
      const qk = s.quality;
      this._cellProgs = this._cellProgs || {};
      if (!this._cellProgs[qk]) this._cellProgs[qk] = [this._program(VS, cellFS(q, this.enc, 1)), this._program(VS, cellFS(q, this.enc, 2))];
      [this.cellProg, this.blockProg] = this._cellProgs[qk];
      this.W = W;
      this.H = H;
      this.cols = cols;
      this.rows = rows;
      this.sceneW = sw;
      this.sceneH = sh;
      this.offset = [Math.floor((cols * cw - W) / 2), Math.floor((rows * ch - H) / 2)];
      this.hasPrev = false;
      Object.assign(this.stats, { cols, rows, cells: cols * rows, samples: sw * sh, cw, ch, W, H });
    }

    // ------------------------------------------------------------- render
    _setUniform(p, name, v) {
      const gl = this.gl;
      const loc = p._u[name];
      if (loc === undefined || loc === null) return;
      if (typeof v === 'number') gl.uniform1f(loc, v);
      else if (v.length === 2) gl.uniform2fv(loc, v);
      else if (v.length === 3) gl.uniform3fv(loc, v);
      else if (v.length === 4) gl.uniform4fv(loc, v);
    }
    render(t) {
      const gl = this.gl;
      const s = this.settings;
      const sc = this._scene;
      this.resize(false);
      const loop = sc.loop || 60;
      t = ((t % loop) + loop) % loop;
      this.lastT = t;
      gl.bindVertexArray(this.vao);
      gl.disable(gl.BLEND);

      // pass 1: scene
      let p = this.sceneProg;
      gl.useProgram(p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.sceneFbo);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
      gl.viewport(0, 0, this.sceneW, this.sceneH);
      const [cw, ch] = this.cell;
      this._setUniform(p, 'uSceneRes', [this.sceneW, this.sceneH]);
      this._setUniform(p, 'uGridPx', [this.cols * cw, this.rows * ch]);
      this._setUniform(p, 'uCanvasPx', [this.W, this.H]);
      this._setUniform(p, 'uCellPx', [cw, ch]);
      this._setUniform(p, 'uTime', t);
      this._setUniform(p, 'uLoop', loop);
      this._setUniform(p, 'uPhase', t / loop);
      this._setUniform(p, 'uDetail', s.detail);
      this._setUniform(p, 'uAtmos', s.atmosphere);
      this._setUniform(p, 'uCamAmt', s.camera);
      this._setUniform(p, 'uSeed', s.seed || 0);
      // a capture can render a 1:1 window of a larger virtual frame
      const vw = s.viewW || this.W, vh = s.viewH || this.H;
      this._setUniform(p, 'uView', [s.viewX || 0, vh - this.H - (s.viewY || 0), vw, vh]);
      this._setUniform(p, 'uPxSize', 2 / vh);
      for (const [k, v] of Object.entries(sc.uniforms || {})) this._setUniform(p, k, (s.uniforms && s.uniforms[k]) ?? v);
      const pal = (sc.palettes || [])[s.palette];
      if (pal) for (const [k, v] of Object.entries(pal.colors || {})) this._setUniform(p, k, srgbToLin(hexToRgb(v)));
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      if (s.debug) {
        if (!this.debugProg) this.debugProg = this._program(VS, DEBUG_FS(this.enc));
        p = this.debugProg;
        gl.useProgram(p);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, this.W, this.H);
        this._bindTex(0, this.sceneFbo.texs[0], p._u.uScene);
        this._setUniform(p, 'uSize', [this.sceneW, this.sceneH]);
        this._setUniform(p, 'uCanvas', [this.W, this.H]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        this.frameNo++;
        return;
      }

      // pass 2: glyph selection (2a: large foreground glyphs on 2x2 blocks, 2b: cells)
      const bigOn = this.bigOn();
      const bdst = this.blockFbo[this.cur];
      if (bigOn) {
        this._glyphPass(this.blockProg, bdst, this.blockFbo[1 - this.cur], this.bcols, this.brows, this.featTex2, this.meanTex2, null, pal, true);
      }
      const dst = this.cellFbo[this.cur];
      this._glyphPass(this.cellProg, dst, this.cellFbo[1 - this.cur], this.cols, this.rows, this.featTex, this.meanTex, bdst, pal, bigOn);

      // pass 3: compose to screen
      p = this.composeProg;
      gl.useProgram(p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, this.W, this.H);
      this._bindTex(0, dst.texs[0], p._u.uCellColor);
      this._bindTex(1, dst.texs[1], p._u.uCellGlyph);
      this._bindTex(2, this.atlasTex, p._u.uAtlas);
      this._bindTex(3, bdst.texs[0], p._u.uBlockColor);
      this._bindTex(4, bdst.texs[1], p._u.uBlockGlyph);
      this._bindTex(5, this.atlas2Tex, p._u.uAtlas2);
      gl.uniform1i(p._u.uBigOn, bigOn ? 1 : 0);
      gl.uniform2i(p._u.uCell, cw, ch);
      gl.uniform2i(p._u.uOffset, this.offset[0], this.offset[1]);
      gl.uniform1i(p._u.uAtlasCols, this.atlasCols);
      this._setUniform(p, 'uBg', hexToRgb((pal && pal.bg) || sc.bg || '#0a0a0b'));
      this._setUniform(p, 'uGlyphGamma', s.glyphGamma);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      this.cur = 1 - this.cur;
      this.hasPrev = true;
      this.frameNo++;
    }
    bigOn() {
      return !!(this._scene.bigDepth > 0 && this.settings.bigGlyphs);
    }
    _glyphPass(p, dst, prev, w, h, feat, mean, block, pal, bigOn) {
      const gl = this.gl;
      const s = this.settings;
      const sc = this._scene;
      gl.useProgram(p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
      gl.viewport(0, 0, w, h);
      this._bindTex(0, this.sceneFbo.texs[0], p._u.uScene);
      this._bindTex(1, feat, p._u.uFeat);
      this._bindTex(2, mean, p._u.uFeatMean);
      this._bindTex(3, prev.texs[1], p._u.uPrev);
      this._bindTex(4, block ? block.texs[1] : prev.texs[1], p._u.uBlock);
      this._setUniform(p, 'uBigOn', bigOn ? 1 : 0);
      this._setUniform(p, 'uBigDepth', sc.bigDepth || 0);
      this._setUniform(p, 'uDither', s.dither * ((sc.look && sc.look.dither) ?? 1));
      gl.uniform1i(p._u.uNGlyph, NGLYPH);
      gl.uniform4uiv(p._u.uMask, this.masks);
      const look = Object.assign({}, sc.look || {}, (pal && pal.look) || {});
      const lk = (k) => (s[k] ?? 1) * (look[k] ?? 1);
      this._setUniform(p, 'uFlat', s.flat * (look.flat ?? 1));
      this._setUniform(p, 'uMeanW', s.meanW);
      this._setUniform(p, 'uEdgeNorm', s.edgeNorm * (look.edgeNorm ?? 1));
      this._setUniform(p, 'uEdgeRef', s.edgeRef);
      this._setUniform(p, 'uFlatShape', s.flatShape);
      this._setUniform(p, 'uFlatTone', s.flatTone * (look.flatTone ?? 1));
      this._setUniform(p, 'uExposure', lk('exposure'));
      this._setUniform(p, 'uCover', s.cover * (look.cover ?? 1));
      this._setUniform(p, 'uSharp', s.sharp * (look.sharp ?? 1));
      this._setUniform(p, 'uHyst', s.stability);
      this._setUniform(p, 'uSat', lk('saturation'));
      this._setUniform(p, 'uBright', lk('brightness'));
      this._setUniform(p, 'uMinCov', s.minCov * (look.minCov ?? 1));
      this._setUniform(p, 'uColGamma', s.colGamma * (look.colGamma ?? 1));
      this._setUniform(p, 'uWhite', s.white * (look.white ?? 1));
      this._setUniform(p, 'uHasPrev', this.hasPrev && s.stability > 0 ? 1 : 0);
      this._setUniform(p, 'uTint', look.tint || [1, 1, 1]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    _bindTex(unit, tex, loc) {
      const gl = this.gl;
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      if (loc) gl.uniform1i(loc, unit);
    }

    // Count glyphs actually drawn in the last frame. "visible" requires the
    // glyph colour to be bright enough to stand out from the background.
    measure() {
      const gl = this.gl;
      const f = this.cellFbo[1 - this.cur];
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, f);
      const n = this.cols * this.rows;
      const col = new Uint8Array(n * 4);
      const gly = new Uint8Array(n * 4);
      gl.readBuffer(gl.COLOR_ATTACHMENT0);
      gl.readPixels(0, 0, this.cols, this.rows, gl.RGBA, gl.UNSIGNED_BYTE, col);
      gl.readBuffer(gl.COLOR_ATTACHMENT1);
      gl.readPixels(0, 0, this.cols, this.rows, gl.RGBA, gl.UNSIGNED_BYTE, gly);
      let big = 0, bigVisible = 0;
      if (this.bigOn()) {
        const bf = this.blockFbo[1 - this.cur];
        const bn = this.bcols * this.brows;
        const bcol = new Uint8Array(bn * 4), bgl = new Uint8Array(bn * 4);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, bf);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        gl.readPixels(0, 0, this.bcols, this.brows, gl.RGBA, gl.UNSIGNED_BYTE, bcol);
        gl.readBuffer(gl.COLOR_ATTACHMENT1);
        gl.readPixels(0, 0, this.bcols, this.brows, gl.RGBA, gl.UNSIGNED_BYTE, bgl);
        for (let i = 0; i < bn; i++) {
          if (bgl[i * 4 + 1] < 128 || bgl[i * 4] === 0) continue;
          big++;
          const l = 0.2126 * bcol[i * 4] + 0.7152 * bcol[i * 4 + 1] + 0.0722 * bcol[i * 4 + 2];
          if (l >= 40) bigVisible++;
        }
      }
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
      let nonSpace = big,
        visible = bigVisible;
      const hist = new Uint32Array(NGLYPH);
      for (let i = 0; i < n; i++) {
        const g = gly[i * 4];
        if (g === 0) continue;
        nonSpace++;
        hist[g]++;
        const l = 0.2126 * col[i * 4] + 0.7152 * col[i * 4 + 1] + 0.0722 * col[i * 4 + 2];
        if (l >= 40) visible++;
      }
      let distinct = 0;
      for (let g = 1; g < NGLYPH; g++) if (hist[g]) distinct++;
      Object.assign(this.stats, { nonSpace, visible, distinct, big });
      return this.stats;
    }
  }
  ASCII.Engine = Engine;
  ASCII.NGLYPH = NGLYPH;
})();

<script>
// "The Procession": colossal stilt-legged shell creatures carrying fragments of
// towns walk across a flooded salt flat at dusk, drawn like an engraving in
// coloured type: contour lines, concentric hatching, radiating sun rays.
//
// Everything is evaluated in screen space with an analytic ground plane:
// creatures are 2D side-view SDF figures placed at their depth, the flat
// mirrors them about their own ground contact line, and the hexagonal salt
// crust is projected in perspective.
//
// Loop: 120 s = 15 gait cycles of 8 s. The camera tracks the procession at
// 1.5 m/s, so the ground scrolls 180 m per loop = 80 periods of the hex crust.
ASCII.registerScene({
  id: 'procession',
  name: 'The Procession',
  tagline: 'walking towns on a mirror of salt',
  loop: 120,
  startAt: 14,
  bg: '#0a0908',
  bigDepth: 0.004,
  look: { exposure: 4.0, colGamma: 0.65, brightness: 1.15 },
  palettes: [
    {

        uWin: '#ffb75e', uSalt: '#dfe7e1', uLeaf: '#8aa58b', uFlag: '#d6ac52',
      },
    },
    {
      name: 'Ember',
      colors: {
        uSun: '#ffe7b8', uGlow: '#f0582e', uHigh: '#7e3826', uZen: '#24181a', uRim: '#ffb878', uBody: '#6e4632',

    2: { edge: ' .,`\'-_()/\\|=:o*+<>^v', tone: ' .:-=+*o' },                         // sun
    3: { edge: ' .,`\'-_:;!|/\\()[]{}<>=+*#iltLTJVYAHIX^v7', tone: ' .:-=+#' },        // contours, linework
    4: { edge: ' .,`\':;*%&@o0eacs(){}~', tone: ' .:;*%&@' },                         // foliage
    5: { edge: ' .,`\'-_/\\|:;~=', tone: ' .-:=' },                                   // salt ridges
    6: { edge: ' .,`\'-_~=:', tone: ' .-~=' },                                        // water strokes
    7: { edge: ' .,`\':;!|+*#=[]', tone: ' .:+*#' },                                  // windows, lamps
    8: { edge: ' .`\'*+^v~-', tone: ' .`\'' },                                        // stars, birds

  },
  glsl: `
const float FOC = 1.55;     // focal length in screen units
const float CAMH = 2.4;     // camera height above the flat (m)
const float VEL = 1.5;      // walking speed (m/s)
const float TG = 8.0;       // gait period (s): 15 cycles per 120 s loop
const float HEXS = 2.25;    // hex crust period (m): 180 m / 80
float HOR = -0.13;          // horizon height on screen
vec2 SUN;
float camX, camDX;
float LW;                   // half width of a drawn line, screen units

// ---------------------------------------------------------------- helpers
float sdTaper(vec2 p, vec2 a, vec2 b, float ra, float rb){
  vec2 pa = p - a, ba = b - a; float h = sat(dot(pa, ba) / dot(ba, ba));
  return length(pa - ba * h) - mix(ra, rb, h);
}
float sdEll(vec2 p, vec2 r){ float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-5); }
float sdTri(vec2 p, vec2 p0, vec2 p1, vec2 p2){
  vec2 e0 = p1 - p0, e1 = p2 - p1, e2 = p0 - p2, v0 = p - p0, v1 = p - p1, v2 = p - p2;
  vec2 pq0 = v0 - e0 * sat(dot(v0, e0) / dot(e0, e0));
  vec2 pq1 = v1 - e1 * sat(dot(v1, e1) / dot(e1, e1));
  vec2 pq2 = v2 - e2 * sat(dot(v2, e2) / dot(e2, e2));
  float s = sign(e0.x * e2.y - e0.y * e2.x);
  vec2 d = min(min(vec2(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)), vec2(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))), vec2(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
// pointy hex tiling, period 1 along x; xy = offset from cell centre, zw = cell id
vec4 hexCell(vec2 p){
  const vec2 HS = vec2(1.0, 1.7320508);
  vec4 hc = floor(vec4(p, p - vec2(0.5, 1.0)) / HS.xyxy) + 0.5;
  vec4 h = vec4(p - hc.xy * HS, p - (hc.zw + 0.5) * HS);
  return dot(h.xy, h.xy) < dot(h.zw, h.zw) ? vec4(h.xy, hc.xy) : vec4(h.zw, hc.zw + 0.5);
}
float hexEdge(vec2 h){ h = abs(h); return 0.5 - max(dot(h, vec2(0.5, 0.8660254)), h.x); }

// creature table: screen x, depth (m), gait phase, kind
vec4 creature(int i){
  if (i == 0) return vec4(-1.06, 52.0, 0.00, 0.0);
  if (i == 1) return vec4(-0.16, 104.0, 0.37, 1.0);
  if (i == 2) return vec4(0.44, 178.0, 0.71, 2.0);
  if (i == 3) return vec4(0.84, 300.0, 0.18, 3.0);
  if (i == 4) return vec4(1.22, 520.0, 0.55, 4.0);
  if (i == 5) return vec4(1.50, 860.0, 0.83, 1.0);
  if (i == 6) return vec4(1.78, 1350.0, 0.29, 2.0);
  return vec4(2.05, 2100.0, 0.64, 3.0);
}
#define NCRE 8
float groundY(float z){ return HOR - FOC * CAMH / z; }
float creX(vec4 c){ return c.x - FOC * camDX / c.y; }

// ---------------------------------------------------------------- figures
// Every figure function returns vec4(dist m, emission, linework, material)
// in creature space: metres, origin at the ground below the body centre.
vec2 footAt(float phi, float baseX){
  float S = VEL * TG;
  if (phi < 0.75) { float u = phi / 0.75; return vec2(baseX + S * 0.5 - S * u, 0.0); }
  float u = (phi - 0.75) / 0.25; float e = u * u * (3.0 - 2.0 * u);
  return vec2(baseX - S * 0.5 + S * e, 2.4 * sin(PI * u) * (1.0 - 0.3 * u));
}
vec2 knee(vec2 h, vec2 f, float l1, float l2, float bend){
  vec2 d = f - h; float L = clamp(length(d), abs(l1 - l2) + 0.01, l1 + l2 - 0.01);
  vec2 u = normalize(d);
  float a = (l1 * l1 + L * L - l2 * l2) / (2.0 * l1 * L);
  return h + l1 * (a * u + sqrt(max(0.0, 1.0 - a * a)) * vec2(-u.y, u.x) * bend);
}
// one leg: hip h, gait phase, base x; bend sign; returns distance + linework
vec2 leg(vec2 q, vec2 h, float phi, float baseX, float bend, float thick){
  vec2 f = footAt(phi, baseX) + vec2(0.0, 0.55);
  vec2 k = knee(h, f, 10.6, 10.0, bend);
  float d1 = sdTaper(q, h, k, 0.95 * thick, 0.55 * thick);
  float d2 = sdTaper(q, k, f, 0.5 * thick, 0.36 * thick);
  float pad = sdEll(q - f + vec2(0.0, 0.25), vec2(1.05, 0.42) * thick);
  float d = min(min(d1, d2), pad);
  // knee and ankle rings
  float ln = smoothstep(0.12, 0.0, abs(length(q - k) - 0.75 * thick)) + smoothstep(0.1, 0.0, abs(length(q - f) - 0.55 * thick)) * 0.7;
  // longitudinal hatching along the shin
  vec2 kf = f - k; float t = dot(q - k, kf) / dot(kf, kf);
  ln += 0.35 * smoothstep(0.08, 0.0, abs(fract(t * 7.0) - 0.5) - 0.42) * step(0.0, t) * step(t, 1.0);
  return vec2(d, ln);
}

vec4 structTemple(vec2 r, float sway, float seed){
  float d = 1e9, em = 0.0, ln = 0.0, mt = 3.0;
  for (int k = 0; k < 4; k++) {
    float fk = float(k), w = 6.8 - 1.55 * fk, y0 = fk * 2.5;
    float b = sdBox(r - vec2(0.0, y0 + 1.25), vec2(w, 1.25));
    d = min(d, b);
    // ledge line at each tier top and arched windows
    ln += smoothstep(0.09, 0.0, abs(r.y - (y0 + 2.5))) * step(abs(r.x), w);
    float wx = fract(r.x / 1.35 + 0.5) - 0.5;
    float cid = floor(r.x / 1.35 + 0.5);
    float win = step(abs(wx), 0.17) * step(abs(r.y - (y0 + 1.15)), 0.45) * step(abs(r.x), w - 0.5);
    float lit = step(0.42, hash12(vec2(cid, fk + seed * 7.0)));
    float fl = 0.85 + 0.15 * sin(TAU * (uPhase * 3.0 + hash12(vec2(cid, fk)) ));
    em += win * lit * fl;
    ln += win * (1.0 - lit) * 0.6;
  }
  // shrine
  float sh = sdBox(r - vec2(0.0, 11.3), vec2(1.5, 1.3));
  sh = min(sh, sdTri(r, vec2(-2.1, 12.5), vec2(2.1, 12.5), vec2(0.0, 15.6)));
  d = min(d, sh);
  em += step(abs(r.x), 0.35) * step(abs(r.y - 11.0), 0.7) * 1.3;
  ln += smoothstep(0.1, 0.0, abs(r.y - 12.55)) * step(abs(r.x), 2.0);
  // hanging vines from the tier edges, swaying with the gait
  for (int v = 0; v < 6; v++) {
    float fv = float(v);
    float side = v < 3 ? -1.0 : 1.0;
    float tier = mod(fv, 3.0);
    float x0 = side * (6.8 - 1.55 * tier + 0.15);
    float y0 = tier * 2.5 + 2.4;
    float len = 2.5 + 3.5 * hash11(fv + seed * 13.0) + tier * 0.8;
    float yy = y0 - r.y;
    float sx = x0 + side * 0.1 + sway * yy * 0.06 + 0.25 * sin(TAU * (uPhase * 5.0 + fv * 0.21) + yy * 0.7) * (yy / len);
    float dv = abs(r.x - sx) - 0.13;
    dv = max(dv, max(-yy, yy - len));
    if (dv < d) { mt = 4.0; }
    d = min(d, dv);
  }
  // little trees on the tier corners
  for (int t = 0; t < 4; t++) {
    float ft = float(t);
    float side = t < 2 ? -1.0 : 1.0;
    float tier = mod(ft, 2.0) + 1.0;
    vec2 c = vec2(side * (6.8 - 1.55 * tier - 0.7), tier * 2.5 + 1.3);
    float dc = length(r - c) - 1.25 - 0.25 * vnoise(r * 2.3 + seed);
    dc = min(dc, sdBox(r - c + vec2(0.0, 1.0), vec2(0.12, 0.9)));
    if (dc < d) mt = 4.0;
    d = min(d, dc);
  }
  return vec4(d, em, ln, mt);
}

vec4 structTower(vec2 r, float sway, float seed){
  float d = 1e9, em = 0.0, ln = 0.0, mt = 3.0;
  float w = mix(1.7, 1.2, sat(r.y / 19.0));
  d = sdBox(r - vec2(0.0, 9.5), vec2(w, 9.5));
  // storey bands and slit windows
  float fy = fract(r.y / 3.0);
  ln += smoothstep(0.035, 0.0, abs(fy - 0.02)) * step(r.y, 19.0);
  float storey = floor(r.y / 3.0);
  float slit = step(abs(r.x - (hash11(storey + seed) - 0.5) * 0.9), 0.17) * step(abs(fy - 0.55), 0.22) * step(r.y, 18.0);
  em += slit * step(0.35, hash11(storey * 3.1 + seed));
  // balcony and lantern room
  d = min(d, sdBox(r - vec2(0.0, 19.3), vec2(2.4, 0.3)));
  float posts = step(abs(fract(r.x / 0.6) - 0.5), 0.12) * step(abs(r.y - 20.0), 0.6) * step(abs(r.x), 2.35);
  float rail = smoothstep(0.08, 0.0, abs(r.y - 20.6)) * step(abs(r.x), 2.4);
  ln += posts + rail;
  float lr = sdBox(r - vec2(0.0, 21.4), vec2(1.15, 1.6));
  d = min(d, lr);
  float mull = step(abs(fract(r.x / 0.75) - 0.5), 0.1);
  float lamp = (1.0 - mull) * step(abs(r.x), 1.0) * step(abs(r.y - 21.4), 1.35);
  em += lamp * (1.9 + 0.25 * sin(TAU * uPhase * 4.0));
  // roof, finial
  d = min(d, sdTri(r, vec2(-1.9, 22.9), vec2(1.9, 22.9), vec2(0.0, 27.0)));
  d = min(d, sdBox(r - vec2(0.0, 28.0), vec2(0.07, 1.1)));
  ln += smoothstep(0.1, 0.0, abs(r.y - 22.95)) * step(abs(r.x), 1.9);
  // pennant streaming from the finial
  float px = r.x;
  if (px > 0.0 && px < 9.0) {
    float wav = 0.55 * sin(px * 0.9 - TAU * uPhase * 15.0) * (px / 9.0) + sway * 0.3;
    float hw = 0.45 * (1.0 - px / 9.0) + 0.05;
    float dp = abs(r.y - 28.6 - wav) - hw;
    if (dp < d) mt = 9.0;
    d = min(d, dp);
  }
  return vec4(d, em, ln, mt);
}

vec4 structVillage(vec2 r, float sway, float seed){
  float d = 1e9, em = 0.0, ln = 0.0, mt = 3.0;
  for (int k = 0; k < 5; k++) {
    float fk = float(k);
    float x = -6.0 + fk * 3.0 + (hash11(fk + seed) - 0.5) * 0.8;
    float hw = 1.1 + 0.5 * hash11(fk * 7.3 + seed);
    float hh = 1.6 + 2.2 * hash11(fk * 3.7 + seed) + (2.0 - abs(fk - 2.0)) * 1.1;
    float base = -0.6 * abs(x) / 6.0 * 1.5;
    vec2 c = vec2(x, base + hh);
    d = min(d, sdBox(r - c, vec2(hw, hh)));
    float rf = sdTri(r, vec2(x - hw - 0.45, base + 2.0 * hh), vec2(x + hw + 0.45, base + 2.0 * hh), vec2(x, base + 2.0 * hh + 1.6 + 0.4 * hash11(fk)));
    d = min(d, rf);
    ln += smoothstep(0.08, 0.0, abs(r.y - base - 2.0 * hh)) * step(abs(r.x - x), hw + 0.45);
    float wy = fract((r.y - base) / 1.6) - 0.5, wx = fract((r.x - x) / 1.0) - 0.5;
    float win = step(abs(wx), 0.18) * step(abs(wy), 0.22) * step(abs(r.x - x), hw - 0.3) * step(0.6, r.y - base) * step(r.y - base, 2.0 * hh - 0.4);
    float id = hash12(floor(vec2((r.x - x) / 1.0, (r.y - base) / 1.6)) + vec2(fk * 11.0, seed));
    em += win * step(0.5, id) * (0.8 + 0.2 * sin(TAU * (uPhase * 2.0 + id)));
    ln += win * step(id, 0.5) * 0.5;
  }
  // bell tower
  d = min(d, sdBox(r - vec2(1.6, 7.5), vec2(0.65, 7.5)));
  d = min(d, sdTri(r, vec2(0.7, 15.0), vec2(2.5, 15.0), vec2(1.6, 18.5)));
  em += step(abs(r.x - 1.6), 0.3) * step(abs(r.y - 13.6), 0.5) * 1.2;
  // laundry line with fluttering flags between two roofs
  float lx = (r.x + 4.5) / 6.0;
  if (lx > 0.0 && lx < 1.0) {
    float ly = 6.6 - 1.2 * sin(PI * lx) + sway * 0.2;
    ln += smoothstep(0.07, 0.0, abs(r.y - ly)) * 1.2;
    float fx = fract(lx * 7.0);
    float flag = step(fx, 0.55) * step(r.y, ly) * step(ly - 0.7 - 0.2 * sin(TAU * uPhase * 10.0 + lx * 9.0), r.y);
    if (flag > 0.5) { d = min(d, -0.05); mt = 9.0; }
  }
  return vec4(d, em, ln, mt);
}

vec4 structTree(vec2 r, float sway, float seed){
  float d = 1e9, em = 0.0, ln = 0.0, mt = 3.0;
  d = sdTaper(r, vec2(0.0, -1.0), vec2(0.4 + sway * 0.1, 9.0), 1.7, 0.8);
  d = min(d, sdTaper(r, vec2(0.3, 6.0), vec2(-5.0, 10.5), 0.7, 0.35));
  d = min(d, sdTaper(r, vec2(0.4, 7.5), vec2(5.5, 11.5), 0.65, 0.3));
  ln += 0.6 * smoothstep(0.1, 0.0, abs(fract(r.x * 1.3 + vnoise(r * vec2(0.5, 2.0)) * 1.5) - 0.5) - 0.38) * step(r.y, 9.0) * step(abs(r.x), 1.5);
  // canopy: lobed, leafy edge, moves with the gait and a slow breeze
  vec2 cr = r - vec2(sway * 0.4, 0.0);
  float cn = 1e9;
  for (int k = 0; k < 6; k++) {
    float fk = float(k);
    vec2 c = vec2(-7.0 + fk * 2.8, 11.5 + 2.4 * sin(fk * 1.7 + seed) + (2.5 - abs(fk - 2.5)) * 1.2);
    cn = min(cn, length(cr - c) - 3.0 - 0.6 * hash11(fk + seed));
  }
  float leaf = gnoise(vec3(cr * 1.3, uPhase * 6.0), ivec3(0, 0, 6));
  cn += 0.55 * leaf + 0.25 * vnoise(cr * 4.0);
  if (cn < d) mt = 4.0;
  d = min(d, cn);
  // aerial roots hanging from the branches past the shell
  for (int v = 0; v < 7; v++) {
    float fv = float(v);
    float x0 = -6.5 + fv * 2.1 + 0.4 * hash11(fv + seed);
    float len = 9.0 + 6.0 * hash11(fv * 3.3 + seed);
    float yy = 10.0 - r.y;
    float sx = x0 + sway * yy * 0.05 + 0.18 * sin(TAU * (uPhase * 4.0 + fv * 0.17) + yy * 0.5) * (yy / len);
    float dv = max(abs(r.x - sx) - 0.09, max(-yy, yy - len));
    if (dv < d) mt = 3.0;
    d = min(d, dv);
  }
  // hanging lamps in the canopy
  for (int l = 0; l < 4; l++) {
    float fl = float(l);
    vec2 c = vec2(-5.0 + fl * 3.4, 9.2 + hash11(fl + seed) * 2.0);
    c.x += 0.25 * sin(TAU * (uPhase * 6.0 + fl * 0.3));
    float dl = length(r - c) - 0.35;
    em += smoothstep(0.1, -0.1, dl) * 2.2;
  }
  return vec4(d, em, ln, mt);
}

vec4 structArch(vec2 r, float sway, float seed){
  float d = 1e9, em = 0.0, ln = 0.0, mt = 3.0;
  d = min(sdBox(r - vec2(-3.6, 4.5), vec2(0.75, 4.5)), sdBox(r - vec2(3.6, 4.5), vec2(0.75, 4.5)));
  vec2 a = r - vec2(0.0, 9.0);
  float ring = max(abs(length(a) - 3.6) - 0.8, -a.y);
  d = min(d, ring);
  d = min(d, sdBox(r - vec2(0.0, 13.2), vec2(0.5, 0.6)));
  ln += smoothstep(0.08, 0.0, abs(fract(r.y / 1.1) - 0.5) - 0.44) * step(r.y, 9.0) * step(abs(abs(r.x) - 3.6), 0.75);
  ln += smoothstep(0.1, 0.0, abs(fract(atan(a.y, a.x) / PI * 9.0) - 0.5) - 0.44) * step(abs(length(a) - 3.6), 0.8) * step(0.0, a.y);
  // the bell swings on its rope
  float ang = 0.32 * sin(TAU * uPhase * 15.0 + 1.3) + sway * 0.05;
  vec2 piv = vec2(0.0, 12.0);
  vec2 bl = rot(-ang) * (r - piv);
  float rope = max(abs(bl.x) - 0.06, max(bl.y, -bl.y - 3.2));
  float bell = sdTri(bl, vec2(-1.3, -5.6), vec2(1.3, -5.6), vec2(0.0, -2.9));
  bell = min(bell, length(bl - vec2(0.0, -3.3)) - 0.75);
  d = min(d, min(rope, bell));
  em += smoothstep(0.2, -0.2, length(bl - vec2(0.0, -5.4)) - 0.35) * 0.6;
  // prayer flags from the arch top down to the shell rim on both sides
  for (int s = 0; s < 2; s++) {
    float side = s == 0 ? -1.0 : 1.0;
    float lx = (r.x * side) / 9.5;
    if (lx > 0.05 && lx < 1.0) {
      float ly = mix(12.5, -0.5, lx) - 2.2 * sin(PI * lx) + sway * 0.2;
      ln += smoothstep(0.06, 0.0, abs(r.y - ly)) * 1.1;
      float fx = fract(lx * 11.0);
      float fl = step(fx, 0.6) * step(r.y, ly) * step(ly - 0.8 - 0.25 * sin(TAU * uPhase * 12.0 + lx * 13.0 + side), r.y);
      if (fl > 0.5) { d = min(d, -0.05); mt = 9.0; }
    }
  }
  return vec4(d, em, ln, mt);
}

// whole creature in creature space (q in metres, ground at y = 0)
vec4 figure(vec2 q, int i, vec4 c){
  float ph = fract(uTime / TG + c.z);
  float bob = 0.4 * cos(TAU * 2.0 * ph);
  float by = 19.4 + bob;
  float d = 1e9, em = 0.0, ln = 0.0, mt = 3.0;
  // quick reject outside the bounding box
  if (q.x < -16.0 || q.x > 18.0 || q.y < -1.0 || q.y > 58.0) return vec4(5.0, 0.0, 0.0, 3.0);
  // legs: near side LH LF, far side RH RF (lateral sequence walk)
  float farFade = 0.0;
  vec2 lg;
  lg = leg(q, vec2(-4.8, by - 2.6), fract(ph + 0.0), -4.8, 1.0, 1.0); d = lg.x; ln += lg.y;
  lg = leg(q, vec2(4.8, by - 2.6), fract(ph + 0.25), 4.8, 1.0, 1.0); if (lg.x < d) { d = lg.x; } ln += lg.y;
  vec2 lf = leg(q - vec2(0.8, 0.0), vec2(-4.8, by - 2.6), fract(ph + 0.5), -4.8, 1.0, 0.85);
  vec2 rf = leg(q - vec2(0.8, 0.0), vec2(4.8, by - 2.6), fract(ph + 0.75), 4.8, 1.0, 0.85);
  float dfar = min(lf.x, rf.x);
  // shell: dome with a flat belly and a scalloped skirt
  vec2 sq = q - vec2(0.0, by + 0.8);
  float shell = max(sdEll(sq, vec2(9.8, 6.3)), -(q.y - (by - 2.3)));
  float scal = (q.y - (by - 2.3)) - 0.35 * abs(sin(q.x * 1.6));
  shell = min(shell, max(abs(sq.x) - 9.9, max(-scal, q.y - (by - 0.6))));
  // neck and head, bobbing with the stride
  float hb = 0.35 * sin(TAU * (2.0 * ph + 0.15));
  vec2 hd = vec2(13.7, by + 2.6 + hb);
  float neck = sdTaper(q, vec2(8.2, by + 0.2), vec2(11.6, by + 2.0 + hb * 0.6), 1.55, 0.95);
  float head = sdEll(q - hd, vec2(2.1, 1.25));
  head = min(head, sdTaper(q, hd + vec2(1.2, -0.6), hd + vec2(2.9, -1.6 + hb * 0.5), 0.35, 0.15));
  float tail = sdTaper(q, vec2(-9.0, by - 0.6), vec2(-11.8, by - 2.8), 0.75, 0.2);
  float body = min(min(shell, neck), min(head, tail));
  // shell scutes: hexagons on the dome, drawn as fine linework
  if (shell < 0.5) {
    vec2 su = vec2(sq.x / (0.6 + 0.4 * sqrt(max(0.0, 1.0 - sq.y * sq.y / 40.0))), sq.y * 1.25) / 3.1;
    vec4 hc = hexCell(su);
    ln += smoothstep(0.07, 0.0, hexEdge(hc.xy)) * 0.9 * step(shell, 0.0);
    ln += smoothstep(0.12, 0.0, abs(q.y - (by - 0.6))) * step(abs(sq.x), 9.9) * 0.8;
  }
  ln += smoothstep(0.12, 0.0, abs(length(q - hd - vec2(0.9, 0.3)) - 0.28)) * 1.5;
  if (body < d) mt = 12.0;
  d = min(d, body);
  // the town on its back sways with the gait
  float sway = sin(TAU * (2.0 * ph + 0.3));
  vec2 r = q - vec2(0.0, by + 6.0);
  r = rot(sway * 0.012) * r;
  vec4 st;
  int kind = int(c.w + 0.5);
  if (r.y > -3.0) {
    if (kind == 0) st = structTemple(r, sway, float(i));
    else if (kind == 1) st = structTower(r, sway, float(i));
    else if (kind == 2) st = structVillage(r, sway, float(i));
    else if (kind == 3) st = structTree(r, sway, float(i));
    else st = structArch(r, sway, float(i));
    if (st.x < d) { mt = st.w; }
    d = min(d, st.x);
    em += st.y; ln += st.z;
  }
  // far legs sit behind everything else: they only show outside the near silhouette
  if (d > 0.0 && dfar < d) { d = dfar; mt = 10.0; ln = (lf.y + rf.y) * 0.5; em = 0.0; }
  return vec4(d, em, ln, mt);
}

// ---------------------------------------------------------------- sky
// slowly drifting noise that still loops: two copies one loop of drift apart,
// cross-faded with the variance held constant
float driftNoise(vec2 x, vec2 wind){
  float a = vnoise(x + wind * uPhase);
  float b = vnoise(x + wind * (uPhase - 1.0));
  float k = uPhase;
  return 0.5 + ((a - 0.5) * (1.0 - k) + (b - 0.5) * k) / sqrt((1.0 - k) * (1.0 - k) + k * k);
}
float lineAt(float d){ return smoothstep(LW + uPxSize * 0.7, LW - uPxSize * 0.7, abs(d)); }

// long stratus bands near the horizon: dark lenses that hide whatever is
// behind them, with a sunlit underside line. x: inside, y: underside line
vec2 stratus(vec2 p, float sd){
  vec2 res = vec2(0.0);
  for (int k = 0; k < 3; k++) {
    float fk = float(k);
    float yk = HOR + 0.075 + 0.085 * fk + 0.04 * fk * fk;
    float sc = 1.6 / (1.0 + 0.6 * fk);
    float x = p.x * sc;
    float gap = driftNoise(vec2(x * 0.8, fk * 7.3), vec2(1.1 + 0.3 * fk, 0.0));
    float th = (0.006 + 0.007 * fk) * smoothstep(0.45, 0.62, gap);
    if (th <= 0.0) continue;
    float n1 = driftNoise(vec2(x * 3.1, fk * 3.1 + 40.0), vec2(2.2, 0.0));
    float n2 = driftNoise(vec2(x * 2.4, fk * 5.7 + 80.0), vec2(2.2, 0.0));
    float bot = yk - th * (0.4 + 0.9 * n1);
    float top = yk + th * (0.6 + 1.6 * n2);
    float inside = smoothstep(bot - uPxSize, bot + uPxSize, p.y) * smoothstep(top + uPxSize, top - uPxSize, p.y);
    res.x = max(res.x, inside);
    res.y = max(res.y, lineAt(p.y - bot) * (0.3 + 1.6 * exp(-sd * 1.6)) * smoothstep(0.45, 0.62, gap));
  }
  return res;
}

vec3 skyCol(vec2 p, bool refl, out float mat){
  mat = 1.0;
  float h = p.y - HOR;
  vec2 d = p - SUN;
  float r = length(d);
  float sd = length(d * vec2(0.75, 1.0));
  vec3 col = vec3(0.0);
  // twilight hatching: undulating lines whose spacing widens with height
  // (one per text row at the horizon, several rows apart overhead), brightness
  // following the glow; they break into long dashes as the sky darkens
  float rowH2 = uCellPx.y * uPxSize;
  float h0 = 0.16;
  float A = h0 / rowH2;
  float hh = max(h, 0.0);
  float v = A * log(1.0 + hh / h0) + 0.25 * sin(p.x * 2.1 + hh * 7.0) + 0.12 * sin(p.x * 5.3 - 1.7);
  float spacing = (hh + h0) / A;
  float hl = lineAt((fract(v + 0.5) - 0.5) * spacing);
  float glow = exp(-hh * 2.2) * (0.3 + 1.5 * exp(-sd * 1.4)) + 0.04;
  float dn = vnoise(vec2(p.x / (uCellPx.x * uPxSize) * 0.12, floor(v + 0.5) * 2.3 + 11.0));
  float dash = smoothstep(0.62 - glow * 0.6, 0.7 - glow * 0.6, dn);
  vec3 htint = mix(uZen * 2.0, uHigh * 1.3, sat(glow * 1.5));
  htint = mix(htint, uGlow, sat(exp(-sd * 1.8) * 1.2));
  vec2 st2 = stratus(p, sd);
  float deck = st2.x;
  col += htint * hl * dash * min(glow, 1.4) * 1.1 * (1.0 - deck);
  col += mix(uHigh, uGlow, sat(exp(-sd * 1.5) * 1.3)) * st2.y * 1.2;
  if (deck > 0.3 || st2.y > 0.2) mat = 11.0;
  // a sparse fan of rays from the sun, seen in the gaps of the deck
  float ang = atan(d.y, d.x);
  float N = 72.0;
  float u = ang / PI * N;
  float id = floor(u);
  float hr = hash11(id + 0.37);
  float perp = abs(fract(u) - 0.5 - (hr - 0.5) * 0.4) * (PI / N) * r;
  float h2 = hash11(id + 7.1);
  float len = 0.3 + 2.6 * h2 * h2;
  float str = step(0.35, hash11(id + 3.3)) * (0.55 + 0.45 * sin(TAU * (uPhase * float(1 + int(hr * 3.0)) + hr * 5.0)));
  float ray = lineAt(perp) * smoothstep(len, len * 0.5, r) * smoothstep(0.08, 0.14, r) * step(0.0, d.y);
  col += mix(uHigh, uGlow, exp(-r * 1.5)) * ray * str * (1.3 / (1.0 + 2.5 * r)) * (1.0 - deck);
  // the sun: a disc of fine concentric rings inside a bright limb, short corona
  float R = 0.06;
  if (r < R + LW * 2.0) {
    float limb = lineAt(r - R) * 3.0;
    float ringSp = LW * 2.6;
    float rings = lineAt((fract(r / ringSp + 0.5) - 0.5) * ringSp) * step(r, R);
    vec3 sc = uSun * (limb + rings * 2.0) + uGlow * 0.6 * step(r, R);
    col = mix(col, sc, step(r, R + LW * 2.0));
    mat = 2.0;
  } else if (r < R * 2.0) {
    float a2 = fract(ang / TAU * 40.0) - 0.5;
    float cor = lineAt(a2 * TAU / 40.0 * r) * smoothstep(R * 2.0, R * 1.15, r) * step(0.4, hash11(floor(ang / TAU * 40.0)));
    col += uSun * cor * 1.3 * (1.0 - deck);
    if (cor > 0.1) mat = 2.0;
  }
  // stars in the gaps of the upper sky
  if (!refl && h > 0.4 && deck < 0.1) {
    vec2 g = p * 85.0;
    vec2 gid = floor(g), f = fract(g) - 0.5;
    float hs = hash12(gid + 31.0);
    if (hs > 0.95) {
      vec2 o = (hash22(gid) - 0.5) * 0.6;
      float st = smoothstep(0.18, 0.0, length(f - o)) * (hs - 0.95) * 20.0 * smoothstep(0.4, 0.75, h);
      st *= 0.85 + 0.15 * sin(TAU * (uPhase * 4.0 + hs * 9.0));
      col += mix(uSun, uRim, hs) * st * 0.4;
      if (st > 0.05) mat = 8.0;
    }
  }
  // the far range: low dark silhouette with a lit crest
  float mh = 0.012 + 0.02 * vnoise(vec2(p.x * 3.1 + 2.0, 0.0)) + 0.008 * vnoise(vec2(p.x * 13.0, 1.0));
  if (h < mh) {
    float crest = lineAt(h - mh) * (0.25 + 1.2 * exp(-abs(p.x - SUN.x) * 2.0));
    col = uBody * 0.03 + uRim * crest;
    mat = 3.0;
  }
  return col;
}

// birds circling the towers
vec3 birds(vec2 p, inout float mat){
  vec3 col = vec3(0.0);
  for (int i = 0; i < 4; i++) {
    vec4 c = creature(i);
    float s = FOC / c.y;
    vec2 top = vec2(creX(c), groundY(c.y) + 44.0 * s);
    if (abs(p.x - top.x) > 40.0 * s || abs(p.y - top.y) > 16.0 * s) continue;
    for (int b = 0; b < 5; b++) {
      float fb = float(b);
      float ang = TAU * (uPhase * float(3 + b % 3) + fb * 0.27 + float(i) * 0.41);
      vec2 bp = top + vec2(cos(ang) * (9.0 + 4.0 * fb), sin(ang) * 2.0 + 3.0 + fb * 1.4) * s;
      vec2 lp = (p - bp) / s;
      float flap = sin(TAU * (uPhase * 90.0 + fb * 0.37));
      float wing = 0.9 + 0.6 * flap;
      float dw = min(sdSegment(lp, vec2(0.0), vec2(-1.3, wing)), sdSegment(lp, vec2(0.0), vec2(1.3, wing)));
      float w = smoothstep((LW + uPxSize) / s, 0.0, dw);
      if (w > 0.0) { col = max(col, uSun * 0.6 * w); mat = 8.0; }
    }
  }
  return col;
}

// ---------------------------------------------------------------- figures in the image
// Draws the creatures at screen point p as an engraving: dark masses, a
// contour line brighter where it faces the sun, concentric hatching on the
// shells, linework, lit windows. mirror = true reflects each creature about its
// own ground line. Front-to-back premultiplied result; hitZ = nearest hit.
vec4 drawFigures(vec2 p, bool mirror, float minZ, out float hitZ, out float mat){
  vec4 acc = vec4(0.0);
  hitZ = 1e9;
  for (int i = 0; i < NCRE; i++) {
    vec4 c = creature(i);
    if (c.y < minZ) continue;
    float s = FOC / c.y;
    float yg = groundY(c.y);
    vec2 pp = p;
    if (mirror) pp.y = 2.0 * yg - p.y;
    vec2 q = (pp - vec2(creX(c), yg)) / s;
    if (q.x < -17.0 || q.x > 19.0 || q.y < -1.5 || q.y > 60.0) continue;
    vec4 f = figure(q, i, c);
    float pxm = uPxSize / s;
    float lwm = LW / s;
    float cov = smoothstep(pxm, -pxm, f.x);
    float contour = smoothstep(lwm + pxm, lwm - pxm, abs(f.x));
    float a = max(cov, contour);
    if (a <= 0.0) continue;
    vec2 sdir = normalize(SUN - pp + vec2(0.0, 0.2));
    if (mirror) sdir.y = -sdir.y;
    float facing = 0.5;
    if (contour > 0.0) {
      float e = max(pxm, 0.06);
      float dx = figure(q + vec2(e, 0.0), i, c).x - f.x;
      float dy = figure(q + vec2(0.0, e), i, c).x - f.x;
      vec2 n = normalize(vec2(dx, dy) + 1e-6);
      facing = max(0.0, dot(n, sdir));
    }
    float haze = 1.0 - exp(-c.y / 1800.0);
    float far = f.w > 9.5 && f.w < 10.5 ? 0.5 : 1.0;
    vec3 col = uBody * 0.015;
    // concentric hatching inside the shells, densest near the outline
    if (f.w > 11.5) {
      float hs = max(0.9, uCellPx.y * uPxSize * 1.7 / s);
      float t = -f.x / hs;
      float hl = smoothstep(lwm * 0.8 + pxm, lwm * 0.8 - pxm, abs(fract(t) - 0.5) * hs) * step(0.5, t);
      col += uBody * hl * step(t, 1.6) * 0.35;
    }
    col += uBody * 0.22 * sat(f.z) * far * (f.w > 11.5 ? 0.5 : 1.0);    // linework
    if (f.w > 3.5 && f.w < 4.5) {                                       // foliage stipple
      float lv = vnoise(q * 3.0 + float(i)) * 0.6 + vnoise(q * 7.0) * 0.4;
      col = uLeaf * 0.6 * smoothstep(0.5, 0.75, lv);
    }
    if (f.w > 8.5 && f.w < 9.5) col = uFlag * 0.55;                     // flags
    col += uWin * f.y * 1.4 * far;                                      // windows, lamps
    vec3 line = mix(uBody * 2.2, uRim * 2.0, pow(facing, 1.5)) * far;
    col = mix(col, line, contour);
    vec3 hz = mix(uHigh, uGlow, exp(-abs(pp.x - SUN.x) * 1.5)) * 0.4;
    col = mix(col, hz * (0.3 + contour), haze * (0.45 + 0.4 * uAtmos));
    float wgt = (1.0 - acc.a) * a;
    acc.rgb += col * wgt;
    if (wgt > 0.25 && hitZ > 1e8) {
      hitZ = c.y;
      mat = (f.w > 3.5 && f.w < 4.5) ? 4.0 : (f.y > 0.3 ? 7.0 : ((f.w > 8.5 && f.w < 9.5) ? 9.0 : 3.0));
    }
    acc.a += wgt;
    if (acc.a > 0.995) break;
  }
  return acc;
}

vec3 sceneColor(vec2 p, out float mat, out float depth){
  camX = VEL * uTime;
  camDX = uCamAmt * 4.0 * sin(TAU * uPhase);
  SUN = vec2(1.02, HOR + 0.095);
  // a line must be at least one sub-cell sample wide to be caught reliably
  LW = 0.62 * max(uCellPx.x / 3.0, uCellPx.y / 4.0) * uPxSize;
  mat = 1.0; depth = 1.0;
  vec3 col;
  float hz; float fm = 3.0;
  if (p.y >= HOR) {
    float sm;
    col = skyCol(p, false, sm);
    mat = sm;
    col += birds(p, mat);
    vec4 fg = drawFigures(p, false, 0.0, hz, fm);
    col = fg.rgb + (1.0 - fg.a) * col;
    if (fg.a > 0.5) { mat = fm; depth = hz / 3000.0; }
    return col;
  }
  // ---- the flat
  float Z = FOC * CAMH / (HOR - p.y);
  float X = camX + camDX + p.x * Z / FOC;
  depth = sat(Z / 3000.0);
  vec4 fg = drawFigures(p, false, 0.0, hz, fm);
  // footfall ripples of the two nearest creatures
  float rip = 0.0, ring = 0.0;
  float lwz = LW * Z / FOC;            // line half width in metres at this depth
  for (int i = 0; i < 2; i++) {
    vec4 c = creature(i);
    if (abs(Z - c.y) > 16.0) continue;
    float Xc0 = camX + camDX + creX(c) * c.y / FOC;
    float ph = fract(uTime / TG + c.z);
    for (int j = 0; j < 4; j++) {
      float lph = fract(ph + float(j) * 0.25);
      float baseX = (j == 0 || j == 2) ? -4.8 : 4.8;
      float zc = c.y + (j < 2 ? -2.0 : 2.0);
      for (int k = 0; k < 2; k++) {
        if (lph > 0.75 && k == 0) continue;
        float age = lph * TG + float(k) * TG;
        float landX = Xc0 + baseX + VEL * TG * 0.5 + (j < 2 ? 0.0 : 0.8) - VEL * age;
        float dd = length(vec2(X - landX, (Z - zc) * 0.6));
        float rr = 1.0 + 2.4 * age;
        float a = exp(-age / 4.5) * smoothstep(0.0, 0.4, age);
        rip += a * sin((dd - rr) * 4.0) * exp(-pow((dd - rr) / 1.4, 2.0));
        ring = max(ring, a * smoothstep(lwz * 2.5, 0.0, abs(dd - rr)));
      }
    }
  }
  // water strokes: the mirror is read through horizontal streaks of ruffled water
  float sx = X / 6.0;                       // 180 m loop scroll = 30 noise periods
  float wn = vnoise(vec3(sx * 1.0, Z * 2.2, uPhase * 6.0), ivec3(30, 0, 6));
  float wn2 = vnoise(vec3(sx * 4.0, Z * 7.0, uPhase * 6.0 + 3.0), ivec3(120, 0, 6));
  float stroke = smoothstep(0.32, 0.55, wn * 0.7 + wn2 * 0.3 + exp(-Z / 90.0) * -0.25 + 0.12);
  float slope = rip * 0.8 + (wn2 - 0.5) * 0.6;
  // reflection: sky about the horizon, figures about their own feet
  vec2 pr = vec2(p.x, 2.0 * HOR - p.y + slope * 0.006 * (1.0 + 25.0 / Z));
  float sm;
  vec3 rc = skyCol(pr, true, sm);
  float rz, rm;
  vec2 pf = vec2(p.x, p.y - slope * 0.006 * (1.0 + 25.0 / Z));
  vec4 rf = drawFigures(pf, true, Z, rz, rm);
  rc = rf.rgb + (1.0 - rf.a) * rc;
  float R = mix(0.95, 0.35, sat(atan(CAMH / Z) * 3.5));
  vec3 water = rc * R * 0.55 * (0.15 + 0.85 * stroke);
  // the sun's glitter path: bright dashes in a column widening towards us
  float gw = 0.03 + 0.5 * FOC * CAMH / Z * 0.35;
  float gp = exp(-pow((p.x - SUN.x) / gw, 2.0)) * smoothstep(0.55, 0.75, wn2 * 0.5 + wn * 0.5 + 0.1);
  water += uSun * gp * 1.4 * exp(-(HOR - p.y) * 1.2);
  water += uRim * ring * 0.9;
  // salt crust ridges: lines, lit close by, dark far away against the mirror
  float sp = uPxSize * 2.5;
  float fw = max(Z * sp / FOC, Z * Z * sp / (FOC * CAMH)) / HEXS;
  vec4 hc = hexCell(vec2(X, Z) / HEXS);
  float he = hexEdge(hc.xy);
  float rw = max(0.028, lwz / HEXS);
  float ridge = smoothstep(rw + fw, rw - fw * 0.5, he);
  ridge *= sat(1.5 - fw * 1.2);
  float cellv = hash12(hc.zw + 17.0);
  vec3 salt = uSalt * (0.03 + 0.85 * exp(-Z / 12.0)) * (0.65 + 0.35 * cellv);
  col = mix(water, salt, ridge);
  mat = ridge > 0.4 ? 5.0 : (rf.a > 0.5 ? rm : (gp > 0.3 ? 2.0 : 6.0));
  col = fg.rgb + (1.0 - fg.a) * col;
  if (fg.a > 0.5) { mat = fm; depth = hz / 3000.0; }
  return col;
}

<script>
/* Page controller: font loading, render loop, control panel, keyboard,
 * full-screen, persistence and the capture API used by tools/render.mjs. */
(function () {
  'use strict';
  const A = window.ASCII;
  const qs = new URLSearchParams(location.search);
  const capture = qs.has('capture');
  const STORE = 'ascii-wallpaper-v2';

  const $ = (s) => document.querySelector(s);
  const canvas = $('#view');
  const panel = $('#panel');
  const hint = $('#hint');

  function fail(msg) {
    const e = $('#err');
    e.style.display = 'flex';
    e.textContent = msg;
  }

  async function loadFonts() {
    await Promise.all(
      A.fonts.map(async (f) => {
        const bin = Uint8Array.from(atob(f.b64), (c) => c.charCodeAt(0));
        const face = new FontFace(f.family, bin.buffer, { weight: String(f.weight) });
        await face.load();
        document.fonts.add(face);
      })
    );
  }

  // ------------------------------------------------------------ settings
  const sceneById = (id) => A.scenes.find((s) => s.id === id);
  const visibleScenes = () => A.scenes.filter((s) => !s.hidden);
  function sceneDefaults(sc) {
    return Object.assign({}, A.DEFAULTS, { scene: sc.id }, sc.defaults || {});
  }
  function loadStored() {
    try {
      return JSON.parse(localStorage.getItem(STORE) || 'null');
    } catch (e) {
      return null;
    }
  }
  function store(s) {
    try {
      localStorage.setItem(STORE, JSON.stringify(s));
    } catch (e) {}
  }

  const NUM = ['adaptive', 'preset', 'bigGlyphs', 'dither', 'glyphPx', 'lineHeight', 'resScale', 'detail', 'speed', 'exposure', 'saturation', 'brightness', 'sharp', 'glyphGamma',
    'atmosphere', 'camera', 'stability', 'palette', 'font', 'cover', 'colGamma', 'seed'];

  function initialSettings() {
    let sc = sceneById(qs.get('scene')) || null;
    const stored = capture ? null : loadStored();
    if (!sc && stored && sceneById(stored.scene)) sc = sceneById(stored.scene);
    if (!sc) sc = visibleScenes()[0] || A.scenes[0];
    let s = sceneDefaults(sc);
    if (stored && stored.scene === sc.id) Object.assign(s, stored);
    for (const k of NUM) if (qs.has(k)) s[k] = parseFloat(qs.get(k));
    if (!s.glyphPx) s.glyphPx = autoGlyph();
    if (qs.has('quality')) s.quality = qs.get('quality');
    s.scene = sc.id;
    return s;
  }
  // default glyph size: about 11 device px on a 2160 px tall screen, never
  // below 8 px so glyph shapes stay legible on small screens
  function autoGlyph() {
    const h = (capture ? +qs.get('h') : Math.max(screen.height, screen.width * 9 / 16) * (window.devicePixelRatio || 1)) || 1080;
    return Math.max(8, Math.min(18, Math.round(h / 196)));
  }

  // ------------------------------------------------------------ engine
  let eng;
  let settings;
  let last = performance.now();
  let fpsAcc = 0,
    fpsN = 0,
    lastMeasure = 0;

  function applySettings(rebuild, auto) {
    eng.settings = Object.assign(eng.settings, settings);
    if (eng.scene !== sceneById(settings.scene)) eng.setScene(settings.scene);
    if (rebuild) eng.resize(true);
    // automatic quality steps are not remembered, so a slow moment never
    // permanently lowers quality
    if (!capture && !auto) store(settings);
  }

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (!eng.paused) eng.time += dt * settings.speed;
    eng.render(eng.time);
    fpsAcc += dt;
    fpsN++;
    if (now - lastMeasure > 1500) {
      eng.stats.fps = fpsN / Math.max(fpsAcc, 1e-3);
      governor(eng.stats.fps);
      fpsAcc = 0;
      fpsN = 0;
      lastMeasure = now;
      if (panel.classList.contains('open')) {
        eng.measure();
        updateStats();
      }
    }
    requestAnimationFrame(frame);
  }

  // Adaptive quality: if the GPU cannot keep ~24 fps for several seconds the
  // scene sampling is reduced one step (High -> Live), then the canvas
  // resolution. Glyph size and look are never changed automatically.
  let slow = 0;
  function governor(fps) {
    if (!settings.adaptive || eng.paused || document.hidden) return;
    slow = fps < 24 ? slow + 1 : 0;
    if (slow < 3) return;
    slow = 0;
    if (settings.quality === 'ultra') settings.quality = 'high';
    else if (settings.quality === 'high') settings.quality = 'live';
    else if (settings.resScale > 0.75) settings.resScale = 0.75;
    else return;
    applySettings(true, true);
    if (panel.classList.contains('open')) buildPanel();
  }

  // ------------------------------------------------------------ panel
  const CONTROLS = [
    { sec: 'Scene' },
    { k: 'scene', label: 'Scene', type: 'scene' },
    { k: 'preset', label: 'Preset', type: 'preset', when: (sc) => sc.presets && sc.presets.length },
    { k: 'palette', label: 'Palette', type: 'palette' },
    { sec: 'Characters' },
    { k: 'glyphPx', label: 'Glyph size', min: 5, max: 32, step: 1, rebuild: true, fmt: (v) => v + 'px' },
    { k: 'lineHeight', label: 'Line height', min: 0.9, max: 1.6, step: 0.02, rebuild: true },
    { k: 'font', label: 'Font', type: 'font', rebuild: true },
    { k: 'glyphGamma', label: 'Glyph weight', min: 0.5, max: 1.4, step: 0.05, rebuild: true, invert: true },
    { k: 'sharp', label: 'Edge contrast', min: 1, max: 3, step: 0.05 },
    { k: 'cover', label: 'Ink density', min: 0.3, max: 1, step: 0.01 },
    { k: 'dither', label: 'Texture mix', min: 0, max: 1.5, step: 0.05 },
    { k: 'bigGlyphs', label: 'Depth type scale', type: 'toggle', when: (sc) => sc.bigDepth > 0 },
    { sec: 'World' },
    { k: 'detail', label: 'Scene detail', min: 0, max: 1, step: 0.01 },
    { k: 'atmosphere', label: 'Atmosphere', min: 0, max: 1, step: 0.01 },
    { k: 'camera', label: 'Camera drift', min: 0, max: 1, step: 0.01 },
    { k: 'speed', label: 'Speed', min: 0, max: 3, step: 0.05, fmt: (v) => v.toFixed(2) + 'x' },
    { sec: 'Light & colour' },
    { k: 'exposure', label: 'Exposure', min: 0.3, max: 3, step: 0.01 },
    { k: 'brightness', label: 'Brightness', min: 0.3, max: 2, step: 0.01 },
    { k: 'saturation', label: 'Saturation', min: 0, max: 2, step: 0.01 },
    { sec: 'Rendering' },
    { k: 'quality', label: 'Quality', type: 'quality', rebuild: true },
    { k: 'resScale', label: 'Resolution', min: 0.5, max: 1, step: 0.05, rebuild: true, fmt: (v) => Math.round(v * 100) + '%' },
    { k: 'stability', label: 'Stability', min: 0, max: 1, step: 0.01 },
    { k: 'adaptive', label: 'Auto quality', type: 'toggle' },
  ];

  function opt(v, label, sel) {
    return `<option value="${v}"${sel ? ' selected' : ''}>${label}</option>`;
  }
  function buildPanel() {
    const sc = sceneById(settings.scene);
    let h = `<h1>ASCII Wallpaper</h1><div class="sub">${sc.name}${sc.tagline ? ' &middot; ' + sc.tagline : ''}</div>`;
    for (const c of CONTROLS) {
      if (c.sec) {
        h += `<div class="sec">${c.sec}</div>`;
        continue;
      }
      const v = settings[c.k];
      if (c.when && !c.when(sc)) continue;
      if (c.type === 'toggle') {
        h += `<div class="row sel"><label>${c.label}</label><button data-t="${c.k}" class="${v ? 'on' : ''}">${v ? 'On' : 'Off'}</button></div>`;
        continue;
      }
      if (c.type) {
        let o = '';
        if (c.type === 'scene') o = visibleScenes().map((s) => opt(s.id, s.name, s.id === v)).join('');
        if (c.type === 'preset') o = opt(-1, 'Custom', v < 0) + sc.presets.map((p, i) => opt(i, p.name, i === v)).join('');
        if (c.type === 'palette') o = (sc.palettes || [{ name: 'Default' }]).map((p, i) => opt(i, p.name, i === v)).join('');
        if (c.type === 'font') o = A.fonts.map((f, i) => opt(i, f.label, i === v)).join('');
        if (c.type === 'quality') o = Object.entries(A.QUALITY).map(([k, q]) => opt(k, q.label, k === v)).join('');
        h += `<div class="row sel"><label>${c.label}</label><select data-k="${c.k}">${o}</select></div>`;
      } else {
        h += `<div class="row"><label>${c.label}</label><input type="range" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${v}"><output>${fmt(c, v)}</output></div>`;
      }
    }
    h += `<div class="btns">
      <button data-a="pause">${eng.paused ? 'Resume' : 'Pause'}</button>
      <button data-a="full">Full screen</button>
      <button data-a="hide">Hide interface</button>
      <button data-a="png">Save PNG</button>
      <button data-a="reset">Reset scene</button>
      <button data-a="close">Close</button>
    </div>
    <div id="stats"></div>
    <div class="keys">Space pause &middot; F full screen &middot; H interface &middot; S save &middot; [ ] glyph size</div>`;
    panel.innerHTML = h;
    panel.querySelectorAll('input[type=range]').forEach((el) => el.addEventListener('input', onInput));
    panel.querySelectorAll('select').forEach((el) => el.addEventListener('change', onSelect));
    panel.querySelectorAll('button[data-a]').forEach((el) => el.addEventListener('click', () => action(el.dataset.a)));
    panel.querySelectorAll('button[data-t]').forEach((el) =>
      el.addEventListener('click', () => {
        const k = el.dataset.t;
        settings[k] = settings[k] ? 0 : 1;
        el.classList.toggle('on', !!settings[k]);
        el.textContent = settings[k] ? 'On' : 'Off';
        applySettings(false);
      })
    );
    updateStats();
  }
  function fmt(c, v) {
    v = +v;
    return c.fmt ? c.fmt(v) : v.toFixed(2);
  }
  function onInput(e) {
    const k = e.target.dataset.k;
    const c = CONTROLS.find((x) => x.k === k);
    settings[k] = parseFloat(e.target.value);
    e.target.nextElementSibling.textContent = fmt(c, settings[k]);
    if (settings.preset >= 0) {
      settings.preset = -1;
      const ps = panel.querySelector('select[data-k=preset]');
      if (ps) ps.value = '-1';
    }
    applySettings(c.rebuild);
  }
  function onSelect(e) {
    const k = e.target.dataset.k;
    const v = e.target.value;
    if (k === 'scene') {
      const keep = { resScale: settings.resScale, quality: settings.quality, font: settings.font };
      settings = Object.assign(sceneDefaults(sceneById(v)), keep);
      settings.glyphPx = settings.glyphPx || autoGlyph();
      eng.setScene(v);
      applySettings(true);
      buildPanel();
      return;
    }
    settings[k] = k === 'quality' ? v : parseFloat(v);
    if (k === 'preset') {
      const sc = sceneById(settings.scene);
      const pr = sc.presets[settings.preset];
      if (pr) {
        const keep = { resScale: settings.resScale, quality: settings.quality, font: settings.font };
        settings = Object.assign(sceneDefaults(sc), pr.settings || {}, keep, { preset: settings.preset });
        if (!settings.glyphPx) settings.glyphPx = autoGlyph();
      }
      applySettings(true);
      buildPanel();
      return;
    }
    if (k === 'palette') {
      const pal = (sceneById(settings.scene).palettes || [])[settings.palette];
      if (pal && pal.settings) Object.assign(settings, pal.settings);
      applySettings(true);
      buildPanel();
      return;
    }
    applySettings(CONTROLS.find((x) => x.k === k).rebuild);
  }
  function updateStats() {
    const el = $('#stats');
    if (!el) return;
    const s = eng.stats;
    const n = (x) => (x || 0).toLocaleString('en-US');
    el.textContent =
      `grid       ${s.cols} x ${s.rows} cells (${s.cw}x${s.ch}px)\n` +
      `capacity   ${n(s.cells)} cells\n` +
      `drawn      ${n(s.nonSpace)} glyphs (${n(s.distinct)} distinct)\n` +
      `visible    ${n(s.visible)} clearly lit\n` +
      `samples    ${n(s.samples)} scene samples/frame\n` +
      `canvas     ${s.W} x ${s.H}  ${s.fps ? s.fps.toFixed(0) + ' fps' : ''}`;
  }
  function action(a) {
    if (a === 'pause') togglePause();
    if (a === 'full') toggleFull();
    if (a === 'hide') setPanel(false);
    if (a === 'close') setPanel(false);
    if (a === 'png') savePNG();
    if (a === 'reset') {
      const keep = { resScale: settings.resScale, quality: settings.quality };
      settings = Object.assign(sceneDefaults(sceneById(settings.scene)), keep);
      settings.glyphPx = settings.glyphPx || autoGlyph();
      applySettings(true);
      buildPanel();
    }
  }
  function togglePause() {
    eng.paused = !eng.paused;
    const b = panel.querySelector('[data-a=pause]');
    if (b) b.textContent = eng.paused ? 'Resume' : 'Pause';
  }
  function toggleFull() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen && document.exitFullscreen();
  }
  function savePNG() {
    eng.render(eng.time);
    canvas.toBlob((b) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `ascii-${settings.scene}-${eng.W}x${eng.H}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
  }
  function setPanel(open) {
    panel.classList.toggle('open', open);
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
    if (open) {
      buildPanel();
      hint.classList.remove('show');
    }
  }

  // idle handling: the hint button and cursor appear on mouse movement only
  let idleTimer = 0;
  function poke() {
    document.body.classList.remove('idle');
    if (!panel.classList.contains('open')) hint.classList.add('show');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      hint.classList.remove('show');
      if (!panel.classList.contains('open')) document.body.classList.add('idle');
    }, 2200);
  }

  function bindInput() {
    window.addEventListener('mousemove', poke);
    window.addEventListener('touchstart', poke, { passive: true });
    hint.addEventListener('click', () => setPanel(true));
    canvas.addEventListener('dblclick', toggleFull);
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === ' ') {
        togglePause();
        e.preventDefault();
      } else if (k === 'f') toggleFull();
      else if (k === 'h') setPanel(!panel.classList.contains('open'));
      else if (k === 'escape') setPanel(false);
      else if (k === 's') savePNG();
      else if (k === '[' || k === ']') {
        settings.glyphPx = Math.max(5, Math.min(32, settings.glyphPx + (k === ']' ? 1 : -1)));
        applySettings(true);
        if (panel.classList.contains('open')) buildPanel();
      }
    });
    window.addEventListener('resize', () => eng.resize(false));
  }

  // ------------------------------------------------------------ capture API
  function exposeCapture() {
    window.__ascii = {
      engine: eng,
      set(obj) {
        Object.assign(settings, obj);
        applySettings(true);
      },
      render(t) {
        eng.render(t);
        return eng.stats;
      },
      // render several frames leading up to t so temporal stability matches
      // what a viewer sees during playback
      renderAt(t, warm = 6, fps = 30) {
        eng.hasPrev = false;
        for (let i = warm; i >= 0; i--) eng.render(t - i / fps);
        return eng.measure();
      },
      measure: () => eng.measure(),
      pixels() {
        const gl = eng.gl;
        const px = new Uint8Array(eng.W * eng.H * 4);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
        gl.readPixels(0, 0, eng.W, eng.H, gl.RGBA, gl.UNSIGNED_BYTE, px);
        return px;
      },
    };
  }

  async function main() {
    try {
      await loadFonts();
    } catch (e) {
      console.warn('font load failed', e);
    }
    settings = initialSettings();
    const fixed = capture && qs.has('w') ? [+qs.get('w'), +qs.get('h')] : null;
    try {
      eng = new A.Engine(canvas, { settings, fixedSize: fixed, preserve: capture });
      eng.setScene(settings.scene);
      eng.resize(true);
    } catch (e) {
      fail(String(e.message || e));
      window.__asciiError = String(e.message || e);
      throw e;
    }
    if (capture) {
      document.body.classList.add('idle');
      hint.style.display = 'none';
      exposeCapture();
      window.__asciiReady = true;
      return;
    }
    eng.time = (sceneById(settings.scene).startAt || 0) % (sceneById(settings.scene).loop || 60);
    bindInput();
    exposeCapture();
    requestAnimationFrame(frame);
  }
  main();
})();

</script>
</body>
</html>
