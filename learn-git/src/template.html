<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Git</title>
<meta name="description" content="An interactive, visual guide to git and GitHub for people who have never touched either. Practice terminals, live commit graphs, missions and quizzes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* @styles */
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <button class="icon-btn menu-btn" type="button" aria-label="Open the route map" aria-controls="routemap" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#welcome">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16h26"/><circle cx="10" cy="16" r="5"/><circle cx="22" cy="16" r="5"/></svg>
    <span class="brand-name">Learn Git</span>
    <span class="brand-sub">from zero to pull requests</span>
  </a>
  <div class="trip" aria-label="Your progress">
    <div class="trip-track"><span class="trip-fill"></span><span class="trip-train"></span></div>
    <span class="trip-count">0 / 0 stops</span>
  </div>
  <button class="icon-btn search-btn" type="button" aria-label="Search the guide (Ctrl+K)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <kbd class="search-kbd">Ctrl K</kbd>
  </button>
  <button class="icon-btn theme-btn" type="button" aria-label="Switch light or dark theme">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" class="fill"/></svg>
  </button>
</header>

<div class="shell">
  <nav class="routemap" id="routemap" aria-label="Chapters"></nav>
  <div class="scrim" hidden></div>
  <main id="main" class="content" tabindex="-1">
<!-- @chapters -->
  </main>
</div>

<div class="tooltip" role="tooltip" hidden></div>

<div class="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search the guide">
    <input class="palette-input" type="search" placeholder="Search chapters, commands, words..." autocomplete="off" spellcheck="false">
    <ul class="palette-list" role="listbox"></ul>
    <p class="palette-foot"><kbd>Up</kbd> <kbd>Down</kbd> to move, <kbd>Enter</kbd> to open, <kbd>Esc</kbd> to close</p>
  </div>
</div>

<footer class="colophon">Built @build-date. One file, no tracking, works offline (fonts fall back to your system ones).</footer>

<script>
/* @scripts */
</script>
</body>
</html>
