<script>
/* ==== werkzeug.js ==== */
const W = (() => {
  const q = (s, k = document) => k.querySelector(s);
  const qa = (s, k = document) => Array.from(k.querySelectorAll(s));

  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  const ikon = (name, klasse = "") =>
    `<svg class="${klasse}" aria-hidden="true" focusable="false"><use href="#i-${name}"></use></svg>`;

  const el = (tag, attr = {}, ...kinder) => {
    const k = document.createElement(tag);
    for (const [n, v] of Object.entries(attr)) {
      if (v == null || v === false) continue;
      if (n === "klasse") k.className = v;
      else if (n === "html") k.innerHTML = v;
      else if (n === "text") k.textContent = v;
      else if (n.startsWith("on") && typeof v === "function") k.addEventListener(n.slice(2), v);
      else k.setAttribute(n, v === true ? "" : v);
    }
    for (const kind of kinder.flat()) {
      if (kind == null || kind === false) continue;
      k.append(kind.nodeType ? kind : document.createTextNode(String(kind)));
    }
    return k;
  };

  const bremse = (fn, ms = 160) => {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  };

  const melder = () => q("#melder");

  function melde(text, ikone = "check") {
    const box = melder();
    if (!box) return;
    const k = el("div", { klasse: "melde", html: `${ikon(ikone)}<span>${esc(text)}</span>` });
    box.append(k);
    setTimeout(() => {
      k.classList.add("weg");
      setTimeout(() => k.remove(), 300);
    }, 2400);
  }

  async function kopiere(text) {
    try {
      await navigator.clipboard.writeText(text);
      melde("In die Zwischenablage kopiert", "kopie");
      return true;
    } catch (_) {
      const f = el("textarea", { style: "position:fixed;opacity:0;top:0" });
      f.value = text;
      document.body.append(f);
      f.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) {}
      f.remove();
      melde(ok ? "In die Zwischenablage kopiert" : "Kopieren nicht moeglich", ok ? "kopie" : "warn");
      return ok;
    }
  }

  const zahl = (n) => new Intl.NumberFormat("de-DE").format(n);

  const dauerText = (min) => min >= 60
    ? `${Math.floor(min / 60)} Std ${min % 60 ? (min % 60) + " Min" : ""}`.trim()
    : `${min} Min`;

  const wenigerBewegung = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function rollenZu(ziel = 0, sofort = false) {
    window.scrollTo({ top: ziel, behavior: sofort || wenigerBewegung() ? "auto" : "smooth" });
  }

  /* Zeigt waehrend eines Laufs an, was gerade passiert. Ohne das bliebe die
     Anzeige beim ersten Laden minutenlang auf demselben Satz stehen. */
  function laufAnzeige(feld, text = "Wird ausgefuehrt") {
    feld.innerHTML = "";
    const stand = el("span", { klasse: "laeuft" },
      el("span", { klasse: "spinner" }),
      el("span", { klasse: "laeuft-text", text }),
      el("span", { klasse: "laeuft-uhr" }));
    feld.append(stand);

    const beschriftung = q(".laeuft-text", stand);
    const uhr = q(".laeuft-uhr", stand);
    const anfang = Date.now();

    const takt = setInterval(() => {
      const sekunden = Math.round((Date.now() - anfang) / 1000);
      uhr.textContent = sekunden >= 3 ? ` ${sekunden} s` : "";
    }, 500);

    const abmelden = Laufzeit.beobachte((z) => {
      if (z.phase === "laedt") beschriftung.textContent = z.text;
      else if (z.phase === "bereit" && beschriftung.textContent !== text) beschriftung.textContent = text;
    });

    if (!Laufzeit.istBereit() && Laufzeit.zustand.phase === "laedt") {
      beschriftung.textContent = Laufzeit.zustand.text;
    }

    return () => { clearInterval(takt); abmelden(); };
  }

  return { q, qa, esc, ikon, el, bremse, melde, kopiere, zahl, dauerText, rollenZu,
    wenigerBewegung, laufAnzeige };
})();


/* ==== markup.js ==== */
/* Wandelt die Inhaltsbausteine in HTML. Inline-Auszeichnung:
   **fett**  *kursiv*  `code`  [Text](#/ziel) */
const Markup = (() => {
  const esc = W.esc;

  function inline(roh) {
    const text = String(roh == null ? "" : roh);
    const depot = [];
    // Code-Abschnitte herausloesen, damit darin nichts weiter ersetzt wird
    let s = text.replace(/`([^`]+)`/g, (_, inhalt) => {
      depot.push(inhalt);
      return "@@KD" + (depot.length - 1) + "@@";
    });
    s = esc(s);
    s = s.replace(/\[([^\]]+)\]\((#[^)\s]+)\)/g, (_, t, z) => `<a href="${z}">${t}</a>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s(.,;:])\*([^*\n]+)\*(?=$|[\s).,;:!?])/g, "$1<em>$2</em>");
    s = s.replace(/@@KD(\d+)@@/g, (_, i) => `<code>${esc(depot[+i])}</code>`);
    return s;
  }

  function codeKarte(b) {
    const name = b.name || (b.shell ? "Terminal" : "Python");
    const laufbar = b.lauf !== false && !b.shell && !b.roh;
    const koerper = b.shell ? Farbe.schale(b.x) : (b.roh ? Farbe.textAus(b.x) : Farbe.python(b.x));
    const pakete = (b.pakete || []).join(",");
    const eingaben = b.eingaben ? esc(JSON.stringify(b.eingaben)) : "";

    let ausgabe;
    if (b.aus != null) {
      ausgabe = `<div class="ausgabe sichtbar"><div class="innen">
        <div class="a-kopf"><span class="punkt"></span>Ausgabe</div>
        <pre>${esc(b.aus)}</pre></div></div>`;
    } else {
      ausgabe = `<div class="ausgabe"><div class="innen">
        <div class="a-kopf"><span class="punkt"></span>Ausgabe</div>
        <pre></pre></div></div>`;
    }

    return `<div class="code-karte"${pakete ? ` data-pakete="${pakete}"` : ""}${eingaben ? ` data-eingaben="${eingaben}"` : ""}>
      <div class="code-leiste">
        <span class="code-name">${esc(name)}</span>
        <span class="luecke"></span>
        <button class="ikontaste" data-tat="kopieren" aria-label="Code kopieren" title="Kopieren">${W.ikon("kopie")}</button>
        ${laufbar ? `<button class="taste taste-klein" data-tat="laufen">${W.ikon("play")}<span>Ausfuehren</span></button>` : ""}
      </div>
      <pre class="code"><code>${koerper}</code></pre>
      ${ausgabe}
    </div>`;
  }

  function tabelle(b) {
    const kopf = b.kopf.map((z) => `<th>${inline(z)}</th>`).join("");
    const zeilen = b.zeilen.map((r) => `<tr>${r.map((z) => `<td>${inline(z)}</td>`).join("")}</tr>`).join("");
    return `<div class="tab-huelle"><table><thead><tr>${kopf}</tr></thead><tbody>${zeilen}</tbody></table></div>`;
  }

  const NOTIZ_IKON = { info: "info", warnung: "warn", tipp: "gluehbirne", merke: "stern" };
  const NOTIZ_WORT = { info: "Hinweis", warnung: "Achtung", tipp: "Tipp", merke: "Merke" };

  function notiz(b) {
    const art = b.art || "info";
    const titel = b.titel || NOTIZ_WORT[art];
    const absaetze = (Array.isArray(b.x) ? b.x : [b.x]).map((t) => `<p>${inline(t)}</p>`).join("");
    return `<div class="notiz ${art === "info" ? "" : art}">
      <div class="n-kopf">${W.ikon(NOTIZ_IKON[art])}<span>${esc(titel)}</span></div>
      ${absaetze}</div>`;
  }

  function block(b) {
    if (!b) return "";
    if (typeof b === "string") return `<p>${inline(b)}</p>`;
    switch (b.t) {
      case "p": return `<p>${inline(b.x)}</p>`;
      case "h2": return `<h2>${inline(b.x)}</h2>`;
      case "h": return `<h3>${inline(b.x)}</h3>`;
      case "h4": return `<h4>${inline(b.x)}</h4>`;
      case "code": return codeKarte(b);
      case "liste": return `<ul class="liste-block">${b.x.map((z) => `<li>${inline(z)}</li>`).join("")}</ul>`;
      case "nummern": return `<ol class="liste-block">${b.x.map((z) => `<li>${inline(z)}</li>`).join("")}</ol>`;
      case "notiz": return notiz(b);
      case "tabelle": return tabelle(b);
      case "trenner": return "<hr>";
      case "roh": return b.x;
      default: return "";
    }
  }

  function bloecke(liste) {
    return (liste || []).map(block).join("\n");
  }

  /* Macht Kopier- und Ausfuehrknoepfe lebendig. */
  function belebe(wurzel) {
    W.qa(".code-karte", wurzel).forEach((karte) => {
      if (karte.dataset.belebt) return;
      karte.dataset.belebt = "1";
      const feld = W.q("pre.code code", karte);
      const kopieren = W.q('[data-tat="kopieren"]', karte);
      const laufen = W.q('[data-tat="laufen"]', karte);
      if (kopieren) kopieren.addEventListener("click", () => W.kopiere(feld.textContent));
      if (laufen) laufen.addEventListener("click", () => Laufzeit.fuehreKarteAus(karte, feld.textContent));
    });
  }

  return { inline, bloecke, block, belebe, codeKarte };
})();


/* ==== highlight.js ==== */
/* Kleiner Python-Tokenizer fuer die Syntaxhervorhebung. */
const Farbe = (() => {
  const SCHL = new Set([
    "False","None","True","and","as","assert","async","await","break","class","continue","def","del",
    "elif","else","except","finally","for","from","global","if","import","in","is","lambda","match",
    "case","nonlocal","not","or","pass","raise","return","try","while","with","yield"
  ]);
  const EING = new Set([
    "abs","aiter","all","anext","any","ascii","bin","bool","breakpoint","bytearray","bytes","callable",
    "chr","classmethod","compile","complex","delattr","dict","dir","divmod","enumerate","eval","exec",
    "filter","float","format","frozenset","getattr","globals","hasattr","hash","help","hex","id","input",
    "int","isinstance","issubclass","iter","len","list","locals","map","max","memoryview","min","next",
    "object","oct","open","ord","pow","print","property","range","repr","reversed","round","set","setattr",
    "slice","sorted","staticmethod","str","sum","super","tuple","type","vars","zip",
    "Exception","ValueError","TypeError","KeyError","IndexError","NameError","ZeroDivisionError",
    "AttributeError","FileNotFoundError","StopIteration","RuntimeError","ImportError","OSError",
    "NotImplementedError","AssertionError","KeyboardInterrupt","RecursionError","OverflowError"
  ]);

  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const sp = (k, t) => `<span class="s-${k}">${esc(t)}</span>`;

  function python(quelle) {
    const s = String(quelle);
    let aus = "";
    let i = 0;
    const n = s.length;

    while (i < n) {
      const c = s[i];

      // Kommentar
      if (c === "#") {
        let j = s.indexOf("\n", i);
        if (j === -1) j = n;
        aus += sp("kom", s.slice(i, j));
        i = j;
        continue;
      }

      // Zeichenkette, auch mit Praefix und dreifachen Anfuehrungszeichen
      const pre = /^(?:[rRbBuUfF]{0,3})(?:"""|'''|"|')/.exec(s.slice(i, i + 6));
      if (pre && /["']/.test(pre[0].slice(-1))) {
        const start = i;
        const pLen = pre[0].length - (pre[0].endsWith('"""') || pre[0].endsWith("'''") ? 3 : 1);
        const praefix = pre[0].slice(0, pLen);
        const zeichen = pre[0].slice(pLen);
        const roh = /r/i.test(praefix);
        i += pre[0].length;
        while (i < n) {
          if (!roh && s[i] === "\\") { i += 2; continue; }
          if (s.startsWith(zeichen, i)) { i += zeichen.length; break; }
          i++;
        }
        aus += sp("txt", s.slice(start, i));
        continue;
      }

      // Dekorator
      if (c === "@" && /[A-Za-z_]/.test(s[i + 1] || "")) {
        const m = /^@[A-Za-z_][\w.]*/.exec(s.slice(i));
        aus += sp("dek", m[0]);
        i += m[0].length;
        continue;
      }

      // Zahl
      if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(s[i + 1] || ""))) {
        const m = /^(?:0[xXbBoO][0-9a-fA-F_]+|(?:\d[\d_]*)?\.?\d[\d_]*(?:[eE][+-]?\d+)?j?)/.exec(s.slice(i));
        if (m) { aus += sp("zahl", m[0]); i += m[0].length; continue; }
      }

      // Name
      if (/[A-Za-z_]/.test(c)) {
        const m = /^[A-Za-z_]\w*/.exec(s.slice(i));
        const wort = m[0];
        i += wort.length;
        let j = i;
        while (j < n && s[j] === " ") j++;
        const folgtKlammer = s[j] === "(";
        if (SCHL.has(wort)) aus += sp("schl", wort);
        else if (wort === "self" || wort === "cls") aus += sp("selbst", wort);
        else if (EING.has(wort)) aus += sp("eing", wort);
        else if (folgtKlammer) aus += sp("fun", wort);
        else aus += esc(wort);
        continue;
      }

      // Operator
      if (/[+\-*/%=<>!&|^~@:,.;[\](){}]/.test(c)) {
        const m = /^(?:\*\*=?|\/\/=?|<<=?|>>=?|[<>=!]=|[-+*/%&|^@]=|->|[+\-*/%=<>!&|^~@:,.;[\](){}])/.exec(s.slice(i));
        aus += sp("op", m ? m[0] : c);
        i += m ? m[0].length : 1;
        continue;
      }

      aus += esc(c);
      i++;
    }
    return aus;
  }

  function schale(quelle) {
    return String(quelle).split("\n").map((z) => {
      const m = /^(\$|>>>|\.\.\.)(\s?)(.*)$/.exec(z);
      if (m) return sp("schl", m[1]) + esc(m[2]) + (m[1] === "$" ? esc(m[3]) : python(m[3]));
      return sp("kom", z);
    }).join("\n");
  }

  function textAus(quelle) { return esc(String(quelle)); }

  return { python, schale, textAus, esc };
})();


/* ==== speicher.js ==== */
/* Haelt den Lernfortschritt. Faellt auf reinen Arbeitsspeicher zurueck,
   wenn der Browser keinen dauerhaften Speicher erlaubt. */
const Speicher = (() => {
  const SCHLUESSEL = "python-kurs.fortschritt.v1";
  const THEMA_SCHLUESSEL = "python-kurs.thema.v1";
  let daten = { lektionen: {}, pruefungen: {}, letzte: null };
  let dauerhaft = true;

  function lies(schluessel) {
    try { return window.localStorage.getItem(schluessel); }
    catch (_) { dauerhaft = false; return null; }
  }
  function schreib(schluessel, wert) {
    try { window.localStorage.setItem(schluessel, wert); }
    catch (_) { dauerhaft = false; }
  }

  function lade() {
    const roh = lies(SCHLUESSEL);
    if (!roh) return;
    try {
      const d = JSON.parse(roh);
      if (d && typeof d === "object") {
        daten = { lektionen: d.lektionen || {}, pruefungen: d.pruefungen || {}, letzte: d.letzte || null };
      }
    } catch (_) { /* beschaedigte Daten werden verworfen */ }
  }

  let sicherungLaeuft = null;
  function sichere() {
    if (sicherungLaeuft) return;
    sicherungLaeuft = setTimeout(() => {
      sicherungLaeuft = null;
      schreib(SCHLUESSEL, JSON.stringify(daten));
      document.dispatchEvent(new CustomEvent("fortschritt"));
    }, 60);
  }

  function eintrag(id) {
    if (!daten.lektionen[id]) daten.lektionen[id] = { gesehen: false, quiz: null, aufgaben: {} };
    return daten.lektionen[id];
  }

  const gesehen = (id) => !!(daten.lektionen[id] && daten.lektionen[id].gesehen);

  function markiereGesehen(id) {
    const e = eintrag(id);
    if (!e.gesehen) { e.gesehen = true; sichere(); }
    daten.letzte = id;
    schreib(SCHLUESSEL, JSON.stringify(daten));
  }

  function setzeQuiz(id, richtig, gesamt) {
    const e = eintrag(id);
    if (!e.quiz || e.quiz.richtig < richtig) e.quiz = { richtig, gesamt };
    sichere();
  }

  function setzeAufgabe(id, aufgabeId) {
    const e = eintrag(id);
    if (!e.aufgaben[aufgabeId]) { e.aufgaben[aufgabeId] = true; sichere(); }
  }

  const holeQuiz = (id) => (daten.lektionen[id] && daten.lektionen[id].quiz) || null;
  const aufgabeGeloest = (id, aufgabeId) => !!(daten.lektionen[id] && daten.lektionen[id].aufgaben[aufgabeId]);

  function setzePruefung(id, richtig, gesamt) {
    const alt = daten.pruefungen[id];
    if (!alt || alt.richtig < richtig) daten.pruefungen[id] = { richtig, gesamt, am: Date.now() };
    sichere();
  }
  const holePruefung = (id) => daten.pruefungen[id] || null;

  /* Eine Lektion gilt als abgeschlossen, wenn das Quiz zu mindestens
     70 Prozent richtig war und alle Aufgaben geloest sind. */
  function lektionFertig(lek) {
    if (!lek) return false;
    const e = daten.lektionen[lek.id];
    if (!e) return false;
    const fragen = (lek.quiz || []).length;
    if (fragen) {
      if (!e.quiz || e.quiz.gesamt === 0) return false;
      if (e.quiz.richtig / e.quiz.gesamt < 0.7) return false;
    }
    const aufgaben = lek.aufgaben || [];
    for (const a of aufgaben) if (!e.aufgaben[a.id]) return false;
    if (!fragen && !aufgaben.length) return !!e.gesehen;
    return true;
  }

  /* Anteil zwischen 0 und 1, damit der Fortschritt sich schon waehrend
     einer Lektion bewegt und nicht erst am Ende springt. */
  function lektionAnteil(lek) {
    if (!lek) return 0;
    const e = daten.lektionen[lek.id];
    if (!e) return 0;
    const fragen = (lek.quiz || []).length;
    const aufgaben = (lek.aufgaben || []).length;
    const teile = [];

    if (fragen) {
      const q = e.quiz;
      teile.push(q && q.gesamt ? Math.min(1, q.richtig / q.gesamt / 0.7) : 0);
    }
    if (aufgaben) {
      const geloest = (lek.aufgaben || []).filter((a) => e.aufgaben[a.id]).length;
      teile.push(geloest / aufgaben);
    }
    if (!teile.length) return e.gesehen ? 1 : 0;
    return teile.reduce((a, b) => a + b, 0) / teile.length;
  }

  function zuruecksetzen() {
    daten = { lektionen: {}, pruefungen: {}, letzte: null };
    schreib(SCHLUESSEL, JSON.stringify(daten));
    document.dispatchEvent(new CustomEvent("fortschritt"));
  }

  const letzte = () => daten.letzte;
  const istDauerhaft = () => dauerhaft;
  const themaLesen = () => lies(THEMA_SCHLUESSEL);
  const themaSchreiben = (w) => schreib(THEMA_SCHLUESSEL, w);

  lade();

  return {
    gesehen, markiereGesehen, setzeQuiz, holeQuiz, setzeAufgabe, aufgabeGeloest,
    setzePruefung, holePruefung, lektionFertig, lektionAnteil, zuruecksetzen, letzte,
    istDauerhaft, themaLesen, themaSchreiben,
  };
})();


/* ==== thema.js ==== */
/* Farbschema: folgt standardmaessig dem Betriebssystem,
   laesst sich aber manuell auf hell oder dunkel stellen. */
const Thema = (() => {
  const FOLGE = ["auto", "hell", "dunkel"];
  const IKON = { auto: "auto", hell: "sonne", dunkel: "mond" };
  const WORT = { auto: "Systemvorgabe", hell: "Heller Modus", dunkel: "Dunkler Modus" };
  let aktuell = "auto";

  function anwenden(wert, meldung = false) {
    aktuell = FOLGE.includes(wert) ? wert : "auto";
    const wurzel = document.documentElement;
    if (aktuell === "auto") wurzel.setAttribute("data-thema", "auto");
    else wurzel.setAttribute("data-thema", aktuell);

    const schalter = W.q("#themaSchalter");
    if (schalter) {
      schalter.innerHTML = W.ikon(IKON[aktuell]);
      schalter.title = WORT[aktuell];
      schalter.setAttribute("aria-label", `Farbschema: ${WORT[aktuell]}. Zum Wechseln druecken`);
    }
    Speicher.themaSchreiben(aktuell);
    if (meldung) W.melde(WORT[aktuell], IKON[aktuell]);
  }

  function wechseln() {
    const i = FOLGE.indexOf(aktuell);
    anwenden(FOLGE[(i + 1) % FOLGE.length], true);
  }

  function start() {
    anwenden(Speicher.themaLesen() || "auto");
    const schalter = W.q("#themaSchalter");
    if (schalter) schalter.addEventListener("click", wechseln);
  }

  return { start, wechseln, anwenden, aktuell: () => aktuell };
})();


/* ==== laufzeit.js ==== */
const Laufzeit = (() => {
  /* Mehrere Bezugsquellen. Die vollstaendigen Ablagen enthalten auch Pakete
     wie numpy und pandas, die Eintraege ueber npm nur den Interpreter selbst.
     Zwei verschiedene Anbieter, damit eine Sperre nicht alles lahmlegt. */
  function nebenan(pfad) {
    try { return new URL(pfad, location.href).href; } catch (_) { return null; }
  }

  const QUELLEN = [
    // Zuerst direkt neben der Seite. Wer sie selbst betreibt, legt Pyodide
    // einfach in einen Unterordner und braucht dann gar kein Netz.
    { url: nebenan("pyodide/"), pakete: true, name: "Ordner pyodide neben der Seite" },
    { url: nebenan("python-kurs-pyodide/"), pakete: true, name: "Ordner python-kurs-pyodide" },
    { url: "https://cdn.jsdelivr.net/pyodide/v314.0.6/full/", pakete: true, name: "jsDelivr 314.0.6" },
    { url: "https://cdn.jsdelivr.net/pyodide/v0.28.3/full/", pakete: true, name: "jsDelivr 0.28.3" },
    { url: "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/", pakete: true, name: "jsDelivr 0.27.7" },
    { url: "https://unpkg.com/pyodide@314.0.6/", pakete: false, name: "unpkg 314.0.6" },
    { url: "https://cdn.jsdelivr.net/npm/pyodide@314.0.6/", pakete: false, name: "jsDelivr npm 314.0.6" },
  ].filter((q) => q.url);

  const ZEIT_PROBE = 6000;
  const ZEIT_SKRIPT = 25000;
  const ZEIT_START = 120000;

  const NICHT_ERREICHBAR =
    "Der Python-Interpreter konnte nicht geladen werden.\n\n"
    + "Er wird beim ersten Ausfuehren einmalig aus dem Netz geholt. Haeufige Gruende:\n"
    + "  1. keine Internetverbindung\n"
    + "  2. ein Werbe- oder Inhaltsblocker sperrt cdn.jsdelivr.net und unpkg.com\n"
    + "  3. ein Firmennetz laesst diese Adressen nicht durch\n\n"
    + "Text, Fragen und Pruefungen funktionieren auch ohne ihn, und zu jedem Beispiel "
    + "steht die Ausgabe im Text.";

  const ZUSATZPAKETE = new Set(["numpy", "pandas", "matplotlib", "scipy", "sklearn", "sympy"]);

  let py = null;
  let ladeVersprechen = null;
  let starter = null;
  let quelleMitPaketen = true;
  const geladenePakete = new Set();
  const horcher = new Set();

  const zustand = { phase: "kalt", text: "", gruende: [] };

  function melde(phase, text) {
    zustand.phase = phase;
    zustand.text = text;
    horcher.forEach((f) => { try { f(zustand); } catch (_) {} });
  }

  const beobachte = (f) => { horcher.add(f); return () => horcher.delete(f); };

  /* Ohne Zeitgrenze bliebe die Anzeige bei einer haengenden Verbindung
     fuer immer auf "wird ausgefuehrt" stehen. */
  function mitZeitgrenze(versprechen, ms, was) {
    let uhr;
    const grenze = new Promise((_, ablehnen) => {
      uhr = setTimeout(() => ablehnen(new Error("Zeitgrenze ueberschritten: " + was)), ms);
    });
    return Promise.race([versprechen, grenze]).finally(() => clearTimeout(uhr));
  }

  function skriptLaden(url) {
    return mitZeitgrenze(new Promise((loesen, ablehnen) => {
      const s = document.createElement("script");
      s.src = url;
      s.async = true;
      s.dataset.pykurs = "1";
      s.onload = () => loesen();
      s.onerror = () => ablehnen(new Error("Nicht erreichbar: " + url));
      document.head.append(s);
    }), ZEIT_SKRIPT, url);
  }

  /* Kurzer Vorabgriff: so faellt eine gesperrte oder fehlende Quelle
     in Sekunden auf statt erst nach einer langen Zeitgrenze. */
  async function erreichbar(url) {
    // Neben einer oertlich geoeffneten Datei verbietet der Browser fetch.
    // Dort wird direkt der Ladeversuch unternommen.
    if (url.startsWith("file:")) return true;
    if (typeof fetch !== "function") return true;
    const abbruch = typeof AbortController === "function" ? new AbortController() : null;
    const uhr = setTimeout(() => abbruch && abbruch.abort(), ZEIT_PROBE);
    try {
      const antwort = await fetch(url + "pyodide.js", {
        method: "GET",
        signal: abbruch ? abbruch.signal : undefined,
      });
      return antwort.ok;
    } catch (_) {
      return false;
    } finally {
      clearTimeout(uhr);
    }
  }

  function altesSkriptEntfernen() {
    try { delete window.loadPyodide; } catch (_) { /* nicht loeschbar */ }
    if (typeof window.loadPyodide === "function") {
      try { window.loadPyodide = undefined; } catch (_) { /* schreibgeschuetzt */ }
    }
    document.querySelectorAll('script[data-pykurs="1"]').forEach((s) => s.remove());
  }

  const BOOTSTRAP = `
import sys, io, json, time, builtins, traceback

_KURS_ZEIT = 8.0

class _KursAbbruch(Exception):
    pass

def _kurs_waechter(grenze):
    ende = time.time() + grenze
    zaehler = [0]
    def spur(rahmen, ereignis, arg):
        zaehler[0] += 1
        if zaehler[0] % 1500 == 0 and time.time() > ende:
            raise _KursAbbruch("Das Programm lief laenger als " + str(int(grenze)) + " Sekunden und wurde angehalten. Pruefe, ob eine Schleife nie endet.")
        return spur
    return spur

def _kurs_fehlertext(exc, ueberspringen=1):
    tb = exc.__traceback__
    for _ in range(ueberspringen):
        if tb is not None:
            tb = tb.tb_next
    if isinstance(exc, _KursAbbruch):
        return "Zeitlimit: " + str(exc)
    teile = traceback.format_exception(type(exc), exc, tb)
    text = "".join(teile)
    return text.replace('File "<dein-code>"', 'Datei "dein Code"').replace('File "<test>"', 'Datei "Test"').strip()

def _kurs_starte(quelle, eingaben_json, tests_json):
    eingaben = json.loads(eingaben_json or "[]")
    tests = json.loads(tests_json or "[]")
    puffer = io.StringIO()
    raum = {"__name__": "__main__", "__doc__": None}
    warte = list(eingaben)

    def _eingabe(aufforderung=""):
        if aufforderung:
            puffer.write(str(aufforderung))
        wert = str(warte.pop(0)) if warte else ""
        puffer.write(wert + "\\n")
        return wert

    alt_out, alt_err, alt_in = sys.stdout, sys.stderr, builtins.input
    sys.stdout = puffer
    sys.stderr = puffer
    builtins.input = _eingabe
    fehler = None
    sys.settrace(_kurs_waechter(_KURS_ZEIT))
    try:
        exec(compile(quelle, "<dein-code>", "exec"), raum)
    except SystemExit:
        pass
    except BaseException as e:
        fehler = _kurs_fehlertext(e)
    finally:
        sys.settrace(None)
        sys.stdout, sys.stderr, builtins.input = alt_out, alt_err, alt_in

    ausgabe = puffer.getvalue()
    ergebnisse = []
    if tests and fehler is None:
        raum["AUSGABE"] = ausgabe
        raum["QUELLE"] = quelle
        for eintrag in tests:
            name = eintrag.get("name", "Test")
            code = eintrag.get("code", "")
            t_puffer = io.StringIO()
            sys.stdout = t_puffer
            sys.stderr = t_puffer
            builtins.input = _eingabe
            sys.settrace(_kurs_waechter(4.0))
            try:
                exec(compile(code, "<test>", "exec"), raum)
                ergebnisse.append({"name": name, "ok": True, "grund": ""})
            except AssertionError as e:
                grund = str(e) or "Die Bedingung war nicht erfuellt."
                ergebnisse.append({"name": name, "ok": False, "grund": grund})
            except BaseException as e:
                ergebnisse.append({"name": name, "ok": False, "grund": _kurs_fehlertext(e)})
            finally:
                sys.settrace(None)
                sys.stdout, sys.stderr, builtins.input = alt_out, alt_err, alt_in

    return json.dumps({
        "ausgabe": ausgabe,
        "fehler": fehler,
        "tests": ergebnisse,
    })
`;

  async function bereit() {
    if (py) return py;
    if (ladeVersprechen) return ladeVersprechen;

    ladeVersprechen = (async () => {
      const gruende = [];

      /* Alle Quellen gleichzeitig antesten. Nacheinander wuerde jede gesperrte
         Adresse die eigene Zeitgrenze voll ausschoepfen. */
      melde("laedt", "Interpreter wird gesucht");
      const proben = await Promise.all(QUELLEN.map(async (quelle) => {
        try { return { quelle, ok: await erreichbar(quelle.url) }; }
        catch (_) { return { quelle, ok: false }; }
      }));
      proben.forEach((p) => { if (!p.ok) gruende.push(p.quelle.url + ": nicht erreichbar"); });

      const brauchbar = proben.filter((p) => p.ok).map((p) => p.quelle);
      if (!brauchbar.length) {
        zustand.gruende = gruende;
        melde("fehler", NICHT_ERREICHBAR);
        ladeVersprechen = null;
        const fehler = new Error(NICHT_ERREICHBAR);
        fehler.gruende = gruende;
        throw fehler;
      }

      for (let i = 0; i < brauchbar.length; i++) {
        const quelle = brauchbar[i];
        const woher = brauchbar.length > 1 ? ` (Quelle ${i + 1} von ${brauchbar.length})` : "";
        try {
          melde("laedt", "Python wird geladen, beim ersten Mal dauert das etwas" + woher);
          altesSkriptEntfernen();
          await skriptLaden(quelle.url + "pyodide.js");
          if (typeof window.loadPyodide !== "function") {
            gruende.push(quelle.url + ": unerwarteter Inhalt");
            continue;
          }

          melde("laedt", "Python wird gestartet" + woher);
          py = await mitZeitgrenze(
            window.loadPyodide({ indexURL: quelle.url }), ZEIT_START, "Start des Interpreters");
          quelleMitPaketen = quelle.pakete;
          break;
        } catch (e) {
          gruende.push(quelle.url + ": " + (e && e.message ? e.message : e));
          py = null;
        }
      }

      if (!py) {
        zustand.gruende = gruende;
        melde("fehler", NICHT_ERREICHBAR);
        ladeVersprechen = null;
        const fehler = new Error(NICHT_ERREICHBAR);
        fehler.gruende = gruende;
        throw fehler;
      }

      melde("laedt", "Fast fertig");
      await py.runPythonAsync(BOOTSTRAP);
      starter = py.globals.get("_kurs_starte");
      melde("bereit", "Python ist bereit");
      return py;
    })();

    return ladeVersprechen;
  }

  async function ladePakete(namen) {
    if (!namen || !namen.length) return;
    const fehlend = namen.filter((n) => n && !geladenePakete.has(n));
    if (!fehlend.length) return;
    melde("laedt", "Pakete werden geladen: " + fehlend.join(", "));
    try {
      await py.loadPackage(fehlend);
      fehlend.forEach((n) => geladenePakete.add(n));
      melde("bereit", "Python ist bereit");
    } catch (e) {
      melde("bereit", "Python ist bereit");
      throw new Error(
        "Das Paket " + fehlend.join(" und ") + " konnte nicht geladen werden.\n\n"
        + "Dafuer wird eine Internetverbindung gebraucht. Der uebrige Code laeuft weiter, "
        + "und alle Beispiele sind hier auch ohne Ausfuehrung vollstaendig abgedruckt."
      );
    }
  }

  async function fuehreAus(code, einstellungen = {}) {
    await bereit();
    await ladePakete(einstellungen.pakete);
    const roh = starter(code, JSON.stringify(einstellungen.eingaben || []), JSON.stringify(einstellungen.tests || []));
    const ergebnis = JSON.parse(roh);
    if (roh && typeof roh.destroy === "function") roh.destroy();

    // Ein fehlendes Zusatzpaket ist fast immer eine Frage der Verbindung.
    if (ergebnis.fehler && ergebnis.fehler.includes("ModuleNotFoundError")) {
      const treffer = /No module named '([\w.]+)'/.exec(ergebnis.fehler);
      const paket = treffer ? treffer[1].split(".")[0] : "";
      if (ZUSATZPAKETE.has(paket)) {
        ergebnis.fehler += "\n\nDas Paket " + paket + " wird beim ersten Mal aus dem Netz geholt. "
          + "Pruefe deine Internetverbindung und versuche es erneut. "
          + "Das Beispiel und seine Ausgabe stehen hier auch vollstaendig im Text.";
      }
    }
    return ergebnis;
  }

  /* Zeigt das Ergebnis direkt unter einem Beispielblock. */
  async function fuehreKarteAus(karte, code) {
    const knopf = W.q('[data-tat="laufen"]', karte);
    const box = W.q(".ausgabe", karte);
    const feld = W.q(".ausgabe pre", karte);
    const pakete = (karte.dataset.pakete || "").split(",").filter(Boolean);
    let eingaben = [];
    try { eingaben = JSON.parse(karte.dataset.eingaben || "[]"); } catch (_) {}

    box.classList.add("sichtbar");
    box.classList.remove("hat-fehler");
    const anzeigeBeenden = W.laufAnzeige(feld);
    if (knopf) knopf.disabled = true;

    try {
      const e = await fuehreAus(code, { pakete, eingaben });
      if (e.fehler) {
        box.classList.add("hat-fehler");
        feld.textContent = (e.ausgabe ? e.ausgabe + "\n" : "") + e.fehler;
      } else if (e.ausgabe.trim() === "") {
        feld.innerHTML = '<span class="leer">Kein Text ausgegeben. Nutze print(), um etwas anzuzeigen.</span>';
      } else {
        feld.textContent = e.ausgabe;
      }
    } catch (e) {
      box.classList.add("hat-fehler");
      feld.textContent = String(e && e.message ? e.message : e);
      if (String(e && e.message).includes("Interpreter")) {
        feld.append(W.el("div", { style: "margin-top:.6rem" },
          W.el("a", { klasse: "taste taste-klein", href: "#/technik",
            html: `${W.ikon("werkzeug")}<span>Technikpruefung oeffnen</span>` })));
      }
    } finally {
      anzeigeBeenden();
      if (knopf) knopf.disabled = false;
    }
  }

  const istBereit = () => !!py;

  /* Neben einer oertlichen Datei antwortet fetch nicht. Fuer eine ehrliche
     Diagnose wird dort ein echter Ladeversuch unternommen. */
  async function dateiProbe(url) {
    const s = document.createElement("script");
    s.src = url + "pyodide.js";
    s.async = true;
    try {
      await mitZeitgrenze(new Promise((loesen, ablehnen) => {
        s.onload = () => loesen();
        s.onerror = () => ablehnen(new Error("nicht vorhanden"));
        document.head.append(s);
      }), ZEIT_PROBE, url);
      return true;
    } catch (_) {
      return false;
    } finally {
      s.remove();
    }
  }

  /* Fuer die Technikpruefung: jede Quelle einzeln antesten. */
  async function quellenPruefen(beiErgebnis) {
    const ergebnisse = [];
    for (const quelle of QUELLEN) {
      const anfang = Date.now();
      let stand;
      try {
        const da = quelle.url.startsWith("file:")
          ? await dateiProbe(quelle.url)
          : await erreichbar(quelle.url);
        stand = da ? "erreichbar" : "nicht erreichbar";
      } catch (e) {
        stand = "Fehler: " + (e && e.message ? e.message : e);
      }
      const eintrag = { ...quelle, stand, dauer: Date.now() - anfang };
      ergebnisse.push(eintrag);
      if (beiErgebnis) beiErgebnis(eintrag);
    }
    return ergebnisse;
  }

  const quellen = () => QUELLEN.slice();

  return {
    bereit, fuehreAus, fuehreKarteAus, beobachte, zustand, istBereit,
    ladePakete, quellenPruefen, quellen,
  };
})();


/* ==== editor.js ==== */
/* Schreibfeld fuer Python mit Zeilennummern, Einrueckhilfe und
   farbiger Darstellung. Der Text liegt in einem durchsichtigen Feld
   ueber der eingefaerbten Fassung. */
const Editor = (() => {
  const PAARE = { "(": ")", "[": "]", "{": "}", '"': '"', "'": "'" };
  const ZU = new Set([")", "]", "}", '"', "'"]);

  function erstelle(einstellungen = {}) {
    const start = einstellungen.start != null ? einstellungen.start : "";
    const name = einstellungen.name || "loesung.py";

    const wurzel = W.el("div", { klasse: "editor-karte" });
    const feld = W.el("div", { klasse: "editor-feld" });
    const nummern = W.el("div", { klasse: "zeilen-nr", "aria-hidden": "true" });
    const innen = W.el("div", { klasse: "editor-innen" });
    const male = W.el("pre", { "aria-hidden": "true" });
    const male_code = W.el("code");
    male.append(male_code);
    const schreib = W.el("textarea", {
      spellcheck: "false", autocapitalize: "off", autocorrect: "off",
      autocomplete: "off", wrap: "off",
      "aria-label": einstellungen.beschriftung || "Python-Code schreiben",
      placeholder: einstellungen.platzhalter || "",
    });
    schreib.value = start;

    innen.append(male, schreib);
    feld.append(nummern, innen);
    wurzel.append(feld);

    function zeichne() {
      const text = schreib.value;
      male_code.innerHTML = Farbe.python(text) + "\n";
      const zeilen = text.split("\n").length;
      let n = "";
      for (let i = 1; i <= zeilen; i++) n += i + "\n";
      nummern.textContent = n;
      schreib.style.height = "auto";
      schreib.style.height = (schreib.scrollHeight + 2) + "px";
      male.scrollTop = schreib.scrollTop;
      male.scrollLeft = schreib.scrollLeft;
    }

    function ersetze(vorher, text, nachher) {
      schreib.value = vorher + text + nachher;
    }

    function setzeCursor(pos, bis) {
      schreib.selectionStart = pos;
      schreib.selectionEnd = bis == null ? pos : bis;
    }

    function einrueckungVon(zeile) {
      const m = /^[ \t]*/.exec(zeile);
      return m ? m[0] : "";
    }

    schreib.addEventListener("input", zeichne);
    schreib.addEventListener("scroll", () => {
      male.scrollTop = schreib.scrollTop;
      male.scrollLeft = schreib.scrollLeft;
    });

    schreib.addEventListener("keydown", (e) => {
      const s = schreib.selectionStart;
      const t = schreib.selectionEnd;
      const wert = schreib.value;

      if (e.key === "Tab") {
        e.preventDefault();
        if (s !== t) {
          const anfang = wert.lastIndexOf("\n", s - 1) + 1;
          const teil = wert.slice(anfang, t);
          const zeilen = teil.split("\n");
          const neu = e.shiftKey
            ? zeilen.map((z) => z.replace(/^ {1,4}/, ""))
            : zeilen.map((z) => "    " + z);
          const text = neu.join("\n");
          ersetze(wert.slice(0, anfang), text, wert.slice(t));
          setzeCursor(anfang, anfang + text.length);
        } else if (e.shiftKey) {
          const anfang = wert.lastIndexOf("\n", s - 1) + 1;
          const zeile = wert.slice(anfang, s);
          const weg = /^ {1,4}/.exec(zeile);
          if (weg) {
            ersetze(wert.slice(0, anfang), zeile.slice(weg[0].length), wert.slice(s));
            setzeCursor(s - weg[0].length);
          }
        } else {
          ersetze(wert.slice(0, s), "    ", wert.slice(t));
          setzeCursor(s + 4);
        }
        zeichne();
        return;
      }

      if (e.key === "Enter") {
        e.preventDefault();
        const anfang = wert.lastIndexOf("\n", s - 1) + 1;
        const zeile = wert.slice(anfang, s);
        let ein = einrueckungVon(zeile);
        if (/:\s*(#.*)?$/.test(zeile.trimEnd())) ein += "    ";
        if (/^\s*(return|pass|break|continue|raise)\b/.test(zeile) && ein.length >= 4) {
          ein = ein.slice(0, ein.length - 4);
        }
        const text = "\n" + ein;
        ersetze(wert.slice(0, s), text, wert.slice(t));
        setzeCursor(s + text.length);
        zeichne();
        return;
      }

      if (e.key === "Backspace" && s === t) {
        const davor = wert.slice(Math.max(0, s - 4), s);
        if (davor === "    " && /^[ ]*$/.test(wert.slice(wert.lastIndexOf("\n", s - 1) + 1, s))) {
          e.preventDefault();
          ersetze(wert.slice(0, s - 4), "", wert.slice(s));
          setzeCursor(s - 4);
          zeichne();
          return;
        }
        const paar = PAARE[wert[s - 1]];
        if (paar && wert[s] === paar) {
          e.preventDefault();
          ersetze(wert.slice(0, s - 1), "", wert.slice(s + 1));
          setzeCursor(s - 1);
          zeichne();
          return;
        }
      }

      if (PAARE[e.key] && !e.ctrlKey && !e.metaKey) {
        const danach = wert[t] || "";
        if (s === t && (danach === "" || /[\s)\]},:.]/.test(danach))) {
          e.preventDefault();
          ersetze(wert.slice(0, s), e.key + PAARE[e.key], wert.slice(t));
          setzeCursor(s + 1);
          zeichne();
          return;
        }
        if (s !== t) {
          e.preventDefault();
          const mitte = wert.slice(s, t);
          ersetze(wert.slice(0, s), e.key + mitte + PAARE[e.key], wert.slice(t));
          setzeCursor(s + 1, t + 1);
          zeichne();
          return;
        }
      }

      if (ZU.has(e.key) && wert[s] === e.key && s === t) {
        e.preventDefault();
        setzeCursor(s + 1);
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && einstellungen.beiStart) {
        e.preventDefault();
        einstellungen.beiStart();
      }
    });

    requestAnimationFrame(zeichne);
    zeichne();

    return {
      knoten: wurzel,
      name,
      wert: () => schreib.value,
      setze: (text) => { schreib.value = text; zeichne(); },
      fokus: () => schreib.focus(),
      zeichne,
      feld: schreib,
    };
  }

  return { erstelle };
})();


/* ==== quiz.js ==== */
/* Wissensfragen mit sofortiger Rueckmeldung. */
const Quiz = (() => {
  const BUCHSTABEN = ["A", "B", "C", "D", "E", "F"];

  function frageKnoten(frage, nr, beiAntwort) {
    const box = W.el("div", { klasse: "frage" });
    const kopf = W.el("div", { klasse: "frage-kopf" },
      W.el("span", { klasse: "frage-nr", text: String(nr) }),
      W.el("div", { klasse: "frage-text", html: Markup.inline(frage.f) })
    );
    box.append(kopf);

    if (frage.code) {
      box.append(W.el("pre", { klasse: "f-code", html: `<code>${Farbe.python(frage.code)}</code>` }));
    }

    const liste = W.el("div", { klasse: "opt-liste" });
    const knoepfe = frage.o.map((text, i) => {
      const k = W.el("button", { klasse: "opt", type: "button" },
        W.el("span", { klasse: "opt-marke", text: BUCHSTABEN[i] || String(i + 1) }),
        W.el("span", { klasse: "opt-text", html: Markup.inline(text) })
      );
      k.addEventListener("click", () => waehle(i));
      liste.append(k);
      return k;
    });
    box.append(liste);

    let beantwortet = false;

    function waehle(i) {
      if (beantwortet) return;
      beantwortet = true;
      const richtig = i === frage.r;
      box.classList.add("beantwortet", richtig ? "richtig" : "falsch");

      knoepfe.forEach((k, j) => {
        k.disabled = true;
        if (j === frage.r) {
          k.classList.add("ist-richtig");
          W.q(".opt-marke", k).innerHTML = W.ikon("check");
        } else if (j === i) {
          k.classList.add("ist-falsch", "wackelt");
          W.q(".opt-marke", k).innerHTML = W.ikon("kreuz");
        } else {
          k.classList.add("gedimmt");
        }
      });

      if (frage.e) {
        const erk = W.el("div", { klasse: "erklaerung", html:
          `<b>${richtig ? "Richtig." : "Nicht ganz."}</b> ${Markup.inline(frage.e)}` });
        erk.style.animation = "zeile-ein var(--t-mittel) var(--kurve) both";
        box.append(erk);
      }
      beiAntwort(richtig);
    }

    return { knoten: box, gibAuf: () => { if (!beantwortet) waehle(-1); } };
  }

  /* Baut einen kompletten Fragenblock. quelle ist die Kennung fuer den Speicher. */
  function baue(fragen, einstellungen = {}) {
    const wurzel = W.el("div", { klasse: "quiz-block" });
    if (einstellungen.titel !== false) {
      wurzel.append(W.el("div", { klasse: "abschnitt-kopf" },
        W.el("h2", { text: einstellungen.titel || "Verstaendnisfragen" }),
        W.el("span", { klasse: "abschnitt-strich" })
      ));
    }
    if (einstellungen.vorspann) {
      wurzel.append(W.el("p", { klasse: "klein", html: Markup.inline(einstellungen.vorspann),
        style: "margin-bottom:1rem" }));
    }

    let richtig = 0;
    let beantwortet = 0;
    const gesamt = fragen.length;

    const stand = W.el("span", { klasse: "quiz-stand" });
    const balken = W.el("div", { klasse: "balken", style: "flex:1;min-width:7rem" }, W.el("i"));
    const nochmal = W.el("button", { klasse: "taste taste-klein", type: "button",
      html: `${W.ikon("zurueck")}<span>Nochmal</span>` });

    function aktualisiere() {
      stand.innerHTML = `<b>${richtig}</b> von <b>${gesamt}</b> richtig`;
      const anteil = gesamt ? (beantwortet / gesamt) * 100 : 0;
      W.q("i", balken).style.width = anteil + "%";
      balken.classList.toggle("gruen", beantwortet === gesamt && richtig / Math.max(1, gesamt) >= 0.7);
      if (beantwortet === gesamt && einstellungen.beiEnde) einstellungen.beiEnde(richtig, gesamt);
    }

    const behaelter = W.el("div");
    function fuelle() {
      behaelter.innerHTML = "";
      richtig = 0; beantwortet = 0;
      fragen.forEach((f, i) => {
        const k = frageKnoten(f, i + 1, (war) => {
          beantwortet++;
          if (war) richtig++;
          aktualisiere();
          if (einstellungen.quelle) Speicher.setzeQuiz(einstellungen.quelle, richtig, gesamt);
        });
        behaelter.append(k.knoten);
      });
      aktualisiere();
    }

    nochmal.addEventListener("click", () => { fuelle(); });
    wurzel.append(behaelter);
    wurzel.append(W.el("div", { klasse: "quiz-fuss" }, stand, balken, nochmal));
    fuelle();

    return wurzel;
  }

  return { baue };
})();


/* ==== aufgabe.js ==== */
/* Programmieraufgabe mit Schreibfeld, Tipps und automatischer Pruefung. */
const Aufgabe = (() => {

  function testZeile(e) {
    return W.el("div", { klasse: "test-zeile " + (e.ok ? "ok" : "nein") },
      W.el("span", { klasse: "test-marke", html: W.ikon(e.ok ? "check" : "kreuz") }),

      W.el("div", { klasse: "auf-text", html: Markup.bloecke(aufgabe.text) })

    const koerper = W.el("div", { klasse: "auf-koerper" });

    const schreiber = Editor.erstelle({

      beschriftung: "Loesung fuer: " + aufgabe.titel,
      beiStart: () => pruefe(),
    });

    const leiste = W.el("div", { klasse: "editor-leiste" });
    const laufen = W.el("button", { klasse: "taste taste-klein", type: "button",
      html: `${W.ikon("play")}<span>Ausfuehren</span>` });
    const pruefen = W.el("button", { klasse: "taste taste-klein taste-voll", type: "button",
      html: `${W.ikon("check")}<span>Pruefen</span>` });
    const zurueck = W.el("button", { klasse: "ikontaste", type: "button",
      title: "Auf den Anfangszustand zuruecksetzen", "aria-label": "Zuruecksetzen",
      html: W.ikon("zurueck") });
    const zeigen = W.el("button", { klasse: "taste taste-klein taste-still", type: "button",
      html: `${W.ikon("schluessel")}<span>Loesung</span>` });
    leiste.append(pruefen, laufen, W.el("span", { klasse: "luecke" }),
      W.el("span", { klasse: "editor-stand", text: "Strg + Enter prueft" }), zurueck, zeigen);
    schreiber.knoten.append(leiste);

    const ausgabeBox = W.el("div", { klasse: "ausgabe" },
      W.el("div", { klasse: "innen" },
        W.el("div", { klasse: "a-kopf" }, W.el("span", { klasse: "punkt" }), "Ausgabe"),
        W.el("pre")
      )
    );
    schreiber.knoten.append(ausgabeBox);
    const ausgabeFeld = W.q("pre", ausgabeBox);

    koerper.append(schreiber.knoten);

    if (aufgabe.tipps && aufgabe.tipps.length) {
      const tippBox = W.el("div", { klasse: "tipp-block" });
      const schalter = W.el("button", { klasse: "tipp-schalter", type: "button",
        html: `${W.ikon("gluehbirne")}<span>Tipps anzeigen (${aufgabe.tipps.length})</span>${W.ikon("chevron-u", "pfeil")}` });
      const inhalt = W.el("div", { klasse: "tipp-inhalt" },
        W.el("div", {}, W.el("ol", { html: aufgabe.tipps.map((t) => `<li>${Markup.inline(t)}</li>`).join("") }))
      );
      schalter.addEventListener("click", () => tippBox.classList.toggle("offen"));
      tippBox.append(schalter, inhalt);
      koerper.append(tippBox);
    }

    const testBox = W.el("div", { klasse: "test-block", hidden: true });
    koerper.append(testBox);

    const loesungsPlatz = W.el("div");
    koerper.append(loesungsPlatz);

    wurzel.append(kopf, koerper);

    function setzeLaufend(an) {
      laufen.disabled = an;
      pruefen.disabled = an;
    }

    async function laufenLassen() {
      ausgabeBox.classList.add("sichtbar");
      ausgabeBox.classList.remove("hat-fehler");
      const anzeigeBeenden = W.laufAnzeige(ausgabeFeld);
      setzeLaufend(true);
      try {
        const e = await Laufzeit.fuehreAus(schreiber.wert(), {
          eingaben: aufgabe.eingaben || [], pakete: aufgabe.pakete || [],
        });
        if (e.fehler) {
          ausgabeBox.classList.add("hat-fehler");
          ausgabeFeld.textContent = (e.ausgabe ? e.ausgabe + "\n" : "") + e.fehler;
        } else if (!e.ausgabe.trim()) {
          ausgabeFeld.innerHTML = '<span class="leer">Kein Text ausgegeben.</span>';
        } else {
          ausgabeFeld.textContent = e.ausgabe;
        }
      } catch (e) {
        ausgabeBox.classList.add("hat-fehler");
        ausgabeFeld.textContent = String(e && e.message ? e.message : e);
      } finally {
        anzeigeBeenden();
        setzeLaufend(false);
      }
    }

    async function pruefe() {
      testBox.hidden = false;
      testBox.innerHTML = "";
      const kopf = W.el("div", { klasse: "test-kopf" }, W.el("span"));
      testBox.append(kopf);
      const anzeigeBeenden = W.laufAnzeige(W.q("span", kopf), "Pruefung laeuft");
      setzeLaufend(true);

      try {
        const e = await Laufzeit.fuehreAus(schreiber.wert(), {
          eingaben: aufgabe.eingaben || [],
          pakete: aufgabe.pakete || [],
          tests: aufgabe.tests || [],
        });

        ausgabeBox.classList.add("sichtbar");
        ausgabeBox.classList.toggle("hat-fehler", !!e.fehler);
        if (e.fehler) ausgabeFeld.textContent = (e.ausgabe ? e.ausgabe + "\n" : "") + e.fehler;
        else if (!e.ausgabe.trim()) ausgabeFeld.innerHTML = '<span class="leer">Kein Text ausgegeben.</span>';
        else ausgabeFeld.textContent = e.ausgabe;

        testBox.innerHTML = "";
        if (e.fehler) {
          testBox.append(W.el("div", { klasse: "test-kopf" },
            W.el("span", { html: W.ikon("warn"), style: "color:var(--rost);display:flex" }),
            W.el("span", { text: "Der Code laeuft noch nicht durch" })));
          testBox.append(W.el("div", { klasse: "test-zeile nein" },
            W.el("span", { klasse: "test-marke", html: W.ikon("kreuz") }),
            W.el("span", { klasse: "t-name" },
              W.el("span", { text: "Behebe zuerst den Fehler in der Ausgabe" }))));
          wurzel.classList.remove("geloest");
          return;
        }

        const treffer = e.tests.filter((t) => t.ok).length;
        const alle = e.tests.length;
        const bestanden = alle > 0 && treffer === alle;

        testBox.append(W.el("div", { klasse: "test-kopf" },
          W.el("span", { html: W.ikon(bestanden ? "check" : "warn"),
            style: `color:var(--${bestanden ? "moos" : "rost"});display:flex` }),
          W.el("span", { text: bestanden ? "Alle Pruefungen bestanden" : "Noch nicht ganz" }),
          W.el("span", { klasse: "zaehler", text: `${treffer} / ${alle}` })));

        const liste = W.el("div", { klasse: "test-liste" });
        e.tests.forEach((t, i) => {
          const z = testZeile(t);
          z.style.animationDelay = (i * 40) + "ms";
          liste.append(z);
        });
        testBox.append(liste);

        if (bestanden) {
          wurzel.classList.add("geloest");
          marke.className = "abzeichen gruen";
          marke.innerHTML = `${W.ikon("check")}<span>Geloest</span>`;
          if (!Speicher.aufgabeGeloest(lektionId, aufgabe.id)) {
            Speicher.setzeAufgabe(lektionId, aufgabe.id);
            W.melde("Aufgabe geloest", "check");
          }
        } else {
          wurzel.classList.remove("geloest");
        }
      } catch (err) {
        const text = String(err && err.message ? err.message : err);
        testBox.innerHTML = "";
        testBox.append(W.el("div", { klasse: "test-kopf" },
          W.el("span", { html: W.ikon("warn"), style: "color:var(--rost);display:flex" }),
          W.el("span", { text: "Pruefung nicht moeglich" })));
        testBox.append(W.el("div", { klasse: "test-zeile nein" },
          W.el("span", { klasse: "test-marke", html: W.ikon("kreuz") }),
          W.el("span", { klasse: "t-name", style: "white-space:pre-wrap" },
            W.el("span", { text }),
            text.includes("Interpreter")
              ? W.el("div", { style: "margin-top:.6rem" },
                  W.el("a", { klasse: "taste taste-klein", href: "#/technik",
                    html: `${W.ikon("werkzeug")}<span>Technikpruefung oeffnen</span>` }))
              : null)));
      } finally {
        anzeigeBeenden();
        setzeLaufend(false);
      }
    }

    laufen.addEventListener("click", laufenLassen);
    pruefen.addEventListener("click", pruefe);
    zurueck.addEventListener("click", () => {
      schreiber.setze(aufgabe.start || "");
      testBox.hidden = true;
      ausgabeBox.classList.remove("sichtbar");
      W.melde("Zuruckgesetzt", "zurueck");
    });
    zeigen.addEventListener("click", () => {
      if (loesungsPlatz.childElementCount) { loesungsPlatz.innerHTML = ""; zeigen.querySelector("span").textContent = "Loesung"; return; }
      loesungsPlatz.innerHTML = Markup.bloecke([
        { t: "code", x: aufgabe.loesung || "", name: "Ein moeglicher Weg", lauf: false },
        ...(aufgabe.loesungstext ? [{ t: "notiz", art: "tipp", titel: "Zur Loesung", x: aufgabe.loesungstext }] : []),
      ]);
      Markup.belebe(loesungsPlatz);
      zeigen.querySelector("span").textContent = "Ausblenden";
    });

    return wurzel;
  }

  return { baue };
})();


/* ==== suche.js ==== */
/* Volltextsuche ueber alle Lektionen. */
const Suche = (() => {
  const MAX = 8;

  function begriffe(text) {
    return text.toLowerCase().split(/\s+/).filter((t) => t.length >= 2);
  }

  function finde(anfrage) {
    const worte = begriffe(anfrage);
    if (!worte.length) return [];

    const treffer = [];
    for (const eintrag of Register.suchIndex) {
      let punkte = 0;
      const titel = eintrag.lektion.titel.toLowerCase();
      for (const wort of worte) {
        if (titel.includes(wort)) punkte += 12;
        const stellen = eintrag.text.split(wort).length - 1;
        if (stellen === 0) { punkte = -1; break; }
        punkte += Math.min(stellen, 6);
      }
      if (punkte > 0) treffer.push({ lektion: eintrag.lektion, eintrag, punkte });
    }

    treffer.sort((a, b) => b.punkte - a.punkte || a.lektion.nummer - b.lektion.nummer);
    return treffer.slice(0, MAX);
  }

  /* Sucht einen lesbaren Ausschnitt rund um die erste Fundstelle. */
  function ausschnitt(eintrag, worte) {
    const text = eintrag.roh;
    let stelle = -1;
    for (const wort of worte) {
      const i = text.toLowerCase().indexOf(wort);
      if (i !== -1 && (stelle === -1 || i < stelle)) stelle = i;
    }
    if (stelle === -1) return text.slice(0, 90) + " ...";

    let anfang = Math.max(0, stelle - 40);
    const luecke = text.lastIndexOf(" ", anfang + 10);
    if (luecke > 0 && luecke < stelle) anfang = luecke + 1;
    const ende = Math.min(text.length, stelle + 70);
    return (anfang > 0 ? "... " : "") + text.slice(anfang, ende).trim() + (ende < text.length ? " ..." : "");
  }

  function hervorheben(text, anfrage) {
    const worte = begriffe(anfrage);
    let aus = W.esc(text);
    for (const wort of worte) {
      const muster = new RegExp("(" + wort.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      aus = aus.replace(muster, "<mark>$1</mark>");
    }
    return aus;
  }

  function zeige(anfrage) {
    const box = W.q("#trefferListe");
    const baum = W.q("#navBaum");
    const schnell = W.q("#navSchnell");
    if (!box) return;

    if (!anfrage.trim()) {
      box.hidden = true;
      box.innerHTML = "";
      baum.hidden = false;
      schnell.hidden = false;
      return;
    }

    const treffer = finde(anfrage);
    baum.hidden = true;
    schnell.hidden = true;
    box.hidden = false;
    box.innerHTML = "";

    if (!treffer.length) {
      box.append(W.el("div", { klasse: "leer-hinweis",
        html: `Nichts gefunden zu <b>${W.esc(anfrage)}</b>` }));
      return;
    }

    const worte = begriffe(anfrage);
    treffer.forEach(({ lektion, eintrag }) => {
      const k = W.el("button", { klasse: "treffer", type: "button" },
        W.el("div", { klasse: "t-titel", html: hervorheben(lektion.titel, anfrage) }),
        W.el("div", { klasse: "t-weg", html: hervorheben(ausschnitt(eintrag, worte), anfrage) }),
        W.el("div", { klasse: "t-weg", style: "opacity:.75",
          text: `Modul ${lektion.modul.nr} - ${lektion.modul.titel}` })
      );
      k.addEventListener("click", () => {
        W.q("#sucheFeld").value = "";
        zeige("");
        location.hash = "#/lektion/" + lektion.id;
      });
      box.append(k);
    });
  }

  function start() {
    const feld = W.q("#sucheFeld");
    if (!feld) return;
    feld.addEventListener("input", W.bremse(() => zeige(feld.value), 130));
    feld.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { feld.value = ""; zeige(""); feld.blur(); }
      if (e.key === "Enter") {
        const erster = W.q(".treffer", W.q("#trefferListe"));
        if (erster) erster.click();
      }
    });
  }

  return { start, zeige, finde };
})();

def trainiere(X, y, lernrate=0.01, epochen=2000):
    """Lernt Steigung und Achsenabschnitt per Gradientenabstieg."""
    steigung = 0.0
    abschnitt = 0.0

/* ==== register.js ==== */
/* Baut aus den Moduldaten die Nachschlagestrukturen auf. */
const Register = (() => {
  const lektionen = [];
  const nachId = new Map();
  const modulNachId = new Map();

  KURS.module.forEach((m, mi) => {
    modulNachId.set(m.id, m);
    m.lektionen.forEach((l, li) => {
      l.modul = m;
      l.nummer = lektionen.length + 1;
      l.imModul = li + 1;
      lektionen.push(l);
      nachId.set(l.id, l);
    });
    m.index = mi;
  });

  lektionen.forEach((l, i) => {
    l.vorher = i > 0 ? lektionen[i - 1] : null;
    l.nachher = i < lektionen.length - 1 ? lektionen[i + 1] : null;
  });

  const gesamtDauer = lektionen.reduce((s, l) => s + (l.dauer || 0), 0);
  const anzahlFragen = lektionen.reduce((s, l) => s + (l.quiz || []).length, 0);
  const anzahlAufgaben = lektionen.reduce((s, l) => s + (l.aufgaben || []).length, 0);

  /* Fuer die Volltextsuche: je Lektion ein zusammengefasster Text. */
  const suchIndex = lektionen.map((l) => {
    const teile = [l.titel, l.vorspann, ...(l.ziele || [])];
    (l.inhalt || []).forEach((b) => {
      if (!b || typeof b !== "object") return;
      if (typeof b.x === "string") teile.push(b.x);
      else if (Array.isArray(b.x)) teile.push(b.x.join(" "));
      if (b.titel) teile.push(b.titel);
      if (b.kopf) teile.push(b.kopf.join(" "));
      if (b.zeilen) b.zeilen.forEach((z) => teile.push(z.join(" ")));
    });
    (l.aufgaben || []).forEach((a) => teile.push(a.titel));
    const roh = teile.filter(Boolean).join("  ").replace(/\s+/g, " ");
    return { lektion: l, roh, text: roh.toLowerCase() };
  });

  const modulDauer = (m) => m.lektionen.reduce((s, l) => s + (l.dauer || 0), 0);

  function modulFortschritt(m) {
    const fertig = m.lektionen.filter((l) => Speicher.lektionFertig(l)).length;
    return { fertig, gesamt: m.lektionen.length, anteil: fertig / m.lektionen.length };
  }

  function gesamtFortschritt() {
    const fertig = lektionen.filter((l) => Speicher.lektionFertig(l)).length;
    const summe = lektionen.reduce((s, l) => s + Speicher.lektionAnteil(l), 0);
    return {
      fertig,
      gesamt: lektionen.length,
      anteil: fertig / lektionen.length,
      feinAnteil: summe / lektionen.length,
    };
  }

  /* Alle Fragen eines Moduls oder des gesamten Kurses, gemischt. */
  function fragenSammeln(modul) {
    const quelle = modul ? modul.lektionen : lektionen;
    const alle = [];
    quelle.forEach((l) => (l.quiz || []).forEach((f) => alle.push({ ...f, herkunft: l })));
    return alle;
  }

  function mische(liste, anzahl) {
    const kopie = liste.slice();
    for (let i = kopie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [kopie[i], kopie[j]] = [kopie[j], kopie[i]];
    }
    return anzahl ? kopie.slice(0, anzahl) : kopie;
  }

  return {
    module: KURS.module, lektionen, nachId, modulNachId, suchIndex,
    gesamtDauer, anzahlFragen, anzahlAufgaben,
    modulDauer, modulFortschritt, gesamtFortschritt, fragenSammeln, mische,
  };
})();
