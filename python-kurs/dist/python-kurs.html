<!doctype html>
<html lang="de" data-thema="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Vollstaendiger Python-Kurs auf Deutsch: von den ersten Zeilen bis zu Python fuer kuenstliche Intelligenz. Mit lauffaehigen Beispielen, Tests und Pruefungen.">
<title>Python von Grund auf</title>
<style>
/* ==== reset.css ==== */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
img, svg, video { display: block; max-width: 100%; }
/* Grundmass fuer die Sinnbilder. Eigene Regeln je Baustein gehen vor. */
svg { width: 1em; height: 1em; flex: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; }
ul, ol { padding: 0; list-style: none; }
table { border-collapse: collapse; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--fokus); outline-offset: 3px; border-radius: 3px; }
:focus:not(:focus-visible) { outline: none; }
::selection { background: var(--auswahl); color: var(--text); }


/* ==== tokens.css ==== */
:root {
  color-scheme: light;

  --papier:        #f6f2ea;
  --papier-tief:   #ece6da;
  --flaeche:       #fffdf8;
  --flaeche-2:     #f1ebe0;
  --flaeche-3:     #e5ddce;
  --text:          #201c18;
  --text-2:        #4b443c;
  --text-3:        #7d7367;
  --linie:         #ddd3c2;
  --linie-stark:   #c7baa4;

  --kupfer:        #a94f24;
  --kupfer-hell:   #c46a3a;
  --kupfer-weich:  #f0dcce;
  --moos:          #3f6b45;
  --moos-weich:    #dfeadb;
  --tinte:         #2e4a63;
  --tinte-weich:   #dce7ef;
  --rost:          #9c3b2f;
  --rost-weich:    #f3dbd6;
  --gold:          #8a6a12;
  --gold-weich:    #f3e8c8;

  --akzent:        var(--kupfer);
  --akzent-weich:  var(--kupfer-weich);
  --fokus:         #a94f24;
  --auswahl:       #f0d9c6;

  --schatten-1: 0 1px 2px rgba(60, 45, 30, .05), 0 2px 6px rgba(60, 45, 30, .04);
  --schatten-2: 0 2px 4px rgba(60, 45, 30, .06), 0 8px 22px rgba(60, 45, 30, .07);
  --schatten-3: 0 6px 14px rgba(60, 45, 30, .09), 0 22px 48px rgba(60, 45, 30, .12);
  --ring: 0 0 0 1px var(--linie);

  --sy-schrift: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --se-schrift: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, ui-serif, serif;
  --mo-schrift: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --r-xs: 5px;
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 16px;
  --r-xl: 22px;
  --r-voll: 999px;

  --t-schnell: 140ms;
  --t-mittel: 260ms;
  --t-ruhig: 420ms;
  --kurve: cubic-bezier(.22, .68, .28, 1);
  --kurve-weich: cubic-bezier(.34, .9, .32, 1);
  --kurve-feder: cubic-bezier(.32, 1.34, .48, 1);

  --seite-max: 50rem;
  --nav-breite: 18.5rem;
  --kopf-hoehe: 3.75rem;

  --syn-schl:   #9c3b2f;
  --syn-fun:    #2e4a63;
  --syn-txt:    #3f6b45;
  --syn-zahl:   #8a5a12;
  --syn-kom:    #8d8073;
  --syn-eing:   #6a4a86;
  --syn-op:     #6e6257;
  --syn-selbst: #a94f24;
  --syn-dek:    #7a5a10;
}


@media (prefers-color-scheme: dark) {
  :root:not([data-thema="hell"]) {
    color-scheme: dark;

    --papier:        #131110;
    --papier-tief:   #0d0c0b;
    --flaeche:       #1b1917;
    --flaeche-2:     #24211e;
    --flaeche-3:     #2f2b27;
    --text:          #ece5da;
    --text-2:        #c2b9ac;
    --text-3:        #8e8478;
    --linie:         #332e29;
    --linie-stark:   #4a423a;

    --kupfer:        #e0894f;
    --kupfer-weich:  #3a2618;
    --moos:          #8ab883;
    --moos-weich:    #1d2a1c;
    --tinte:         #8fb4d2;
    --tinte-weich:   #17242e;
    --rost:          #e08072;
    --rost-weich:    #341c19;
    --gold:          #d8b56a;
    --gold-weich:    #302713;

    --akzent:        var(--kupfer);
    --akzent-weich:  var(--kupfer-weich);
    --fokus:         #e0894f;
    --auswahl:       #43301f;

    --schatten-1: 0 1px 2px rgba(0, 0, 0, .4);
    --schatten-2: 0 2px 6px rgba(0, 0, 0, .45), 0 10px 26px rgba(0, 0, 0, .35);
    --schatten-3: 0 8px 18px rgba(0, 0, 0, .5), 0 26px 56px rgba(0, 0, 0, .45);

    --syn-schl:   #e08072;
    --syn-fun:    #8fb4d2;
    --syn-txt:    #9ec596;
    --syn-zahl:   #d9ae6a;
    --syn-kom:    #7c7268;
    --syn-eing:   #bb9ede;
    --syn-op:     #a89c90;
    --syn-selbst: #e0894f;
    --syn-dek:    #d0b06a;
  }
}

:root[data-thema="dunkel"] {
  color-scheme: dark;

  --papier:        #131110;
  --papier-tief:   #0d0c0b;
  --flaeche:       #1b1917;
  --flaeche-2:     #24211e;
  --flaeche-3:     #2f2b27;
  --text:          #ece5da;
  --text-2:        #c2b9ac;
  --text-3:        #8e8478;
  --linie:         #332e29;
  --linie-stark:   #4a423a;

  --kupfer:        #e0894f;
  --kupfer-weich:  #3a2618;
  --moos:          #8ab883;
  --moos-weich:    #1d2a1c;
  --tinte:         #8fb4d2;
  --tinte-weich:   #17242e;
  --rost:          #e08072;
  --rost-weich:    #341c19;
  --gold:          #d8b56a;
  --gold-weich:    #302713;

  --akzent:        var(--kupfer);
  --akzent-weich:  var(--kupfer-weich);
  --fokus:         #e0894f;
  --auswahl:       #43301f;

  --schatten-1: 0 1px 2px rgba(0, 0, 0, .4);
  --schatten-2: 0 2px 6px rgba(0, 0, 0, .45), 0 10px 26px rgba(0, 0, 0, .35);
  --schatten-3: 0 8px 18px rgba(0, 0, 0, .5), 0 26px 56px rgba(0, 0, 0, .45);

  --syn-schl:   #e08072;
  --syn-fun:    #8fb4d2;
  --syn-txt:    #9ec596;
  --syn-zahl:   #d9ae6a;
  --syn-kom:    #7c7268;
  --syn-eing:   #bb9ede;
  --syn-op:     #a89c90;
  --syn-selbst: #e0894f;
  --syn-dek:    #d0b06a;
}


/* ==== basis.css ==== */
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  background: var(--papier);
  color: var(--text);
  font-family: var(--sy-schrift);
  font-size: 1rem;
  line-height: 1.65;
  min-height: 100dvh;
  overflow-wrap: break-word;
  transition: background-color var(--t-mittel) var(--kurve), color var(--t-mittel) var(--kurve);
}

h1, h2, h3, h4 {
  font-family: var(--se-schrift);
  font-weight: 600;
  line-height: 1.22;
  letter-spacing: -.012em;
  text-wrap: balance;
}

h1 { font-size: clamp(1.75rem, 1.35rem + 1.7vw, 2.6rem); }
h2 { font-size: clamp(1.35rem, 1.15rem + .85vw, 1.75rem); }
h3 { font-size: clamp(1.1rem, 1rem + .45vw, 1.3rem); }
h4 { font-size: 1.02rem; }

p { text-wrap: pretty; }

code, kbd, samp, pre { font-family: var(--mo-schrift); font-size: .89em; font-variant-ligatures: none; }

/* Unterstrichen wird nur im Fliesstext, nicht in Navigation und Karten. */
a { text-decoration: none; color: inherit; }
.text-block a, .auf-text a, .erklaerung a, .notiz a {
  color: var(--akzent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--akzent) 45%, transparent);
  text-underline-offset: .18em;
  transition: text-decoration-color var(--t-schnell) var(--kurve);
}
.text-block a:hover, .auf-text a:hover, .erklaerung a:hover, .notiz a:hover {
  text-decoration-color: var(--akzent);
}

hr { border: 0; height: 1px; background: var(--linie); margin: 2rem 0; }

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--linie-stark); border-radius: var(--r-voll); border: 3px solid var(--papier); }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

.nur-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

.sprung {
  position: fixed; top: .5rem; left: .5rem; z-index: 200;
  background: var(--flaeche); color: var(--text); padding: .6rem 1rem;
  border-radius: var(--r-s); box-shadow: var(--schatten-2);
  transform: translateY(-160%); transition: transform var(--t-schnell) var(--kurve);
}
.sprung:focus { transform: translateY(0); }


/* ==== layout.css ==== */
.huelle { position: relative; z-index: 1; min-height: 100dvh; }

/* ---------- Kopfzeile ---------- */
.kopf {
  position: sticky; top: 0; z-index: 60;
  height: var(--kopf-hoehe);
  display: flex; align-items: center; gap: .5rem;
  padding: 0 clamp(.7rem, 2vw, 1.4rem);
  background: color-mix(in srgb, var(--papier) 82%, transparent);
  backdrop-filter: saturate(1.5) blur(14px);
  -webkit-backdrop-filter: saturate(1.5) blur(14px);
  border-bottom: 1px solid var(--linie);
  transition: border-color var(--t-mittel) var(--kurve), background-color var(--t-mittel) var(--kurve);
}

.marke { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.marke-zeichen {
  width: 2rem; height: 2rem; flex: none;
  border-radius: 9px;
  background: var(--flaeche);
  border: 1px solid var(--linie-stark);
  display: grid; place-items: center;
  box-shadow: var(--schatten-1);
  transition: transform var(--t-mittel) var(--kurve-feder), border-color var(--t-mittel) var(--kurve);
}
.marke:hover .marke-zeichen { transform: rotate(-6deg) scale(1.06); border-color: var(--akzent); }
.marke-zeichen svg { width: 1.1rem; height: 1.1rem; }
.marke-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.marke-titel { font-family: var(--se-schrift); font-weight: 600; font-size: 1rem; letter-spacing: -.01em; }
.marke-unter { font-size: .68rem; color: var(--text-3); letter-spacing: .09em; text-transform: uppercase; }

.kopf-luecke { flex: 1; }
.kopf-werkzeuge { display: flex; align-items: center; gap: .35rem; }

.kopf-fortschritt {
  position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: transparent; overflow: hidden;
}
.kopf-fortschritt i {
  display: block; height: 100%; width: 0%;
  background: var(--akzent);
  transition: width var(--t-ruhig) var(--kurve-weich);
}

/* ---------- Gerüst ---------- */
.geruest {
  display: grid;
  grid-template-columns: var(--nav-breite) minmax(0, 1fr);
  align-items: start;
}

.seiten-nav {
  position: sticky; top: var(--kopf-hoehe);
  height: calc(100dvh - var(--kopf-hoehe));
  overflow-y: auto; overscroll-behavior: contain;
  border-right: 1px solid var(--linie);
  padding: 1rem .7rem 3rem;
  scrollbar-width: thin;
}

.buehne { min-width: 0; padding: 0 clamp(1rem, 4vw, 2.5rem) 6rem; }
.bahn { max-width: var(--seite-max); margin: 0 auto; }
.bahn-weit { max-width: 68rem; margin: 0 auto; }

/* ---------- Mobil ---------- */
.nav-schalter { display: none; }
.nav-schleier { display: none; }

@media (max-width: 60rem) {
  :root { --nav-breite: 17rem; }
  .geruest { grid-template-columns: minmax(0, 1fr); }
  .nav-schalter { display: grid; }
  .seiten-nav {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: min(var(--nav-breite), 84vw);
    height: 100dvh;
    z-index: 90;
    background: var(--flaeche);
    box-shadow: var(--schatten-3);
    padding-top: max(1rem, env(safe-area-inset-top));
    transform: translateX(-102%);
    visibility: hidden;
    transition: transform var(--t-mittel) var(--kurve), visibility 0s linear var(--t-mittel);
  }
  body.nav-offen .seiten-nav {
    transform: translateX(0);
    visibility: visible;
    transition: transform var(--t-mittel) var(--kurve-weich), visibility 0s;
  }
  .nav-schleier {
    display: block; position: fixed; inset: 0; z-index: 80;
    background: rgba(20, 15, 10, .42);
    backdrop-filter: blur(2px);
    opacity: 0; visibility: hidden;
    transition: opacity var(--t-mittel) var(--kurve), visibility 0s linear var(--t-mittel);
  }
  body.nav-offen .nav-schleier { opacity: 1; visibility: visible; transition: opacity var(--t-mittel) var(--kurve), visibility 0s; }
  body.nav-offen { overflow: hidden; }
  .buehne { padding-bottom: 7.5rem; }
}

/* ---------- Fußnavigation ---------- */
.lauf-nav {
  display: flex; gap: .6rem; align-items: stretch;
  margin-top: 3rem; padding-top: 1.5rem;
  border-top: 1px solid var(--linie);
}
.lauf-nav .lauf-taste { flex: 1 1 0; min-width: 0; }
@media (max-width: 34rem) { .lauf-nav { flex-direction: column-reverse; } }


/* ==== komponenten.css ==== */
/* ---------- Tasten ---------- */
.taste {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  padding: .55rem 1rem; border-radius: var(--r-s);
  font-size: .9rem; font-weight: 550; letter-spacing: -.005em;
  border: 1px solid var(--linie-stark);
  background: var(--flaeche); color: var(--text);
  box-shadow: var(--schatten-1);
  transition: background-color var(--t-schnell) var(--kurve), border-color var(--t-schnell) var(--kurve),
              transform var(--t-schnell) var(--kurve), box-shadow var(--t-schnell) var(--kurve), color var(--t-schnell) var(--kurve);
  -webkit-tap-highlight-color: transparent;
}
.taste:hover { border-color: var(--linie-stark); background: var(--flaeche-2); transform: translateY(-1px); box-shadow: var(--schatten-2); }
.taste:active { transform: translateY(0) scale(.985); box-shadow: var(--schatten-1); }
.taste[disabled] { opacity: .45; pointer-events: none; }
.taste svg { width: 1rem; height: 1rem; flex: none; }

.taste-voll { background: var(--akzent); border-color: var(--akzent); color: #fff; }
:root[data-thema="dunkel"] .taste-voll { color: #1a120c; }
@media (prefers-color-scheme: dark) { :root:not([data-thema="hell"]) .taste-voll { color: #1a120c; } }
.taste-voll:hover { background: color-mix(in srgb, var(--akzent) 88%, var(--text)); border-color: color-mix(in srgb, var(--akzent) 88%, var(--text)); }

.taste-still { border-color: transparent; background: transparent; box-shadow: none; color: var(--text-2); }
.taste-still:hover { background: var(--flaeche-2); box-shadow: none; transform: none; color: var(--text); }

.taste-klein { padding: .35rem .7rem; font-size: .8rem; border-radius: var(--r-xs); }
.taste-gross { padding: .75rem 1.4rem; font-size: .97rem; border-radius: var(--r-m); }

.ikontaste {
  width: 2.15rem; height: 2.15rem; flex: none;
  display: grid; place-items: center;
  border-radius: var(--r-s); color: var(--text-2);
  border: 1px solid transparent;
  transition: background-color var(--t-schnell) var(--kurve), color var(--t-schnell) var(--kurve),
              border-color var(--t-schnell) var(--kurve), transform var(--t-schnell) var(--kurve-feder);
  -webkit-tap-highlight-color: transparent;
}
.ikontaste:hover { background: var(--flaeche-2); color: var(--text); border-color: var(--linie); }
.ikontaste:active { transform: scale(.92); }
.ikontaste svg { width: 1.15rem; height: 1.15rem; }

/* ---------- Seitennavigation ---------- */
.nav-kopf { display: flex; align-items: center; justify-content: space-between; padding: .2rem .45rem 1rem; }
.nav-kopf .titel { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
@media (min-width: 60.01rem) { .nav-schliessen { display: none; } }

.nav-suche { position: relative; margin: 0 .3rem 1rem; }
.nav-suche input {
  width: 100%; padding: .5rem .7rem .5rem 2.05rem;
  border-radius: var(--r-s); border: 1px solid var(--linie);
  background: var(--flaeche); color: var(--text); font-size: .85rem;
  transition: border-color var(--t-schnell) var(--kurve), box-shadow var(--t-schnell) var(--kurve);
}
.nav-suche input::placeholder { color: var(--text-3); }
.nav-suche input:focus { outline: none; border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-weich); }
.nav-suche svg { position: absolute; left: .62rem; top: 50%; transform: translateY(-50%); width: .95rem; height: .95rem; color: var(--text-3); pointer-events: none; }

.nav-schnell { display: flex; flex-direction: column; gap: .12rem; margin: 0 .3rem 1rem; }

.modul-block { margin-bottom: .35rem; }
.modul-kopf {
  display: flex; align-items: center; gap: .55rem; width: 100%;
  padding: .5rem .55rem; border-radius: var(--r-s);
  text-align: left; color: var(--text-2);
  transition: background-color var(--t-schnell) var(--kurve), color var(--t-schnell) var(--kurve);
}
.modul-kopf:hover { background: var(--flaeche-2); color: var(--text); }
.modul-nr {
  width: 1.5rem; height: 1.5rem; flex: none; border-radius: var(--r-xs);
  display: grid; place-items: center;
  font-size: .7rem; font-weight: 650; font-variant-numeric: tabular-nums;
  background: var(--flaeche-2); color: var(--text-3);
  border: 1px solid var(--linie);
  transition: all var(--t-mittel) var(--kurve);
}
.modul-block.fertig .modul-nr { background: var(--moos-weich); color: var(--moos); border-color: color-mix(in srgb, var(--moos) 35%, transparent); }
.modul-block.aktiv .modul-nr { background: var(--akzent); color: var(--flaeche); border-color: var(--akzent); }
.modul-name { flex: 1; font-size: .85rem; font-weight: 550; line-height: 1.3; min-width: 0; }
.modul-pfeil { width: .85rem; height: .85rem; flex: none; color: var(--text-3); transition: transform var(--t-mittel) var(--kurve-weich); }
.modul-block.offen .modul-pfeil { transform: rotate(90deg); }

.modul-liste {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows var(--t-mittel) var(--kurve-weich);
}
.modul-block.offen .modul-liste { grid-template-rows: 1fr; }
.modul-liste > div { overflow: hidden; min-height: 0; }
.modul-liste ul { padding: .15rem 0 .4rem 1.4rem; border-left: 1px solid var(--linie); margin-left: 1.25rem; }

.lek-link {
  display: flex; align-items: center; gap: .5rem; width: 100%;
  padding: .36rem .5rem; border-radius: var(--r-xs);
  text-align: left; font-size: .83rem; color: var(--text-2); line-height: 1.35;
  transition: background-color var(--t-schnell) var(--kurve), color var(--t-schnell) var(--kurve), padding-left var(--t-schnell) var(--kurve);
}
.lek-link:hover { background: var(--flaeche-2); color: var(--text); padding-left: .72rem; }
.lek-link.aktiv { background: var(--akzent-weich); color: var(--akzent); font-weight: 600; }
.lek-link svg { width: .95rem; height: .95rem; flex: none; }
.lek-punkt { width: .46rem; height: .46rem; flex: none; border-radius: 50%; border: 1.5px solid var(--linie-stark); transition: all var(--t-mittel) var(--kurve-feder); }
.lek-link.fertig .lek-punkt { background: var(--moos); border-color: var(--moos); }
.lek-link.aktiv .lek-punkt { background: var(--akzent); border-color: var(--akzent); transform: scale(1.25); }
.lek-titel { flex: 1; min-width: 0; }

/* ---------- Karten ---------- */
.karte {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: var(--r-l);
  box-shadow: var(--schatten-1);
  transition: border-color var(--t-mittel) var(--kurve), box-shadow var(--t-mittel) var(--kurve),
              transform var(--t-mittel) var(--kurve), background-color var(--t-mittel) var(--kurve);
}
.karte-kissen { padding: clamp(1.1rem, 3vw, 1.7rem); }
a.karte:hover, button.karte:hover { border-color: var(--linie-stark); box-shadow: var(--schatten-2); transform: translateY(-2px); }

/* ---------- Marken / Abzeichen ---------- */
.abzeichen {
  display: inline-flex; align-items: center; gap: .35rem;
  padding: .18rem .55rem; border-radius: var(--r-voll);
  font-size: .7rem; font-weight: 600; letter-spacing: .015em;
  background: var(--flaeche-2); color: var(--text-3);
  border: 1px solid var(--linie);
  white-space: nowrap;
}
.abzeichen svg { width: .75rem; height: .75rem; }
.abzeichen.gruen { background: var(--moos-weich); color: var(--moos); border-color: color-mix(in srgb, var(--moos) 30%, transparent); }
.abzeichen.kupfer { background: var(--kupfer-weich); color: var(--kupfer); border-color: color-mix(in srgb, var(--kupfer) 30%, transparent); }
.abzeichen.tinte { background: var(--tinte-weich); color: var(--tinte); border-color: color-mix(in srgb, var(--tinte) 30%, transparent); }
.abzeichen.gold { background: var(--gold-weich); color: var(--gold); border-color: color-mix(in srgb, var(--gold) 30%, transparent); }
.abzeichen.rost { background: var(--rost-weich); color: var(--rost); border-color: color-mix(in srgb, var(--rost) 30%, transparent); }

/* ---------- Lektionstext ---------- */
.lek-kopf { margin-bottom: 2rem; padding-top: clamp(1.6rem, 4vw, 2.6rem); }
.lek-kopf .weg { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .7rem; }
.lek-kopf h1 { margin-bottom: .6rem; }
.lek-vorspann { font-size: 1.06rem; color: var(--text-2); line-height: 1.62; max-width: 44rem; }

.ziel-karte { margin: 1.6rem 0 2.2rem; padding: 1.1rem 1.3rem; border-radius: var(--r-m);
  background: var(--flaeche); border: 1px solid var(--linie); border-left: 3px solid var(--moos); }
.ziel-karte h2 { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--moos); font-family: var(--sy-schrift); font-weight: 650; margin-bottom: .6rem; }
.ziel-karte ul { display: grid; gap: .38rem; }
.ziel-karte li { position: relative; padding-left: 1.15rem; font-size: .92rem; color: var(--text-2); }
.ziel-karte li::before { content: ""; position: absolute; left: 0; top: .62em; width: .38rem; height: .38rem; border-radius: 50%; background: var(--moos); }

.text-block > * + * { margin-top: 1.15rem; }
.text-block p { color: var(--text-2); }
.text-block h2 { margin-top: 2.6rem; padding-top: .2rem; }
.text-block h3 { margin-top: 2rem; color: var(--text); }
.text-block h2 + p, .text-block h3 + p { margin-top: .7rem; }
.text-block strong { color: var(--text); font-weight: 650; }
.text-block em { font-style: italic; color: var(--text); }

.text-block :not(pre) > code {
  background: var(--flaeche-2); border: 1px solid var(--linie);
  padding: .08em .36em; border-radius: var(--r-xs);
  color: var(--kupfer); font-size: .86em; white-space: nowrap;
}

.liste-block { display: grid; gap: .55rem; }
.liste-block li { position: relative; padding-left: 1.45rem; color: var(--text-2); }
.liste-block li::before {
  content: ""; position: absolute; left: .28rem; top: .66em;
  width: .4rem; height: .4rem; border-radius: 1px; background: var(--akzent); transform: rotate(45deg);
}
ol.liste-block { counter-reset: p; }
ol.liste-block li::before {
  counter-increment: p; content: counter(p); background: none; transform: none;
  left: 0; top: 0; width: 1.05rem; text-align: right;
  font-size: .8rem; font-weight: 650; color: var(--akzent); font-variant-numeric: tabular-nums;
}

/* ---------- Notizboxen ---------- */
.notiz {
  border-radius: var(--r-m); padding: 1rem 1.15rem;
  background: var(--flaeche); border: 1px solid var(--linie);
  border-left: 3px solid var(--tinte);
  display: grid; gap: .3rem;
}
.notiz .n-kopf { display: flex; align-items: center; gap: .45rem; font-size: .74rem; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--tinte); }
.notiz .n-kopf svg { width: .95rem; height: .95rem; }
.notiz p { font-size: .93rem; color: var(--text-2); margin: 0 !important; }
.notiz.warnung { border-left-color: var(--rost); }
.notiz.warnung .n-kopf { color: var(--rost); }
.notiz.tipp { border-left-color: var(--moos); }
.notiz.tipp .n-kopf { color: var(--moos); }
.notiz.merke { border-left-color: var(--gold); }
.notiz.merke .n-kopf { color: var(--gold); }

/* ---------- Tabellen ---------- */
.tab-huelle { overflow-x: auto; border: 1px solid var(--linie); border-radius: var(--r-m); background: var(--flaeche); -webkit-overflow-scrolling: touch; }
.tab-huelle table { width: 100%; font-size: .88rem; min-width: 22rem; }
.tab-huelle th, .tab-huelle td { padding: .6rem .85rem; text-align: left; vertical-align: top; }
.tab-huelle thead th { background: var(--flaeche-2); font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); font-weight: 650; white-space: nowrap; }
.tab-huelle tbody tr { border-top: 1px solid var(--linie); }
.tab-huelle tbody tr:hover { background: var(--flaeche-2); }
.tab-huelle td { color: var(--text-2); }
.tab-huelle code { background: var(--flaeche-2); padding: .08em .34em; border-radius: var(--r-xs); color: var(--kupfer); font-size: .88em; }
.tab-huelle tbody tr:hover code { background: var(--flaeche-3); }

/* ---------- Quiz ---------- */
.quiz-block { margin-top: 3rem; }
.abschnitt-kopf { display: flex; align-items: center; gap: .7rem; margin-bottom: 1.2rem; }
.abschnitt-kopf h2 { margin: 0 !important; font-size: 1.3rem; }
.abschnitt-strich { flex: 1; height: 1px; background: var(--linie); }

.frage {
  border: 1px solid var(--linie); border-radius: var(--r-m);
  background: var(--flaeche); padding: 1.15rem 1.25rem; margin-bottom: .9rem;
  transition: border-color var(--t-mittel) var(--kurve), box-shadow var(--t-mittel) var(--kurve);
}
.frage.beantwortet.richtig { border-color: color-mix(in srgb, var(--moos) 45%, transparent); }
.frage.beantwortet.falsch { border-color: color-mix(in srgb, var(--rost) 45%, transparent); }
.frage-kopf { display: flex; gap: .7rem; margin-bottom: .95rem; }
.frage-nr {
  width: 1.55rem; height: 1.55rem; flex: none; border-radius: var(--r-xs);
  display: grid; place-items: center; font-size: .74rem; font-weight: 650;
  background: var(--flaeche-2); color: var(--text-3); border: 1px solid var(--linie);
  font-variant-numeric: tabular-nums;
}
.frage-text { font-weight: 550; color: var(--text); padding-top: .1rem; }
.frage-text code { background: var(--flaeche-2); padding: .08em .34em; border-radius: var(--r-xs); color: var(--kupfer); }
.frage pre.f-code {
  margin: .2rem 0 .95rem; padding: .7rem .9rem; border-radius: var(--r-s);
  background: var(--papier-tief); border: 1px solid var(--linie);
  overflow-x: auto; font-size: .82rem; line-height: 1.6;
}

.opt-liste { display: grid; gap: .45rem; }
.opt {
  display: flex; align-items: flex-start; gap: .65rem; width: 100%;
  padding: .62rem .8rem; border-radius: var(--r-s); text-align: left;
  border: 1px solid var(--linie); background: var(--flaeche);
  font-size: .91rem; color: var(--text-2); line-height: 1.5;
  transition: background-color var(--t-schnell) var(--kurve), border-color var(--t-schnell) var(--kurve),
              transform var(--t-schnell) var(--kurve), color var(--t-schnell) var(--kurve);
  -webkit-tap-highlight-color: transparent;
}
.opt:hover:not(:disabled) { border-color: var(--linie-stark); background: var(--flaeche-2); transform: translateX(2px); }
.opt:active:not(:disabled) { transform: translateX(2px) scale(.995); }
.opt-marke {
  width: 1.3rem; height: 1.3rem; flex: none; border-radius: var(--r-xs);
  border: 1px solid var(--linie-stark); display: grid; place-items: center;
  font-size: .7rem; font-weight: 650; color: var(--text-3); margin-top: .06rem;
  transition: all var(--t-mittel) var(--kurve-feder);
}
.opt-text { flex: 1; min-width: 0; }
.opt-text code { background: var(--flaeche-2); padding: .06em .3em; border-radius: 3px; color: var(--kupfer); font-size: .89em; }
.opt.ist-richtig { border-color: var(--moos); background: var(--moos-weich); color: var(--text); }
.opt.ist-richtig .opt-marke { background: var(--moos); border-color: var(--moos); color: var(--flaeche); }
.opt.ist-falsch { border-color: var(--rost); background: var(--rost-weich); color: var(--text); }
.opt.ist-falsch .opt-marke { background: var(--rost); border-color: var(--rost); color: var(--flaeche); }
.opt:disabled { cursor: default; opacity: 1; }
.opt.gedimmt { opacity: .5; }

.erklaerung {
  margin-top: .85rem; padding: .75rem .9rem; border-radius: var(--r-s);
  background: var(--flaeche-2); border: 1px solid var(--linie);
  font-size: .88rem; color: var(--text-2); line-height: 1.6;
}
.erklaerung code { background: var(--flaeche-3); padding: .06em .3em; border-radius: 3px; color: var(--kupfer); }
.erklaerung b { color: var(--text); }

.quiz-fuss {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  flex-wrap: wrap; margin-top: 1.1rem; padding: .85rem 1.1rem;
  border-radius: var(--r-m); background: var(--flaeche-2); border: 1px solid var(--linie);
}
.quiz-stand { font-size: .88rem; color: var(--text-2); }
.quiz-stand b { color: var(--text); font-variant-numeric: tabular-nums; }

/* ---------- Fortschrittsringe und Balken ---------- */
.balken { height: .4rem; border-radius: var(--r-voll); background: var(--flaeche-3); overflow: hidden; }
.balken i { display: block; height: 100%; width: 0; border-radius: var(--r-voll); background: var(--akzent);
  transition: width var(--t-ruhig) var(--kurve-weich), background-color var(--t-mittel) var(--kurve); }
.balken.gruen i { background: var(--moos); }

.ring { --wert: 0; width: 3.6rem; height: 3.6rem; flex: none; position: relative; display: grid; place-items: center; }
.ring::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--akzent) calc(var(--wert) * 1%), var(--flaeche-3) 0);
  transition: background var(--t-ruhig) var(--kurve-weich);
}
.ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--flaeche); }
.ring span { position: relative; z-index: 1; font-size: .8rem; font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------- Startseite ---------- */
.held { padding: clamp(2.2rem, 7vw, 4.5rem) 0 2.5rem; }
.held h1 { max-width: 24ch; }
.held-marke { display: inline-flex; align-items: center; gap: .5rem; margin-bottom: 1.4rem; }
.held h1 { max-width: 20ch; margin-bottom: 1rem; }
.held-text { font-size: clamp(1rem, .95rem + .3vw, 1.14rem); color: var(--text-2); max-width: 46ch; line-height: 1.6; }
.held-tasten { display: flex; gap: .7rem; flex-wrap: wrap; margin-top: 2rem; }

.kennzahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .8rem; margin-top: 3rem; }
.kennzahl { padding: 1rem 1.1rem; border-radius: var(--r-m); background: var(--flaeche); border: 1px solid var(--linie); }
.kennzahl .zahl { font-family: var(--se-schrift); font-size: 1.75rem; font-weight: 600; line-height: 1; color: var(--akzent); font-variant-numeric: tabular-nums; }
.kennzahl .bez { font-size: .78rem; color: var(--text-3); margin-top: .35rem; letter-spacing: .02em; }

.modul-gitter { display: grid; grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr)); gap: .9rem; }
.modul-karte { display: flex; flex-direction: column; gap: .6rem; padding: 1.15rem 1.25rem; text-align: left; height: 100%; }
.modul-karte .kopfzeile { display: flex; align-items: center; justify-content: space-between; gap: .7rem; }
.modul-karte h3 { font-size: 1.02rem; line-height: 1.3; }
.modul-karte p { font-size: .87rem; color: var(--text-3); line-height: 1.55; flex: 1; }
.modul-karte .fuss { display: flex; align-items: center; gap: .6rem; font-size: .76rem; color: var(--text-3); }
.modul-karte .fuss .balken { flex: 1; }

/* ---------- Leiste / Werkzeugzeile ---------- */
.werkleiste { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
.zeile { display: flex; align-items: center; gap: .6rem; }
.zeile-weit { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.stapel { display: grid; gap: 1rem; }
.klein { font-size: .84rem; color: var(--text-3); }
.mittig { text-align: center; }

/* ---------- Meldung / Toast ---------- */
.melder { position: fixed; left: 50%; bottom: 1.4rem; z-index: 150; transform: translateX(-50%); display: grid; gap: .5rem; width: min(26rem, calc(100vw - 2rem)); pointer-events: none; }
.melde {
  display: flex; align-items: center; gap: .6rem;
  padding: .7rem 1rem; border-radius: var(--r-m);
  background: var(--flaeche); border: 1px solid var(--linie-stark);
  box-shadow: var(--schatten-3); font-size: .88rem; color: var(--text);
  animation: melde-ein var(--t-mittel) var(--kurve-feder) both;
}
.melde svg { width: 1.05rem; height: 1.05rem; flex: none; color: var(--akzent); }
.melde.weg { animation: melde-aus var(--t-mittel) var(--kurve) both; }

/* ---------- Suchergebnisse ---------- */
.treffer-liste { display: grid; gap: .3rem; margin: 0 .3rem 1rem; }
.treffer {
  display: block; width: 100%; text-align: left; padding: .5rem .6rem;
  border-radius: var(--r-s); border: 1px solid transparent;
  transition: background-color var(--t-schnell) var(--kurve), border-color var(--t-schnell) var(--kurve);
}
.treffer:hover { background: var(--flaeche-2); border-color: var(--linie); }
.treffer .t-titel { font-size: .84rem; font-weight: 550; color: var(--text); line-height: 1.35; }
.treffer .t-weg { font-size: .72rem; color: var(--text-3); margin-top: .1rem; }
.treffer mark { background: var(--akzent-weich); color: var(--akzent); border-radius: 3px; padding: 0 .12em; }
.leer-hinweis { padding: 1.5rem .8rem; text-align: center; font-size: .84rem; color: var(--text-3); }


/* ==== editor.css ==== */
/* ---------- Code-Anzeige ---------- */
.code-karte {
  border: 1px solid var(--linie); border-radius: var(--r-m);
  background: var(--papier-tief); overflow: hidden;
  transition: border-color var(--t-mittel) var(--kurve), box-shadow var(--t-mittel) var(--kurve);
}
.code-karte:hover { border-color: var(--linie-stark); }
.code-leiste {
  display: flex; align-items: center; gap: .5rem;
  padding: .4rem .5rem .4rem .85rem;
  background: var(--flaeche-2); border-bottom: 1px solid var(--linie);
  min-height: 2.4rem;
}
.code-name { font-size: .74rem; color: var(--text-3); font-family: var(--mo-schrift); letter-spacing: .01em; }
.code-leiste .luecke { flex: 1; }
.code-leiste .ikontaste { width: 1.85rem; height: 1.85rem; }
.code-leiste .ikontaste svg { width: 1rem; height: 1rem; }

pre.code {
  margin: 0; padding: .9rem 1rem; overflow-x: auto;
  font-size: .845rem; line-height: 1.68; tab-size: 4;
  -webkit-overflow-scrolling: touch;
}
pre.code code { font-size: inherit; background: none; border: 0; padding: 0; white-space: pre; }

/* Syntaxfarben */
.s-schl { color: var(--syn-schl); font-weight: 600; }
.s-fun  { color: var(--syn-fun); }
.s-txt  { color: var(--syn-txt); }
.s-zahl { color: var(--syn-zahl); }
.s-kom  { color: var(--syn-kom); font-style: italic; }
.s-eing { color: var(--syn-eing); }
.s-op   { color: var(--syn-op); }
.s-selbst { color: var(--syn-selbst); font-style: italic; }
.s-dek  { color: var(--syn-dek); }

/* ---------- Ausgabe / Konsole ---------- */
.ausgabe {
  border-top: 1px solid var(--linie);
  background: var(--flaeche);
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows var(--t-mittel) var(--kurve-weich);
}
.ausgabe.sichtbar { grid-template-rows: 1fr; }
.ausgabe > .innen { overflow: hidden; min-height: 0; }
.ausgabe .a-kopf {
  display: flex; align-items: center; gap: .45rem;
  padding: .5rem .85rem .25rem;
  font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); font-weight: 650;
}
.ausgabe .a-kopf .punkt { width: .42rem; height: .42rem; border-radius: 50%; background: var(--moos); }
.ausgabe.hat-fehler .a-kopf .punkt { background: var(--rost); }
.ausgabe pre {
  margin: 0; padding: .25rem .95rem .85rem; overflow-x: auto;
  font-size: .82rem; line-height: 1.62; color: var(--text-2); white-space: pre-wrap; word-break: break-word;
}
.ausgabe.hat-fehler pre { color: var(--rost); }
.ausgabe .leer { color: var(--text-3); font-style: italic; }

/* ---------- Editor ---------- */
.editor-karte { border: 1px solid var(--linie); border-radius: var(--r-m); background: var(--papier-tief); overflow: hidden; }
.editor-karte:focus-within { border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-weich); }

.editor-feld { position: relative; display: grid; grid-template-columns: auto 1fr; background: var(--papier-tief); }
.zeilen-nr {
  padding: .9rem .55rem .9rem .8rem; text-align: right; user-select: none;
  white-space: pre;
  font-family: var(--mo-schrift); font-size: .845rem; line-height: 1.68;
  color: var(--text-3); opacity: .55; border-right: 1px solid var(--linie);
  font-variant-numeric: tabular-nums; background: var(--flaeche-2);
}
.editor-innen { position: relative; min-width: 0; }
.editor-innen pre, .editor-innen textarea {
  margin: 0; padding: .9rem 1rem;
  font-family: var(--mo-schrift); font-size: .845rem; line-height: 1.68;
  tab-size: 4; white-space: pre; word-wrap: normal; border: 0; letter-spacing: 0;
}
.editor-innen pre {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  color: var(--text);
}
.editor-innen textarea {
  position: relative; display: block; width: 100%; min-height: 5.5rem;
  background: transparent; color: transparent; caret-color: var(--akzent);
  resize: none; outline: none;
  overflow-x: auto; overflow-y: hidden;
  -webkit-text-fill-color: transparent;
}
.editor-innen textarea::selection { background: var(--auswahl); -webkit-text-fill-color: var(--text); }
.editor-innen textarea::placeholder { color: var(--text-3); -webkit-text-fill-color: var(--text-3); }
.editor-innen textarea::-webkit-scrollbar { height: 7px; }
.editor-innen textarea::-webkit-scrollbar-thumb { border-width: 2px; }

.editor-leiste {
  display: flex; align-items: center; gap: .45rem; flex-wrap: wrap;
  padding: .5rem .6rem; border-top: 1px solid var(--linie); background: var(--flaeche-2);
}
.editor-leiste .luecke { flex: 1; }
.editor-stand { font-size: .74rem; color: var(--text-3); font-family: var(--mo-schrift); }

/* ---------- Aufgabe ---------- */
.aufgabe { margin-top: 1.2rem; border: 1px solid var(--linie); border-radius: var(--r-l); background: var(--flaeche); overflow: hidden;
  transition: border-color var(--t-mittel) var(--kurve); }
.aufgabe.geloest { border-color: color-mix(in srgb, var(--moos) 50%, transparent); }
.auf-kopf { padding: 1.1rem 1.25rem .9rem; border-bottom: 1px solid var(--linie); }
.auf-kopf .zeile-weit { margin-bottom: .5rem; }
.auf-kopf h3 { font-size: 1.02rem; }
.auf-text { font-size: .92rem; color: var(--text-2); line-height: 1.62; }
.auf-text > * + * { margin-top: .6rem; }
.auf-text code { background: var(--flaeche-2); border: 1px solid var(--linie); padding: .08em .34em; border-radius: var(--r-xs); color: var(--kupfer); font-size: .86em; }
.auf-text ul { display: grid; gap: .3rem; margin-top: .5rem; }
.auf-text li { position: relative; padding-left: 1.1rem; }
.auf-text li::before { content: ""; position: absolute; left: .18rem; top: .62em; width: .34rem; height: .34rem; background: var(--akzent); transform: rotate(45deg); }
.auf-koerper { padding: 1rem 1.25rem 1.25rem; display: grid; gap: .9rem; }

.tipp-block { border: 1px solid var(--linie); border-radius: var(--r-s); background: var(--flaeche-2); overflow: hidden; }
.tipp-schalter { display: flex; align-items: center; gap: .5rem; width: 100%; padding: .55rem .8rem; font-size: .83rem; color: var(--text-2); text-align: left; transition: background-color var(--t-schnell) var(--kurve); }
.tipp-schalter:hover { background: var(--flaeche-3); color: var(--text); }
.tipp-schalter svg { width: .95rem; height: .95rem; color: var(--gold); flex: none; }
.tipp-schalter .pfeil { width: .8rem; height: .8rem; margin-left: auto; color: var(--text-3); transition: transform var(--t-mittel) var(--kurve-weich); }
.tipp-block.offen .tipp-schalter .pfeil { transform: rotate(180deg); }
.tipp-inhalt { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-mittel) var(--kurve-weich); }
.tipp-block.offen .tipp-inhalt { grid-template-rows: 1fr; }
.tipp-inhalt > div { overflow: hidden; min-height: 0; }
.tipp-inhalt ol { padding: 0 .9rem .8rem 2rem; display: grid; gap: .4rem; counter-reset: t; }
.tipp-inhalt li { position: relative; font-size: .86rem; color: var(--text-2); line-height: 1.55; }
.tipp-inhalt li::before { counter-increment: t; content: counter(t) "."; position: absolute; left: -1.25rem; color: var(--gold); font-weight: 650; font-size: .8rem; }
.tipp-inhalt code { background: var(--flaeche-3); padding: .06em .3em; border-radius: 3px; color: var(--kupfer); }

/* ---------- Testergebnisse ---------- */
.test-block { border: 1px solid var(--linie); border-radius: var(--r-s); overflow: hidden; background: var(--flaeche-2); }
.test-kopf { display: flex; align-items: center; gap: .55rem; padding: .6rem .85rem; font-size: .8rem; font-weight: 600; color: var(--text-2); border-bottom: 1px solid var(--linie); }
.test-kopf .zaehler { margin-left: auto; font-variant-numeric: tabular-nums; font-size: .78rem; color: var(--text-3); font-weight: 550; }
.test-liste { display: grid; }
.test-zeile {
  display: flex; align-items: flex-start; gap: .6rem;
  padding: .5rem .85rem; font-size: .84rem; color: var(--text-2);
  border-top: 1px solid var(--linie);
  animation: zeile-ein var(--t-mittel) var(--kurve) both;
}
.test-zeile:first-child { border-top: 0; }
.test-marke { width: 1.05rem; height: 1.05rem; flex: none; border-radius: 50%; display: grid; place-items: center; margin-top: .18rem; }
.test-marke svg { width: .7rem; height: .7rem; }
.test-zeile.ok .test-marke { background: var(--moos-weich); color: var(--moos); }
.test-zeile.nein .test-marke { background: var(--rost-weich); color: var(--rost); }
.test-zeile .t-name { flex: 1; min-width: 0; }
.test-zeile .t-grund { display: block; margin-top: .2rem; font-family: var(--mo-schrift); font-size: .76rem; color: var(--rost); white-space: pre-wrap; word-break: break-word; }

.laeuft { display: inline-flex; align-items: center; gap: .5rem; font-size: .82rem; color: var(--text-3); }
.laeuft-uhr { font-variant-numeric: tabular-nums; opacity: .7; }
.spinner { width: .9rem; height: .9rem; border-radius: 50%; border: 2px solid var(--linie-stark); border-top-color: var(--akzent); animation: dreh .7s linear infinite; }

/* ---------- Spielplatz ---------- */
.spielplatz { display: grid; gap: 1rem; }
@media (min-width: 68rem) { .spielplatz.geteilt { grid-template-columns: 1fr 1fr; align-items: start; } }


/* ==== animationen.css ==== */
@keyframes seite-ein {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
@keyframes zeile-ein {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: none; }
}
@keyframes melde-ein {
  from { opacity: 0; transform: translateY(14px) scale(.96); }
  to   { opacity: 1; transform: none; }
}
@keyframes melde-aus {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: translateY(10px) scale(.97); }
}
@keyframes dreh { to { transform: rotate(360deg); } }
@keyframes puls-weich {
  0%, 100% { opacity: 1; }
  50% { opacity: .45; }
}
@keyframes wackel {
  0%, 100% { transform: translateX(0); }
  22% { transform: translateX(-5px); }
  44% { transform: translateX(4px); }
  66% { transform: translateX(-2px); }
}
@keyframes haken-ein {
  from { transform: scale(.4); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
@keyframes steig {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: none; }
}

.seite-ein { animation: seite-ein var(--t-mittel) var(--kurve-weich) both; }
.wackelt { animation: wackel 420ms var(--kurve) both; }
.pulst { animation: puls-weich 1.4s ease-in-out infinite; }

.stufen > * { animation: steig var(--t-ruhig) var(--kurve-weich) both; }
.stufen > *:nth-child(1) { animation-delay: 0ms; }
.stufen > *:nth-child(2) { animation-delay: 45ms; }
.stufen > *:nth-child(3) { animation-delay: 90ms; }
.stufen > *:nth-child(4) { animation-delay: 135ms; }
.stufen > *:nth-child(5) { animation-delay: 180ms; }
.stufen > *:nth-child(6) { animation-delay: 225ms; }
.stufen > *:nth-child(7) { animation-delay: 270ms; }
.stufen > *:nth-child(8) { animation-delay: 315ms; }
.stufen > *:nth-child(n+9) { animation-delay: 360ms; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}


/* ==== druck.css ==== */
@media print {
  body::before, .kopf, .seiten-nav, .nav-schleier, .lauf-nav, .melder, .editor-leiste, .code-leiste { display: none !important; }
  .geruest { grid-template-columns: 1fr; }
  .buehne { padding: 0; }
  body { background: #fff; color: #000; }
  .karte, .notiz, .code-karte, .frage { break-inside: avoid; border-color: #bbb; }
  pre.code { white-space: pre-wrap; }
}
