<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Noctule</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
.t{position:fixed;font:13px/1.8 "Courier New",monospace;letter-spacing:.12em;color:#cdbf9f;pointer-events:none}
#hud{left:16px;top:12px;color:#76695a;white-space:pre}
#ui{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px}
h1{font:italic 400 clamp(38px,10vw,80px) Georgia,serif;letter-spacing:.35em;margin:0 0 .4em .35em;color:#f0e2c2}
p{margin:.15em 0}.dim{opacity:.45}
.go{margin-top:1.8em;color:#ffb347;animation:k 1.2s steps(2) infinite}
@keyframes k{50%{opacity:.2}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="t"></div>
<div id="ui" class="t"></div>
<script>
// NOCTULE: a bat in a pitch black cave. Sonar paints the walls for a moment,
// but every ping also tells the owls where you were.
const C = document.getElementById('c'), X = C.getContext('2d'), hud = document.getElementById('hud'), ui = document.getElementById('ui');
const TAU = Math.PI * 2, N = 360, SPD = 480, RANGE = 330, FADE = 1.5, VMAX = 170, R = Math.random, hyp = Math.hypot, COS = [], SIN = [];
for (let i = 0; i < N; i++) { COS[i] = Math.cos(i / N * TAU); SIN[i] = Math.sin(i / N * TAU); }
let W, H, D, S, OX, OY, segs, bat, owls, moths, pings, ghosts, score, state = 'title', t = 0, dead = 0, amb = 0, hb = 0, beat = -9, dn = 999, ac, best = 0;
try { best = +localStorage.noctule || 0; } catch (e) {}

function fit() {
  D = devicePixelRatio || 1; C.width = innerWidth * D; C.height = innerHeight * D;
  S = Math.min(C.width / W, C.height / H); OX = (C.width - W * S) / 2; OY = (C.height - H * S) / 2;
}
addEventListener('resize', fit);

/* cave: every wall is a segment [x1, y1, x2, y2] */
function blob(x, y, rx, ry, n, amp, e) {
  const p = [], a1 = R() * 9, a2 = R() * 9, a3 = R() * 9;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, c = Math.cos(a), s = Math.sin(a),
      f = (1 + amp * (.5 * Math.sin(3 * a + a1) + .3 * Math.sin(5 * a + a2) + .2 * Math.sin(9 * a + a3))) * (1 + (R() - .5) * amp * .5);
    p.push([x + Math.sign(c) * Math.abs(c) ** e * rx * f, y + Math.sign(s) * Math.abs(s) ** e * ry * f]);
  }
  p.forEach((a, i) => { const b = p[(i + 1) % n]; segs.push([a[0], a[1], b[0], b[1]]); });
}
function cave() {
  segs = [];
  blob(W / 2, H / 2, W * .46, H * .44, 80, .1, .55);
  for (let k = 0, n = 0; k < 400 && n < 6; k++) {
    const rx = 18 + R() * 30, ry = rx * (.6 + R() * .8), r = Math.max(rx, ry), x = R() * W, y = R() * H;
    if (hyp(x - W / 2, y - H / 2) > r + 90 && inside(x, y) && near(x, y)[0] > r * 1.4 + 46) { blob(x, y, rx, ry, 14, .35, 1); n++; }
  }
}
function inside(x, y) { // open air = odd number of walls crossed heading right
  let c = 0;
  for (const s of segs) if ((s[1] > y) != (s[3] > y) && x < (s[2] - s[0]) * (y - s[1]) / (s[3] - s[1]) + s[0]) c ^= 1;
  return c;
}
function near(x, y) { // distance to the closest wall and the normal pointing away from it
  let bd = 1e9, nx = 0, ny = 0;
  for (const s of segs) {
    const ex = s[2] - s[0], ey = s[3] - s[1], u = Math.max(0, Math.min(1, ((x - s[0]) * ex + (y - s[1]) * ey) / (ex * ex + ey * ey))),
      px = x - s[0] - ex * u, py = y - s[1] - ey * u, d = hyp(px, py) || 1e-6;
    if (d < bd) { bd = d; nx = px / d; ny = py / d; }
  }
  return [bd, nx, ny];
}
function cast(x, y, dx, dy, max) {
  for (const s of segs) {
    const ex = s[2] - s[0], ey = s[3] - s[1], den = dx * ey - dy * ex;
    if (!den) continue;
    const qx = s[0] - x, qy = s[1] - y, k = (qx * ey - qy * ex) / den, u = (qx * dy - qy * dx) / den;
    if (k > 0 && k < max && u >= 0 && u <= 1) max = k;
  }
  return max;
}
function free(m) {
  for (let k = 0; k < 3000; k++) {
    const x = R() * W, y = R() * H;
    if (inside(x, y) && near(x, y)[0] > 24 && hyp(x - bat.x, y - bat.y) > m) return [x, y];
  }
  return [W / 2, H / 2];
}

function init() {
  [W, H] = innerHeight > innerWidth ? [600, 960] : [960, 600]; fit();
  cave(); pings = []; ghosts = []; owls = []; moths = []; score = 0;
  bat = { x: W / 2, y: H / 2, vx: 0, vy: 0, h: -Math.PI / 2, cd: 0, stun: 0 };
  addOwl(); for (let i = 0; i < 3; i++) addMoth();
}
function addOwl() {
  const [x, y] = free(320), o = { o: 1, x, y, vx: 0, vy: 0, tx: x, ty: y, m: 0, lt: 0, wt: 0, cool: 0, eye: 0, blink: 1 + R() * 5 };
  owls.push(o); return o;
}
function addMoth() { const [x, y] = free(120); moths.push({ x, y, vx: 0, vy: 0, a: R() * TAU }); }

function ping(x, y, r, loud) {
  const h = new Float32Array(N);
  for (let i = 0; i < N; i++) h[i] = cast(x, y, COS[i], SIN[i], r);
  pings.push({ x, y, r, h, loud, t0: t, done: new Set() });
}
function hear(e, x, y, d) {
  if (e.o) {
    if (d > 560 || e.m == 2) return;
    if (!e.m) hoot(e, d);
    const err = d * .15;
    Object.assign(e, { m: 1, lt: 4, eye: .5, tx: x + (R() - .5) * 2 * err, ty: y + (R() - .5) * 2 * err });
  } else if (d < 90) { // moths dodge sonar, like the real ones
    const a = Math.atan2(e.y - y, e.x - x) + (R() - .5) * 1.6;
    e.vx = Math.cos(a) * 110; e.vy = Math.sin(a) * 110;
  }
}
function waves() { // the wavefront reveals (and alerts) whatever it washes over
  for (const p of pings) {
    const r = (t - p.t0) * SPD;
    for (const e of owls.concat(moths)) {
      if (p.done.has(e)) continue;
      const d = hyp(e.x - p.x, e.y - p.y);
      if (d > r) continue;
      p.done.add(e);
      const i = (Math.round(Math.atan2(e.y - p.y, e.x - p.x) / TAU * N) + N) % N;
      if (d < p.r && p.h[i] > d - 8) ghosts.push({ x: e.x, y: e.y, t, k: e.o ? 1 : 0 });
      if (p.loud && state == 'play') hear(e, p.x, p.y, d);
    }
  }
  pings = pings.filter(p => t - p.t0 < p.r / SPD + FADE);
  ghosts = ghosts.filter(g => t - g.t < FADE);
}

function move(e, dt, rad) { // integrate, shove out of walls, return impact speed
  e.x += e.vx * dt; e.y += e.vy * dt;
  const [d, nx, ny] = near(e.x, e.y), vn = e.vx * nx + e.vy * ny;
  if (d >= rad) return 0;
  e.x += nx * (rad - d); e.y += ny * (rad - d);
  if (vn < 0) { e.vx -= nx * vn * 1.6; e.vy -= ny * vn * 1.6; }
  return -vn;
}
function steer(e, tx, ty, sp, k, dt, rad) {
  const L = hyp(tx - e.x, ty - e.y) || 1, [d, nx, ny] = near(e.x, e.y), push = Math.max(0, 40 - d) * 7, f = Math.min(1, dt * k);
  e.vx += ((tx - e.x) / L * sp + nx * push - e.vx) * f;
  e.vy += ((ty - e.y) / L * sp + ny * push - e.vy) * f;
  move(e, dt, rad);
}
function update(dt) {
  const kx = (keys.KeyD || keys.ArrowRight || 0) - (keys.KeyA || keys.ArrowLeft || 0),
    ky = (keys.KeyS || keys.ArrowDown || 0) - (keys.KeyW || keys.ArrowUp || 0);
  let dx = 0, dy = 0;
  if (kx || ky) { tgt = null; dx = kx * VMAX / hyp(kx, ky); dy = ky * VMAX / hyp(kx, ky); }
  else if (joy) { dx = joy[0] * VMAX; dy = joy[1] * VMAX; }
  else if (tgt) { const ex = tgt[0] - bat.x, ey = tgt[1] - bat.y, L = hyp(ex, ey) || 1, v = Math.min(VMAX, L * 3) / L; dx = ex * v; dy = ey * v; }
  if (bat.stun > 0) { bat.stun -= dt; dx = dy = 0; }
  bat.vx += (dx - bat.vx) * Math.min(1, dt * 6); bat.vy += (dy - bat.vy) * Math.min(1, dt * 6);
  if (move(bat, dt, 6) > 70 && bat.stun <= 0) { bat.stun = .4; thud(); ping(bat.x, bat.y, 70, true); } // crashing is loud
  if (hyp(bat.vx, bat.vy) > 8) bat.h = Math.atan2(bat.vy, bat.vx);
  bat.cd -= dt;

  for (const m of moths.slice()) {
    m.a += (R() - .5) * 20 * dt;
    steer(m, m.x + Math.cos(m.a) * 50, m.y + Math.sin(m.a) * 50, 40, 2, dt, 6);
    if (hyp(m.x - bat.x, m.y - bat.y) < 14) eat(m);
  }

  dn = 999;
  for (const o of owls) {
    const db = hyp(bat.x - o.x, bat.y - o.y), dg = hyp(o.tx - o.x, o.ty - o.y);
    dn = Math.min(dn, db); o.eye -= dt; o.cool -= dt;
    if ((o.blink -= dt) < 0) { o.blink = 3 + R() * 6; o.eye = .3; }
    if (db < 55 && o.m < 2 && o.cool < 0) { o.m = 2; o.lt = .9; } // close enough to hear wingbeats: strike
    if (o.m == 2) { o.tx = bat.x; o.ty = bat.y; }
    if (o.m && ((o.lt -= dt) < 0 || o.m == 1 && dg < 14)) { if (o.m == 2) o.cool = 2.5; o.m = 0; o.wt = 1.5; o.tx = o.x; o.ty = o.y; }
    else if (!o.m && (o.wt -= dt) < 0) { [o.tx, o.ty] = free(0); o.wt = 3 + R() * 4; }
    steer(o, o.tx, o.ty, o.m == 2 ? 190 : o.m ? 205 + Math.min(score, 25) * 2 : 50 * Math.min(1, dg / 40), o.m ? 2.5 : 1.5, dt, 10);
    if (db < 14) return die();
  }
  if (dn < 170 && (hb -= dt) < 0) { hb = .3 + dn / 170 * .6; beat = t; thump(); }
  const s = `MOTHS ${score}   OWLS ${owls.length}   BEST ${best}`;
  if (hud.textContent != s) hud.textContent = s;
}
function eat(m) {
  moths.splice(moths.indexOf(m), 1); addMoth(); score++; crunch();
  ghosts.push({ x: m.x, y: m.y, t, k: 2 });
  if (owls.length < Math.min(6, 1 + (score / 4 | 0))) { const o = addOwl(); o.eye = 1; hoot(o, hyp(o.x - bat.x, o.y - bat.y)); }
}
function die() {
  state = 'dead'; dead = t; screech();
  if (score > best) { best = score; try { localStorage.noctule = best; } catch (e) {} }
  ping(bat.x, bat.y, 1400, false); // one last scream lights up the whole cave
  show(`<h1>TAKEN</h1><p>the owl heard you after ${score} moth${score == 1 ? '' : 's'}</p><p class=dim>best ${best}</p><p class=go>click to fly again</p>`);
}

const dot = (x, y, r) => { X.beginPath(); X.arc(x, y, r, 0, TAU); X.fill(); };
function eyes(x, y) { X.fillStyle = '#ff6a33'; dot(x - 4, y - 2, 1.9); dot(x + 4, y - 2, 1.9); }
function owl(x, y) {
  X.strokeStyle = '#ff4433'; X.lineWidth = 1.5; X.beginPath();
  X.moveTo(x - 9, y - 12); X.lineTo(x - 4, y - 7); X.lineTo(x + 4, y - 7); X.lineTo(x + 9, y - 12);
  X.lineTo(x + 9, y + 3); X.quadraticCurveTo(x, y + 16, x - 9, y + 3); X.closePath(); X.stroke();
  eyes(x, y);
}
function draw() {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1;
  X.fillStyle = '#000'; X.fillRect(0, 0, C.width, C.height);
  X.setTransform(S, 0, 0, S, OX, OY); X.globalCompositeOperation = 'lighter';
  X.fillStyle = X.strokeStyle = '#efe0c0'; X.lineWidth = 1;
  for (const p of pings) {
    const r = (t - p.t0) * SPD;
    if (r < p.r) { X.globalAlpha = .14 * (1 - r / p.r); X.beginPath(); X.arc(p.x, p.y, r, 0, TAU); X.stroke(); }
    for (let i = 0; i < N; i++) {
      const d = p.h[i], age = t - p.t0 - d / SPD, z = age < .08 ? 3.2 : 1.7;
      if (d >= p.r || age < 0 || age > FADE) continue;
      X.globalAlpha = (1 - age / FADE) * (1 - d / p.r * .6);
      X.fillRect(p.x + COS[i] * d - z / 2, p.y + SIN[i] * d - z / 2, z, z);
    }
  }
  for (const g of ghosts) {
    const a = 1 - (t - g.t) / FADE;
    X.globalAlpha = a;
    if (g.k == 1) { owl(g.x, g.y); continue; }
    X.fillStyle = X.strokeStyle = '#ffb347';
    if (g.k == 2) { X.beginPath(); X.arc(g.x, g.y, (1 - a) * 34, 0, TAU); X.stroke(); }
    else { dot(g.x, g.y, 2.4); X.globalAlpha = a * .25; dot(g.x, g.y, 7); }
  }
  for (const o of owls) if (o.eye > 0 || o.m == 2) {
    X.globalAlpha = o.m == 2 ? 1 : Math.min(1, o.eye * 5); eyes(o.x, o.y);
    X.globalAlpha *= .2; dot(o.x - 4, o.y - 2, 5); dot(o.x + 4, o.y - 2, 5);
  }
  X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1;
  if (state != 'play') return;
  const w = 4 + 9 * Math.abs(Math.sin(t * (8 + hyp(bat.vx, bat.vy) / 12)));
  X.save(); X.translate(bat.x, bat.y); X.rotate(bat.h);
  X.fillStyle = bat.stun > 0 ? '#7a3524' : '#a89a80'; X.beginPath(); X.moveTo(6, 0);
  [[0, -2], [-2, -w], [-4, -w * .55], [-7, -w * .4], [-5, 0], [-7, w * .4], [-4, w * .55], [-2, w], [0, 2]].forEach(q => X.lineTo(q[0], q[1]));
  X.fill(); X.restore();
  if (dn < 170) { // heartbeat vignette when something with talons is close
    const cw = C.width, ch = C.height, g = X.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * .25, cw / 2, ch / 2, hyp(cw, ch) * .6);
    g.addColorStop(0, 'rgba(150,12,0,0)'); g.addColorStop(1, `rgba(150,12,0,${((1 - dn / 170) * Math.exp((beat - t) * 5) * .55).toFixed(3)})`);
    X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = g; X.fillRect(0, 0, cw, ch);
  }
}

/* sound: one tiny synth voice */
function tone(f1, f2, dur, vol, type, pan, delay) {
  if (!ac || vol <= 0) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(), s = ac.currentTime + (delay || 0);
    o.type = type || 'sine'; p.pan.value = Math.max(-1, Math.min(1, pan || 0));
    o.frequency.setValueAtTime(f1, s); o.frequency.exponentialRampToValueAtTime(f2, s + dur);
    g.gain.setValueAtTime(1e-4, s); g.gain.exponentialRampToValueAtTime(vol, s + .012); g.gain.exponentialRampToValueAtTime(1e-4, s + dur);
    o.connect(g).connect(p).connect(ac.destination); o.start(s); o.stop(s + dur + .05);
  } catch (e) {}
}
const chirp = () => { tone(3400, 1400, .07, .07); tone(3400, 1400, .07, .02, 0, 0, .17); };
const thud = () => tone(160, 40, .22, .5, 'triangle');
const crunch = () => { tone(1200, 260, .05, .1, 'square'); tone(800, 180, .07, .07, 'square', 0, .06); };
const thump = () => { tone(110, 55, .12, .5); tone(95, 50, .12, .3, 0, 0, .14); };
const screech = () => { tone(2300, 700, .8, .1, 'sawtooth'); tone(1700, 520, .7, .07, 'sawtooth', 0, .06); };
function hoot(o, d) { const p = o.x / W * 2 - 1, v = .22 * (1 - d / 700); tone(340, 300, .32, v, 0, p, .2); tone(320, 270, .5, v * .8, 0, p, .62); }

/* input: mouse steers, touch drags a virtual stick, keys work too */
const keys = {};
let tgt = null, joy = null, tp = null;
addEventListener('keydown', e => { if (e.code == 'Space') { e.preventDefault(); if (!e.repeat) act(); } else keys[e.code] = 1; });
addEventListener('keyup', e => keys[e.code] = 0);
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; });
const wpos = e => [(e.clientX * D - OX) / S, (e.clientY * D - OY) / S];
C.oncontextmenu = e => e.preventDefault();
C.addEventListener('pointerdown', e => {
  if (e.pointerType == 'mouse') { tgt = wpos(e); act(); }
  else if (tp) act(); // a second finger pings while the first one steers
  else tp = { x: e.clientX, y: e.clientY, id: e.pointerId, t: performance.now(), m: 0 };
});
C.addEventListener('pointermove', e => {
  if (e.pointerType == 'mouse') tgt = wpos(e);
  else if (tp && tp.id == e.pointerId) {
    const dx = e.clientX - tp.x, dy = e.clientY - tp.y, L = hyp(dx, dy);
    if (L > 12) tp.m = 1;
    if (tp.m) joy = [dx / Math.max(L, 50), dy / Math.max(L, 50)];
  }
});
const lift = e => { if (tp && tp.id == e.pointerId) { if (!tp.m && performance.now() - tp.t < 300) act(); tp = joy = null; } };
C.addEventListener('pointerup', lift); C.addEventListener('pointercancel', lift);

function act() {
  if (state == 'play') { if (bat.cd <= 0) { bat.cd = .4; chirp(); ping(bat.x, bat.y, RANGE, true); } }
  else if (state == 'title' || t - dead > .9) start();
}
function start() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  if (state == 'dead') init();
  state = 'play'; ui.style.display = 'none'; pings = []; ghosts = []; hb = 0;
  ping(bat.x, bat.y, RANGE, false); // a free, silent first look
}
function show(h) { ui.innerHTML = h; ui.style.display = 'flex'; }

let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, Math.max(0, now - last) / 1000); last = now; t += dt;
  if (state == 'play') update(dt);
  else if (state == 'title' && (amb -= dt) < 0) { amb = 1.3; const [x, y] = free(0); ping(x, y, RANGE, false); }
  waves(); draw(); requestAnimationFrame(frame);
}
init();
show(`<h1>NOCTULE</h1><p>you see by screaming. the owls hunt by listening.</p><p class=dim>fly: mouse or WASD, drag on touch<br>ping: click or space, tap on touch</p><p class=go>click to take wing</p>`);
requestAnimationFrame(frame);
</script>
</body>
</html>
