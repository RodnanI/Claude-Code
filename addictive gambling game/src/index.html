<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0d0a">
<meta name="description" content="Fever Parlor: a pachinko roguelike. Drop balls, chase jackpots, break the house.">
<title>Fever Parlor</title>
<style>
/*@@FONTS@@*/
/*@@CSS@@*/
</style>
</head>
<body>
<div id="app" class="title">
  <div id="room"></div>
  <div id="stage">
    <section id="left" class="panel">
      <div class="brand"><span class="b1">Fever</span><span class="b2">PARLOR</span></div>
      <div id="roundCard">
        <div class="rc-top"><span id="rcFloor">FLOOR 1</span><span id="rcRound">ROUND A</span></div>
        <div class="rc-quota"><small>QUOTA</small><b id="rcQuota">0</b></div>
        <div class="bar" id="qBar"><div class="bar-fill" id="qFill"></div><div class="bar-text" id="qText">0</div></div>
        <div id="bossTag" hidden></div>
      </div>
      <div id="calc">
        <div class="pill p"><small>POINTS</small><b id="cPts">0</b></div>
        <span class="xs">x</span>
        <div class="pill m"><small>MULT</small><b id="cMult">1</b></div>
      </div>
      <div id="lastScore">&nbsp;</div>
      <div id="reelWrap">
        <div id="reelBox"><canvas id="reels"></canvas><div id="reachBanner"></div></div>
        <div id="reelInfo"><div id="holds"><i></i><i></i><i></i><i></i></div><div id="heat"><div id="heatFill"></div><span>HEAT</span></div></div>
      </div>
      <div id="ballsRow" title="Your ball bag"><div class="lbl">BALLS</div><b id="ballsLeft">0</b><div id="queue"></div></div>
    </section>
    <main id="cab">
      <canvas id="board"></canvas>
      <button id="nudgeL" class="nudge" aria-label="Nudge left"></button>
      <button id="nudgeR" class="nudge" aria-label="Nudge right"></button>
      <div id="cabOverlay"></div>
      <div id="placeBar" hidden><span></span><button class="btn dark">CANCEL</button></div>
      <button id="cashBtn" class="btn gold big" hidden>CASH OUT</button>
    </main>
    <section id="right" class="panel">
      <div id="moneyBox"><div class="coinI">$</div><b id="money">0</b><small id="interest"></small></div>
      <div class="sec"><span>CHARMS</span><em id="charmCount">0/5</em></div>
      <div id="charms"></div>
      <div class="sec"><span>TICKETS</span><em>tap to use</em></div>
      <div id="tickets"></div>
      <div class="sec"><span>BALL BAG</span></div>
      <div id="bag"></div>
      <div id="ctrl"><button id="btnSpeed" class="btn dark">SPEED 1x</button><button id="btnMenu" class="btn dark">MENU</button></div>
    </section>
  </div>
  <div id="shop" hidden>
    <div class="shop-head"><h2>The Shop</h2><div class="quip"></div><div class="shop-next"></div></div>
    <div class="shop-body"><div class="shop-grid">
      <div class="sect s-charms"><div class="shelf-label">CHARMS</div><div class="shelf" id="shCharms"></div></div>
      <div class="sect"><div class="shelf-label">GOODS</div><div class="shelf" id="shGoods"></div></div>
      <div class="sect"><div class="shelf-label">CAPSULES</div><div class="shelf" id="shCaps"></div></div>
    </div></div>
    <div class="shop-foot"><button id="btnReroll" class="btn teal">REROLL</button><button id="btnNext" class="btn big">NEXT ROUND</button></div>
  </div>
  <div id="screen"></div>
  <div id="modal"></div>
  <div id="toasts"></div>
  <div id="flash"></div>
  <canvas id="fx"></canvas>
  <div id="tip" hidden></div>
</div>
<script>
/*@@JS@@*/
</script>
</body>
</html>
