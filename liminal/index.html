    });
  },
  makeFBO(name,w,h,float,depth){
    const gl=this.gl;
    let f=this.fbo[name];
    if(f){ gl.deleteFramebuffer(f.fb); gl.deleteTexture(f.tex); if(f.rb)gl.deleteRenderbuffer(f.rb); }
    const tex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,tex);
    if(float) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
    else      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    const fb=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    let rb=null;
    if(depth){
      rb=gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER,rb);
      gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,rb);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    return this.fbo[name]={fb,tex,rb,w,h};
  },
  resize(scale){
    const gl=this.gl;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const cw=Math.max(1,Math.floor(window.innerWidth)),ch=Math.max(1,Math.floor(window.innerHeight));
    this.canvas.style.width=cw+'px'; this.canvas.style.height=ch+'px';
    const W=Math.max(64,Math.floor(cw*dpr*scale)), H=Math.max(64,Math.floor(ch*dpr*scale));
    if(W===this.W&&H===this.H&&this.fbo.scene) return;
    this.W=W;this.H=H;this.dpr=dpr;this.cw=cw;this.ch=ch;
    this.canvas.width=W;this.canvas.height=H;
    this.makeFBO('scene',W,H,this.hdr,true);
    const bw=Math.max(8,W>>1),bh=Math.max(8,H>>1);
    this.makeFBO('bA',bw,bh,this.hdr,false);
    this.makeFBO('bB',bw,bh,this.hdr,false);
  },
  uploadVoxels(vox){
    const gl=this.gl;
    if(this.voxTex) gl.deleteTexture(this.voxTex);
    const t=this.voxTex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_3D,t);
    gl.texImage3D(gl.TEXTURE_3D,0,gl.R8,vox.nx,vox.ny,vox.nz,0,gl.RED,gl.UNSIGNED_BYTE,vox.data);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_R,gl.CLAMP_TO_EDGE);
  },
  disposeWorld(){
    const gl=this.gl,w=this.world;
    if(!w)return;
    w.chunks.forEach(c=>{ if(c.vao){gl.deleteVertexArray(c.vao);gl.deleteBuffer(c.vbo);} });
    w.mats.forEach(m=>{ if(m.tex)gl.deleteTexture(m.tex); if(m.nrm)gl.deleteTexture(m.nrm); });
    this.world=null;
  }
};

/* ---------------------------------------------------------------- builder */
class Builder{
  constructor(seed){
    this.seed=seed>>>0;
    this.rng=makeRNG(this.seed||1);
    this.mats=[]; this.matByName=new Map();
    this.bins=new Map();          // key -> vertex bin
    this.chunkKeys=new Map();
    this.solids=[];
    this.lights=[];
    this.spawnPos=[0,1.7,0]; this.spawnYaw=0;
    this.goals=[];
    this.env={
      fogColor:[0.06,0.06,0.05], fogDensity:0.045, ambient:[0.05,0.05,0.05],
      exposure:1.0, lift:[0,0,0], gain:[1,1,1], sat:1.0, bloomThresh:0.75, aoStrength:1.0
    };
    this.amb={hum:0,drone:0,water:0,tone:0.06,reverb:0.25};
    this.stepFn=null;
    this.min=[1e9,1e9,1e9]; this.max=[-1e9,-1e9,-1e9];
    this.tessStep=1.1;
    this.tri=0;
  }
  /* ------------ declarations ------------ */
  material(name,def){
    if(this.matByName.has(name)) return this.matByName.get(name);
    const id=this.mats.length;
    this.mats.push(Object.assign({
      name, draw:null, tile:1, emissive:[0,0,0], shininess:32, specular:0, fresnel:0,
      alpha:1, blend:false, scroll:[0,0], wave:0, bump:0, srgb:true, noNormal:false
    },def));
    this.matByName.set(name,id);
    return id;
  }
  setStepMaterial(fn){ this.stepFn=fn; }
  spawn(x,y,z,yaw){ this.spawnPos=[x,y,z]; this.spawnYaw=yaw||0; }
  goal(o){ this.goals.push(Object.assign({r:1.6,title:'Exit found',text:''},o)); }
  environment(o){ Object.assign(this.env,o); }
  ambience(o){ Object.assign(this.amb,o); }
  light(o){
    this.lights.push({
      x:o.x,y:o.y,z:o.z,
      r:o.r!==undefined?o.r:1, g:o.g!==undefined?o.g:1, b:o.b!==undefined?o.b:1,
      radius:o.radius||8, intensity:o.intensity!==undefined?o.intensity:1,
      flicker:o.flicker||0, shadow:o.shadow!==false, hum:o.hum||0,
      ph:this.rng()*1000
    });
  }
  solid(x,y,z,sx,sy,sz){
    this.solids.push([x,y,z,x+sx,y+sy,z+sz]);
    this._grow(x,y,z);this._grow(x+sx,y+sy,z+sz);
  }
  _grow(x,y,z){
    const a=this.min,b=this.max;
    if(x<a[0])a[0]=x; if(y<a[1])a[1]=y; if(z<a[2])a[2]=z;
    if(x>b[0])b[0]=x; if(y>b[1])b[1]=y; if(z>b[2])b[2]=z;
  }
  /* ------------ geometry ------------ */
  _bin(cx,cz,mat){
    const key=((cx+512)<<20)|((cz+512)<<6)|mat;
    let b=this.bins.get(key);
    if(!b){
      b={cx,cz,mat,pos:[],nrm:[],uv:[],tint:[]};
      this.bins.set(key,b);
    }
    return b;
  }
  /**
   * Emit a (tessellated) quad. Corners in CCW order when seen from the front.
   * o: {uvScale, uvOffset:[u,v], uvMode:'world'|'local', tint:[r,g,b], tess, double}
   */
  quad(a,b,c,d,mat,o){
    o=o||{};
    const M=this.mats[mat]||{};
    const scale=(o.uvScale!==undefined?o.uvScale:1)*(M.tile||1);
    const off=o.uvOffset||[0,0];
    const tint=o.tint||[1,1,1];
    const tr=Math.round(clamp(tint[0],0,2)*127.5),
          tg=Math.round(clamp(tint[1],0,2)*127.5),
          tb=Math.round(clamp(tint[2],0,2)*127.5);
    // normal
    let nx=(b[1]-a[1])*(d[2]-a[2])-(b[2]-a[2])*(d[1]-a[1]);
    let ny=(b[2]-a[2])*(d[0]-a[0])-(b[0]-a[0])*(d[2]-a[2]);
    let nz=(b[0]-a[0])*(d[1]-a[1])-(b[1]-a[1])*(d[0]-a[0]);
    const nl=Math.hypot(nx,ny,nz)||1; nx/=nl;ny/=nl;nz/=nl;
    // uv mode: world projection keeps tiling continuous across surfaces
    const worldUV=(o.uvMode||'world')==='world';
    const ax=Math.abs(nx),ay=Math.abs(ny),az=Math.abs(nz);
    const axis=(ay>=ax&&ay>=az)?1:(ax>=az?0:2);
    const lenU=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);
    const lenV=Math.hypot(d[0]-a[0],d[1]-a[1],d[2]-a[2]);
    const step=o.tess||this.tessStep;
    const gu=Math.max(1,Math.min(32,Math.ceil(lenU/step)));
    const gv=Math.max(1,Math.min(32,Math.ceil(lenV/step)));
    const P=(u,v,out)=>{
      const x0=a[0]+(b[0]-a[0])*u, y0=a[1]+(b[1]-a[1])*u, z0=a[2]+(b[2]-a[2])*u;
      const x1=d[0]+(c[0]-d[0])*u, y1=d[1]+(c[1]-d[1])*u, z1=d[2]+(c[2]-d[2])*u;
      out[0]=x0+(x1-x0)*v; out[1]=y0+(y1-y0)*v; out[2]=z0+(z1-z0)*v;
    };
    const UV=(p,u,v)=>{
      if(worldUV){
        if(axis===1) return [ p[0]*scale+off[0], p[2]*scale+off[1] ];
        if(axis===0) return [ p[2]*scale+off[0], -p[1]*scale+off[1] ];
        return [ p[0]*scale+off[0], -p[1]*scale+off[1] ];
      }
      return [ u*lenU*scale+off[0], v*lenV*scale+off[1] ];
    };
    const p00=[0,0,0],p10=[0,0,0],p11=[0,0,0],p01=[0,0,0];
    for(let iv=0;iv<gv;iv++){
      for(let iu=0;iu<gu;iu++){
        const u0=iu/gu,u1=(iu+1)/gu,v0=iv/gv,v1=(iv+1)/gv;
        P(u0,v0,p00);P(u1,v0,p10);P(u1,v1,p11);P(u0,v1,p01);
        const cx=Math.floor((p00[0]+p11[0])*0.5/CH), cz=Math.floor((p00[2]+p11[2])*0.5/CH);
        const bin=this._bin(cx,cz,mat);
        const t0=UV(p00,u0,v0),t1=UV(p10,u1,v0),t2=UV(p11,u1,v1),t3=UV(p01,u0,v1);
        const push=(p,t)=>{
          bin.pos.push(p[0],p[1],p[2]);
          bin.nrm.push(nx,ny,nz);
          bin.uv.push(t[0],t[1]);
          bin.tint.push(tr,tg,tb);
          this._grow(p[0],p[1],p[2]);
        };
        push(p00,t0);push(p10,t1);push(p11,t2);
        push(p00,t0);push(p11,t2);push(p01,t3);
        this.tri+=2;
      }
    }
    if(o.double) this.quad(a,d,c,b,mat,Object.assign({},o,{double:false}));
  }
  /** axis-aligned box from the minimum corner */
  box(x,y,z,sx,sy,sz,mat,o){
    o=o||{};
    const x0=x,y0=y,z0=z,x1=x+sx,y1=y+sy,z1=z+sz;
    const skip=o.skip||'';
    if(!skip.includes('+x')) this.quad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],mat,o);
    if(!skip.includes('-x')) this.quad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],mat,o);
    if(!skip.includes('+y')) this.quad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],mat,o);
    if(!skip.includes('-y')) this.quad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],mat,o);
    if(!skip.includes('+z')) this.quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],mat,o);
    if(!skip.includes('-z')) this.quad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],mat,o);
    if(o.solid!==false) this.solid(x,y,z,sx,sy,sz);
  }
  /** upward-facing horizontal surface */
  floor(x0,z0,x1,z1,y,mat,o){ this.quad([x0,y,z1],[x1,y,z1],[x1,y,z0],[x0,y,z0],mat,o); }
  /** downward-facing horizontal surface */
  ceiling(x0,z0,x1,z1,y,mat,o){ this.quad([x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1],mat,o); }
  /** vertical wall from (x0,z0)->(x1,z1); normal points to the left of travel */
  wall(x0,z0,x1,z1,y0,y1,mat,o){
    this.quad([x0,y0,z0],[x1,y0,z1],[x1,y1,z1],[x0,y1,z0],mat,o||{uvMode:'local'});
  }
  /** a solid floor slab you can stand on (1 m of collision below the surface) */
  slab(x0,z0,x1,z1,y,mat,o){
    this.floor(x0,z0,x1,z1,y,mat,o);
    this.solid(Math.min(x0,x1),y-1,Math.min(z0,z1),Math.abs(x1-x0),1,Math.abs(z1-z0));
  }

  /* ------------ bake ------------ */
  buildVoxels(){
    const pad=2;
    for(let i=0;i<3;i++){ this.min[i]-=pad; this.max[i]+=pad; }
    let cell=VOX;
    let nx,ny,nz;
    for(;;){
      nx=Math.ceil((this.max[0]-this.min[0])/cell);
      ny=Math.ceil((this.max[1]-this.min[1])/cell);
      nz=Math.ceil((this.max[2]-this.min[2])/cell);
      if(nx*ny*nz<=8e6) break;
      cell*=1.5;
    }
    nx=Math.max(2,nx);ny=Math.max(2,ny);nz=Math.max(2,nz);
    const data=new Uint8Array(nx*ny*nz);
    const o=this.min;
    /* A voxel is solid when its *centre* is inside the box. Marking every
       overlapped voxel instead would fatten a 1.2 m floor slab 0.3 m up into
       the room (so the floor shadows itself) and fatten a 0.18 m partition to
       a metre (so doorways stop letting light through). Boxes thinner than one
       voxel would vanish under a pure centre test, so those fall back to the
       single voxel holding their mid-plane — enough to stay light-tight. */
    const span=(lo,hi,mn,n)=>{
      let a=Math.ceil((lo-mn)/cell-0.5), b=Math.floor((hi-mn)/cell-0.5);
      if(b<a){ a=b=Math.floor(((lo+hi)*0.5-mn)/cell); }
      return [clamp(a,0,n-1),clamp(b,0,n-1)];
    };
    for(const s of this.solids){
      const [i0,i1]=span(s[0],s[3],o[0],nx);
      const [j0,j1]=span(s[1],s[4],o[1],ny);
      const [k0,k1]=span(s[2],s[5],o[2],nz);
      for(let k=k0;k<=k1;k++)for(let j=j0;j<=j1;j++){
        const base=nx*(j+ny*k);
        for(let i=i0;i<=i1;i++) data[base+i]=255;
      }
    }
    this.vox={data,nx,ny,nz,cell,min:this.min.slice(),
      inv:[1/(nx*cell),1/(ny*cell),1/(nz*cell)]};
    return this.vox;
  }
  occAt(x,y,z){
    const v=this.vox;
    const i=Math.floor((x-v.min[0])/v.cell), j=Math.floor((y-v.min[1])/v.cell), k=Math.floor((z-v.min[2])/v.cell);
    if(i<0||j<0||k<0||i>=v.nx||j>=v.ny||k>=v.nz) return 0;
    return v.data[i+v.nx*(j+v.ny*k)]?1:0;
  }
  /** hemisphere occupancy sampling -> per-vertex ambient occlusion */
  *bakeAO(quality){
    const bins=[...this.bins.values()];
    if(quality<=0){
      for(const b of bins){ b.ao=new Float32Array(b.pos.length/3).fill(1); }
      return;
    }
    // cosine-ish hemisphere directions around +Z
    const dirs=[];
    const rings=quality>=2?[[0.40,6],[0.72,6],[1.0,1]]:[[0.55,5],[1.0,1]];
    for(const [z,count] of rings){
      const rad=Math.sqrt(Math.max(0,1-z*z));
      for(let i=0;i<count;i++){
        const a=(i/count)*TAU+z*2.1;
        dirs.push([Math.cos(a)*rad,Math.sin(a)*rad,z]);
      }
    }
    // short radii on purpose: this is contact shadowing for corners and under
    // props. Reach much past a metre and a 4 m room starts occluding itself
    // against the opposite wall, which reads as blotches, not shading.
    const radii=quality>=2?[0.30,0.62,1.05]:[0.35,0.8];
    const weights=quality>=2?[1.0,0.5,0.24]:[1.0,0.4];
    let wsum=0; for(const w of weights) wsum+=w*dirs.length;

    let done=0;
    const total=bins.reduce((s,b)=>s+b.pos.length/3,0)||1;
    for(const b of bins){
      const n=b.pos.length/3;
      const ao=b.ao=new Float32Array(n);
      for(let i=0;i<n;i++){
        const px=b.pos[i*3],py=b.pos[i*3+1],pz=b.pos[i*3+2];
        const nx=b.nrm[i*3],ny=b.nrm[i*3+1],nz=b.nrm[i*3+2];
        // tangent basis
        let tx,ty,tz;
        if(Math.abs(ny)<0.9){ tx=-nz;ty=0;tz=nx; } else { tx=1;ty=0;tz=0; }
        const tl=Math.hypot(tx,ty,tz)||1; tx/=tl;ty/=tl;tz/=tl;
        const bx=ny*tz-nz*ty, by=nz*tx-nx*tz, bz=nx*ty-ny*tx;
        let occ=0;
        for(let r=0;r<radii.length;r++){
          const rad=radii[r],w=weights[r];
          for(let d=0;d<dirs.length;d++){
            const D=dirs[d];
            const dx=tx*D[0]+bx*D[1]+nx*D[2];
            const dy=ty*D[0]+by*D[1]+ny*D[2];
            const dz=tz*D[0]+bz*D[1]+nz*D[2];
            occ+=w*this.occAt(px+nx*0.08+dx*rad, py+ny*0.08+dy*rad, pz+nz*0.08+dz*rad);
          }
        }
        ao[i]=clamp(1-(occ/wsum)*1.05,0.20,1);
      }
      done+=n;
      yield [done/total,'baking occlusion'];
    }
  }
  /** assign every chunk the lights that can reach it */
  chunkLights(chunk){
    const out=[];
    for(let i=0;i<this.lights.length;i++){
      const L=this.lights[i];
      const dx=Math.max(chunk.x0-L.x,0,L.x-chunk.x1);
      const dy=Math.max(chunk.y0-L.y,0,L.y-chunk.y1);
      const dz=Math.max(chunk.z0-L.z,0,L.z-chunk.z1);
      const d=Math.hypot(dx,dy,dz);
      if(d<L.radius) out.push([i,L.intensity*(1-d/L.radius)]);
    }
    out.sort((a,b)=>b[1]-a[1]);
    return out.slice(0,ML).map(a=>a[0]);
  }
}

/* pack builder output into GPU chunks */
function* packWorld(B,gl,S){
  const chunks=new Map();
  for(const bin of B.bins.values()){
    const key=bin.cx+','+bin.cz;
    let c=chunks.get(key);
    if(!c){
      c={cx:bin.cx,cz:bin.cz,bins:[],
         x0:bin.cx*CH,z0:bin.cz*CH,x1:(bin.cx+1)*CH,z1:(bin.cz+1)*CH,
         y0:1e9,y1:-1e9,tris:0};
      chunks.set(key,c);
    }
    c.bins.push(bin);
  }
  let i=0;const total=chunks.size||1;
  const list=[];
  for(const c of chunks.values()){
    let count=0;
    for(const b of c.bins) count+=b.pos.length/3;
    const buf=new ArrayBuffer(count*36);
    const f=new Float32Array(buf), u=new Uint8Array(buf);
    let v=0;
    c.ranges=[];
    for(const b of c.bins){
      const n=b.pos.length/3;
      const start=v;
      for(let k=0;k<n;k++,v++){
        const fo=v*9, uo=v*36+32;
        const x=b.pos[k*3],y=b.pos[k*3+1],z=b.pos[k*3+2];
        f[fo]=x;f[fo+1]=y;f[fo+2]=z;
        f[fo+3]=b.nrm[k*3];f[fo+4]=b.nrm[k*3+1];f[fo+5]=b.nrm[k*3+2];
        f[fo+6]=b.uv[k*2];f[fo+7]=b.uv[k*2+1];
        u[uo]=b.tint[k*3];u[uo+1]=b.tint[k*3+1];u[uo+2]=b.tint[k*3+2];
        u[uo+3]=Math.round((b.ao?b.ao[k]:1)*255);
        if(y<c.y0)c.y0=y; if(y>c.y1)c.y1=y;
      }
      c.ranges.push({mat:b.mat,start,count:n});
      c.tris+=n/3;
    }
    if(c.y0>c.y1){c.y0=0;c.y1=1;}
    const vao=gl.createVertexArray(), vbo=gl.createBuffer();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
    gl.bufferData(gl.ARRAY_BUFFER,buf,gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,36,0);
    gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,36,12);
    gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,2,gl.FLOAT,false,36,24);
    gl.enableVertexAttribArray(3);gl.vertexAttribPointer(3,4,gl.UNSIGNED_BYTE,true,36,32);
    gl.bindVertexArray(null);
    c.vao=vao;c.vbo=vbo;c.verts=count;
    c.lights=B.chunkLights(c);
    c.bins=null;
    list.push(c);
    i++;
    if((i&3)===0) yield [i/total,'uploading geometry'];
  }
  return list;
}

/* build every material's texture on a 2D canvas, then upload */
function* buildTextures(B,S){
  const size=S.texSize;
  const cv=document.createElement('canvas');
  for(let i=0;i<B.mats.length;i++){
    const m=B.mats[i];
    cv.width=cv.height=size;
    const ctx=cv.getContext('2d',{willReadFrequently:true});
    ctx.clearRect(0,0,size,size);
    if(m.draw){
      try{ m.draw(ctx,size,makeRNG(hashStr(m.name)^B.seed),TX); }
      catch(e){ console.warn('texture failed',m.name,e); ctx.fillStyle='#888';ctx.fillRect(0,0,size,size); }
    } else { ctx.fillStyle='#999';ctx.fillRect(0,0,size,size); }
    m.tex=R.texFromCanvas(cv,m.srgb!==false,S.aniso);
    if(S.normalMaps&&m.bump>0&&!m.noNormal){
      const nc=TX.normalFrom(cv,m.bump*4);
      m.nrm=R.texFromCanvas(nc,false,S.aniso);
    } else m.nrm=null;
    yield [(i+1)/B.mats.length,'painting '+m.name];
  }
}

/* the whole load, as a generator so the loading bar can breathe */
function* loadLevel(level,seed,S){
  const B=new Builder(seed);
  B.level=level;
  yield [0.02,'generating layout'];
  level.build(B,{rng:B.rng,seed,TX,settings:S});
  if(!B.bins.size) throw new Error('level produced no geometry');
  yield [0.30,'voxelising'];
  B.buildVoxels();
  yield [0.34,'baking occlusion'];
  for(const p of B.bakeAO(S.aoQuality)) yield [0.34+p[0]*0.28,p[1]];
  yield [0.64,'painting surfaces'];
  for(const p of buildTextures(B,S)) yield [0.64+p[0]*0.20,p[1]];
  yield [0.85,'uploading geometry'];
  const gen=packWorld(B,R.gl,S);
  let r=gen.next();
  while(!r.done){ yield [0.85+r.value[0]*0.13,r.value[1]]; r=gen.next(); }
  const chunks=r.value;
  R.uploadVoxels(B.vox);
  yield [0.99,'ready'];
  return {
    level, seed, mats:B.mats, chunks, solids:B.solids, lights:B.lights,
    spawn:B.spawnPos, spawnYaw:B.spawnYaw, goals:B.goals, env:B.env, amb:B.amb,
    vox:B.vox, stepFn:B.stepFn, tris:B.tri,
    grid:buildSolidGrid(B.solids)
  };
}

/* spatial hash over collision boxes */
function buildSolidGrid(solids){
  const G=4, map=new Map();
  solids.forEach((s,i)=>{
    const i0=Math.floor(s[0]/G),i1=Math.floor(s[3]/G);
    const k0=Math.floor(s[2]/G),k1=Math.floor(s[5]/G);
    for(let k=k0;k<=k1;k++)for(let x=i0;x<=i1;x++){
      const key=x+','+k;
      let a=map.get(key); if(!a){a=[];map.set(key,a);}
      a.push(i);
    }
  });
  return {G,map,solids,
    near(x,z,pad){
      const out=new Set();
      const i0=Math.floor((x-pad)/G),i1=Math.floor((x+pad)/G);
      const k0=Math.floor((z-pad)/G),k1=Math.floor((z+pad)/G);
      for(let k=k0;k<=k1;k++)for(let i=i0;i<=i1;i++){
        const a=map.get(i+','+k);
        if(a)for(const idx of a) out.add(idx);
      }
      return out;
    }};
}

/* ---------------------------------------------------------------- draw */
const _vp=M4.ident(),_proj=M4.ident(),_view=M4.ident(),_frustum=new Float32Array(24);
const _lp=new Float32Array(ML*4), _lc=new Float32Array(ML*4);

function flickerVal(t,seed){
  const a=ihash((t*13)|0,seed,7), b=ihash((t*4)|0,seed,13);
  let v=1;
  if(b<0.09) v=a<0.55?0.10+a*0.45:1;
  else if(b<0.14) v=0.72+a*0.28;
  v*=0.95+0.05*Math.sin(t*37.0+seed);
  return v;
}

function renderWorld(w,cam,S,time,fade){
  const gl=R.gl;
  const S_=S;
  const near=0.06, far=S.viewDist;
  M4.persp(_proj,S.fov*Math.PI/180,R.W/R.H,near,far);
  M4.lookDir(_view,cam.pos,cam.yaw,cam.pitch);
  M4.mul(_vp,_proj,_view);
  frustumFromVP(_vp,_frustum);

  const F=R.fbo.scene;
  gl.bindFramebuffer(gl.FRAMEBUFFER,F.fb);
  gl.viewport(0,0,R.W,R.H);
  const fc=w.env.fogColor, ex=w.env.exposure*S.brightness;
  const enc=R.hdr?0:1;
  const cc=enc? [Math.sqrt(fc[0]*ex),Math.sqrt(fc[1]*ex),Math.sqrt(fc[2]*ex)] : [fc[0]*ex,fc[1]*ex,fc[2]*ex];
  gl.clearColor(cc[0],cc[1],cc[2],1);
  gl.clearDepth(1);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.disable(gl.BLEND);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  const P=R.scene,u=P.u;
  gl.useProgram(P.p);
  gl.uniformMatrix4fv(u.uVP,false,_vp);
  gl.uniform3f(u.uCam,cam.pos[0],cam.pos[1],cam.pos[2]);
  gl.uniform3fv(u.uAmb,w.env.ambient);
  gl.uniform3fv(u.uFogCol,w.env.fogColor);
  gl.uniform1f(u.uFogDen,w.env.fogDensity*S.fogScale);
  gl.uniform1f(u.uExposure,ex);
  gl.uniform1f(u.uEncode,enc);
  gl.uniform1f(u.uTime,time);
  gl.uniform1i(u.uShadowSteps,S.shadowSteps);
  gl.uniform1f(u.uAOStr,w.env.aoStrength);
  gl.uniform3fv(u.uVoxMin,w.vox.min);
  gl.uniform3fv(u.uVoxInv,w.vox.inv);
  gl.uniform1i(u.uTex,0);
  gl.uniform1i(u.uNrmTex,1);
  gl.uniform1i(u.uVox,2);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_3D,R.voxTex);

  if(cam.flash>0){
    const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
    gl.uniform3f(u.uFlashP,cam.pos[0],cam.pos[1],cam.pos[2]);
    gl.uniform3f(u.uFlashD,sy*cp,sp,-cy*cp);
    gl.uniform4f(u.uFlashPar,0.955,0.80,cam.flash*2.4,16);
  } else gl.uniform4f(u.uFlashPar,1,1,0,1);

  // per-frame light intensity (flicker)
  const LI=w._li||(w._li=new Float32Array(w.lights.length));
  for(let i=0;i<w.lights.length;i++){
    const L=w.lights[i];
    LI[i]=L.intensity*(L.flicker&&S.flicker?lerp(1,flickerVal(time*(0.6+L.flicker),L.ph|0),L.flicker):1);
  }

  // gather visible chunks, sorted by material to cut texture switches
  const draws=[];
  let tris=0,vis=0;
  const cx=cam.pos[0],cz=cam.pos[2];
  const far2=(far+CH)*(far+CH);
  for(const c of w.chunks){
    const ddx=Math.max(c.x0-cx,0,cx-c.x1), ddz=Math.max(c.z0-cz,0,cz-c.z1);
    if(ddx*ddx+ddz*ddz>far2) continue;
    if(!aabbInFrustum(_frustum,c.x0,c.y0-0.2,c.z0,c.x1,c.y1+0.2,c.z1)) continue;
    vis++;
    for(const rg of c.ranges) draws.push([rg.mat,c,rg,ddx*ddx+ddz*ddz]);
  }
  draws.sort((a,b)=>(a[0]-b[0])|| (a[3]-b[3]));

  const nL=Math.min(S.maxLights,ML);
  let curMat=-1,curVao=null,calls=0;
  const bindMat=(mi)=>{
    const m=w.mats[mi];
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,m.tex||R.white);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,m.nrm||R.flatN);
    gl.uniform1f(u.uUseNrm,(S.normalMaps&&m.nrm)?1:0);
    gl.uniform3fv(u.uEmis,m.emissive);
    gl.uniform3f(u.uSpec,m.shininess,S.specular?m.specular:0,S.specular?m.fresnel:0);
    gl.uniform1f(u.uAlpha,m.alpha);
    gl.uniform2fv(u.uScroll,m.scroll);
    gl.uniform1f(u.uWave,m.wave);
  };
  const uploadLights=(c)=>{
    const n=Math.min(c.lights.length,nL);
    for(let i=0;i<n;i++){
      const L=w.lights[c.lights[i]];
      _lp[i*4]=L.x;_lp[i*4+1]=L.y;_lp[i*4+2]=L.z;_lp[i*4+3]=L.radius;
      const I=LI[c.lights[i]];
      _lc[i*4]=L.r*I;_lc[i*4+1]=L.g*I;_lc[i*4+2]=L.b*I;_lc[i*4+3]=L.shadow?1:0;
    }
    gl.uniform1i(u.uNumL,n);
    if(n){ gl.uniform4fv(u.uLP,_lp.subarray(0,n*4)); gl.uniform4fv(u.uLC,_lc.subarray(0,n*4)); }
  };

  // opaque
  for(const d of draws){
    const m=w.mats[d[0]];
    if(m.blend) continue;
    if(d[0]!==curMat){ bindMat(d[0]); curMat=d[0]; }
    if(d[1].vao!==curVao){ gl.bindVertexArray(d[1].vao); curVao=d[1].vao; }
    uploadLights(d[1]);
    gl.drawArrays(gl.TRIANGLES,d[2].start,d[2].count);
    tris+=d[2].count/3;calls++;
  }
  // transparent, back to front
  const tr=draws.filter(d=>w.mats[d[0]].blend).sort((a,b)=>b[3]-a[3]);
  if(tr.length){
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    curMat=-1;
    for(const d of tr){
      if(d[0]!==curMat){ bindMat(d[0]); curMat=d[0]; }
      if(d[1].vao!==curVao){ gl.bindVertexArray(d[1].vao); curVao=d[1].vao; }
      uploadLights(d[1]);
      gl.drawArrays(gl.TRIANGLES,d[2].start,d[2].count);
      tris+=d[2].count/3;calls++;
    }
    gl.depthMask(true);
    gl.enable(gl.CULL_FACE);
    gl.disable(gl.BLEND);
  }
  gl.bindVertexArray(null);

  /* ---- post ---- */
  gl.disable(gl.DEPTH_TEST);
  gl.bindVertexArray(R.emptyVAO);
  const bA=R.fbo.bA,bB=R.fbo.bB;
  if(S.bloom>0){
    gl.bindFramebuffer(gl.FRAMEBUFFER,bA.fb);
    gl.viewport(0,0,bA.w,bA.h);
    gl.useProgram(R.bright.p);
    gl.uniform1i(R.bright.u.uSrc,0);
    gl.uniform1f(R.bright.u.uThresh,w.env.bloomThresh);
    gl.uniform1f(R.bright.u.uDecode,enc);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,F.tex);
    gl.drawArrays(gl.TRIANGLES,0,3);

    gl.useProgram(R.blur.p);
    gl.uniform1i(R.blur.u.uSrc,0);
    for(let pass=0;pass<2;pass++){
      gl.bindFramebuffer(gl.FRAMEBUFFER,bB.fb);
      gl.uniform2f(R.blur.u.uDir,(1.0+pass)/bA.w,0);
      gl.bindTexture(gl.TEXTURE_2D,bA.tex);
      gl.drawArrays(gl.TRIANGLES,0,3);
      gl.bindFramebuffer(gl.FRAMEBUFFER,bA.fb);
      gl.uniform2f(R.blur.u.uDir,0,(1.0+pass)/bA.h);
      gl.bindTexture(gl.TEXTURE_2D,bB.tex);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER,bA.fb);
    gl.viewport(0,0,bA.w,bA.h);
    gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,R.W,R.H);
  const C=R.comp,cu=C.u;
  gl.useProgram(C.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,F.tex);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,bA.tex);
  gl.uniform1i(cu.uSrc,0);gl.uniform1i(cu.uBloom,1);
  gl.uniform2f(cu.uRes,R.W,R.H);
  gl.uniform1f(cu.uDecode,enc);
  gl.uniform1f(cu.uBloomAmt,S.bloom);
  gl.uniform1f(cu.uGrain,S.grain);
  gl.uniform1f(cu.uVhs,S.vhs);
  gl.uniform1f(cu.uChroma,S.chroma);
  gl.uniform1f(cu.uVign,S.vignette);
  gl.uniform1f(cu.uFxaa,S.fxaa?1:0);
  gl.uniform1f(cu.uTime,time);
  gl.uniform1f(cu.uSat,w.env.sat);
  gl.uniform1f(cu.uFade,fade);
  gl.uniform3fv(cu.uLift,w.env.lift);
  gl.uniform3fv(cu.uGain,w.env.gain);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindVertexArray(null);

  return {tris:tris|0,calls,chunks:vis};
}
</script>
<script>
/* =====================================================================
   LIMINAL — game: player, collision, input, loop
   ===================================================================== */

const PLAYER={r:0.32,hStand:1.72,hCrouch:1.05,eye:0.16,step:0.42,
  gravity:19,jump:5.2,accel:52,airAccel:9,friction:11,
  vWalk:2.55,vRun:4.55,vCrouch:1.35};

const Game={
  world:null, state:'menu', S:null,
  cam:{pos:[0,1.7,0],yaw:0,pitch:0,flash:0,roll:0},
  feet:[0,0,0], vel:[0,0,0], h:PLAYER.hStand, grounded:false, crouch:false,
  bob:0, bobAmt:0, stepPhase:0, dist:0, t0:0, elapsed:0,
  fade:0, fadeTarget:1, running:false, sprintLatch:false,
  keys:Object.create(null), mouse:{dx:0,dy:0},
  touch:{move:[0,0],look:[0,0],jump:false,run:false,crouch:false,stickId:null,lookId:null,ox:0,oy:0},
  stats:{fps:0,ms:0,tris:0,calls:0,chunks:0},
  nextAmbient:0, lastStepMat:'carpet',
  raf:null, lastT:0, acc:0,

  isMobile(){
    const d=Settings.data.device;
    if(d==='mobile') return true;
    if(d==='desktop') return false;
    return (('ontouchstart' in window)&&Math.min(screen.width,screen.height)<900)||
           /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  },

  begin(world){
    this.world=world;
    this.feet=[world.spawn[0],world.spawn[1],world.spawn[2]];
    this.cam.yaw=world.spawnYaw; this.cam.pitch=0; this.cam.roll=0;
    this.vel=[0,0,0]; this.h=PLAYER.hStand; this.crouch=false; this.grounded=false;
    this.bob=0;this.dist=0;this.elapsed=0;this.stepPhase=0;
    this.fade=0;this.fadeTarget=1;
    this.cam.flash=0;
    this.state='playing';
    R.world=world;
    Audio_.init();Audio_.resume();
    Audio_.setVolumes(Settings.data);
    Audio_.startAmbience(world.amb);
    this.nextAmbient=performance.now()/1000+3+Math.random()*6;
    this.t0=performance.now();
    this.lastT=performance.now();
    if(!this.raf) this.raf=requestAnimationFrame(t=>this.frame(t));
  },
  stop(){
    this.state='menu';
    Audio_.stopAmbience();
    if(this.raf){cancelAnimationFrame(this.raf);this.raf=null;}
  },
  pause(){
    if(this.state!=='playing')return;
    this.state='paused';
    if(document.pointerLockElement) document.exitPointerLock();
    UI.show('pause');
    if(Settings.data.muteOnBlur&&Audio_.master) Audio_.master.gain.value=0;
  },
  resume(){
    if(this.state!=='paused')return;
    this.state='playing';
    UI.hide('pause');UI.hide('settings');
    Audio_.resume();
    Audio_.setVolumes(Settings.data);
    this.lastT=performance.now();
    if(!this.isMobile()) this.lockPointer();
  },
  lockPointer(){
    const c=R.canvas;
    if(c.requestPointerLock&&!document.pointerLockElement){
      const p=c.requestPointerLock({unadjustedMovement:true});
      if(p&&p.catch) p.catch(()=>{try{c.requestPointerLock();}catch(e){}});
    }
  },

  /* ---------------- collision ---------------- */
  overlaps(x,y,z,h){
    const g=this.world.grid,r=PLAYER.r;
    const ids=g.near(x,z,r+1);
    for(const i of ids){
      const s=g.solids[i];
      if(x+r>s[0]&&x-r<s[3]&&z+r>s[2]&&z-r<s[5]&&y+h>s[1]&&y<s[4]) return s;
    }
    return null;
  },
  moveH(dx,dz){
    const g=this.world.grid,r=PLAYER.r;
    let x=this.feet[0],y=this.feet[1],z=this.feet[2],h=this.h;
    const tryAxis=(nx,nz)=>{
      const ids=g.near(nx,nz,r+1.2);
      let ny=y;
      for(const i of ids){
        const s=g.solids[i];
        if(!(nx+r>s[0]&&nx-r<s[3]&&nz+r>s[2]&&nz-r<s[5]&&ny+h>s[1]&&ny<s[4])) continue;
        // step up over low ledges
        const top=s[4];
        if(this.grounded&&top-ny>0.001&&top-ny<=PLAYER.step&&!this.overlaps(nx,top+0.02,nz,h)){
          ny=top+0.02; continue;
        }
        return {ok:false,y:ny};
      }
      return {ok:true,y:ny};
    };
    // x then z, so sliding along walls feels right
    let res=tryAxis(x+dx,z);
    if(res.ok){ x+=dx; y=res.y; }
    res=tryAxis(x,z+dz);
    if(res.ok){ z+=dz; y=res.y; }
    this.feet[0]=x;this.feet[1]=y;this.feet[2]=z;
  },
  moveV(dy){
    const g=this.world.grid,r=PLAYER.r;
    let x=this.feet[0],y=this.feet[1]+dy,z=this.feet[2],h=this.h;
    this.grounded=false;
    const ids=g.near(x,z,r+1);
    for(const i of ids){
      const s=g.solids[i];
      if(x+r>s[0]&&x-r<s[3]&&z+r>s[2]&&z-r<s[5]&&y+h>s[1]&&y<s[4]){
        if(dy<=0&&this.feet[1]+0.001>=s[4]-0.35){ y=s[4]; this.grounded=true; this.vel[1]=0; }
        else if(dy>0){ y=s[1]-h-0.001; this.vel[1]=Math.min(0,this.vel[1]); }
      }
    }
    this.feet[1]=y;
    if(y<-60){ this.feet=[this.world.spawn[0],this.world.spawn[1],this.world.spawn[2]];this.vel=[0,0,0]; }
  },

  /* ---------------- update ---------------- */
  update(dt){
    const S=Settings.data;
    const mob=this.isMobile();

    /* look */
    let lx=0,ly=0;
    if(mob){ lx=this.touch.look[0]*0.0032*S.touchSens; ly=this.touch.look[1]*0.0032*S.touchSens; this.touch.look[0]=this.touch.look[1]=0; }
    else   { lx=this.mouse.dx*0.0022*S.sens;          ly=this.mouse.dy*0.0022*S.sens;          this.mouse.dx=this.mouse.dy=0; }
    this.cam.yaw+=lx;
    this.cam.pitch-=ly*(S.invertY?-1:1);
    this.cam.pitch=clamp(this.cam.pitch,-1.53,1.53);
    if(this.cam.yaw>Math.PI)this.cam.yaw-=TAU; if(this.cam.yaw<-Math.PI)this.cam.yaw+=TAU;

    /* wish direction */
    let fwd=0,side=0;
    if(mob){ side=this.touch.move[0]; fwd=-this.touch.move[1]; }
    else{
      const k=this.keys;
      if(k['KeyW']||k['ArrowUp'])fwd+=1;
      if(k['KeyS']||k['ArrowDown'])fwd-=1;
      if(k['KeyD']||k['ArrowRight'])side+=1;
      if(k['KeyA']||k['ArrowLeft'])side-=1;
    }
    const ml=Math.hypot(fwd,side);
    if(ml>1){fwd/=ml;side/=ml;}

    /* stance */
    const wantCrouch=mob?this.touch.crouch:(this.keys['KeyC']||this.keys['ControlLeft']);
    if(wantCrouch&&!this.crouch){ this.crouch=true; }
    else if(!wantCrouch&&this.crouch){
      if(!this.overlaps(this.feet[0],this.feet[1],this.feet[2],PLAYER.hStand)) this.crouch=false;
    }
    const targetH=this.crouch?PLAYER.hCrouch:PLAYER.hStand;
    this.h=dampf(this.h,targetH,14,dt);

    let runHeld=mob?this.touch.run:(this.keys['ShiftLeft']||this.keys['ShiftRight']);
    if(S.sprintToggle){
      if(runHeld&&!this.sprintLatch){ this.running=!this.running; }
      this.sprintLatch=runHeld;
    } else this.running=runHeld;
    if(S.autoRun) this.running=!runHeld;

    const speed=(this.crouch?PLAYER.vCrouch:(this.running?PLAYER.vRun:PLAYER.vWalk))*S.walkSpeed;

    /* accelerate */
    const cy=Math.cos(this.cam.yaw),sy=Math.sin(this.cam.yaw);
    const wx=sy*fwd+cy*side, wz=-cy*fwd+sy*side;
    const wl=Math.hypot(wx,wz);
    const A=this.grounded?PLAYER.accel:PLAYER.airAccel;
    if(wl>0.001){
      const tx=wx/wl*speed, tz=wz/wl*speed;
      this.vel[0]+=(tx-this.vel[0])*Math.min(1,A*dt/Math.max(speed,0.1));
      this.vel[2]+=(tz-this.vel[2])*Math.min(1,A*dt/Math.max(speed,0.1));
    } else if(this.grounded){
      const f=Math.max(0,1-PLAYER.friction*dt);
      this.vel[0]*=f;this.vel[2]*=f;
    }
    /* jump */
    const wantJump=mob?this.touch.jump:(this.keys['Space']);
    if(wantJump&&this.grounded){ this.vel[1]=PLAYER.jump; this.grounded=false; }
    this.touch.jump=false;

    this.vel[1]-=PLAYER.gravity*dt;
    if(this.vel[1]<-40)this.vel[1]=-40;

    const px=this.feet[0],pz=this.feet[2];
    this.moveH(this.vel[0]*dt,this.vel[2]*dt);
    this.moveV(this.vel[1]*dt);
    const moved=Math.hypot(this.feet[0]-px,this.feet[2]-pz);
    this.dist+=moved;

    /* head bob + footsteps */
    const hspeed=moved/Math.max(dt,1e-4);
    this.bobAmt=dampf(this.bobAmt,this.grounded?Math.min(hspeed/PLAYER.vRun,1.2):0,8,dt);
    this.bob+=hspeed*dt*(this.crouch?2.6:2.0);
    const phase=this.bob*Math.PI;
    if(Math.floor(phase/Math.PI)!==this.stepPhase){
      this.stepPhase=Math.floor(phase/Math.PI);
      if(this.grounded&&hspeed>0.6){
        const m=this.world.stepFn?this.world.stepFn(this.feet[0],this.feet[2],this.feet[1]):'carpet';
        this.lastStepMat=m;
        Audio_.step(m,clamp(hspeed/PLAYER.vRun,0.35,1.1)*(this.crouch?0.5:1));
      }
    }

    /* camera */
    const bobK=Settings.data.headbob*this.bobAmt;
    const eyeY=this.feet[1]+this.h-PLAYER.eye
      +Math.sin(this.bob*TAU*0.5)*0.035*bobK
      +Math.abs(Math.sin(this.bob*Math.PI*0.5))*0.012*bobK;
    this.cam.pos[0]=this.feet[0]+Math.cos(this.bob*Math.PI*0.5)*0.02*bobK;
    this.cam.pos[1]=eyeY;
    this.cam.pos[2]=this.feet[2];
    this.cam.roll=dampf(this.cam.roll,-side*0.017*(this.running?1.4:1),8,dt);

    /* torch */
    const wantFlash=this.flashOn?1:0;
    this.cam.flash=dampf(this.cam.flash,wantFlash,10,dt);

    /* ambient one-shots */
    const now=performance.now()/1000;
    if(now>this.nextAmbient){
      const a=this.world.amb;
      const roll=Math.random();
      if(a.drips&&roll<0.5) Audio_.drip();
      else if(a.distant!==false&&roll<0.85) Audio_.distant();
      else if(Settings.data.flicker) Audio_.buzzTick(0.04);
      this.nextAmbient=now+(a.eventGap||9)*(0.4+Math.random()*1.6);
    }

    /* goals */
    for(const g of this.world.goals){
      const d=Math.hypot(this.feet[0]-g.x,this.feet[2]-g.z);
      if(d<g.r&&Math.abs(this.feet[1]-(g.y||this.feet[1]))<3){ this.finish(g); break; }
    }

    this.elapsed+=dt;
    this.fade=dampf(this.fade,this.fadeTarget,3.2,dt);
  },

  finish(g){
    if(this.state!=='playing')return;
    this.state='end';
    if(document.pointerLockElement)document.exitPointerLock();
    Audio_.stopAmbience();
    Audio_.blip(392,0.5,'sine',0.14);
    setTimeout(()=>Audio_.blip(523,0.9,'sine',0.11),260);
    UI.endScreen(g,this.elapsed,this.dist);
  },

  frame(t){
    this.raf=requestAnimationFrame(x=>this.frame(x));
    const S=Settings.data;
    let dt=(t-this.lastT)/1000;
    if(S.fpsCap>0){
      const min=1/S.fpsCap-0.0015;
      if(dt<min) return;
    }
    this.lastT=t;
    dt=Math.min(dt,0.1);
    if(!this.world)return;

    if(this.state==='playing') this.update(dt);
    else { this.fade=dampf(this.fade,this.state==='end'?0.25:0.55,3,dt); }

    const t1=performance.now();
    const camS={pos:this.cam.pos,yaw:this.cam.yaw,pitch:this.cam.pitch,flash:this.cam.flash};
    const st=renderWorld(this.world,camS,S,t/1000,this.fade);
    const t2=performance.now();

    this.stats.ms=this.stats.ms*0.9+(t2-t1)*0.1;
    this.stats.fps=this.stats.fps*0.92+(1/Math.max(dt,1e-4))*0.08;
    this.stats.tris=st.tris;this.stats.calls=st.calls;this.stats.chunks=st.chunks;
    if(S.showFps&&(t|0)%2===0) UI.updateFps(this);

    // roll the whole canvas for the strafe lean — cheap and effective
    R.canvas.style.transform=this.cam.roll?`rotate(${this.cam.roll}rad)`:'';
    R.canvas.style.scale=this.cam.roll?'1.03':'';
  },

  toggleFlash(){
    this.flashOn=!this.flashOn;
    Audio_.blip(this.flashOn?880:520,0.05,'square',0.05);
    UI.toast(this.flashOn?'torch on':'torch off');
  }
};

/* ---------------------------------------------------------------- input */
function bindInput(){
  const canvas=R.canvas;

  addEventListener('keydown',e=>{
    if(e.repeat){ Game.keys[e.code]=true; return; }
    Game.keys[e.code]=true;
    if(e.code==='Escape'){
      if(UI.isOpen('settings')){ UI.closeSettings(); }
      else if(Game.state==='playing') Game.pause();
      else if(Game.state==='paused') Game.resume();
      return;
    }
    if(Game.state!=='playing')return;
    if(e.code==='KeyF') Game.toggleFlash();
    if(e.code==='Space') e.preventDefault();
    if(e.code==='Tab'){ e.preventDefault(); Settings.set('showFps',!Settings.data.showFps); UI.updateFps(Game); }
  });
  addEventListener('keyup',e=>{ Game.keys[e.code]=false; });
  addEventListener('blur',()=>{
    Game.keys=Object.create(null);
    if(Settings.data.muteOnBlur&&Audio_.master) Audio_.master.gain.value=0;
  });
  addEventListener('focus',()=>{ if(Game.state==='playing') Audio_.setVolumes(Settings.data); });

  addEventListener('mousemove',e=>{
    if(Game.state!=='playing'||!document.pointerLockElement)return;
    Game.mouse.dx+=e.movementX||0;
    Game.mouse.dy+=e.movementY||0;
  });
  canvas.addEventListener('mousedown',()=>{
    if(Game.state==='playing'&&!Game.isMobile()) Game.lockPointer();
  });
  document.addEventListener('pointerlockchange',()=>{
    if(!document.pointerLockElement&&Game.state==='playing'&&!Game.isMobile()) Game.pause();
  });
  addEventListener('resize',()=>{ R.resize(Settings.data.renderScale); });
  addEventListener('orientationchange',()=>setTimeout(()=>R.resize(Settings.data.renderScale),300));

  /* ---- touch ---- */
  const stick=document.getElementById('stick'), knob=stick.querySelector('i');
  const lookzone=document.getElementById('lookzone');
  const T=Game.touch;
  const rectOf=el=>el.getBoundingClientRect();

  stick.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.changedTouches[0];
    T.stickId=t.identifier;
    const r=rectOf(stick); T.ox=r.left+r.width/2; T.oy=r.top+r.height/2;
    stickMove(t);
  },{passive:false});
  function stickMove(t){
    const dx=t.clientX-T.ox, dy=t.clientY-T.oy;
    const max=52, l=Math.hypot(dx,dy);
    const k=l>max?max/l:1;
    T.move[0]=clamp(dx/max,-1,1);T.move[1]=clamp(dy/max,-1,1);
    const ml=Math.hypot(T.move[0],T.move[1]);
    if(ml>1){T.move[0]/=ml;T.move[1]/=ml;}
    knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;
  }
  addEventListener('touchmove',e=>{
    for(const t of e.changedTouches){
      if(t.identifier===T.stickId){ e.preventDefault(); stickMove(t); }
      else if(t.identifier===T.lookId){
        e.preventDefault();
        T.look[0]+=t.clientX-T.lx; T.look[1]+=t.clientY-T.ly;
        T.lx=t.clientX;T.ly=t.clientY;
      }
    }
  },{passive:false});
  const endTouch=e=>{
    for(const t of e.changedTouches){
      if(t.identifier===T.stickId){ T.stickId=null;T.move[0]=T.move[1]=0;knob.style.transform=''; }
      if(t.identifier===T.lookId){ T.lookId=null; }
    }
  };
  addEventListener('touchend',endTouch);
  addEventListener('touchcancel',endTouch);
  lookzone.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.changedTouches[0];
    if(T.lookId===null){ T.lookId=t.identifier;T.lx=t.clientX;T.ly=t.clientY; }
  },{passive:false});

  const hold=(id,on,off)=>{
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();el.classList.add('act');on();},{passive:false});
    const up=e=>{e.preventDefault();el.classList.remove('act');off&&off();};
    el.addEventListener('touchend',up);el.addEventListener('touchcancel',up);
  };
  hold('tJump',()=>{T.jump=true;});
  hold('tRun',()=>{T.run=true;},()=>{T.run=false;});
  hold('tLight',()=>Game.toggleFlash());
  hold('tMenu',()=>Game.pause());
  // crouch latches instead of being held
  const cb=document.getElementById('tCrouch');
  cb.addEventListener('touchstart',e=>{
    e.preventDefault();e.stopPropagation();
    T.crouch=!T.crouch; cb.classList.toggle('act',T.crouch);
  },{passive:false});
}
</script>
<script>
/* =====================================================================
   LIMINAL — ui: discovery, menus, settings, loading
   ===================================================================== */
const $=id=>document.getElementById(id);

/* Filenames probed when there is no directory index and no manifest —
   this is what makes the whole thing work straight off file://          */
const CANDIDATES=[
  'level.backrooms.js','level.poolrooms.js','level.office.js','level.mall.js',
  'level.hotel.js','level.carpark.js','level.school.js','level.pipes.js',
  'level.hospital.js','level.arcade.js','level.warehouse.js','level.stairs.js',
  'levels/backrooms.js','levels/poolrooms.js'
];

const TIPS=[
  'Hold shift to run. You will not get anywhere faster.',
  'Every room is the same room.',
  'The hum is 120 Hz. It is always 120 Hz.',
  'If the carpet is damp, you have been here before.',
  'Press F for the torch. It does not help much.',
  'Nothing is chasing you. That is the worst part.',
  'The exit is always in the room you just left.',
  'Quality settings live behind Escape.'
];

const UI={
  cur:'menu', sel:null, loadingGen:null, rebuildNeeded:false,

  /* ---------- screens ---------- */
  screen(name){
    this.cur=name;
    ['menu','levels','loading'].forEach(s=>$(s).classList.toggle('on',s===name));
    $('hud').classList.toggle('on',name==='game');
    $('touch').classList.toggle('on',name==='game'&&Game.isMobile());
    const bg=$('menubg');
    const inMenu=(name==='menu'||name==='levels');
    bg.style.opacity=inMenu?'1':'0';
    bg.style.display=inMenu?'block':'none';
    $('grain').style.opacity=inMenu?'0.055':'0';
    if(name==='game'){
      const hint=$('hint');
      hint.textContent=Game.isMobile()
        ? 'left stick move · right side look'
        : 'wasd move · shift run · c crouch · f torch · esc menu';
      hint.classList.remove('fade');
      clearTimeout(this._hintT);
      this._hintT=setTimeout(()=>hint.classList.add('fade'),9000);
      $('cross').style.display=Settings.data.crosshair?'block':'none';
      $('fps').style.display=Settings.data.showFps?'block':'none';
    }
  },
  show(id){ $(id).classList.add('on'); },
  hide(id){ $(id).classList.remove('on'); },
  isOpen(id){ return $(id).classList.contains('on'); },
  toast(msg){
    const t=$('toast');t.textContent=msg;t.classList.add('on');
    clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove('on'),1400);
  },
  updateFps(G){
    const f=$('fps');
    if(!Settings.data.showFps){ f.style.display='none'; return; }
    f.style.display='block';
    f.textContent=
      `${G.stats.fps.toFixed(0)} fps  ${G.stats.ms.toFixed(1)} ms\n`+
      `${(G.stats.tris/1000).toFixed(1)}k tris  ${G.stats.calls} calls\n`+
      `${G.stats.chunks} chunks  ${R.W}x${R.H}\n`+
      `${G.feet[0].toFixed(1)}, ${G.feet[1].toFixed(1)}, ${G.feet[2].toFixed(1)}`;
  },

  /* ---------- level discovery ---------- */
  async discover(){
    const files=new Set();
    const add=f=>{ if(f&&/\.js$/i.test(f)) files.add(f.replace(/^\.\//,'')); };

    // 1. directory index (python -m http.server, nginx autoindex, …)
    try{
      const r=await fetch('./',{cache:'no-store'});
      if(r.ok){
        const html=await r.text();
        const re=/(?:href|src)\s*=\s*["']([^"'?#]+\.js)["']/gi;
        let m; while((m=re.exec(html))) {
          const f=decodeURIComponent(m[1]);
          if(/(^|\/)levels?[.\-_/]/i.test(f)) add(f.replace(/^.*?([^/]+\/)?([^/]+)$/, (s,a,b)=>f.startsWith('/')?b:f));
        }
      }
    }catch(e){}

    // 2. explicit manifest
    try{
      const r=await fetch('./levels.json',{cache:'no-store'});
      if(r.ok){
        const j=await r.json();
        (Array.isArray(j)?j:(j.levels||[])).forEach(x=>add(typeof x==='string'?x:x.file));
      }
    }catch(e){}

    // 3. known names — the only path that works from file://, and the only
    //    reason to fire off requests that are expected to 404
    if(!files.size) CANDIDATES.forEach(add);

    const loaded=new Set([...document.querySelectorAll('script[data-level]')].map(s=>s.dataset.level));
    const jobs=[...files].filter(f=>!loaded.has(f)).map(f=>new Promise(res=>{
      const s=document.createElement('script');
      s.src=f; s.async=false; s.dataset.level=f;
      s.onload=()=>res(true);
      s.onerror=()=>{ s.remove(); res(false); };
      document.head.appendChild(s);
    }));
    await Promise.all(jobs);
    this.renderCards();
    $('lvCount').textContent=LIMINAL.levels.length+' level'+(LIMINAL.levels.length===1?'':'s');
  },

  loadFromFile(file){
    const fr=new FileReader();
    fr.onload=()=>{
      try{ (new Function(fr.result)).call(window); this.renderCards(); this.toast('loaded '+file.name); }
      catch(e){ alert('Could not load '+file.name+'\n\n'+e.message); }
    };
    fr.readAsText(file);
  },

  /* ---------- level cards ---------- */
  renderCards(){
    const wrap=$('cards');
    wrap.innerHTML='';
    if(!LIMINAL.levels.length){
      wrap.innerHTML='<div class="empty">No level files found.<br><br>'+
        'Level files live next to <code>index.html</code> and are named <code>level.*.js</code>.<br>'+
        'Serve the folder over http (for example <code>python3 -m http.server</code>) so they can be discovered, '+
        'or use <b>Load file…</b> above.</div>';
      $('detail').innerHTML='';
      return;
    }
    LIMINAL.levels.forEach((l,i)=>{
      const el=document.createElement('div');
      el.className='card'+(this.sel===l?' sel':'');
      el.innerHTML=`<canvas width="320" height="200"></canvas>
        ${l.badge?`<div class="badge">${l.badge}</div>`:''}
        <div class="meta"><div class="nm">${l.name||l.id}</div>
        <div class="sb">${l.subtitle||''}</div></div>`;
      const cv=el.querySelector('canvas'),g=cv.getContext('2d');
      try{
        if(l.preview) l.preview(g,cv.width,cv.height,TX);
        else this.defaultPreview(g,cv.width,cv.height,l.accent||'#f0d64b');
      }catch(e){ this.defaultPreview(g,cv.width,cv.height,'#666'); }
      el.onclick=()=>this.select(l);
      wrap.appendChild(el);
      if(!this.sel&&i===0) this.select(l);
    });
  },
  defaultPreview(g,w,h,acc){
    const grd=g.createLinearGradient(0,0,0,h);
    grd.addColorStop(0,'#15140f');grd.addColorStop(1,'#0a0a0b');
    g.fillStyle=grd;g.fillRect(0,0,w,h);
    g.strokeStyle=acc;g.globalAlpha=0.25;
    for(let i=0;i<7;i++){
      const s=i/7,ww=w*(0.12+s*0.9),hh=h*(0.12+s*0.9);
      g.strokeRect((w-ww)/2,(h-hh)/2,ww,hh);
    }
    g.globalAlpha=1;
  },
  select(l){
    this.sel=l;
    [...document.querySelectorAll('.card')].forEach((c,i)=>c.classList.toggle('sel',LIMINAL.levels[i]===l));
    const d=$('detail');
    const seed=(l.defaultSeed!==undefined?l.defaultSeed:1337);
    d.innerHTML=`
      <div class="dscroll">
        <h3>${l.name||l.id}</h3>
        <div class="sub" style="color:${l.accent||'var(--accent)'}">${l.subtitle||''}</div>
        <p>${l.description||''}</p>
        <div class="tags">${(l.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="facts">
          <div>Size <b>${l.size||'—'}</b></div>
          <div>Lighting <b>${l.lighting||'—'}</b></div>
          <div>Exit <b>${l.hasExit===false?'none':'yes'}</b></div>
        </div>
      </div>
      <div class="dfoot">
        <div class="seedrow">
          <input id="seedIn" value="${seed}" spellcheck="false" aria-label="seed">
          <button class="btn sm" id="seedRnd">Random</button>
        </div>
        <button class="btn primary" id="goBtn" style="width:100%">Enter this space</button>
      </div>`;
    $('seedRnd').onclick=()=>{ $('seedIn').value=(Math.random()*1e6|0); };
    $('goBtn').onclick=()=>this.startLevel(l,$('seedIn').value);
    if(l.accent) document.documentElement.style.setProperty('--accent',l.accent);
  },

  /* ---------- loading ---------- */
  startLevel(level,seedRaw){
    const seed=(/^\d+$/.test(String(seedRaw))?parseInt(seedRaw,10):hashStr(String(seedRaw)))>>>0;
    this.lastLevel=level;this.lastSeed=seedRaw;
    Audio_.init();Audio_.resume();
    Game.stop();
    R.disposeWorld();
    this.screen('loading');
    $('loadname').textContent=(level.name||level.id);
    $('loadtip').textContent=TIPS[(Math.random()*TIPS.length)|0];
    $('loadbar').style.right='100%';
    $('loadmsg').textContent='preparing';
    R.resize(Settings.data.renderScale);
    const S=Settings.data;
    let gen;
    try{ gen=loadLevel(level,seed,S); }
    catch(e){ return this.loadError(e); }
    const tick=()=>{
      const t0=performance.now();
      try{
        for(;;){
          const r=gen.next();
          if(r.done){
            const world=r.value;
            this.screen('game');
            Game.begin(world);
            if(!Game.isMobile()) setTimeout(()=>Game.lockPointer(),60);
            return;
          }
          $('loadbar').style.right=(100-clamp(r.value[0],0,1)*100).toFixed(1)+'%';
          $('loadmsg').textContent=r.value[1];
          if(performance.now()-t0>11) break;
        }
      }catch(e){ return this.loadError(e); }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  },
  loadError(e){
    console.error(e);
    $('loadmsg').textContent='failed';
    $('loadtip').innerHTML='<b style="color:var(--danger)">'+String(e&&e.message||e)+'</b>';
    setTimeout(()=>this.screen('levels'),2600);
  },

  endScreen(goal,time,dist){
    $('endTitle').textContent=goal.title||'Exit found';
    $('endText').textContent=goal.text||'';
    const m=Math.floor(time/60),s=Math.floor(time%60);
    $('endStats').innerHTML=
      `<div>time <b style="float:right;color:var(--accent)">${m}:${String(s).padStart(2,'0')}</b></div>`+
      `<div>distance walked <b style="float:right;color:var(--accent)">${dist.toFixed(0)} m</b></div>`+
      `<div>seed <b style="float:right;color:var(--accent)">${this.lastSeed}</b></div>`;
    this.show('end');
  },

  /* ---------- settings ---------- */
  buildSettings(){
    const tabs=$('sTabs'),body=$('sBody');
    tabs.innerHTML='';body.innerHTML='';
    SCHEMA.forEach((tab,ti)=>{
      const b=document.createElement('button');
      b.textContent=tab.tab;b.className=ti===0?'on':'';
      b.onclick=()=>{
        [...tabs.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');
        [...body.children].forEach((c,i)=>c.classList.toggle('on',i===ti));
      };
      tabs.appendChild(b);

      const pane=document.createElement('div');
      pane.className='pane'+(ti===0?' on':'');
      tab.items.forEach(it=>pane.appendChild(this.row(it)));
      if(tab.tab==='Quality'){
        const n=document.createElement('div');
        n.className='note';
        n.textContent='Texture resolution, surface detail and ambient occlusion are baked when a level loads — '+
                      'change them and press Rebuild to see the difference.';
        pane.appendChild(n);
      }
      body.appendChild(pane);
    });
    const foot=document.querySelector('.sfoot');
    if(!$('sRebuild')){
      const rb=document.createElement('button');
      rb.className='btn sm';rb.id='sRebuild';rb.textContent='Rebuild level';rb.style.display='none';
      rb.onclick=()=>{ this.hide('settings'); this.startLevel(this.lastLevel,this.lastSeed); };
      foot.insertBefore(rb,foot.querySelector('#sClose'));
    }
  },
  row(it){
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<div class="lbl"><b>${it.n}</b>${it.d?`<small>${it.d}</small>`:''}</div><div class="ctl"></div>`;
    const ctl=r.querySelector('.ctl');
    const v=Settings.data[it.k];
    if(it.t==='range'){
      const inp=document.createElement('input');
      inp.type='range';inp.min=it.min;inp.max=it.max;inp.step=it.step;inp.value=v;
      const out=document.createElement('span');out.className='val';out.textContent=it.fmt?it.fmt(+v):v;
      inp.oninput=()=>{ const nv=parseFloat(inp.value); out.textContent=it.fmt?it.fmt(nv):nv; this.apply(it,nv); };
      ctl.appendChild(inp);ctl.appendChild(out);
      r._set=nv=>{inp.value=nv;out.textContent=it.fmt?it.fmt(+nv):nv;};
    } else if(it.t==='toggle'){
      const t=document.createElement('div');t.className='tog'+(v?' on':'');t.innerHTML='<i></i>';
      t.onclick=()=>{ const nv=!t.classList.contains('on'); t.classList.toggle('on',nv); this.apply(it,nv); };
      ctl.appendChild(t);
      r._set=nv=>t.classList.toggle('on',!!nv);
    } else {
      const s=document.createElement('select');
      it.opts.forEach(([val,lab])=>{
        const o=document.createElement('option');o.value=val;o.textContent=lab;
        if(String(val)===String(v))o.selected=true;
        s.appendChild(o);
      });
      s.onchange=()=>{
        let nv=s.value;
        if(it.opts.every(o=>typeof o[0]==='number')) nv=parseFloat(nv);
        this.apply(it,nv);
      };
      ctl.appendChild(s);
      r._set=nv=>{s.value=String(nv);};
    }
    r.dataset.k=it.k;
    return r;
  },
  refreshRows(){
    document.querySelectorAll('#sBody .row').forEach(r=>{
      if(r._set&&r.dataset.k in Settings.data) r._set(Settings.data[r.dataset.k]);
    });
  },
  apply(it,v){
    const REBUILD=['texSize','normalMaps','aoQuality'];
    if(it.k==='preset'){
      if(v!=='custom'){ Settings.applyPreset(v); Settings.save(); this.refreshRows(); this.markRebuild(true); }
      else Settings.set('preset','custom');
    } else {
      Settings.set(it.k,v);
      if(REBUILD.includes(it.k)) this.markRebuild(true);
    }
    const S=Settings.data;
    if(it.k==='renderScale') R.resize(S.renderScale);
    if(it.k==='aniso') R.setAniso(S.aniso);
    if(it.k==='crosshair') $('cross').style.display=S.crosshair?'block':'none';
    if(it.k==='showFps') $('fps').style.display=S.showFps?'block':'none';
    if(it.k==='device'){ this.syncDeviceSeg(); $('touch').classList.toggle('on',this.cur==='game'&&Game.isMobile()); }
    if(['mute','volMaster','volAmb','volSfx'].includes(it.k)) Audio_.setVolumes(S);
    if(it.k==='preset'){ R.resize(S.renderScale); R.setAniso(S.aniso); }
  },
  markRebuild(on){
    this.rebuildNeeded=on&&!!Game.world;
    const b=$('sRebuild'); if(b) b.style.display=this.rebuildNeeded?'inline-flex':'none';
  },
  openSettings(){ this.markRebuild(this.rebuildNeeded); this.refreshRows(); this.show('settings'); },
  closeSettings(){
    this.hide('settings');
    if(Game.state==='playing'&&!Game.isMobile()) Game.lockPointer();
  },
  syncDeviceSeg(){
    const d=Settings.data.device;
    [...$('devSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===d));
  },

  /* ---------- about ---------- */
  about(){
    let o=$('aboutOv');
    if(!o){
      o=document.createElement('div');
      o.className='overlay';o.id='aboutOv';
      o.innerHTML=`<div class="pw" style="width:min(520px,88vw);text-align:left">
        <h3 style="text-align:center">About</h3>
        <p style="color:var(--dim);font-size:13px;line-height:1.8;margin:0 0 16px">
          <b style="color:var(--ink)">LIMINAL</b> is a walking simulator about spaces that were never meant to be
          stood still in. Everything you see is generated at load time — geometry, textures, lighting and sound
          are all synthesised in the browser. There are no image or audio files anywhere in this project.
        </p>
        <p style="color:var(--dim);font-size:13px;line-height:1.8;margin:0 0 16px">
          Each space is a separate <code style="color:var(--accent)">level.*.js</code> file sitting next to
          <code style="color:var(--accent)">index.html</code>. Drop another one in the folder and it appears
          in the list. Write your own against the builder API — the README explains it.
        </p>
        <div class="facts" style="margin-bottom:18px">
          <div>Renderer <b>WebGL 2 · forward+voxel occlusion</b></div>
          <div>Version <b>${VERSION}</b></div>
        </div>
        <button class="btn primary" id="aboutClose">Close</button></div>`;
      $('ui').appendChild(o);
      o.querySelector('#aboutClose').onclick=()=>o.classList.remove('on');
    }
    o.classList.add('on');
  },

  /* ---------- menu background ---------- */
  startMenuBG(){
    const cv=$('menubg'),g=cv.getContext('2d');
    let t=0,raf;
    const draw=()=>{
      raf=requestAnimationFrame(draw);
      if(cv.style.display==='none')return;
      const w=cv.width=Math.floor(innerWidth*0.5), h=cv.height=Math.floor(innerHeight*0.5);
      t+=0.006;
      const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#f0d64b';
      g.fillStyle='#08080a';g.fillRect(0,0,w,h);
      const cxp=w*0.5, cyp=h*0.52;
      const N=16;
      for(let i=N-1;i>=0;i--){
        const s=((i/N)+ (t%(1/N))*1)%1;
        const k=Math.pow(s,2.1);
        const ww=w*(0.06+k*1.5), hh=h*(0.10+k*1.5);
        const a=(1-s)*0.5*Math.min(1,s*6);
        g.globalAlpha=a*0.5;
        g.fillStyle=i%2?'#141207':'#0e0d09';
        g.fillRect(cxp-ww/2,cyp-hh/2,ww,hh);
        g.globalAlpha=a;
        g.strokeStyle=acc;g.lineWidth=1;
        g.strokeRect(cxp-ww/2,cyp-hh/2,ww,hh);
        // ceiling strip light
        g.globalAlpha=a*(0.55+0.45*Math.sin(t*40+i));
        g.fillStyle=acc;
        g.fillRect(cxp-ww*0.10,cyp-hh/2+hh*0.02,ww*0.20,Math.max(1,hh*0.012));
      }
      g.globalAlpha=1;
      const grd=g.createRadialGradient(cxp,cyp,0,cxp,cyp,Math.max(w,h)*0.7);
      grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,0.88)');
      g.fillStyle=grd;g.fillRect(0,0,w,h);
    };
    draw();
  },

  /* ---------- wiring ---------- */
  init(){
    this.buildSettings();
    this.syncDeviceSeg();
    this.startMenuBG();

    $('mPlay').onclick=()=>{ Audio_.init();Audio_.resume(); this.screen('levels'); };
    $('mSettings').onclick=()=>this.openSettings();
    $('mAbout').onclick=()=>this.about();
    [...$('devSeg').children].forEach(b=>b.onclick=()=>{
      Settings.set('device',b.dataset.v);this.syncDeviceSeg();
      $('touch').classList.toggle('on',this.cur==='game'&&Game.isMobile());
      this.refreshRows();
    });

    $('lvBack').onclick=()=>this.screen('menu');
    $('lvRescan').onclick=()=>{ this.toast&&0; $('lvRescan').textContent='Scanning…';
      this.discover().then(()=>{$('lvRescan').textContent='Rescan';}); };
    $('lvLoad').onclick=()=>$('lvFile').click();
    $('lvFile').onchange=e=>{ [...e.target.files].forEach(f=>this.loadFromFile(f)); e.target.value=''; };

    $('pResume').onclick=()=>Game.resume();
    $('pSettings').onclick=()=>this.openSettings();
    $('pRestart').onclick=()=>{ this.hide('pause'); this.startLevel(this.lastLevel,this.lastSeed); };
    $('pLevels').onclick=()=>{ this.hide('pause');Game.stop();R.disposeWorld();this.screen('levels'); };
    $('pMenu').onclick=()=>{ this.hide('pause');Game.stop();R.disposeWorld();this.screen('menu'); };

    $('sClose').onclick=()=>this.closeSettings();
    $('sReset').onclick=()=>{ Settings.reset();this.refreshRows();this.syncDeviceSeg();
      R.resize(Settings.data.renderScale);this.markRebuild(true); };

    $('eAgain').onclick=()=>{ this.hide('end');this.startLevel(this.lastLevel,this.lastSeed); };
    $('eLevels').onclick=()=>{ this.hide('end');Game.stop();R.disposeWorld();this.screen('levels'); };
    $('eMenu').onclick=()=>{ this.hide('end');Game.stop();R.disposeWorld();this.screen('menu'); };

    LIMINAL.onRegister=()=>{ if(this.cur==='levels'||this.cur==='menu') this.renderCards(); };

    $('verLine').textContent='v'+VERSION;
    this.screen('menu');
    this.discover();
  }
};

/* ---------------------------------------------------------------- boot */
(function boot(){
  Settings.load();
  const ok=R.init($('gl'));
  if(!ok){
    $('fatalMsg').innerHTML='This needs <b>WebGL 2</b>, which this browser did not provide.<br><br>'+
      'Try a recent Chrome, Edge, Firefox or Safari, and make sure hardware acceleration is enabled.';
    $('fatal').classList.add('on');
    return;
  }
  try{
    R.resize(Settings.data.renderScale);
  }catch(e){
    $('fatalMsg').textContent=String(e.message||e);
    $('fatal').classList.add('on');
    return;
  }
  $('glLine').textContent=R.hdr?'webgl2 · hdr':'webgl2';
  bindInput();
  UI.init();
  addEventListener('pointerdown',()=>{Audio_.init();Audio_.resume();},{once:true});
})();
</script>
</body>
</html>
