<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Returning Swallow</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #0c0908 radial-gradient(ellipse at 50% 45%, #1c1411 0%, #0c0908 62%, #050303 100%);
}
body {
  display: grid;
  place-items: center;
}
#stage {
  position: relative;
  line-height: 0;
  box-shadow: 0 0 0 1px #2b201a, 0 0 0 4px #0a0706, 0 0 0 5px #3a2a1e, 0 18px 70px #000;
}
#screen {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  outline: none;
}

</style>
</head>
<body>
<main id="stage">
  <canvas id="screen" width="480" height="270" aria-label="Returning Swallow"></canvas>
</main>
<script>
(() => {
'use strict';
// ==== core/util.js ====
// ---------------------------------------------------------------------------
// Shared constants, math, random, noise and color helpers.
// ---------------------------------------------------------------------------
const VW = 480, VH = 270, TS = 16;
const TAU = Math.PI * 2, DEG = Math.PI / 180;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, s) => (v < t ? Math.min(v + s, t) : Math.max(v - s, t));
const sgn = v => (v < 0 ? -1 : v > 0 ? 1 : 0);
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const chance = p => Math.random() < p;
// direction vector for the rig's angle convention: 0 = down, 90 = forward (+x), 180 = up
const dv = a => [Math.sin(a * DEG), Math.cos(a * DEG)];

const Ease = {
  lin: t => t,
  in: t => t * t,
  out: t => 1 - (1 - t) * (1 - t),
  io: t => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t)),
  out3: t => 1 - Math.pow(1 - t, 3),
  in3: t => t * t * t,
  back: t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2),
};

// Deterministic generator for procedural art: same seed, same world.
class RNG {
  constructor(seed = 1) { this.s = (seed >>> 0) || 1; }
  next() {
    let t = (this.s = (this.s + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  r(a = 1, b) { return b === undefined ? this.next() * a : a + this.next() * (b - a); }
  i(a, b) { return Math.floor(a + this.next() * (b - a + 1)); }
  pick(a) { return a[Math.floor(this.next() * a.length)]; }
  ch(p) { return this.next() < p; }
}

function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const smooth = t => t * t * (3 - 2 * t);
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = smooth(x - xi), yf = smooth(y - yi);
  return lerp(lerp(hash2(xi, yi, s), hash2(xi + 1, yi, s), xf), lerp(hash2(xi, yi + 1, s), hash2(xi + 1, yi + 1, s), xf), yf);
}
function fbm(x, y, oct = 4, s = 0) {
  let v = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { v += vnoise(x * f, y * f, s + i * 17) * a; n += a; a *= 0.5; f *= 2; }
  return v / n;
}
// Periodic 1D noise, used so parallax strips tile without seams.
function pnoise(x, period, s = 0) {
  const xi = Math.floor(x), xf = smooth(x - xi);
  const m = k => ((k % period) + period) % period;
  return lerp(hash2(m(xi), 7, s), hash2(m(xi + 1), 7, s), xf);
}
function pfbm(x, period, oct = 4, s = 0) {
  let v = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { v += pnoise(x * f, period * f, s + i * 31) * a; n += a; a *= 0.5; f *= 2; }
  return v / n;
}

const _rgb = new Map();
function rgb(h) {
  let v = _rgb.get(h);
  if (!v) { const n = parseInt(h.slice(1), 16); v = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; _rgb.set(h, v); }
  return v;
}
const hex = (r, g, b) => '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1);
function mix(a, b, t) { const A = rgb(a), B = rgb(b); return hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function rgba(h, a) { const c = rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
// sample a list of hex stops at t in [0,1]
function ramp(stops, t) {
  t = clamp(t, 0, 1) * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(t));
  return mix(stops[i], stops[i + 1], t - i);
}

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bayer = (x, y) => BAYER[((y & 3) << 2) | (x & 3)];

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
function ctxOf(c) { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; }

function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
  const t = L2 ? clamp(((px - ax) * dx + (py - ay) * dy) / L2, 0, 1) : 0;
  return Math.hypot(px - ax - dx * t, py - ay - dy * t);
}

// ==== core/input.js ====
// ---------------------------------------------------------------------------
// Keyboard and gamepad input with per-tick edge detection. Two keyboard
// layouts are live at once: WASD + J/K/L/U/I/O and arrows + Z/X/C/V/B.
// ---------------------------------------------------------------------------
const Input = (() => {
  const B = {
    left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
    jump: ['Space', 'KeyK', 'KeyZ'], attack: ['KeyJ', 'KeyX'], dash: ['KeyL', 'ShiftLeft', 'ShiftRight'],
    guard: ['KeyU', 'KeyC'], qi: ['KeyI', 'KeyV'], ult: ['KeyO', 'KeyB'],
    pause: ['Escape', 'KeyP'], confirm: ['Enter', 'Space', 'KeyJ', 'KeyZ', 'KeyX'], back: ['Escape', 'Backspace'],
    skip: ['Tab'],
  };
  const PAD = {
    jump: [0], attack: [2], dash: [1, 5], qi: [3], guard: [4, 6], ult: [7], pause: [9], confirm: [0, 9], back: [1],
    up: [12], down: [13], left: [14], right: [15], skip: [8],
  };
  const block = new Set(['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab']);
  const down = new Set(), tapped = new Set(), listeners = [];
  const held = {}, hit = {}, rel = {}, virt = {};
  let lastDevice = 'key';

  addEventListener('keydown', e => {
    if (block.has(e.code)) e.preventDefault();
    if (!e.repeat) tapped.add(e.code);
    down.add(e.code);
    lastDevice = 'key';
    for (const f of listeners) f(e);
  });
  addEventListener('keyup', e => down.delete(e.code));
  addEventListener('blur', () => down.clear());

  function pad() {
    const out = {};
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gps) {
      if (!gp) continue;
      for (const a in PAD) for (const b of PAD[a]) if (gp.buttons[b] && gp.buttons[b].pressed) { out[a] = true; lastDevice = 'pad'; }
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (ax < -0.45) out.left = true;
      if (ax > 0.45) out.right = true;
      if (ay < -0.6) out.up = true;
      if (ay > 0.6) out.down = true;
    }
    return out;
  }

  function update() {
    const p = pad();
    for (const a in B) {
      const k = B[a].some(c => down.has(c)) || !!p[a] || !!virt[a];
      const t = B[a].some(c => tapped.has(c));
      hit[a] = !held[a] && (k || t);
      rel[a] = !!held[a] && !k;
      held[a] = k;
    }
    tapped.clear();
  }
  function flush() { for (const a in B) hit[a] = false; tapped.clear(); }

  return {
    update, flush, B,
    held: a => !!held[a], hit: a => !!hit[a], rel: a => !!rel[a],
    onKey: f => listeners.push(f),
    // used by the automated test harness to drive the game
    setVirtual: (a, v) => { virt[a] = v; },
    device: () => lastDevice,
  };
})();

// ==== core/audio.js ====
// ---------------------------------------------------------------------------
// Audio engine: every sound is synthesized with WebAudio (no samples).
// Sword swishes are swept band-passed noise, parries are inharmonic metal
// partials, drums are pitch-dropping sines, plucked strings use
// Karplus-Strong buffers rendered at startup.
// ---------------------------------------------------------------------------
const AudioSys = {
  ctx: null, ready: false, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.gain.value = 0.85;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.2;
    this.master.connect(comp); comp.connect(ctx.destination);
    this.sfx = ctx.createGain(); this.sfx.gain.value = 0.75; this.sfx.connect(this.master);
    this.mus = ctx.createGain(); this.mus.gain.value = 0.42; this.mus.connect(this.master);
    this.verb = ctx.createConvolver(); this.verb.buffer = this.impulse(2.6, 2.4);
    this.verbOut = ctx.createGain(); this.verbOut.gain.value = 0.32;
    this.verb.connect(this.verbOut); this.verbOut.connect(this.master);
    const n = ctx.sampleRate * 2, nb = ctx.createBuffer(1, n, ctx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = nb;
    this.ready = true;
    Music.prepare();
  },
  impulse(sec, decay) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  },
  setMute(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.85; },
};

// ---- synth helpers --------------------------------------------------------
function aEnv(g, t, a, d, peak, sustain = 0) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, sustain || 0.0001), t + a + d);
}
function aOsc(type, f0, t, dur, peak, o = {}) {
  const A = AudioSys, ctx = A.ctx;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f0, t);
  if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + (o.fT || dur));
  if (o.detune) osc.detune.value = o.detune;
  aEnv(g, t, o.a || 0.004, dur, peak);
  osc.connect(g);
  let out = g;
  if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; g.connect(f); out = f; }
  out.connect(o.dest || A.sfx);
  if (o.verb) out.connect(A.verb);
  osc.start(t); osc.stop(t + (o.a || 0.004) + dur + 0.05);
  return osc;
}
function aNoise(t, dur, peak, type, f0, o = {}) {
  const A = AudioSys, ctx = A.ctx;
  const src = ctx.createBufferSource(); src.buffer = A.noiseBuf;
  src.playbackRate.value = o.rate || 1;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, t); f.Q.value = o.q || 1;
  if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + (o.fT || dur));
  const g = ctx.createGain();
  aEnv(g, t, o.a || 0.003, dur, peak);
  src.connect(f); f.connect(g); g.connect(o.dest || A.sfx);
  if (o.verb) g.connect(A.verb);
  src.start(t, Math.random() * 1.5); src.stop(t + (o.a || 0.003) + dur + 0.05);
}
function aMetal(t, base, parts, dur, peak, o = {}) {
  for (let i = 0; i < parts.length; i++) aOsc(i % 2 ? 'triangle' : 'sine', base * parts[i], t, dur * (1 - i * 0.12), peak / (1 + i * 0.7), { verb: o.verb, f1: o.bend ? base * parts[i] * o.bend : undefined });
}

const SOUNDS = {
  swing(A, t) { aNoise(t, 0.13, 0.32, 'bandpass', rnd(2600, 3400), { f1: 700, q: 1.6 }); },
  swing2(A, t) { aNoise(t, 0.2, 0.34, 'bandpass', 1600, { f1: 420, q: 1.3 }); },
  spin(A, t) { aNoise(t, 0.12, 0.26, 'bandpass', 3000, { f1: 900, q: 1.5 }); aNoise(t + 0.09, 0.14, 0.26, 'bandpass', 2600, { f1: 700, q: 1.5 }); },
  thrust(A, t) { aNoise(t, 0.09, 0.3, 'highpass', 1800, { f1: 5000 }); aOsc('sine', 2600, t + 0.04, 0.12, 0.05); },
  hit(A, t) { aNoise(t, 0.07, 0.5, 'lowpass', 2600); aOsc('sine', 170, t, 0.12, 0.6, { f1: 48 }); aNoise(t, 0.02, 0.3, 'highpass', 3000); },
  hitHeavy(A, t) { aNoise(t, 0.16, 0.6, 'lowpass', 1800); aOsc('sine', 130, t, 0.26, 0.8, { f1: 34 }); aOsc('square', 60, t, 0.1, 0.12, { f1: 30, lp: 400 }); },
  hitBlunt(A, t) { aNoise(t, 0.08, 0.4, 'lowpass', 900); aOsc('sine', 120, t, 0.18, 0.7, { f1: 40 }); },
  block(A, t) { aMetal(t, 720, [1, 2.31, 3.92], 0.16, 0.2); aNoise(t, 0.03, 0.35, 'highpass', 2500); },
  clang(A, t) { aMetal(t, 520, [1, 2.4, 3.9, 5.3], 0.4, 0.3, { verb: 1 }); aNoise(t, 0.05, 0.4, 'highpass', 2000); },
  parry(A, t) { aMetal(t, 1180, [1, 2.76, 5.4, 8.93], 0.9, 0.34, { verb: 1 }); aNoise(t, 0.05, 0.5, 'highpass', 3000); aOsc('sine', 90, t, 0.3, 0.4, { f1: 40 }); },
  clink(A, t) { aMetal(t, 1900, [1, 2.7], 0.08, 0.08); },
  guard(A, t) { aNoise(t, 0.05, 0.14, 'highpass', 4200); },
  jump(A, t) { aNoise(t, 0.12, 0.12, 'bandpass', 600, { f1: 1600, q: 1.2 }); },
  djump(A, t) { aNoise(t, 0.2, 0.16, 'bandpass', 1200, { f1: 3400, q: 2 }); aOsc('sine', 620, t, 0.16, 0.06, { f1: 1240 }); },
  land(A, t) { aNoise(t, 0.07, 0.25, 'lowpass', 500); aOsc('sine', 90, t, 0.08, 0.3, { f1: 50 }); },
  step(A, t) { aNoise(t, 0.025, 0.07, 'lowpass', 1400); },
  dash(A, t) { aNoise(t, 0.22, 0.28, 'bandpass', 500, { f1: 2600, q: 1.1, fT: 0.12 }); },
  dive(A, t) { aNoise(t, 0.3, 0.26, 'bandpass', 3000, { f1: 500, q: 1.5 }); },
  slam(A, t) { aNoise(t, 0.25, 0.6, 'lowpass', 700); aOsc('sine', 80, t, 0.5, 0.9, { f1: 28, verb: 1 }); },
  heavy(A, t) { aNoise(t, 0.18, 0.5, 'lowpass', 900); aOsc('sine', 100, t, 0.3, 0.7, { f1: 34 }); },
  qicharge(A, t) { aOsc('sine', 300, t, 0.35, 0.12, { f1: 900 }); aOsc('triangle', 600, t, 0.35, 0.05, { f1: 1800 }); },
  wave(A, t) { aNoise(t, 0.3, 0.4, 'bandpass', 900, { f1: 3200, q: 1 }); for (const f of [880, 1320, 1760]) aOsc('sine', f, t, 0.6, 0.06, { verb: 1 }); },
  tell(A, t) { aOsc('sine', 2500, t, 0.09, 0.08); aOsc('sine', 3750, t, 0.06, 0.03); },
  alert(A, t) { aOsc('sine', 190, t, 0.1, 0.25, { f1: 120 }); },
  hurt(A, t) { aNoise(t, 0.1, 0.4, 'lowpass', 1500); aOsc('sawtooth', 280, t, 0.18, 0.12, { f1: 110, lp: 900 }); },
  kill(A, t) { aNoise(t, 0.2, 0.35, 'bandpass', 1400, { f1: 300 }); aOsc('sine', 70, t + 0.02, 0.4, 0.5, { f1: 30 }); aMetal(t + 0.02, 330, [1, 2.4], 0.5, 0.05, { verb: 1 }); },
  death(A, t) { aMetal(t, 110, [1, 1.48, 1.93, 2.53], 2.6, 0.3, { verb: 1, bend: 0.94 }); },
  throw(A, t) { aNoise(t, 0.1, 0.18, 'bandpass', 2400, { f1: 1200, q: 2 }); },
  draw(A, t) { aOsc('sawtooth', 70, t, 0.35, 0.05, { f1: 95, lp: 500 }); },
  bow(A, t) { aOsc('triangle', 220, t, 0.14, 0.2, { f1: 90 }); aNoise(t, 0.08, 0.15, 'bandpass', 1800); },
  crack(A, t) { aNoise(t, 0.04, 0.3, 'highpass', 2000); },
  shatter(A, t) { for (let i = 0; i < 4; i++) aNoise(t + i * 0.03, 0.06, 0.28 - i * 0.05, 'highpass', 2400 + i * 500); aOsc('sine', 180, t, 0.08, 0.2, { f1: 90 }); },
  wood(A, t) { aOsc('sine', 420, t, 0.06, 0.3, { f1: 230 }); aNoise(t, 0.04, 0.2, 'bandpass', 900); },
  woodBreak(A, t) { SOUNDS.wood(A, t); aNoise(t + 0.03, 0.15, 0.3, 'bandpass', 700, { f1: 300 }); },
  qiPick(A, t) { aOsc('sine', rnd(1700, 1900), t, 0.14, 0.06); aOsc('sine', 2700, t + 0.02, 0.1, 0.03); },
  heal(A, t) { [0, 0.07, 0.14].forEach((d, i) => aOsc('sine', [880, 1109, 1319][i], t + d, 0.4, 0.09, { verb: 1 })); },
  splash(A, t) { aNoise(t, 0.4, 0.4, 'lowpass', 2400, { f1: 400 }); },
  spike(A, t) { aNoise(t, 0.2, 0.4, 'bandpass', 1600, { f1: 500 }); aMetal(t, 900, [1, 2.2, 3.7], 0.3, 0.1); },
  thud(A, t) { aNoise(t, 0.08, 0.3, 'lowpass', 350); aOsc('sine', 75, t, 0.12, 0.35, { f1: 40 }); },
  deny(A, t) { aOsc('square', 140, t, 0.05, 0.05, { lp: 800 }); aOsc('square', 110, t + 0.07, 0.07, 0.05, { lp: 800 }); },
  ultStart(A, t) { SOUNDS.gong(A, t); aNoise(t, 0.6, 0.3, 'bandpass', 300, { f1: 4000, q: 1 }); },
  sheathe(A, t) { aNoise(t, 0.35, 0.2, 'highpass', 1500, { f1: 6000 }); aMetal(t + 0.36, 1600, [1, 2.7], 0.2, 0.15); },
  ultHit(A, t) { aNoise(t, 0.5, 0.8, 'lowpass', 1600); aOsc('sine', 90, t, 0.9, 1, { f1: 26, verb: 1 }); for (const f of [220, 330, 440]) aOsc('sawtooth', f, t, 0.8, 0.04, { lp: 1200, verb: 1 }); },
  gong(A, t) { aMetal(t, 98, [1, 1.48, 1.93, 2.53, 3.02, 4.1], 3.2, 0.42, { verb: 1, bend: 0.96 }); aNoise(t, 0.05, 0.3, 'lowpass', 800); },
  bell(A, t) { aMetal(t, 196, [1, 2, 2.76, 5.4], 4, 0.3, { verb: 1 }); },
  drum(A, t) { aOsc('sine', 95, t, 0.4, 0.8, { f1: 45 }); aNoise(t, 0.06, 0.3, 'lowpass', 600); },
  text(A, t, o) { aOsc('square', o.pitch || 520, t, 0.025, 0.018, { lp: 1800 }); },
  menu(A, t) { aOsc('triangle', 660, t, 0.05, 0.08); },
  select(A, t) { aOsc('triangle', 880, t, 0.08, 0.1); aOsc('triangle', 1320, t + 0.06, 0.12, 0.08); },
  shrine(A, t) { SOUNDS.bell(A, t); SOUNDS.heal(A, t + 0.1); },
  fire(A, t) { aNoise(t, 0.3, 0.1, 'bandpass', 800, { f1: 300 }); },
  thunder(A, t) { aNoise(t, 1.6, 0.6, 'lowpass', 500, { f1: 120 }); aOsc('sine', 50, t, 1.2, 0.5, { f1: 28, verb: 1 }); },
  whoosh(A, t) { aNoise(t, 0.5, 0.2, 'bandpass', 400, { f1: 1800, q: 0.8 }); },
  vanish(A, t) { aNoise(t, 0.3, 0.25, 'highpass', 1200, { f1: 300 }); aOsc('sine', 900, t, 0.2, 0.05, { f1: 300 }); },
};

const SFX = {
  last: {},
  play(name, o = {}) {
    const A = AudioSys;
    if (!A.ready || A.muted) return;
    const t = A.ctx.currentTime;
    if (this.last[name] && t - this.last[name] < 0.035) return;
    this.last[name] = t;
    const f = SOUNDS[name];
    if (f) try { f(A, t + 0.005, o); } catch (e) { /* audio node limits: drop the sound */ }
  },
};

// ==== core/music.js ====
// ---------------------------------------------------------------------------
// Music: a look-ahead sequencer playing patterns written in jianpu (Chinese
// numbered notation). 1..7 are scale degrees, ' raises and , lowers an
// octave, - holds, 0 rests. Drum lanes use x (hit), X (accent), . (rest).
// Instruments: guzheng and pipa (Karplus-Strong), dizi, erhu, bass, taiko,
// woodblock, small cymbal, gong.
// ---------------------------------------------------------------------------
const Music = {
  bufs: {}, cur: null, timer: null, step: 0, next: 0, vol: 1, ready: false,
  prepare() {
    const A = AudioSys, ctx = A.ctx;
    // Karplus-Strong plucks rendered once per MIDI note
    const sr = 22050;
    for (let m = 38; m <= 91; m++) {
      const f = 440 * Math.pow(2, (m - 69) / 12);
      for (const kind of ['zheng', 'pipa']) {
        const dur = kind === 'zheng' ? 2.2 : 0.9, len = Math.floor(sr * dur), N = Math.max(2, Math.round(sr / f));
        const b = ctx.createBuffer(1, len, sr), d = b.getChannelData(0);
        const decay = kind === 'zheng' ? 0.996 : 0.985, bright = kind === 'zheng' ? 0.5 : 0.62;
        const dl = new Float32Array(N);
        for (let i = 0; i < N; i++) dl[i] = (Math.random() * 2 - 1) * (i < N * 0.5 ? 1 : 0.6);
        let p = 0, prev = 0;
        for (let i = 0; i < len; i++) {
          const nx = (p + 1) % N;
          const v = dl[p];
          dl[p] = decay * (bright * v + (1 - bright) * dl[nx]);
          d[i] = v * 0.5 + prev * 0.5; prev = v;
          p = nx;
        }
        this.bufs[kind + m] = b;
      }
    }
    this.ready = true;
  },
  play(name) {
    if (!AudioSys.ready) { this.pending = name; return; }
    if (this.cur && this.cur.name === name) return;
    this.stop(0.6);
    const S = SONGS[name];
    if (!S) return;
    const A = AudioSys;
    this.bus = A.ctx.createGain();
    this.bus.gain.setValueAtTime(0.0001, A.ctx.currentTime);
    this.bus.gain.exponentialRampToValueAtTime(1, A.ctx.currentTime + 1.2);
    this.bus.connect(A.mus);
    this.cur = { name, S, seq: expandSong(S) };
    this.step = 0; this.next = A.ctx.currentTime + 0.1;
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop(fade = 0.8) {
    clearInterval(this.timer); this.timer = null;
    if (this.bus && AudioSys.ctx) {
      const b = this.bus, t = AudioSys.ctx.currentTime;
      b.gain.cancelScheduledValues(t); b.gain.setValueAtTime(b.gain.value || 0.001, t); b.gain.exponentialRampToValueAtTime(0.0001, t + fade);
      setTimeout(() => b.disconnect(), fade * 1000 + 100);
    }
    this.bus = null; this.cur = null;
  },
  tick() {
    const A = AudioSys, C = this.cur;
    if (!C) return;
    const spb = 60 / C.S.bpm / 2;
    while (this.next < A.ctx.currentTime + 0.15) {
      const st = this.step % C.seq.len;
      const swing = C.S.swing && st % 2 ? spb * C.S.swing : 0;
      for (const tr of C.seq.tracks) {
        const ev = tr.steps[st];
        if (ev) playInst(tr.inst, ev, this.next + swing, spb, tr.vol, C.S.key, this.bus);
      }
      this.next += spb; this.step++;
    }
  },
};

const SCALE = [0, 2, 4, 5, 7, 9, 11];
function parseTok(tok, key) {
  const deg = parseInt(tok[0], 10);
  if (!deg) return null;
  let oct = 0;
  for (const c of tok.slice(1)) { if (c === "'") oct++; if (c === ',') oct--; }
  const sharp = tok.includes('#') ? 1 : 0;
  return key + SCALE[deg - 1] + oct * 12 + sharp;
}
// song -> flat per-step events with note lengths resolved from holds
function expandSong(S) {
  const tracks = [];
  let len = 0;
  for (const tr of S.tracks) {
    const toks = [];
    for (const sec of S.order) for (const bar of (tr.parts[sec] || tr.parts.A)) toks.push(...bar.trim().split(/\s+/));
    len = Math.max(len, toks.length);
    const steps = new Array(toks.length).fill(null);
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (t === '-' || t === '0' || t === '.') continue;
      if (/^[xXoO]$/.test(t)) { steps[i] = { hit: t }; continue; }
      let hold = 1;
      while (toks[i + hold] === '-') hold++;
      steps[i] = { note: t, hold };
    }
    tracks.push({ inst: tr.inst, vol: tr.vol || 1, steps });
  }
  for (const t of tracks) while (t.steps.length < len) t.steps.push(...t.steps.slice(0, len - t.steps.length));
  return { tracks, len };
}

function playInst(inst, ev, t, spb, vol, key, bus) {
  const A = AudioSys, ctx = A.ctx;
  if (ev.hit) {
    const acc = ev.hit === 'X' || ev.hit === 'O' ? 1.4 : 1;
    const g = (peak) => peak * vol * acc;
    if (inst === 'taiko') { aOsc('sine', 90, t, 0.45, g(0.7), { f1: 42, dest: bus }); aNoise(t, 0.05, g(0.25), 'lowpass', 500, { dest: bus }); }
    else if (inst === 'tom') aOsc('sine', 190, t, 0.18, g(0.35), { f1: 110, dest: bus });
    else if (inst === 'wood') { aOsc('sine', 1100, t, 0.05, g(0.22), { f1: 900, dest: bus }); aNoise(t, 0.015, g(0.1), 'bandpass', 2000, { dest: bus }); }
    else if (inst === 'bo') aNoise(t, 0.2, g(0.1), 'highpass', 6000, { dest: bus });
    else if (inst === 'gong') aMetal(t, 98, [1, 1.48, 1.93, 2.53], 2.4, g(0.2), { verb: 1 });
    return;
  }
  const m = parseTok(ev.note, key);
  if (m === null) return;
  const f = 440 * Math.pow(2, (m - 69) / 12), dur = ev.hold * spb;
  if (inst === 'zheng' || inst === 'pipa' || inst === 'tremolo') {
    const b = Music.bufs[(inst === 'zheng' ? 'zheng' : 'pipa') + clamp(m, 38, 91)];
    if (!b) return;
    const reps = inst === 'tremolo' ? Math.max(1, Math.round(dur / 0.07)) : 1;
    for (let r = 0; r < reps; r++) {
      const s = ctx.createBufferSource(); s.buffer = b;
      const g = ctx.createGain(); g.gain.value = 0.9 * vol * (r ? 0.6 : 1);
      s.connect(g); g.connect(bus); if (inst === 'zheng') g.connect(A.verb);
      const tt = t + r * 0.07;
      s.start(tt);
      if (inst === 'zheng' && ev.hold >= 3) { s.playbackRate.setValueAtTime(1, tt + 0.25); s.playbackRate.linearRampToValueAtTime(1.012, tt + 0.5); s.playbackRate.linearRampToValueAtTime(0.996, tt + 0.8); }
      s.stop(tt + (inst === 'zheng' ? 2.2 : 0.9));
    }
    return;
  }
  const osc = ctx.createOscillator(), g = ctx.createGain(), flt = ctx.createBiquadFilter();
  const lfo = ctx.createOscillator(), lg = ctx.createGain();
  osc.frequency.value = f;
  lfo.frequency.value = inst === 'erhu' ? 5.6 : 5; lg.gain.value = 0;
  lfo.connect(lg); lg.connect(osc.frequency);
  osc.connect(flt); flt.connect(g); g.connect(bus); g.connect(A.verb);
  let peak = 0.12 * vol, a = 0.03, rel = 0.12;
  if (inst === 'erhu') { osc.type = 'sawtooth'; flt.type = 'bandpass'; flt.frequency.value = f * 2.2; flt.Q.value = 0.9; a = 0.09; peak = 0.16 * vol; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.012, t + Math.min(dur, 0.5)); }
  else if (inst === 'dizi') { osc.type = 'triangle'; flt.type = 'lowpass'; flt.frequency.value = f * 4; a = 0.04; peak = 0.14 * vol; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.008, t + Math.min(dur, 0.4)); aNoise(t, Math.min(dur, 0.12), 0.02 * vol, 'bandpass', f * 2, { q: 2, dest: bus }); }
  else if (inst === 'bass') { osc.type = 'triangle'; flt.type = 'lowpass'; flt.frequency.value = 400; peak = 0.22 * vol; a = 0.01; }
  else if (inst === 'drone') { osc.type = 'sawtooth'; flt.type = 'lowpass'; flt.frequency.value = 300; peak = 0.07 * vol; a = 0.4; rel = 0.6; }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + Math.max(a, dur - rel * 0.5));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel);
  osc.start(t); lfo.start(t);
  osc.stop(t + dur + rel + 0.05); lfo.stop(t + dur + rel + 0.05);
}

// ==== gfx/rig.js ====
// ---------------------------------------------------------------------------
// Pixel rig renderer.
// A pose (joint angles) is solved into joint positions; every body part is
// rasterized as a lit primitive into a material buffer; a post pass turns the
// buffer into pixel art with depth separation lines between overlapping
// limbs, a rim light on lit edges and selective (material tinted) outlines.
// Rendered frames are cached per (costume, animation, key, sub-frame).
//
// Angle convention: 0 = down, 90 = forward (+x), 180 = up. Characters are
// authored facing right and mirrored at draw time.
// ---------------------------------------------------------------------------
const LX = 0.45, LY = -0.75, LZ = 0.48; // light from the upper front

const NOSEP = new Set([
  GR.ROBEB * 16 + GR.BODY, GR.BODY * 16 + GR.ROBEF, GR.ROBEB * 16 + GR.ROBEF,
  GR.BARM * 16 + GR.BWEAP, GR.FARM * 16 + GR.FWEAP,
]);
const SH_CLOTH = { dither: 0.55 };
const SH_SKIN = { bias: 0.15 };
const SH_METAL = { shiny: true, bias: 0.3 };

const SH_FLAT = {};

class PixBuf {
  constructor(w, h, ax, ay) {
    this.w = w; this.h = h; this.ax = ax; this.ay = ay;
    const n = w * h;
    this.m = new Uint8Array(n); this.s = new Int8Array(n); this.g = new Uint8Array(n); this.f = new Uint8Array(n);
  }
  clear() { this.m.fill(0); this.s.fill(0); this.g.fill(0); this.f.fill(0); }
}
const RB = new PixBuf(152, 136, 76, 104);

function bput(B, x, y, m, s, g, f) {
  if (x < 0 || y < 0 || x >= B.w || y >= B.h) return;
  const i = y * B.w + x;
  B.m[i] = m; B.s[i] = s; B.g[i] = g; B.f[i] = f;
}

function lumShade(l, x, y, o) {
  let v = (l + 0.9) * 2 + (o.bias || 0);
  if (o.dither) v += (bayer(x, y) - 0.5) * o.dither;
  let s = Math.floor(v);
  const mx = o.max === undefined ? 3 : o.max;
  if (s > mx) s = mx;
  if (s < 0) s = 0;
  if (o.shiny && l > 0.84) s = 4;
  return s;
}

// Tapered capsule from a to b with radii ra, rb; lit like a cylinder.
// o.band: [[t0, t1, mat, shadeDelta]] material bands along the length
// o.pat(u, v, x, y, t): shade delta pattern (u = px along, v = -1..1 across)
function seg(B, ax, ay, bx, by, ra, rb, mat, grp, o = SH_FLAT) {
  ax += B.ax; ay += B.ay; bx += B.ax; by += B.ay;
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, L = Math.sqrt(L2);
  let nx = 1, ny = 0;
  if (L > 1e-4) { nx = -dy / L; ny = dx / L; }
  const rm = Math.max(ra, rb) + 0.5;
  const x0 = Math.max(0, Math.floor(Math.min(ax, bx) - rm)), x1 = Math.min(B.w - 1, Math.ceil(Math.max(ax, bx) + rm));
  const y0 = Math.max(0, Math.floor(Math.min(ay, by) - rm)), y1 = Math.min(B.h - 1, Math.ceil(Math.max(ay, by) + rm));
  const flat = o.cap === 'flat', fl = o.flag || 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const px = x + 0.5 - ax, py = y + 0.5 - ay;
    const t = L2 > 1e-6 ? (px * dx + py * dy) / L2 : 0;
    if (flat && (t < 0 || t > 1)) continue;
    const tc = t < 0 ? 0 : t > 1 ? 1 : t;
    const qx = px - dx * tc, qy = py - dy * tc;
    const r = ra + (rb - ra) * tc;
    const d2 = qx * qx + qy * qy;
    if (d2 > r * r) continue;
    const sv = (qx * nx + qy * ny) / r;
    let Nx, Ny, Nz;
    if (t < 0 || t > 1 || L < 1e-4) { Nx = qx / r; Ny = qy / r; Nz = Math.sqrt(Math.max(0, 1 - d2 / (r * r))); }
    else { Nx = nx * sv; Ny = ny * sv; Nz = Math.sqrt(Math.max(0, 1 - sv * sv)); }
    let s = lumShade(Nx * LX + Ny * LY + Nz * LZ, x, y, o);
    let m = mat;
    if (o.band) for (const b of o.band) if (tc >= b[0] && tc <= b[1]) { m = b[2]; if (b[3]) s += b[3]; }
    if (o.pat) s += o.pat(tc * L, sv, x, y, tc);
    bput(B, x, y, m, s, grp, fl);
  }

const disc = (B, x, y, r, mat, grp, o) => seg(B, x, y, x, y, r, r, mat, grp, o);

function inPoly(P, x, y) {
  let c = false;
  for (let i = 0, j = P.length - 2; i < P.length; j = i, i += 2) {
    const yi = P[i + 1], yj = P[j + 1];
    if ((yi > y) !== (yj > y) && x < ((P[j] - P[i]) * (y - yi)) / (yj - yi) + P[i]) c = !c;
  }
  return c;
}

// Filled polygon (flat array of local coords).
// o.axis = [ax, ay, bx, by, r]: cylindrical lighting around that axis
// o.hem = [x0, y0, x1, y1, width, mat]: trim band along an edge
function poly(B, pts, mat, grp, o = SH_FLAT) {
  const P = pts.slice();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < P.length; i += 2) {
    P[i] += B.ax; P[i + 1] += B.ay;
    x0 = Math.min(x0, P[i]); x1 = Math.max(x1, P[i]); y0 = Math.min(y0, P[i + 1]); y1 = Math.max(y1, P[i + 1]);
  }
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  x1 = Math.min(B.w - 1, Math.ceil(x1)); y1 = Math.min(B.h - 1, Math.ceil(y1));
  let ax = 0, ay = 0, dx = 0, dy = 1, L2 = 1, nx = 1, ny = 0, R = 1;
  if (o.axis) {
    ax = o.axis[0] + B.ax; ay = o.axis[1] + B.ay;
    dx = o.axis[2] + B.ax - ax; dy = o.axis[3] + B.ay - ay;
    L2 = dx * dx + dy * dy || 1; const L = Math.sqrt(L2);
    nx = -dy / L; ny = dx / L; R = o.axis[4];
  }
  const hem = o.hem;
  const fl = o.flag || 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const cx = x + 0.5, cy = y + 0.5;
    if (!inPoly(P, cx, cy)) continue;
    let s, u = 0, v = 0;
    if (o.axis) {
      const px = cx - ax, py = cy - ay;
      u = (px * dx + py * dy) / L2;
      v = clamp((px * nx + py * ny) / R, -1, 1);
      s = lumShade(nx * v * LX + ny * v * LY + Math.sqrt(1 - v * v) * LZ, x, y, o);
    } else s = o.sh !== undefined ? o.sh : 2;
    let m = mat;
    if (hem && distSeg(cx, cy, hem[0] + B.ax, hem[1] + B.ay, hem[2] + B.ax, hem[3] + B.ay) < hem[4]) { m = hem[5]; if (hem[6] && (x + y * 2) % 4 === 0) m = hem[6]; }
    if (o.pat) s += o.pat(u, v, x, y);
    bput(B, x, y, m, s, grp, fl);
  }
}

// 1px line
function bline(B, x0, y0, x1, y1, m, s, g, f = 0) {
  x0 = Math.floor(x0 + B.ax); y0 = Math.floor(y0 + B.ay); x1 = Math.floor(x1 + B.ax); y1 = Math.floor(y1 + B.ay);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (let n = 0; n < 200; n++) {
    bput(B, x0, y0, m, s, g, f);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }

// Hand drawn sprite (heads) stamped into the buffer, rotatable in 90 degree steps.
function stamp(B, spr, lx, ly, grp, C, rot = 0) {
  const X = Math.floor(lx + B.ax), Y = Math.floor(ly + B.ay);
  for (let sy = 0; sy < spr.h; sy++) for (let sx = 0; sx < spr.w; sx++) {
    const code = spr.d[sy * spr.w + sx];
    if (!code) continue;
    const e = C.hcode[code];
    if (!e) continue;
    let ox = sx - spr.ax, oy = sy - spr.ay;
    for (let r = 0; r < rot; r++) { const t = ox; ox = -oy; oy = t; }
    bput(B, X + ox, Y + oy, e[0], e[1], grp, e[2] | F_KEEP);

const JPTS = ['hip', 'neck', 'sF', 'sB', 'eF', 'wF', 'eB', 'wB', 'hF', 'hB', 'kF', 'aF', 'tF', 'kB', 'aB', 'tB', 'head'];

  J.td = [tdx, tdy]; J.tn = [-tdy, tdx];
  const shx = J.neck[0] - tdx * S.shDown, shy = J.neck[1] - tdy * S.shDown;
  J.sF = [shx - tdy * S.shOff, shy + tdx * S.shOff];
  J.sB = [shx + tdy * S.shOff * 1.4, shy - tdx * S.shOff * 1.4];
  [J.eF, J.wF] = limb(J.sF, P.a1, P.a2, S.ua, S.fa);
  [J.eB, J.wB] = limb(J.sB, P.b1, P.b2, S.ua, S.fa);
  J.faF = P.a1 + P.a2; J.faB = P.b1 + P.b2;
  J.hF = [hx - tdy * 0.6, hy + tdx * 0.6]; J.hB = [hx + tdy * 0.9, hy - tdx * 0.9];
  [J.kF, J.aF] = limb(J.hF, P.l1, P.l2, S.th, S.sh);
  [J.kB, J.aB] = limb(J.hB, P.m1, P.m2, S.th, S.sh);
  const fa = P.lf !== null ? P.lf : clamp(P.l1 + P.l2 + 90, 48, 128);
  const fb = P.mf !== null ? P.mf : clamp(P.m1 + P.m2 + 90, 48, 128);
  let d = dv(fa); J.tF = [J.aF[0] + d[0] * S.foot, J.aF[1] + d[1] * S.foot];
  d = dv(fb); J.tB = [J.aB[0] + d[0] * S.foot, J.aB[1] + d[1] * S.foot];
  J.head = [J.neck[0] + tdx * S.neck + P.hx, J.neck[1] + tdy * S.neck + P.hy];
  J.w = P.w; J.w2 = P.w2; J.hr = 0; J.rot = P.rot;
  if (P.rot) {
    const r = P.rot * DEG, c = Math.cos(r), s = Math.sin(r);
    const cx = hx + tdx * S.torso * 0.35, cy = hy + tdy * S.torso * 0.35;
    for (const k of JPTS) { const p = J[k]; const x = p[0] - cx, y = p[1] - cy; p[0] = cx + x * c - y * s; p[1] = cy + x * s + y * c; }
    for (const k of ['td', 'tn']) { const p = J[k]; const x = p[0], y = p[1]; p[0] = x * c - y * s; p[1] = x * s + y * c; }
    J.w -= P.rot; J.w2 -= P.rot; J.faF -= P.rot; J.faB -= P.rot;
    J.hr = ((Math.round(P.rot / 90) % 4) + 4) % 4;
  }
  if (P.g) {
    let low = Math.max(J.aF[1] + S.rAnk, J.tF[1] + S.rToe, J.aB[1] + S.rAnk, J.tB[1] + S.rToe);
    if (P.rot) {
      for (const k of ['hip', 'neck', 'kF', 'kB', 'wF', 'wB', 'eF', 'eB']) low = Math.max(low, J[k][1] + 2.2);
      const hc = rotOff(0, -5, J.hr);
      low = Math.max(low, J.head[1] + hc[1] + 4.5);
    }
    const sh = -low - 1 + P.y;
    for (const k of JPTS) J[k][1] += sh;
  } else if (P.y) for (const k of JPTS) J[k][1] += P.y;
  return J;
}

// ---------------------------------------------------------------------------
// Body part drawing
// ---------------------------------------------------------------------------
const PAT = {
  // diagonal cloth wraps (leg bindings, bracers)
  wrap: (u, v) => ((Math.floor(u * 0.75 + v * 1.1) & 1) ? -1 : 0),
  // lamellar armor scales in buffer space
  lamellar: (u, v, x, y) => ((y % 3 === 0) || ((x + (((y / 3) | 0) & 1) * 2) % 4 === 0) ? -1 : 0),
  // quilted cloth
  quilt: (u, v, x, y) => (((x + y) % 4 === 0) ? -1 : 0),
  // fur tufts
  fur: (u, v, x, y) => (hash2(x, y, 3) > 0.72 ? -1 : hash2(x, y, 9) > 0.86 ? 1 : 0),
  // robe folds
  fold: (u, v) => (Math.abs(v - 0.15) < 0.14 || Math.abs(v + 0.55) < 0.1 ? -1 : 0),
  // woven belt
  belt: (u, v, x, y) => ((x + y) % 3 === 0 ? -1 : 0),
};

function torsoPt(J, C, u, v) {
  const L = C.body.torso;
  return [J.hip[0] + J.td[0] * u * L + J.tn[0] * v, J.hip[1] + J.td[1] * u * L + J.tn[1] * v];
}

function drawArm(B, C, s, e, w, fAng, grp, front) {
  const S = C.body, M = C.M, A = C.arms;
  seg(B, s[0], s[1], e[0], e[1], S.rUa[0], S.rUa[1], M[A.upper], grp, C.shC);
  const dx = w[0] - e[0], dy = w[1] - e[1], fl = Math.hypot(dx, dy) || 1;
  if (A.wide) {
    seg(B, e[0], e[1], w[0], w[1], S.rFa[0] + 0.3, S.rFa[1] + 1.3, M[A.fore], grp, { ...C.shC, band: [[0.8, 1.01, M[A.cuff]]] });
    const hang = Math.abs(dx / fl) * A.wide;
    if (hang > 1.2) {
      const bx = w[0] - dx * 0.25, by = w[1] - dy * 0.25;
      poly(B, [e[0], e[1] + 0.5, w[0], w[1] + 1.2, bx, by + hang + 1.2, e[0] + dx * 0.2, e[1] + dy * 0.2 + 2], M[A.fore], grp,
        { sh: 1, hem: [w[0], w[1] + 1.2, bx, by + hang + 1.2, 1.1, M[A.cuff]] });
    }
  } else {
    const band = A.cuff ? [[0, 0.22, M[A.upper]], [0.86, 1.01, M[A.cuff]]] : null;
    seg(B, e[0], e[1], w[0], w[1], S.rFa[0], S.rFa[1], M[A.fore], grp, { ...C.shC, band, pat: A.wrap ? PAT.wrap : null });
  }
  if (!A.noHand) {
    const d = dv(fAng);
    seg(B, w[0] + d[0] * 0.6, w[1] + d[1] * 0.6, w[0] + d[0] * 1.5, w[1] + d[1] * 1.5, S.hand, S.hand * 0.85, M[A.hand || 'skin'], grp, SH_SKIN);
  }
}

function drawLeg(B, C, h, k, a, t, grp) {
  const S = C.body, M = C.M, L = C.legs;
  const band = L.wrap ? [[L.wrapFrom || 0.42, 1.01, M[L.wrap]]] : null;
  seg(B, k[0], k[1], a[0], a[1], S.rSh[0], S.rSh[1], M[L.shin], grp, { ...C.shC, band, pat: L.wrap ? (u, v, x, y, tc) => (tc > (L.wrapFrom || 0.42) ? PAT.wrap(u, v) : 0) : null });
  seg(B, h[0], h[1], k[0], k[1], S.rTh[0], S.rTh[1], M[L.thigh], grp, C.shC);
  const bt = [a[0] + (k[0] - a[0]) * (L.bootH || 0.2), a[1] + (k[1] - a[1]) * (L.bootH || 0.2)];
  seg(B, bt[0], bt[1], a[0], a[1], S.rAnk + 0.1, S.rAnk, M[L.boot], grp, C.shC);
  seg(B, a[0], a[1], t[0], t[1], S.rAnk, S.rToe, M[L.boot], grp, { ...C.shC, bias: -0.2 });
}

function drawTorso(B, C, J, P, grp, A) {
  const T = C.torso, W = C.body.tw, M = C.M;
  const pt = (u, v) => torsoPt(J, C, u, v);
  const sh = [
    pt(-0.06, -W.hipB), pt(0.4, -W.waistB), pt(0.72, -W.chestB), pt(0.93, -W.shB), pt(1.05, -W.nkB),
    pt(1.05, W.nkF), pt(0.9, W.shF), pt(0.7, W.chestF), pt(0.42, W.waistF), pt(-0.06, W.hipF),
  ].flat();
  const R = Math.max(W.chestF, W.chestB) + 0.5;
  const ax = [J.hip[0], J.hip[1], J.neck[0], J.neck[1], R];
  if (T.back) T.back(B, C, J, P, pt, A);
  poly(B, sh, M[T.mat], grp, { ...C.shC, axis: ax });
  if (T.vest) {
    const vs = [pt(0.26, -W.waistB - 0.3), pt(0.7, -W.chestB - 0.3), pt(0.94, -W.shB + 0.2), pt(0.96, W.shF * 0.6), pt(0.7, W.chestF + 0.3), pt(0.26, W.waistF + 0.3)].flat();
    poly(B, vs, M[T.vest], grp, { ...SH_METAL, axis: ax, pat: PAT[T.vestPat] || null });
  }
  if (T.collar) {
    if (T.inner) poly(B, [pt(1.05, -0.4), pt(1.05, W.nkF + 0.3), pt(0.74, W.chestF * 0.7)].flat(), M[T.inner], grp, { sh: 3 });
    const c0 = pt(1.04, -W.nkB * 0.5), c1 = pt(0.4, W.waistF + 0.2);
    seg(B, c0[0], c0[1], c1[0], c1[1], 0.95, 0.85, M[T.collar], grp, C.shC);
  }
  if (T.badge) {
    const c = pt(0.64, W.chestF * 0.25);
    poly(B, [c[0] - 2, c[1] - 2, c[0] + 2.5, c[1] - 2, c[0] + 2.5, c[1] + 2.5, c[0] - 2, c[1] + 2.5], M[T.badge], grp, { sh: 3, pat: (u, v, x, y) => ((x + y) % 2 ? -1 : 0) });
  }
  if (T.beads) {
    for (let i = 0; i <= 6; i++) {
      const u = 0.98 - i * 0.075, v = lerp(-W.nkB * 0.8, W.chestF + 0.6, Math.sin((i / 6) * Math.PI * 0.5));
      const p = pt(u, v);
      disc(B, p[0], p[1], 1.25, M[T.beads], grp, SH_METAL);
    }
  }
  if (T.front) T.front(B, C, J, P, pt, A);
}

function drawBelt(B, C, J, P, grp, A) {
  const T = C.torso, W = C.body.tw, M = C.M;
  const pt = (u, v) => torsoPt(J, C, u, v);
  const [u0, u1] = T.beltU || [0.05, 0.24];
  if (T.belt) {
    poly(B, [pt(u0, -W.hipB - 0.45), pt(u1, -W.waistB - 0.5), pt(u1, W.waistF + 0.5), pt(u0, W.hipF + 0.45)].flat(), M[T.belt], grp,
      { ...C.shC, axis: [J.hip[0], J.hip[1], J.neck[0], J.neck[1], W.waistF + 1], pat: PAT.belt });
    if (T.buckle) { const p = pt((u0 + u1) / 2, W.waistF + 0.2); disc(B, p[0], p[1], 1.2, M[T.buckle], grp, SH_METAL); }
  }
  A.sash = pt((u0 + u1) / 2, W.waistF * 0.5);
  A.sashB = pt((u0 + u1) / 2, -W.waistB * 0.7);
  if (T.pendant) {
    const p = pt(u0 - 0.12, W.waistF * 0.75);
    disc(B, p[0], p[1] + 1.5, 0.95, M[T.pendant], grp, SH_METAL);
    A.pendant = [p[0], p[1] + 2.4];
  }
}

function drawFlap(B, C, J, P, side, grp) {
  const R = C.robe, W = C.body.tw, M = C.M;
  const pt = (u, v) => torsoPt(J, C, u, v);
  const top = side > 0 ? pt(0.14, W.waistF + 0.7) : pt(0.14, -W.waistB - 0.7);
  const inn = side > 0 ? pt(0.14, -W.waistB * (R.overlap || 0.3)) : pt(0.14, W.waistF * (R.overlap || 0.3));
  const hp = side > 0 ? J.hF : J.hB, kn = side > 0 ? J.kF : J.kB;
  let ang = Math.atan2(kn[0] - hp[0], kn[1] - hp[1]) / DEG;
  const rotA = -(J.rot || 0);
  ang = lerp(ang, rotA, R.stiff) + (side > 0 ? P.ff : P.fb);
  const d = dv(ang);
  const ox = side > 0 ? d[1] : -d[1], oy = side > 0 ? -d[0] : d[0];
  const len = R.len * (side > 0 ? 1 : R.backLen || 1);
  const b0 = [top[0] + d[0] * len + ox * R.flare, top[1] + d[1] * len + oy * R.flare];
  const b1 = [inn[0] + d[0] * len * 0.93, inn[1] + d[1] * len * 0.93];
  const mx = (top[0] + inn[0]) / 2, my = (top[1] + inn[1]) / 2;
  poly(B, [...top, ...b0, ...b1, ...inn], M[R.mat], grp, {
    ...C.shC, axis: [mx, my, (b0[0] + b1[0]) / 2, (b0[1] + b1[1]) / 2, (W.waistF + W.waistB) * 0.6],
    hem: R.trim ? [b0[0], b0[1], b1[0], b1[1], R.hemW || 1.5, M[R.trim], R.stitch ? M[R.stitch] : 0] : null, pat: PAT.fold,
  });
  if (R.edge) {
    // vertical trim along the outer opening
    seg(B, top[0], top[1], b0[0], b0[1], 0.55, 0.55, M[R.edge], grp, C.shC);
  }
}

// ---------------------------------------------------------------------------
// Whole character
// ---------------------------------------------------------------------------
function drawChar(B, C, P, J) {
  const A = {};
  const dF = dv(J.faF), dB = dv(J.faB);
  const gF = [J.wF[0] + dF[0] * 1.05, J.wF[1] + dF[1] * 1.05], gB = [J.wB[0] + dB[0] * 1.05, J.wB[1] + dB[1] * 1.05];
  A.gripF = gF; A.gripB = gB;
  if (C.weapon2) WEAPONS[C.weapon2](B, C, gB, J.w2, GR.BWEAP, A, 'b');
  if (C.weapon && P.wh === 'b') WEAPONS[C.weapon](B, C, gB, J.w, GR.BWEAP, A, 'b');
  if (C.backArm !== false) drawArm(B, C, J.sB, J.eB, J.wB, J.faB, GR.BARM, false);
  drawLeg(B, C, J.hB, J.kB, J.aB, J.tB, GR.BLEG);
  if (C.robe) drawFlap(B, C, J, P, -1, GR.ROBEB);
  drawTorso(B, C, J, P, GR.BODY, A);
  drawLeg(B, C, J.hF, J.kF, J.aF, J.tF, GR.FLEG);
  if (C.robe) drawFlap(B, C, J, P, 1, GR.ROBEF);
  drawBelt(B, C, J, P, GR.ROBEF, A);
  const hs = HEADS[C.head][P.h] || HEADS[C.head][0];
  stamp(B, hs, J.head[0], J.head[1], GR.HEAD, C, J.hr);
  for (const k in hs.pts) {
    const o = rotOff(hs.pts[k][0] - hs.ax, hs.pts[k][1] - hs.ay, J.hr);
    A[k] = [Math.floor(J.head[0]) + o[0] + 0.5, Math.floor(J.head[1]) + o[1] + 0.5];
  }
  if (C.weapon && P.wh === 'f') WEAPONS[C.weapon](B, C, gF, J.w, GR.FWEAP, A, 'f');
  drawArm(B, C, J.sF, J.eF, J.wF, J.faF, GR.FARM, true);
  if (C.overlay) C.overlay(B, C, J, P, A);
  return A;
}

// ---------------------------------------------------------------------------
// Post process: separation lines, rim light, selective outline, crop.
// ---------------------------------------------------------------------------
const _sep = new Uint8Array(RB.w * RB.h);
let _img = null;
function finish(B, C) {
  const { w, h, m, s, g, f } = B;
  const pal = C.pal, pmax = C.pmax;
  _sep.fill(0);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    if (!m[i] || (f[i] & (F_EMIT | F_NOSEP))) continue;
    const gi = g[i];
    let best = 0, bm = 0;
    for (let k = 0; k < 4; k++) {
      const j = k === 0 ? i - 1 : k === 1 ? i + 1 : k === 2 ? i - w : i + w;
      const gj = g[j];
      if (m[j] && gj > gi && gj > best && !(f[j] & F_NOSEP) && !NOSEP.has(gi * 16 + gj)) { best = gj; bm = m[j]; }
    }
    if (best) _sep[i] = bm;
  }
  // rim light on the lit (upper, front) silhouette edge
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    if (!m[i] || (f[i] & F_KEEP) || _sep[i]) continue;
    if (!m[i - w] || !m[i + 1]) s[i] = Math.min(s[i] + 1, pmax[m[i]]);
  }
  if (!_img) _img = new ImageData(w, h);
  const d = _img.data;
  d.fill(0);
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    let c = null;
    if (m[i]) {
      if (_sep[i]) c = pal[_sep[i]][0];
      else c = pal[m[i]][clamp(s[i], -1, 4) + 1];
    } else {
      let bg = 0, bm = 0, lit = false;
      if (x > 0) { const j = i - 1; if (m[j] && !(f[j] & F_NOOUT) && g[j] >= bg) { bg = g[j]; bm = m[j]; lit = false; } }
      if (y < h - 1) { const j = i + w; if (m[j] && !(f[j] & F_NOOUT) && g[j] >= bg) { bg = g[j]; bm = m[j]; lit = true; } }
      if (x < w - 1) { const j = i + 1; if (m[j] && !(f[j] & F_NOOUT) && g[j] >= bg) { bg = g[j]; bm = m[j]; lit = false; } }
      if (y > 0) { const j = i - w; if (m[j] && !(f[j] & F_NOOUT) && g[j] >= bg) { bg = g[j]; bm = m[j]; lit = false; } }
      if (bm) c = lit ? pal[bm][6] : pal[bm][0];
    }
    if (c) {
      const k = i * 4;
      d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  if (x1 < 0) return { c: mkCanvas(1, 1), ox: 0, oy: 0 };
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const cv = mkCanvas(cw, ch);
  ctxOf(cv).putImageData(_img, -x0, -y0, x0, y0, cw, ch);
  return { c: cv, ox: x0 - B.ax, oy: y0 - B.ay };
}

// ---------------------------------------------------------------------------
// Costumes, animation sampling and the frame cache
// ---------------------------------------------------------------------------
const HEAD_CODES = {
  k: ['hair', 0], j: ['hair', 1], h: ['hair', 2], H: ['hair', 3], I: ['hair', 4], o: ['hair', -1],
  D: ['skin', 0], d: ['skin', 1], s: ['skin', 2], S: ['skin', 3], T: ['skin', 4], e: ['skin', -1], m: ['skin', 0],
  w: ['eyeW', 4],
  y: ['a', 0], a: ['a', 1], A: ['a', 2], '@': ['a', 3], '!': ['a', 4],
  z: ['b', 0], b: ['b', 1], B: ['b', 2], '%': ['b', 3], '^': ['b', 4],
  x: ['c', 0], c: ['c', 1], C: ['c', 2], '&': ['c', 3], '*': ['c', 4],
  E: ['glow', 4, F_EMIT], G: ['glow', 3, F_EMIT],
};
function buildPal(r) {
  const c = r.map(rgb);
  const lo = [lerp(c[0][0], c[1][0], 0.55) | 0, lerp(c[0][1], c[1][1], 0.55) | 0, lerp(c[0][2], c[1][2], 0.55) | 0];
  return [...c, lo];
}
const COSTUME = {};
function defCostume(id, def) {
  const C = Object.assign({ id, shC: SH_CLOTH, anims: 'hero', headMap: {} }, def);
  C.M = {}; C.pal = [null]; C.pmax = [0];
  const shiny = new Set(def.shiny || []);
  let n = 1;
  for (const k in def.mats) { C.M[k] = n++; C.pal.push(buildPal(def.mats[k])); C.pmax.push(shiny.has(k) ? 4 : 3); }
  C.hcode = [];
  for (const ch in HEAD_CODES) {
    const [role, sh, fl] = HEAD_CODES[ch];
    const mat = C.headMap[role] || role;
    if (C.M[mat] !== undefined) C.hcode[ch.charCodeAt(0)] = [C.M[mat], sh, fl || 0];
  }
  COSTUME[id] = C;
  return C;
}

const POSE0 = { x: 0, y: 0, t: 0, a1: 8, a2: 10, b1: -6, b2: 12, l1: 4, l2: -4, m1: -4, m2: -2, w: 150, w2: 150, wh: 'f', h: 0, g: 1, rot: 0, ff: 0, fb: 0, hx: 0, hy: 0, lf: null, mf: null };
function lerpPose(a, b, u) {
  const o = {};
  for (const k in a) {
    const va = a[k], vb = b[k];
    o[k] = typeof va === 'number' && typeof vb === 'number' ? va + (vb - va) * u : u < 0.5 ? va : vb;
  }
  return o;
}
// keys: [pose, duration, ease?, subframes?]
function mkAnim(loop, ...keys) {
  const K = keys.map(([p, d, e, sub]) => ({ p: Object.assign({}, POSE0, p), d, e: e || 'io', sub }));
  return { loop, keys: K, total: K.reduce((s, k) => s + k.d, 0) };
}
function sampleAnim(A, t) {
  const K = A.keys, n = K.length;
  let tt = A.loop ? ((t % A.total) + A.total) % A.total : Math.max(0, Math.min(t, A.total - 0.001));
  let i = 0;
  while (i < n - 1 && tt >= K[i].d) { tt -= K[i].d; i++; }
  const k0 = K[i];
  const last = !A.loop && i === n - 1;
  if (k0.e === 'step' || last || n === 1) return { p: k0.p, k: i + '.0' };
  const k1 = K[(i + 1) % n];
  const sub = k0.sub || clamp(Math.round(k0.d / 3), 1, 5);
  const q = Math.floor((tt / k0.d) * sub);
  return { p: lerpPose(k0.p, k1.p, Ease[k0.e](q / sub)), k: i + '.' + q };
}

const FRAMES = new Map();
function renderFrame(C, P) {
  RB.clear();
  const J = solve(P, C);
  const A = drawChar(RB, C, P, J);
  const fr = finish(RB, C);
  fr.A = A; fr.J = J; fr.tints = null;
  return fr;
}
function frameFor(C, anim, t) {
  const set = ANIMS[C.anims];
  let A = set[anim];
  if (!A) { anim = 'idle'; A = set.idle; }
  const smp = sampleAnim(A, t);
  const key = C.id + '|' + anim + '|' + smp.k;
  let fr = FRAMES.get(key);
  if (!fr) { fr = renderFrame(C, smp.p); FRAMES.set(key, fr); }
  return fr;
}
function animLen(C, anim) { const A = ANIMS[C.anims][anim]; return A ? A.total : 1; }

// Solid color silhouette of a frame (hit flash, afterimages), cached per color.
function frameTint(fr, color) {
  if (!fr.tints) fr.tints = {};
  let c = fr.tints[color];
  if (!c) {
    c = mkCanvas(fr.c.width, fr.c.height);
    const x = ctxOf(c);
    x.drawImage(fr.c, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = color;
    x.fillRect(0, 0, c.width, c.height);
    fr.tints[color] = c;
  }
  return c;
}

// Draw a frame at world-space feet position (sx, sy are already camera relative).
function blitFrame(ctx, fr, sx, sy, facing, img) {
  img = img || fr.c;
  sx = Math.round(sx); sy = Math.round(sy);
  if (facing >= 0) ctx.drawImage(img, sx + fr.ox, sy + fr.oy);
  else {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(-1, 1);
    ctx.drawImage(img, fr.ox, fr.oy);
    ctx.restore();
  }
}

  dao(B, C, g, a, grp, A, w) {

  // long spear with leaf head; tassel anchor below the head
  spear(B, C, g, a, grp, A, w) {

    const p = t => [g[0] + d[0] * t, g[1] + d[1] * t];
    seg(B, ...p(-12), ...p(21), 0.75, 0.75, M.wood, grp, C.shC);
    seg(B, ...p(20.2), ...p(21.6), 1.2, 1.2, M.gold, grp, SH_METAL);

  // hook sword: blade with a back hooked tip and crescent hand guard
  hook(B, C, g, a, grp, A, w) {

    const p = (t, o = 0) => [g[0] + d[0] * t + n[0] * o, g[1] + d[1] * t + n[1] * o];

    seg(B, ...p(1.6, 3.4), ...p(3.4, 1.4), 0.6, 0.6, M.steel, grp, SH_METAL);

    seg(B, ...p(17, -1.5), ...p(16, -3.6), 0.7, 0.6, M.steel, grp, SH_BLADE);
    seg(B, ...p(16, -3.6), ...p(14, -3.4), 0.6, 0.45, M.steel, grp, SH_BLADE);
    A[w + 'Tip'] = p(17, -1.5);
    A[w + 'Tassel'] = p(-4);
  },
  dagger(B, C, g, a, grp, A, w) {
    const M = C.M, d = dv(a), n = [-d[1], d[0]];
    const p = (t, o = 0) => [g[0] + d[0] * t + n[0] * o, g[1] + d[1] * t + n[1] * o];
    seg(B, ...p(-2.4), ...p(1), 0.7, 0.7, M.hilt, grp, C.shC);
    seg(B, ...p(1.5, -1.3), ...p(1.5, 1.3), 0.55, 0.55, M.gold, grp, SH_METAL);
    seg(B, ...p(2), ...p(8.5), 0.85, 0.3, M.steel, grp, SH_BLADE);
    A[w + 'Tip'] = p(8.5);
  },
  // open steel war fan with painted silk
  fan(B, C, g, a, grp, A, w) {
    const M = C.M;
    const R = 10, span = 55;
    const pts = [g[0], g[1]];
    for (let k = -span; k <= span; k += 11) { const q = dv(a + k); pts.push(g[0] + q[0] * R, g[1] + q[1] * R); }
    poly(B, pts, M.silk, grp, {
      sh: 3,
      pat: (u, v, x, y) => {
        const ang = Math.atan2(x + 0.5 - (g[0] + B.ax), y + 0.5 - (g[1] + B.ay)) / DEG;
        const rr = Math.hypot(x + 0.5 - (g[0] + B.ax), y + 0.5 - (g[1] + B.ay));
        if (rr > R - 1.3) return -3;
        if (hash2(x, y, 11) > 0.93 && rr > 4) return -2;
        return Math.abs(((ang % 11) + 11) % 11 - 5.5) < 0.9 ? -1 : 0;
      },
    });
    for (let k = -span; k <= span; k += span) { const q = dv(a + k); seg(B, g[0], g[1], g[0] + q[0] * R, g[1] + q[1] * R, 0.55, 0.45, M.steel, grp, SH_METAL); }
    const t = dv(a);
    A[w + 'Tip'] = [g[0] + t[0] * R, g[1] + t[1] * R];
    A[w + 'Tassel'] = [g[0] - t[0] * 1.5, g[1] - t[1] * 1.5];
  },
  // iron studded club
  club(B, C, g, a, grp, A, w) {
    const M = C.M, d = dv(a);
    const p = t => [g[0] + d[0] * t, g[1] + d[1] * t];
    seg(B, ...p(-3), ...p(17), 1.2, 2.6, M.wood, grp, C.shC);
    seg(B, ...p(-0.5), ...p(1.8), 1.5, 1.5, M.leather, grp, C.shC);
    for (const t of [9, 12.5, 16]) { const q = p(t); disc(B, q[0] + d[1] * 1.8, q[1] - d[0] * 1.8, 0.7, M.steel, grp, SH_METAL); disc(B, q[0] - d[1] * 2, q[1] + d[0] * 2, 0.7, M.steel, grp, SH_METAL); }
    A[w + 'Tip'] = p(18);
  },
  // recurve bow held across the aim direction
  bow(B, C, g, a, grp, A, w) {
    const M = C.M, d = dv(a), n = [-d[1], d[0]];
    const p = (t, o) => [g[0] + d[0] * t + n[0] * o, g[1] + d[1] * t + n[1] * o];
    const pts = [p(-0.5, 0), p(1.2, 3.5), p(1.4, 6.5), p(0.2, 9), p(0.9, 10.5)];
    const pts2 = [p(-0.5, 0), p(1.2, -3.5), p(1.4, -6.5), p(0.2, -9), p(0.9, -10.5)];
    for (const L of [pts, pts2]) for (let i = 0; i < L.length - 1; i++) seg(B, ...L[i], ...L[i + 1], 0.8, 0.8, M.wood, grp, C.shC);
    bline(B, ...pts[4], ...pts2[4], M.white || M.bone, 3, grp, F_NOOUT);
    A[w + 'Tip'] = p(1, 0);
  },
  // taoist horsetail whisk: handle only, the hair is a live ribbon
  whisk(B, C, g, a, grp, A, w) {
    const M = C.M, d = dv(a);
    seg(B, g[0] - d[0] * 2.5, g[1] - d[1] * 2.5, g[0] + d[0] * 4, g[1] + d[1] * 4, 0.75, 0.75, M.wood, grp, C.shC);

    A[w + 'Whisk'] = [g[0] + d[0] * 5, g[1] + d[1] * 5];
  },
  // scabbard carried in the hand (cutscenes)
  sheath(B, C, g, a, grp, A, w) {
    const M = C.M, d = dv(a);
    seg(B, g[0] - d[0] * 4, g[1] - d[1] * 4, g[0] + d[0] * 1.5, g[1] + d[1] * 1.5, 0.8, 0.8, M.hilt, grp, C.shC);

    A[w + 'Tassel'] = [g[0] - d[0] * 4.2, g[1] - d[1] * 4.2];
  },
};

// ==== gfx/heads.js ====
// ---------------------------------------------------------------------------
// Hand drawn heads (facing right). Codes map to costume materials, see
// HEAD_CODES in rig.js: h/H hair, s/S skin, e eye, a/b/c accent ramps,
// E emissive. Outer outlines are generated, so none are drawn here.
// Each head has variants: 0 normal, 1 blink, 2 hurt, 3 shout.
// pts are anchor pixels for live ribbons (ponytails, beards, plumes).
// ---------------------------------------------------------------------------
const HEADS = {};
function mkSprite(rows, ax, ay, pts) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const d = new Uint8Array(w * h);
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] !== '.') d[y * w + x] = r.charCodeAt(x); });
  return { w, h, ax, ay, d, pts: pts || {} };
}
function patchSprite(base, patches) {
  const s = { ...base, d: base.d.slice() };
  for (const [x, y, c] of patches) s.d[y * s.w + x] = c === '.' ? 0 : c.charCodeAt(0);
  return s;
}
// variants: { 1: [[x,y,code]...], 2: [...], 3: [...] }
function defHead(name, rows, ax, ay, pts, variants = {}) {
  const base = mkSprite(rows, ax, ay, pts);
  HEADS[name] = [base, 1, 2, 3].map((v, i) => (i === 0 ? base : variants[v] ? patchSprite(base, variants[v]) : base));
}

// Costumes: materials, proportions, garment layers, weapons and the live
// ribbons (hair, sashes, tassels, scarves) each character carries.
// ribbon: [anchor, material, length(px), segments, width, stiffness, behind]
// ---------------------------------------------------------------------------
const BODY_STD = {
  hip: 22, th: 10, sh: 10, foot: 3.6, torso: 13, neck: 1, ua: 7, fa: 7, shDown: 2.5, shOff: 0.6,
  rTh: [2.7, 2.1], rSh: [2.05, 1.5], rAnk: 1.3, rToe: 1.05, rUa: [1.75, 1.45], rFa: [1.55, 1.3], hand: 1.45,
  tw: { hipB: 3.4, hipF: 3.3, waistB: 3.0, waistF: 2.9, chestB: 3.3, chestF: 3.9, shB: 3.3, shF: 3.1, nkB: 1.5, nkF: 1.3 },
};
function body(o = {}, scale = 1, bulk = 1) {
  const b = JSON.parse(JSON.stringify(BODY_STD));
  for (const k of ['hip', 'th', 'sh', 'torso', 'ua', 'fa', 'foot']) b[k] *= scale;
  for (const k of ['rTh', 'rSh', 'rUa', 'rFa']) b[k] = b[k].map(v => v * bulk);
  b.rAnk *= bulk; b.rToe *= bulk; b.hand *= bulk;
  for (const k in b.tw) b.tw[k] *= bulk;
  for (const k in o) { if (k === 'tw') Object.assign(b.tw, o.tw); else b[k] = o[k]; }
  return b;
}

// Quiver strapped to the back
function quiverBack(B, C, J, P, pt) {
  const a = pt(0.25, -C.body.tw.waistB - 1), b = pt(1.05, -C.body.tw.shB - 2.2);
  seg(B, a[0], a[1], b[0], b[1], 1.6, 1.8, C.M.leather, GR.BODY, C.shC);
  for (let i = 0; i < 3; i++) bline(B, b[0] - 1 + i, b[1] - 1, b[0] - 2 + i * 1.5, b[1] - 4, C.M.fletch, 3, GR.BODY);
}
// Scabbard hanging at the back hip
function scabbardBack(B, C, J, P, pt) {
  const a = pt(0.2, -C.body.tw.waistB - 0.5);
  const d = dv(-38 - (P.t || 0) * 0.4 - (J.rot || 0));
  seg(B, a[0], a[1], a[0] + d[0] * 12, a[1] + d[1] * 12, 0.95, 0.8, C.M.scab, GR.ROBEB, { ...C.shC, band: [[0, 0.1, C.M.gold], [0.92, 1.01, C.M.gold]] });
}
// Cape hung from the shoulders is a ribbon; this draws the clasp
function claspFront(B, C, J, P, pt) {
  const p = pt(0.96, C.body.tw.shF * 0.2);
  disc(B, p[0], p[1], 1.1, C.M.gold, GR.BODY, SH_METAL);
}

// ==== gfx/poses.js ====
// ---------------------------------------------------------------------------
// Pose and animation library.
// Pose keys: x hip shift | t torso lean | a1,a2 front arm (abs, rel) |
// b1,b2 back arm | l1,l2 front leg | m1,m2 back leg | w,w2 weapon angles |
// wh weapon hand | h head variant | g ground lock | rot body spin | ff,fb flaps
// Durations are in 60 Hz ticks and line up with move timings in moves.js.
// ---------------------------------------------------------------------------
const P_ = (...o) => Object.assign({}, ...o);
const LEGS = {
  stance: { l1: 22, l2: -26, m1: -24, m2: -8 },
  stance2: { l1: 24, l2: -33, m1: -26, m2: -13 },
  lunge: { l1: 44, l2: -52, m1: -38, m2: -4 },
  deep: { l1: 58, l2: -64, m1: -46, m2: 0 },
  crouch: { l1: 48, l2: -92, m1: -20, m2: -66 },
  tuck: { l1: 70, l2: -112, m1: -8, m2: -40 },
  airy: { l1: 30, l2: -58, m1: -12, m2: -32 },
  stand: { l1: 6, l2: -5, m1: -5, m2: -3 },
};
const AIR = { g: 0 };

function runCycle(base, s = 1, dur = 4) {
  const k = [
    [36, -18, -34, -34, 44, 64], [22, -42, -12, -96, 30, 60], [2, -24, 28, -112, 0, 50], [-24, -24, 52, -72, -30, 40],
    [-34, -34, 36, -18, -44, 34], [-12, -96, 22, -42, -30, 40], [28, -112, 2, -24, 0, 50], [52, -72, -24, -24, 30, 60],
  ];
  return mkAnim(true, ...k.map(([l1, l2, m1, m2, b1, b2], i) => [P_(base, { l1: l1 * s, l2: l2 * s, m1: m1 * s, m2: m2 * s, b1: base.b1 !== undefined ? base.b1 : b1 * s, b2: base.b2 !== undefined ? base.b2 : b2, y: 0 }), dur, 'lin', 1]));
}
function walkCycle(base, dur = 7, armSwing = 1) {
  const k = [
    [22, -10, -20, -14], [12, -24, -8, -40], [0, -8, 14, -52], [-14, -6, 24, -20],
    [-20, -14, 22, -10], [-8, -40, 12, -24], [14, -52, 0, -8], [24, -20, -14, -6],
  ];
  return mkAnim(true, ...k.map(([l1, l2, m1, m2], i) => {
    const sw = Math.sin((i / 8) * TAU) * 16 * armSwing;
    return [P_(base, { l1, l2, m1, m2, b1: (base.b1 || 0) + sw, a1: (base.a1 || 0) - sw * (base.armLock ? 0 : 0.6) }), dur, 'lin', 1];
  }));
}
// reaction set shared by every humanoid; o overrides weapon posture
function reactions(o = {}) {
  const hurt = P_({ t: -18, x: -2, a1: -25, a2: 40, w: 230, b1: -35, b2: 45, l1: 22, l2: -14, m1: -22, m2: -22, h: 2 }, o);
  const lie = P_({ rot: -90, t: 0, a1: 172, a2: 4, w: 185, b1: 160, b2: 12, l1: 8, l2: -8, m1: -4, m2: 0, h: 2, ff: 0, fb: 0 }, o, { rot: -90, g: 1 });
  const fly = P_({ rot: -35, t: -10, a1: -70, a2: 30, b1: -90, b2: 20, l1: 40, l2: -30, m1: 18, m2: -40, h: 2, w: 230, g: 0 }, o, { g: 0 });

// ==== gfx/fx.js ====
// ---------------------------------------------------------------------------
// Effects: particles, sword arcs, thrust streaks, impact stars, rings,
// afterimages, floating text, screen flash and shake. Two layers: 0 behind
// fighters, 1 in front.
// ---------------------------------------------------------------------------
const FX = {
  list: [],
  shake: 0,
  flashT: 0, flashL: 1, flashC: '#fff',
  clear() { this.list.length = 0; this.shake = 0; this.flashT = 0; },
  add(e) { this.list.push(e); return e; },
  update() {
    let j = 0;
    for (let i = 0; i < this.list.length; i++) { const e = this.list[i]; if (e.update() !== false) this.list[j++] = e; }
    this.list.length = j;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - 0.35);
    if (this.flashT > 0) this.flashT--;
  },
  draw(ctx, cam, layer) { for (const e of this.list) if ((e.layer || 0) === layer) e.draw(ctx, cam); },
  drawFlash(ctx) {
    if (this.flashT <= 0) return;
    ctx.save();
    ctx.globalAlpha = (this.flashT / this.flashL) * 0.85;
    ctx.fillStyle = this.flashC;
    ctx.fillRect(0, 0, VW, VH);
    ctx.restore();
  },
  flash(c = '#fff', l = 8) { this.flashC = c; this.flashT = this.flashL = l; },
  kick(n) { this.shake = Math.max(this.shake, n); },

  // ---- emitters ----
  part(o) { return this.add(new Part(o)); },
  burst(x, y, n, o) {
    for (let i = 0; i < n; i++) {
      const a = o.dir !== undefined ? o.dir + rnd(-o.spread, o.spread) : rnd(TAU), s = rnd(o.s0 || 0.5, o.s1 || 2.5);
      this.part({ ...o, x: x + rnd(-(o.jx || 0), o.jx || 0), y: y + rnd(-(o.jy || 0), o.jy || 0), vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rndi(o.l0 || 12, o.l1 || 24) });
    }
  },
  dust(x, y, n = 6, dir = 0) {
    this.burst(x, y - 1, n, { kind: 'smoke', dir: dir ? (dir > 0 ? 0 : Math.PI) : -Math.PI / 2, spread: dir ? 0.5 : 1.4, s0: 0.3, s1: dir ? 1.8 : 0.9, drag: 0.9, g: -0.02, size: 2, grow: 0.12, cols: ['#e8dcc0', '#c8b898', '#9a8a70'], l0: 14, l1: 26, layer: 0, jx: 3 });
  },
  sparks(x, y, dir, n = 8, cols = ['#ffffff', '#fff0a0', '#ffb040', '#c05020']) {
    this.burst(x, y, n, { kind: 'spark', dir, spread: 1.1, s0: 2, s1: 5.5, drag: 0.86, g: 0.12, cols, l0: 8, l1: 18, layer: 1 });
  },
  blood(x, y, dir, n = 8) {
    this.burst(x, y, n, { kind: 'px', dir, spread: 0.8, s0: 1, s1: 3.6, drag: 0.94, g: 0.22, size: 2, cols: ['#c42418', '#951410', '#630b0c'], l0: 16, l1: 34, layer: 1, floor: true });
  },
  ink(x, y, n = 14) {
    this.burst(x, y, n, { kind: 'smoke', s0: 0.3, s1: 1.6, drag: 0.9, g: -0.03, size: 2, grow: 0.2, cols: ['#1a1414', '#2c2322', '#4a3c38', '#6a5a52'], l0: 20, l1: 44, layer: 1, jx: 6, jy: 10 });
  },
  qi(x, y, n = 6, cols = ['#fffbe0', '#ffe68a', '#d49a18']) {
    this.burst(x, y, n, { kind: 'px', s0: 0.2, s1: 1.2, drag: 0.92, g: -0.05, size: 1, cols, l0: 16, l1: 30, layer: 1, jx: 4, jy: 6 });
  },
  text(x, y, s, c = '#fff', o = {}) { return this.add(new FloatText(x, y, s, c, o)); },
  slash(owner, o) { return this.add(new Slash(owner, o)); },
  star(x, y, o = {}) { return this.add(new ImpactStar(x, y, o)); },
  ring(x, y, o = {}) { return this.add(new Ring(x, y, o)); },
  streak(x, y, dir, len, o = {}) { return this.add(new Streak(x, y, dir, len, o)); },
  ghost(ent, color, life = 14) {
    if (!ent.frame) return;
    return this.add(new Ghost(ent.frame, ent.x, ent.y, ent.facing, color, life));
  },
};

class Part {
  constructor(o) {
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.g = 0; this.drag = 1; this.life = 20; this.t = 0;
    this.size = 1; this.grow = 0; this.cols = ['#fff']; this.kind = 'px'; this.layer = 1; this.rot = rnd(TAU); this.spin = 0;
    Object.assign(this, o);
  }
  update() {
    this.t++;
    this.vx *= this.drag; this.vy = this.vy * this.drag + this.g;
    this.x += this.vx; this.y += this.vy; this.rot += this.spin; this.size += this.grow;
    if (this.sway) this.x += Math.sin(this.t * this.sway + this.rot) * 0.35;
    if (this.floor && G.map) {
      const fy = G.map.surfaceBelow(this.x, this.y - 2);
      if (this.y >= fy) { this.y = fy - 1; this.vy *= -0.2; this.vx *= 0.5; if (Math.abs(this.vy) < 0.3) { this.vy = 0; this.g = 0; } }
    }
    return this.t < this.life;
  }
  draw(ctx, cam) {
    const k = this.t / this.life;
    const c = this.cols[Math.min(this.cols.length - 1, (k * this.cols.length) | 0)];
    const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y);
    ctx.fillStyle = c;
    switch (this.kind) {
      case 'px': { const s = Math.max(1, Math.round(this.size * (1 - k * 0.5))); ctx.fillRect(x, y, s, s); break; }
      case 'spark': {
        const L = Math.min(5, Math.hypot(this.vx, this.vy) * 0.9);
        const n = Math.max(1, Math.round(L));
        for (let i = 0; i < n; i++) ctx.fillRect(Math.round(x - (this.vx / (Math.hypot(this.vx, this.vy) || 1)) * i), Math.round(y - (this.vy / (Math.hypot(this.vx, this.vy) || 1)) * i), 1, 1);
        break;
      }
      case 'smoke': {
        const r = this.size;
        if (k > 0.55 && ((x + y + this.t) & 1)) break;
        discPx(ctx, x, y, r, c);
        break;
      }
      case 'ember': { if (Math.sin(this.t * 0.6 + this.rot * 5) > -0.2) ctx.fillRect(x, y, 1, 1); break; }
      case 'petal': {
        const ph = Math.floor(((this.rot % TAU) + TAU) % TAU / (TAU / 4));
        if (ph === 0) ctx.fillRect(x, y, 2, 1); else if (ph === 1) { ctx.fillRect(x, y, 1, 1); ctx.fillRect(x + 1, y + 1, 1, 1); } else if (ph === 2) ctx.fillRect(x, y, 1, 2); else { ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x, y + 1, 1, 1); }
        if (this.c2) { ctx.fillStyle = this.c2; ctx.fillRect(x, y, 1, 1); }
        break;
      }
      case 'leaf': {
        const a = this.rot, dx = Math.cos(a), dy = Math.sin(a) * 0.6;
        for (let i = -2; i <= 2; i++) ctx.fillRect(Math.round(x + dx * i), Math.round(y + dy * i), 1, 1);
        if (this.c2) { ctx.fillStyle = this.c2; ctx.fillRect(Math.round(x + dx * 2), Math.round(y + dy * 2), 1, 1); }
        break;
      }
      case 'feather': {
        // tiny swallow silhouette
