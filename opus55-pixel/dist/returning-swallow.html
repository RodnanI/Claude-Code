    FX.flash('#000000', 14);
  }
}

// ---------------------------------------------------------------------------
// Ultimate: Thousand Swallows Return. Lu Yan vanishes, cuts through every
// enemy on screen, then sheathes; the cuts land together.
// ---------------------------------------------------------------------------
function startUltimate(p) {
  const cam = G.cam;
  const targets = G.ents.filter(e => e.team === 2 && !e.dead && e.hittable && e.x > cam.x - 20 && e.x < cam.x + VW + 20);
  p.qi = 0; p.inv = 999;
  p.cancelMove(); p.st = 'cut'; p.vx = p.vy = 0; p.setAnim('ult', true);
  G.ult = { t: 0, p, targets, path: [], ox: p.x, oy: p.y };
  SFX.play('ultStart');
  FX.flash('#fff4d8', 10);
}
function updateUltimate() {
  const U = G.ult, p = U.p;
  U.t++;
  if (U.t === 30) { p.visible = false; SFX.play('dash'); }
  if (U.t >= 30 && U.t < 30 + U.targets.length * 8 + 8) {
    const k = Math.floor((U.t - 30) / 8);
    if ((U.t - 30) % 8 === 0) {
      const t = U.targets[k % Math.max(1, U.targets.length)];
      const x = t ? t.x + (k % 2 ? 28 : -28) : U.ox + (k % 2 ? 90 : -90), y = (t ? t.y - 26 : U.oy - 30) + (k % 2 ? -16 : 10);
      U.path.push([x, y, U.t]);
      SFX.play('swing');
      const fr = frameFor(p.C, 'dash', 6), prev = U.path[U.path.length - 2];
      const g = new Ghost(fr, x, y + 30, prev ? (x > prev[0] ? 1 : -1) : 1, '#ffe08a', 26); g.layer = 1; FX.add(g);
      FX.sparks(x, y, rnd(TAU), 6, ['#ffffff', '#fff0a0', '#ffc040']);
    }
  }
  const end = 30 + U.targets.length * 8 + 24;
  if (U.t === end) {
    p.visible = true; p.x = U.ox; p.y = U.oy; p.setAnim('idle', true);
    SFX.play('sheathe');
  }
  if (U.t === end + 20) {
    FX.flash('#ffffff', 12); FX.kick(6); SFX.play('ultHit');
    for (const t of U.targets) {
      if (t.dead) continue;
      const dmg = t.boss ? 90 : 120;
      t.hp -= dmg;
      FX.text(t.x, t.y - t.h - 10, dmg, '#ffe070', { scale: 2, life: 60 });
      for (let i = 0; i < 3; i++) FX.slash(t, { a0: rnd(0, 360), a1: rnd(0, 360) + 200, r: 22 + i * 4, cy: -26, th: 6, cols: SLASH_COLS.heroQi, life: 16 });
      t.onHit(p, { dmg, kb: [4, -4], stun: 40, stop: 12, knock: true }, t.x > p.x ? 1 : -1, dmg);
    }
    G.hitstop = 14;
  }
  if (U.t > end + 40) { p.st = 'free'; p.inv = 30; G.ult = null; }
}
function drawUltimate(ctx, cam) {
  const U = G.ult;
  const k = Math.min(1, U.t / 20);
  ctx.save();
  ctx.globalAlpha = 0.55 * k;
  ctx.fillStyle = '#0a0606';
  ctx.fillRect(0, 0, VW, VH);
  ctx.restore();
  for (let i = 1; i < U.path.length; i++) {
    const a = U.path[i - 1], b = U.path[i];
    const age = U.t - b[2];
    if (age > 40) continue;
    const n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]));
    const w = age < 4 ? 3 : age < 12 ? 2 : 1;
    for (let s = 0; s < n; s++) {
      const t = s / n, x = Math.round(lerp(a[0], b[0], t) - cam.x), y = Math.round(lerp(a[1], b[1], t) - cam.y);
      if (w > 1) { ctx.fillStyle = '#ffc040'; ctx.fillRect(x, y - (w >> 1) - 1, 1, w + 2); }
      ctx.fillStyle = age < 8 ? '#ffffff' : '#ffe08a';
      ctx.fillRect(x, y - (w >> 1), 1, w);
    }
  }
  FX.draw(ctx, cam, 1);
  if (U.t < 60) Font.draw(ctx, 'THOUSAND SWALLOWS RETURN', VW / 2, 40, '#fff4d8', { align: 'center', scale: 2, outline: '#1a0e08', alpha: Math.min(1, U.t / 10) });
}

// ==== entities/enemies.js ====
// ---------------------------------------------------------------------------
// Enemies: roster data and a shared brain (aggro, spacing, attack tokens,
// guarding, ledge awareness, hopping corpses, fleeing archers).
// moves: [moveName, minRange, maxRange, weight]
// ---------------------------------------------------------------------------
const ENEMY_TYPES = {
  cultist: { cid: 'cultist', hp: 42, speed: 1.05, pref: 24, moves: [['chop', 0, 36, 2], ['slash', 0, 40, 2]], guard: 0.22, cd: [40, 90], aggro: 210, drops: 2 },
  bandit: { cid: 'bandit', hp: 34, speed: 1.2, pref: 24, moves: [['chop', 0, 36, 1], ['slash', 0, 40, 2]], guard: 0.08, cd: [45, 100], aggro: 190, drops: 1 },
  spearman: { cid: 'spearman', hp: 58, speed: 0.95, pref: 46, moves: [['thrust', 18, 66, 3], ['sweep', 0, 46, 1]], guard: 0.3, cd: [50, 100], aggro: 230, drops: 2 },
  assassin: { cid: 'assassin', hp: 38, speed: 2.1, pref: 32, moves: [['twin', 0, 36, 3], ['darts', 70, 230, 2], ['dive', 50, 150, 1]], guard: 0.25, cd: [30, 70], aggro: 250, drops: 2, w: 11 },
  brute: { cid: 'brute', hp: 140, speed: 0.72, pref: 30, moves: [['smash', 0, 44, 2], ['swing', 0, 46, 2]], guard: 0, cd: [60, 110], aggro: 210, poise: 34, drops: 4, w: 18, h: 52, kb: 0.45 },
  archer: { cid: 'archer', hp: 28, speed: 1, pref: 150, moves: [['shoot', 50, 300, 3], ['lob', 90, 260, 1]], guard: 0, cd: [70, 130], aggro: 290, ranged: true, drops: 1 },
  jiangshi: { cid: 'jiangshi', hp: 74, speed: 1.4, pref: 22, moves: [['lunge', 0, 42, 1]], guard: 0, cd: [50, 90], aggro: 220, hopper: true, poise: 16, drops: 2, bleeds: false },
};
MOVES.diveLand = { anim: 'land', len: 16 };
MOVES.dive.ev = { 0(e) { e.vy = -5.8; e.vx = e.facing * 3.4; e.grounded = false; SFX.play('jump'); } };

class Enemy extends Fighter {
  constructor(kind, x, y) {
    const T = ENEMY_TYPES[kind];
    super(T.cid, x, y);
    this.kind = kind; this.T = T; this.team = 2; this.hittable = true;
    this.hp = this.maxHp = T.hp; this.poiseMax = this.poise = T.poise || 0;
    this.w = T.w || 12; this.h = T.h || 40; this.kbMul = T.kb || 1; this.bleeds = T.bleeds !== false;
    this.cd = rndi(30, 80); this.aggro = false; this.hasToken = false; this.guardT = 0;
    this.guardHP = this.guardMax = 26; this.hopT = rndi(10, 40); this.patrolT = rndi(60, 200); this.home = x;
    this.slashCols = SLASH_COLS.enemy; this.facing = -1;
  }
  think() {
    const p = G.player, T = this.T;
    if (!p || p.dead || G.script || G.ult) { this.vx *= 0.8; this.setAnim('idle'); return; }
    const dx = p.x - this.x, adx = Math.abs(dx), dy = p.y - this.y;
    if (!this.aggro) {
      if ((adx < T.aggro && Math.abs(dy) < 110) || this.hp < this.maxHp) {
        this.aggro = true; FX.text(this.x, this.y - this.h - 16, '!', '#ff5a3a', { life: 30 }); SFX.play('alert');
      } else { this.patrol(); return; }
    }
    if (this.guardT > 0) {
      this.guardT--; this.vx *= 0.8; this.face(p.x);
      if (this.st !== 'guard') { this.st = 'guard'; this.setAnim('guard', true); }
      return;
    }
    this.face(p.x);
    if (this.cd > 0) this.cd--;
    if (T.guard && p.st === 'move' && adx < 60 && Math.random() < T.guard * 0.06 && this.grounded) { this.guardT = rndi(26, 50); return; }
    if (this.cd <= 0 && Math.abs(dy) < 48 && this.grounded) {
      const opts = T.moves.filter(m => adx >= m[1] && adx <= m[2]);
      if (opts.length && (Combat.tokens > 0 || T.ranged)) {
        let w = opts.reduce((s, m) => s + m[3], 0) * Math.random(), pickM = opts[0];
        for (const m of opts) { w -= m[3]; if (w <= 0) { pickM = m; break; } }
        if (!T.ranged) { Combat.tokens--; this.hasToken = true; }
        this.startMove(pickM[0]);
        this.cd = rndi(T.cd[0], T.cd[1]);
        return;
      }
    }
    let want = 0;
    if (T.ranged) { if (adx < T.pref - 50) want = -this.facing; else if (adx > T.pref + 60) want = this.facing; }
    else if (adx > T.pref + 6) want = this.facing;
    else if (adx < T.pref - 14) want = -this.facing * 0.6;
    if (want && this.ledgeAhead(Math.sign(want))) want = 0;
    // don't crowd other enemies
    for (const o of G.ents) if (o !== this && o.team === 2 && !o.dead && Math.abs(o.x - this.x) < 14 && Math.abs(o.y - this.y) < 20) this.vx += Math.sign(this.x - o.x || 1) * 0.12;
    if (T.hopper) return this.hop(want);
    this.vx = approach(this.vx, want * T.speed, 0.25);
    if (this.grounded && dy < -44 && adx < 70 && Math.random() < 0.02 && !T.ranged) { this.vy = -6.4; this.grounded = false; }
    if (this.grounded && dy > 40 && adx < 60 && !T.ranged && G.map.get(Math.floor(this.x / TS), Math.floor(this.y / TS)) === T_ONEWAY) { this.drop = 14; this.y += 1; this.grounded = false; }
    if (!this.grounded) this.setAnim(this.vy < 0 ? 'jump' : 'fall');
    else this.setAnim(Math.abs(this.vx) > 0.2 ? (Math.abs(this.vx) > 1.6 ? 'run' : 'walk') : 'idle');
  }
  hop(want) {
    if (this.grounded) {
      this.vx *= 0.6;
      if (--this.hopT <= 0 && want) { this.vy = -3.8; this.vx = Math.sign(want) * this.T.speed * 1.4; this.grounded = false; this.hopT = rndi(18, 30); this.setAnim('hop', true); }
      else if (this.anim !== 'hop' || this.animDone()) this.setAnim('idle');
    }
  }
  patrol() {
    this.setAnim(Math.abs(this.vx) > 0.2 ? 'walk' : 'idle');
    if (this.T.hopper) { this.vx *= 0.8; return; }
    if (--this.patrolT <= 0) { this.patrolT = rndi(90, 220); this.pdir = Math.random() < 0.4 ? 0 : (this.x < this.home ? 1 : -1); }
    const want = this.pdir || 0;
    if (want && !this.ledgeAhead(want) && Math.abs(this.x - this.home) < 70) { this.vx = want * 0.5; this.facing = want; } else this.vx *= 0.8;
  }
  ledgeAhead(dir) {
    const px = this.x + dir * (this.w / 2 + 6);
    if (G.map.solidPx(px, this.y - 8)) return true;
    const s = G.map.surfaceBelow(px, this.y - 6);
    if (this.bounds && (px < this.bounds[0] + 4 || px > this.bounds[1] - 4)) return true;
    if (G.map.hazard(px - 2, s - 6, px + 2, s + 2)) return true;
    // step off a ledge when the target is down there and the fall is survivable
    const p = G.player, below = p && p.y - this.y > 24 && Math.abs(s - p.y) < 20;
    return s - this.y > (below ? 120 : 22);
  }
  update() {
    if (this.st === 'guard' && this.guardT <= 0 && !this.blockT) this.st = 'free';
    if (this.blockT > 0) this.blockT--;
    const wasG = this.grounded;
    super.update();
    if (this.T.hopper && !wasG && this.grounded && this.st === 'free') { FX.dust(this.x, this.y, 3); SFX.play('thud'); }
    if (this.y > G.map.ph + 60 && !this.dead) { this.hp = 0; this.die(null, null, 1); this.remove = true; }
    if (!this.dead && G.map.hazard(this.x - 3, this.y - 8, this.x + 3, this.y - 1) === 'spike') { this.hp = 0; this.die(null, null, 1); }
  }
  onMoveEnd() { if (this.hasToken) { Combat.tokens++; this.hasToken = false; } }
  onHit(att, h, dir, dmg) {
    this.aggro = true; this.guardT = 0;
    if (this.st === 'guard') this.st = 'free';
    super.onHit(att, h, dir, dmg);
  }
  onDeath() {
    if (this.hasToken) { Combat.tokens++; this.hasToken = false; }
    G.stats.kills++;
    SFX.play('kill');
    const n = this.T.drops || 1;
    for (let i = 0; i < n; i++) G.ents.push(new Pickup('qi', this.x + rnd(-6, 6), this.y - 20));
    if (Math.random() < 0.12) G.ents.push(new Pickup('bun', this.x, this.y - 20));
    if (G.onEnemyDeath) G.onEnemyDeath(this);
  }
  afterDeath() {
    if (this.stT > 50) {
      this.alpha = Math.max(0, 1 - (this.stT - 50) / 30);
      if (this.stT % 3 === 0) FX.ink(this.x + rnd(-10, 10), this.y - 8, 2);
    }
    if (this.stT > 80) this.remove = true;
  }
}

function spawnEnemy(kind, x, y, o = {}) {
  const e = new Enemy(kind, x, y);
  if (o.aggro) e.aggro = true;
  if (o.facing) e.facing = o.facing;
  if (o.bounds) e.bounds = o.bounds;
  G.ents.push(e);
  return e;
}

// ==== entities/bosses.js ====
// ---------------------------------------------------------------------------
// Bosses. Each has a move set (frame data like MOVES) and a brain that picks
// moves by distance and phase. Bosses use poise: they only flinch when it
// breaks, so the player earns openings through parries and pressure.
// ---------------------------------------------------------------------------
const BOSS_MOVES = {

class Boss extends Fighter {
  constructor(id, x, y) {
    const D = BOSS_DEFS[id];
    super(D.cid, x, y);
    this.id = id; this.D = D; this.team = 2; this.hittable = true; this.boss = true;
    this.hp = this.maxHp = D.hp; this.poiseMax = this.poise = D.poise;
    this.w = D.w || 12; this.h = D.h || 42; this.kbMul = 0.3; this.phase = 1; this.cd = 50; this.active = false;
    this.moves = { ...MOVES, ...BOSS_MOVES }; this.slashCols = D.slash; this.facing = -1;
    this.bellCD = 300; this.rainCD = 0; this.gold = false; this.downTime = 30;
  }
  think() {
    const p = G.player;
    if (!this.active || !p || p.dead || G.script || G.ult) { this.vx *= 0.8; if (this.grounded) this.setAnim('idle'); return; }
    if (this.chain) { const c = this.chain; this.chain = null; this.startMove(c); return; }
    const dx = p.x - this.x, adx = Math.abs(dx);
    this.face(p.x);
    if (this.bellCD > 0) this.bellCD--;
    if (this.rainCD > 0) this.rainCD--;
    if (this.cd > 0) {
      this.cd--;
      const want = adx > 90 ? 1 : adx < 34 ? -0.6 : 0;
      const sp = this.id === 'tiefo' ? 0.8 : 1.2;
      this.vx = approach(this.vx, want * sp * this.facing, 0.2);
      if (this.grounded) this.setAnim(Math.abs(this.vx) > 0.2 ? 'walk' : 'idle');
      else this.setAnim('fall');
      return;
    }
    if (!this.grounded) return;
    const opts = this.D.brain(this, p, adx).filter(o => o[1] > 0);
    let w = opts.reduce((s, o) => s + o[1], 0) * Math.random(), pickM = opts[0];
    for (const o of opts) { w -= o[1]; if (w <= 0) { pickM = o; break; } }
    if (!pickM) return;
    if (pickM[0] === 'liu_rain' || pickM[0] === 'dm_rain') this.rainCD = 600;
    if (pickM[0] === 'tf_bell') this.bellCD = 900;
    this.startMove(pickM[0]);
    const cr = this.D.cd[this.phase - 1];
    this.cd = rndi(cr[0], cr[1]);
  }
  update() {
    if (this.st === 'move' && this.mname === 'tf_charge') {
      this.vx = this.mt >= 14 ? this.facing * 4.8 : 0;
      if (this.mt > 16 && (this.wallL || this.wallR || this.x < G.cam.lock[0] + 20 || this.x > G.cam.lock[1] - 20)) {
        this.cancelMove(); this.stagger(80); FX.kick(6); SFX.play('slam'); FX.dust(this.x + this.facing * 10, this.y - 20, 10);
        FX.text(this.x, this.y - 70, 'STUNNED', '#ffd060');
      }
    }
    if (this.gold) {
      if (--this.goldT <= 0) this.ungold();
      else if (G.time % 3 === 0) FX.part({ kind: 'px', x: this.x + rnd(-14, 14), y: this.y - rnd(0, 50), vx: 0, vy: -0.6, life: 20, cols: ['#fff2a8', '#f0ca5a', '#d4a232'], layer: 1 });
    }
    if (this.phase === 2 && this.id === 'demon' && G.time % 2 === 0) FX.part({ kind: 'px', x: this.x + rnd(-10, 10), y: this.y - rnd(0, 46), vx: rnd(-0.2, 0.2), vy: -rnd(0.4, 1.2), life: rndi(14, 26), cols: ['#ff8a5a', '#d4200f', '#6a0808'], layer: 0 });
    super.update();
    if (this.st === 'stagger' && G.time % 8 === 0) FX.part({ kind: 'glint', x: this.x + rnd(-8, 8), y: this.y - this.h - 6, life: 10, cols: ['#fff0a0'], layer: 1 });
  }
  golden() { this.gold = true; this.goldT = 420; this.setCostume('tiefoGold'); this.dmgTaken = 0.25; this.armorAll = true; this.goldHits = 0; FX.flash('#fff2a8', 6); }
  ungold() { this.gold = false; this.setCostume('tiefo'); this.dmgTaken = 1; this.armorAll = false; FX.ring(this.x, this.y - 30, { r0: 10, r1: 50, c: '#f0ca5a', life: 20 }); }
  onHit(att, h, dir, dmg) {
    if (this.gold) {
      this.flash = 6; this.flashColor = '#fff2a8';
      SFX.play('clang');
      if ((att.proj && att.kind === 'wave') || h.dmg >= 20) { this.goldHits += 2; } else this.goldHits++;
      if (this.goldHits >= 6) { this.ungold(); this.stagger(70); FX.text(this.x, this.y - 70, 'BELL SHATTERED', '#ffd060'); }
      return;
    }
    this.flashColor = null;
    if (this.phase === 1 && this.hp <= this.maxHp * 0.5) this.enterPhase2();
    super.onHit(att, h, dir, dmg);
    if (this.st === 'hurt') this.stT = Math.min(this.stT, 16);
    if (this.st === 'air') { this.stT = Math.min(this.stT, 14); this.juggle += 3; }
  }
  enterPhase2() {
    this.phase = 2;
    FX.flash('#ffffff', 8); FX.kick(4); SFX.play('gong');
    if (G.onBossPhase) G.onBossPhase(this);
  }
  die(att, h, dir) {
    this.hp = 0; this.hittable = false; this.cancelMove(); this.st = 'cut'; this.vx = dir * 2; this.visible = true; this.alpha = 1;
    this.setAnim('stagger', true);
    G.slow = 90; FX.flash('#ffffff', 16); FX.kick(6); SFX.play('ultHit');
    if (this.gold) this.ungold();
    G.bossDefeated(this);
  }
  preDraw(ctx, cam, sx, sy) {
    if (this.gold) { const r = 30 + Math.sin(G.time * 0.2) * 2; ringPx(ctx, sx, sy - 28, r, 'rgba(255,220,120,0.55)'); }
  }
}

function crescent(ctx, x, y, dir, R, th, t, cols) {

}

}

// ---------------------------------------------------------------------------
// Hit resolution: hitbox sweeps, damage, guard, perfect parry, hitstop,
// impact effects and attack tokens (limits how many enemies swing at once).
// ---------------------------------------------------------------------------
const Combat = {
  tokens: 2,
  reset() { this.tokens = 2; },
  worldBox(att, h) {
    const f = att.facing;
    return [f > 0 ? att.x + h.box[0] : att.x - h.box[0] - h.box[2], att.y + h.box[1], h.box[2], h.box[3]];
  },
  sweep(att, h) {
    const box = this.worldBox(att, h);
    if (G.debugBoxes) G.dbg.push(box);
    for (const t of G.ents) {
      if (t === att || t.dead || !t.hittable || t.team === att.team || t.team === 0) continue;
      if (t.team === 3 && att.team !== 1) continue;
      if (att.hitSet.has(t.id)) continue;
      if (!overlap(box, t.box())) continue;
      att.hitSet.add(t.id);
      this.resolve(att, t, h, h.radial ? (t.x >= att.x ? 1 : -1) : att.facing);
    }
  },
  resolve(att, t, h, dir) {
    if (t.inv > 0) return 'miss';
    if (t.onStrike) return t.onStrike(att, h, dir);
    if (t.st === 'guard' && t.facing === -dir && !h.unblock) return t.parryT > 0 ? this.parry(att, t, h, dir) : this.block(att, t, h, dir);
    let dmg = h.dmg * (att.dmgMul ?? 1) * (t.dmgTaken ?? 1);
    if (t.st === 'stagger') dmg *= 1.5;
    if (att === G.player && att.counter > 0) { dmg *= 1.6; att.counter = 0; FX.text(t.x, t.y - t.h - 18, 'COUNTER', '#ffd060', { life: 50 }); }
    dmg = Math.max(1, Math.round(dmg));
    t.hp -= dmg;
    const hx = t.x - dir * 3, hy = t.y - t.h * 0.62 + rnd(-4, 4);
    const heavy = (h.stop || 4) >= 7;
    FX.star(hx, hy, { size: heavy ? 16 : 11, cols: att.team === 1 ? ['#ffffff', '#fff0a0', '#ffb040'] : ['#ffffff', '#ffc0a0', '#ff5a3a'] });
    FX.sparks(hx, hy, dir > 0 ? 0 : Math.PI, heavy ? 12 : 7);
    if (t.bleeds !== false) FX.blood(hx, hy, dir > 0 ? -0.3 : Math.PI + 0.3, heavy ? 10 : 6);
    if (h.fx === 'pierce') FX.streak(t.x - dir * 14, hy, dir, 30, { life: 7 });
    FX.text(t.x + rnd(-6, 6), t.y - t.h - 8, dmg, att.team === 1 ? (heavy ? '#ffe070' : '#ffffff') : '#ff6a4a', { life: 34 });
    G.hitstop = Math.max(G.hitstop, h.stop || 4);
    FX.kick(h.shake || 1);
    SFX.play(h.fx === 'blunt' ? 'hitBlunt' : heavy ? 'hitHeavy' : 'hit');
    t.onHit(att, h, dir, dmg);
    if (att.onLand) att.onLand(t, h, dmg);
    else if (att.owner && att.owner.onLand) att.owner.onLand(t, h, dmg);
    return 'hit';
  },
  block(att, t, h, dir) {
    const chip = Math.round(h.dmg * (t === G.player ? 0.15 : 0.1));
    t.hp = Math.max(1, t.hp - chip);
    t.vx = dir * (Math.abs(h.kb[0]) * 0.55 + 1);
    t.setAnim('blockhit', true); t.blockT = 14;
    const [wx, wy] = t.anchor('fTip');
    const px = lerp(t.x, wx, 0.5), py = lerp(t.y - 34, wy, 0.5);
    FX.sparks(px, py, dir > 0 ? Math.PI : 0, 9, ['#ffffff', '#fff8d0', '#ffd070']);
    FX.star(px, py, { size: 8, life: 6, cols: ['#ffffff', '#fff0c0', '#ffd070'] });
    G.hitstop = Math.max(G.hitstop, 4); FX.kick(1);
    SFX.play('block');
    if (att.proj) att.remove = true;
    if (t.guardHP !== undefined && t !== G.player) {
      t.guardHP -= h.dmg;
      if (t.guardHP <= 0) { t.guardHP = t.guardMax; t.stagger(55); FX.text(t.x, t.y - t.h - 14, 'BROKEN', '#ffb050'); SFX.play('clang'); }
    }
    return 'block';
  },
  parry(att, t, h, dir) {
    const [wx, wy] = t.anchor('fTip');
    const px = lerp(t.x, wx, 0.6), py = lerp(t.y - 34, wy, 0.6);
    FX.star(px, py, { size: 22, life: 12, cols: ['#ffffff', '#fff6d0', '#ffcc50'] });
    FX.ring(px, py, { r0: 3, r1: 42, c: '#fff4c8', life: 16 });
    FX.sparks(px, py, dir > 0 ? Math.PI : 0, 16, ['#ffffff', '#fff6d0', '#ffcc50', '#e08a20']);
    FX.flash('#fff6e0', 5);
    G.hitstop = Math.max(G.hitstop, 9); G.slow = 30;
    SFX.play('parry');
    t.parryT = 0; t.blockT = 16; t.counter = 50;
    t.setAnim('parry', true);
    if (t.qi !== undefined) t.qi = Math.min(t.qiMax, t.qi + 18);
    G.stats.parries++;
    if (att.proj) {
      if (att.D.reflect === false) { att.remove = true; }
      else { att.vx = -att.vx * 1.25; att.vy *= -0.3; att.team = t.team; att.owner = t; att.facing = -att.facing; att.hitSet.clear(); att.dmg = Math.round(att.dmg * 1.5); att.hitDef.dmg = att.dmg; att.reflected = true; }
    } else if (att.parryable !== false) att.stagger(att.boss ? 50 : 72);
    else if (att.poiseMax) att.poise -= 30;
    return 'parry';
  },
};

// ---------------------------------------------------------------------------
// Dialogue box: lacquer-black panel with gold double border and lattice
// corners, a framed portrait, a name tab and typewriter text with voice
// blips. Thoughts (text in parentheses) render in pale jade.
// ---------------------------------------------------------------------------
const SPEAKERS = {
  lu: { name: 'Lu Yan', port: 'lu', pitch: 440, side: 'l' },
  qin: { name: 'Qin Shuang', port: 'qin', pitch: 620, side: 'r' },
  bai: { name: 'Master Bai Heyun', port: 'bai', pitch: 300, side: 'r' },
  moying: { name: 'Mo Ying', port: 'moying', pitch: 250, side: 'r' },
  liu: { name: 'Silver Needle Liu', port: 'liu', pitch: 700, side: 'r' },
  tiefo: { name: 'Tie Fo', port: 'tiefo', pitch: 200, side: 'r' },
  demon: { name: 'Xue Tianmo', port: 'demon', pitch: 230, side: 'r' },
  guwen: { name: 'Elder Gu Wen', port: 'guwen', pitch: 360, side: 'r' },
  cult: { name: 'Masked Cultist', port: null, pitch: 280, side: 'r' },
  bandit: { name: 'Black Wind Bandit', port: null, pitch: 330, side: 'r' },
  villager: { name: 'Villager', port: null, pitch: 520, side: 'r' },
};

const Dialogue = {
  active: false, who: null, lines: [], n: 0, t: 0, done: false, blink: 0,
  open(who, text) {
    this.active = true; this.who = SPEAKERS[who] || { name: who, pitch: 400, side: 'r' };
    this.thought = text.startsWith('(');
    this.lines = Font.wrap(text, this.who.port ? 356 : 430);
    this.total = this.lines.join('').length; this.n = 0; this.t = 0; this.done = false;
    Input.flush();
  },
  update() {
    if (!this.active) return;
    this.t++; this.blink++;
    if (!this.done) {
      const sp = Input.held('attack') || Input.held('jump') ? 3 : 1;
      const prev = this.n;
      this.n = Math.min(this.total, this.n + sp * 0.75);
      if (Math.floor(this.n) !== Math.floor(prev) && Math.floor(this.n) % 2 === 0) SFX.play('text', { pitch: this.who.pitch * (0.9 + Math.random() * 0.2) });
      if (this.n >= this.total) this.done = true;
      if (this.t > 6 && Input.hit('confirm')) { this.n = this.total; this.done = true; }
    } else if (Input.hit('confirm')) { this.active = false; SFX.play('menu'); }
  },
  draw(ctx) {
    if (!this.active) return;
    const W = this.who, hasP = !!W.port, left = !hasP || W.side === 'l';
    const bx = 10, by = 192, bw = 460, bh = 72;
    ornateBox(ctx, bx, by, bw, bh);
    const px = left ? bx + 6 : bx + bw - 70, tx = hasP && left ? bx + 78 : bx + 12;
    if (hasP) {
      ctx.fillStyle = '#1c1210'; ctx.fillRect(px, by + 4, 64, 64);
      if (left) ctx.drawImage(Portraits.get(W.port), px, by + 4, 64, 64);
      else { ctx.save(); ctx.translate(px + 64, by + 4); ctx.scale(-1, 1); ctx.drawImage(Portraits.get(W.port), 0, 0, 64, 64); ctx.restore(); }
      ctx.strokeStyle = '#c8a050'; ctx.lineWidth = 1; ctx.strokeRect(px - 0.5, by + 3.5, 65, 65);
    }
    // name tab
    const nw = Font.width(W.name) + 14, nx = hasP && left ? bx + 78 : hasP ? bx + bw - 76 - nw : bx + 10;
    ctx.fillStyle = '#7a1a12'; ctx.fillRect(nx, by - 9, nw, 12);
    ctx.fillStyle = '#b8301e'; ctx.fillRect(nx + 1, by - 8, nw - 2, 1);
    ctx.fillStyle = '#d6a53a'; ctx.fillRect(nx, by - 10, nw, 1); ctx.fillRect(nx - 1, by - 9, 1, 11); ctx.fillRect(nx + nw, by - 9, 1, 11);
    Font.draw(ctx, W.name, nx + 7, by - 8, '#f6e8c8', { shadow: '#3a0a06' });
    // text
    let left_ = Math.floor(this.n);
    const color = this.thought ? '#b9d8c2' : '#efe3c8';
    this.lines.forEach((ln, i) => {
      if (left_ <= 0) return;
      const s = ln.slice(0, left_);
      left_ -= ln.length;
      Font.draw(ctx, s, tx, by + 9 + i * 11, color, { shadow: '#000000' });
    });
    if (this.done && (this.blink >> 4) & 1) {
      const ax = bx + bw - (hasP && !left ? 82 : 14), ay = by + bh - 10;
      ctx.fillStyle = '#d6a53a';
      ctx.fillRect(ax, ay, 5, 1); ctx.fillRect(ax + 1, ay + 1, 3, 1); ctx.fillRect(ax + 2, ay + 2, 1, 1);
    }
  },
};

function ornateBox(ctx, x, y, w, h, fill = 'rgba(14,10,9,0.93)') {
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#c8a050';
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
  ctx.fillStyle = '#6a1a12';
  ctx.fillRect(x + 2, y + 2, w - 4, 1); ctx.fillRect(x + 2, y + h - 3, w - 4, 1); ctx.fillRect(x + 2, y + 2, 1, h - 4); ctx.fillRect(x + w - 3, y + 2, 1, h - 4);
  // lattice corners
  ctx.fillStyle = '#e8c870';
  for (const [cx, cy, sx, sy] of [[x, y, 1, 1], [x + w - 1, y, -1, 1], [x, y + h - 1, 1, -1], [x + w - 1, y + h - 1, -1, -1]]) {
    for (let i = 0; i < 6; i++) { ctx.fillRect(cx + sx * i, cy + sy * 4, 1, 1); ctx.fillRect(cx + sx * 4, cy + sy * i, 1, 1); }
    ctx.fillRect(cx + sx * 2, cy + sy * 2, 1, 1);
  }
}

// ==== game/hud.js ====
// ---------------------------------------------------------------------------
// HUD: brush-stroke health bar with a damage trail, segmented qi gauge, combo
// counter, boss bar, banners, tutorial hints and ink-brush chapter cards.
// ---------------------------------------------------------------------------
const Hud = {
  trail: 100, bossTrail: 1, bannerT: 0, bannerS: '', hintT: 0, hintS: '', card: null, comboShow: 0, comboN: 0,
  reset() { this.trail = G.player ? G.player.hp : 100; this.bossTrail = 1; this.bannerT = 0; this.hintT = 0; this.card = null; },
  banner(s, t = 100) { this.bannerS = s; this.bannerT = t; },
  hint(s, t = 330) { this.hintS = s; this.hintT = t; SFX.play('menu'); },
  chapterCard(ch, name) { this.card = { ch, name, t: 0 }; SFX.play('gong'); },
  update() {
    const p = G.player;
    if (p) this.trail = this.trail > p.hp ? Math.max(p.hp, this.trail - 0.4) : p.hp;
    if (G.boss) { const k = Math.max(0, G.boss.hp) / G.boss.maxHp; this.bossTrail = this.bossTrail > k ? Math.max(k, this.bossTrail - 0.003) : k; }
    if (this.bannerT > 0) this.bannerT--;
    if (this.hintT > 0) this.hintT--;
    if (this.card && ++this.card.t > 260) this.card = null;
    if (p && p.combo > 1) { this.comboN = p.combo; this.comboShow = 90; } else if (this.comboShow > 0) this.comboShow--;
  },
  draw(ctx) {
    const p = G.player;
    if (!p) return;
    // medallion
    const mx = 18, my = 18;
    discPx(ctx, mx, my, 13, '#1a1210'); ringPx(ctx, mx, my, 13, '#c8a050'); ringPx(ctx, mx, my, 11, '#6a1a12');
    ctx.drawImage(Portraits.get('lu'), 0, 0, 32, 32, mx - 12, my - 12, 24, 24);
    // hp: brush stroke
    brushBar(ctx, 34, 9, 118, 7, p.hp / p.maxHp, this.trail / p.maxHp, ['#5a0e08', '#b0231d', '#e04428', '#f47a52'], '#f2d8a0');
    // qi: four jade-gold segments
    const qx = 36, qy = 20, seg = 22;
    for (let i = 0; i < 4; i++) {
      const f = clamp((p.qi - i * 25) / 25, 0, 1), x = qx + i * (seg + 2);
      ctx.fillStyle = '#140e0c'; ctx.fillRect(x - 1, qy - 1, seg + 2, 5);
      ctx.fillStyle = '#3a2a14'; ctx.fillRect(x, qy, seg, 3);
      if (f > 0) {
        const full = p.qi >= 100;
        ctx.fillStyle = full ? ((G.time >> 3) & 1 ? '#fff0a0' : '#ffd060') : f >= 1 ? '#e8b83a' : '#a07a24';
        ctx.fillRect(x, qy, Math.round(seg * f), 3);
        ctx.fillStyle = '#fff6c8'; ctx.fillRect(x, qy, Math.round(seg * f), 1);
      }
    }
    if (p.qi >= 100) Font.draw(ctx, 'ULTIMATE READY', qx + 100, qy - 2, (G.time >> 4) & 1 ? '#fff0a0' : '#e8b83a', { outline: '#1a0e08' });
    // combo
    if (this.comboShow > 0) {
      const a = Math.min(1, this.comboShow / 20);
      Font.draw(ctx, String(this.comboN), VW - 16, 44, '#ffe08a', { align: 'right', scale: 3, outline: '#2a1206', alpha: a });
      Font.draw(ctx, 'HITS', VW - 16, 74, '#f6e8c8', { align: 'right', outline: '#2a1206', alpha: a });
    }
    // boss
    if (G.boss && G.boss.active && G.boss.hp > 0) this.drawBoss(ctx, G.boss);
    // banner
    if (this.bannerT > 0) {
      const a = Math.min(1, this.bannerT / 20, (100 - Math.min(100, this.bannerT)) / 10 + 0.2);
      inkStroke(ctx, VW / 2, 92, 220, 22, G.time, a * 0.9);
      Font.draw(ctx, this.bannerS, VW / 2, 86, '#f6e8c8', { align: 'center', outline: '#1a0e08', alpha: a });
    }
    // hint
    if (this.hintT > 0 && !Dialogue.active) {
      const a = Math.min(1, this.hintT / 30);
      const lines = Font.wrap(this.hintS, 300);
      const w = Math.max(...lines.map(l => Font.width(l))) + 16, h = lines.length * 11 + 8;
      ctx.save(); ctx.globalAlpha = a;
      ornateBox(ctx, Math.round(VW / 2 - w / 2), 30, w, h, 'rgba(14,10,9,0.8)');
      lines.forEach((l, i) => Font.draw(ctx, l, VW / 2, 35 + i * 11, '#efe3c8', { align: 'center' }));
      ctx.restore();
    }
    if (this.card) this.drawCard(ctx);
  },
  drawBoss(ctx, b) {
    const w = 300, x = (VW - w) / 2, y = 250;
    Font.draw(ctx, b.D.name, x, y - 12, '#f6e8c8', { outline: '#1a0e08' });
    Font.draw(ctx, b.D.title, x + w, y - 12, '#c8a050', { align: 'right', outline: '#1a0e08' });
    brushBar(ctx, x, y, w, 6, Math.max(0, b.hp) / b.maxHp, this.bossTrail, ['#3a0606', '#8a1410', '#c82418', '#ea5030'], '#e8c870');
    ctx.fillStyle = '#e8c870'; ctx.fillRect(Math.round(x + w / 2), y - 1, 1, 8);
  },
  drawCard(ctx) {
    const c = this.card, t = c.t;
    const a = t < 20 ? t / 20 : t > 220 ? (260 - t) / 40 : 1;
    const reveal = Math.min(1, t / 40);
    ctx.save(); ctx.globalAlpha = Math.max(0, a);
    inkStroke(ctx, VW / 2, VH / 2 - 4, 320 * reveal, 38, 7, 0.92);
    Font.draw(ctx, c.ch.toUpperCase(), VW / 2, VH / 2 - 28, '#d6a53a', { align: 'center', outline: '#140c0a' });
    if (t > 26) Font.draw(ctx, c.name, VW / 2, VH / 2 - 12, '#f6ecd6', { align: 'center', scale: 2, outline: '#140c0a' });
    if (t > 50) seal(ctx, VW / 2 + Font.width(c.name, 2) / 2 + 10, VH / 2 - 14, Math.min(1, (t - 50) / 10));
    ctx.restore();
  },
};

function brushBar(ctx, x, y, w, h, f, trail, cols, edge) {
  const ends = (i, len) => (i < 3 ? 3 - i : i > len - 5 ? i - (len - 5) : 0);
  // ink backing with ragged ends
  for (let i = -3; i < w + 5; i++) {
    const r = Math.round(hash2(i, 3, 17) * 1.6);
    ctx.fillStyle = '#120c0a';
    ctx.fillRect(x + i, y - 2 + r, 1, h + 4 - r - Math.round(hash2(i, 5, 17) * 1.4));
  }
  const fw = Math.round(w * clamp(f, 0, 1)), tw = Math.round(w * clamp(trail, 0, 1));
  if (tw > fw) { ctx.fillStyle = edge; ctx.fillRect(x + fw, y, tw - fw, h); }
  for (let i = 0; i < fw; i++) {
    const cut = ends(i, w);
    for (let j = cut; j < h - (i > w - 5 ? cut : 0); j++) {
      ctx.fillStyle = j === 0 ? cols[3] : j === h - 1 ? cols[0] : j === 1 ? cols[2] : ((i + j * 3) % 9 === 0 ? cols[1] : cols[2]);
      ctx.fillRect(x + i, y + j, 1, 1);
    }
  }
}

// horizontal dry-brush ink stroke, used behind banners and chapter titles
function inkStroke(ctx, cx, cy, w, h, seed, a = 1) {
  if (w < 2) return;
  ctx.save(); ctx.globalAlpha *= a;
  const x0 = Math.round(cx - w / 2);
  for (let i = 0; i < w; i++) {
    const u = i / w;
    const thick = h * (u < 0.08 ? 0.5 + u * 6 : u > 0.85 ? Math.max(0.15, (1 - u) * 6.6) : 1) * (0.92 + 0.08 * Math.sin(i * 0.3 + seed));
    const top = cy - thick / 2 + Math.sin(u * 3 + seed) * 2;
    for (let j = 0; j < thick; j++) {
      const dry = u > 0.7 && hash2(Math.floor(j / 2), i >> 2, seed) > 1.25 - u;
      if (dry) continue;
      ctx.fillStyle = hash2(i, j, seed) > 0.96 ? '#2a201c' : '#0e0a09';
      ctx.fillRect(x0 + i, Math.round(top + j), 1, 1);
    }
  }
  ctx.restore();
}

// red seal stamp with a stylized swallow
function seal(ctx, x, y, k) {
  const s = Math.round(18 * (1.4 - 0.4 * k));
  x = Math.round(x - s / 2); y = Math.round(y - s / 2);
  ctx.fillStyle = '#b8261a'; ctx.fillRect(x, y, s, s);
  ctx.fillStyle = '#e8d8c0';
  const sc = s / 18;
  const px = (a, b, w = 1, h = 1) => ctx.fillRect(Math.round(x + a * sc), Math.round(y + b * sc), Math.max(1, Math.round(w * sc)), Math.max(1, Math.round(h * sc)));
  px(2, 2, 14, 1); px(2, 15, 14, 1); px(2, 2, 1, 14); px(15, 2, 1, 14);
  // swallow glyph
  px(5, 8, 8, 1); px(4, 7, 2, 1); px(12, 7, 2, 1); px(8, 6, 2, 3); px(8, 9, 1, 3); px(7, 11, 1, 2); px(10, 11, 1, 2);
  px(3, 6, 1, 1); px(14, 6, 1, 1);
  if (hash2(3, 3, 1) > 0) { ctx.fillStyle = '#d8402a'; ctx.fillRect(x + 1, y + s - 2, 2, 1); }
}

// ==== game/story.js ====
// ---------------------------------------------------------------------------
// Story scripts, written as generators: each yield waits one tick. Helpers
// drive dialogue, actors, the camera and fades.
// ---------------------------------------------------------------------------
const Sc = {
  *wait(n) { for (let i = 0; i < n; i++) yield; },
  *say(who, text) { Dialogue.open(who, text); yield; while (Dialogue.active) yield; },
  actor(cid, x, facing = -1, anim = 'idle') {
    const y = G.map.surfaceBelow(x, G.player ? G.player.y - 20 : 0);
    const a = new Actor(cid, x, y, facing);
    a.setAnim(anim); a.idleAnim = anim;
    G.ents.push(a);
    return a;
  },
  *walk(a, x, sp = 1.2) { a.walkTo = x; a.speed = sp; while (a.walkTo !== null) yield; },
  *pwalk(x) { G.player.autoX = x; while (G.player.autoX !== null) yield; },
  *pan(x, y, n = 60, k = 0.06) { G.cam.focus = { x, y, k }; yield* Sc.wait(n); },
  unpan() { G.cam.focus = null; },
  *fade(out, n = 30) { G.fadeTo = out ? 1 : 0; G.fadeV = 1 / n; yield* Sc.wait(n); },
  face(a, target) { a.facing = target.x > a.x ? 1 : -1; },
  *bossIntro(b, name) {
    G.boss = b; b.active = false;
    Music.play('boss');
    SFX.play('gong');
    Hud.banner(b.D.name + '  |  ' + b.D.title, 120);
    yield* Sc.wait(40);
  },
  lockArena(x0, x1) { G.cam.lock = [x0 * TS, x1 * TS]; G.player.bounds = [x0 * TS, x1 * TS]; },
  unlock() { G.cam.lock = null; G.player.bounds = null; },
};

const STORY = {
  // ===== Chapter I ========================================================
  *ch1_wake() {
    const p = G.player;
    p.setAnim('wake', true); p.control = false;
    yield* Sc.wait(40);
    SFX.play('bell');
    yield* Sc.wait(50);
    yield* Sc.say('lu', '(...A bell. The morning bell of the Crane Sect.)');
    yield* Sc.say('lu', '(No smoke. No screaming. The halls are still standing.)');
    yield* Sc.wait(40);
    yield* Sc.say('lu', '(The sword brought me back. This is the morning of that day. At moonrise, the Crimson Heaven Cult comes for us.)');
    yield* Sc.say('lu', 'Then I have until moonrise.');
    p.control = true; p.setAnim('idle');
    Hud.hint('Move with A / D or the Arrow keys. JUMP with Space, K or Z.');
  },
  *ch1_qin() {
    const p = G.player;

    p.facing = 1;
    yield* Sc.say('qin', 'Little brother! Late for morning practice again? The elders will have your hide.');
    yield* Sc.say('lu', '(Senior Sister Qin Shuang. In that life she held the Hall of Nine Winds alone, until the very end.)');
    yield* Sc.say('lu', 'Senior Sister. It is good to see you.');
    yield* Sc.say('qin', 'You look like you have seen a ghost. Prove you are awake. Cut down the practice dummies.');
    Hud.hint('ATTACK with J or X. Keep pressing for the four-strike Swallow Combo. UP + ATTACK launches a foe.', 600);
    q.walkTo = p.x - 20; q.speed = 1.2;

  },
  *ch1_qin2() {
    const p = G.player;
    const q = G.ents.find(e => e.cid === 'qin');
    if (q) { yield* Sc.walk(q, p.x + (q.x > p.x ? 40 : -40), 1.6); Sc.face(q, p); }
    Sc.face(p, q || p);
    yield* Sc.wait(20);
    yield* Sc.say('qin', 'That form... Where did you learn to cut like that? That is not a disciple\'s sword.');
    yield* Sc.say('lu', 'Senior Sister, if the Crimson Heaven Cult came to the mountain tonight, what would you do?');

    yield* Sc.say('lu', 'Something like one.');
    yield* Sc.say('qin', 'Then take some advice from your elder. A blade you cannot turn aside will kill you. Hold your guard, and tap it the instant a blow lands. Turn their strength back on them.');
    Hud.hint('GUARD with U or C. Tap GUARD as a blade flashes to PARRY and stagger the attacker.', 520);
    yield* Sc.say('qin', 'Master is in closed-door meditation until moonrise. Go on. I will report to the elders.');
    q.speed = 1.6; q.walkTo = p.x + 260;
    yield* Sc.wait(30);
  },
  *ch1_scouts() {
    const p = G.player;
    p.facing = 1;
    const a = Sc.actor('cultist', 96 * TS, -1), b = Sc.actor('cultist', 100 * TS, -1);
    yield* Sc.pan(98 * TS, p.y, 50);

    yield* Sc.say('cult', 'Then his throat is the first we cut. Quietly.');
    Sc.unpan();
    yield* Sc.say('lu', '(Crimson Heaven masks, already inside the walls this morning. So this is how the gate fell.)');
    a.remove = b.remove = true;
    const e1 = spawnEnemy('cultist', a.x, a.y, { aggro: true }), e2 = spawnEnemy('cultist', b.x, b.y, { aggro: true });
    const A = G.level.arenas[0];
    startArena({ ...A, waves: A.waves.slice(1) }, [e1, e2]);
  },
  *ch1_boss() {
    const p = G.player;
    Sc.lockArena(178, 212);

// ==== game/scenes.js ====
// ---------------------------------------------------------------------------
// Scenes: title, prologue, gameplay (with pause and game over), ending.
// G holds the live world state shared by every module.
// ---------------------------------------------------------------------------
const G = {
  time: 0, hitstop: 0, slow: 0, map: null, ents: [], props: [], fronts: [], player: null, cam: null,
  script: null, seen: new Set(), fade: 1, fadeTo: 0, fadeV: 0.04, fxOn: true, carry: null, moonRage: 0,
  stats: { kills: 0, maxCombo: 0, parries: 0, deaths: 0, hurt: 0, start: 0, frames: 0 },
  dbg: [], debugBoxes: false,
  resetStats() { this.stats = { kills: 0, maxCombo: 0, parries: 0, deaths: 0, hurt: 0, frames: 0 }; },
};

const Scenes = {
  cur: null,
  go(s) { if (this.cur && this.cur.exit) this.cur.exit(); this.cur = s; if (s.enter) s.enter(); Input.flush(); },
};

const SAVE = {
  get() { try { return JSON.parse(localStorage.getItem('returning-swallow') || '{}'); } catch (e) { return {}; } },
  set(o) { try { localStorage.setItem('returning-swallow', JSON.stringify({ ...this.get(), ...o })); } catch (e) { /* storage unavailable */ } },
};

const CONTROLS = [
  ['Move', 'A D  /  Arrows'], ['Jump (twice in air)', 'Space  K  /  Z'], ['Attack', 'J  /  X'], ['Up + Attack', 'Launcher'],
  ['Down + Attack (air)', 'Plunge'], ['Dash', 'L  Shift  /  Shift'], ['Guard, tap to Parry', 'U  /  C'], ['Qi Wave', 'I  /  V'],
  ['Ultimate (full qi)', 'O  /  B'], ['Pause', 'Esc  P'],
];
function drawControls(ctx, y0 = 40) {
  ornateBox(ctx, 80, y0, 320, 176);
  Font.draw(ctx, 'THE WAY OF THE SWALLOW SWORD', VW / 2, y0 + 8, '#d6a53a', { align: 'center' });
  CONTROLS.forEach(([a, b], i) => {
    Font.draw(ctx, a, 96, y0 + 26 + i * 14, '#efe3c8');
    Font.draw(ctx, b, 384, y0 + 26 + i * 14, '#c8a050', { align: 'right' });
  });
  Font.draw(ctx, 'Gamepad supported', VW / 2, y0 + 164, '#8a7a64', { align: 'center' });
}

// ---------------------------------------------------------------------------
class TitleScene {
  enter() {
    G.fade = 1; G.fadeTo = 0; G.fadeV = 0.02;
    const L = LEVELS[0], B = new MapBuilder(L.w, L.h); L.build(B);
    G.map = new TileMap(B.rows());
    this.bd = Backdrop.make('peak', G.map);
    this.t = 0; this.sel = 0; this.mode = 'press'; this.cranes = [];
    for (let i = 0; i < 5; i++) this.cranes.push({ x: rnd(-200, 480), y: rnd(30, 110), s: rnd(0.25, 0.5), ph: rnd(TAU) });
    const save = SAVE.get();
    this.unlocked = save.chapter || 1;
    this.items = ['Begin the Journey', 'Chapters', 'Controls'];
    if (AudioSys.ready) Music.play('title');
  }
  update() {
    this.t++; G.time++;
    FX.update();
    if (this.t % 9 === 0) FX.part({ kind: 'petal', x: rnd(0, VW + 60), y: -4, vx: rnd(-0.5, -0.1), vy: rnd(0.3, 0.6), sway: 0.06, life: 500, cols: ['#f6d6dc', '#e8a0ac'], layer: 1, spin: 0.08 });
    if (this.mode === 'press') {
      if (Input.hit('confirm') || Input.hit('attack') || this.anyKey) { this.anyKey = false; AudioSys.init(); Music.play('title'); SFX.play('select'); this.mode = 'menu'; }
      return;
    }
    if (this.mode === 'controls' || this.mode === 'chapters') {
      if (this.mode === 'chapters') {
        if (Input.hit('down')) { this.csel = Math.min(this.unlocked - 1, this.csel + 1); SFX.play('menu'); }
        if (Input.hit('up')) { this.csel = Math.max(0, this.csel - 1); SFX.play('menu'); }
        if (Input.hit('confirm')) { SFX.play('select'); startGame(this.csel); return; }
      }
      if (Input.hit('back') || (this.mode === 'controls' && Input.hit('confirm'))) { this.mode = 'menu'; SFX.play('menu'); }
      return;
    }
    if (Input.hit('down')) { this.sel = (this.sel + 1) % this.items.length; SFX.play('menu'); }
    if (Input.hit('up')) { this.sel = (this.sel + this.items.length - 1) % this.items.length; SFX.play('menu'); }
    if (Input.hit('confirm')) {
      SFX.play('select');
      if (this.sel === 0) Scenes.go(new PrologueScene());
      else if (this.sel === 1) { this.mode = 'chapters'; this.csel = 0; }
      else this.mode = 'controls';
    }
  }
  draw(ctx) {
    const cam = { x: this.t * 0.25, y: 60 };
    Backdrop.draw(ctx, this.bd, cam, G.map, this.t);
    for (const c of this.cranes) {
      c.x += c.s; if (c.x > VW + 30) { c.x = -30; c.y = rnd(30, 110); }
      drawCrane(ctx, c.x, c.y + Math.sin(this.t * 0.02 + c.ph) * 4, this.t + c.ph * 20);
    }
    FX.draw(ctx, { x: 0, y: 0 }, 1);
    // title block
    inkStroke(ctx, VW / 2, 78, 330, 46, 3, 0.9);
    Font.draw(ctx, 'RETURNING SWALLOW', VW / 2, 62, '#f6ecd6', { align: 'center', scale: 3, outline: '#140c0a' });
    Font.draw(ctx, 'A TALE OF THE MURIM', VW / 2, 98, '#d6a53a', { align: 'center', outline: '#140c0a' });
    seal(ctx, VW / 2 + 166, 70, 1);
    if (this.mode === 'press') {
      if ((this.t >> 5) & 1) Font.draw(ctx, 'PRESS ANY KEY', VW / 2, 190, '#f6ecd6', { align: 'center', outline: '#140c0a' });
    } else if (this.mode === 'menu') {
      this.items.forEach((s, i) => {
        const y = 160 + i * 16, on = i === this.sel;
        if (on) inkStroke(ctx, VW / 2, y + 4, Font.width(s) + 40, 13, i + 1, 0.85);
        Font.draw(ctx, s, VW / 2, y, on ? '#ffe08a' : '#efe3c8', { align: 'center', outline: '#140c0a' });
      });
    } else if (this.mode === 'controls') drawControls(ctx);
    else if (this.mode === 'chapters') {
      ornateBox(ctx, 110, 120, 260, 86);
      LEVELS.forEach((L, i) => {
        const lock = i >= this.unlocked, on = i === this.csel;
        Font.draw(ctx, lock ? '. . .' : `${L.chapter}: ${L.name}`, VW / 2, 130 + i * 17, lock ? '#5a4a3a' : on ? '#ffe08a' : '#efe3c8', { align: 'center' });
      });
    }
    Font.draw(ctx, 'opus55-pixel', VW - 6, VH - 12, '#8a6a4a', { align: 'right' });
  }
}
Input.onKey(() => { if (Scenes.cur instanceof TitleScene && Scenes.cur.mode === 'press') Scenes.cur.anyKey = true; });

function drawCrane(ctx, x, y, t) {
  x = Math.round(x); y = Math.round(y);
  const f = Math.floor(t / 10) % 4, wing = [-3, -1, 2, -1][f];
  ctx.fillStyle = '#f6f0e4';
  ctx.fillRect(x - 3, y, 7, 2); ctx.fillRect(x + 4, y - 1, 4, 1); ctx.fillRect(x + 8, y - 2, 2, 1);
  ctx.fillStyle = '#c23a22'; ctx.fillRect(x + 9, y - 3, 1, 1);
  ctx.fillStyle = '#2a2020'; ctx.fillRect(x + 10, y - 2, 2, 1); ctx.fillRect(x - 7, y + 1, 4, 1);
  ctx.fillStyle = '#e8e0d0';
  for (let i = 0; i < 6; i++) ctx.fillRect(x - 2 + i, y + Math.round(wing * (1 - i / 6)) - (wing < 0 ? 1 : 0), 1, 1);
  ctx.fillStyle = '#1a1414'; ctx.fillRect(x - 2, y + wing - (wing < 0 ? 1 : 0), 2, 1);
}

function startGame(idx = 0) {
  G.resetStats(); G.seen = new Set(); G.carry = null; G.persistArenas = [];
  Scenes.go(new GameScene(idx));
}

// ---------------------------------------------------------------------------
class PrologueScene {
  enter() {
    this.lines = [
      'Forty years ago, the Nine Orthodox Sects drove the Crimson Heaven Cult into the western wastes.',
      'The murim called it peace.',
      'Peace, like snow on a plum branch, is lovely. And it does not last.',
    ];
    this.t = 0; this.step = 0; this.stage = 'text';
    Music.play('sorrow');
  }
  update() {
    this.t++; G.time++;
    if (Input.hit('skip') || Input.hit('pause')) { Scenes.go(new GameScene(0)); return; }
    if (this.stage === 'text') {
      if (Input.hit('confirm') && this.t > 30) { this.step++; this.t = 0; SFX.play('menu'); }
      if (this.t > 260) { this.step++; this.t = 0; }
      if (this.step >= this.lines.length) { this.stage = 'scene'; this.setupScene(); }
      return;
    }
    G.time++;
    if (G.script) { const r = G.script.next(); if (r.done) G.script = null; }
    Dialogue.update();
    for (const e of G.ents) e.update();
    for (const p of G.props) p.update();
    FX.update();
    if (G.time % 3 === 0) FX.part({ kind: 'ember', x: G.cam.x + rnd(0, VW), y: G.cam.y + VH + 4, vx: rnd(-0.4, 0.4), vy: rnd(-1.4, -0.6), life: rndi(80, 200), cols: ['#ffd08a', '#ff8a3a', '#e8481a'], layer: 1 });
    G.fade = approach(G.fade, G.fadeTo, G.fadeV);
  }
  setupScene() {
    const L = LEVELS[0], B = new MapBuilder(L.w, L.h); L.build(B);
    G.map = new TileMap(B.rows());
    G.terrain = Terrain.build(G.map, 'peak');
    G.bd = Backdrop.make('burning', G.map);
    G.ents = []; G.props = []; FX.clear();
    G.props.push(new Prop('hall', 16 * TS + 8, 18 * TS, { w: 190, h: 112, lit: true }));
    for (const x of [6, 12, 20, 27]) G.props.push(new Prop('fire', x * TS, 18 * TS - rnd(40, 90), { s: 10 }));
    for (const x of [3, 31]) G.props.push(new Prop('fire', x * TS, 18 * TS, { s: 8 }));
    G.player = new Actor('hero', 14 * TS, 18 * TS, 1); G.player.setAnim('kneel');
    const d = new Actor('demon', 19 * TS, 18 * TS, -1);
    G.ents.push(G.player, d);
    G.cam = new Camera(); G.cam.x = 16 * TS - VW / 2; G.cam.y = 18 * TS - VH * 0.62;
    G.fade = 1; G.fadeTo = 0; G.fadeV = 0.02;
    G.script = (function* () {
      yield* Sc.wait(90);
      yield* Sc.say('demon', 'The White Crane Sect. Four hundred years of history, and it burns like any other kindling.');
      yield* Sc.say('lu', '...Master. Senior Sister. Everyone...');
      yield* Sc.say('demon', 'Your Swallow Sword was elegant. It is also finished. Kneel, boy, and I will make it quick.');
      yield* Sc.say('lu', '(The founder\'s sword. Swallow\'s Return. They say it always finds its way home.)');
      yield* Sc.say('lu', '(If I could go back. Only one day. I would change all of it.)');
      for (let i = 0; i < 90; i++) { if (i % 3 === 0) FX.qi(G.player.x + 10, G.player.y - 20, 3, ['#ffffff', '#fff6d0', '#ffd060']); yield; }
      yield* Sc.say('demon', 'That light... what is that light?');
      SFX.play('ultStart'); FX.flash('#ffffff', 90);
      yield* Sc.wait(60);
      G.fadeTo = 1; G.fadeV = 0.05;
      yield* Sc.wait(40);
      G.prologueEnd = 1;
    })();
  }
  draw(ctx) {
    if (this.stage === 'text') {
      ctx.fillStyle = '#0a0706'; ctx.fillRect(0, 0, VW, VH);
      const line = this.lines[this.step];
      if (line) {
        const a = Math.min(1, this.t / 40, (260 - this.t) / 30);
        Font.wrap(line, 360).forEach((l, i) => Font.draw(ctx, l, VW / 2, 120 + i * 13, '#e8dcc4', { align: 'center', alpha: Math.max(0, a) }));
      }
      Font.draw(ctx, 'Tab: skip', VW - 6, VH - 12, '#4a3a2a', { align: 'right' });
      return;
    }
    const cam = G.cam.view();
    Backdrop.draw(ctx, G.bd, cam, G.map, G.time);
    for (const p of G.props) p.draw(ctx, cam);
    ctx.drawImage(G.terrain, cam.x, cam.y, VW, VH, 0, 0, VW, VH);
    FX.draw(ctx, cam, 0);
    for (const e of G.ents) e.draw(ctx, cam);
    FX.draw(ctx, cam, 1);
    Light.begin('#0a0204', 0.45);
    for (const p of G.props) { const out = []; p.lights(cam, out); for (const l of out) Light.hole(l[0], l[1], l[2]); }
    Light.end(ctx);
    for (const p of G.props) { const out = []; p.lights(cam, out); for (const l of out) Light.glow(ctx, l[0], l[1], l[2] * 0.8, l[3], 0.25); }
    Dialogue.draw(ctx);
    FX.drawFlash(ctx);
    drawFade(ctx);
    if (G.prologueEnd && G.fade >= 0.99) {
      Font.draw(ctx, 'A swallow that leaves in autumn always returns.', VW / 2, VH / 2 - 4, '#e8dcc4', { align: 'center' });
      if (++this.endT > 200 || (this.endT > 40 && Input.hit('confirm'))) { G.prologueEnd = 0; Scenes.go(new GameScene(0)); }
    }
  }
}
PrologueScene.prototype.endT = 0;

function drawFade(ctx) {
  if (G.fade <= 0.001) return;
  ctx.save(); ctx.globalAlpha = clamp(G.fade, 0, 1); ctx.fillStyle = '#080505'; ctx.fillRect(0, 0, VW, VH); ctx.restore();
}

// ---------------------------------------------------------------------------
const THEME_FX = {
  peak: { dark: null, water: ['#4a6a5a', '#8ab09a', '#d8e8d8'] },
  bamboo: { dark: null, water: ['#3a5a42', '#6a9070', '#c8e0c0'] },
  town: { dark: ['#1a0806', 0.32], water: ['#4a2a22', '#8a4a30', '#f0a060'] },
  fort: { dark: ['#050102', 0.55], water: ['#1a0808', '#3a1010', '#8a2a1a'] },
};

class GameScene {
  constructor(idx, cp) { this.idx = idx; this.cp = cp; }
  enter() {
    loadLevel(this.idx, this.cp);
    const L = G.level;
    Hud.reset(); Dialogue.active = false; G.script = null; G.ult = null; G.hitstop = 0; G.slow = 0; G.moonRage = 0;
    G.fade = 1; G.fadeTo = 0; G.fadeV = 0.03;
    Music.play(L.music);
    if (!this.cp) Hud.chapterCard(L.chapter, L.name);
    this.paused = false; this.over = null; this.acc = 0;
    SAVE.set({ chapter: Math.max(SAVE.get().chapter || 1, this.idx + 1) });
    G.nextChapter = () => {
      G.carry = { hp: G.player.hp, qi: G.player.qi };
      G.persistArenas = [];
      if (this.idx + 1 < LEVELS.length) Scenes.go(new GameScene(this.idx + 1));
      else Scenes.go(new EndingScene());
    };
    G.bossDefeated = b => { G.boss = null; Music.stop(1.5); G.script = STORY['ch' + (this.idx + 1) + '_end'](b); };
    G.onBossPhase = b => { if (b.id === 'demon') G.script = STORY.ch4_phase2(b); else FX.text(b.x, b.y - 70, b.id === 'moying' ? 'ENOUGH GAMES' : b.id === 'liu' ? 'NOW I AM ANGRY' : 'AMITABHA', '#ffb08a', { life: 70 }); };
    G.onPlayerDeath = () => { this.over = { t: 0, sel: 0 }; Music.play('sorrow'); };
  }
  update() {
    G.time++;
    Hud.update();
    if (this.over) return this.updateOver();
    if (this.paused) return this.updatePause();
    if (Input.hit('pause') && !Dialogue.active && !G.ult) { this.paused = true; this.psel = 0; this.pmode = 'menu'; SFX.play('menu'); return; }
    Dialogue.update();
    let steps = 1;
    if (G.slow > 0) { G.slow--; this.acc += 0.35; steps = Math.floor(this.acc); this.acc -= steps; }
    for (let i = 0; i < steps; i++) this.tick();
    if (!steps) FX.update();
    G.fade = approach(G.fade, G.fadeTo, G.fadeV);
    G.stats.frames++;
  }
  tick() {
    if (G.script) { const r = G.script.next(); if (r.done) G.script = null; }
    else if (!Hud.card || Hud.card.t > 150) this.checkEvents();
    if (G.ult) { updateUltimate(); FX.update(); G.cam.update(G.player, G.map); return; }
    if (G.hitstop > 0) { G.hitstop--; FX.update(); return; }
    const E = G.ents;
    for (let i = 0; i < E.length; i++) E[i].update();
    G.ents = G.ents.filter(e => !e.remove);
    for (const p of G.props) { p.update(); if (p.shrine) this.checkShrine(p); }
    for (const p of G.fronts) p.update();
    updateArena();
    if (G.waitDummies && !G.script && !G.ents.some(e => e.kind === 'dummy')) { G.waitDummies = false; G.script = STORY.ch1_qin2(); }
    FX.update();
    this.weather();
    G.cam.update(G.player, G.map);
    if (G.moonRage > 0) G.moonRage = Math.min(1, G.moonRage + 0.01);
    if (G.moonRage < 0) G.moonRage = Math.min(0, G.moonRage + 0.01);
  }
  checkEvents() {
    const p = G.player;
    for (const [i, ev] of G.level.events.entries()) {
      const key = 'ev' + i;
      if (G.firedEvents.has(key) || p.x < ev.x * TS) continue;
      G.firedEvents.add(key);
      if (ev.run === 'hint') Hud.hint(ev.text);
      else if (STORY[ev.run]) { G.script = STORY[ev.run](); break; }
    }
  }
  checkShrine(s) {
    const p = G.player;
    if (s.active || Math.abs(p.x - s.x) > 20 || Math.abs(p.y - s.y) > 30) return;
    s.active = true;
    p.hp = p.maxHp;
    G.checkpoint = { x: s.x, y: s.y, events: [...G.firedEvents] };
    G.persistArenas = [...G.clearedArenas];
    SFX.play('shrine');
    Hud.banner('SHRINE OF REST: YOUR PATH IS REMEMBERED', 120);
    FX.ring(s.x, s.y - 20, { r0: 4, r1: 50, c: '#ffe08a', life: 30 });
  }
  weather() {
    const th = G.level.theme, cam = G.cam, t = G.time;
    if (th === 'peak' && t % 14 === 0) FX.part({ kind: 'petal', x: cam.x + rnd(0, VW + 80), y: cam.y - 4, vx: rnd(-0.5, -0.1), vy: rnd(0.3, 0.6), sway: 0.06, life: 420, cols: ['#f6d6dc', '#e8a0ac'], layer: 1, spin: 0.08 });
    if (th === 'bamboo' && t % 10 === 0) FX.part({ kind: 'leaf', x: cam.x + rnd(0, VW + 80), y: cam.y - 4, vx: rnd(-0.7, -0.2), vy: rnd(0.4, 0.8), sway: 0.05, life: 400, cols: ['#8fb04a', '#6b8f3c'], c2: '#b4cf6a', layer: 1, spin: 0.05 });
    if (th === 'town' && t % 16 === 0) FX.part({ kind: 'ember', x: cam.x + rnd(0, VW), y: cam.y + VH, vx: rnd(-0.3, 0.3), vy: rnd(-0.8, -0.4), life: 300, cols: ['#ffd08a', '#ff9a3a'], layer: 0 });
    if (th === 'fort') {
      if (t % 5 === 0) FX.part({ kind: 'ember', x: cam.x + rnd(0, VW + 40), y: cam.y + VH + 2, vx: rnd(-0.6, 0.2), vy: rnd(-1.4, -0.5), life: rndi(140, 260), cols: ['#ffd08a', '#ff6a2a', '#c02010'], layer: 1 });
      if (t % 9 === 0) FX.part({ kind: 'px', x: cam.x + rnd(0, VW + 60), y: cam.y - 2, vx: rnd(-0.4, -0.1), vy: rnd(0.2, 0.5), sway: 0.04, life: 400, cols: ['#5a4a48', '#3a302e'], layer: 1 });
      if (Math.random() < 0.002) { FX.flash('#ff3a1a', 5); SFX.play('thunder'); }
    }
  }
  draw(ctx) {
    const cam = G.cam.view();
    Backdrop.draw(ctx, G.bd, cam, G.map, G.time);
    if (G.moonRage) { ctx.save(); ctx.globalAlpha = Math.abs(G.moonRage) * 0.35 * (G.moonRage > 0 ? 1 : 0.5); ctx.fillStyle = '#ff2a0a'; ctx.fillRect(0, 0, VW, VH); ctx.restore(); }
    for (const p of G.props) p.draw(ctx, cam);
    const sx = clamp(cam.x, 0, G.map.pw - VW), sy = clamp(cam.y, 0, G.map.ph - VH);
    ctx.drawImage(G.terrain, sx, sy, VW, VH, sx - cam.x, sy - cam.y, VW, VH);
    FX.draw(ctx, cam, 0);
    const list = G.ents.slice().sort((a, b) => (a.z || 0) - (b.z || 0));
    for (const e of list) e.draw(ctx, cam);
    this.drawWater(ctx, cam);
    FX.draw(ctx, cam, 1);
    for (const p of G.fronts) p.draw(ctx, cam);
    this.lighting(ctx, cam);
    if (G.debugBoxes) { ctx.strokeStyle = 'rgba(255,0,0,0.8)'; for (const b of G.dbg) ctx.strokeRect(b[0] - cam.x + 0.5, b[1] - cam.y + 0.5, b[2], b[3]); G.dbg.length = 0; for (const e of G.ents) if (e.hittable) { const b = e.box(); ctx.strokeStyle = 'rgba(0,255,0,0.6)'; ctx.strokeRect(b[0] - cam.x + 0.5, b[1] - cam.y + 0.5, b[2], b[3]); } }
    if (G.ult) drawUltimate(ctx, cam);
    Hud.draw(ctx);
    Dialogue.draw(ctx);
    FX.drawFlash(ctx);
    drawFade(ctx);
    if (this.paused) this.drawPause(ctx);
    if (this.over) this.drawOver(ctx);
  }
  drawWater(ctx, cam) {
    const m = G.map, T = THEME_FX[G.level.theme].water;
    const tx0 = Math.floor(cam.x / TS), tx1 = Math.ceil((cam.x + VW) / TS);
    for (let tx = tx0; tx <= tx1; tx++) for (let ty = 0; ty < m.h; ty++) {
      const t = m.get(tx, ty);
      if (t !== T_WTOP && t !== T_WATER) continue;
      const x = tx * TS - cam.x, y = ty * TS - cam.y;
      ctx.save(); ctx.globalAlpha = 0.72; ctx.fillStyle = T[0];
      if (t === T_WTOP) { ctx.fillRect(x, y + 4, TS, TS - 4); } else ctx.fillRect(x, y, TS, TS);
      ctx.restore();
      if (t === T_WTOP) {
        for (let i = 0; i < TS; i++) {
          const wx = tx * TS + i, wv = Math.round(Math.sin(wx * 0.18 + G.time * 0.06) * 1.2 + Math.sin(wx * 0.07 - G.time * 0.03));
          ctx.fillStyle = T[1]; ctx.fillRect(x + i, y + 4 + wv, 1, 1);
          if ((wx + (G.time >> 3)) % 11 === 0) { ctx.fillStyle = T[2]; ctx.fillRect(x + i, y + 4 + wv, 2, 1); }
        }
      }
    }
  }
  lighting(ctx, cam) {
    const D = THEME_FX[G.level.theme].dark;
    if (!D) return;
    const lights = [];
    for (const p of G.props) p.lights(cam, lights);
    const pl = G.player;
    lights.push([pl.x - cam.x, pl.y - 26 - cam.y, 60, '#ffe8c0']);
    for (const e of G.ents) if (e.proj && (e.kind === 'wave' || e.kind === 'bloodwave' || e.kind === 'palm' || e.kind === 'spike')) lights.push([e.x - cam.x, e.y - cam.y, 34, e.kind === 'wave' ? '#ffd060' : '#ff4a26']);
    Light.begin(D[0], D[1]);
    for (const l of lights) if (l[0] > -80 && l[0] < VW + 80) Light.hole(l[0], l[1], l[2]);
    Light.end(ctx);
    for (const l of lights) if (l[0] > -80 && l[0] < VW + 80 && l[3] !== '#ffe8c0') Light.glow(ctx, l[0], l[1], l[2] * 0.7, l[3], 0.22);
  }
  updatePause() {
    const items = ['Resume', 'Controls', 'Return to last shrine', 'Quit to title'];
    if (this.pmode === 'controls') { if (Input.hit('back') || Input.hit('confirm') || Input.hit('pause')) this.pmode = 'menu'; return; }
    if (Input.hit('pause') || Input.hit('back')) { this.paused = false; return; }
    if (Input.hit('down')) { this.psel = (this.psel + 1) % items.length; SFX.play('menu'); }
    if (Input.hit('up')) { this.psel = (this.psel + items.length - 1) % items.length; SFX.play('menu'); }
    if (Input.hit('confirm')) {
      SFX.play('select');
      if (this.psel === 0) this.paused = false;
      else if (this.psel === 1) this.pmode = 'controls';
      else if (this.psel === 2) Scenes.go(new GameScene(this.idx, G.checkpoint));
      else Scenes.go(new TitleScene());
    }
  }
  drawPause(ctx) {
    ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = '#0a0706'; ctx.fillRect(0, 0, VW, VH); ctx.restore();
    if (this.pmode === 'controls') return drawControls(ctx);
    ornateBox(ctx, 160, 80, 160, 96);
    Font.draw(ctx, 'STILLNESS', VW / 2, 88, '#d6a53a', { align: 'center' });
    ['Resume', 'Controls', 'Return to last shrine', 'Quit to title'].forEach((s, i) => Font.draw(ctx, (i === this.psel ? '@ ' : '') + s, VW / 2, 108 + i * 15, i === this.psel ? '#ffe08a' : '#efe3c8', { align: 'center' }));
  }
  updateOver() {
    const o = this.over;
    o.t++;
    if (o.t < 40) return;
    if (Input.hit('down') || Input.hit('up')) { o.sel = 1 - o.sel; SFX.play('menu'); }
    if (Input.hit('confirm')) {
      SFX.play('select');
      if (o.sel === 0) { G.carry = null; Scenes.go(new GameScene(this.idx, G.checkpoint)); }
      else Scenes.go(new TitleScene());
    }
  }
  drawOver(ctx) {
    const o = this.over, a = Math.min(1, o.t / 60);
    ctx.save(); ctx.globalAlpha = a * 0.75; ctx.fillStyle = '#140404'; ctx.fillRect(0, 0, VW, VH); ctx.restore();
    ctx.save(); ctx.globalAlpha = a;
    inkStroke(ctx, VW / 2, 104, 300, 40, 9, 0.95);
    Font.draw(ctx, 'THE SWALLOW FALLS', VW / 2, 94, '#e8604a', { align: 'center', scale: 2, outline: '#140404' });
    Font.draw(ctx, 'But a swallow always returns.', VW / 2, 132, '#c8b8a0', { align: 'center' });
    ['Rise again at the last shrine', 'Return to title'].forEach((s, i) => Font.draw(ctx, (i === o.sel ? '@ ' : '') + s, VW / 2, 160 + i * 15, i === o.sel ? '#ffe08a' : '#efe3c8', { align: 'center', outline: '#140404' }));
    ctx.restore();
  }
}

class EndingScene {
  enter() {
    const L = LEVELS[0], B = new MapBuilder(L.w, L.h); L.build(B);
    G.map = new TileMap(B.rows());
    G.terrain = Terrain.build(G.map, 'peak');
    G.bd = Backdrop.make('peak', G.map);
    G.ents = []; G.props = []; FX.clear(); G.level = L;
    for (const [type, tx, ty, o = {}] of L.props) if (tx > 30 && tx < 76) G.props.push(new Prop(type, tx * TS + 8, ty * TS, o));
    G.player = new Actor('hero', 26 * TS, 18 * TS, 1);
    const bai = new Actor('bai', 50 * TS, 14 * TS, -1), qin = new Actor('qin', 46 * TS, 14 * TS, -1);
    G.ents.push(G.player, bai, qin);
    G.cam = new Camera(); G.cam.x = 36 * TS - VW / 2; G.cam.y = 16 * TS - VH * 0.62;
    G.fade = 1; G.fadeTo = 0; G.fadeV = 0.01;
    Music.play('dawn');
    this.stage = 'story'; this.t = 0;
    const self = this;
    G.script = (function* () {
      yield* Sc.wait(60);
      G.player.walkTo = 41 * TS; G.player.speed = 1;
      while (G.player.walkTo !== null) yield;
      yield* Sc.say('qin', 'Lu Yan!');
      yield* Sc.say('bai', 'So. The disciple who is always late returns at dawn, having saved his sect before breakfast.');
      yield* Sc.say('lu', 'Master... You are safe.');
      yield* Sc.say('bai', 'Qin Shuang brought me a letter sealed in black wax. The east hall is empty now. Gu Wen fled in the night, and I hear he did not get far.');
      yield* Sc.say('bai', 'You look as if you have lived a whole lifetime since yesterday morning.');
      yield* Sc.say('lu', '...Only a day, Master. Just one day.');
      yield* Sc.say('bai', 'Then rest. Tomorrow you will tell me how you learned the last form of the Swallow Sword. No one has seen it performed in two hundred years.');
      yield* Sc.say('qin', 'And you will tell me why you called me "Senior Sister" as if you were saying goodbye.');
      G.player.setAnim('salute');
      yield* Sc.say('lu', '(Tomorrow. There is a tomorrow now.)');
      yield* Sc.wait(60);
      G.fadeTo = 1; G.fadeV = 0.01;
      yield* Sc.wait(110);
      self.stage = 'credits'; self.t = 0;
    })();
    SAVE.set({ chapter: 4, done: 1 });
  }
  update() {
    G.time++; this.t++;
    if (this.stage === 'story') {
      if (G.script) { const r = G.script.next(); if (r.done) G.script = null; }
      Dialogue.update();
      for (const e of G.ents) e.update();
      for (const p of G.props) p.update();
      FX.update();
      if (G.time % 12 === 0) FX.part({ kind: 'petal', x: G.cam.x + rnd(0, VW + 80), y: G.cam.y - 4, vx: rnd(-0.5, -0.1), vy: rnd(0.3, 0.6), sway: 0.06, life: 420, cols: ['#f6d6dc', '#e8a0ac'], layer: 1, spin: 0.08 });
      G.fade = approach(G.fade, G.fadeTo, G.fadeV);
    } else if (this.t > 200 && Input.hit('confirm')) Scenes.go(new TitleScene());
  }
  draw(ctx) {
    if (this.stage === 'story') {
      const cam = G.cam.view();
      Backdrop.draw(ctx, G.bd, cam, G.map, G.time);
      for (const p of G.props) p.draw(ctx, cam);
      ctx.drawImage(G.terrain, cam.x, cam.y, VW, VH, 0, 0, VW, VH);
      for (const e of G.ents) e.draw(ctx, cam);
      FX.draw(ctx, cam, 1);
      Dialogue.draw(ctx);
      drawFade(ctx);
      return;
    }
    ctx.fillStyle = '#0a0706'; ctx.fillRect(0, 0, VW, VH);
    const s = G.stats, secs = Math.floor(s.frames / 60);
    const lines = [
      ['The swallow returned, and spring came to Heaven\'s Crane Peak.', '#e8dcc4'], ['', ''],
      ['RETURNING SWALLOW', '#d6a53a'], ['', ''], ['A tale of the murim', '#a89a84'], ['', ''],
      [`Time on the road   ${Math.floor(secs / 60)}m ${String(secs % 60).padStart(2, '0')}s`, '#efe3c8'],
      [`Foes defeated   ${s.kills}`, '#efe3c8'], [`Longest combo   ${s.maxCombo}`, '#efe3c8'],
      [`Perfect parries   ${s.parries}`, '#efe3c8'], [`Times fallen   ${s.deaths}`, '#efe3c8'], ['', ''],
      [rankOf(s), '#ffe08a'], ['', ''], ['Built as opus55-pixel', '#6a5a4a'],
    ];
    const y0 = Math.max(30, 250 - this.t * 0.6);
    lines.forEach(([l, c], i) => { if (l) Font.draw(ctx, l, VW / 2, y0 + i * 14, c, { align: 'center', scale: i === 2 ? 2 : 1 }); });
    if (this.t > 200) Font.draw(ctx, 'Press ATTACK to return', VW / 2, VH - 16, '#6a5a4a', { align: 'center' });
  }
}
function rankOf(s) {
  const score = s.maxCombo * 2 + s.parries * 5 + s.kills - s.deaths * 15;
  return score > 220 ? 'Rank: Heavenly Sword Saint' : score > 140 ? 'Rank: Peerless Master' : score > 80 ? 'Rank: Crane Elder' : 'Rank: Wandering Disciple';
}

// ---------------------------------------------------------------------------
// Debug views, reachable with URL parameters. ?sheet=<costume>&page=n&zoom=z
// renders every animation of a costume as a contact sheet.
// ---------------------------------------------------------------------------
const Debug = {
  params: new URLSearchParams(location.search),
  sheet(ctx, id, page = 0, zoom = 1) {
    const C = COSTUME[id];
    const set = ANIMS[C.anims];
    const names = Object.keys(set);
    const cw = 60, ch = 66;
    const cols = Math.floor(VW / (cw * zoom)), rows = Math.floor(VH / (ch * zoom));
    const tmp = mkCanvas(cw, ch), tx = ctxOf(tmp);
    ctx.fillStyle = '#6d7a6c';
    ctx.fillRect(0, 0, VW, VH);
    for (let r = 0; r < rows; r++) {
      const name = names[page * rows + r];
      if (!name) break;
      const A = set[name];
      for (let c = 0; c < cols; c++) {
        const t = (A.total * c) / cols;
        const fr = frameFor(C, name, t);
        tx.clearRect(0, 0, cw, ch);
        tx.fillStyle = (r + c) % 2 ? '#7c8a7a' : '#738170';
        tx.fillRect(0, 0, cw, ch);
        tx.fillStyle = '#3a3f36';
        tx.fillRect(0, ch - 8, cw, 1);
        blitFrame(tx, fr, cw / 2, ch - 8, 1);
        ctx.drawImage(tmp, c * cw * zoom, r * ch * zoom, cw * zoom, ch * zoom);
      }
      Font.draw(ctx, name, 2, r * ch * zoom + 2, '#fff', { shadow: '#000' });
    }
  },
};

// ==== game/main.js ====
// ---------------------------------------------------------------------------
// Boot: canvas scaling, the fixed-step main loop and test hooks.
// ---------------------------------------------------------------------------
const screen = document.getElementById('screen');
const ctx = ctxOf(screen);
function fitScreen() {
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  const k = Math.floor(s) >= 2 && Math.floor(s) / s > 0.84 ? Math.floor(s) : s;
  screen.style.width = Math.floor(VW * k) + 'px';
  screen.style.height = Math.floor(VH * k) + 'px';
}
addEventListener('resize', fitScreen);
fitScreen();
Light.init();
addEventListener('pointerdown', () => AudioSys.init());
addEventListener('keydown', () => { if (AudioSys.ready && AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume(); if (!AudioSys.ready && !(Scenes.cur instanceof TitleScene)) AudioSys.init(); });

const STEP = 1000 / 60;
let last = performance.now(), acc = 0, crashed = null;
function frame(now) {
  acc += Math.min(100, now - last);
  last = now;
  try {
    while (acc >= STEP) {
      Input.update();
      Scenes.cur.update();
      acc -= STEP;
    }
    Scenes.cur.draw(ctx);
    if (Music.pending && AudioSys.ready) { Music.play(Music.pending); Music.pending = null; }
  } catch (e) {
    if (!crashed) { crashed = e; console.error(e); }
    ctx.fillStyle = '#140404'; ctx.fillRect(0, VH - 30, VW, 30);
    Font.draw(ctx, 'Error: ' + String(e.message).slice(0, 70), 6, VH - 24, '#ff8a6a');
  }
  requestAnimationFrame(frame);
}

if (Debug.params.has('sheet')) {
  Debug.sheet(ctx, Debug.params.get('sheet'), +(Debug.params.get('page') || 0), +(Debug.params.get('zoom') || 1));
} else if (Debug.params.has('ending')) {
  G.resetStats(); Scenes.go(new EndingScene()); requestAnimationFrame(frame);
} else if (Debug.params.has('portraits')) {
  ctx.fillStyle = '#2a1c16'; ctx.fillRect(0, 0, VW, VH);
  Object.keys(PORTRAITS).forEach((id, i) => ctx.drawImage(Portraits.get(id), 8 + (i % 6) * 78, 8 + Math.floor(i / 6) * 90, 64, 64));
} else {
  const lv = Debug.params.get('level');
  if (lv !== null) { G.resetStats(); G.seen = new Set(); Scenes.go(new GameScene(+lv, Debug.params.has('x') ? { x: +Debug.params.get('x') * TS, y: +Debug.params.get('y') * TS, events: (Debug.params.get('ev') || '').split(',').filter(Boolean) } : null)); }
  else Scenes.go(new TitleScene());
  if (Debug.params.has('god') && G.player) G.player.dmgTaken = 0;
  requestAnimationFrame(frame);
}
// hooks for the automated test harness
window.RS = { G, Input, Scenes, startGame, STORY, FX, spawnEnemy, LEVELS, SFX, moveBody, AudioSys, Music, SONGS, SOUNDS };

})();

</script>
