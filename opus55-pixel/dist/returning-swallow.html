const S_SOIL = ['#1e1611', '#2d2119', '#3d2d21', '#4d3a2a', '#5f4834'];
const S_GRASS = ['#3e5e2c', '#557a34', '#6f9640', '#8bb04e', '#aacb62'];
const S_BAMBOO = ['#2e4420', '#4a6a2e', '#6b8f3c', '#8fb04a', '#b4cf6a', '#d6e89a'];
const S_COBBLE = ['#2e2922', '#4a443a', '#645d50', '#7a7264', '#8f8676', '#a39a88', '#b8ae98'];
const S_BRICK = ['#2e1c16', '#4a2a1e', '#633526', '#7a4230', '#8e5038', '#a36244'];
const S_BASALT = ['#0c0a0b', '#161214', '#1f1a1c', '#2a2426', '#352d2f', '#443a3a', '#5e4644'];
const S_LAVA = ['#6a1008', '#b0200e', '#e8481a', '#ff8a3a', '#ffd08a'];
const S_WOOD = ['#1e120a', '#3a2414', '#5a3a20', '#7a5230', '#9a6c40', '#b88a58'];
const S_LACQ = ['#2a0806', '#5a1410', '#8a2016', '#b0301e', '#d25236', '#e8805a'];
const S_GOLD = ['#3a2408', '#7a5214', '#b8862a', '#e8bd52', '#fbe89c'];
const S_TEAL = ['#0e1c1c', '#1a3130', '#27463f', '#34594f', '#4a7466', '#6a9483'];
const S_PLASTER = ['#4a4238', '#7a7064', '#a89e8c', '#c8bfae', '#ddd4c2', '#ede6d6'];
const S_IRON = ['#0e0f11', '#1c1e21', '#2a2d31', '#3a3e43', '#50555b', '#6e747a'];

const TERRAIN = {
  peak: {
    steps: 4,
    ground(x, y, d, sl, sr, alt) {
      const edge = Math.min(sl, sr);
      if (alt) {
        // temple wall: cinnabar plaster under a grey tiled coping
        if (d < 4) return edge === 0 ? S_TEAL[0] : d === 0 ? S_TEAL[4] : d === 3 ? S_TEAL[1] : S_TEAL[3 - (x % 4 === 0)];
        if (d < 6) return S_STONE[d === 4 ? 6 : 3];
        const n = hash2(x >> 1, y >> 1, 4);
        const base = n > 0.85 ? '#9c4630' : n < 0.1 ? '#6e2a1c' : '#86382a';
        if (edge === 0) return '#3a120c';
        if (d > 70) return '#4a1a12';
        return edge === 1 ? '#6e2a1c' : base;
      }
      if (edge === 0 && d > 0) return S_STONE[1];
      if (d === 0) return edge <= 1 ? S_STONE[5] : S_STONE[7];
      if (d <= 5) {
        const seam = ((x + 5) % 24) === 0;
        if (d === 5) return S_STONE[2];
        if (seam) return S_STONE[2];
        if ((x + 5) % 24 === 1) return S_STONE[6];
        const sv = hash2(Math.floor((x + 5) / 24), 1, 9);
        let k = d === 1 ? 6 : 5 - (sv > 0.7 ? 1 : 0);
        const n = hash2(x, y, 2);
        if (n > 0.93) k++; else if (n < 0.07) k--;
        if (edge === 1) k--;
        return S_STONE[clamp(k, 1, 7)];
      }
      if (d <= 44) {
        const dd = d - 6, r = Math.floor(dd / 9), ly = dd % 9;
        const bw = 15 + Math.floor(hash2(r, 7, 3) * 12), off = Math.floor(hash2(r, 11, 3) * bw);
        const bx = (x + off) % bw, bi = Math.floor((x + off) / bw);
        if (ly === 8 || bx === 0) return S_STONE[1];
        let k = 4 + (hash2(bi, r, 5) > 0.6 ? 1 : 0) - (hash2(bi, r, 6) > 0.8 ? 1 : 0) - Math.floor(dd / 16);
        if (ly === 0 || bx === 1) k++;
        if (ly === 7 || bx === bw - 1) k--;
        if (edge === 1) k--;
        const n = hash2(x, y, 8);
        if (n > 0.95) k++; else if (n < 0.06) k--;
        if (ly < 3 && fbm(x * 0.08, y * 0.15, 3, 21) > 0.62) return S_MOSS[clamp(ly === 0 ? 3 : 2 - (n > 0.5 ? 1 : 0), 0, 3)];
        if (hash2(bi, r, 12) > 0.9 && Math.abs(bx - (bw >> 1) - Math.round(Math.sin(ly * 1.3) * 2)) < 1) return S_STONE[1];
        return S_STONE[clamp(k, 1, 7)];
      }
      const t = Math.min(1, (d - 44) / 40);
      return hash2(x, y, 3) > 0.9 - t * 0.2 ? S_SOIL[0] : bayer(x, y) < t ? S_SOIL[1] : S_SOIL[2];
    },
    decor(P, x, y, R) {
      const n = hash2(x, y, 31);
      if (n > 0.9) { const h = 1 + (n * 40 | 0) % 3; for (let i = 1; i <= h; i++) P.px(x, y - i, S_MOSS[1 + (i === h ? 1 : 0)]); }
      else if (n < 0.012) { P.px(x, y - 1, S_MOSS[1]); P.px(x, y - 2, '#f3e6e8'); P.px(x - 1, y - 2, '#e8b0b8'); }
    },
    platform(P, x, y, alt, L, Rt) {
      if (alt) { // carved stone walkway on corbels
        for (let i = 0; i < TS; i++) for (let j = 0; j < 7; j++) {
          let k = j === 0 ? 7 : j === 1 ? 6 : j === 6 ? 1 : j === 5 ? 2 : j === 4 ? 3 : 5 - (hash2(x + i, j, 3) > 0.85 ? 1 : 0);
          if ((x + i) % 8 === 0 && j > 1 && j < 5) k = 3;
          if ((L && i === 0) || (Rt && i === TS - 1)) k = 1;
          P.px(x + i, y + j, S_STONE[k]);
        }
        if (((x / TS) | 0) % 2 === 0) for (let j = 7; j < 13; j++) { const w = Math.max(1, 5 - (j - 7)); for (let i = 0; i < w; i++) P.px(x + 6 + i, y + j, S_STONE[i === 0 ? 5 : i === w - 1 ? 1 : 3]); }
        return;
      }
      // cinnabar lacquered beam with gold caps and brackets
      for (let i = 0; i < TS; i++) for (let j = 0; j < 6; j++) {
        let c = S_LACQ[j === 0 ? 5 : j === 1 ? 4 : j === 5 ? 0 : j === 4 ? 1 : 3 - ((x + i + j) % 7 === 0 ? 1 : 0)];
        if ((L && i < 3) || (Rt && i > TS - 4)) c = S_GOLD[j === 0 ? 4 : j === 5 ? 0 : j === 4 ? 1 : 3 - (i % 3 === 1 ? 1 : 0)];
        if ((L && i === 0) || (Rt && i === TS - 1)) c = S_GOLD[0];
        P.px(x + i, y + j, c);
      }
      if (((x / TS) | 0) % 3 === 1) for (let j = 6; j < 10; j++) { P.px(x + 7, y + j, S_WOOD[1]); P.px(x + 8, y + j, S_WOOD[3]); P.px(x + 9, y + j, S_WOOD[1]); }
    },
    spike(P, x, y) { spikeRow(P, x, y, S_IRON, 4); },
  },

  bamboo: {
    ground(x, y, d, sl, sr, alt) {
      const edge = Math.min(sl, sr);
      if (alt) {
        // mossy boulder
        const n = fbm(x * 0.09, y * 0.09, 3, 5);
        if (edge === 0) return S_STONE[0];
        if (d < 3) return S_MOSS[d === 0 ? 3 : 2];
        if (d < 6 && n > 0.45) return S_MOSS[1];
        let k = 3 + (n > 0.55 ? 1 : 0) - (n < 0.4 ? 1 : 0) - (edge === 1 ? 1 : 0);
        if (hash2(x, y, 4) > 0.94) k++;
        return S_STONE[clamp(k, 1, 6)];
      }
      if (edge === 0 && d > 3) return S_SOIL[0];
      if (d === 0) return S_GRASS[4];
      if (d <= 2) return S_GRASS[d === 1 ? 3 : 2 - (hash2(x, y, 3) > 0.7 ? 1 : 0)];
      if (d <= 5) return bayer(x, y) * 3 > d - 2 ? S_GRASS[0] : S_SOIL[3];
      const root = Math.abs(Math.sin(x * 0.21 + fbm(x * 0.04, y * 0.06, 2, 8) * 7 + y * 0.05)) < 0.06 && d < 26;
      if (root) return S_SOIL[4];
      if (hash2(x >> 1, y >> 1, 6) > 0.965) return S_STONE[hash2(x, y, 2) > 0.5 ? 4 : 3];
      const t = Math.min(1, d / 60), n = fbm(x * 0.06, y * 0.08, 3, 9);
      let k = 3 - (n < 0.42 ? 1 : 0) + (n > 0.62 ? 1 : 0) - Math.floor(t * 2 + bayer(x, y) * 0.9) - (edge === 1 ? 1 : 0);
      return S_SOIL[clamp(k, 0, 4)];
    },
    decor(P, x, y) {
      const n = hash2(x, y, 41);
      if (n > 0.55) {
        const h = 2 + Math.floor(hash2(x, y, 42) * 5);
        const lean = hash2(x, y, 43) > 0.5 ? 1 : -1;
        for (let i = 1; i <= h; i++) P.px(x + (i > h - 2 ? lean : 0), y - i, S_GRASS[i === h ? 4 : 2 + (i > h / 2 ? 1 : 0)]);
      } else if (n < 0.006) {
        P.px(x, y - 1, '#e8e0c8'); P.px(x, y - 2, '#d23a26'); P.px(x - 1, y - 2, '#d23a26'); P.px(x + 1, y - 2, '#a02418'); P.px(x, y - 3, '#d23a26');
      } else if (n < 0.02) { P.px(x, y - 1, S_GRASS[2]); P.px(x, y - 2, '#f4f0dc'); }
    },
    platform(P, x, y, alt) {
      const pole = (yy, thick) => {
        for (let i = 0; i < TS; i++) {
          const node = (x + i) % 11 === 0;
          for (let j = 0; j < thick; j++) {
            let k = j === 0 ? 5 : j === thick - 1 ? 1 : 3 + (j === 1 ? 1 : 0);
            if (node) k = Math.max(0, k - 2);
            P.px(x + i, yy + j, S_BAMBOO[k]);
          }
        }
      };
      if (alt) { pole(y, 5); return; }
      pole(y, 3); pole(y + 3, 3);
      for (const bx of [3, 11]) for (let j = 0; j < 6; j++) { P.px(x + bx, y + j, j % 2 ? '#9a8458' : '#c4ad78'); P.px(x + bx + 1, y + j, j % 2 ? '#c4ad78' : '#8a7448'); }
    },
    spike(P, x, y) {
      for (let s = 0; s < 4; s++) {
        const bx = x + s * 4 + 1, h = 8 + (s % 2) * 3;
        for (let j = 0; j < h; j++) {
          const w = j < 3 ? 1 : 2;
          for (let i = 0; i < w; i++) P.px(bx + i, y + TS - h + j, j < 2 ? '#e8e0b0' : S_BAMBOO[i ? 2 : 4]);
        }
      }
    },
  },

  town: {
    ground(x, y, d, sl, sr, alt) {
      const edge = Math.min(sl, sr);
      if (alt) {
        // timber framed plaster house wall
        if (edge === 0) return S_WOOD[0];
        const post = (x % 40) < 3 || edge < 3;
        if (d < 3) return S_WOOD[d === 0 ? 4 : 2];
        if (post) return S_WOOD[(x % 40) === 1 || edge === 1 ? 3 : 2];
        if (d % 36 < 3) return S_WOOD[d % 36 === 0 ? 3 : 1];
        const n = hash2(x, y, 3);
        const k = 4 - (n > 0.92 ? 1 : 0) + (n < 0.04 ? 1 : 0) - (d % 36 < 5 ? 1 : 0);
        // lattice window in the middle of each bay
        const wx = x % 40, wy = d % 36;
        if (wx > 12 && wx < 30 && wy > 9 && wy < 26) {
          if (wx === 13 || wx === 29 || wy === 10 || wy === 25) return S_WOOD[1];
          return ((wx - 13) % 4 === 0 || (wy - 10) % 4 === 0) ? S_WOOD[2] : '#e9c77a';
        }
        return S_PLASTER[k];
      }
      if (edge === 0 && d > 0) return S_COBBLE[0];
      if (d === 0) return S_COBBLE[6];
      if (d <= 7) {
        // cobblestones: jittered cells
        const gx = Math.floor(x / 6), gy = Math.floor(d / 4);
        let best = 99, second = 99, bid = 0;
        for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
          const cx = (gx + ox) * 6 + hash2(gx + ox, gy + oy, 1) * 6, cy = (gy + oy) * 4 + hash2(gx + ox, gy + oy, 2) * 4;
          const dd = Math.hypot((x - cx) * 0.8, d - cy);
          if (dd < best) { second = best; best = dd; bid = hash2(gx + ox, gy + oy, 3); } else if (dd < second) second = dd;
        }
        if (second - best < 0.9) return S_COBBLE[1];
        let k = 3 + Math.floor(bid * 3) - (best > 2.4 ? 1 : 0);
        if (d === 1) k++;
        return S_COBBLE[clamp(k, 2, 6)];
      }
      if (d <= 9) return S_COBBLE[d === 8 ? 5 : 2];
      const r = Math.floor((d - 10) / 5), ly = (d - 10) % 5, off = r % 2 ? 5 : 0;
      const bx = (x + off) % 10, bi = Math.floor((x + off) / 10);
      if (ly === 4 || bx === 0) return S_BRICK[0];
      let k = 3 + (hash2(bi, r, 4) > 0.6 ? 1 : 0) - (hash2(bi, r, 5) > 0.8 ? 1 : 0) - Math.floor((d - 10) / 30);
      if (ly === 0) k++;
      if (edge === 1) k--;
      return S_BRICK[clamp(k, 1, 5)];
    },
    decor(P, x, y) { const n = hash2(x, y, 51); if (n > 0.965) { P.px(x, y - 1, S_GRASS[1]); P.px(x + 1, y - 1, S_GRASS[2]); } },
    platform(P, x, y, alt) {
      if (alt) {
        // roof ridge: glazed teal tiles with a round ridge cap
        for (let i = 0; i < TS; i++) {
          for (let j = 0; j < 4; j++) P.px(x + i, y + j, S_TEAL[j === 0 ? 5 : j === 3 ? 0 : 3 + (j === 1 ? 1 : 0)]);
          for (let j = 4; j < 9; j++) { const ridge = (x + i) % 4; P.px(x + i, y + j, S_TEAL[ridge === 0 ? 0 : ridge === 1 ? 4 : 2 - (j > 6 ? 1 : 0)]); }
        }
        return;
      }
      for (let i = 0; i < TS; i++) for (let j = 0; j < 5; j++) {
        const gap = (x + i) % 8 === 0;
        P.px(x + i, y + j, gap ? S_WOOD[0] : S_WOOD[j === 0 ? 5 : j === 4 ? 1 : j === 3 ? 2 : 3 + ((x + i) % 8 === 3 && j === 2 ? -2 : 0)]);
      }
      if (((x / TS) | 0) % 2 === 0) for (let j = 5; j < 12; j++) { P.px(x + 6, y + j, S_WOOD[1]); P.px(x + 7, y + j, S_WOOD[3]); }
    },
    spike(P, x, y) { spikeRow(P, x, y, S_IRON, 4); },
  },

  fort: {
    ground(x, y, d, sl, sr, alt) {
      const edge = Math.min(sl, sr);
      if (alt) {
        if (edge === 0) return S_IRON[0];
        const px = x % 24, py = d % 20;
        if (px === 0 || py === 0) return S_IRON[0];
        if ((px === 3 || px === 21) && (py === 3 || py === 17)) return S_IRON[5];
        const rust = fbm(x * 0.07, y * 0.2, 3, 3) > 0.6 && py > 10;
        if (rust) return hash2(x, y, 3) > 0.5 ? '#5a2a1a' : '#4a2216';
        return S_IRON[py === 1 || px === 1 ? 4 : py === 19 || px === 23 ? 1 : 3 - (hash2(x, y, 7) > 0.9 ? 1 : 0)];
      }
      if (edge === 0 && d > 0) return S_BASALT[0];
      if (d === 0) return S_BASALT[6];
      if (d === 1) return S_BASALT[5];
      const n = fbm(x * 0.05, y * 0.05, 3, 13);
      const vein = Math.abs(n - 0.5) < 0.007 + 0.004 * Math.sin(x * 0.3);
      if (vein && d > 6) return S_LAVA[d < 24 ? 3 : 2 - (hash2(x, y, 2) > 0.5 ? 1 : 0)];
      if (Math.abs(n - 0.5) < 0.016 && d > 6) return bayer(x, y) > 0.5 ? S_LAVA[0] : S_BASALT[2];
      const cr = hash2(Math.floor(x / 9 + n * 3), Math.floor(d / 7 + n * 2), 21);
      let k = 3 + (cr > 0.7 ? 1 : 0) - (cr < 0.25 ? 1 : 0) - Math.floor(d / 40);
      if (Math.floor(x / 9 + n * 3) !== Math.floor((x + 1) / 9 + fbm((x + 1) * 0.05, y * 0.05, 3, 13) * 3)) k = 1;
      if (edge === 1) k--;
      return S_BASALT[clamp(k, 0, 5)];
    },
    decor(P, x, y) { const n = hash2(x, y, 61); if (n > 0.97) { P.px(x, y - 1, S_BASALT[4]); P.px(x + 1, y - 1, S_BASALT[3]); } },
    platform(P, x, y, alt) {
      if (alt) {
        for (let i = 0; i < TS; i++) for (let j = 0; j < 5; j++) P.px(x + i, y + j, (x + i) % 8 === 0 ? S_WOOD[0] : S_WOOD[j === 0 ? 4 : j === 4 ? 0 : 2 + (j === 1 ? 1 : 0)]);
        return;
      }
      for (let i = 0; i < TS; i++) for (let j = 0; j < 5; j++) {
        const hole = j > 0 && j < 4 && (x + i) % 4 !== 0;
        P.px(x + i, y + j, hole ? (j === 1 ? S_IRON[0] : null) : S_IRON[j === 0 ? 5 : j === 4 ? 1 : 3]);
      }
    },
    spike(P, x, y) { spikeRow(P, x, y, S_IRON, 4, true); },
  },
};

function spikeRow(P, x, y, R, n, hot) {
  const w = TS / n;
  for (let s = 0; s < n; s++) {
    const bx = x + s * w, h = 9 + (s % 2) * 2;
    for (let j = 0; j < h; j++) {
      const half = Math.max(0, Math.floor(((j + 1) / h) * (w / 2)));
      for (let i = -half; i <= half; i++) {
        let c = R[i < 0 ? 4 : i === 0 ? 3 : 2];
        if (j < 3 && hot) c = j === 0 ? '#ffd08a' : '#e8481a';
        else if (j === 0) c = R[5];
        P.px(bx + w / 2 + i, y + TS - h + j, c);
      }
    }
    P.px(bx + w / 2, y + TS - 1, R[0]);
  }
}

const Terrain = {
  build(map, theme) {
    const TH = TERRAIN[theme];
    const W = map.pw, H = map.ph;
    const mask = new Uint8Array(W * H);
    for (let ty = 0; ty < map.h; ty++) for (let tx = 0; tx < map.w; tx++) {
      const t = map.get(tx, ty), v = map.var(tx, ty);
      if (t === T_SOLID) {
        for (let ly = 0; ly < TS; ly++) mask.fill(1 + v, (ty * TS + ly) * W + tx * TS, (ty * TS + ly) * W + tx * TS + TS);
      } else if (t === T_SLR || t === T_SLL) {
        for (let ly = 0; ly < TS; ly++) for (let lx = 0; lx < TS; lx++) {
          let top;
          if (TH.steps) { const st = TH.steps, sx = t === T_SLR ? lx : TS - 1 - lx; top = TS - Math.floor(sx / st) * st - st / 2; }
          else top = t === T_SLR ? TS - lx - 0.5 : lx + 0.5;
          if (ly + 0.5 >= top) mask[(ty * TS + ly) * W + tx * TS + lx] = 1;
        }
      }
    }
    const dep = new Uint16Array(W * H);
    for (let x = 0; x < W; x++) {
      let d = 0;
      for (let y = 0; y < H; y++) { const i = y * W + x; if (mask[i]) { d = y > 0 && mask[i - W] ? d + 1 : 0; dep[i] = d; } }
    }
    const sl = new Uint8Array(W * H), sr = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
      let d = 0;
      for (let x = 0; x < W; x++) { const i = y * W + x; if (mask[i]) { d = x > 0 && mask[i - 1] ? Math.min(d + 1, 40) : 0; sl[i] = d; } }
      d = 0;
      for (let x = W - 1; x >= 0; x--) { const i = y * W + x; if (mask[i]) { d = x < W - 1 && mask[i + 1] ? Math.min(d + 1, 40) : 0; sr[i] = d; } }
    }
    const P = new Paint(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (!mask[i]) continue;
      const c = TH.ground(x, y, dep[i], sl[i], sr[i], mask[i] === 2);
      if (c) P.u[i] = col(c);
    }
    // surface decoration
    for (let y = 1; y < H; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      if (mask[i] === 1 && dep[i] === 0 && !mask[i - W] && TH.decor) TH.decor(P, x, y);
    }
    // platforms and spikes
    for (let ty = 0; ty < map.h; ty++) for (let tx = 0; tx < map.w; tx++) {
      const t = map.get(tx, ty);
      if (t === T_ONEWAY) TH.platform(P, tx * TS, ty * TS, map.var(tx, ty), map.get(tx - 1, ty) !== T_ONEWAY, map.get(tx + 1, ty) !== T_ONEWAY);
      else if (t === T_SPIKE) TH.spike(P, tx * TS, ty * TS);
    }
    return P.done();
  },
};

// ==== gfx/backgrounds.js ====
// ---------------------------------------------------------------------------
// Parallax backgrounds in an ink-wash (shan shui) spirit: dithered skies,
// karst peaks whose tops are dark ink and whose feet dissolve into mist,
// bamboo seas, a dusk river town and a blood-moon fortress. Each layer is a
// tileable strip generated once per chapter.
// ---------------------------------------------------------------------------
const LW = 1024;

function inkRidge(P, rng, o) {
  // o: { base, peaks:[n, hMin, hMax, wMin, wMax], ink, mist, fade, streaks, pines, sharp }
  const H = new Float32Array(LW);
  const [n, h0, h1, w0, w1] = o.peaks;
  for (let k = 0; k < n; k++) {
    const px = rng.r(LW), ph = rng.r(h0, h1), pw = rng.r(w0, w1), sh = o.sharp || 4;
    for (let x = 0; x < LW; x++) {
      let dx = x - px;
      if (dx > LW / 2) dx -= LW; if (dx < -LW / 2) dx += LW;
      const u = Math.abs(dx) / pw;
      if (u >= 1) continue;
      const v = ph * Math.pow(1 - Math.pow(u, sh), 0.45) * (1 + 0.04 * Math.sin(x * 0.2 + k));
      if (v > H[x]) H[x] = v;
    }
  }
  for (let x = 0; x < LW; x++) H[x] += (pfbm(x / 16, LW / 16, 3, o.seed || 1) - 0.5) * (o.rough || 6);
  const ink = o.ink, mist = o.mist;
  for (let x = 0; x < LW; x++) {
    const top = Math.round(o.base - H[x]);
    const slope = H[(x + 1) % LW] - H[(x + LW - 1) % LW];
    const streak = pnoise(x / 3, LW / 3, o.seed * 7 || 7);
    for (let y = Math.max(0, top); y < P.h; y++) {
      const t = (y - top) / o.fade;
      let c;
      if (y === top) c = mix(ink[0], ink[1], 0.5);
      else {
        let k = t + (streak - 0.5) * 0.35 + (slope > 0.4 ? 0.12 : slope < -0.4 ? -0.1 : 0);
        k += (bayer(x, y) - 0.5) * 0.22;
        const stops = [ink[0], ink[1], ink[2] || ink[1], mist];
        c = ramp(stops, clamp(k, 0, 1));
      }
      P.u[y * P.w + x] = col(c);
    }
  }
  if (o.pines) for (let i = 0; i < o.pines; i++) {
    const x = rng.i(0, LW - 1), top = Math.round(o.base - H[x]);
    tinyPine(P, x, top + 1, rng.r(0.6, 1.2) * (o.pineScale || 1), o.pineColor || ink[0]);
  }
  return H;
}

function tinyPine(P, x, y, s, c) {
  const h = Math.round(7 * s);
  for (let j = 0; j < h; j++) P.px(x, y - j, c);
  for (let k = 0; k < 3; k++) {
    const yy = y - h + 1 + k * Math.max(1, Math.round(2 * s)), w = Math.round((2 + k * 1.4) * s);
    for (let i = -w; i <= w; i++) P.px(x + i + (k === 0 ? 1 : 0), yy, c);
  }
}

// detailed pine with layered needle pads, trunk and highlights
function pineTree(P, x, y, s, pal, rng) {
  const h = Math.round(46 * s);
  let tx = x;
  for (let j = 0; j < h; j++) {
    tx += Math.round(Math.sin(j * 0.18 + x) * 0.6);
    const w = Math.max(1, Math.round((3 - j / h * 2) * s));
    for (let i = -w; i <= w; i++) P.px(tx + i, y - j, i === w ? pal.trunk[0] : i === -w ? pal.trunk[2] : pal.trunk[1]);
  }
  const pads = 4 + Math.round(s * 2);
  for (let k = 0; k < pads; k++) {
    const py = y - h * (0.35 + (k / pads) * 0.68);
    const side = k % 2 ? 1 : -1;
    const px = x + side * rng.r(4, 14) * s * (1 - k / pads * 0.5);
    const rx = rng.r(8, 15) * s * (1 - k / pads * 0.45), ry = rx * 0.32;
    // branch
    P.thick(x, py + 2, px, py + 1, Math.max(1, s * 1.5), pal.trunk[0]);
    P.ellipse(px, py, rx, ry, (xx, yy, d, dx, dy) => {
      const edge = hash2(xx, yy, 5) > 0.55 && d > 0.7;
      if (edge && ((xx + yy) & 1)) return null;
      return dy < -0.35 ? pal.leaf[3] : dy < 0.2 ? (hash2(xx, yy, 2) > 0.8 ? pal.leaf[3] : pal.leaf[2]) : dy < 0.6 ? pal.leaf[1] : pal.leaf[0];
    });
  }
}

function mistBand(P, y, h, color, seed, alphaMax = 1) {
  const v = col(color) & 0x00ffffff;
  for (let x = 0; x < P.w; x++) {
    const top = y + (pfbm(x / 40, P.w / 40, 3, seed) - 0.5) * h * 0.9;
    for (let yy = Math.max(0, Math.floor(top)); yy < Math.min(P.h, y + h * 1.2); yy++) {
      const t = clamp((yy - top) / (h * 0.5), 0, 1) * alphaMax;
      if (t > bayer(x, yy) * 0.98) P.u[yy * P.w + x] = (v | 0xff000000) >>> 0;
    }
  }
}

function bambooStalks(P, rng, o) {
  // o: { n, base, top, w:[a,b], pal:[dark, mid, light], leaf, leafy }
  for (let k = 0; k < o.n; k++) {
    const x0 = rng.r(LW), w = Math.round(rng.r(o.w[0], o.w[1])), lean = rng.r(-0.06, 0.06);
    const seg = rng.i(14, 22);
    for (let y = o.top; y < o.base; y++) {
      const x = Math.round(x0 + (o.base - y) * lean);
      const node = (y + k * 7) % seg === 0;
      for (let i = 0; i < w; i++) {
        let c = i === 0 ? o.pal[2] : i === w - 1 ? o.pal[0] : o.pal[1];
        if (node) c = o.pal[0];
        const xx = ((x + i) % LW + LW) % LW;
        P.px(xx, y, c);
      }
      if (node && o.twigs && rng.ch(0.3)) {
        const dir = rng.ch(0.5) ? 1 : -1, L = rng.i(4, 10);
        for (let j = 0; j < L; j++) P.px(((x + (dir > 0 ? w : -1) + dir * j) % LW + LW) % LW, y - Math.floor(j / 2), o.pal[0]);
      }
    }
    if (o.leafy) {
      const clusters = rng.i(2, 5);
      for (let c = 0; c < clusters; c++) {
        const cy = rng.r(o.top, o.top + (o.base - o.top) * 0.55), cx = x0 + (o.base - cy) * lean + rng.r(-10, 10);
        const nl = rng.i(5, 10);
        for (let l = 0; l < nl; l++) {
          const a = rng.r(-0.9, 0.9) + (rng.ch(0.5) ? 0 : Math.PI), L = rng.r(5, 10);
          for (let j = 0; j < L; j++) {
            const xx = Math.round(cx + Math.cos(a) * j), yy = Math.round(cy + Math.sin(a) * j * 0.5 + j * 0.3);
            P.px(((xx % LW) + LW) % LW, yy, j > L * 0.7 ? o.leaf[0] : o.leaf[j % 3 === 0 ? 2 : 1]);
          }
        }
      }
    }
  }
}

function roofShape(P, x, y, w, h, c0, c1, c2, eave = 4) {
  // curved roof with upturned eaves: x,y = left of ridge line
  for (let j = 0; j < h; j++) {
    const t = j / h;
    const spread = eave * Math.pow(t, 2.2);
    const xa = Math.round(x - spread - t * 3), xb = Math.round(x + w + spread + t * 3);
    const yy = y + j;
    for (let xx = xa; xx <= xb; xx++) P.px(((xx % LW) + LW) % LW, yy - (j === h - 1 && (xx === xa || xx === xb) ? 1 : 0), j === 0 ? c2 : (xx - xa) % 3 === 0 ? c0 : c1);
  }
  // upturned tips
  P.px(((x - eave - 4) % LW + LW) % LW, y + h - 2, c1);
  P.px(((x + w + eave + 4) % LW + LW) % LW, y + h - 2, c1);
}

function templeSilhouettes(P, rng, o) {
  for (let k = 0; k < o.n; k++) {
    const x = Math.round(rng.r(LW)), w = rng.i(30, 70), wallH = rng.i(10, 18), base = o.base - rng.i(0, 16);
    const roofH = Math.round(w * 0.22);
    for (let j = 0; j < wallH; j++) for (let i = 0; i < w; i++) {
      const col_ = i % 9 < 2 ? o.pillar : o.wall;
      P.px(((x + i) % LW + LW) % LW, base - j, col_);
    }
    roofShape(P, x, base - wallH - roofH, w, roofH, o.roof[0], o.roof[1], o.roof[2], 5);
    if (rng.ch(0.4)) roofShape(P, x + w * 0.2, base - wallH - roofH * 2 - 3, w * 0.6, roofH * 0.8, o.roof[0], o.roof[1], o.roof[2], 3);
  }
}

function pagoda(P, x, base, tiers, s, pal) {
  let y = base, w = 22 * s;
  for (let t = 0; t < tiers; t++) {
    const bh = Math.round(7 * s), rh = Math.round(4 * s);
    for (let j = 0; j < bh; j++) for (let i = 0; i < w; i++) P.px(Math.round(x - w / 2 + i), y - j, i % 5 === 0 ? pal[0] : pal[1]);
    y -= bh;
    roofShape(P, Math.round(x - w / 2), y - rh, w, rh, pal[0], pal[0], pal[1], 3);
    y -= rh;
    w *= 0.84;
  }
  for (let j = 0; j < 8 * s; j++) P.px(Math.round(x), y - j, pal[0]);
}

function townSkyline(P, rng, o) {
  let x = 0;
  while (x < LW) {
    const w = rng.i(o.w[0], o.w[1]), h = rng.i(o.h[0], o.h[1]);
    const base = o.base;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      let c = o.wall;
      if (o.win && j > 3 && j < h - 3 && (i % 8 === 3 || i % 8 === 4) && (j % 9 === 5 || j % 9 === 6) && hash2(x + i >> 3, j >> 3, 9) > 0.35) c = o.win;
      P.px((x + i) % LW, base - j, c);
    }
    const rh = Math.round(w * 0.18) + 2;
    roofShape(P, x + 2, base - h - rh, w - 4, rh, o.roof[0], o.roof[1], o.roof[2], 4);
    x += w + rng.i(o.gap[0], o.gap[1]);
  }
}

function cliffs(P, rng, o) {
  const H = new Float32Array(LW);
  for (let x = 0; x < LW; x++) {
    const n = pfbm(x / 30, LW / 30, 4, o.seed);
    const spike = Math.pow(Math.abs(Math.sin(x * 0.045 + n * 5)), 6) * o.spike;
    H[x] = o.h * n + spike;
  }
  for (let x = 0; x < LW; x++) {
    const top = Math.round(o.base - H[x]);
    for (let y = Math.max(0, top); y < P.h; y++) {
      let c = o.pal[1];
      if (y - top < 2) c = o.pal[2];
      else if (hash2(x, y >> 2, o.seed) > 0.92) c = o.pal[0];
      else if ((y - top) > o.fade && bayer(x, y) < clamp((y - top - o.fade) / 40, 0, 1)) c = o.pal[3] || o.pal[1];
      P.u[y * P.w + x] = col(c);
    }
  }
  return H;
}

function fortressSil(P, x, base, pal, win) {
  const towers = [[0, 60, 22], [30, 44, 50], [86, 70, 24], [116, 40, 40], [160, 56, 20]];
  for (const [ox, h, w] of towers) {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      let c = pal[0];
      if (j > 6 && (i % 7 === 3) && (j % 12 === 4 || j % 12 === 5)) c = win;
      P.px((x + ox + i) % LW, base - j, c);
    }
    for (let i = 0; i < w; i += 4) { P.px((x + ox + i) % LW, base - h - 1, pal[0]); P.px((x + ox + i + 1) % LW, base - h - 1, pal[0]); P.px((x + ox + i) % LW, base - h - 2, pal[0]); P.px((x + ox + i + 1) % LW, base - h - 2, pal[0]); }
    roofShape(P, x + ox + 2, base - h - 8, w - 4, 6, pal[0], pal[0], pal[1], 3);
    // banner pole
    for (let j = 0; j < 14; j++) P.px((x + ox + (w >> 1)) % LW, base - h - 8 - j, pal[0]);
    for (let j = 0; j < 6; j++) for (let i = 0; i < 5; i++) P.px((x + ox + (w >> 1) + 1 + i) % LW, base - h - 20 + j + (i > 2 ? 1 : 0), '#6a120c');
  }
}

const Backdrop = {
  make(theme, map) {
    const T = BG_THEMES[theme];
    const R = new RNG(theme.length * 977 + 13);
    const sky = new Paint(VW, VH);
    sky.gradV(0, VH, T.sky);
    if (T.sun) {
      const s = T.sun;
      sky.ellipse(s.x, s.y, s.r * 2.4, s.r * 2.4, (x, y, d) => (d > 0.3 && bayer(x, y) < (1 - d) * 0.9 ? s.halo : null));
      sky.ellipse(s.x, s.y, s.r, s.r, (x, y, d) => (d > 0.86 ? s.halo : s.core));
    }
    if (T.moon) {
      const m = T.moon;
      sky.ellipse(m.x, m.y, m.r * 2.2, m.r * 2.2, (x, y, d) => (bayer(x, y) < (1 - d) * 0.55 ? '#5a1a10' : null));
      sky.ellipse(m.x, m.y, m.r, m.r, (x, y, d, dx, dy) => {
        const n = fbm(x * 0.09, y * 0.09, 3, 5);
        const crater = n > 0.58 ? 1 : 0;
        const rim = dx * 0.6 + dy * 0.8 > 0.55 ? 1 : 0;
        return ['#e8603a', '#c8442a', '#a8321e', '#8a2616'][clamp(crater + rim + (d > 0.85 ? 1 : 0), 0, 3)];
      });
    }
    const layers = T.layers.map((L, i) => {
      const P = new Paint(LW, L.h);
      L.gen(P, new RNG(i * 131 + theme.length * 17));
      return { c: P.done(), f: L.f, y: L.y };
    });
    return { theme, T, sky: sky.done(), layers, clouds: makeClouds(theme), t: 0 };
  },
  draw(ctx, bd, cam, map, t) {
    ctx.drawImage(bd.sky, 0, 0);
    const refY = Math.max(0, map.ph - VH);
    const T = bd.T;
    // drifting clouds sit between the sky and the first ridge
    for (const c of bd.clouds) {
      const x = ((c.x - cam.x * c.f + t * c.v) % (LW + 200) + LW + 200) % (LW + 200) - 100;
      if (x > -c.img.width && x < VW) ctx.drawImage(c.img, Math.round(x), Math.round(c.y + (refY - cam.y) * 0.02));
    }
    for (const L of bd.layers) {
      const ox = -(((cam.x * L.f) % LW) + LW) % LW;
      const y = Math.round(L.y + (refY - cam.y) * L.f * 0.6);
      for (let x = Math.round(ox); x < VW; x += LW) ctx.drawImage(L.c, x, y);
    }
    if (T.shafts) {
      ctx.save();
      ctx.globalAlpha = 0.1 + 0.03 * Math.sin(t * 0.01);
      ctx.fillStyle = T.shafts;
      for (let i = 0; i < 5; i++) {
        const bx = ((i * 137 - cam.x * 0.25) % 700 + 700) % 700 - 100;
        ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + 26, 0); ctx.lineTo(bx - 90, VH); ctx.lineTo(bx - 130, VH); ctx.fill();
      }
      ctx.restore();
    }
  },
};

// stylized auspicious clouds with curled ends
function cloudSprite(w, h, pal, seed) {
  const P = new Paint(w + 8, h + 8);
  const R = new RNG(seed);
  const blobs = [];
  for (let i = 0; i < 4 + R.i(0, 3); i++) blobs.push([R.r(h * 0.6, w - h * 0.6), h * 0.55 + R.r(-h * 0.2, h * 0.1), R.r(h * 0.3, h * 0.55)]);
  const inside = (x, y) => y < h + 2 && blobs.some(([bx, by, r]) => Math.hypot(x - bx, (y - by) * 1.2) < r);
  for (let y = 0; y < P.h; y++) for (let x = 0; x < P.w; x++) {
    if (!inside(x, y)) continue;
    const below = !inside(x, y + 2);
    P.px(x, y, below ? pal[0] : inside(x - 1, y - 2) && inside(x, y - 2) ? pal[1] : pal[2]);
  }
  // curls
  for (const [bx, by, r] of blobs.slice(0, 2)) {
    for (let a = 0; a < 5.5; a += 0.12) { const rr = r * 0.55 * (1 - a / 7); P.px(bx + Math.cos(a) * rr, by + Math.sin(a) * rr * 0.8, pal[0]); }
  }
  P.outline(pal[3]);
  return P.done();
}
function makeClouds(theme) {
  const pals = {
    peak: ['#e6c9a4', '#f6e6cc', '#fdf6e8', '#c49a74'], bamboo: ['#c8d2b0', '#dde4c8', '#eef2e0', '#a8b490'],
    town: ['#c85a36', '#f09a5a', '#f8c47a', '#8a2e22'], fort: ['#1a0808', '#2a0e0c', '#3a1410', '#0a0404'], burning: ['#3a120a', '#5a1c0e', '#7a2a14', '#1a0806'],
  };
  const pal = pals[theme];
  const out = [];
  for (let i = 0; i < 6; i++) out.push({ img: cloudSprite(40 + (i * 23) % 50, 14 + (i * 7) % 8, pal, i + 3), x: i * 190, y: 20 + (i * 37) % 70, f: 0.02 + (i % 3) * 0.01, v: theme === 'fort' ? 0.12 : 0.05 });
  return out;
}

// ==== gfx/props.js ====
// ---------------------------------------------------------------------------
// Props: static art generated once per parameter set (halls, gates, trees,
// statues) plus animated pieces (banners, lanterns, fires, smoke). Props are
// anchored at their bottom center in world space.
// ---------------------------------------------------------------------------
const PROP_CACHE = new Map();
function cachedArt(key, fn) { let c = PROP_CACHE.get(key); if (!c) { c = fn(); PROP_CACHE.set(key, c); } return c; }

const ROOF_PAL = {
  teal: S_TEAL, char: ['#121212', '#1e1d1c', '#2b2a28', '#3a3836', '#4c4946', '#66625d'],
  black: ['#060404', '#0e0a0a', '#161010', '#201818', '#2c2020', '#3c2a28'],
  gold: ['#3a2408', '#6a4410', '#96661c', '#c28e2c', '#e2b650', '#f6dc8a'],
};

function paintRoof(P, cx, y, halfRidge, halfEave, h, pal, orn = true) {
  for (let j = 0; j < h; j++) {
    const t = j / (h - 1);
    const hw = halfRidge + (halfEave - halfRidge) * Math.pow(t, 1.7);
    const xa = Math.round(cx - hw), xb = Math.round(cx + hw);
    for (let x = xa; x <= xb; x++) {
      let k;
      if (j < 3) k = j === 0 ? 5 : j === 1 ? 2 : 1;
      else if (j >= h - 2) k = (x - xa) % 3 === 1 ? 5 : j === h - 1 ? 1 : 4;
      else { const ch = (x - Math.round(cx)) % 3; k = ch === 0 ? 1 : ch === 1 || ch === -2 ? 4 : 3; if ((j - 3) % 5 === 0) k--; }
      if (x === xa || x === xb) k = 0;
      P.px(x, y + j, pal[clamp(k, 0, 5)]);
    }
  }
  // upturned eave corners
  for (let k = 0; k < 4; k++) {
    P.px(Math.round(cx - halfEave) - k, y + h - 2 - k, pal[k === 3 ? 5 : 1]);
    P.px(Math.round(cx + halfEave) + k, y + h - 2 - k, pal[k === 3 ? 5 : 1]);
    P.px(Math.round(cx - halfEave) - k, y + h - 1 - k, pal[0]);
    P.px(Math.round(cx + halfEave) + k, y + h - 1 - k, pal[0]);
  }
  if (orn) for (const s of [-1, 1]) {
    // ridge-end ornaments curling upward
    const ex = Math.round(cx + s * halfRidge);
    for (let k = 0; k < 6; k++) { P.px(ex + s * (k > 3 ? k - 3 : 0), y - k, pal[k > 4 ? 5 : 1]); P.px(ex - s, y - k + 1, pal[0]); }
    P.px(ex + s * 3, y - 6, pal[1]); P.px(ex + s * 2, y - 6, pal[4]);
  }
}

function genHall(w, h, o = {}) {
  const pad = 16, W = w + pad * 2;
  const P = new Paint(W, h + 8);
  const cx = W / 2, roofH = Math.round(h * 0.33), br = 5, beam = 7, base = 9;
  const top = 8, colTop = top + roofH + br + beam, colBot = top + h - base;
  const nCols = o.cols || Math.max(3, Math.round(w / 34));
  const colX = [];
  for (let i = 0; i < nCols; i++) colX.push(Math.round(pad + 6 + (i * (w - 12)) / (nCols - 1)));
  const lit = !!o.lit;
  // walls / doors between columns
  for (let i = 0; i < nCols - 1; i++) {
    const x0 = colX[i] + 3, x1 = colX[i + 1] - 2;
    for (let y = colTop; y < colBot; y++) for (let x = x0; x < x1; x++) {
      const lx = x - x0, ly = y - colTop, bw = x1 - x0, bh = colBot - colTop;
      let c;
      if (lx === 0 || lx === bw - 1 || ly === 0) c = S_WOOD[1];
      else if (ly > bh * 0.62) c = ly === Math.round(bh * 0.62) + 1 || lx === Math.floor(bw / 2) ? S_WOOD[1] : S_WOOD[(lx + ly) % 9 === 0 ? 2 : 3];
      else if (lx === Math.floor(bw / 2)) c = S_WOOD[1];
      else {
        const grid = (lx % 4 === 0) || (ly % 4 === 0) || ((lx + ly) % 8 === 0 && o.diamond);
        c = grid ? S_WOOD[2] : lit ? (bayer(x, y) > 0.3 ? '#f6c76a' : '#e8a84a') : (ly < 3 ? '#b8a88a' : '#d8c8a2');
      }
      P.px(x, y, c);
    }
  }
  // columns
  for (const x of colX) for (let y = colTop - 2; y < colBot; y++) for (let i = -2; i <= 2; i++) {
    const k = i === -2 ? 0 : i === 2 ? 2 : i === 1 ? 5 : 3;
    P.px(x + i, y, S_LACQ[y > colBot - 4 ? 1 : k]);
  }
  // painted beam
  for (let y = colTop - beam; y < colTop; y++) for (let x = pad - 2; x < W - pad + 2; x++) {
    const ly = y - (colTop - beam);
    let c = ly === 0 || ly === beam - 1 ? S_GOLD[2] : '#2f6a5e';
    const bay = colX.findIndex((cc, k) => k < colX.length - 1 && x >= cc && x < colX[k + 1]);
    if (bay >= 0 && ly > 0 && ly < beam - 1) {
      const mid = (colX[bay] + colX[bay + 1]) / 2, dx = Math.abs(x - mid);
      if (dx < 6 - Math.abs(ly - beam / 2) * 1.2) c = dx < 3 - Math.abs(ly - beam / 2) ? '#c23a22' : S_GOLD[3];
      else if ((x - colX[bay]) < 4 || colX[bay + 1] - x < 4) c = (x + ly) % 2 ? S_GOLD[3] : '#1f4a42';
    }
    P.px(x, y, c);
  }
  // bracket sets
  for (let x = pad; x < W - pad; x += 7) for (let j = 0; j < br; j++) for (let i = 0; i < 5; i++) {
    const on = j === br - 1 ? i > 0 && i < 4 : j === 0 ? true : i === 0 || i === 4 || j === 2;
    if (on) P.px(x + i, colTop - beam - br + j, j === 0 ? S_GOLD[3] : i === 0 || i === 4 ? S_TEAL[1] : S_TEAL[4]);
  }
  paintRoof(P, cx, top, w * 0.36, W / 2 - 1, roofH, ROOF_PAL[o.roof || 'teal']);
  // plaque
  if (o.plaque !== false) {
    const pw = 22, ph = 9, px = Math.round(cx - pw / 2), py = colTop - beam - 2;
    for (let y = 0; y < ph; y++) for (let x = 0; x < pw; x++) P.px(px + x, py + y, x === 0 || y === 0 || x === pw - 1 || y === ph - 1 ? S_GOLD[2] : '#1a1412');
    for (const gx of [4, 12]) for (let k = 0; k < 5; k++) { P.px(px + gx + (k % 3), py + 2 + (k >> 1), S_GOLD[4]); P.px(px + gx + 4 - (k % 2), py + 2 + k, S_GOLD[3]); }
  }
  // stone base with central stairs
  for (let y = colBot; y < top + h; y++) for (let x = pad - 4; x < W - pad + 4; x++) {
    const ly = y - colBot;
    const stairs = Math.abs(x - cx) < 14;
    let k = ly === 0 ? 6 : ly === base - 1 ? 1 : 4 - ((x + (ly >> 2) * 5) % 12 === 0 ? 2 : 0);
    if (stairs && ly > 0) k = ly % 3 === 0 ? 6 : ly % 3 === 2 ? 2 : 4;
    P.px(x, y, S_STONE[k]);
  }
  return P.done();
}

function genGate(w, h, o = {}) {
  const W = w + 20, P = new Paint(W, h + 10);
  const cx = W / 2, top = 10;
  const posts = [10 + 4, 10 + w * 0.3, 10 + w * 0.7, 10 + w - 4].map(Math.round);
  for (const x of posts) for (let y = top + 18; y < top + h; y++) for (let i = -3; i <= 3; i++) {
    let c = S_LACQ[i === -3 ? 0 : i === 3 ? 1 : i === 2 ? 5 : 3];
    if (y > top + h - 8) c = S_STONE[i === -3 || i === 3 ? 1 : 5 - (y % 3 === 0 ? 1 : 0)];
    P.px(x + i, y, c);
  }
  // cross beams
  for (const [y0, hh] of [[top + 18, 5], [top + 34, 4]]) for (let y = y0; y < y0 + hh; y++) for (let x = 6; x < W - 6; x++) P.px(x, y, y === y0 ? S_GOLD[3] : y === y0 + hh - 1 ? S_LACQ[0] : '#2f6a5e');
  // plaque
  for (let y = top + 23; y < top + 34; y++) for (let x = Math.round(cx - 18); x < Math.round(cx + 18); x++) {
    const e = y === top + 23 || y === top + 33 || x === Math.round(cx - 18) || x === Math.round(cx + 17);
    P.px(x, y, e ? S_GOLD[2] : '#141010');
  }
  // gold glyph strokes (stylized, not real characters)
  const gl = [[-12, 0, 6, 0], [-9, -3, -9, 4], [-12, 4, -6, 4], [2, -3, 10, -3], [6, -3, 6, 5], [3, 1, 9, 1], [2, 5, 10, 5]];
  for (const [a, b, c2, d] of gl) P.line(cx + a, top + 28 + b, cx + c2, top + 28 + d, S_GOLD[4]);
  paintRoof(P, cx, top, w * 0.2, w * 0.36, 16, ROOF_PAL[o.roof || 'teal']);
  paintRoof(P, cx - w * 0.36, top + 8, 6, 14, 10, ROOF_PAL[o.roof || 'teal'], false);
  paintRoof(P, cx + w * 0.36, top + 8, 6, 14, 10, ROOF_PAL[o.roof || 'teal'], false);
  return P.done();
}

function genPlum(s, seed, bloom = ['#f6d6dc', '#e8a0ac', '#c85a6c', '#fff4f4']) {
  const R = new RNG(seed), W = Math.round(90 * s), H = Math.round(80 * s);
  const P = new Paint(W, H);
  const blossoms = [];
  const branch = (x, y, a, len, w, depth) => {
    let px = x, py = y;
    const segs = 3 + R.i(0, 2);
    for (let i = 0; i < segs; i++) {
      a += R.r(-0.5, 0.5);
      const nx = px + Math.cos(a) * len / segs, ny = py + Math.sin(a) * len / segs;
      P.thick(px, py, nx, ny, t => Math.max(1, w * (1 - (i + t) / segs * 0.45)), (xx, yy, d, dx, dy) => (dx > 0.3 ? '#5a4032' : dx < -0.4 ? '#1a1210' : '#33241c'));
      if (depth < 3 && R.ch(0.45)) branch(nx, ny, a + R.r(-1.1, 1.1), len * 0.55, Math.max(1, w * 0.6), depth + 1);
      if (depth >= 1) for (let b = 0; b < 3; b++) if (R.ch(0.55)) blossoms.push([nx + R.r(-3, 3), ny + R.r(-3, 3)]);
      px = nx; py = ny;
    }
    if (depth < 4) branch(px, py, a + R.r(-0.7, 0.7), len * 0.6, Math.max(1, w * 0.55), depth + 1);
  };
  branch(W * 0.5, H - 1, -Math.PI / 2 + R.r(-0.25, 0.25), 44 * s, 4 * s, 0);
  for (const [x, y] of blossoms) {
    const r = R.ch(0.3) ? 2 : 1;
    P.ellipse(x, y, r + 0.5, r + 0.5, (xx, yy, d) => (d < 0.25 ? bloom[2] : d > 0.7 ? bloom[1] : hash2(xx, yy, 3) > 0.6 ? bloom[3] : bloom[0]));
  }
  return P.done();
}

function genLion(s = 1) {
  const W = 30, H = 36, P = new Paint(W, H);
  const st = (x, y, d, dx, dy) => S_STONE[clamp(Math.round(4 - dy * 2 + dx * 1.2 + (hash2(x, y, 2) > 0.85 ? 1 : 0)), 1, 7)];
  for (let y = 26; y < 36; y++) for (let x = 3; x < 27; x++) P.px(x, y, S_STONE[y === 26 ? 7 : y === 35 ? 1 : x === 3 ? 2 : 5 - (y === 31 ? 2 : 0)]);
  P.ellipse(15, 20, 9, 7, st);      // haunches
  P.ellipse(19, 17, 6, 8, st);      // chest
  P.ellipse(20, 9, 7, 7, st);       // head + mane
  for (let a = 0; a < 7; a++) P.ellipse(20 + Math.cos(a * 0.9) * 6, 9 + Math.sin(a * 0.9) * 6, 2.2, 2.2, (x, y, d) => (d > 0.6 ? S_STONE[2] : S_STONE[5]));
  P.ellipse(24, 10, 3, 3, st);      // snout
  P.px(22, 7, S_STONE[0]); P.px(23, 7, S_STONE[0]); P.px(26, 11, S_STONE[1]); P.px(25, 12, S_STONE[0]);
  P.ellipse(24, 23, 3, 3, (x, y, d) => (d > 0.6 ? S_STONE[2] : S_STONE[6])); // ball under paw
  P.ellipse(8, 14, 3, 5, st);       // tail curl
  P.outline(S_STONE[0]);
  return P.done();
}

function genStoneLantern() {
  const P = new Paint(14, 30);
  const blk = (x, y, w, h, lit) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) P.px(x + i, y + j, S_STONE[i === 0 ? 3 : i === w - 1 ? 2 : j === 0 ? 7 : lit && i > 1 && i < w - 2 && j > 1 && j < h - 1 ? '#ffd88a' : 5]); };
  blk(3, 24, 8, 6); blk(5, 16, 4, 8); blk(2, 13, 10, 3); blk(3, 7, 8, 6, 0);
  for (let j = 0; j < 4; j++) for (let i = -j - 1; i <= j + 1; i++) P.px(7 + i, 3 + j, S_STONE[j === 0 ? 7 : 4]);
  P.px(7, 1, S_STONE[5]); P.px(7, 2, S_STONE[5]);
  for (let j = 8; j < 12; j++) for (let i = 5; i < 9; i++) P.px(i, j, j === 8 ? '#e8a84a' : '#f6c76a');
  P.outline(S_STONE[0]);
  return P.done();
}

function genBellFrame() {
  const P = new Paint(40, 52);
  for (const x of [4, 34]) for (let y = 8; y < 52; y++) for (let i = 0; i < 3; i++) P.px(x + i, y, S_WOOD[i === 0 ? 4 : i === 2 ? 1 : 3]);
  for (let y = 8; y < 12; y++) for (let x = 1; x < 39; x++) P.px(x, y, S_WOOD[y === 8 ? 5 : y === 11 ? 1 : 3]);
  paintRoof(P, 20, 1, 8, 18, 7, S_TEAL, false);
  // bell
  for (let y = 14; y < 40; y++) {
    const t = (y - 14) / 26, hw = 5 + t * 5 + (y > 37 ? 1 : 0);
    for (let x = Math.round(20 - hw); x <= Math.round(20 + hw); x++) {
      const u = (x - 20) / hw;
      let c = RAMP.bronze[clamp(Math.round(3 + u * 1.5 - (u < -0.7 ? 1 : 0)), 1, 5)];
      if ((y - 14) % 7 === 0 || (y > 30 && y < 32)) c = RAMP.bronze[1];
      if (y > 20 && y < 28 && Math.abs(x - 20 - (hash2(x, y, 3) > 0.5 ? 1 : 0)) % 3 === 0 && Math.abs(u) < 0.6) c = RAMP.bronze[5];
      P.px(x, y, c);
    }
  }
  for (let y = 12; y < 14; y++) for (let x = 18; x < 23; x++) P.px(x, y, RAMP.bronze[2]);
  P.outline('#1a1008');
  return P.done();
}

function genIncense() {
  const P = new Paint(24, 22);
  for (let y = 6; y < 17; y++) { const t = (y - 6) / 11, hw = 10 - t * 2; for (let x = Math.round(12 - hw); x <= Math.round(12 + hw); x++) P.px(x, y, RAMP.bronze[clamp(Math.round(3 + (x - 12) / hw * 1.4 + (y === 6 ? 2 : 0)), 1, 5)]); }
  for (const x of [4, 12, 19]) for (let y = 17; y < 22; y++) P.px(x, y, RAMP.bronze[2]);
  for (const x of [2, 21]) for (let y = 2; y < 7; y++) P.px(x, y, RAMP.bronze[3]);
  for (let x = 2; x < 5; x++) P.px(x, 2, RAMP.bronze[3]); for (let x = 19; x < 22; x++) P.px(x, 2, RAMP.bronze[3]);
  for (const x of [9, 11, 14]) for (let y = 0; y < 7; y++) P.px(x, y, y === 0 ? '#ff7a3a' : '#9a3a2a');
  for (let x = 6; x < 18; x += 2) P.px(x, 10, RAMP.bronze[5]);
  P.outline('#1a1008');
  return P.done();
}

function genRack() {
  const P = new Paint(34, 44);
  for (const y of [12, 32]) for (let x = 0; x < 34; x++) for (let j = 0; j < 3; j++) P.px(x, y + j, S_WOOD[j === 0 ? 4 : j === 2 ? 1 : 3]);
  for (const x of [2, 30]) for (let y = 10; y < 44; y++) for (let i = 0; i < 2; i++) P.px(x + i, y, S_WOOD[i ? 1 : 4]);
  const W = [[7, '#b82a1c'], [13, '#b82a1c'], [19, '#d8a53a'], [25, '#b82a1c']];
  for (const [x, t] of W) {
    for (let y = 6; y < 42; y++) P.px(x, y, S_WOOD[3]);
    for (let y = 0; y < 6; y++) { P.px(x, y, RAMP.steel[4]); if (y > 1 && y < 5) P.px(x + 1, y, RAMP.steel[2]); }
    for (let y = 6; y < 10; y++) { P.px(x - 1, y, t); P.px(x + 1, y, t); }
  }
  P.outline(S_WOOD[0]);
  return P.done();
}

function genStall(o = {}) {
  const P = new Paint(56, 46);
  const awn = o.awn || ['#b82a1c', '#e8d8b8'];
  for (const x of [3, 51]) for (let y = 8; y < 46; y++) { P.px(x, y, S_WOOD[3]); P.px(x + 1, y, S_WOOD[1]); }
  for (let y = 4; y < 14; y++) for (let x = 0; x < 56; x++) {
    const t = y - 4, stripe = Math.floor((x + t * 0.4) / 6) % 2;
    let c = stripe ? awn[1] : awn[0];
    if (t === 9) c = x % 6 < 3 ? awn[0] : null;
    if (t === 0) c = S_WOOD[1];
    if (c) P.px(x, y, c);
  }
  for (let y = 30; y < 46; y++) for (let x = 5; x < 51; x++) P.px(x, y, y === 30 ? S_WOOD[5] : y === 31 ? S_WOOD[4] : (x % 10 === 0 ? S_WOOD[1] : S_WOOD[3 - (y > 42 ? 1 : 0)]));
  const R = new RNG(o.seed || 3);
  const goods = o.goods || ['#e8602a', '#f0a030', '#8ab04a', '#d8c8a0'];
  for (let i = 0; i < 12; i++) { const gx = R.i(8, 46), c = R.pick(goods); P.ellipse(gx, 28, 2, 2, (x, y, d, dx, dy) => (dy < -0.3 ? mix(c, '#ffffff', 0.35) : dy > 0.4 ? mix(c, '#000000', 0.35) : c)); }
  for (let i = 0; i < 3; i++) { const jx = 12 + i * 14; for (let y = 20; y < 29; y++) for (let x = -3; x <= 3; x++) if (Math.abs(x) < 3 + (y > 22 && y < 27 ? 1 : 0)) P.px(jx + x, y, RAMP.earth[clamp(3 + Math.sign(-x), 1, 5)]); }
  P.outline('#1a120c');
  return P.done();
}

function genBoat() {
  const P = new Paint(80, 30);
  for (let y = 16; y < 30; y++) {
    const t = (y - 16) / 14, inset = Math.round(t * t * 14);
    for (let x = inset; x < 80 - inset; x++) P.px(x, y, S_WOOD[y === 16 ? 5 : y === 17 ? 4 : (x + y) % 11 === 0 ? 1 : y > 26 ? 1 : 3]);
  }
  for (let y = 4; y < 16; y++) { const hw = 20 * Math.sqrt(1 - Math.pow((16 - y) / 13, 2)); for (let x = Math.round(40 - hw); x <= Math.round(40 + hw); x++) P.px(x, y, (x % 3 === 0) ? '#6a5430' : y < 7 ? '#c4a86a' : '#a88c52'); }
  for (let y = 0; y < 16; y++) P.px(74, y, S_WOOD[2]);
  P.outline('#140c06');
  return P.done();
}

function genShrine(active) {
  const P = new Paint(30, 38);
  for (let y = 30; y < 38; y++) for (let x = 2; x < 28; x++) P.px(x, y, S_STONE[y === 30 ? 7 : y === 37 ? 1 : 4 - (x % 7 === 0 ? 1 : 0)]);
  for (let y = 14; y < 30; y++) for (let x = 6; x < 24; x++) P.px(x, y, S_STONE[x === 6 ? 3 : x === 23 ? 2 : 5]);
  for (let y = 17; y < 28; y++) for (let x = 10; x < 20; x++) P.px(x, y, active ? (bayer(x, y) > 0.35 ? '#ffd27a' : '#f0a040') : '#2a2420');
  for (let y = 19; y < 26; y++) P.px(15, y, active ? '#fff6d0' : '#6a5a4a');
  paintRoof(P, 15, 4, 6, 14, 10, S_TEAL, true);
  P.outline(S_STONE[0]);
  return P.done();
}

function genWell() {
  const P = new Paint(28, 34);
  for (let y = 18; y < 34; y++) for (let x = 2; x < 26; x++) P.px(x, y, S_STONE[(x + (y >> 2) * 4) % 8 === 0 || y % 4 === 0 ? 2 : y === 18 ? 7 : 5]);
  for (const x of [3, 23]) for (let y = 2; y < 18; y++) { P.px(x, y, S_WOOD[4]); P.px(x + 1, y, S_WOOD[2]); }
  paintRoof(P, 14, 0, 6, 14, 6, ROOF_PAL.char, false);
  for (let y = 8; y < 14; y++) P.px(14, y, '#8a7a5a');
  P.outline('#140c06');
  return P.done();
}

// ---------------------------------------------------------------------------
class Prop {
  constructor(type, x, y, o = {}) {
    this.type = type; this.x = x; this.y = y; this.o = o; this.front = !!o.front; this.f = o.f || 1;
    this.seed = o.seed || ((x * 7 + y * 13) | 0); this.t = rndi(0, 1000);
    const def = PROP_DEFS[type];
    this.def = def;
    if (def.art) this.img = cachedArt(type + JSON.stringify(o), () => def.art(o, this.seed));
    if (def.init) def.init(this);
  }
  update() { this.t++; if (this.def.update) this.def.update(this); }
  draw(ctx, cam) {
    const sx = Math.round(this.x - cam.x * this.f), sy = Math.round(this.y - cam.y * (this.f === 1 ? 1 : lerp(1, this.f, 0.5)));
    if (this.img) {
      if (sx + this.img.width / 2 < -40 || sx - this.img.width / 2 > VW + 40) return;
      ctx.drawImage(this.img, sx - (this.img.width >> 1), sy - this.img.height + (this.def.sink || 0));
    }
    if (this.def.draw) this.def.draw(this, ctx, sx, sy, cam);
  }
  lights(cam, out) { if (this.def.light) this.def.light(this, out, Math.round(this.x - cam.x), Math.round(this.y - cam.y)); }
}

function drawBannerCloth(ctx, x, y, w, h, t, pal, emblem) {
  for (let i = 0; i < w; i++) {
    const wave = Math.round(Math.sin(t * 0.06 + i * 0.35) * (i / w) * 2.2);
    for (let j = 0; j < h + (i === w - 1 ? 0 : 0); j++) {
      const tail = j > h - 5 && (i % 4 === 1 || i % 4 === 2) && j > h - 5 + (i % 2);
      if (j >= h - 4 && !tail && j > h - 2) continue;
      let c = i === 0 || j === 0 ? pal[0] : i === w - 1 ? pal[1] : j > h - 5 ? pal[1] : (i + wave) % 5 === 0 ? pal[1] : pal[2];
      if (emblem && j > 6 && j < 14 && i > 2 && i < w - 3) { const dx = i - w / 2 + 0.5, dy = j - 10; if (dx * dx + dy * dy < 9) c = pal[3]; if (dx * dx + dy * dy < 3) c = pal[2]; }
      ctx.fillStyle = c; ctx.fillRect(x + i, y + j + wave, 1, 1);
    }
  }
}

      const w = p.o.w || 12, cols = ['#0a1109', '#132012', '#1c2e19', '#284024', '#3b5732', '#56753f'];
      for (let j = 0; j < VH; j++) {
        const node = (j + p.seed) % 46;
        const bulge = node === 0 || node === 45 ? 1 : 0;
        for (let i = -bulge; i < w + bulge; i++) {
          const u = (i + 0.5) / w;
          let k = u < 0.08 ? 0 : u > 0.92 ? 1 : u < 0.22 ? 4 : u < 0.32 ? 5 : u < 0.6 ? 3 : 2;
          if (node === 0) k = 0; else if (node === 1 || node === 45) k = Math.min(5, k + 1);
          ctx.fillStyle = cols[k]; ctx.fillRect(x + i, j, 1, 1);
        }
      }
      const R = new RNG(p.seed);
      for (let c = 0; c < 3; c++) {
        const cy = R.r(6, 150), dir = R.ch(0.5) ? 1 : -1;
        for (let l = 0; l < 5; l++) {
          const a = R.r(0.25, 0.95), L = R.r(14, 26);
          for (let t = 0; t < L; t++) {
            const lx = Math.round(x + w / 2 + dir * (6 + t * Math.cos(a))), ly = Math.round(cy + l * 4 + t * Math.sin(a) * 0.9);
            const wd = t < 3 || t > L - 4 ? 1 : 2;
            ctx.fillStyle = t > L - 5 ? cols[1] : cols[3 + (t % 4 === 1 ? 1 : 0)];
            ctx.fillRect(lx, ly, 2, wd);

      }

  },

function drawFire(ctx, x, y, s, t, k = 1) {
  const cols = ['#8a1a0a', '#e8481a', '#ff8a3a', '#ffd08a', '#fff6d8'];
  for (let i = 0; i < 18; i++) {
    const ph = (t * 0.09 + i * 0.37) % 1;
    const px = x + Math.sin(i * 2.3 + t * 0.07) * s * 0.45 * (1 - ph);
    const py = y - ph * s * 1.6 * k;
    const r = Math.max(0, (1 - ph) * s * 0.35 * (0.6 + (i % 3) * 0.2));
    discPx(ctx, px, py, r, cols[clamp(Math.floor((1 - ph) * 4 + (i % 2)), 0, 4)]);
  }
}

// ==== world/tilemap.js ====
// ---------------------------------------------------------------------------
// Tile map: parsing, collision queries and body movement.
// Map legend:  # solid   % solid (alternate material)   = one-way   - one-way (alt)
//              / slope rising right   \ slope rising left   ^ spikes
//              ~ water surface   w water body   letters are entity markers
// ---------------------------------------------------------------------------
const T_EMPTY = 0, T_SOLID = 1, T_ONEWAY = 2, T_SLR = 3, T_SLL = 4, T_SPIKE = 5, T_WATER = 6, T_WTOP = 7;
const TILE_CHARS = { '#': [T_SOLID, 0], '%': [T_SOLID, 1], '=': [T_ONEWAY, 0], '-': [T_ONEWAY, 1], '/': [T_SLR, 0], '\\': [T_SLL, 0], '^': [T_SPIKE, 0], '~': [T_WTOP, 0], 'w': [T_WATER, 0] };
const STEP_UP = 6, SNAP = 7;

class TileMap {
  constructor(rows) {
    this.h = rows.length;
    this.w = Math.max(...rows.map(r => r.length));
    this.t = new Uint8Array(this.w * this.h);
    this.v = new Uint8Array(this.w * this.h);
    this.marks = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const ch = rows[y][x] || '.';
      const d = TILE_CHARS[ch];
      if (d) { this.t[y * this.w + x] = d[0]; this.v[y * this.w + x] = d[1]; }
      else if (ch !== '.' && ch !== ' ') this.marks.push({ ch, tx: x, ty: y, x: x * TS + TS / 2, y: (y + 1) * TS });
    }
    this.pw = this.w * TS; this.ph = this.h * TS;
  }
  get(tx, ty) {
    if (tx < 0 || tx >= this.w) return T_SOLID;
    if (ty < 0 || ty >= this.h) return T_EMPTY;
    return this.t[ty * this.w + tx];
  }
  var(tx, ty) { return tx < 0 || ty < 0 || tx >= this.w || ty >= this.h ? 0 : this.v[ty * this.w + tx]; }
  solid(tx, ty) { return this.get(tx, ty) === T_SOLID; }
  solidPx(x, y) { return this.solid(Math.floor(x / TS), Math.floor(y / TS)); }
  slopeY(t, tx, ty, x) { const lx = clamp(x - tx * TS, 0, TS); return ty * TS + (t === T_SLR ? TS - lx : lx); }
  // highest floor surface for a probe at x whose top lies within [yTop, yBot]
  floorAt(x, yTop, yBot, prevY, drop, allowSlope) {
    const tx = Math.floor(x / TS);
    let best = Infinity, slope = false;
    const r0 = Math.floor(yTop / TS), r1 = Math.floor(yBot / TS);
    for (let ty = r0; ty <= r1; ty++) {
      const t = this.get(tx, ty);
      let s = null, sl = false;
      if (t === T_SOLID) { if (this.get(tx, ty - 1) !== T_SOLID) s = ty * TS; }
      else if (t === T_ONEWAY) { if (!drop && prevY <= ty * TS + 0.5) s = ty * TS; }
      else if ((t === T_SLR || t === T_SLL) && allowSlope) { s = this.slopeY(t, tx, ty, x); sl = true; }
      if (s !== null && s >= yTop - 0.01 && s <= yBot + 0.01 && s < best) { best = s; slope = sl; }
    }
    return { y: best, slope };
  }
  isSlopeCol(x, y0, y1) {
    const tx = Math.floor(x / TS);
    for (let ty = Math.floor(y0 / TS); ty <= Math.floor(y1 / TS); ty++) { const t = this.get(tx, ty); if (t === T_SLR || t === T_SLL) return true; }
    return false;
  }
  surfaceBelow(x, y) {
    const tx = Math.floor(x / TS);
    if (tx < 0 || tx >= this.w) return this.ph + 200;
    for (let ty = Math.max(0, Math.floor(y / TS)); ty < this.h; ty++) {
      const t = this.get(tx, ty);
      let s = null;
      if (t === T_SOLID || t === T_ONEWAY) s = ty * TS;
      else if (t === T_SLR || t === T_SLL) s = this.slopeY(t, tx, ty, x);
      if (s !== null && s >= y) return s;
    }
    return this.ph + 200;
  }
  hazard(x0, y0, x1, y1) {
    let out = null;
    for (let ty = Math.floor(y0 / TS); ty <= Math.floor(y1 / TS); ty++) for (let tx = Math.floor(x0 / TS); tx <= Math.floor(x1 / TS); tx++) {
      const t = this.get(tx, ty);
      if (t === T_SPIKE && y1 > ty * TS + 8) return 'spike';
      if ((t === T_WATER || t === T_WTOP) && y1 > ty * TS + (t === T_WTOP ? 6 : 0)) out = 'water';
    }
    return out;
  }
}

// Move a body (x = feet center, y = feet) through the map with slopes,
// one-way platforms, step-ups and ground snapping.
function moveBody(b, map) {
  // safety net: a body embedded in solid ground is lifted to the surface
  if (map.solidPx(b.x, b.y - 2)) {
    let ty = Math.floor((b.y - 2) / TS);
    while (ty > 0 && map.solid(Math.floor(b.x / TS), ty)) ty--;
    b.y = (ty + 1) * TS; b.vy = Math.min(b.vy, 0);
  }
  const was = b.grounded;
  b.wallL = b.wallR = false;
  const hw = b.w / 2;
  if (b.vx !== 0) {
    b.x += b.vx;
    // on slopes the front edge is ahead of the feet: allow half width + speed of step
    const top = b.y - b.h + 2, bot = b.y - (was ? Math.max(STEP_UP, hw + Math.abs(b.vx) + 2) : 2);
    const r0 = Math.floor(top / TS), r1 = Math.floor((bot - 0.01) / TS);
    if (b.vx > 0) {
      const tx = Math.floor((b.x + hw) / TS);
      for (let ty = r0; ty <= r1; ty++) if (map.solid(tx, ty)) { b.x = tx * TS - hw - 0.01; b.vx = 0; b.wallR = true; break; }
    } else {
      const tx = Math.floor((b.x - hw) / TS);
      for (let ty = r0; ty <= r1; ty++) if (map.solid(tx, ty)) { b.x = (tx + 1) * TS + hw + 0.01; b.vx = 0; b.wallL = true; break; }
    }
    if (b.bounds) { if (b.x - hw < b.bounds[0]) { b.x = b.bounds[0] + hw; b.vx = 0; b.wallL = true; } if (b.x + hw > b.bounds[1]) { b.x = b.bounds[1] - hw; b.vx = 0; b.wallR = true; } }
  }
  const prevY = b.y;
  b.y += b.vy;
  b.onSlope = false;
  if (b.vy < 0) {
    const ty = Math.floor((b.y - b.h) / TS);
    for (let tx = Math.floor((b.x - hw + 1) / TS); tx <= Math.floor((b.x + hw - 1) / TS); tx++) {
      if (map.solid(tx, ty)) { b.y = (ty + 1) * TS + b.h; b.vy = 0; break; }
    }
    b.grounded = false;
    return;
  }
  const yTop = Math.min(prevY, b.y) - (was ? STEP_UP : 0.5);
  const yBot = b.y + (was && !b.noSnap ? SNAP : 0);
  const drop = b.drop > 0;
  const c = map.floorAt(b.x, yTop, yBot, prevY, drop, true);
  let best = c.y;
  if (!map.isSlopeCol(b.x, yTop, yBot)) {
    for (const px of [b.x - hw + 1, b.x + hw - 1]) { const r = map.floorAt(px, yTop, yBot, prevY, drop, false); if (r.y < best) best = r.y; }
  }
  if (best < Infinity) { b.y = best; b.vy = 0; b.grounded = true; b.onSlope = c.slope && c.y === best; }
  else b.grounded = false;
}

// ==== world/camera.js ====
// ---------------------------------------------------------------------------
// Camera: look-ahead follow, arena locks, cinematic targets and shake.
// ---------------------------------------------------------------------------
class Camera {
  constructor() { this.x = 0; this.y = 0; this.look = 0; this.lock = null; this.focus = null; this.vx = 0; this.vy = 0; }
  bounds(map) {
    let x0 = 0, x1 = map.pw - VW;
    if (this.lock) { x0 = this.lock[0]; x1 = this.lock[1] - VW; }
    return [x0, Math.max(x0, x1), 0, Math.max(0, map.ph - VH)];
  }
  update(p, map, snap = false) {
    let tx, ty;
    if (this.focus) { tx = this.focus.x - VW / 2; ty = this.focus.y - VH * 0.62; }
    else {
      this.look = approach(this.look, p.facing * 34, 0.9);
      tx = p.x + this.look - VW / 2;
      ty = p.y - VH * 0.64;
    }
    if (Dialogue.active || G.script) this.talk = approach(this.talk || 0, 38, 1.5); else this.talk = approach(this.talk || 0, 0, 1.5);
    ty += this.talk;
    const [x0, x1, y0, y1] = this.bounds(map);
    tx = clamp(tx, x0, x1); ty = clamp(ty, y0, y1);
    if (snap) { this.x = tx; this.y = ty; return; }
    const kx = this.focus ? this.focus.k || 0.06 : 0.14, ky = this.focus ? this.focus.k || 0.06 : p.vy > 4 ? 0.2 : 0.09;
    this.x += (tx - this.x) * kx;
    this.y += (ty - this.y) * ky;
  }
  view() {
    const s = FX.shake;
    return { x: Math.round(this.x + (s ? rnd(-s, s) : 0)), y: Math.round(this.y + (s ? rnd(-s, s) * 0.7 : 0)), rx: this.x, ry: this.y };
  }
}

// ==== world/levels.js ====
// ---------------------------------------------------------------------------
// Level data. Maps are assembled with a small builder (ground runs, stairs,
// platforms, water, markers) instead of hand typed rows, which keeps jump
// distances honest. Markers: P player, c cultist, k bandit, s spearman,
// a assassin, b brute, r archer, j jiangshi, o jar, O jar with ginseng,
// d dummy, x crate, S shrine. Props and triggers use tile coordinates.
// ---------------------------------------------------------------------------
class MapBuilder {
  constructor(w, h) { this.w = w; this.h = h; this.g = Array.from({ length: h }, () => new Array(w).fill('.')); }
  set(x, y, c) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.g[y][x] = c; }
  rect(x, y, w, h, c = '#') { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.set(i, j, c); return this; }
  ground(x0, x1, top, c = '#') { return this.rect(x0, top, x1 - x0, this.h - top, c); }
  up(x, top, n) { for (let i = 0; i < n; i++) { this.set(x + i, top - 1 - i, '/'); this.rect(x + i, top - i, 1, this.h - (top - i)); } return top - n; }
  down(x, top, n) { for (let i = 0; i < n; i++) { this.set(x + i, top + i, '\\'); this.rect(x + i, top + i + 1, 1, this.h - (top + i + 1)); } return top + n; }
  plat(x0, x1, y, c = '=') { for (let i = x0; i < x1; i++) this.set(i, y, c); return this; }
  water(x0, x1, top) { for (let i = x0; i < x1; i++) { this.set(i, top, '~'); for (let j = top + 1; j < this.h; j++) this.set(i, j, 'w'); } return this; }
  pit(x0, x1) { for (let i = x0; i < x1; i++) for (let j = 0; j < this.h; j++) this.set(i, j, '.'); return this; }
  spikes(x0, x1, top) { for (let i = x0; i < x1; i++) this.set(i, top - 1, '^'); return this; }
  m(x, y, c) { this.set(x, y, c); return this; }
  rows() { return this.g.map(r => r.join('')); }
}

// ---------------------------------------------------------------------------
// Runtime loading
// ---------------------------------------------------------------------------
const MARKER_ENEMY = { c: 'cultist', k: 'bandit', s: 'spearman', a: 'assassin', b: 'brute', r: 'archer', j: 'jiangshi' };

function loadLevel(idx, checkpoint) {
  const L = LEVELS[idx];
  const B = new MapBuilder(L.w, L.h);
  L.build(B);
  G.level = L; G.levelIdx = idx;
  G.map = new TileMap(B.rows());
  G.terrain = Terrain.build(G.map, L.theme);
  G.bd = Backdrop.make(L.bg || L.theme, G.map);
  G.ents = []; G.props = []; G.fronts = []; G.arena = null; G.boss = null; G.lock = null;
  FX.clear(); Combat.reset();
  G.firedEvents = new Set(); G.clearedArenas = new Set(G.persistArenas || []);
  G.wind = L.theme === 'bamboo' ? -0.05 : L.theme === 'fort' ? 0.08 : 0.03;
  for (const [type, tx, ty, o = {}] of L.props) {
    const p = new Prop(type, tx * TS + TS / 2, ty * TS, o);
    (p.front ? G.fronts : G.props).push(p);
  }
  let start = null;
  for (const m of G.map.marks) {
    if (m.ch === 'P') start = m;
    else if (MARKER_ENEMY[m.ch]) spawnEnemy(MARKER_ENEMY[m.ch], m.x, m.y);
    else if (m.ch === 'o' || m.ch === 'O') G.ents.push(new Breakable('jar', m.x, m.y, m.ch === 'O' ? 'ginseng' : null));
    else if (m.ch === 'd') G.ents.push(new Breakable('dummy', m.x, m.y, 'qi'));
    else if (m.ch === 'x') G.ents.push(new Breakable('crate', m.x, m.y));
    else if (m.ch === 'S') { const s = new Prop('shrine', m.x, m.y); s.shrine = true; G.props.push(s); }
  }
  const p = G.player = new Player(start.x, start.y);
  if (G.carry) { p.hp = Math.max(60, G.carry.hp); p.qi = G.carry.qi; }
  if (checkpoint) {
    p.x = checkpoint.x; p.y = checkpoint.y; p.safe = { x: p.x, y: p.y };
    for (const e of checkpoint.events || []) G.firedEvents.add(e);
    for (const s of G.props) if (s.shrine && Math.abs(s.x - p.x) < 40) s.active = true;
    // enemies behind the checkpoint are gone
    G.ents = G.ents.filter(e => !(e instanceof Enemy) || e.x > p.x + 100);
  }
  G.ents.push(p);
  G.cam = new Camera();
  G.cam.update(p, G.map, true);
  G.checkpoint = checkpoint || { x: p.x, y: p.y, events: [] };
}

// arena: lock the camera and spawn waves until cleared
function startArena(A, extra = []) {
  G.arena = { A, wave: -1, t: 0, left: [], extra };
  G.cam.lock = [A.x0 * TS, A.x1 * TS];
  G.player.bounds = [A.x0 * TS, A.x1 * TS];
  SFX.play('drum');
  nextWave();
}
function nextWave() {
  const R = G.arena;
  R.wave++;
  if (R.wave >= R.A.waves.length) {
    G.clearedArenas.add(R.A.id);
    G.cam.lock = null; G.player.bounds = null; G.arena = null;
    Hud.banner('THE WAY IS CLEAR', 90);
    SFX.play('gong');
    return;
  }
  R.left = R.wave === 0 ? R.extra.slice() : [];
  for (const e of R.left) e.bounds = [R.A.x0 * TS, R.A.x1 * TS];
  for (const [ch, tx, how] of R.A.waves[R.wave]) {
    const kind = MARKER_ENEMY[ch];
    const x = how === 'l' ? R.A.x0 * TS + 10 : how === 'r' ? R.A.x1 * TS - 10 : tx * TS;
    const y = how === 'drop' ? G.cam.y - 10 : G.map.surfaceBelow(x, G.cam.y + 40);
    const e = spawnEnemy(kind, x, y, { aggro: true, facing: x < G.player.x ? 1 : -1, bounds: [R.A.x0 * TS, R.A.x1 * TS] });
    if (how === 'drop') { e.vy = 2; FX.ink(x, y + 20, 6); }
    else FX.dust(x, y, 6);
    R.left.push(e);
  }
}
function updateArena() {
  const R = G.arena;
  if (!R) return;
  R.left = R.left.filter(e => !e.dead);
  if (R.left.length === 0 && !G.script) { if (++R.t > 50) { R.t = 0; nextWave(); } }
}

// ---------------------------------------------------------------------------
// Entity and physics body base classes.
// Positions are feet-centered: (x, y) is the middle of the bottom edge.
// ---------------------------------------------------------------------------
let _eid = 1;
class Ent {
  constructor(x, y) {
    this.id = _eid++; this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.w = 12; this.h = 40; this.team = 0; this.z = 0; this.remove = false; this.dead = false;
  }
  update() {}
  draw() {}
  box() { return [this.x - this.w / 2, this.y - this.h, this.w, this.h]; }
}
class Body extends Ent {
  constructor(x, y) {
    super(x, y);
    this.grounded = false; this.drop = 0; this.grav = 0.34; this.gravMul = 1; this.maxFall = 7.5; this.noGrav = false; this.bounds = null;
  }
  physics() {
    if (!this.noGrav) this.vy = Math.min(this.maxFall, this.vy + this.grav * this.gravMul);
    if (this.drop > 0) this.drop--;
    moveBody(this, G.map);
  }
}
const overlap = (a, b) => a[0] < b[0] + b[2] && a[0] + a[2] > b[0] && a[1] < b[1] + b[3] && a[1] + a[3] > b[1];

// soft contact shadow on the ground under a body
function drawShadow(ctx, cam, x, y, w) {
  const sy = G.map.surfaceBelow(x, y - 4);
  const gap = sy - y;
  if (gap > 90) return;
  const k = 1 - gap / 90, hw = Math.round(w * (0.5 + 0.5 * k));
  const sx = Math.round(x - cam.x), yy = Math.round(sy - cam.y) - 1;
  ctx.fillStyle = 'rgba(12,8,6,0.32)';
  ctx.fillRect(sx - hw, yy, hw * 2 + 1, 1);
  ctx.fillRect(sx - hw + 2, yy - 1, hw * 2 - 3, 1);
}

// ==== entities/fighter.js ====
// ---------------------------------------------------------------------------
// Fighter: shared humanoid logic for the hero, enemies, bosses and NPCs.
// States: free | move | hurt | air (juggled) | down | getup | stagger |
//         guard | dash | dead | cut (scripted)
// ---------------------------------------------------------------------------
class Fighter extends Body {
  constructor(cid, x, y) {
    super(x, y);
    this.setCostume(cid);
    this.anim = 'idle'; this.at = 0; this.facing = 1; this.animSpeed = 1;
    this.hp = this.maxHp = 100; this.st = 'free'; this.stT = 0;
    this.move = null; this.mname = ''; this.mt = 0; this.hitSet = new Set();
    this.inv = 0; this.flash = 0; this.armor = false; this.poise = 0; this.poiseMax = 0;
    this.w = 12; this.h = 40; this.team = 1; this.juggle = 0; this.hitShake = 0;
    this.frame = null; this.alpha = 1; this.visible = true; this.kbMul = 1; this.dmgTaken = 1;
    this.moves = MOVES;
  }
  setCostume(cid) {
    const keep = this.ribbons;
    this.C = COSTUME[cid]; this.cid = cid;
    this.ribbons = (this.C.ribbons || []).map(d => new Ribbon(d, this.C));
    if (keep) this.ribbons.forEach((r, i) => { if (keep[i]) { r.pts = keep[i].pts; r.ok = keep[i].ok; } });
  }
  setAnim(a, restart = false) { if (this.anim !== a || restart) { this.anim = a; this.at = 0; } }
  animDone() { return this.at >= animLen(this.C, this.anim) - 1; }
  face(x) { if (Math.abs(x - this.x) > 1) this.facing = x > this.x ? 1 : -1; }

  startMove(name) {
    const M = this.moves[name];
    if (!M) return;
    this.move = M; this.mname = name; this.mt = -1; this.hitSet.clear();
    this.st = 'move'; this.stT = 0;
    this.setAnim(M.anim, true);
    this.gravMul = M.grav !== undefined ? M.grav : 1;
    this.armor = false;
  }
  cancelMove() {
    if (this.move && this.onMoveEnd) this.onMoveEnd(this.move, true);
    this.move = null; this.mname = ''; this.gravMul = 1; this.armor = false;
  }
  endMove() {
    const M = this.move;
    this.move = null; this.mname = ''; this.gravMul = 1; this.armor = false;
    if (this.onMoveEnd) this.onMoveEnd(M, false);
    if (this.st === 'move') this.st = 'free';
  }
  tickMove() {
    const M = this.move;
    const f = ++this.mt;
    if (M.step) for (const [k, v] of M.step) if (k === f) this.vx = v * this.facing;
    if (M.vy) for (const [k, v] of M.vy) if (k === f) { this.vy = v; this.grounded = false; }
    this.armor = !!(M.armor && f >= M.armor[0] && f <= M.armor[1]);
    if (M.inv && f >= M.inv[0] && f <= M.inv[1]) this.inv = Math.max(this.inv, 1);
    if (M.fx) for (const e of M.fx) if (e.f === f) this.moveFx(e);
    if (M.ev && M.ev[f]) M.ev[f](this);
    if (this.move !== M) return;
    if (M.hit) for (const h of M.hit) if (f >= h.f0 && f <= h.f1) {
      if (h.multi && (f - h.f0) % h.multi === 0) this.hitSet.clear();
      Combat.sweep(this, h);
    }
    if (!M.step || !M.step.some(s => s[0] === f)) this.vx *= this.grounded ? 0.8 : 0.97;
    if (f >= M.len - 1) this.endMove();
  }
  moveFx(e) {
    if (e.slash) FX.slash(this, { ...e.slash, cols: e.slash.cols || this.slashCols || SLASH_COLS.hero });
    if (e.streak) FX.streak(this.x + this.facing * 6, this.y + e.streak.cy, this.facing, e.streak.len, { cols: e.streak.cols || this.slashCols || SLASH_COLS.hero });
    if (e.glint) { const t = this.frame && this.frame.A[(this.C.weapon ? 'f' : 'b') + 'Tip']; const gx = t ? this.x + t[0] * this.facing : this.x + this.facing * 10, gy = t ? this.y + t[1] : this.y - 40; FX.part({ kind: 'glint', x: gx, y: gy, life: 14, cols: ['#ffffff', '#fff0b0'], layer: 1 }); }
    if (e.ring) { FX.ring(this.x + this.facing * 8, this.y - 2, { r0: 4, r1: 34, c: '#fff4d0', flat: 0.35, life: 16 }); FX.kick(3); }
    if (e.dust) { FX.dust(this.x - 8, this.y, 6, -1); FX.dust(this.x + 8, this.y, 6, 1); }
    if (e.charge) for (let i = 0; i < 14; i++) { const a = rnd(TAU), r = rnd(16, 30), cx = this.x, cy = this.y - 30; FX.part({ kind: 'px', x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vx: -Math.cos(a) * r / 11, vy: -Math.sin(a) * r / 11, life: 11, cols: ['#fff6c8', '#ffd060'], layer: 1 }); }
    if (e.sfx) SFX.play(e.sfx);
  }

  onHit(att, h, dir, dmg) {
    this.flash = 7; this.flashAt = G.time; this.hitShake = h.stop || 4;
    if (this.hp <= 0) { this.die(att, h, dir); return; }
    const pd = h.poise !== undefined ? h.poise : dmg;
    if (this.armor && !h.guardBreak) { this.poise -= pd * 0.5; return; }
    if (this.poiseMax > 0) {
      this.poise -= pd;
      if (this.poise > 0 && !h.guardBreak) return;
      this.poise = this.poiseMax;
    }
    this.cancelMove();
    const kx = h.kb[0] * dir * this.kbMul, ky = h.kb[1] * this.kbMul;
    this.vx = kx;
    if (h.knock || this.juggle > 7) {
      this.st = 'down'; this.stT = 0; this.downFly = true; this.vy = Math.min(ky, -2.6); this.grounded = false; this.juggle = 0;
      this.setAnim('airhurt', true);
      return;
    }
    if (!this.grounded || h.launch || ky < -3.2) {
      this.st = 'air'; this.stT = h.stun; this.juggle++;
      this.vy = h.launch ? Math.min(ky, -5.8) : Math.min(this.vy * 0.3, ky, -2.2);
      this.grounded = false; this.gravMul = 0.72;
      this.setAnim('airhurt', true);
    } else {
      this.st = 'hurt'; this.stT = h.stun;
      this.setAnim(Math.random() < 0.5 ? 'hurt' : 'hurt2', true);
    }
  }
  die(att, h, dir) {
    this.dead = true; this.st = 'dead'; this.stT = 0; this.cancelMove();
    this.vx = (h ? Math.max(2, h.kb[0]) : 2) * dir; this.vy = -3.6; this.grounded = false; this.gravMul = 1;
    this.setAnim('dead', true);
    if (this.onDeath) this.onDeath(att);
  }
  stagger(t = 60) {
    this.cancelMove(); this.st = 'stagger'; this.stT = t; this.vx = -this.facing * 2.2; this.setAnim('stagger', true);
  }

  // per-tick state machine; subclasses provide think() for the 'free' state
  update() {
    if (this.inv > 0) this.inv--;
    if (this.flash > 0) this.flash--;
    if (this.hitShake > 0 && G.hitstop <= 0) this.hitShake = 0;
    switch (this.st) {
      case 'free': this.gravMul = 1; if (this.think) this.think(); break;
      case 'move': this.tickMove(); if (this.move && this.move.land && this.grounded && this.mt > 1) this.startMove(this.move.land); break;
      case 'hurt': if (--this.stT <= 0) { this.st = 'free'; this.juggle = 0; } this.vx *= 0.86; break;
      case 'air':
        this.stT--; this.vx *= 0.97;
        if (this.grounded && this.stT < this.juggleLandT()) { this.st = 'free'; this.juggle = 0; this.gravMul = 1; this.setAnim('land', true); FX.dust(this.x, this.y, 4); }
        break;
      case 'down':
        this.stT++;
        if (this.downFly) {
          if (this.grounded && this.stT > 3) {
            this.downFly = false; this.stT = 0; this.setAnim('down', true);
            FX.dust(this.x, this.y, 8); SFX.play('thud'); FX.kick(1.5);
            if (Math.abs(this.vx) > 1.5) this.vy = -2;
          }
        } else {
          this.vx *= 0.85;
          if (this.stT > (this.downTime || 46)) { this.st = 'getup'; this.stT = 0; this.setAnim('getup', true); this.inv = 30; }
        }
        break;
      case 'getup': this.vx = 0; if (++this.stT >= animLen(this.C, 'getup')) { this.st = 'free'; this.juggle = 0; } break;
      case 'stagger': this.vx *= 0.88; if (--this.stT <= 0) this.st = 'free'; break;
      case 'dead': this.stT++; this.vx *= this.grounded ? 0.85 : 0.99; if (this.afterDeath) this.afterDeath(); break;
      case 'cut': if (this.script) this.script(); break;
    }
    this.physics();
    if (this.st === 'dead' && this.grounded && this.anim === 'dead' && this.stT < 3) FX.dust(this.x, this.y, 6);
    this.at += this.animSpeed;
    this.frame = frameFor(this.C, this.anim, Math.floor(this.at));
    this.updateRibbons();
  }
  juggleLandT() { return 8; }
  updateRibbons() {
    const A = this.frame.A;
    const wind = (G.wind || 0) - this.vx * 0.15;
    for (const r of this.ribbons) {
      const a = A[r.anchor];
      if (!a) { r.visible = false; continue; }
      r.visible = true;
      r.update(this.x + a[0] * this.facing, this.y + a[1], this.facing, wind);
    }
  }
  draw(ctx, cam) {
    if (!this.visible || !this.frame) return;
    const fr = this.frame;
    const shake = this.hitShake && G.hitstop > 0 ? ((G.time & 1) ? 1 : -1) : 0;
    const sx = this.x - cam.x + shake, sy = this.y - cam.y;
    if (this.shadow !== false && this.st !== 'dead') drawShadow(ctx, cam, this.x, this.y, 8);
    const a = this.alpha;
    if (a < 1) { ctx.save(); ctx.globalAlpha = a; }
    for (const r of this.ribbons) if (r.behind) r.draw(ctx, cam);
    if (this.preDraw) this.preDraw(ctx, cam, sx, sy);
    blitFrame(ctx, fr, sx, sy, this.facing);
    const fa = G.time - (this.flashAt || -99);
    if (this.flash > 0 && (fa < 3 || (fa > 5 && fa < 8))) { ctx.save(); ctx.globalAlpha = fa < 3 ? 0.85 : 0.45; blitFrame(ctx, fr, sx, sy, this.facing, frameTint(fr, this.flashColor || '#fff6e8')); ctx.restore(); }
    else if (this.tint) { ctx.save(); ctx.globalAlpha = (a < 1 ? a : 1) * this.tint[1]; blitFrame(ctx, fr, sx, sy, this.facing, frameTint(fr, this.tint[0])); ctx.restore(); }
    for (const r of this.ribbons) if (!r.behind) r.draw(ctx, cam);
    if (this.postDraw) this.postDraw(ctx, cam, sx, sy);
    if (a < 1) ctx.restore();
  }
  // world position of a frame anchor
  anchor(name) { const a = this.frame && this.frame.A[name]; return a ? [this.x + a[0] * this.facing, this.y + a[1]] : [this.x, this.y - this.h * 0.7]; }
}

// Scripted character for cutscenes (no AI)
class Actor extends Fighter {
  constructor(cid, x, y, facing = 1) { super(cid, x, y); this.facing = facing; this.team = 0; this.st = 'cut'; this.walkTo = null; this.speed = 1.2; this.idleAnim = 'idle'; }
  update() {
    if (this.walkTo !== null) {
      const d = this.walkTo - this.x;
      if (Math.abs(d) < this.speed + 0.1) { this.x = this.walkTo; this.walkTo = null; this.vx = 0; this.setAnim(this.idleAnim); }
      else { this.facing = Math.sign(d); this.vx = this.facing * this.speed; this.setAnim(this.speed > 1.8 ? 'run' : 'walk'); }
    } else if (this.st === 'cut') this.vx *= 0.8;
    super.update();
  }
}

// ==== entities/player.js ====
// ---------------------------------------------------------------------------
// Lu Yan: locomotion (coyote time, jump buffering, variable jump, the
// Swallow's double jump, i-frame dash), combo strings, air combos, plunge,
// guard and perfect parry, the qi wave and the ultimate.
// ---------------------------------------------------------------------------
const PL = { run: 2.35, accG: 0.45, decG: 0.55, accA: 0.3, decA: 0.07, jump: 6.6, djump: 6, coyote: 7, buffer: 9, dash: 6, dashT: 12, dashCD: 20 };

class Player extends Fighter {
  constructor(x, y) {
    super('hero', x, y);
    this.team = 1; this.hittable = true; this.hp = this.maxHp = 100; this.qi = 30; this.qiMax = 100;
    this.coyote = 0; this.airJumps = 1; this.airDash = 1; this.dashCD = 0; this.dashT = 0; this.airAtks = 0;
    this.jumpBuf = 0; this.atkBuf = 0; this.dashBuf = 0; this.qiBuf = 0; this.ultBuf = 0; this.guardBuf = 0;
    this.parryT = 0; this.blockT = 0; this.counter = 0; this.landT = 0; this.jumpCut = false; this.lastDash = 99;
    this.combo = 0; this.comboT = 0; this.safe = { x, y }; this.safeT = 0; this.control = true; this.kbMul = 0.8;
    this.slashCols = SLASH_COLS.hero;
  }
  get ctl() { return this.control && !G.script && !G.ult; }
  dirInput() { return this.ctl ? (Input.held('right') ? 1 : 0) - (Input.held('left') ? 1 : 0) : 0; }

  update() {
    if (this.ctl) {
      if (Input.hit('jump')) this.jumpBuf = PL.buffer;
      if (Input.hit('attack')) this.atkBuf = PL.buffer;
      if (Input.hit('dash')) this.dashBuf = 7;
      if (Input.hit('qi')) this.qiBuf = 7;
      if (Input.hit('ult')) this.ultBuf = 7;
      if (Input.hit('guard')) this.guardBuf = 7;
    }
    for (const k of ['jumpBuf', 'atkBuf', 'dashBuf', 'qiBuf', 'ultBuf', 'guardBuf', 'dashCD', 'counter']) if (this[k] > 0) this[k]--;
    if (this.comboT > 0 && --this.comboT === 0) this.combo = 0;
    this.lastDash++;
    if (this.grounded) { this.coyote = PL.coyote; this.airJumps = 1; this.airDash = 1; this.airAtks = 0; } else if (this.coyote > 0) this.coyote--;
    if (this.st === 'dash') this.tickDash();
    else if (this.st === 'guard') this.tickGuard();
    else if (this.st === 'move') this.moveInput();
    const wasG = this.grounded, vy0 = this.vy;
    super.update();
    if (!wasG && this.grounded && !this.dead) this.onLandGround(vy0);
    this.checkHazards();
  }

  think() {
    if (this.autoX !== null && this.autoX !== undefined) {
      const d = this.autoX - this.x;
      if (Math.abs(d) < 1.6) { this.autoX = null; this.vx = 0; this.setAnim('idle'); }
      else { this.facing = Math.sign(d); this.vx = this.facing * 1.4; this.setAnim('walk'); }
      return;
    }
    const I = Input, dir = this.dirInput();
    if (this.ctl && this.tryActions()) return;
    const target = dir * PL.run;
    if (this.grounded) this.vx = approach(this.vx, target, dir ? PL.accG : PL.decG);
    else this.vx = approach(this.vx, target, dir ? PL.accA : PL.decA);
    if (dir) this.facing = dir;
    if (this.jumpBuf > 0) {
      if (this.ctl && I.held('down') && this.grounded && this.onPlatform()) { this.drop = 14; this.grounded = false; this.jumpBuf = 0; this.y += 1; }
      else if (this.grounded || this.coyote > 0) this.doJump(false);
      else if (this.airJumps > 0) this.doJump(true);
    }
    if (this.vy < -2 && !I.held('jump') && !this.jumpCut && this.anim !== 'djump' && this.ctl) { this.vy *= 0.5; this.jumpCut = true; }
    if (this.grounded) {
      if (this.landT > 0) { this.landT--; this.setAnim('land'); }
      else if (Math.abs(this.vx) > 0.35) {
        this.setAnim('run');
        const f = Math.floor(this.at) % 32;
        if (f === 0 || f === 16) { SFX.play('step'); if (Math.random() < 0.5) FX.dust(this.x - this.facing * 4, this.y, 2, -this.facing); }
      } else this.setAnim('idle');

  }
  onPlatform() {

  }
  tryActions() {

    if (this.qiBuf > 0) {
      this.qiBuf = 0;
      if (this.qi >= 25) { this.qi -= 25; this.startMove('qi'); return true; }
      FX.text(this.x, this.y - 58, 'NOT ENOUGH QI', '#c8b898', { life: 30 }); SFX.play('deny');
    }

      if (this.lastDash < 10) { this.startMove('dashatk'); return true; }
      if (Input.held('up')) { this.jumpUp = true; this.startMove('upatk'); return true; }
      this.jumpUp = false;
      this.startMove('atk1'); return true;
    }
    if (Input.held('down')) { this.startMove('plunge'); return true; }

      if (this.jumpBuf > 0 && (this.grounded || this.airJumps > 0)) { this.cancelMove(); this.st = 'free'; this.doJump(!this.grounded); return; }

  }
  onLandGround(vy0) {

  startDash() {

  }
  tickDash() {
    this.dashT--; this.vy = 0; this.gravMul = 0;

  onLand(t, h, dmg) {
    if (t.team === 3) return;

  }
  onHit(att, h, dir, dmg) {

  }
  die(att, h, dir) {
    super.die(att, h, dir);

    G.slow = 60;
  }
  afterDeath() { if (this.stT === 110) G.onPlayerDeath(); }
  checkHazards() {
    if (this.dead) return;
    const hz = G.map.hazard(this.x - 4, this.y - 12, this.x + 4, this.y - 1);
    if (hz === 'spike' && this.inv <= 0) {
      this.hp -= 12; this.inv = 60; FX.flash('#8a1010', 4); SFX.play('hurt');
      FX.text(this.x, this.y - 50, 12, '#ff6a4a');

      this.cancelMove(); this.st = 'air'; this.stT = 16; this.vy = -6; this.vx = -this.facing * 2; this.grounded = false;
      this.setAnim('airhurt', true);
    }
    if (hz === 'water' || this.y > G.map.ph + 30) this.fell(hz === 'water');
    if (this.grounded && !hz && this.st === 'free' && ++this.safeT > 20) {
      this.safeT = 0;
      const ok = G.map.solidPx(this.x - 6, this.y + 2) && G.map.solidPx(this.x + 6, this.y + 2);
      if (ok) this.safe = { x: this.x, y: this.y };

  }
  fell(water) {
    if (water) { FX.burst(this.x, this.y - 4, 14, { kind: 'px', dir: -Math.PI / 2, spread: 1, s0: 1, s1: 3.5, g: 0.2, cols: ['#e8f0e0', '#b8d0c0', '#7aa090'], l0: 16, l1: 30 }); SFX.play('splash'); }
    this.hp -= 15; SFX.play('hurt');

    this.x = this.safe.x; this.y = this.safe.y - 2; this.vx = this.vy = 0; this.inv = 80; this.cancelMove(); this.st = 'free';
