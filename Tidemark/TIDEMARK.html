<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2c565e">
<title>Tidemark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root {
  --paper: #f3ecdc; --paper2: #ebe2cc; --paper3: #e1d5b9; --ink: #2b2622; --ink2: #5b5147; --rule: #cbbd9c;
  --terra: #b5532f; --terra2: #923f22; --teal: #3f7f73; --ochre: #c99a2e; --moss: #6f8a4a; --red: #b8402f; --ok: #4d7f3c;
  --shadow: 0 1px 0 rgba(255,255,255,.55) inset, 0 6px 18px rgba(30,24,18,.22);
  --sans: 'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --top: 52px; --tools: 64px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2c565e; color: var(--ink); font: 14px/1.35 var(--sans); -webkit-tap-highlight-color: transparent; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
button { font: inherit; color: inherit; }
.btn { background: var(--paper); border: 1px solid var(--ink2); border-radius: 6px; padding: 6px 11px; cursor: pointer; box-shadow: 0 1px 0 rgba(43,38,34,.35); min-height: 32px; }
.btn:hover { background: #fbf6ea; }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.primary { background: var(--terra); color: #fbf3e4; border-color: var(--terra2); }
.btn.primary:hover { background: #c45e38; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.btn.small { padding: 3px 8px; min-height: 26px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip { border: 1px solid var(--rule); background: var(--paper2); border-radius: 999px; padding: 3px 10px; cursor: pointer; font: 600 12px var(--mono); min-height: 28px; }
.chip.hot { background: var(--terra); color: #fff3e2; border-color: var(--terra2); }

/* ---------- top bar ---------- */
#top { position: fixed; top: 0; left: 0; right: 0; height: var(--top); display: flex; align-items: center; gap: 14px; padding: 0 12px; padding-top: env(safe-area-inset-top);
  background: var(--paper); border-bottom: 1px solid var(--rule); box-shadow: 0 2px 12px rgba(30,24,18,.18); z-index: 20; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.mark { font: 800 19px/1 var(--serif); letter-spacing: .14em; color: var(--terra2); }
#scenName { font: 500 13px var(--sans); color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
.clockbox { display: flex; align-items: center; gap: 8px; font: 600 14px var(--mono); }
#tide { width: 132px; height: 30px; }
#wx { font: 500 13px var(--sans); color: var(--ink2); white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--ink2); border-radius: 7px; overflow: hidden; background: var(--paper); box-shadow: 0 1px 0 rgba(43,38,34,.3); }
.seg button { border: 0; background: transparent; padding: 5px 9px; cursor: pointer; font: 600 12px var(--mono); min-height: 30px; min-width: 34px; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg.small button { font: 500 12px var(--sans); padding: 4px 8px; min-height: 28px; }
.stats { display: flex; align-items: center; gap: 12px; margin-left: auto; font: 600 13px var(--mono); white-space: nowrap; }
.stats .warn { color: var(--red); }

/* ---------- tools ---------- */
#tools { position: fixed; left: 10px; top: calc(var(--top) + 10px); display: flex; flex-direction: column; gap: 6px; z-index: 15; }
.tool { width: 58px; min-height: 54px; background: var(--paper); border: 1px solid var(--ink2); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 4px 2px; box-shadow: 0 1px 0 rgba(43,38,34,.35); font: 500 11px var(--sans); }
.tool svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool.on { background: var(--ink); color: var(--paper); }
#panelTool { margin-top: 8px; }
.tool.on svg { stroke: var(--paper); }
.tool .k { font: 10px var(--mono); opacity: .55; }
#palette { position: fixed; left: 78px; top: calc(var(--top) + 10px); width: 330px; max-height: calc(100vh - var(--top) - 24px); overflow: auto; z-index: 19; padding: 10px; }
.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); }
.pal h4 { margin: 8px 2px 4px; font: 600 12px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.pal .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.card { border: 1px solid var(--rule); background: var(--paper2); border-radius: 8px; padding: 6px 8px; cursor: pointer; text-align: left; min-height: 44px; }
.card:hover { border-color: var(--ink2); }
.card.on { border-color: var(--terra); background: #f7e5d6; }
.card b { display: block; font: 600 13px var(--sans); }
.card small { color: var(--ink2); font: 11px var(--mono); }
#overlaySeg { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 14; }

/* ---------- panel ---------- */
#panel { position: fixed; right: 10px; top: calc(var(--top) + 10px); bottom: 10px; width: 372px; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); z-index: 18; display: flex; flex-direction: column; transition: transform .2s ease; }
#panel.collapsed { transform: translateX(calc(100% + 14px)); }
.tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 0; padding: 6px 4px 0; border-bottom: 1px solid var(--rule); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: transparent; padding: 7px 6px 8px; cursor: pointer; font: 600 12.5px var(--sans); color: var(--ink2); border-bottom: 2px solid transparent; min-height: 34px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--terra); }
#panelBody { overflow: auto; padding: 10px 12px 18px; flex: 1; overscroll-behavior: contain; }
#panelBody h2 { font: 600 19px/1.15 var(--serif); margin: 2px 0 6px; }
#panelBody h3 { font: 600 12px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 14px 0 6px; border-bottom: 1px solid var(--rule); padding-bottom: 3px; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 3px 8px; font-size: 13px; }
.kv > :nth-child(odd) { color: var(--ink2); }
.mono { font-family: var(--mono); font-size: 12px; }
.obst { background: #f7e1d2; border-left: 3px solid var(--terra); padding: 7px 9px; border-radius: 4px; margin: 6px 0; font-size: 13px; }
.obst.ok { background: #e3ecd6; border-left-color: var(--ok); }
.badge { display: inline-block; font: 600 11px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--paper3); margin-left: 4px; vertical-align: 2px; }
.badge.red { background: var(--red); color: #fff4ea; } .badge.green { background: var(--ok); color: #f3f8ea; } .badge.ochre { background: var(--ochre); color: #2b2622; }
table.t { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
table.t th { text-align: right; font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); padding: 3px 3px; border-bottom: 1px solid var(--rule); }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { text-align: right; padding: 3px 3px; border-bottom: 1px dotted var(--rule); }
table.t tr.hl td { background: #f7e1d2; }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; border: 1px solid rgba(0,0,0,.25); vertical-align: 0; }
.bar { height: 6px; background: var(--paper3); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); }
.list { display: flex; flex-direction: column; gap: 5px; }
.item { border: 1px solid var(--rule); border-radius: 7px; padding: 6px 8px; background: var(--paper2); font-size: 12.5px; cursor: pointer; }
.item:hover { border-color: var(--ink2); }
.item .sub { color: var(--ink2); font-size: 12px; }
.why { font-size: 12.5px; }
.why div { padding: 2px 0 2px 0; border-left: 1px solid var(--rule); padding-left: 8px; margin: 1px 0; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 28px; min-height: 26px; border: 1px solid var(--ink2); border-radius: 5px; background: var(--paper); cursor: pointer; }
.goal { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dotted var(--rule); }
.goal .tick { width: 18px; height: 18px; border: 1.5px solid var(--ink2); border-radius: 4px; flex: none; margin-top: 1px; }
.goal.done .tick { background: var(--ok); border-color: var(--ok); }
.goal .pr { margin-left: auto; font: 12px var(--mono); color: var(--ink2); white-space: nowrap; }
.hint { font-size: 12.5px; color: var(--ink2); padding-left: 10px; border-left: 2px solid var(--ochre); margin: 6px 0; }
.small-note { font-size: 12px; color: var(--ink2); }

/* ---------- confirm, toast, overlays ---------- */
.confirm { position: fixed; left: 50%; transform: translateX(-50%); bottom: 60px; display: flex; gap: 8px; align-items: center; background: var(--paper); border: 1px solid var(--ink2); border-radius: 10px; padding: 8px; box-shadow: var(--shadow); z-index: 25; }
#confirmText { font: 600 13px var(--sans); padding: 0 6px; }
#toast { position: fixed; left: 50%; top: calc(var(--top) + 14px); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font: 500 13.5px var(--sans); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 40; max-width: 90vw; }
#toast.show { opacity: .94; }
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
#menu { background: linear-gradient(rgba(30,40,40,.35), rgba(30,40,40,.15)); }
.menuCard { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 22px 24px 16px; box-shadow: 0 18px 60px rgba(20,16,12,.45); }
.menuCard h1 { font: 800 46px/1 var(--serif); letter-spacing: .08em; margin: 0 0 6px; color: var(--terra2); }
.menuCard .sub { margin: 0 0 14px; color: var(--ink2); font-size: 15px; }
.menuCard .fine { font: 11.5px var(--mono); color: var(--ink2); margin: 14px 0 0; }
.mbtn { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; border: 1px solid var(--ink2); border-radius: 9px; background: var(--paper2); cursor: pointer; min-height: 48px; }
.mbtn:hover { background: #fbf6ea; }
.mbtn b { font: 600 16px var(--serif); }
.mbtn span { font-size: 12.5px; color: var(--ink2); }
.mbtn .done { color: var(--ok); font: 600 12px var(--mono); }
.modalCard { position: relative; width: min(860px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 20px; box-shadow: 0 18px 60px rgba(20,16,12,.45); }
#modal { background: rgba(20,24,24,.45); }
#modalClose { position: absolute; right: 10px; top: 10px; }
.modalCard h2 { font: 600 24px var(--serif); margin: 0 0 6px; padding-right: 60px; }
.pass { color: var(--ok); font-weight: 600; } .fail { color: var(--red); font-weight: 600; }
.prog { height: 8px; background: var(--paper3); border-radius: 4px; overflow: hidden; margin: 10px 0; } .prog i { display: block; height: 100%; background: var(--terra); width: 0; transition: width .15s; }
input[type=number], input[type=text] { font: 13px var(--mono); padding: 5px 7px; border: 1px solid var(--ink2); border-radius: 5px; background: #fffaf0; width: 110px; }
.scene #top, .scene #tools, .scene #panel, .scene #overlaySeg, .scene #palette { display: none !important; }

/* ---------- narrow screens: bottom tool rail and sheet panel ---------- */
@media (max-width: 760px) {
  :root { --top: 46px; }
  #top { gap: 6px; padding: 0 6px; }
  .brand, #wx, #pop, #pwr, #tide { display: none; }
  .clockbox { font-size: 12px; white-space: nowrap; }
  .stats { gap: 6px; font-size: 12px; margin-left: auto; }
  #speed button { min-width: 28px; padding: 3px 4px; font-size: 11px; min-height: 30px; }
  #speed button[data-sp="5"] { display: none; }
  #alertBtn { padding: 2px 7px; }
  #menuBtn { padding: 4px 6px; }
  #overlaySeg { display: none; }
  #tools { left: 0; right: 0; top: auto; bottom: 0; flex-direction: row; overflow-x: auto; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--rule); gap: 6px; }
  .tool { flex: none; width: 56px; min-height: 52px; }
  #palette { left: 8px; right: 8px; width: auto; top: auto; bottom: 74px; max-height: 50vh; }
  #panel { left: 0; right: 0; top: auto; bottom: 66px; width: auto; height: 56vh; border-radius: 12px 12px 0 0; }
  #panel.collapsed { transform: translateY(calc(100% + 70px)); }
  .confirm { bottom: 76px; }
  .kv { grid-template-columns: 96px 1fr; }
}
</style>
</head>
<body>
<canvas id="view" aria-label="Tidemark city view"></canvas>

<header id="top">
  <div class="brand"><span class="mark">TIDEMARK</span><span id="scenName"></span></div>
  <div class="clockbox">
    <span id="clock">Day 1 06:00</span>
    <canvas id="tide" width="132" height="30" title="Tide: level against the canal (dashed)"></canvas>
    <span id="wx" title="Weather"></span>
  </div>
  <div id="speed" class="seg" role="group" aria-label="Simulation speed"></div>
  <div class="stats">
    <span id="money" title="Treasury"></span>
    <span id="pop" title="Residents and jobs"></span>
    <span id="pwr" title="Electricity: supply / demand"></span>
    <button id="alertBtn" class="chip" title="Alerts"></button>
  </div>
  <button id="menuBtn" class="btn ghost" title="Menu (Esc)">Menu</button>
</header>

<nav id="tools" aria-label="Tools"></nav>
<div id="palette" class="sheet" hidden></div>
<div id="overlaySeg" class="seg small" role="group" aria-label="Map overlay"></div>

<aside id="panel" class="collapsed">
  <div id="tabs" class="tabs" role="tablist"></div>
  <div id="panelBody"></div>
</aside>

<div id="confirmBar" class="confirm" hidden>
  <span id="confirmText"></span>
  <button id="cfRotate" class="btn">Rotate</button>
  <button id="cfCancel" class="btn">Cancel</button>
  <button id="cfOk" class="btn primary">Build</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="menu" class="overlay">
  <div class="menuCard">
    <h1>Tidemark</h1>
    <p class="sub">A harbour town that has to work. Every loaf, plank and lump of coal is real: it sits in a building, a yard, or a vehicle, and it only moves when something carries it.</p>
    <div id="menuBody"></div>
    <p class="fine">Simulation: seeded, integer, replayable. Graphics settings never touch it.</p>
  </div>
</div>
<div id="modal" class="overlay" hidden><div class="modalCard"><button id="modalClose" class="btn ghost small">Close</button><div id="modalBody"></div></div></div>
<input id="fileIn" type="file" accept=".json,.tidemark,application/json" hidden>
<script>/* ==== 10_core.js ==== */
'use strict';
/* =====================================================================
   TIDEMARK :: simulation core
   Constants, definitions, seeded RNG, hashing, tide tables.
   Everything in the simulation layer is integer arithmetic and never
   touches the DOM, Date or Math.random, so a snapshot plus the action
   log reproduces the same future on any machine.
   ===================================================================== */

const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];   // N E S W
const DIRN = ['N', 'E', 'S', 'W'];
const opp = d => (d + 2) & 3;
const TPH = 100, TPD = 2400;                    // ticks per hour, per day
const CANAL_LVL = 100;                          // impounded canal water level
const LEVEL_TOL = 6;                            // lock "level" tolerance

const T_LAND = 0, T_SEA = 1, T_CANAL = 2, T_LOCK = 3;
const D_NONE = 0, D_COAL = 1, D_ORE = 2, D_CLAY = 3, D_FERTILE = 4;

const RES = [
  ['grain', 'Grain', '#d8b24c', 2], ['flour', 'Flour', '#ece2c6', 4], ['bread', 'Bread', '#b8762e', 6],
  ['logs', 'Logs', '#7a5232', 2], ['planks', 'Planks', '#cfa66b', 5], ['furniture', 'Furniture', '#7b3b2a', 22],
  ['coal', 'Coal', '#2d2b29', 3], ['ore', 'Iron ore', '#94503a', 3], ['steel', 'Steel', '#8d979c', 14],
  ['tools', 'Tools', '#41505a', 30], ['clay', 'Clay', '#c47c4b', 1], ['bricks', 'Bricks', '#a3412c', 4],
].map((a, i) => ({ i, id: a[0], name: a[1], col: a[2], price: a[3] }));
const NR = RES.length;
const R = {}; RES.forEach(r => { R[r.id] = r.i; });
const zr = () => new Array(NR).fill(0);

/* Building definitions.
   inp/out: [[res, qty]] per cycle. dur: ticks per cycle at full staff.
   pw: power demand (MW). gen: generation. cap: storage. node: transfer mode. */
const BT = {
  house:      { name: 'House', w: 1, h: 1, cost: 60, cat: 'home', jobs: 0, bays: 1 },
  market:     { name: 'Market hall', w: 2, h: 2, cost: 300, cat: 'home', jobs: 4, pw: 1, bays: 2, range: 14 },
  farm:       { name: 'Farm', w: 2, h: 2, cost: 250, cat: 'extract', jobs: 8, out: [[R.grain, 2]], dur: 120, ext: 'fertile', tools: 1, bays: 2 },
  forester:   { name: 'Forester', w: 1, h: 1, cost: 150, cat: 'extract', jobs: 4, out: [[R.logs, 1]], dur: 60, ext: 'trees', tools: 1, bays: 1 },
  claypit:    { name: 'Clay pit', w: 2, h: 2, cost: 200, cat: 'extract', jobs: 6, out: [[R.clay, 2]], dur: 90, ext: D_CLAY, tools: 1, bays: 2 },
  coalmine:   { name: 'Coal mine', w: 2, h: 2, cost: 400, cat: 'extract', jobs: 12, out: [[R.coal, 2]], dur: 80, ext: D_COAL, tools: 1, bays: 2 },
  oremine:    { name: 'Iron mine', w: 2, h: 2, cost: 400, cat: 'extract', jobs: 12, out: [[R.ore, 2]], dur: 90, ext: D_ORE, tools: 1, bays: 2 },
  mill:       { name: 'Roller mill', w: 2, h: 1, cost: 350, cat: 'industry', jobs: 6, pw: 4, inp: [[R.grain, 2]], out: [[R.flour, 2]], dur: 50, bays: 2 },
  bakery:     { name: 'Bakery', w: 2, h: 1, cost: 300, cat: 'industry', jobs: 6, pw: 2, inp: [[R.flour, 1]], out: [[R.bread, 4]], dur: 40, bays: 2 },
  sawmill:    { name: 'Sawmill', w: 2, h: 2, cost: 400, cat: 'industry', jobs: 8, pw: 5, inp: [[R.logs, 2]], out: [[R.planks, 3]], dur: 70, bays: 2 },
  joinery:    { name: 'Joinery', w: 2, h: 1, cost: 350, cat: 'industry', jobs: 6, pw: 3, inp: [[R.planks, 3]], out: [[R.furniture, 1]], dur: 110, bays: 2 },
  brickworks: { name: 'Brickworks', w: 2, h: 2, cost: 450, cat: 'industry', jobs: 8, pw: 2, inp: [[R.clay, 2], [R.coal, 1]], out: [[R.bricks, 4]], dur: 100, bays: 2 },
  steelworks: { name: 'Steelworks', w: 3, h: 2, cost: 800, cat: 'industry', jobs: 16, pw: 8, inp: [[R.ore, 2], [R.coal, 1]], out: [[R.steel, 1]], dur: 80, bays: 3 },
  toolworks:  { name: 'Toolworks', w: 2, h: 2, cost: 600, cat: 'industry', jobs: 10, pw: 6, inp: [[R.steel, 1]], out: [[R.tools, 2]], dur: 100, bays: 2 },
  powerplant: { name: 'Coal power station', w: 2, h: 2, cost: 900, cat: 'power', jobs: 8, gen: 120, fuel: R.coal, bays: 2 },
  tidemill:   { name: 'Tide mill', w: 1, h: 1, cost: 300, cat: 'power', jobs: 0, gen: 24, tidal: 1 },
  warehouse:  { name: 'Warehouse', w: 2, h: 2, cost: 300, cat: 'logistics', jobs: 4, cap: 240, bays: 3, store: 1 },
  depot:      { name: 'Truck depot', w: 2, h: 1, cost: 200, cat: 'logistics', jobs: 4 },
  station:    { name: 'Rail station', w: 3, h: 1, cost: 400, cat: 'logistics', jobs: 6, cap: 160, node: 'rail', bays: 2, store: 1 },
  station2:   { name: 'Twin-platform station', w: 3, h: 2, cost: 700, cat: 'logistics', jobs: 8, cap: 240, node: 'rail', bays: 3, store: 1 },
  quay:       { name: 'Harbour quay', w: 3, h: 2, cost: 1200, cat: 'logistics', jobs: 12, cap: 400, node: 'water', wt: T_SEA, bays: 3, store: 1 },
  wharf:      { name: 'Canal wharf', w: 2, h: 1, cost: 350, cat: 'logistics', jobs: 6, cap: 120, node: 'water', wt: T_CANAL, bays: 2, store: 1 },
  lighthouse: { name: 'Lighthouse', w: 1, h: 1, cost: 0, cat: 'deco', jobs: 0 },
};
for (const k in BT) BT[k].id = k;
const HCAP = [0, 6, 14, 24];                 // residents per house level
const HPOW = [0, 1, 2, 3];                   // MW per house level (x1.5 in the evening)
const MEAL = 2 * TPD;                        // resident-ticks per loaf: one loaf feeds a resident for two days
const TAX = [0, 3, 5, 8];                    // credits per resident per day
const WORK_PCT = 45;                         // share of residents in the labour force
const BURN = 9600;                           // MW-ticks per unit of coal

/* ---------------- seeded RNG (sfc32), state kept in S.rng ---------------- */
function seedRng(seed) {
  let s = seed >>> 0;
  const sm = () => { s = (s + 0x9E3779B9) >>> 0; let z = s; z = Math.imul(z ^ (z >>> 16), 0x85EBCA6B) >>> 0; z = Math.imul(z ^ (z >>> 13), 0xC2B2AE35) >>> 0; return (z ^ (z >>> 16)) >>> 0; };
  return [sm(), sm(), sm(), sm()];
}
function rngNext(S) {
  const st = S.rng;
  let a = st[0] | 0, b = st[1] | 0, c = st[2] | 0, d = st[3] | 0;
  let t = (a + b) | 0;
  a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); d = (d + 1) | 0;
  t = (t + d) | 0; c = (c + t) | 0;

  return t >>> 0;
}
const rngInt = (S, n) => rngNext(S) % n;

/* A small standalone generator for map building (same algorithm). */
function makeGen(seed) { const S = { rng: seedRng(seed) }; return { int: n => rngNext(S) % n, u: () => rngNext(S) }; }

/* ---------------- hashing ---------------- */
function hmix(h, v) { h = Math.imul((h ^ (v | 0)) >>> 0, 0x9E3779B1) >>> 0; return (h ^ (h >>> 15)) >>> 0; }

/* Record an agent decision: folds into a rolling hash and a short log. */
const DEC = ['', 'consign', 'truck', 'train', 'barge', 'signal', 'lockAdmit', 'lockCycle', 'reroute', 'divert',
  'cancel', 'wreck', 'freighter', 'labour', 'power', 'deliver', 'upgrade', 'strand', 'reloc', 'lost', 'berth', 'export'];
function dec(S, code, a, b, c) {
  let h = S.dec.h;
  h = hmix(h, code); h = hmix(h, a); h = hmix(h, b); h = hmix(h, c); h = hmix(h, S.tick);
  S.dec.h = h; S.dec.n++;
  const L = S.dec.log; L.push([S.tick, code, a | 0, b | 0, c | 0]); if (L.length > 400) L.shift();
}

/* ---------------- tide and clock ---------------- */
const SIN = new Int16Array(256);
for (let i = 0; i < 256; i++) SIN[i] = Math.round(Math.sin(i * Math.PI * 2 / 256) * 1000);
const TIDE_P = 1240;                 // ~12.4 h semidiurnal period
const SPRING_P = TPD * 14;           // spring/neap cycle
function tideAt(t) {
  const sp = Math.floor((t % SPRING_P) * 256 / SPRING_P);
  const amp = 42 + Math.floor(8 * SIN[sp] / 1000);
  const ph = Math.floor((t % TIDE_P) * 256 / TIDE_P);
  return 70 + Math.floor(amp * SIN[ph] / 1000);
}
function tideFlow(t) {               // -1000..1000, signed tidal current
  const ph = Math.floor((t % TIDE_P) * 256 / TIDE_P);
  return SIN[(ph + 64) & 255];
}
function clockStr(t) {
  const d = Math.floor(t / TPD) + 1, h = Math.floor((t % TPD) / TPH), m = Math.floor((t % TPH) * 60 / TPH);
  return 'Day ' + d + ' ' + (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}
const hourOf = t => Math.floor((t % TPD) / TPH);

/* ---------------- tiny helpers ---------------- */
const tIdx = (S, x, y) => y * S.W + x;
const inb = (S, x, y) => x >= 0 && y >= 0 && x < S.W && y < S.H;
function nb(S, t, d) { const x = t % S.W + DX[d], y = (t / S.W | 0) + DY[d]; return inb(S, x, y) ? y * S.W + x : -1; }
function dirTo(S, a, b) {
  const W = S.W; const dx = (b % W) - (a % W), dy = ((b / W) | 0) - ((a / W) | 0);

  if (dy === 1 && dx === 0) return 2; if (dy === -1 && dx === 0) return 0; return -1;
}
const isWater = v => v === T_SEA || v === T_CANAL || v === T_LOCK;
const sumArr = a => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; };
function resName(r) { return RES[r] ? RES[r].name : '?'; }
function xy(S, t) { return '(' + (t % S.W) + ',' + ((t / S.W) | 0) + ')'; }

/* =====================================================================

function newSim(seed, W, H) {
  const N = W * H;
  return {
    v: 1, seed: seed >>> 0, tick: 0, W, H, rng: seedRng(seed ^ 0x51DE),
    ter: new Uint8Array(N), dep: new Uint8Array(N), tree: new Uint8Array(N),
    road: new Uint8Array(N), rail: new Uint8Array(N), sig: new Uint8Array(N), pow: new Uint8Array(N),
    bld: new Int32Array(N),
    blds: [], vehs: [], cons: [], locks: [], wrecks: [],
    nb: 1, nv: 1, nc: 1, nl: 1,
    led: { start: zr(), ext: zr(), imp: zr(), prod: zr(), use: zr(), exp: zr(), lost: zr() },
    delivered: zr(), lossLog: [], hist: [],
    money: 6000, mled: { tax: 0, exp: 0, imp: 0, build: 0, upkeep: 0, refund: 0 },
    trade: { imp: zr(), exp: zr(), next: 400, every: 1000 },
    wx: { k: W_CLEAR, until: 900 },
    ver: { road: 1, rail: 1, water: 1, power: 1 },
    dirty: { road: 0, rail: 0, water: 0 },
    dec: { h: 2166136261, n: 0, log: [] },

}

/* ---------------- money ---------------- */
function canPay(S, c) { return S.flags.inf || S.money >= c; }
function pay(S, c, cat) { if (S.flags.inf) return; S.money -= c; S.mled[cat] = (S.mled[cat] || 0) + c; }
function earn(S, c, cat) { S.money += c; S.mled[cat] = (S.mled[cat] || 0) + c; }

/* ---------------- building helpers ---------------- */
function bById(S, id) {
  // blds is kept sorted by id; binary search
  const a = S.blds; let lo = 0, hi = a.length - 1;
  while (lo <= hi) { const m = (lo + hi) >> 1, v = a[m].id; if (v === id) return a[m]; if (v < id) lo = m + 1; else hi = m - 1; }
  return null;
}

  while (lo <= hi) { const m = (lo + hi) >> 1, v = a[m].id; if (v === id) return a[m]; if (v < id) lo = m + 1; else hi = m - 1; }
  return null;
}
function cById(S, id) {
  const a = S.cons; let lo = 0, hi = a.length - 1;
  while (lo <= hi) { const m = (lo + hi) >> 1, v = a[m].id; if (v === id) return a[m]; if (v < id) lo = m + 1; else hi = m - 1; }
  return null;
}

  return out;
}

  for (let y = b.y; y < b.y + b.h; y++) if (b.x + b.w < S.W) out.push(y * W + b.x + b.w);
  for (let x = b.x + b.w - 1; x >= b.x; x--) if (b.y + b.h < S.H) out.push((b.y + b.h) * W + x);

}
const isStore = b => !!BT[b.type].store;
const isNode = b => !!BT[b.type].node;
function outCap(def, r) { for (const [rr, n] of def.out || []) if (rr === r) return Math.max(20, n * 8); return 0; }
function inTarget(b, r) {
  const def = BT[b.type];

/* ---------------- placement validation ---------------- */
function canPlace(S, type, x, y, rot) {
  const def = BT[type]; if (!def) return { ok: false, why: 'Unknown building' };
  const [w, h] = footprint(def, rot);
  if (x < 0 || y < 0 || x + w > S.W || y + h > S.H) return { ok: false, why: 'Outside the map' };
  const isSt = def.node === 'rail';
  let depCount = 0;
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) {
    const t = yy * S.W + xx;
    if (S.ter[t] !== T_LAND) return { ok: false, why: 'Needs dry land' };
    if (S.bld[t]) return { ok: false, why: 'Occupied by a building' };
    if (S.road[t]) return { ok: false, why: 'Road in the way' };
    if (S.rail[t]) {
      if (!isSt) return { ok: false, why: 'Railway in the way' };
      const ax = (rot & 1) ? 5 : 10; // N|S or E|W
      if ((S.rail[t] | ax) !== ax || S.sig[t]) return { ok: false, why: 'Station must sit on straight track along its length' };
    }
    if (typeof def.ext === 'number' && S.dep[t] === def.ext) depCount++;
  }
  if (typeof def.ext === 'number' && depCount < 2) return { ok: false, why: 'Needs at least 2 ' + ['', 'coal', 'iron ore', 'clay'][def.ext] + ' deposit tiles' };

  const ring = bRing(S, fake);
  if (def.node === 'water') {
    let berths = 0; for (const t of ring) if (S.ter[t] === def.wt) berths++;
    if (berths < 1) return { ok: false, why: def.wt === T_SEA ? 'Must touch the sea' : 'Must touch a canal' };
  }
  if (def.tidal) { let ok = false; for (const t of ring) if (S.ter[t] === T_SEA) ok = true; if (!ok) return { ok: false, why: 'Must touch tidal water' }; }

}

function placeBuilding(S, type, x, y, rot, free) {
  const c = canPlace(S, type, x, y, rot); if (!c.ok) return c;
  const def = BT[type];
  if (!free && !canPay(S, def.cost)) return { ok: false, why: 'Not enough money' };
  if (!free) pay(S, def.cost, 'build');
  const [w, h] = footprint(def, rot);
  const b = {
    id: S.nb++, type, x, y, w, h, rot, inv: zr(), out: zr(), rsv: zr(),
    wk: 0, pwOn: 0, prog: 0, cyc: 0, st: 0, bays: [], yard: [], t0: S.tick,
  };
  if (type === 'house') { b.lvl = 1; b.res = 0; b.needAcc = 0; b.missed = 0; b.growAcc = 0; b.furnAcc = 0; b.disc = 0; b.jobsOk = 0; b.var = (x * 7 + y * 13) % 5; }
  if (def.store) { b.want = zr(); }
  if (def.node) { b.tr = []; b.moor = []; }
  if (type === 'quay') b.exp = zr();
  if (def.gen) { b.load = 0; b.burn = 0; }
  if (type === 'market') b.served = 0;
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) {
    const t = yy * S.W + xx;
    S.bld[t] = b.id; S.tree[t] = 0; S.pow[t] = 0;
    if (def.node === 'rail') {
      const ax = (rot & 1) ? 5 : 10; S.rail[t] = ax;

  else if (def.ext === 'trees') b.ext = 0;

function bumpVer(S, k) { S.ver[k]++; if (k in S.dirty) S.dirty[k] = 1; }

/* ---------------- infrastructure ---------------- */
function roadOk(S, t) {
  if (S.bld[t] || S.ter[t] === T_LOCK) return false;
  if (S.rail[t] && S.rail[t] !== 5 && S.rail[t] !== 10) return false;
  if (S.rail[t] && S.sig[t]) return false;
  return true;
}
function buildRoad(S, tiles) {
  let cost = 0; const todo = [];
  for (const t of tiles) { if (t < 0 || S.road[t]) continue; if (!roadOk(S, t)) continue; todo.push(t); cost += isWater(S.ter[t]) ? COST.roadBridge : COST.road; }
  if (!todo.length) return { ok: false, why: 'Nothing to build here' };
  if (!canPay(S, cost)) return { ok: false, why: 'Not enough money (' + cost + ')' };
  pay(S, cost, 'build');
  for (const t of todo) { S.road[t] = 1; S.tree[t] = 0; }
  bumpVer(S, 'road'); if (todo.some(t => isWater(S.ter[t]))) bumpVer(S, 'water');
  return { ok: true, n: todo.length, cost };
}
function railOkTile(S, t) {
  if (S.bld[t]) { const b = bById(S, S.bld[t]); return b && BT[b.type].node === 'rail'; }
  if (S.ter[t] === T_LOCK) return false;
  return true;
}
/* Rail is laid along a path; consecutive tiles get reciprocal connection bits. */
function buildRail(S, path) {
  let cost = 0; const links = [];
  for (let i = 0; i < path.length; i++) {
    const t = path[i]; if (t < 0 || !railOkTile(S, t)) return { ok: false, why: 'Blocked at ' + xy(S, t) };
    if (!S.rail[t]) cost += isWater(S.ter[t]) ? COST.railBridge : COST.rail;
    if (i > 0) { const d = dirTo(S, path[i - 1], t); if (d < 0) return { ok: false, why: 'Path not contiguous' }; links.push([path[i - 1], t, d]); }
  }

  const nm = new Map();
  const get = t => nm.has(t) ? nm.get(t) : S.rail[t];
  for (const [a, b, d] of links) { nm.set(a, get(a) | (1 << d)); nm.set(b, get(b) | (1 << opp(d))); }

    if (S.sig[t] && m !== 5 && m !== 10) return { ok: false, why: 'Remove the signal before branching here' };
  }
  if (!nm.size) return { ok: false, why: 'Drag across tiles to lay track' };
  if (!canPay(S, cost)) return { ok: false, why: 'Not enough money (' + cost + ')' };

  for (const [t, m] of nm) { S.rail[t] = m; S.tree[t] = 0; }

function setSignal(S, t, d) {

  if (S.bld[t]) return { ok: false, why: 'Not inside a station' };
  if (S.road[t]) return { ok: false, why: 'Not on a level crossing' };
  const m = S.rail[t];
  if (d < 0) { if (!S.sig[t]) return { ok: false, why: 'No signal' }; S.sig[t] = 0; bumpVer(S, 'rail'); return { ok: true }; }
  if (!(m === 5 && (d === 0 || d === 2)) && !(m === 10 && (d === 1 || d === 3))) return { ok: false, why: 'Signals need straight track in that direction' };

function canalOk(S, t) {

  if (!todo.length) return { ok: false, why: 'Canals need open land, and cannot touch the tidal sea except through a lock' };
  if (!canPay(S, cost)) return { ok: false, why: 'Not enough money (' + cost + ')' };

  if (!todo.length) return { ok: false, why: 'Power lines go on dry land' };

/* ---------------- demolition ---------------- */
/* Returns a list of what happened, for the event log. */
function bulldozeTile(S, t, rep) {
  if (t < 0) return false;
  if (S.bld[t]) { const b = bById(S, S.bld[t]); if (b && b.type !== 'lighthouse') { demolishBuilding(S, b, rep); return true; } }
  if (S.sig[t]) { S.sig[t] = 0; bumpVer(S, 'rail'); rep.push('Removed signal ' + xy(S, t)); return true; }
  if (S.rail[t]) {
    const m = S.rail[t];
    for (let d = 0; d < 4; d++) if (m & (1 << d)) { const n = nb(S, t, d); if (n >= 0) S.rail[n] &= ~(1 << opp(d)); }
    S.rail[t] = 0;
    railRemoved(S, [t], rep);
    bumpVer(S, 'rail'); if (isWater(S.ter[t])) bumpVer(S, 'water');
    rep.push((isWater(S.ter[t]) ? 'Demolished railway bridge ' : 'Removed track ') + xy(S, t));
    return true;
  }
  if (S.road[t]) {
    S.road[t] = 0; roadRemoved(S, [t], rep);
    bumpVer(S, 'road'); if (isWater(S.ter[t])) bumpVer(S, 'water');
    rep.push((isWater(S.ter[t]) ? 'Demolished road bridge ' : 'Removed road ') + xy(S, t));
    return true;
  }
  if (S.pow[t]) { S.pow[t] = 0; bumpVer(S, 'power'); rep.push('Removed power line ' + xy(S, t)); return true; }
  if (S.ter[t] === T_CANAL || S.ter[t] === T_LOCK) {
    for (const v of S.vehs) if ((v.k === 'barge' || v.k === 'freighter') && v.t === t) { rep.push('Cannot fill ' + xy(S, t) + ': boat in the way'); return false; }

    if (rain && b.type === 'farm') rate = Math.floor(rate * 110 / 100);
    if (rate < 1) rate = 1;
    b.st = 0;
    b.prog += rate;
    if (b.prog >= def.dur * 100) {
      b.prog -= def.dur * 100;
      if (def.inp) for (const [r, n] of def.inp) { b.inv[r] -= n; S.led.use[r] += n; }
      for (const [r, n] of def.out) { b.out[r] += n; if (def.cat === 'extract') S.led.ext[r] += n; else S.led.prod[r] += n; }
      b.cyc++; b.lp = S.tick;
      if (boost && b.cyc % 8 === 0) { b.inv[R.tools]--; S.led.use[R.tools]++; }
      if (def.ext === 'trees') harvestTree(S, b);
    }
  }
}

function forestTiles(S, b) {
  const out = [], r = 3;
  for (let y = b.y - r; y <= b.y + r; y++) for (let x = b.x - r; x <= b.x + r; x++) {
    if (!inb(S, x, y)) continue; const t = y * S.W + x;
    if (S.ter[t] === T_LAND && !S.bld[t] && !S.road[t] && !S.rail[t]) out.push(t);
  }
  return out;
}
function harvestTree(S, b) {
  const ts = forestTiles(S, b);
  for (const t of ts) if (S.tree[t] >= 2) { S.tree[t]--; break; }
  // replant one empty plot so the forest renews itself
  const k = b.cyc % 7;
  let seen = 0;
  for (const t of ts) if (S.tree[t] === 0 && S.dep[t] !== D_FERTILE) { if (seen++ >= k) { S.tree[t] = 1; break; } }
}
function stepForests(S) {
  if (S.tick % 100 === 17) {
    for (const b of S.blds) if (b.type === 'forester') {
      let m = 0; for (const t of forestTiles(S, b)) if (S.tree[t] >= 2) m++;
      b.ext = Math.min(100, m * 12);
    }
  }
  if (S.tick % 600 === 300) {
    const ph = Math.floor(S.tick / 600) % 3;
    for (let t = 0; t < S.W * S.H; t++) if (S.tree[t] > 0 && S.tree[t] < 3 && (t + ph) % 3 === 0 && !S.bld[t]) S.tree[t]++;
  }
}

/* ---------------- households ---------------- */
function houseWants(b) {        // construction materials wanted by a house now
  if (b.lvl >= 3 || !b.pwOn || b.res < HCAP[b.lvl] - 2 || b.inv[R.bread] <= 0) return null;
  return UPG[b.lvl];
}
function stepHouses(S) {
  for (const b of S.blds) {
    if (b.type !== 'house') continue;
    const acc = bAcc(S, b) >= 0;
    b.needAcc += b.res * 10;
    while (b.needAcc >= MEAL) {
      b.needAcc -= MEAL;
      if (b.inv[R.bread] > 0) { b.inv[R.bread]--; S.led.use[R.bread]++; b.missed = 0; }
      else { b.missed++; if (b.missed >= 3 && b.res > 0) { b.res--; b.missed = 0; } }
    }
    const cap = HCAP[b.lvl];
    const fed = b.inv[R.bread] > 0;
    // two pioneer residents move in without power or bread; beyond that a home needs both
    if (acc && (b.pwOn || b.res < 2) && (fed || b.res < 2) && b.res < cap && b.jobsOk) {
      b.growAcc += 10;
      if (b.growAcc >= 150) { b.growAcc = 0; b.res++; }
    }
    if (b.lvl < 3 && b.res >= cap && b.pwOn && fed) {
      const need = UPG[b.lvl];
      let ok = true; for (const [r, n] of need) if (b.inv[r] < n) ok = false;
      if (ok) { for (const [r, n] of need) { b.inv[r] -= n; S.led.use[r] += n; } b.lvl++; dec(S, 16, b.id, b.lvl, 0); }
    }
    if (b.lvl === 3) {
      b.furnAcc += 10;
      if (b.furnAcc >= 3 * TPD) {
        b.furnAcc = 0;
        if (b.inv[R.furniture] > 0) { b.inv[R.furniture]--; S.led.use[R.furniture]++; b.disc = 0; }
        else if (++b.disc >= 2) { b.lvl = 2; b.disc = 0; if (b.res > HCAP[2]) b.res = HCAP[2]; }
      }
    }
  }
}

/* Markets: residents walk in and carry goods home (internal transfer). */
function housesNear(S, m) {
  if (m._hnV === S.ver.road && m._hn) return m._hn;
  const a = bAcc(S, m), out = [];
  if (a >= 0) {
    const dm = roadDist(S, a), rng = BT.market.range;
    for (const h of S.blds) {
      if (h.type !== 'house') continue;
      const ha = bAcc(S, h); if (ha < 0 || dm[ha] < 0 || dm[ha] > rng) continue;
      out.push([dm[ha], h.id]);
    }
    out.sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  }
  m._hn = out.map(p => p[1]); m._hnV = S.ver.road; return m._hn;
}
function furnWant(h) { if (h.lvl === 2 && h.res >= HCAP[2] - 2) return 2; if (h.lvl === 3) return 2; return 0; }
function stepMarkets(S) {
  for (const m of S.blds) {
    if (m.type !== 'market') continue;
    if (m.wk < 1) { m.st = 1; continue; }
    if (!m.pwOn) { m.st = 2; continue; }
    m.st = 0; let served = 0;
    for (const hid of housesNear(S, m)) {
      const h = bById(S, hid); if (!h) continue;
      if (h.inv[R.bread] < 4 && m.inv[R.bread] > 0) {
        const n = Math.min(2, m.inv[R.bread], 4 - h.inv[R.bread]); m.inv[R.bread] -= n; h.inv[R.bread] += n; served++;
      }
      const fw = furnWant(h);
      if (h.inv[R.furniture] < fw && m.inv[R.furniture] > 0) { m.inv[R.furniture]--; h.inv[R.furniture]++; served++; }
    }
    m.served = served;
  }
}

/* ---------------- labour ---------------- */
function workPrio(b) { const t = b.type; if (t === 'powerplant') return 0; if (t === 'market' || t === 'bakery' || t === 'mill' || t === 'farm' || BT[t].node) return 1; return 2; }
/* Loading speed at staffed facilities: unstaffed yards work at a third of the pace. */
function handleMul(b) { const j = BT[b.type].jobs; if (!j || b.type === 'house') return 100; return Math.max(34, Math.floor(b.wk * 100 / j)); }
/* Road networks joined by a working rail line or a water route form one labour
   market: commuters ride the trains and ferries between the yards. */
function labourRoots(S) {
  const rn = roadNet(S), par = new Map();
  const find = k => { while (par.has(k) && par.get(k) !== k) k = par.get(k); return k; };
  const join = (a, b) => { a = find(a); b = find(b); if (a === b) return; if (a < b) par.set(b, a); else par.set(a, b); };
  const nodes = S.blds.filter(b => BT[b.type].node && bAcc(S, b) >= 0);
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j], ka = rn.rc[bAcc(S, a)], kb = rn.rc[bAcc(S, b)];
    if (ka === kb || BT[a.type].node !== BT[b.type].node) continue;
    const linked = BT[a.type].node === 'rail' ? (railStationDist(S, a, b) >= 0 || railStationDist(S, b, a) >= 0) : !!dockWaterDist(S, a, b);
    if (linked) join(ka, kb);
  }
  return k => find(k);
}
function stepLabour(S) {
  const rn = roadNet(S); const pool = new Map(), tot = new Map(), root = labourRoots(S);
  for (const b of S.blds) if (b.type === 'house') {
    const a = bAcc(S, b); if (a < 0) continue; const k = root(rn.rc[a]);
    const w = Math.floor(b.res * WORK_PCT / 100);
    pool.set(k, (pool.get(k) || 0) + w); tot.set(k, (tot.get(k) || 0) + w);
  }
  // works that sat idle (no input, or output nobody collects) hire after busy ones
  const pr = b => workPrio(b) + (BT[b.type].out && (b.st === 3 || b.st === 4) ? 3 : 0);
  const work = S.blds.filter(b => BT[b.type].jobs > 0).sort((a, b) => pr(a) - pr(b) || a.id - b.id);
  const open = new Map(); let jobs = 0, emp = 0;
  for (const b of work) {
    const j = BT[b.type].jobs; jobs += j;
    const a = bAcc(S, b); if (a < 0) { b.wk = 0; continue; }
    const k = root(rn.rc[a]), p = pool.get(k) || 0, n = Math.min(j, p);
    b.wk = n; emp += n; pool.set(k, p - n);
    if (n < j) open.set(k, (open.get(k) || 0) + j - n);
  }
  let pop = 0;
  for (const b of S.blds) if (b.type === 'house') {
    pop += b.res;
    const a = bAcc(S, b); if (a < 0) { b.jobsOk = 0; continue; }
    const k = root(rn.rc[a]), un = pool.get(k) || 0, all = tot.get(k) || 0;
    b.jobsOk = ((open.get(k) || 0) > 0 || un * 100 <= all * 20 + 600) ? 1 : 0;
  }
  let wf = 0; for (const v of tot.values()) wf += v;
  S.labour = { pop, jobs, emp, wf, unemp: wf - emp };
  let h = 0; for (const b of work) h = hmix(h, b.wk); dec(S, 13, emp, pop, h);
}

/* ---------------- electricity ---------------- */
function powNeed(S, b, eve) {
  if (b.type === 'house') return eve ? Math.ceil(HPOW[b.lvl] * 3 / 2) : HPOW[b.lvl];
  return BT[b.type].pw || 0;
}
function powPrio(b) { const t = b.type; if (t === 'market' || t === 'mill' || t === 'bakery') return 0; if (t === 'house') return 2; return 1; }
function genCap(S, p) {
  const def = BT[p.type];
  if (def.tidal) { let c = Math.floor(def.gen * Math.abs(tideFlow(S.tick)) / 1000); if (S.wx.k === W_STORM) c = Math.floor(c * 13 / 10); return c; }
  if (def.fuel !== undefined) { if (p.inv[def.fuel] <= 0 || !def.jobs) return 0; return Math.floor(def.gen * p.wk / def.jobs); }
  return 0;
}
function stepPower(S) {
  const pn = powerNet(S), comp = pn.pwComp, hr = hourOf(S.tick), eve = hr >= 18 && hr < 23;
  const groups = new Map();
  for (const b of S.blds) {
    const def = BT[b.type], k = comp[b.y * S.W + b.x];
    let g = groups.get(k); if (!g) { g = { gens: [], cons: [] }; groups.set(k, g); }
    if (def.gen) g.gens.push(b);
    if (powNeed(S, b, eve) > 0) g.cons.push(b);
  }
  const stat = []; let ph = 0;
  for (const [k, g] of groups) {
    const caps = g.gens.map(p => genCap(S, p));
    let supply = 0; for (const c of caps) supply += c;
    const cons = g.cons.slice().sort((a, b) => powPrio(a) - powPrio(b) || a.id - b.id);
    let rem = supply, dem = 0;
    for (const c of cons) { const n = powNeed(S, c, eve); dem += n; if (rem >= n) { c.pwOn = 1; rem -= n; } else c.pwOn = 0; ph = hmix(ph, c.id * 2 + c.pwOn); }
    let used = supply - rem;
    // free tidal power first, then coal plants in id order
    const order = g.gens.map((p, i) => i).sort((a, b) => (BT[g.gens[a].type].tidal ? 0 : 1) - (BT[g.gens[b].type].tidal ? 0 : 1) || g.gens[a].id - g.gens[b].id);
    for (const i of order) {
      const p = g.gens[i], take = Math.min(caps[i], used); used -= take; p.load = take; p.cap = caps[i];
      const def = BT[p.type];
      if (def.fuel !== undefined) {
        p.burn += take * 10;
        while (p.burn >= BURN && p.inv[def.fuel] > 0) { p.inv[def.fuel]--; S.led.use[def.fuel]++; p.burn -= BURN; }
        if (p.inv[def.fuel] <= 0 && p.burn > BURN) p.burn = BURN;
      }
    }
    if (g.gens.length || g.cons.length) stat.push([k, supply, dem, supply - rem]);
    if (dem > supply && g.cons.length) S.stats.lastBrown = S.tick;
  }
  S.pstat = stat;
  dec(S, 14, stat.length, ph, 0);
}

/* ---------------- trade, weather, money ---------------- */
const impPrice = r => Math.ceil(RES[r].price * 3 / 2);
function mainQuay(S) { for (const b of S.blds) if (b.type === 'quay') return b; return null; }
function stepTrade(S) {
  if (S.tick < S.trade.next) return;
  S.trade.next = S.tick + S.trade.every;
  const q = mainQuay(S); if (!q || S.gate < 0) return;
  let expWanted = 0; for (let r = 0; r < NR; r++) expWanted += S.trade.exp[r];
  let wantImp = false; for (let r = 0; r < NR; r++) if (S.trade.imp[r] > q.inv[r] - q.rsv[r]) wantImp = true;
  const hasExp = sumArr(q.exp) > 0;
  if (!wantImp && !hasExp) return;
  for (const v of S.vehs) if (v.k === 'freighter' && v.job && v.job.ph !== 'out') return; // one call at a time
  const bs = berths(S, q, 'freighter');
  if (!bs.length) { pushAlert(S, 'trade', 'The harbour quay has no berth a freighter can use (bridges or no deep water)', q.id); return; }
  const p = waterSearch(S, S.gate, new Set(bs), 'freighter', 60000);
  if (!p) { pushAlert(S, 'trade', 'Freighters cannot reach the quay from open sea (a low bridge blocks the channel?)', q.id); return; }
  const own = zr(); let tot = 0;
  for (let r = 0; r < NR; r++) {
    // standing order: top the quay up to the target stock level
    let n = Math.min(Math.max(0, S.trade.imp[r] - q.inv[r] + q.rsv[r]), VT.freighter.cap - tot);
    const pr = impPrice(r);
    if (!S.flags.inf) n = Math.min(n, Math.floor(Math.max(0, S.money) / pr));
    if (n > 0) { own[r] = n; tot += n; pay(S, n * pr, 'imp'); S.led.imp[r] += n; }
  }
  if (!tot && !hasExp && !expWanted) return;
  spawnFreighter(S, q, own);
}

function stepWeather(S) {
  if (S.tick < S.wx.until) return;
  const r = rngInt(S, 100), hr = hourOf(S.tick), cur = S.wx.k;
  let k;
  if (cur === W_STORM) k = r < 60 ? W_RAIN : W_CLOUD;
  else if (r < 38) k = W_CLEAR;
  else if (r < 64) k = W_CLOUD;
  else if (r < 80) k = W_RAIN;
  else if (r < 95) k = hr < 10 || hr > 20 ? W_FOG : W_CLOUD;
  else k = W_STORM;
  S.wx.k = k;
  S.wx.until = S.tick + (k === W_STORM ? 2 + rngInt(S, 4) : 3 + rngInt(S, 9)) * TPH;
}

function stepDaily(S) {
  let tax = 0, pop = 0;
  for (const b of S.blds) if (b.type === 'house') { tax += b.res * TAX[b.lvl]; pop += b.res; }
  earn(S, tax, 'tax');
  let up = 0; for (const v of S.vehs) up += VT[v.k].upkeep || 0;
  if (!S.flags.inf) { S.money -= up; S.mled.upkeep += up; }
  const day = { d: Math.floor(S.tick / TPD), pop, money: S.money, del: S.delivered.slice(), tax };
  S.stats.day.push(day); if (S.stats.day.length > 60) S.stats.day.shift();
}

function pushAlert(S, kind, text, ref) {
  for (const a of S.alerts) if (a.kind === kind && a.text === text) { a.t = S.tick; return; }
  S.alerts.push({ kind, text, ref: ref | 0, t: S.tick });
  if (S.alerts.length > 30) S.alerts.shift();
}

/* ==== 50_logi.js ==== */
/* =====================================================================
   Logistics: consignments, multi-modal routing, dispatch.

   A consignment is a fixed parcel (one resource, q units) from an origin
   building to a destination building, routed over legs:
     ['road', a, b] truck from building a to building b
     ['rail', a, b] train from station a to station b
     ['water', a, b] barge from dock a to dock b
   States: 'wait' units still inside origin stock (reserved there)
           'ride' units inside a vehicle (con.veh)
           'xfer' units in a transfer yard (con.at = station/dock id)
   A unit is therefore always in exactly one container.
   ===================================================================== */

const HAND = 8, WATER_K = 3, LOCK_K = 25, RAIL_K = 35;   // cost model: road 1/tile, rail .35/tile, water .3/tile
const LEG_LABEL = { road: 'Truck', rail: 'Train', water: 'Barge' };

function nodesOf(S) { return S.blds.filter(isNode); }
function trucksPerRc(S) {
  const m = new Map();
  for (const v of S.vehs) if (v.k === 'truck' && v.st !== 'stranded') { const k = rcOf(S, truckTile(S, v)); if (k >= 0) m.set(k, (m.get(k) || 0) + 1); }
  return m;
}
function trainsPerComp(S) {
  const m = new Map();
  for (const v of S.vehs) if (v.k === 'train' && v.st !== 'derail') { const k = railCompOf(S, v.tiles[0]); m.set(k, (m.get(k) || 0) + 1); }
  return m;
}
function bargesPerComp(S) {
  const m = new Map();
  for (const v of S.vehs) if (v.k === 'barge') { const k = waterCompOf(S, v.t); m.set(k, (m.get(k) || 0) + 1); }
  return m;
}
function nodeFree(S, n) { return BT[n.type].cap - storeUsed(S, n) - (n._book || 0); }

/* Ledger of what is booked to pass through each transfer node, and the
   quantity in each yard; recomputed from consignments (pure). */
function refreshBookings(S) {
  for (const b of S.blds) { if (b.tr) b._book = 0; }
  for (const c of S.cons) {
    for (let i = c.li; i < c.legs.length; i++) {
      const L = c.legs[i], dst = bById(S, L[2]);
      if (dst && dst.tr && dst.id !== c.d && !(c.st === 'xfer' && c.at === dst.id)) dst._book += c.q;
    }
  }
}

/* Reverse Dijkstra over transfer nodes toward destination 'dest'.
   cost[nodeId] = cheapest cost from that node to dest, nx[nodeId] = [mode, nextId]. */
function routeTable(S, dest, q) {
  const dAcc = bAcc(S, dest); if (dAcc < 0) return null;
  refreshBookings(S);
  const drc = rcOf(S, dAcc), tp = trucksPerRc(S);
  const ns = nodesOf(S).filter(n => n.id === dest.id || nodeFree(S, n) >= q);
  const cost = new Map(), nx = new Map(), done = new Set();
  if (dest.tr) { cost.set(dest.id, 0); nx.set(dest.id, null); }
  if (tp.get(drc) > 0) for (const n of ns) {
    if (n.id === dest.id) continue;
    const a = bAcc(S, n); if (a < 0 || rcOf(S, a) !== drc) continue;
    const d = roadDist(S, dAcc)[a]; if (d < 0) continue;
    const c = d + HAND; if (!cost.has(n.id) || c < cost.get(n.id)) { cost.set(n.id, c); nx.set(n.id, ['road', dest.id]); }
  }
  const trains = trainsPerComp(S), barges = bargesPerComp(S);
  for (;;) {
    let best = null, bc = 0;
    for (const n of ns) { if (done.has(n.id) || !cost.has(n.id)) continue; const c = cost.get(n.id); if (!best || c < bc) { best = n; bc = c; } }
    if (!best) break;
    done.add(best.id);
    for (const m of ns) {
      if (done.has(m.id) || m.id === best.id) continue;
      let c = -1, mode = '';
      const mdef = BT[m.type], bdef = BT[best.type];
      if (mdef.node === 'rail' && bdef.node === 'rail') {
        const comp = railCompOf(S, m.y * S.W + m.x);
        if (comp >= 0 && comp === railCompOf(S, best.y * S.W + best.x) && trains.get(comp) > 0) {
          const d = railStationDist(S, m, best); if (d >= 0) { c = Math.floor(d * RAIL_K / 1000) + HAND; mode = 'rail'; }
        }
      }
      if (mdef.node === 'water' && bdef.node === 'water') {
        const bm = berths(S, m, 'barge'), bb = berths(S, best, 'barge');
        if (bm.length && bb.length) {
          const comp = waterCompOf(S, bm[0]);
          if (comp >= 0 && comp === waterCompOf(S, bb[0]) && barges.get(comp) > 0) {
            const w = dockWaterDist(S, m, best); if (w) { const v = Math.floor((w.cost - w.locks * 60) * WATER_K / 100) + w.locks * LOCK_K + HAND; if (c < 0 || v < c) { c = v; mode = 'water'; } }
          }
        }
      }
      const ma = bAcc(S, m), ba = bAcc(S, best);
      if (ma >= 0 && ba >= 0 && rcOf(S, ma) === rcOf(S, ba) && tp.get(rcOf(S, ma)) > 0) {
        const d = roadDist(S, ba)[ma]; if (d >= 0 && (c < 0 || d + HAND < c)) { c = d + HAND; mode = 'road'; }
      }
      if (c < 0) continue;
      const tot = bc + c;

}
/* Best route for goods currently at building 'src' (or at road tile fromTile
   when src is null, e.g. a truck that must re-plan) to rt.dest. */
function routeFrom(S, rt, src, fromTile) {
  let best = null;
  const consider = (c, legs) => { if (!best || c < best.c) best = { c, legs }; };
  const follow = (nid) => { const legs = []; let id = nid; let guard = 0; while (id !== rt.dest.id && guard++ < 40) { const h = rt.nx.get(id); if (!h) return null; legs.push([h[0], id, h[1]]); id = h[1]; } return legs; };
  if (src && rt.cost.has(src.id)) { const L = follow(src.id); if (L) consider(rt.cost.get(src.id), L); }
  const a = src ? bAcc(S, src) : fromTile;
  if (a >= 0) {
    const arc = rcOf(S, a);
    if (rt.tp.get(arc) > 0) {
      if (arc === rt.drc && (!src || src.id !== rt.dest.id)) { const d = roadDist(S, rt.dAcc)[a]; if (d >= 0) consider(d, [['road', src ? src.id : 0, rt.dest.id]]); }
      for (const [nid, c0] of rt.cost) {
        if (src && nid === src.id) continue;
        const n = bById(S, nid); const na = bAcc(S, n); if (na < 0 || rcOf(S, na) !== arc) continue;
        const d = roadDist(S, na)[a]; if (d < 0) continue;
        const L = follow(nid); if (!L) continue;
        if (nid === rt.dest.id) consider(d + HAND, [['road', src ? src.id : 0, nid]]);
        else consider(d + HAND + c0, [['road', src ? src.id : 0, nid]].concat(L));
      }
    }
  }
  return best;
}

/* ---------------- supply and demand ---------------- */
function avail(b, r) {
  const def = BT[b.type];

function stepDispatch(S) {

/* ---------------- freighters ---------------- */
function freighterTimer(S, v) {
  const q = bById(S, v.job.q);

  if (v.st === 'unload') {
    refreshBookings(S);
    let free = BT.quay.cap - storeUsed(S, q) - (q._book || 0);
    for (let r = 0; r < NR && free > 0; r++) { const n = Math.min(v.own[r], free); if (n > 0) { q.inv[r] += n; v.own[r] -= n; free -= n; } }

      for (let r = 0; r < NR; r++) { v.ret[r] += v.own[r]; v.own[r] = 0; }   // gives up; goods return to the supplier

/* ==== 66_fleet.js ==== */
/* =====================================================================
   Fleet management: matching consignments with vehicles, reacting to
   network edits, buying, selling and scrapping.
   ===================================================================== */

function manh(S, a, b) { return Math.abs(a % S.W - b % S.W) + Math.abs(((a / S.W) | 0) - ((b / S.W) | 0)); }

function stepAssign(S) {
  // ---- trucks: one consignment per truck, nearest free truck by road distance
  const free = S.vehs.filter(v => v.k === 'truck' && !v.job && !v.cargo.length && (v.st === 'depot' || v.st === 'go' || v.st === 'hold'));
  const order = S.cons.filter(c => !c.veh && (c.st === 'wait' || c.st === 'xfer')).sort((a, b) => (a.pr | 0) - (b.pr | 0) || a.id - b.id);
  for (const c of order) {
    if (c.veh || (c.st !== 'wait' && c.st !== 'xfer')) continue;
    const L = c.legs[c.li]; if (!L || L[0] !== 'road') continue;
    const pick = bById(S, c.at); if (!pick) continue;
    const a = bAcc(S, pick); if (a < 0) { c.ob = 'Pickup point has no road access'; continue; }
    if (!free.length) { c.ob = 'Waiting for a truck: every truck is busy'; continue; }
    const dm = roadDist(S, a);
    let best = null, bd = 0;
    for (const v of free) {
      if (v.job) continue;
      const tt = truckTile(S, v); if (tt < 0) continue;
      const d = dm[tt]; if (d < 0) continue;
      if (!best || d < bd) { best = v; bd = d; }
    }
    if (!best) { c.ob = 'Waiting for a truck: none free on this road network'; continue; }
    best.job = { c: c.id, ph: 'pk', tgt: pick.id }; c.veh = best.id; c.ob = '';
    if (best.st === 'go') { const p = roadPath(S, best.t, a); best.path = p || []; }
    if (best.st === 'hold') best.hold = S.tick;
    dec(S, 2, best.id, c.id, bd);
  }
  // ---- trains and barges: group waiting consignments by (from, to)
  for (const mode of ['rail', 'water']) {
    const groups = new Map();
    for (const c of S.cons) {
      if (c.veh || c.st !== 'xfer') continue;
      const L = c.legs[c.li]; if (!L || L[0] !== mode) continue;
      const key = L[1] * 100000 + L[2];
      let g = groups.get(key); if (!g) { g = []; groups.set(key, g); } g.push(c);
    }
    for (const [key, list] of groups) {
      const a = bById(S, Math.floor(key / 100000)), b = bById(S, key % 100000); if (!a || !b) continue;
      let best = null, bd = 0;
      if (mode === 'rail') {
        const comp = railCompOf(S, a.y * S.W + a.x);
        for (const v of S.vehs) {
          if (v.k !== 'train' || v.job || v.cargo.length || (v.st !== 'idle' && v.st !== 'hold')) continue;
          if (railCompOf(S, v.tiles[0]) !== comp) continue;
          const d = v.at === a.id ? -1 : manh(S, v.tiles[0], a.y * S.W + a.x);
          if (!best || d < bd) { best = v; bd = d; }
        }
      } else {
        const ba = berths(S, a, 'barge'); if (!ba.length) continue;
        const comp = waterCompOf(S, ba[0]);
        for (const v of S.vehs) {
          if (v.k !== 'barge' || v.job || v.cargo.length || (v.st !== 'moor' && v.st !== 'hold')) continue;
          if (waterCompOf(S, v.t) !== comp) continue;
          const d = v.at === a.id ? -1 : manh(S, v.t, ba[0]);
          if (!best || d < bd) { best = v; bd = d; }
        }

      let room = mode === 'rail' ? best.cap : VT.barge.cap;

  }
}

/* ---------------- reacting to edits ---------------- */

}

  let prev = v.t;

}

}

function vehiclesBuildingGone(S, b, rep) {
  const acc = b._acc;
  for (const v of S.vehs.slice()) {
    if (v.k === 'truck') {
      if ((v.st === 'yard' || v.st === 'bay' || v.st === 'depot') && v.at === b.id) {
        if (v.st === 'depot' && !v.job && !v.cargo.length) {
          S.vehs.splice(S.vehs.indexOf(v), 1); v.dead = 1; earn(S, VT.truck.cost >> 1, 'refund');
          rep.push('Truck #' + v.id + ' sold with its depot'); continue;
        }
        v.t = (acc >= 0 && S.road[acc]) ? acc : b.y * S.W + b.x; v.path = [];
        v.st = S.road[v.t] ? 'hold' : 'stranded'; v.hold = S.tick;
        if (v.job && v.job.tgt === b.id && v.job.ph === 'pk') v.job = null;
        if (v.home === b.id) v.home = 0;
        if (v.job) truckReplanStatic(S, v);
        continue;
      }
      if (v.home === b.id) v.home = 0;
      if (v.st === 'go' && ((v.job && v.job.tgt === b.id) || !v.job)) truckReplan(S, v);
    } else if (v.k === 'train') {
      if (v.at === b.id) v.at = 0;
      if (v.job && (v.job.a === b.id || v.job.b === b.id)) { if (v.st === 'load' || v.st === 'unload') v.st = 'idle'; v.load = []; trainJobFail(S, v, 'station demolished'); }
    } else if (v.k === 'barge') {
      if (v.at === b.id && (v.st === 'moor' || v.st === 'load' || v.st === 'unload')) { v.at = 0; v.st = 'hold'; v.hold = S.tick; v.load = []; }

    } else if (v.k === 'freighter') {

}

/* ---------------- purchase, sale, scrapping ---------------- */
function buyVehicle(S, kind, bid) {

  const vt = VT[kind]; if (!vt || kind === 'freighter') return { ok: false, why: 'Cannot buy that' };
  if (!canPay(S, vt.cost)) return { ok: false, why: 'Not enough money (' + vt.cost + ')' };
  let v = null;
  if (kind === 'truck') { if (b.type !== 'depot') return { ok: false, why: 'Trucks are bought at a depot' }; if (bAcc(S, b) < 0) return { ok: false, why: 'The depot needs a road' }; v = newTruck(S, b); }

}

  if (v.k === 'freighter') return { ok: false, why: 'Freighters belong to the shipping line' };

/* ==== 70_main.js ==== */
/* =====================================================================

function step(S) {
  // scripted scenario actions are part of the state, so replays include them
  if (S.sched && S.sched.length) {
    while (S.sched.length && S.sched[0].at <= S.tick) { const e = S.sched.shift(); applyAction(S, e.a, 1); }
  }
  prepRsv(S);
  processDirty(S);
  stepWeather(S);
  if (S.tick % 50 === 7) stepLabour(S);
  if (S.tick % 10 === 3) stepPower(S);
  stepProduction(S);
  if (S.tick % 10 === 5) stepHouses(S);
  if (S.tick % 20 === 9) stepMarkets(S);
  stepForests(S);
  stepTrade(S);
  if (S.tick % 20 === 11) stepDispatch(S);
  if (S.tick % 10 === 1) stepAssign(S);
  stepLocks(S);
  stepTrains(S);
  stepTrucks(S);
  stepBoats(S);
  if (S.tick % TPD === 600) stepDaily(S);
  if (S.tick % 100 === 50) checkAlerts(S);

    case 'rail': res = buildRail(S, a.tiles); break;
    case 'canal': res = buildCanal(S, a.tiles); break;
    case 'power': res = buildPower(S, a.tiles); break;
    case 'signal': res = setSignal(S, a.t, a.d); break;
    case 'lock': res = buildLock(S, a.t); break;
    case 'place': res = placeBuilding(S, a.bt, a.x, a.y, a.rot | 0); break;

/* ---------------- replay ---------------- */
/* Restore snapshot text and re-apply the player's recorded actions

  const S = deserialize(snapText);

/* ---------------- ledger audit ---------------- */
function audit(S) {

    const st = BT[b.type].store;

      const n = b.inv[r] + b.out[r] + (b.exp ? b.exp[r] : 0);
      if (st) inS[r] += n; else inB[r] += n;
      if (b.inv[r] < 0 || b.out[r] < 0) issues.push('Negative stock of ' + RES[r].name + ' at ' + BT[b.type].name + ' #' + b.id);
      if (b.rsv[r] > (BT[b.type].out ? b.out[r] : b.inv[r])) issues.push('Reservation exceeds stock of ' + RES[r].name + ' at ' + BT[b.type].name + ' #' + b.id);
    }
  }

  }
  for (const b of S.blds) if (b.tr) for (const id of b.tr) { const c = cById(S, id); if (!c) { issues.push('Yard at #' + b.id + ' lists a missing consignment'); continue; } inT2[c.r] += c.q; if (where.has(id)) issues.push('Consignment #' + id + ' in two places'); where.set(id, 'b' + b.id); }

  return {
    fails, T, line,
    road: (x0, y0, x1, y1) => A({ type: 'road', tiles: line(x0, y0, x1, y1) }),
    rail: (pts) => { let path = []; for (let i = 0; i + 1 < pts.length; i++) { const seg = line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]); path = path.concat(i ? seg.slice(1) : seg); } return A({ type: 'rail', tiles: path }); },
    canal: (x0, y0, x1, y1) => A({ type: 'canal', tiles: line(x0, y0, x1, y1) }),
    power: (tiles) => A({ type: 'power', tiles }),
    lock: (x, y) => A({ type: 'lock', t: T(x, y) }),
    sig: (x, y, d) => A({ type: 'signal', t: T(x, y), d }),
    place: (bt, x, y, rot) => { const r = A({ type: 'place', bt, x, y, rot: rot | 0 }); return r.b || null; },
    buy: (vk, b, n) => { if (!b) { fails.push('buy ' + vk + ': building missing'); return; } for (let i = 0; i < (n || 1); i++) A({ type: 'buy', vk, b: b.id }); },
    trade: (r, n, imp) => A({ type: 'trade', imp: imp ? 1 : 0, r, n }),
    want: (b, r, n) => b ? A({ type: 'want', b: b.id, r, n }) : fails.push('want: building missing'),
    A,
  };
}
/* Fill land next to roads with houses inside a rectangle. */
function fillHouses(S, K, x0, y0, x1, y1, max, skip) {
  let n = 0;
  for (let y = y0; y <= y1 && n < max; y++) for (let x = x0; x <= x1 && n < max; x++) {
    const t = y * S.W + x;
    if (S.ter[t] !== T_LAND || S.bld[t] || S.road[t] || S.rail[t]) continue;
    if (skip && skip(x, y)) continue;
    let adj = false; for (let d = 0; d < 4; d++) { const m = nb(S, t, d); if (m >= 0 && S.road[m] && !isWater(S.ter[m])) adj = true; }
    if (!adj) continue;
    if (K.place('house', x, y, 0)) n++;
  }
  return n;
}

/* Stages of the Tidemark city. */
const TM_STAGES = ['town', 'harbour', 'farbank', 'railway', 'canal'];
function buildTidemark(S, upto, opts) {
  opts = opts || {};
  const K = builder(S), R_ = R;
  const sd = (b, r, n) => { if (b) seedStock(S, b, r, n); };
  const skip = opts.skip || [];
  const P = (name, bt, x, y, rot) => skip.indexOf(name) >= 0 ? null : K.place(bt, x, y, rot);
  const has = s => TM_STAGES.indexOf(s) <= TM_STAGES.indexOf(upto);
  S.flags.inf = 1;
  const keep = {};
  // ---- stage 1: the old town on the west bank
  K.road(18, 13, 18, 41); K.road(4, 24, 30, 24); K.road(4, 41, 17, 41);
  K.road(4, 30, 17, 30); K.road(4, 36, 17, 36); K.road(6, 25, 6, 40); K.road(12, 25, 12, 40);
  K.road(19, 30, 30, 30); K.road(19, 36, 30, 36); K.road(24, 25, 24, 40); K.road(30, 25, 30, 35);
  K.road(4, 12, 18, 12);
  keep.lh = P('lh', 'lighthouse', 2, 45, 0);
  keep.farm = P('farm', 'farm', 5, 22, 0);
  keep.mill = P('mill', 'mill', 19, 23, 0);
  keep.bakery = P('bakery', 'bakery', 21, 23, 0);
  keep.market = P('market', 'market', 13, 25, 0);
  keep.market2 = P('market2', 'market', 25, 31, 0);
  keep.depot = P('depot', 'depot', 15, 23, 0);
  keep.tide = P('tide', 'tidemill', 9, 43, 0);
  keep.forester = P('forester', 'forester', 6, 13, 0);
  keep.forester2 = P('forester2', 'forester', 10, 11, 0);
  keep.sawmill = P('sawmill', 'sawmill', 12, 10, 0);
  keep.joinery = P('joinery', 'joinery', 15, 11, 0);
  if (!opts.noHouses) {
    const lim = opts.houses || 999;
    const a = fillHouses(S, K, 4, 25, 17, 40, Math.min(62, lim), (x, y) => (x === 9 && y > 31 && y < 35));
    const b = fillHouses(S, K, 19, 25, 31, 40, Math.min(44, Math.max(0, lim - a)));
    fillHouses(S, K, 7, 22, 14, 23, Math.min(6, Math.max(0, lim - a - b)));
  }
  // back gardens: a few trees inside the town blocks
  for (let y = 25; y <= 40; y++) for (let x = 4; x <= 31; x++) {
    const t = y * S.W + x; if (S.ter[t] !== T_LAND || S.bld[t] || S.road[t]) continue;
    let adj = false; for (let d = 0; d < 4; d++) { const n = nb(S, t, d); if (n >= 0 && S.road[n]) adj = true; }
    if (!adj && ((x * 5 + y * 3) % 4 === 0)) S.tree[t] = 1 + ((x + y) % 2);
  }
  const pw = [];
  for (let t = 0; t < S.W * S.H; t++) { const x = t % S.W, y = (t / S.W) | 0; if (S.road[t] && x <= 31 && y >= 10 && !isWater(S.ter[t])) pw.push(t); }
  pw.push(K.T(9, 42), K.T(9, 41), K.T(10, 41), K.T(8, 41));
  K.power(pw);
  K.buy('truck', keep.depot, 8);
  sd(keep.market, R_.bread, 30); sd(keep.market2, R_.bread, 30);
  sd(keep.mill, R_.grain, 8);
  for (const st of TM_STAGES.slice(1)) if (has(st)) TM_STAGE_FN[st](S, K, keep, P, sd);
  S.flags.inf = 0;
  S.keep = {}; for (const k in keep) if (keep[k]) S.keep[k] = keep[k].id;
  return K.fails;
}

/* Sandbox: procedural coast, empty land, a lighthouse. */
function buildSandbox(S, opts) {
  genTerrain(S, { coastAt: 0.74, estuary: opts.estuary !== false, estuaryX: Math.floor(S.W * 0.58), deposits: [] });
  const gen = makeGen(S.seed ^ 0xBEEF);
  const pick = (kind, tries) => { for (let i = 0; i < tries; i++) { const x = 4 + gen.int(S.W - 8), y = 3 + gen.int(Math.floor(S.H * 0.55)); if (S.ter[y * S.W + x] === T_LAND) { stamp(S, kind, x, y, 2, gen); return; } } };
  pick(D_COAL, 50); pick(D_COAL, 50); pick(D_ORE, 50); pick(D_ORE, 50); pick('forest', 50); pick('fertile', 50); pick('fertile', 50);
  for (let t = S.W * S.H - 1; t >= 0; t--) {
    if (S.ter[t] !== T_LAND) continue;
    let coast = false; for (let d = 0; d < 4; d++) { const n = nb(S, t, d); if (n >= 0 && S.ter[n] === T_SEA) coast = true; }
    if (coast) { const r = placeBuilding(S, 'lighthouse', t % S.W, (t / S.W) | 0, 0, true); if (r.ok) break; }
  }
  S.money = opts.money || 25000; if (opts.inf) S.flags.inf = 1;
}

/* Apply one later stage to a running game as ordinary paid player actions
   (used by the campaign playthrough tests). Returns failures. */
function playStage(S, stage) {
  const K = builder(S, 0), keep = {};
  for (const k in (S.keep || {})) keep[k] = bById(S, S.keep[k]);
  for (const b of S.blds) { if (b.type === 'quay' && !keep.quay) keep.quay = b; }
  TM_STAGE_FN[stage](S, K, keep, (name, bt, x, y, rot) => K.place(bt, x, y, rot), () => {});
  for (const k in keep) if (keep[k]) S.keep[k] = keep[k].id;
  return K.fails;
}

const T_AT = (d, h, m) => d * TPD + h * TPH + Math.floor((m || 0) * TPH / 60);
function cnt(S, type, f) { let n = 0; for (const b of S.blds) if (b.type === type && (!f || f(b))) n++; return n; }
function sinceStart(S, key, r) {
  const b = S.scen.base;
  if (key === 'ledExp') return S.led.exp[r] - b.ledExp[r];
  if (key === 'ledProd') return S.led.prod[r] - b.ledProd[r];
  return S[key][r] - b[key][r];
}
function housesAt(S, lvl) { let n = 0; for (const b of S.blds) if (b.type === 'house' && b.lvl >= lvl) n++; return n; }
function estuaryRoad(S) { for (let t = 0; t < S.W * S.H; t++) { const x = t % S.W; if ((x === 33 || x === 34) && S.ter[t] === T_SEA && S.road[t]) { const a = rcOf(S, (t / S.W | 0) * S.W + 31), b = rcOf(S, (t / S.W | 0) * S.W + 36); if (a >= 0 && a === b) return true; } } return false; }
function railLinked(S) {
  const st = S.blds.filter(b => BT[b.type].node === 'rail');
  for (let i = 0; i < st.length; i++) for (let j = 0; j < st.length; j++) if (i !== j && st[i].x < 33 && st[j].x > 34 && railStationDist(S, st[j], st[i]) >= 0) return true;
  return false;
}

const PT = { down: new Map(), mode: null, start: null, moved: false, line: null, rect: null, pinch: null, touch: false, placeAt: null };

}
function lineGhost() {

}
function rectTiles() {
  const S = G.S, R2 = PT.rect, x0 = Math.min(R2.a[0], R2.b[0]), x1 = Math.max(R2.a[0], R2.b[0]), y0 = Math.min(R2.a[1], R2.b[1]), y1 = Math.max(R2.a[1], R2.b[1]);

    }
